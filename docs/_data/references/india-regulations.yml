  # CERT-In Directions under section 70B(6) of the IT Act 2000 (No. 20(3)/2022-CERT-In,
  # 28 April 2022).

  cert-in-directions-2022-ii:
    title: "CERT-In Directions 2022 (ii) - Report cyber incidents within 6 hours, including attacks on AI/ML systems"
    url: https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf
    issuer: CERT-In
    description: >
      Annexure I lists the reportable incident types, including data breach, data leak, unauthorised
      access, and attacks or malicious activity affecting applications related to Artificial
      Intelligence and Machine Learning (item xx).

  cert-in-directions-2022-iv:
    title: "CERT-In Directions 2022 (iv) - Enable logs of all ICT systems and keep them for 180 days in India"
    url: https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf
    issuer: CERT-In

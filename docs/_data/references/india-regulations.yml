title: "India Financial Services AI Regulations"
description: "Indian regulatory references relevant to AI governance in financial services, covering the RBI FREE-AI framework, the Digital Personal Data Protection Act 2023 and Rules 2025, and CERT-In's cyber incident directions."
source_url: "https://www.rbi.org.in/Scripts/FS_Publications.aspx?id=1306"
lens: obligation

entries:
  # RBI FREE-AI Committee report (13 August 2025). Recommendations to RBI-regulated
  # entities (REs); committee recommendations, not a binding direction.

  rbi-free-ai-2025-rec-14:
    title: "RBI FREE-AI (2025) Recommendation 14 - Board-approved AI policy"
    url: https://www.rbi.org.in/Scripts/FS_Publications.aspx?id=1306
    issuer: RBI
    description: >
      REs should establish a board-approved AI policy covering governance structure,
      accountability, risk appetite, operational safeguards, auditability, AI disclosures and
      liability. Paragraph 4.4.44 asks for a low/medium/high risk classification of AI use cases.

  rbi-free-ai-2025-rec-15:
    title: "RBI FREE-AI (2025) Recommendation 15 - Data lifecycle governance"
    url: https://www.rbi.org.in/Scripts/FS_Publications.aspx?id=1306
    issuer: RBI
    description: >
      Data governance controls for AI covering collection, access, usage, retention and deletion,
      in compliance with the DPDP Act. Paragraph 4.4.47 asks for guardrails, especially when using
      open source or external AI models, so that sensitive data remains within secure environments
      under the institution's control.

  rbi-free-ai-2025-rec-16:
    title: "RBI FREE-AI (2025) Recommendation 16 - AI system governance framework"
    url: https://www.rbi.org.in/Scripts/FS_Publications.aspx?id=1306
    issuer: RBI
    description: >
      Model governance across the lifecycle, including monitoring for drift and degradation, and
      strong governance with human oversight before deploying autonomous AI systems. Paragraph
      4.4.48 covers detection of drift, bias and unexplained behaviour; paragraph 4.4.49 requires
      REs to define the tasks AI can perform autonomously and when human oversight is required.

  rbi-free-ai-2025-rec-20:
    title: "RBI FREE-AI (2025) Recommendation 20 - Red teaming"
    url: https://www.rbi.org.in/Scripts/FS_Publications.aspx?id=1306
    issuer: RBI
    description: >
      Structured, risk-proportionate red teaming across the AI lifecycle. Paragraph 4.4.60 sets at
      least semi-annual red teaming for medium- and high-risk applications and before major model
      updates.

  rbi-free-ai-2025-rec-21:
    title: "RBI FREE-AI (2025) Recommendation 21 - Business continuity plan for AI systems"
    url: https://www.rbi.org.in/Scripts/FS_Publications.aspx?id=1306
    issuer: RBI
    description: >
      BCP frameworks extended to AI model-specific performance degradation, with fallback
      mechanisms tested through BCP drills.

  rbi-free-ai-2025-rec-22:
    title: "RBI FREE-AI (2025) Recommendation 22 - AI incident reporting"
    url: https://www.rbi.org.in/Scripts/FS_Publications.aspx?id=1306
    issuer: RBI
    description: >
      Recommends that financial sector regulators establish a dedicated AI incident reporting
      framework for REs and FinTechs. Paragraph 4.4.63 lists
      example incidents, including AI agents acting beyond their intended scope.

  rbi-free-ai-2025-rec-23:
    title: "RBI FREE-AI (2025) Recommendation 23 - AI inventory"
    url: https://www.rbi.org.in/Scripts/FS_Publications.aspx?id=1306
    issuer: RBI
    description: >
      An internal AI inventory of models, use cases, dependencies, risks and grievances, updated at
      least half-yearly. Paragraph 4.4.68 includes third-party providers and other external
      components that can influence model performance.


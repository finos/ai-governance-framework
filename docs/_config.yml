title: FINOS AI Readiness - AI Governance Framework

version: v2
release-date: 2025-10-20

risk_type_labels:
  RC: Regulatory and Compliance
  OP: Operational
  SEC: Security

mitigation_type_labels:
  PREV: Preventative
  DET: Detective

# Domains proposed in #398, in display order
risk_domain_labels:
  components: Components
  inputs: Inputs
  leakage: Leakage
  accuracy: Accuracy
  alignment: Alignment
  agency: Agency
  vendor: Vendor
  liability: Liability

mitigation_domain_labels:
  sourcing: Sourcing
  filtering: Filtering
  data: Data
  access: Access
  evaluation: Evaluation
  oversight: Oversight
  monitoring: Monitoring

# Bootstrap Icons for the domain headings on the front page
risk_domain_icons:
  components: bi-boxes
  inputs: bi-box-arrow-in-right
  leakage: bi-droplet
  accuracy: bi-bullseye
  alignment: bi-compass
  agency: bi-robot
  vendor: bi-building
  liability: bi-briefcase

mitigation_domain_icons:
  sourcing: bi-box-seam
  filtering: bi-funnel
  data: bi-database
  access: bi-key
  evaluation: bi-clipboard-check
  oversight: bi-person-check
  monitoring: bi-activity

# Front matter fields shown as tags on each risk and mitigation page.
# Display names come from <risk|mitigation>_<field>_labels above, if that map exists.
risk_tags: [type, domain]
mitigation_tags: [type, domain]

usecase_categories:
  - Customer_Experience_and_Engagement
  - Risk_Management_and_Compliance
  - Operations_and_Process_Optimization
  - Trading_and_Investment
  - Data_Intelligence_and_Analytics
  - Fraud_Detection_and_Security

usecase_order:
  - Customer_Experience_and_Engagement
  - Risk_Management_and_Compliance
  - Operations_and_Process_Optimization
  - Trading_and_Investment
  - Data_Intelligence_and_Analytics
  - Fraud_Detection_and_Security

document_status:
  - name: Pre-Draft
    description: "Initial brainstorming or collection of ideas, notes, and outlines. The document is not yet formally written."
  - name: Draft
    description: "The document is in the early stages of development, with content being written and structured but not yet polished."
  - name: Working-Group-Approved
    description: "The document is in its final form and has been approved by the AIGF team."
  - name: Approved-Specification
    description: "The publication of an Approved Specification in a publicly accessible manner."

# FFIEC IT Booklet abbreviations mapping
ffiec_itbooklet_abbreviations:
  architecture-infrastructure-and-operations: aio
  archived-booklets: arc
  audit: aud
  business-continuity-management: bcm
  development-acquisition-and-maintenance: dam
  information-security: sec
  management: mgt
  outsourcing-technology-services: ots
  retail-payment-systems: rps
  supervision-of-technology-service-providers: tsp
  wholesale-payment-systems: wps

collections:
  risks:
    output: true
  mitigations:
    output: true
  usecases:
    output: true
    permalink: /usecase/:name/

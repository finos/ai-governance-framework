# Generated by `lokf adapt` from ai_governance_framework.yaml (ai_governance_framework v3); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/ai-governance-framework-lokf
name: ai-governance-framework
title: FINOS AI Governance Framework
description: 'A LinkML model of the FINOS AI Governance Framework: its risks, mitigations and use cases,
  the reference files they cite, and the data files beside them. Each class keeps FINOS''s keys and values,
  so FINOS''s files are the test data.'
version: v3
source: https://github.com/finos/ai-governance-framework/tree/67b8c3257695d5ede09d262798bf28a0e58d4740
license: Apache-2.0
keywords:
- AI governance
- AI risk
- financial services
- FINOS
see_also:
- https://lmodel.github.io/ai-governance-framework
- https://air-governance-framework.finos.org/
- https://github.com/finos/ai-governance-framework
annotations:
  upstream_commit: 67b8c3257695d5ede09d262798bf28a0e58d4740
  upstream_release_date: '2026-10-26'
  upstream_license: CC-BY-4.0
comments:
- FINOS tags no v3 release, so the version is the one docs/_config.yml states and the source is the commit
  that merged it. scripts/check_upstream_release.py reports a new tag, or main changing a path this schema
  reads.
- JSON Schema generation turns a hyphen in a slot name or an alias into an underscore, so doc-status cannot
  be a key of the generated schema, and a key named type would project as a false rdf:type. Each slot
  that differs from FINOS's key lists that key under aliases. scripts/build_catalogue.py renames by that
  list and adds item_id and source_file, which FINOS's file name states, and tests/test_upstream_tree.py
  shows that the renaming is one to one. A reference file needs no renaming.
prefixes:
  ai_governance_framework: https://w3id.org/lmodel/ai-governance-framework/
  airo: https://w3id.org/airo#
  linkml: https://w3id.org/linkml/
  nexus: https://w3id.org/ai-atlas-nexus/
  nist_ai_600_1: https://w3id.org/lmodel/nist-ai-600-1/
  nist_sp_800_53: https://w3id.org/lmodel/nist-sp-800-53/
  schema: http://schema.org/
default_prefix: ai_governance_framework
default_range: string
imports:
- linkml:types
- lokf
classes:
  AigfCatalogue:
    description: One edition of the framework, as the facts FINOS's front matter and data files state.
    comments:
    - The bodies of the risk, mitigation and use case pages stay in FINOS's files, which source_file names.
      The catalogue names each reference file's entries by key and leaves their titles there.
    slots:
    - title
    - aigf_version
    - release_date
    - source_commit
    - reference_lenses
    - reference_indexes
    - risks
    - mitigations
    - use_cases
    - financial_data_classification
    - ai_use_cases
    - cross_cutting_capabilities
    - ai_deployment_model_taxonomy
    slot_usage:
      title:
        required: true
        range: string
      aigf_version:
        required: true
      release_date:
        required: true
      source_commit:
        required: true
      risks:
        required: true
      mitigations:
        required: true
  AigfItem:
    abstract: true
    description: A page of the framework that its front matter describes and that others cite by identifier.
    slots:
    - id
    - sequence
    - title
    - layout
    - doc_status
    - source_file
    slot_usage:
      title:
        required: true
        range: string
    is_a: Concept
  AigfReferenceCitations:
    mixin: true
    description: The entries of FINOS's reference files that a page cites, one list for each file.
    slots:
    - atr_references
    - canada_regulations_references
    - eu_ai_act_references
    - ffiec_itbooklets_references
    - iosco_supervisory_toolkit_references
    - iso_42001_references
    - nist_ai_600_1_references
    - nist_sp_800_53r5_references
    - owasp_asi_references
    - owasp_llm_references
    - owasp_ml_references
    - sr11_7_references
    - uk_regulations_references
  AigfRisk:
    is_a: AigfItem
    mixins:
    - AigfReferenceCitations
    description: A risk the framework names, from a file under docs/_risks/.
    close_mappings:
    - airo:Risk
    slots:
    - risk_type
    - risk_domain
    - related_risks
    slot_usage:
      id: {}
      layout:
        equals_string: risk
      source_file:
        pattern: ^docs/_risks/ri-[1-9][0-9]*_[a-z0-9-]+[.]md$
  AigfMitigation:
    is_a: AigfItem
    mixins:
    - AigfReferenceCitations
    description: A mitigation the framework names, from a file under docs/_mitigations/.
    comments:
    - 'CONVENTIONS.md makes the link one way: a mitigation lists the risks it mitigates, and a risk does
      not list its mitigations.'
    close_mappings:
    - airo:RiskControl
    related_mappings:
    - nexus:Action
    slots:
    - mitigation_type
    - mitigation_domain
    - mitigates
    - related_mitigations
    slot_usage:
      id: {}
      layout:
        equals_string: mitigation
      source_file:
        pattern: ^docs/_mitigations/mi-[1-9][0-9]*_[a-z0-9-]+[.]md$
  AigfUseCase:
    is_a: AigfItem
    mixins:
    - AigfReferenceCitations
    description: A worked use case with its risks, mitigations and data, from a file under docs/_usecases/.
    slots:
    - category
    - description
    - end_user
    - business_value
    - related_risks
    - related_mitigations
    - data_classifications
    - data_handling_aspects
    - regulatory_concerns
    - further_reading
    slot_usage:
      id: {}
      layout:
        equals_string: usecase
      source_file:
        pattern: ^docs/_usecases/uc-[1-9][0-9]*_[a-z0-9-]+[.]md$
      description:
        required: true
        range: string
  AigfDataClassificationUse:
    description: A data classification a use case handles, with the kinds of data it holds under it.
    slots:
    - aigf_name
    - data_types
    slot_usage:
      aigf_name:
        description: The name of a classification in docs/_data/data_classification.yml.
  AigfRegulatoryReference:
    description: A regulation or guideline named by its title and address, with where it applies.
    slots:
    - aigf_name
    - aigf_url
    - jurisdiction
  AigfFurtherReading:
    description: A paper or article a use case points to.
    slots:
    - aigf_name
    - aigf_url
    - aigf_source
  AigfDataClassification:
    description: A class of financial data with its sensitivity and its handling, from docs/_data/data_classification.yml.
    slots:
    - aigf_name
    - sensitivity
    - description
    - examples
    - storage_location
    - regulations
    - aigf_references
    slot_usage:
      sensitivity:
        required: true
      description:
        required: true
        range: string
    is_a: Concept
  AigfReferenceLens:
    description: How the site presents the reference files of one lens, from reference_lenses in docs/_config.yml.
    slots:
    - lens
    - label
    - question
    - icon
    - color
    slot_usage:
      lens:
        required: true
      label:
        required: true
      question:
        required: true
  AigfReferenceFile:
    description: One file under docs/_data/references/, which lists the citable entries of one regulation,
      framework or standard.
    comments:
    - These rules are the ones scripts/validate-references.py states, except that superseded_by resolving
      within the file and entries not being empty are held by tests/test_upstream_tree.py. No generator
      writes either.
    slots:
    - title
    - description
    - source_url
    - lens
    - entries
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: string
      lens:
        required: true
      entries:
        required: true
  AigfReferenceEntry:
    description: One citable item of a reference file, under the key a page cites it by.
    slots:
    - reference_key
    - title
    - aigf_url
    - description
    - issuer
    - booklet_abbrev
    - superseded_by
    slot_usage:
      title:
        required: true
        range: string
      aigf_url:
        required: true
      description:
        range: string
  AigfReferenceIndex:
    description: The keys one reference file holds, so that a catalogue's citations resolve within it.
    slots:
    - reference_file
    - lens
    - entry_keys
    slot_usage:
      lens:
        required: true
  AigfUseCaseDomain:
    description: A top level of the use case taxonomy in docs/_data/ai_use_cases.yml.
    slots:
    - aigf_name
    - use_case_areas
  AigfUseCaseArea:
    description: A second level of the use case taxonomy, with the use cases under it.
    slots:
    - aigf_name
    - use_case_names
  AigfDeploymentAxis:
    description: One axis of the deployment model taxonomy in docs/_data/ai_deployment_model.yml.
    slots:
    - aigf_name
    - options
  AigfDeploymentOption:
    description: One option on an axis of the deployment model taxonomy.
    slots:
    - aigf_name
    - description
    slot_usage:
      description:
        range: string
slots:
  aigf_version:
    description: The edition, as docs/_config.yml writes it.
    slot_uri: ai_governance_framework:version
    aliases:
    - version
  release_date:
    aliases:
    - release-date
    range: date
    description: The edition's date, as docs/_config.yml writes it.
  source_commit:
    pattern: ^[0-9a-f]{40}$
    description: The commit of FINOS's repository the catalogue was read from.
  reference_lenses:
    multivalued: true
    inlined_as_list: true
    range: AigfReferenceLens
    description: The lenses docs/_config.yml configures.
  reference_indexes:
    multivalued: true
    inlined_as_list: true
    range: AigfReferenceIndex
    description: The keys of each reference file.
  risks:
    multivalued: true
    inlined_as_list: true
    range: AigfRisk
    description: The risks of the edition.
  mitigations:
    multivalued: true
    inlined_as_list: true

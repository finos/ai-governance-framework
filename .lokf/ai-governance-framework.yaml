    description: The use cases under an area, as the taxonomy names them.
  options:
    multivalued: true
    inlined_as_list: true
    range: AigfDeploymentOption
    description: The options on an axis.
enums:
  AigfDocumentStatus:
    description: How far a page has been approved, from document_status in docs/_config.yml.
    permissible_values:
      Pre-Draft:
        description: Initial brainstorming or collection of ideas, notes, and outlines. The document is
          not yet formally written.
      Draft:
        description: The document is in the early stages of development, with content being written and
          structured but not yet polished.
      Working-Group-Approved:
        description: The document is in its final form and has been approved by the AIGF team.
      Approved-Specification:
        description: The publication of an Approved Specification in a publicly accessible manner.
  AigfRiskType:
    description: A risk's group, from risk_type_labels in docs/_config.yml.
    permissible_values:
      RC:
        title: Regulatory and Compliance
      OP:
        title: Operational
      SEC:
        title: Security
  AigfMitigationType:
    description: A mitigation's group, from mitigation_type_labels in docs/_config.yml.
    comments:
    - templates-for-ri-md/mi-template.md also offers RESP, for Response, which docs/_config.yml does not
      list and no mitigation uses.
    permissible_values:
      PREV:
        title: Preventative
      DET:
        title: Detective
  AigfRiskDomain:
    description: A risk's domain, from risk_domain_labels in docs/_config.yml.
    permissible_values:
      components:
        title: Components
      inputs:
        title: Inputs
      leakage:
        title: Leakage
      accuracy:
        title: Accuracy
      alignment:
        title: Alignment
      agency:
        title: Agency
      vendor:
        title: Vendor
      liability:
        title: Liability
  AigfMitigationDomain:
    description: A mitigation's domain, from mitigation_domain_labels in docs/_config.yml.
    permissible_values:
      sourcing:
        title: Sourcing
      filtering:
        title: Filtering
      data:
        title: Data
      access:
        title: Access
      evaluation:
        title: Evaluation
      oversight:
        title: Oversight
      monitoring:
        title: Monitoring
  AigfUseCaseCategory:
    description: A use case's category, from usecase_categories in docs/_config.yml.
    permissible_values:
      Customer_Experience_and_Engagement:
        title: Customer Experience and Engagement
      Risk_Management_and_Compliance:
        title: Risk Management and Compliance
      Operations_and_Process_Optimization:
        title: Operations and Process Optimization
      Trading_and_Investment:
        title: Trading and Investment
      Data_Intelligence_and_Analytics:
        title: Data Intelligence and Analytics
      Fraud_Detection_and_Security:
        title: Fraud Detection and Security
      Risk_and_Compliance:
        title: Risk and Compliance
        description: A category uc-3 and uc-4 use. docs/_config.yml does not list it, though docs/_data/ai_use_cases.yml
          has a domain of this name.
  AigfSensitivity:
    description: How sensitive a class of data is, as docs/_data/data_classification.yml grades it.
    permissible_values:
      Low: {}
      Medium: {}
      High: {}
      Critical: {}
  AigfLens:
    description: The question a reference file answers, from docs/_data/references/README.md.
    permissible_values:
      threat:
        description: What is this called elsewhere?
      obligation:
        description: Which rule requires me to address it?
      control:
        description: How do I implement and evidence it?
  AigfDataHandling:
    description: The options of the deployment model's data_handling axis.
    permissible_values:
      Centralized: {}
      Federated: {}
      Synthetic_Data: {}
      Privacy_Preserving: {}
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: AigfItem, AigfDataClassification; dropped
  for LOKF''s: item_id; renamed, IRIs unchanged: version -> aigf_version, name -> aigf_name, url -> aigf_url,
  source -> aigf_source, references -> aigf_references; folded into LOKF''s: title -> title, description
  -> description.'

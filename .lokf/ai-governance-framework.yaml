    description: The options of the deployment model's data_handling axis a use case takes.
  regulatory_concerns:
    multivalued: true
    inlined_as_list: true
    range: AigfRegulatoryReference
    description: The regulations a use case raises.
  further_reading:
    multivalued: true
    inlined_as_list: true
    range: AigfFurtherReading
    description: The papers and articles a use case points to.
  atr_references:
    multivalued: true
    description: Keys of docs/_data/references/atr.yml.
  canada_regulations_references:
    aliases:
    - canada-regulations_references
    multivalued: true
    description: Keys of docs/_data/references/canada-regulations.yml.
  eu_ai_act_references:
    aliases:
    - eu-ai-act_references
    multivalued: true
    description: Keys of docs/_data/references/eu-ai-act.yml.
  ffiec_itbooklets_references:
    aliases:
    - ffiec-itbooklets_references
    multivalued: true
    description: Keys of docs/_data/references/ffiec-itbooklets.yml.
  iosco_supervisory_toolkit_references:
    aliases:
    - iosco-supervisory-toolkit_references
    multivalued: true

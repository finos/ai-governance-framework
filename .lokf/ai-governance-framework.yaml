  regulations:
    description: The regulations that apply to a class of data, written as FINOS writes them.
  aigf_references:
    multivalued: true
    inlined_as_list: true
    range: AigfRegulatoryReference
    description: The regulations and guidelines a class of data cites.
    slot_uri: ai_governance_framework:references
    aliases:
    - references
  lens:

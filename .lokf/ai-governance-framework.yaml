    required: true
    range: AigfMitigationDomain
    description: The domain a mitigation belongs to.
  related_risks:
    multivalued: true
    range: AigfRisk
    description: The risks a page relates to.
  related_mitigations:
    multivalued: true
    range: AigfMitigation
    description: The mitigations a page relates to.
  mitigates:
    required: true

    description: Which question a reference file answers for a page.
  label:
    description: The lens's display name.
  question:
    description: The question the lens answers.
  icon:
    description: The Bootstrap Icons class the site shows beside the lens.
  color:
    description: The Bootstrap theme colour the site gives the lens.
  source_url:
    description: The address the file was generated from, or a canonical index page.
  entries:
    multivalued: true
    inlined: true
    range: AigfReferenceEntry
    description: The file's citable items, keyed by the key a page cites them by.
  reference_key:
    key: true
    description: The stable key a page cites the entry by.
  issuer:
    description: The body that issued the entry.
  booklet_abbrev:
    description: The abbreviation of the FFIEC booklet the entry belongs to.
  superseded_by:
    description: The key of the entry in the same file that replaces this one in a newer edition.
  reference_file:
    required: true
    description: The reference file's stem.
  entry_keys:
    multivalued: true
    description: The keys the reference file holds.
  use_case_areas:
    multivalued: true
    inlined_as_list: true
    range: AigfUseCaseArea
    description: The areas under a domain.
  use_case_names:

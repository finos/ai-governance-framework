<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t d">
  <title id="t">Knowledge Trust Ladder</title>
  <desc id="d">A ladder rising out of an open book. The book is green: knowledge an agent derived. The lowest rung is grey, a draft nobody has checked; the next is amber, checked by automation; the top rung is a blue check mark, confirmed by a named person. The same four colours the diagrams use.</desc>
  <!-- Canvas: the calmest layer, and the largest, so the mark does not glare. -->
  <rect width="64" height="64" rx="12" fill="#1C1C1A"/>
  <!-- The mark. Every diagram carries a copy of this group; keep them identical. -->
  <g id="ktl-mark">
    <!-- Rails: structure, so they recede and the draft rung stands apart. -->
    <rect x="17.5" y="12" width="4.5" height="38" rx="2.25" fill="#6E6D66"/>
    <rect x="42" y="12" width="4.5" height="38" rx="2.25" fill="#6E6D66"/>
    <!-- Trust: a draft, then checked by automation. -->
    <rect x="17.5" y="38" width="29" height="5" rx="2.5" fill="#ABA9A0"/>
    <rect x="17.5" y="28.5" width="29" height="5" rx="2.5" fill="#E4BD6E"/>
    <!-- The top rung is the check: a named person vouches. The halo lifts it off the rails. -->
    <path d="M20 16 L29.5 23.5 L49.5 6.5" fill="none" stroke="#1C1C1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 16 L29.5 23.5 L49.5 6.5" fill="none" stroke="#93C0F2" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Knowledge: the open book the ladder stands in. -->
    <path d="M32 49.5 C26 45 15 45 6.5 47.5 v9.5 C15 54.5 26 54.5 32 59 C38 54.5 49 54.5 57.5 57 v-9.5 C49 45 38 45 32 49.5 z" fill="#23301B" stroke="#6FA33F" stroke-width="1.7" stroke-linejoin="round"/>
    <line x1="32" y1="49.5" x2="32" y2="59" stroke="#6FA33F" stroke-width="1.7"/>
    <path d="M11 50.6 C16 49.6 22 49.8 27 51.6 M37 51.6 C42 49.8 48 49.6 53 50.6" fill="none" stroke="#6FA33F" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>

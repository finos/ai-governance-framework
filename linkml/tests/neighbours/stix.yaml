    any_of:
    - slot_conditions:
        extensions:
          required: true
    - slot_conditions:
        is_hidden:
          required: true
    - slot_conditions:
        pid:
          required: true
    - slot_conditions:
        created_time:
          required: true
    - slot_conditions:
        cwd:
          required: true
    - slot_conditions:
        command_line:
          required: true
    - slot_conditions:
        environment_variables:

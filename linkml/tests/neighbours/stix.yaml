    close_mappings:
    - uco-observable:AutonomousSystem
  StixDirectory:
    description: The Directory Object represents the properties common to a file system directory.
    is_a: StixCyberObservableObject
    slots:
    - path
    - path_enc
    - ctime
    - mtime
    - atime
    - contains_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: directory
      path:
        required: true
      contains_refs:
        range: StixCyberObservableObject
        any_of:
        - range: StixFile
        - range: StixDirectory
        pattern: ^(file|directory)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    annotations:
      stix_type: directory
    close_mappings:
    - uco-observable:Directory
  StixDomainName:
    description: The Domain Name represents the properties of a network domain name.
    is_a: StixCyberObservableObject
    slots:
    - value
    - resolves_to_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: domain-name
      value:
        required: true
      resolves_to_refs:
        range: StixCyberObservableObject
        any_of:
        - range: StixIpv4Address
        - range: StixIpv6Address
        - range: StixDomainName
        pattern: ^(ipv4-addr|ipv6-addr|domain-name)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    annotations:
      stix_type: domain-name
    close_mappings:
    - uco-observable:DomainName
  StixEmailAddress:
    description: The Email Address Object represents a single email address.
    is_a: StixCyberObservableObject
    slots:
    - value
    - display_name
    - belongs_to_ref
    slot_usage:
      id: {}
      stix_type:
        equals_string: email-addr
      value:
        required: true
    annotations:

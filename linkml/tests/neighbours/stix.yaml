      denial-of-service: {}
      exploitation: {}
      information-gathering: {}
      network-capture: {}
      credential-exploitation: {}
      remote-access: {}
      vulnerability-scanning: {}
      unknown: {}
  StixWindowsIntegrityLevel:
    description: 'Windows integrity levels. A closed enumeration: no other value is valid.'
    annotations:
      stix_vocabulary: windows-integrity-level-enum
      stix_section: '10.27'
    permissible_values:
      low: {}
      medium: {}
      high: {}
      system: {}
  StixWindowsPeBinaryType:
    description: 'Types of Windows PE binary. An open vocabulary: a slot that names it also takes any
      other string.'
    annotations:
      stix_vocabulary: windows-pebinary-type-ov
      stix_section: '10.28'
    permissible_values:
      dll: {}
      exe: {}
      sys: {}
  StixWindowsRegistryDatatype:
    description: 'Data types of a Windows registry value. A closed enumeration: no other value is valid.'
    annotations:
      stix_vocabulary: windows-registry-datatype-enum
      stix_section: '10.29'
    permissible_values:
      REG_NONE: {}
      REG_SZ: {}
      REG_EXPAND_SZ: {}
      REG_BINARY: {}
      REG_DWORD: {}
      REG_DWORD_BIG_ENDIAN: {}
      REG_DWORD_LITTLE_ENDIAN: {}
      REG_LINK: {}
      REG_MULTI_SZ: {}
      REG_RESOURCE_LIST: {}
      REG_FULL_RESOURCE_DESCRIPTION: {}
      REG_RESOURCE_REQUIREMENTS_LIST: {}
      REG_QWORD: {}
      REG_INVALID_TYPE: {}
  StixWindowsServiceStartType:
    description: 'Start types of a Windows service. A closed enumeration: no other value is valid.'
    annotations:
      stix_vocabulary: windows-service-start-type-enum
      stix_section: '10.30'
    permissible_values:
      SERVICE_AUTO_START: {}
      SERVICE_BOOT_START: {}
      SERVICE_DEMAND_START: {}
      SERVICE_DISABLED: {}
      SERVICE_SYSTEM_ALERT: {}
  StixWindowsServiceType:
    description: 'Types of Windows service. A closed enumeration: no other value is valid.'
    annotations:
      stix_vocabulary: windows-service-type-enum
      stix_section: '10.31'
    permissible_values:
      SERVICE_KERNEL_DRIVER: {}
      SERVICE_FILE_SYSTEM_DRIVER: {}
      SERVICE_WIN32_OWN_PROCESS: {}
      SERVICE_WIN32_SHARE_PROCESS: {}
  StixWindowsServiceStatus:
    description: 'Statuses of a Windows service. A closed enumeration: no other value is valid.'
    annotations:
      stix_vocabulary: windows-service-status-enum
      stix_section: '10.32'
    permissible_values:
      SERVICE_CONTINUE_PENDING: {}
      SERVICE_PAUSE_PENDING: {}
      SERVICE_PAUSED: {}
      SERVICE_RUNNING: {}
      SERVICE_START_PENDING: {}
      SERVICE_STOP_PENDING: {}
      SERVICE_STOPPED: {}
  StixSpecVersion:
    description: The STIX versions that an object may declare. The JSON schemas accept 2.0 beside 2.1.
      A closed enumeration.
    permissible_values:
      '2.0': {}
      '2.1': {}
  StixTlpLevel:
    description: The four levels of the Traffic Light Protocol (TLP) that STIX 2.1 defines marking definitions
      for. A closed enumeration.
    annotations:
      stix_section: 7.2.1.4
    permissible_values:
      white: {}
      green: {}
      amber: {}
      red: {}
  StixMarkingDefinitionType:
    description: The marking definition types that STIX 2.1 defines, statement and tlp. A slot that names
      it also takes any other string, as the JSON schemas do.
    annotations:
      stix_section: 7.2.1
    permissible_values:
      statement: {}
      tlp: {}
slots:
  stix_type:
    range: string
    required: true
    pattern: ^([a-z][a-z0-9]*)+(-[a-z0-9]+)*\-?$
    description: The STIX type name of the object, such as attack-pattern. Each class pins its own.
    slot_uri: stix:type
    aliases:
    - type
  spec_version:
    description: The version of the STIX specification used to represent the object.
    range: StixSpecVersion
    slot_uri: stix:spec_version
  object_marking_refs:
    description: References to the marking definitions that apply to the object.
    range: StixMarkingDefinition
    pattern: ^marking-definition--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:object_marking_refs
    close_mappings:
    - uco-core:objectMarking
  granular_markings:
    description: The granular markings that apply to parts of the object.
    range: StixGranularMarking
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: stix:granular_markings
  extensions:
    description: The object's extensions, as a dictionary keyed by extension name.
    range: StixExtensions
    inlined: true
    slot_uri: stix:extensions
  created_by_ref:
    description: A reference to the identity of the object's creator.
    range: StixIdentity
    pattern: ^identity--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:created_by_ref
    close_mappings:
    - uco-core:createdBy
  stix_created:
    description: The time at which the object, or its first version, was created.
    range: stix_timestamp_millis
    slot_uri: stix:created
    close_mappings:
    - uco-core:objectCreatedTime
    aliases:
    - created
  modified:
    description: The time at which this version of the object was modified.
    range: stix_timestamp_millis
    slot_uri: stix:modified
    close_mappings:
    - uco-core:modifiedTime
  revoked:
    description: The revoked property indicates whether the object has been revoked.
    range: boolean
    slot_uri: stix:revoked
  labels:
    description: The labels property specifies a set of terms used to describe this object.
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:labels
    close_mappings:
    - uco-core:tag
  confidence:
    description: Identifies the confidence that the creator has in the correctness of their data.
    range: integer
    minimum_value: 0
    maximum_value: 100
    slot_uri: stix:confidence
    close_mappings:
    - uco-core:confidence
  lang:
    description: The language of the text content, as an RFC 5646 language code.
    slot_uri: stix:lang
  external_references:
    description: References to non-STIX information about the object.
    range: StixExternalReference
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: stix:external_references
    close_mappings:
    - uco-core:externalReference
  defanged:
    description: Defines whether or not the data contained within the object has been defanged.
    range: boolean
    slot_uri: stix:defanged
  roles:
    description: The roles that the identity or threat actor plays.
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:roles
  stix_name:
    description: A name that identifies the object.
    slot_uri: stix:name
    close_mappings:
    - uco-core:name
    aliases:
    - name
  stix_description:
    description: A description of the object, which may be long.
    slot_uri: stix:description
    close_mappings:
    - uco-core:description
    aliases:
    - description
  identity_class:
    description: The kind of entity the identity describes, such as an individual or an organization.
    any_of:
    - range: StixIdentityClass
    - range: string
    slot_uri: stix:identity_class
  sectors:
    description: The industry sectors that the identity belongs to.
    any_of:
    - range: StixIndustrySector
    - range: string
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:sectors
  contact_information:
    description: The contact information (e-mail, phone number, etc.) for this Identity.
    slot_uri: stix:contact_information
  definition_type:
    description: The type of the marking definition, such as statement or tlp.
    any_of:
    - range: StixMarkingDefinitionType
    - range: string
    slot_uri: stix:definition_type
    close_mappings:
    - uco-marking:definitionType
  stix_definition:
    description: 'The marking itself: a statement, or a Traffic Light Protocol (TLP) level.'
    inlined: true
    slot_uri: stix:definition
    any_of:
    - range: StixStatementMarking
    - range: StixTlpMarking
    close_mappings:
    - uco-marking:definition
    aliases:
    - definition
  object_ref:
    description: Identifies the object that this Language Content applies to.
    range: StixObject
    pattern: ^(?!(bundle|language-content)--)[a-z][a-z0-9-]+[a-z0-9]--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:object_ref
  object_modified:
    description: Identifies the modified time of the object that this Language Content applies to.
    range: stix_timestamp
    slot_uri: stix:object_modified
  contents:
    description: Contains the actual Language Content (translation).
    range: StixLanguageContents
    inlined: true
    slot_uri: stix:contents
  schema:
    description: The normative definition of the extension, either as a URL or as plain text explaining
      the definition.
    slot_uri: stix:schema
  stix_version:
    description: A version, as a string; each class says of what.
    slot_uri: stix:version
    aliases:
    - version
  extension_types:
    description: Which extension types are contained within this extension.
    range: StixExtensionType
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:extension_types
  extension_properties:
    description: The list of new property names that are added to an object by this extension.
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:extension_properties
  source_name:
    description: The source, such as a system, registry or organization, that defines the reference.
    slot_uri: stix:source_name
  stix_url:
    description: A URL.
    range: uri
    slot_uri: stix:url
    aliases:
    - url
  hashes:
    description: A dictionary of hashes of the content, keyed by hash algorithm.
    range: StixHashes
    inlined: true
    slot_uri: stix:hashes
  external_id:
    description: An identifier of the external content in its source, such as CVE-2016-1234.
    slot_uri: stix:external_id
    close_mappings:
    - uco-core:externalIdentifier
  kill_chain_name:
    description: The name of the kill chain.
    slot_uri: stix:kill_chain_name
  phase_name:
    description: The name of the phase in the kill chain.
    slot_uri: stix:phase_name
  marking_ref:
    description: The marking_ref property specifies the ID of the marking-definition object that describes
      the marking.
    range: StixMarkingDefinition
    pattern: ^marking-definition--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:marking_ref
    close_mappings:
    - uco-marking:marking
  selectors:
    description: A list of selectors for content contained within the STIX object in which this property
      appears.
    pattern: ^([a-z0-9_-]{3,249}(\.(\[\d+\]|[a-z0-9_-]{1,250}))*|id)$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:selectors
    close_mappings:
    - uco-marking:contentSelectors
  statement:
    description: A statement, such as a copyright or terms of use, that applies to the marked content.
    slot_uri: stix:statement
    close_mappings:
    - uco-marking:statement
  tlp:
    range: StixTlpLevel
    description: The Traffic Light Protocol level.
    slot_uri: stix:tlp
  extension_type:
    description: The kind of extension, as the extension's definition declares it.
    range: StixExtensionType
    slot_uri: stix:extension_type
  objects:
    description: 'Objects that this object holds: a list in a bundle, a dictionary in observed data.'
    slot_uri: stix:objects
  mime_type:
    description: The MIME type of the content, as the IANA Media Types registry names it.
    slot_uri: stix:mime_type
  payload_bin:
    description: Specifies the binary data contained in the artifact as a base64-encoded string.
    range: stix_binary
    slot_uri: stix:payload_bin
  encryption_algorithm:
    description: If the artifact is encrypted, specifies the type of encryption algorithm the binary data
      (either via payload_bin or url) is encoded in.
    range: StixEncryptionAlgorithm
    slot_uri: stix:encryption_algorithm
  decryption_key:
    description: Specifies the decryption key for the encrypted binary data (either via payload_bin or
      url).
    slot_uri: stix:decryption_key
  number:
    description: Specifies the number assigned to the AS. Such assignments are typically performed by
      a Regional Internet Registries (RIR).
    range: integer
    slot_uri: stix:number
  rir:
    description: Specifies the name of the Regional Internet Registry (RIR) that assigned the number to
      the AS.
    slot_uri: stix:rir
  path:
    description: A path, as it was observed.
    slot_uri: stix:path
  path_enc:
    description: Specifies the observed encoding for the path.
    pattern: ^[a-zA-Z0-9/\.+_:-]{2,250}$
    slot_uri: stix:path_enc
  ctime:
    description: The time at which the object was created.
    range: stix_timestamp
    slot_uri: stix:ctime
  mtime:
    description: The time at which the object was last written to.
    range: stix_timestamp
    slot_uri: stix:mtime
  atime:
    description: The time at which the object was last accessed.
    range: stix_timestamp
    slot_uri: stix:atime
  contains_refs:
    description: References to other cyber-observable objects that this one contains.
    range: StixCyberObservableObject
    pattern: ^(?!(attack-pattern|campaign|course-of-action|grouping|identity|incident|indicator|infrastructure|intrusion-set|location|malware|malware-analysis|note|observed-data|opinion|report|threat-actor|tool|vulnerability|relationship|sighting|bundle|marking-definition|language-content|extension-definition)--)[a-z][a-z0-9-]+[a-z0-9]--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:contains_refs
  value:
    description: The value of the observable, in the form each class states.
    slot_uri: stix:value
  resolves_to_refs:
    description: References to the cyber-observable objects that this one resolves to.
    range: StixCyberObservableObject
    pattern: ^[a-z][a-z0-9-]+[a-z0-9]--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:resolves_to_refs
  display_name:
    description: A name for display.
    slot_uri: stix:display_name
  belongs_to_ref:
    description: Specifies the user account that the email address belongs to, as a reference to a User
      Account Object.
    range: StixUserAccount
    pattern: ^user-account--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:belongs_to_ref
  email_date:
    alias: date
    description: Specifies the date/time that the email message was sent.
    range: stix_timestamp
    slot_uri: stix:date
  content_type:
    description: The value of a Content-Type header field.
    slot_uri: stix:content_type
  from_ref:
    description: Specifies the value of the 'From:' header of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:from_ref
  sender_ref:
    description: Specifies the value of the 'From' field of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:sender_ref
  to_refs:
    description: Specifies the mailboxes that are 'To:' recipients of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:to_refs
  cc_refs:
    description: Specifies the mailboxes that are 'CC:' recipients of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:cc_refs
  bcc_refs:
    description: Specifies the mailboxes that are 'BCC:' recipients of the email message.
    range: StixEmailAddress
    pattern: ^email-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:bcc_refs
  message_id:
    description: Specifies the Message-ID field of the email message.
    slot_uri: stix:message_id
  subject:
    description: A subject, as a string; each class says of what.
    slot_uri: stix:subject
  received_lines:
    description: Specifies one or more Received header fields that may be included in the email headers.
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:received_lines
  additional_header_fields:
    description: Specifies any other header fields found in the email message, as a dictionary.
    range: StixDictionary
    inlined: true
    slot_uri: stix:additional_header_fields
  raw_email_ref:
    description: Specifies the raw binary contents of the email message, including both the headers and
      body, as a reference to an Artifact Object.
    range: StixArtifact
    pattern: ^artifact--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:raw_email_ref
  is_multipart:
    description: Indicates whether the email body contains multiple MIME parts.
    range: boolean
    slot_uri: stix:is_multipart
  stix_body:
    description: A body of text.
    slot_uri: stix:body
    aliases:
    - body
  body_multipart:
    description: The MIME parts that make up a multipart email body.
    comments:
    - Present only when is_multipart is true.
    range: StixMimePart
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: stix:body_multipart
  size:
    description: A size in bytes, as a non-negative integer.
    range: integer
    minimum_value: 0
    slot_uri: stix:size
  name_enc:
    description: Specifies the observed encoding for the name of the file.
    pattern: ^[a-zA-Z0-9/\.+_:-]{2,250}$
    slot_uri: stix:name_enc
  magic_number_hex:
    description: Specifies the hexadecimal constant ('magic number') associated with a specific file format
      that corresponds to the file, if applicable.
    range: stix_hex
    slot_uri: stix:magic_number_hex
  parent_directory_ref:
    description: Specifies the parent directory of the file, as a reference to a Directory Object.
    range: StixDirectory
    pattern: ^directory--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:parent_directory_ref
  content_ref:
    description: Specifies the content of the file, represented as an Artifact Object.
    range: StixArtifact
    pattern: ^artifact--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:content_ref
  belongs_to_refs:
    description: References to the autonomous systems that this address belongs to.
    range: StixAutonomousSystem
    pattern: ^autonomous-system--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:belongs_to_refs
  start:
    description: Specifies the date/time the network traffic was initiated, if known.
    range: stix_timestamp
    slot_uri: stix:start
  end:
    description: Specifies the date/time the network traffic ended, if known.
    range: stix_timestamp
    slot_uri: stix:end
  src_ref:
    description: Specifies the source of the network traffic, as a reference to an Observable Object.
    range: StixCyberObservableObject
    any_of:
    - range: StixIpv4Address
    - range: StixIpv6Address
    - range: StixMacAddress
    - range: StixDomainName
    pattern: ^(ipv4-addr|ipv6-addr|mac-addr|domain-name)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:src_ref
  dst_ref:
    description: Specifies the destination of the network traffic, as a reference to an Observable Object.
    range: StixCyberObservableObject
    any_of:
    - range: StixIpv4Address
    - range: StixIpv6Address
    - range: StixMacAddress
    - range: StixDomainName
    pattern: ^(ipv4-addr|ipv6-addr|mac-addr|domain-name)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: stix:dst_ref
  src_port:
    description: The source port of the traffic.
    range: integer
    minimum_value: 0
    maximum_value: 65535
    slot_uri: stix:src_port
  dst_port:
    description: The destination port of the traffic.
    range: integer
    minimum_value: 0
    maximum_value: 65535
    slot_uri: stix:dst_port
  protocols:
    description: Specifies the protocols observed in the network traffic, along with their corresponding
      state.
    multivalued: true
    minimum_cardinality: 1
    slot_uri: stix:protocols
  src_byte_count:
    description: Specifies the number of bytes sent from the source to the destination.
    range: integer
    slot_uri: stix:src_byte_count
  dst_byte_count:
    description: Specifies the number of bytes sent from the destination to the source.
    range: integer
    slot_uri: stix:dst_byte_count
  src_packets:
    description: Specifies the number of packets sent from the source to the destination.
    range: integer
    slot_uri: stix:src_packets
  dst_packets:
    description: Specifies the number of packets sent destination to the source.
    range: integer
    slot_uri: stix:dst_packets
  ipfix:
    description: Specifies any IP Flow Information Export (IPFIX) data for the traffic.
    range: StixDictionary
    inlined: true
    slot_uri: stix:ipfix
  src_payload_ref:
    description: Specifies the bytes sent from the source to the destination.
    range: StixArtifact

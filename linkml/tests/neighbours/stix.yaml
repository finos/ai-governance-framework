# Generated by `lokf adapt` from stix.yaml (stix 2.1); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/stix-lokf
name: stix
title: Structured Threat Information Expression (STIX)
description: 'A LinkML model of Structured Threat Information Expression (STIX) Version 2.1, the OASIS
  Standard for exchanging cyber threat intelligence: its domain, relationship, cyber-observable and meta
  objects, their properties, vocabularies and enumerations, and the bundle that carries them. STIX''s
  own property names are the schema''s keys, so STIX JSON validates unchanged.'
version: '2.1'
source: https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html
license: Apache-2.0
see_also:
- https://lmodel.github.io/stix
- https://github.com/oasis-open/cti-stix2-json-schemas/tree/9af1db41b7b86c06324f899649ae83480134f66e
annotations:
  stix_publication_date: '2021-06-10'
  json_schemas_repository: https://github.com/oasis-open/cti-stix2-json-schemas
  json_schemas_commit: 9af1db41b7b86c06324f899649ae83480134f66e
comments:
- The version is the edition of STIX that the schema renders, and source is the OASIS Standard of 10 June
  2021. OASIS publishes no release of its JSON schemas, so upstream/ copies them, their examples and their
  licence at the commit in the annotations, and scripts/check_upstream_release.py reports when that repository
  moves. STIX 2.1 Errata 01 exists only as a Committee Specification Draft (2 April 2025); the schema
  follows the approved standard, and the values the draft adds to four open vocabularies validate anyway.
- The specification is copyright OASIS Open, and nothing here copies its text. Descriptions come from
  OASIS's JSON schemas, which are under the BSD-3-Clause licence that NOTICE carries, or are this project's
  own.
- 'The classes are closed: an object validates only with the properties its class declares. STIX allows
  custom properties and custom objects; they validate once a schema that imports this one declares them,
  as a slot of a subclass or a class of its own, as lmodel/attack does for MITRE''s x_mitre_ properties
  and x-mitre- objects. Opening the object bases with extra_slots would accept every misspelled key as
  well, and LinkML 1.12.1''s Pydantic generator ignores extra_slots.'
- 'The JSON keys that contain a hyphen are dictionary keys, never property names: hash algorithms (SHA-256),
  extension names (ntfs-ext) and extension definition identifiers. The dictionaries that hold them are
  classes with extra_slots, which the generated JSON Schema checks; the generated Python models do not,
  and docs/index.md lists what goes unchecked.'
- 'Classes and slots map to terms of the Unified Cyber Ontology (UCO) 1.5.0 where the meaning matches,
  under UCO''s own namespaces: close_mappings for the cyber-observable objects, their extensions and the
  shared objects, and broad_mappings for Tool, which UCO defines more widely. The domain objects that
  UCO has no term for are left unmapped. tests/test_mappings.py checks each against UCO''s term list.'
default_prefix: stix
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  stix: https://w3id.org/lmodel/stix/
  uco-core: https://ontology.unifiedcyberontology.org/uco/core/
  uco-identity: https://ontology.unifiedcyberontology.org/uco/identity/
  uco-marking: https://ontology.unifiedcyberontology.org/uco/marking/
  xsd: http://www.w3.org/2001/XMLSchema#
  uco-observable: https://ontology.unifiedcyberontology.org/uco/observable/
  uco-location: https://ontology.unifiedcyberontology.org/uco/location/
  uco-tool: https://ontology.unifiedcyberontology.org/uco/tool/
imports:
- linkml:types
- lokf
classes:
  StixObject:
    description: 'Any STIX object: the base of the domain, relationship and cyber-observable objects and
      of the meta objects.'
    abstract: true
    slots:
    - id
    - stix_type
    - spec_version
    - object_marking_refs
    - granular_markings
    - extensions
    is_a: Concept
  StixCommonObject:
    description: 'The base of the objects that carry STIX''s common properties: the domain and relationship
      objects, language content and extension definitions.'
    abstract: true
    is_a: StixObject
    slots:
    - created_by_ref
    - stix_created
    - modified
    - revoked
    - labels
    - confidence
    - lang
    - external_references
    slot_usage:
      spec_version:
        required: true
      stix_created:
        required: true
      modified:
        required: true
  StixDomainObject:
    description: 'A STIX Domain Object (SDO): a higher-level concept of cyber threat intelligence, such
      as an attack pattern, a malware family or a threat actor.'
    abstract: true
    is_a: StixCommonObject
  StixRelationshipObject:
    description: 'A STIX Relationship Object (SRO): a relationship or a sighting that links other objects.'
    abstract: true
    is_a: StixCommonObject
  StixCyberObservableObject:
    description: 'A STIX Cyber-observable Object (SCO): a fact observed on a network or host, such as
      a file, an address or a process.'
    abstract: true
    is_a: StixObject
    slots:
    - defanged
  StixIdentity:
    description: An individual, organization or group, such as ACME, Inc., or a class of them.
    is_a: StixDomainObject
    slots:
    - roles
    - stix_name
    - stix_description
    - identity_class
    - sectors
    - contact_information
    slot_usage:
      id: {}
      stix_type:
        equals_string: identity
      stix_name:
        required: true
    annotations:
      stix_type: identity
    close_mappings:
    - uco-identity:Identity
  StixMarkingDefinition:
    description: 'A marking definition: a statement, a Traffic Light Protocol (TLP) level or another marking
      that applies to the objects that reference it.'
    is_a: StixObject
    slots:
    - created_by_ref
    - stix_created
    - external_references
    - stix_name
    - definition_type
    - stix_definition
    slot_usage:
      id: {}
      stix_type:
        equals_string: marking-definition
      spec_version:
        required: true
      stix_created:
        required: true
    comments:
    - created keeps the millisecond precision STIX 2.1 gives every object's created. OASIS's JSON schema
      asks a marking definition for a timestamp of any precision.
    rules:
    - description: Without extensions, a marking definition states its definition and definition type.
      preconditions:
        slot_conditions:
          extensions:
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          stix_definition:
            required: true
          definition_type:
            required: true
    annotations:
      stix_type: marking-definition
    close_mappings:
    - uco-marking:MarkingDefinition
  StixLanguageContent:
    description: The language-content object represents text content for STIX Objects represented in languages
      other than that of the original object.
    is_a: StixCommonObject
    slots:
    - object_ref
    - object_modified
    - contents
    slot_usage:
      id: {}
      stix_type:
        equals_string: language-content
      object_ref:
        required: true
      contents:
        required: true
    annotations:
      stix_type: language-content
  StixExtensionDefinition:
    description: The STIX Extension Definition object allows producers of threat intelligence to extend
      existing STIX objects or to create entirely new STIX objects in a standardized way.
    is_a: StixCommonObject
    slots:
    - stix_name
    - stix_description
    - schema
    - stix_version
    - extension_types
    - extension_properties
    slot_usage:
      id: {}
      stix_type:
        equals_string: extension-definition
      stix_name:
        required: true
      schema:
        required: true
      stix_version:
        required: true
      extension_types:
        required: true
    annotations:
      stix_type: extension-definition
  StixExternalReference:
    description: External references are used to describe pointers to information represented outside
      of STIX.
    slots:
    - source_name
    - stix_description
    - stix_url
    - hashes
    - external_id
    slot_usage:
      source_name:
        required: true
    any_of:
    - slot_conditions:
        external_id:
          required: true
    - slot_conditions:
        stix_description:
          required: true
    - slot_conditions:
        stix_url:
          required: true
    rules:
    - description: A reference to the CVE list names a CVE identifier.
      preconditions:
        slot_conditions:
          source_name:
            equals_string: cve
      postconditions:
        slot_conditions:
          external_id:
            required: true
            pattern: ^CVE-\d{4}-(0\d{3}|[1-9]\d{3,})$
    - description: A reference to CAPEC names a CAPEC identifier.
      preconditions:
        slot_conditions:
          source_name:
            equals_string: capec
      postconditions:
        slot_conditions:
          external_id:
            required: true
            pattern: ^CAPEC-\d+$
    close_mappings:
    - uco-core:ExternalReference
  StixKillChainPhase:
    description: A phase in a kill chain, named by the chain and the phase.
    slots:
    - kill_chain_name
    - phase_name
    slot_usage:
      kill_chain_name:
        required: true
      phase_name:
        required: true
  StixGranularMarking:
    description: 'A marking of parts of an object: the properties its selectors name, marked either by
      a marking definition or with a language.'
    comments:
    - STIX 2.1 requires exactly one of marking_ref and lang. OASIS's JSON schema requires marking_ref,
      which rejects a language marking. The schema follows the standard.
    slots:
    - marking_ref
    - selectors
    - lang
    slot_usage:
      selectors:
        required: true
    exactly_one_of:
    - slot_conditions:
        marking_ref:
          required: true
    - slot_conditions:
        lang:
          required: true
    close_mappings:
    - uco-marking:GranularMarking
  StixStatementMarking:
    description: 'The definition of a statement marking: a statement, such as a copyright or terms of
      use.'
    slots:
    - statement
    slot_usage:
      statement:
        required: true
    close_mappings:
    - uco-marking:StatementMarking
  StixTlpMarking:
    description: 'The definition of a Traffic Light Protocol (TLP) marking: its level.'
    slots:
    - tlp
    slot_usage:
      tlp:
        required: true
  StixExtension:
    description: An extension of an object that an extension definition defines. Besides its extension
      type it carries the properties that its definition's schema states.
    slots:
    - extension_type
    slot_usage:
      extension_type:
        required: true
    extra_slots:
      allowed: true
  StixHashes:
    description: A dictionary of hashes. Each key names a hash algorithm, from the hash-algorithm-ov vocabulary
      (StixHashAlgorithm) or a custom one, and each value is the hash as a string.
    extra_slots:
      range_expression:
        range: string
  StixExtensions:
    description: A dictionary of extensions, keyed by an extension definition's identifier.
    extra_slots:
      range_expression:
        range: StixExtension
  StixDictionary:
    description: A dictionary of key and value pairs that STIX leaves open.
    extra_slots:
      allowed: true
  StixLanguageContents:
    description: The translations of a language content object, keyed by language code. Each value maps
      the translated properties to their translations.
    extra_slots:
      range_expression:
        range: StixDictionary
  StixArtifact:
    description: An array of bytes, carried as base64 in payload_bin, or a link to a file-like payload.
    is_a: StixCyberObservableObject
    slots:
    - mime_type
    - payload_bin
    - stix_url
    - hashes
    - encryption_algorithm
    - decryption_key
    slot_usage:
      id: {}
      stix_type:
        equals_string: artifact
      mime_type:
        pattern: ^(application|audio|font|image|message|model|multipart|text|video)/[a-zA-Z0-9.+_-]+
    any_of:
    - slot_conditions:
        payload_bin:
          required: true
    - slot_conditions:
        stix_url:
          required: true
    rules:
    - description: payload_bin and url exclude each other.
      preconditions:
        slot_conditions:
          payload_bin:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          stix_url:
            value_presence: ABSENT
    - description: An artifact given by url carries its hashes.
      preconditions:
        slot_conditions:
          stix_url:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          hashes:
            required: true
    - description: A decryption key needs an encryption algorithm.
      preconditions:
        slot_conditions:
          decryption_key:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          encryption_algorithm:
            required: true
    annotations:
      stix_type: artifact
  StixAutonomousSystem:
    description: The AS object represents the properties of an Autonomous Systems (AS).
    is_a: StixCyberObservableObject
    slots:
    - number
    - stix_name
    - rir
    slot_usage:
      id: {}
      stix_type:
        equals_string: autonomous-system
      number:
        required: true
    annotations:

# Generated by `lokf adapt` from github_actions.yaml (github_actions 2026-10-28); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/github-actions-lokf
name: github-actions
title: GitHub Actions workflows, actions and repository rulesets
description: 'A LinkML model of what GitHub Actions files and repository rulesets state: workflows and
  their jobs, reusable workflows with their inputs, outputs and secrets, actions with their runtimes,
  and the rulesets and required status checks that tie a workflow''s jobs to the refs a ruleset protects.'
version: '2026-10-28'
in_language: en
keywords:
- GitHub Actions
- workflow
- reusable workflow
- action
- repository ruleset
- required status check
- continuous integration
source: https://github.com/SchemaStore/schemastore/tree/f7c2f3bcb512651bd980ed6896639ea8ded9ddf0/src/schemas/json
license: Apache-2.0
see_also:
- https://lmodel.github.io/github-actions
- https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
- https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax
- https://docs.github.com/en/rest/repos/rules
- https://docs.github.com/en/rest/checks/runs
- https://actions.github.io/buildtypes/workflow/v1
annotations:
  schemastore_commit: f7c2f3bcb512651bd980ed6896639ea8ded9ddf0
  rest_api_version: '2026-03-10'
  docs_read: '2026-10-28'
comments:
- GitHub's documentation is versionless, so the version is the date its pages were read. With the SchemaStore
  commit in source and the REST API version in the annotations, it says which state of GitHub the model
  renders; scripts/check_upstream_release.py reads the same three pins and reports when one moves. The
  release tags are the schema's own versions.
- github_actions_core imports only the LinkML types, the workflow and action modules import the core,
  the rules module imports the workflow module, and this file adds only the document root, so an importer
  can take one module.
default_prefix: gha
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  gha: https://w3id.org/lmodel/github-actions/
  xsd: http://www.w3.org/2001/XMLSchema#
  schema: http://schema.org/
  cdx: http://cyclonedx.org/schema/bom-1.7.schema.json#/definitions/
  spdx_build: https://spdx.org/rdf/3.0.1/terms/Build/
  slsa: https://w3id.org/lmodel/slsa/
  in_toto: https://in-toto.io/attestation/
imports:
- linkml:types
- lokf
classes:
  GhaRequiredMixin:
    mixin: true
    description: The field that says whether a caller must supply a value.
    attributes:
      required:
        description: Whether a caller must supply a value.
        range: boolean
        slot_uri: schema:valueRequired
        comments:
        - 'An attribute rather than a slot: it carries LOKF''s IRI for required, and lokf adapt keeps
          an attribute''s name, where it would rename a slot that shares one with lokf.yaml.'
  GhaInput:
    abstract: true
    class_uri: gha:Input
    description: An input that a reusable workflow or an action declares, under the key a caller writes
      in its `with` map.
    close_mappings:
    - schema:PropertyValueSpecification
    comments:
    - 'The mappings to schema.org are this project''s own: an input specifies a value a caller supplies,
      as schema.org''s PropertyValueSpecification specifies the input of an action, whose valueRequired
      the required field already carries.'
    children_are_mutually_disjoint: true
    mixins:
    - GhaRequiredMixin
    slots:
    - description
    attributes:
      input_id:
        description: The key a caller writes in its `with` map.
        range: gha_identifier
        required: true
        close_mappings:
        - schema:valueName
      default:
        description: The value used when a caller supplies none, written as a string even where the input's
          type is a boolean or a number.
        exact_mappings:
        - schema:defaultValue
    slot_usage:
      description:
        range: string
  GhaOutput:
    abstract: true
    class_uri: gha:Output
    description: An output that a reusable workflow or an action declares for the job or step that calls
      it to read.
    children_are_mutually_disjoint: true
    slots:
    - description
    - output_expression
    attributes:
      output_id:
        description: The key a caller reads the output by.
        range: gha_identifier
        required: true
    slot_usage:
      description:
        range: string
  GhaWorkflow:
    class_uri: gha:Workflow
    description: 'A workflow file in a repository''s `.github/workflows` directory: the events that run
      it, the access its GITHUB_TOKEN gets, and its jobs.'
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
    aliases:
    - workflow
    close_mappings:
    - cdx:workflow
    broad_mappings:
    - schema:SoftwareSourceCode
    related_mappings:
    - spdx_build:Build
    slots:
    - triggers
    - jobs
    - id
    slot_usage:
      triggers:
        required: true
    comments:
    - SPDX 3.0.1's Build records one run of a build, such as a run of this workflow, so it is a related
      term and not a close one. The mappings to CycloneDX, SPDX and schema.org are this project's own;
      a workflow file is code in a repository, of which schema.org's SoftwareSourceCode is the broader
      term.
    - The ref a run checks the file out at belongs to the run, and GitHub's build type records it in provenance
      as workflow.ref; it is not a fact of the file, so it is not modelled here.
    attributes:
      workflow_path:
        description: The file's path from the repository root, as GitHub's build type writes workflow.path.
          GitHub reads no subdirectory of `.github/workflows`.
        required: true
        pattern: ^\.github/workflows/[^/]+\.ya?ml$
        see_also:
        - https://actions.github.io/buildtypes/workflow/v1
      workflow_repository:
        description: 'The repository that holds the file, as GitHub''s build type writes workflow.repository:
          an HTTPS address without `.git`.'
        range: uri
        pattern: ^https://[^/]+/[^/]+/[^/]+$
        close_mappings:
        - schema:codeRepository
        see_also:
        - https://actions.github.io/buildtypes/workflow/v1
      permissions:
        description: The access the file's top-level `permissions` key gives every job's GITHUB_TOKEN.
          Absent when the file sets none, so the repository's or organization's default applies; a scope
          the map leaves out gets no access.
        range: gha_permission
        multivalued: true
    is_a: Concept
  GhaReusableWorkflow:
    is_a: GhaWorkflow
    class_uri: gha:ReusableWorkflow
    description: A workflow that other workflows call as a job, because its `on` key names `workflow_call`;
      it declares the inputs, outputs and secrets its callers pass and read.
    aliases:
    - reusable workflow
    related_mappings:
    - slsa:SlsaBuildPlatform
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_call
    comments:
    - 'When it generates provenance it is the builder: GitHub''s build type sets builder.id to the server''s
      address followed by the job''s workflow reference, which names this file and its ref. So lmodel/slsa''s
      SlsaBuildPlatform, the builder that provenance names, is a related term: this project''s mapping,
      and not a close one, because a reusable workflow that generates no provenance is no builder.'
    slots:
    - inputs
    - outputs
    slot_usage:
      triggers:
        has_member:
          equals_string: workflow_call
      inputs:
        description: The inputs under the file's `on.workflow_call.inputs` key.
        range: GhaWorkflowInput
      outputs:
        description: The outputs under the file's `on.workflow_call.outputs` key.
        range: GhaWorkflowOutput
    attributes:
      secrets:
        description: The secrets under the file's `on.workflow_call.secrets` key, by name only; no value
          is ever recorded.
        range: GhaWorkflowSecret
        multivalued: true
        inlined: true
        inlined_as_list: true
  GhaWorkflowJob:
    class_uri: gha:WorkflowJob
    description: 'A job under a workflow''s `jobs` key: steps that run on a runner, or a call to a reusable
      workflow.'
    aliases:
    - job
    close_mappings:
    - cdx:task
    comments:
    - 'The mapping is this project''s own: CycloneDX makes a workflow of tasks, as a GitHub workflow is
      made of jobs.'
    slots:
    - job_of
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobs
    rules:
    - description: 'A job that calls a reusable workflow names no runner labels: a calling job takes no
        `runs-on` key, and the called workflow''s jobs choose their own runners.'
      preconditions:
        slot_conditions:
          calls:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          runs_on:
            value_presence: ABSENT
    - description: A job that calls a reusable workflow names no runner group.
      preconditions:
        slot_conditions:
          calls:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          runner_group:
            value_presence: ABSENT
    attributes:
      job_id:
        description: The job's key under `jobs`.
        range: gha_identifier
        required: true
      job_name:
        aliases:
        - name
        close_mappings:
        - cdx:task/properties/name
        description: The job's `name`, which GitHub shows and its check run takes; the check run takes
          the job's id when it has none.
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idname
      calls:
        aliases:
        - uses
        description: 'The reusable workflow the job runs, its `uses` value: `./.github/workflows/<file>`
          in the same repository, or `<owner>/<repo>/.github/workflows/<file>@<ref>`.'
        pattern: ^(.+\/)+(.+)\.(ya?ml)(@.+)?$
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_iduses
      runs_on:
        aliases:
        - runs-on
        description: 'The runner labels from the job''s `runs-on`: one label, a list, or the `labels`
          of a group. A runner must carry every one.'
        multivalued: true
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idruns-on
      runner_group:
        aliases:
        - group
        description: The runner group the job's `runs-on.group` names.
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#choosing-runners-in-a-group
      runner_environment:
        description: Whether the job's runner is hosted by GitHub or by the repository's owner, as GitHub's
          build type records runner_environment for a run.
        range: GhaRunnerEnvironment
      job_permissions:
        aliases:
        - permissions
        description: The access the job's own `permissions` key gives its GITHUB_TOKEN, in place of the
          workflow's. A called workflow can lower its token's access, never raise it.
        range: gha_permission
        multivalued: true
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idpermissions
  GhaWorkflowInput:
    is_a: GhaInput
    class_uri: gha:WorkflowInput
    description: An input under a reusable workflow's `on.workflow_call.inputs` key.
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_callinputs
    attributes:
      input_type:
        aliases:
        - type
        description: The input's `type`, which a reusable workflow's input must state. Named input_type
          because a knowledge bundle reads `type` as the class of the concept.
        range: GhaWorkflowInputType
        required: true
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_callinputsinput_idtype
  GhaWorkflowOutput:
    is_a: GhaOutput
    class_uri: gha:WorkflowOutput
    description: An output under a reusable workflow's `on.workflow_call.outputs` key, set from an output
      of one of its jobs.
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_calloutputs
    slot_usage:
      output_expression:
        required: true
  GhaWorkflowSecret:
    class_uri: gha:WorkflowSecret
    description: A secret under a reusable workflow's `on.workflow_call.secrets` key, by name; its value
      is never recorded.
    aliases:
    - secret
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_callsecrets
    mixins:
    - GhaRequiredMixin
    slots:
    - description
    attributes:
      secret_id:
        description: The key a caller passes the secret under.
        range: gha_identifier
        required: true
    slot_usage:
      description:
        range: string
  GhaAction:
    class_uri: gha:Action
    description: 'An action: a directory whose `action.yml` or `action.yaml` file names its inputs, its
      outputs and the runtime that executes it. A workflow step runs it with `uses`.'
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax
    aliases:
    - action
    close_mappings:
    - cdx:task
    broad_mappings:
    - schema:SoftwareSourceCode
    comments:
    - 'The mapping to schema.org is this project''s own: an action is code in a repository, of which schema.org''s
      SoftwareSourceCode is the broader term.'
    - SLSA counts the actions a build runs among its steps, which the tenant defines; an action is never
      a build's trust boundary, as a reusable workflow that signs provenance is.
    - The metadata file's name and description are the concept's title and description in a knowledge
      bundle, so the class adds neither.
    slots:
    - inputs
    - outputs
    - id
    slot_usage:
      inputs:
        description: The inputs under the metadata file's `inputs` key.
        range: GhaActionInput
      outputs:
        description: The outputs under the metadata file's `outputs` key.
        range: GhaActionOutput
    attributes:
      action_path:
        description: The metadata file's path from the repository root.
        required: true
        pattern: ^(.+/)?action\.ya?ml$
      using:
        description: The runtime that executes the action, its `runs.using` value.
        range: GhaActionRuntime
        required: true
    is_a: Concept
  GhaActionInput:
    is_a: GhaInput
    class_uri: gha:ActionInput
    description: An input under an action's `inputs` key.
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#inputs
    slot_usage:
      description:
        required: true
        range: string
    attributes:
      deprecation_message:
        aliases:
        - deprecationMessage
        description: The message GitHub shows a workflow that still passes the input, the file's `deprecationMessage`;
          present only when the input is deprecated.
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#inputsinput_iddeprecationmessage
  GhaActionOutput:
    is_a: GhaOutput
    class_uri: gha:ActionOutput
    description: An output under an action's `outputs` key.
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#outputs-for-docker-container-and-javascript-actions
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#outputs-for-composite-actions
    comments:
    - Only a composite action sets an output from an expression; a Docker or JavaScript action writes
      its outputs while it runs, so its outputs have no output_expression.
    slot_usage:
      description:
        required: true
        range: string
  GhaRepositoryRuleset:
    class_uri: gha:RepositoryRuleset
    aliases:
    - ruleset
    description: 'A ruleset: named rules that GitHub enforces on the branches, tags or pushes of a repository,
      or of every repository in an organization or enterprise that it targets.'
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    - https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
    comments:
    - SLSA's Source track calls such rules technical controls on protected named references, and asks
      that their meaning be documented and their enforcement recorded in attestations; the slsa schema
      models that evidence.
    - Of the rules' parameters, only those of required_status_checks are modelled, as GhaRequiredStatusCheck;
      rule_types says which other rules the ruleset holds.
    slots:
    - requires_check
    - id
    attributes:
      ruleset_id:
        aliases:
        - id
        description: The ruleset's numeric `id` in the REST API.
        range: integer
        minimum_value: 1
      ruleset_source_type:
        aliases:
        - source_type
        description: 'What owns the ruleset, the REST field `source_type`: a repository, an organization
          or an enterprise.'
        range: GhaRulesetSourceType
      ruleset_source:
        aliases:
        - source
        description: The name of the repository, organization or enterprise that owns the ruleset, the
          REST field `source`, such as `<owner>/<repo>`.
      ruleset_target:
        aliases:
        - target
        description: What the ruleset applies to, the REST field `target`. Named ruleset_target because
          LOKF defines a target slot of its own.
        range: GhaRulesetTarget
        required: true
      enforcement:
        description: Whether GitHub enforces the ruleset, the REST field `enforcement`.
        range: GhaRulesetEnforcement
        required: true
      ref_name_include:
        aliases:
        - include
        description: 'The refs the ruleset applies to, from `conditions.ref_name.include`: names or patterns
          such as `refs/heads/main`, or `~DEFAULT_BRANCH` or `~ALL`. A ref must match one of them.'
        multivalued: true
      ref_name_exclude:
        aliases:
        - exclude
        description: The refs the ruleset leaves out, from `conditions.ref_name.exclude`, even when they
          match an included one.
        multivalued: true
      bypass_actors:
        description: The actors who may bypass the ruleset.
        range: GhaBypassActor
        multivalued: true
        inlined: true
        inlined_as_list: true
      rule_types:
        description: The `type` of each rule the ruleset holds, such as `deletion`, `non_fast_forward`,
          `pull_request` or `required_status_checks`.
        multivalued: true
        pattern: ^[a-z_]+$
        comments:
        - A pattern rather than an enumeration, because GitHub adds rule types.
    is_a: Concept
  GhaBypassActor:
    class_uri: gha:BypassActor
    aliases:
    - bypass actor
    description: An actor who may bypass a ruleset, and when.
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    attributes:
      actor_id:
        description: The actor's numeric id; absent for an actor type GitHub takes no id for, such as
          DeployKey or OrganizationAdmin.
        range: integer
      actor_type:
        description: The kind of actor, the REST field `actor_type`, such as `Team`, `RepositoryRole`,
          `Integration` or `OrganizationAdmin`.
        required: true
        pattern: ^[A-Z][A-Za-z]+$
        comments:
        - A pattern rather than an enumeration, because GitHub adds actor types.
      bypass_mode:
        description: When the actor may bypass, the REST field `bypass_mode`, such as `always`, `pull_request`
          or `exempt`; GitHub's default is `always`.
        pattern: ^[a-z_]+$
        comments:
        - A pattern rather than an enumeration, because GitHub adds bypass modes.
  GhaRequiredStatusCheck:
    class_uri: gha:RequiredStatusCheck
    aliases:
    - required status check
    description: A status check that a ruleset requires to pass before a change reaches a ref it targets,
      named by the context a check run must report.
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    - https://docs.github.com/en/rest/checks/runs
    - https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/about-status-checks
    - https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
    related_mappings:
    - in_toto:test-result/v0.1
    comments:
    - 'GitHub Actions reports each job as a check run named after the job: its name, or its id when it
      has none. A job of a called workflow is named after the calling job and the called job, joined by
      a slash with a space on each side, as the otterdog documentation states (https://otterdog.readthedocs.io/en/latest/reference/organization/repository/status-check/).
      A matrix job''s check name adds its matrix values in parentheses.'
    - A job skipped by its own `if`, or because a job it needs failed or was skipped, reports success,
      so its required check passes without running. A path filter skips the whole run, and a calling job's
      `if` or `needs` skips the call, which GitHub records under the caller's name alone, so the required
      check stays pending and blocks the merge. skip_conditions records each of these.
    - SLSA's Source track lets an organization carry such a control into a Source Verification Summary
      Attestation as an ORG_SOURCE_ property, whose meaning the organization defines; slsa-framework's
      source-tool emits one as GH_REQUIRED_CHECK_ followed by the check's name.
    - in-toto's Test Result predicate is the shape of an attestation of what the check found, so it is
      a related term and not a close one.
    slots:
    - required_by
    - emitted_by
    - id
    attributes:
      check_context:
        aliases:
        - context
        description: The context a check run must report, the rule's `required_status_checks[].context`.
          Named check_context because LOKF defines a context slot of its own.
        required: true
        pattern: \S
      integration_id:
        description: The GitHub App the check must come from, the rule's `integration_id`; GitHub Actions
          is app 15368.
        range: integer
        minimum_value: 1
      strict_policy:
        aliases:
        - strict_required_status_checks_policy
        description: Whether a pull request must be tested against the latest code of the branch it targets,
          the rule's `strict_required_status_checks_policy`.
        range: boolean
      do_not_enforce_on_create:
        description: Whether a branch may be created although the check would otherwise stop it, the rule's
          `do_not_enforce_on_create`.
        range: boolean
      job_path:
        description: 'The ids of the jobs from the top-level workflow''s job to the job that reports the
          check: one id for a job of the workflow itself, the calling job''s id first for a job of a called
          workflow.'
        range: gha_identifier
        multivalued: true
        list_elements_ordered: true
      skip_conditions:
        description: What in the workflow can skip the job that reports the check, each written as its
          key's path in the file, such as `on.pull_request.paths` or `jobs.test.if`.
        multivalued: true
        pattern: ^(on|jobs)\.\S+$
    is_a: Concept
  GhaDocument:
    class_uri: gha:Document
    description: A document that holds the workflows, actions, rulesets and required status checks of
      one or more repositories.
    attributes:
      workflows:
        description: The workflows other than the reusable ones.
        range: GhaWorkflow
        multivalued: true
        inlined: true
        inlined_as_list: true
      reusable_workflows:
        description: The reusable workflows.
        range: GhaReusableWorkflow
        multivalued: true
        inlined: true
        inlined_as_list: true
      actions:
        description: The actions.
        range: GhaAction
        multivalued: true
        inlined: true
        inlined_as_list: true
      rulesets:
        description: The rulesets.
        range: GhaRepositoryRuleset
        multivalued: true
        inlined: true
        inlined_as_list: true
      required_checks:
        description: The status checks the rulesets require.
        range: GhaRequiredStatusCheck
        multivalued: true
        inlined: true
        inlined_as_list: true
slots:
  inputs:
    description: The inputs that the reusable workflow or the action declares.
    range: GhaInput
    multivalued: true
    inlined: true
    inlined_as_list: true
  outputs:
    description: The outputs that the reusable workflow or the action declares.
    range: GhaOutput
    multivalued: true
    inlined: true
    inlined_as_list: true
  output_expression:
    description: The expression that sets the output, the file's `value` key, such as one that reads an
      output of a job or a step.
    slot_uri: gha:output_expression
    aliases:
    - value
    comments:
    - A slot rather than an attribute because GhaWorkflowOutput refines it.
  triggers:
    description: The names of the events under the file's `on` key, such as `push`, `pull_request`, `schedule`
      or `workflow_call`.
    slot_uri: gha:triggers
    aliases:
    - 'on'
    multivalued: true
    pattern: ^[a-z_]+$
    related_mappings:
    - cdx:trigger
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
    comments:
    - A slot rather than an attribute because GhaReusableWorkflow refines it; a pattern rather than an
      enumeration, because GitHub adds events.
  jobs:
    description: The jobs under the file's `jobs` key.
    slot_uri: gha:jobs
    domain: GhaWorkflow
    range: GhaWorkflowJob
    multivalued: true
    required: true
    inlined: true
    inlined_as_list: true
    close_mappings:
    - cdx:workflow/properties/tasks
    comments:
    - A slot rather than an attribute because job_of names it as its inverse.
    - Close to the tasks of a CycloneDX workflow, as a job is close to a task.
  job_of:
    description: The workflow whose `jobs` key holds the job. A workflow holds its jobs inline, so a file
      states this only by nesting.
    slot_uri: gha:job_of
    domain: GhaWorkflowJob
    range: GhaWorkflow
    inverse: jobs
  requires_check:
    description: The status checks the ruleset's required_status_checks rule requires, each a concept
      of its own.
    aliases:
    - required_status_checks
    slot_uri: gha:requires_check
    domain: GhaRepositoryRuleset
    range: GhaRequiredStatusCheck
    multivalued: true
    comments:
    - A slot rather than an attribute because required_by names it as its inverse.
  required_by:
    description: The rulesets that require the check.
    slot_uri: gha:required_by
    domain: GhaRequiredStatusCheck
    range: GhaRepositoryRuleset
    multivalued: true
    inverse: requires_check
  emitted_by:
    description: The top-level workflow whose job reports the check.
    slot_uri: gha:emitted_by
    domain: GhaRequiredStatusCheck
    range: GhaWorkflow
    comments:
    - A slot rather than an attribute because emits_check names it as its inverse.
  emits_check:
    description: The required status checks that the workflow's jobs report.
    slot_uri: gha:emits_check
    domain: GhaWorkflow
    range: GhaRequiredStatusCheck
    multivalued: true
    inverse: emitted_by
    comments:
    - 'No class lists it: GhaWorkflow would need the workflow module to import this one, which imports
      it. A document states the link from the check''s side, with emitted_by, and the ontology states
      the pair, so a reasoner reads it from the workflow''s side too.'
types:
  gha_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A key GitHub accepts for a job, an input, an output or a secret: a letter or an underscore,
      then letters, digits, hyphens or underscores.'
    pattern: ^[_a-zA-Z][a-zA-Z0-9_-]*$
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#inputsinput_id
  gha_permission:
    typeof: string
    base: str
    uri: xsd:string
    description: One grant of access to a workflow's GITHUB_TOKEN, written as the scope, a colon and `read`,
      `write` or `none`; `read-all`, `write-all` or `{}` stands alone for the shorthand of the same name
      or the empty map.
    pattern: '^(read-all|write-all|\{\}|[a-z][a-z-]*: (read|write|none))$'
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
    comments:
    - A pattern rather than an enumeration of scopes, because GitHub adds scopes; tests/test_schema_rules.py
      checks that it admits every scope SchemaStore's schema lists at the pinned commit.
enums:
  GhaWorkflowInputType:
    description: The types a reusable workflow's input may state.
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_callinputsinput_idtype
    permissible_values:
      boolean:
        description: True or false.
        meaning: xsd:boolean
      number:
        description: A number.
        meaning: xsd:double
        comments:
        - 'GitHub holds a number as a double-precision float: its expressions turn a string that is no
          number into NaN, and the runner''s workflow parser keeps a number as a C# Double (https://github.com/actions/runner/blob/110142c2c501c6ae9373d553efa826bedbaab5f7/src/Sdk/WorkflowParser/ObjectTemplating/Tokens/NumberToken.cs).'
      string:
        description: A string.
        meaning: xsd:string
  GhaRunnerEnvironment:
    description: Who hosts the runner a job runs on, as GitHub's build type records it.
    see_also:
    - https://actions.github.io/buildtypes/workflow/v1
    permissible_values:
      github-hosted:
        title: GitHub-hosted
        description: A runner that GitHub hosts.
      self-hosted:
        title: Self-hosted
        description: A runner that the repository's owner hosts.
  GhaActionRuntime:
    description: The runtimes an action's `runs.using` may name.
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runs-for-javascript-actions
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runs-for-docker-container-actions
    comments:
    - SchemaStore's schema at the pinned commit also accepts node12 and node16, which GitHub's metadata
      syntax page no longer lists; tests/test_schema_rules.py checks that those two are the only difference.
    permissible_values:
      composite:
        description: Steps that run in the calling job, as a workflow's steps do.
      docker:
        description: A Docker container.
      node20:
        description: JavaScript, run by Node.js 20.
      node24:
        description: JavaScript, run by Node.js 24.
  GhaRulesetSourceType:
    description: What can own a ruleset, as the REST field `source_type` names it.
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    permissible_values:
      Repository:
        description: A repository's own ruleset.
      Organization:
        description: An organization's ruleset, applied to the repositories it targets.
      Enterprise:
        description: An enterprise's ruleset, applied to the repositories it targets.
  GhaRulesetTarget:
    description: What a ruleset applies to, as the REST field `target` names it.
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    permissible_values:
      branch:
        description: Branches; GitHub's default.
      tag:
        description: Tags.
      push:
        description: Pushes, by the files they change.
  GhaRulesetEnforcement:
    description: Whether GitHub enforces a ruleset, as the REST field `enforcement` names it.
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    permissible_values:
      active:
        description: Enforced.
      evaluate:
        description: Evaluated and reported but not enforced, so administrators can test its rules; only
          on GitHub Enterprise.
      disabled:
        description: Neither enforced nor evaluated.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: GhaWorkflow, GhaAction, GhaRepositoryRuleset,
  GhaRequiredStatusCheck; dropped for LOKF''s: workflow_uri, action_uri, ruleset_uri, check_uri; folded
  into LOKF''s: description -> description.'

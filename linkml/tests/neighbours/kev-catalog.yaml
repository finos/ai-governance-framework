# Generated by `lokf adapt` from kev_catalog.yaml (kev_catalog 2026-09-17); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/kev-catalog-lokf
name: kev-catalog
title: CISA Known Exploited Vulnerabilities Catalog
description: A LinkML model of the JSON format of the Known Exploited Vulnerabilities (KEV) catalog that
  the Cybersecurity and Infrastructure Security Agency (CISA) publishes. CISA's keys and values are the
  schema's, so a real KEV file validates unchanged.
version: '2026-09-17'
source: https://github.com/cisagov/kev-data/blob/d98075f22b11ca60ede428f4397966d3523dc692/known_exploited_vulnerabilities_schema.json
license: Apache-2.0
keywords:
- vulnerability
- known exploited vulnerability
- CVE
- CISA
- catalog
see_also:
- https://lmodel.github.io/kev-catalog
- https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities_schema.json
- https://github.com/cisagov/kev-data
annotations:
  upstream_schema_commit: d98075f22b11ca60ede428f4397966d3523dc692
  upstream_schema_blob: ec422845b354f58250d2e99cdfcce17a18659423
  upstream_schema_sha256: 0d5865c98694c5bfba2c78a26caf814f406b3fce8bfb81bef79e99c7f288b0e7
  upstream_schema_draft: http://json-schema.org/draft-07/schema#
  upstream_license: CC0-1.0
comments:
- CISA's JSON schema states no version, so the version here is the date of the commit that last changed
  the file in cisagov/kev-data. tests/upstream/ copies the file, and scripts/check_upstream_release.py
  reports when it moves.
- CISA states its data's terms as CC0 1.0, and says that third-party links in the data keep their own
  terms and that use of the data gives no right to the CISA Logo or the DHS Seal and is no endorsement.
  NOTICE says the same.
notes:
- 'KEV''s authority has moved to Binding Operational Directive (BOD) 26-04, which the upstream''s README
  and its forensicTriage description cite. Directive terms, dates and counts belong at their source, so
  none is restated here. CISA''s directive pages answered a plain client with 403 on 2026-11-03: see https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk'
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: KevCatalog, KevVulnerability; dropped
  for LOKF''s: cveID; renamed, IRIs unchanged: title -> kev_title.'
prefixes:
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  cve: https://w3id.org/lmodel/cve/
  stix: https://w3id.org/lmodel/stix/
  spdx3: https://spdx.org/rdf/3.0.1/terms/
  linkml: https://w3id.org/linkml/
  dcat: http://www.w3.org/ns/dcat#
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  sepses_cve: http://w3id.org/sepses/vocab/ref/cve#
  skos: http://www.w3.org/2004/02/skos/core#
  wd: http://www.wikidata.org/entity/
  wdt: http://www.wikidata.org/prop/direct/
default_prefix: kev_catalog
default_range: string
imports:
- linkml:types
- lokf
classes:
  KevCatalog:
    description: One published release of the KEV catalog, with the entries it lists.
    class_uri: kev_catalog:KevCatalog
    comments:
    - 'Each release is a whole file: the catalog is republished as a new file, with a new catalogVersion
      and dateReleased, when an entry is added or changed.'
    - CISA's objects are open, so a key the schema does not name passes CISA's JSON schema. This class
      is closed, so a new key fails here until the schema names it.
    notes:
    - DCAT 3 defines dcat:Catalog as a curated collection of metadata about resources such as datasets,
      and an entry here describes a vulnerability, so that mapping is only related despite the shared
      word. A KEV release is a kind of dataset, so dcat:Dataset and schema:Dataset are broader terms,
      not equivalents.
    - Wikidata's Q125498394 is the KEV catalog itself, and SPDX 3.0.1's ExploitCatalogType/kev is its
      name for that catalog as a kind of exploit catalog. A class here is one release of it, so both are
      only related.
    broad_mappings:
    - dcat:Dataset
    - schema:Dataset
    related_mappings:
    - dcat:Catalog
    - wd:Q125498394
    - spdx3:Security/ExploitCatalogType/kev
    see_also:
    - https://www.w3.org/TR/vocab-dcat-3/#Class:Dataset
    - https://schema.org/Dataset
    - https://www.wikidata.org/wiki/Q125498394
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/ExploitCatalogType/
    annotations:
      upstream_path: '#'
    slots:
    - kev_title
    - catalogVersion
    - dateReleased
    - count
    - vulnerabilities
    is_a: Concept
  KevVulnerability:
    description: One entry of the KEV catalog, naming a CVE that CISA lists as exploited and the action
      it asks for by a due date.
    class_uri: kev_catalog:KevVulnerability
    comments:
    - 'Four keys are optional in CISA''s JSON schema though every entry of the pinned catalogue carries
      them: knownRansomwareCampaignUse, forensicTriage, notes and cwes. The schema follows CISA''s JSON
      schema.'
    notes:
    - An entry is a statement in a catalog about a vulnerability, not the vulnerability itself. Wikidata's
      Q631425, STIX's vulnerability object and SPDX 3.0.1's Security/Vulnerability describe the weakness
      and carry nothing about exploitation or a required action, so each is only related. SPDX 3.0.1's
      Security/ExploitCatalogVulnAssessmentRelationship says that a vulnerability is listed in an exploit
      catalog, and names KEV as one, so it is close. dcat:CatalogRecord is related, since DCAT's record
      registers a dataset or a service.
    close_mappings:
    - spdx3:Security/ExploitCatalogVulnAssessmentRelationship
    related_mappings:
    - wd:Q631425
    - stix:StixVulnerability
    - spdx3:Security/Vulnerability
    - sepses_cve:CVE
    - dcat:CatalogRecord
    - cve:CveRecord
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/ExploitCatalogVulnAssessmentRelationship/
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/Vulnerability/
    - https://www.wikidata.org/wiki/Q631425
    - https://www.w3.org/TR/vocab-dcat-3/#Class:Catalog_Record
    annotations:
      upstream_path: '#/$defs/vulnerability'
    slots:
    - id
    - vendorProject
    - product
    - vulnerabilityName
    - dateAdded
    - shortDescription
    - requiredAction
    - dueDate
    - knownRansomwareCampaignUse
    - forensicTriage
    - notes
    - cwes
    is_a: Concept
slots:
  kev_title:
    description: The catalog's human-readable name.
    range: string
    slot_uri: kev_catalog:title
    comments:
    - Every KEV file carries this key, though CISA's JSON schema lists it under no property. It is optional
      here for that reason.
    exact_mappings:
    - dcterms:title
    annotations:
      upstream_file_key: title
    aliases:
    - title
  catalogVersion:
    description: The version label of this release of the catalog.
    range: string
    required: true
    slot_uri: kev_catalog:catalogVersion
    comments:
    - The value reads as a date, such as 2026.10.30, but CISA states only a string, so no pattern is given.
    examples:
    - value: 2026.10.30
    exact_mappings:
    - dcat:version
    close_mappings:
    - schema:version
    see_also:
    - https://www.w3.org/TR/vocab-dcat-3/#Property:resource_version
    annotations:
      upstream_path: '#/properties/catalogVersion'
  dateReleased:
    description: The date and time this release of the catalog came out.
    range: datetime
    required: true
    slot_uri: kev_catalog:dateReleased
    examples:
    - value: '2026-10-30T17:02:45.3665Z'
    notes:
    - DCAT 3's dcterms:issued is a resource's first known date of issuance. CISA's value moves with each
      release of a living catalog, so the mapping is close, not exact.
    close_mappings:
    - dcterms:issued
    - schema:datePublished
    see_also:
    - https://www.w3.org/TR/vocab-dcat-3/#Property:resource_release_date
    annotations:
      upstream_path: '#/properties/dateReleased'
  count:
    description: How many entries CISA says the catalog holds.
    range: integer
    required: true
    slot_uri: kev_catalog:count
    comments:
    - CISA calls this the catalog's total. No validator here compares it with the list; tests/test_data.py
      does that in Python, over the examples and the pinned catalogue.
    notes:
    - schema.org's numberOfItems is declared on ItemList, not Dataset, so the mapping is only related.
    related_mappings:
    - schema:numberOfItems
    annotations:
      upstream_path: '#/properties/count'
  vulnerabilities:
    description: The entries this release of the catalog lists.
    range: KevVulnerability
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: true
    slot_uri: kev_catalog:vulnerabilities
    broad_mappings:
    - dcterms:hasPart
    annotations:
      upstream_path: '#/properties/vulnerabilities'
  vendorProject:
    description: The vendor or project behind the affected product, as CISA names it.
    range: string
    required: true
    slot_uri: kev_catalog:vendorProject
    examples:
    - value: Apache
    notes:
    - 'Close, not exact: both name who is responsible for the product, but in the sample of 120 entries
      the value matched the affected vendor that a CVE Numbering Authority (CNA) wrote on only 54, as
      CNAs often write a longer legal name or n/a.'
    close_mappings:
    - cve:vendor
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/vendorProject'
  product:
    description: The affected product, as CISA names it.
    range: string
    required: true
    slot_uri: kev_catalog:product
    examples:
    - value: Log4j2
    notes:
    - 'Close, not exact: both name the affected product, but in the sample of 120 entries the value matched
      a CNA''s affected product on only 14, as CNAs often name a release line or write n/a.'
    close_mappings:
    - cve:product
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/product'
  vulnerabilityName:
    description: The name CISA gives the vulnerability.
    range: string
    required: true
    slot_uri: kev_catalog:vulnerabilityName
    notes:
    - 'Related: this is CISA''s own wording. In the sample of 120 entries only 39 CVE records had a CNA
      title at all, and 2 of those equalled it.'
    related_mappings:
    - cve:title
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/vulnerabilityName'
  dateAdded:
    description: The day CISA added the vulnerability to the catalog.
    range: date
    required: true
    slot_uri: kev_catalog:dateAdded
    examples:
    - value: '2021-12-10'
    notes:
    - 'DCAT 3 uses dcterms:issued on a catalog record for the date of listing, of a dataset or service.
      An entry here lists a vulnerability, so the mapping is close. A CVE record repeats this date in
      CISA''s ADP container, in a metric of type kev: on all 120 of the sample it was equal. That metric''s
      content is free-form, so no slot mapping reaches it.'
    close_mappings:
    - dcterms:issued
    see_also:
    - https://www.w3.org/TR/vocab-dcat-3/#Property:record_listing_date
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/dateAdded'
  shortDescription:
    description: A brief account of the vulnerability, in CISA's words.
    range: string
    required: true
    slot_uri: kev_catalog:shortDescription
    notes:
    - 'Related: this is CISA''s own account. In the sample of 120 entries none equalled a description
      in the CVE record''s CNA container.'
    related_mappings:
    - cve:descriptions
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/shortDescription'
  requiredAction:
    description: What CISA says must be done about the vulnerability.
    range: string
    required: true
    slot_uri: kev_catalog:requiredAction
    comments:
    - Free text. Older entries' text may name a directive since replaced, and the schema leaves the text
      as CISA wrote it.
    notes:
    - 'Related: a CVE record''s solutions say what a CNA offers as a fix, and this says what CISA requires,
      often by pointing to the vendor''s instructions. STIX''s course-of-action is a kind of object, not
      a key, so no slot mapping reaches it.'
    related_mappings:
    - cve:solutions
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/requiredAction'
  dueDate:
    description: The day by which CISA wants the required action done.
    range: date
    required: true
    slot_uri: kev_catalog:dueDate
    examples:
    - value: '2021-12-24'
    comments:
    - CISA states no relation between this and dateAdded, so the schema adds none.
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/dueDate'
  knownRansomwareCampaignUse:
    description: Whether CISA knows of the vulnerability's use in a ransomware campaign.
    range: KevRansomwareCampaignUse
    slot_uri: kev_catalog:knownRansomwareCampaignUse
    comments:
    - CISA types this as a string and names its two values only in the property's description, so the
      enum rests on that sentence and on the pinned catalogue.
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/knownRansomwareCampaignUse'
  forensicTriage:
    description: Whether the vulnerability calls for forensic triage under BOD 26-04.
    range: KevForensicTriage
    slot_uri: kev_catalog:forensicTriage
    comments:
    - CISA types this as a string and names its two values only in the property's description, so the
      enum rests on that sentence and on the pinned catalogue.
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/forensicTriage'
  notes:
    description: Anything else CISA adds about the entry, as free text.
    range: string
    slot_uri: kev_catalog:notes
    comments:
    - Often holds addresses separated by " ; ", with empty places between them. The schema keeps it one
      string and parses nothing, since CISA states no form for it. Those addresses are third parties',
      under their own terms.
    close_mappings:
    - skos:note
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/notes'
  cwes:
    description: The CWE codes CISA associates with the vulnerability.
    range: string
    multivalued: true
    pattern: ^CWE-([0-9])+$
    slot_uri: kev_catalog:cwes
    examples:
    - value: CWE-502
    comments:
    - The list may be empty, as it is on some entries of the pinned catalogue.
    notes:
    - 'Close, not exact: both give an entry''s CWE codes, but in the sample of 120 entries the list equalled
      the codes of the CVE record''s CNA and ADP containers together on 94. SEPSES''s hasCWE links a CVE
      to a CWE resource, not a code, so it is only related. Wikidata''s P3624 holds the CWE number alone,
      without the CWE- prefix CISA writes, so it is close.'
    close_mappings:
    - cve:cweId
    - wdt:P3624
    related_mappings:
    - sepses_cve:hasCWE
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/cwes'
enums:
  KevRansomwareCampaignUse:
    description: What CISA can say about a vulnerability's use in ransomware campaigns.
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/knownRansomwareCampaignUse'
    permissible_values:
      Known:
        description: CISA knows of a ransomware campaign that has used it.
      Unknown:
        description: CISA has no confirmation that a ransomware campaign has used it.
  KevForensicTriage:
    description: Whether BOD 26-04 calls for forensic triage of a vulnerability.
    annotations:
      upstream_path: '#/$defs/vulnerability/properties/forensicTriage'
    permissible_values:
      'Yes':
        description: The directive calls for forensic triage of this vulnerability.
      'No':
        description: The directive does not call for forensic triage of this vulnerability.

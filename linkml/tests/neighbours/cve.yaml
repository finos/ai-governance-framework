    description: How much of one security property an attack could cost.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/ciaType imports/cvss/cvss-v3.1.json#/definitions/ciaType
        imports/cvss/cvss-v4.0.json#/definitions/vulnCiaType imports/cvss/cvss-v4.0.json#/definitions/subCiaType
    permissible_values:
      NONE:
        description: Nothing is lost.
      LOW:
        description: Some is lost, with limited consequences.
      HIGH:
        description: All of it is lost, or the loss has serious consequences.
  CvssModifiedImpact:
    description: The impact on one security property as the scorer's environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/modifiedCiaType imports/cvss/cvss-v3.1.json#/definitions/modifiedCiaType
        imports/cvss/cvss-v4.0.json#/definitions/modifiedVulnCiaType imports/cvss/cvss-v4.0.json#/definitions/modifiedSubCType

  CveRecord:
    abstract: true
    children_are_mutually_disjoint: true
    description: A record of one vulnerability under one CVE identifier, in the CVE Program's format.
    comments:
    - Its two kinds are told apart by cveMetadata's state, nested inside the record, so LinkML's type
      designator cannot choose between them. A reader picks the class from the state, or validates against
      CveRecordRoot.
    - wd:Q631425 is the idea of a vulnerability, which a record describes and is not, so that mapping
      is only related. SEPSES, SPDX and STIX each have a class for the description of one vulnerability,
      so those are close.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf
    close_mappings:
    - sepses_cve:CVE
    - spdx_security:Vulnerability
    - stix:StixVulnerability
    related_mappings:
    - wd:Q631425
    slots:
    - cveMetadata
    - containers
    attributes:
      dataType:
        description: The kind of document this is, which is always a CVE record.
        range: CveDataType
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/dataType
      dataVersion:
        description: The version of the record format that this record follows.
        range: cve_data_version
        required: true
        comments:
        - The upstream gives 5.2.0 as a default, which cannot apply to a required key.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/dataVersion
    is_a: Concept
  CvePublishedRecord:
    is_a: CveRecord
    description: A record whose assigning organisation has filled it in and made it public.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/0
    slot_usage:
      cveMetadata:
        range: CveMetadataPublished
      containers:
        range: CvePublishedContainers
  CveRejectedRecord:
    is_a: CveRecord
    description: A record that should no longer be used, kept so that people can see it is invalid.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/1
    slot_usage:
      cveMetadata:
        range: CveMetadataRejected
      containers:
        range: CveRejectedContainers
  CveRecordMetadata:
    abstract: true
    children_are_mutually_disjoint: true
    description: The facts about a record itself, as distinct from the vulnerability it describes.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished CVE_Record_Format.json#/definitions/cveMetadataRejected
    slots:
    - dateUpdated
    - state
    attributes:
      cveId:
        description: The CVE identifier that the record belongs to.
        range: cve_identifier
        required: true
        comments:
        - Wikidata's P3587 holds the same identifier in the same form, on the item for the vulnerability,
          so it is exact. The Dublin Core and schema.org terms are any identifier, so they are broader.
        exact_mappings:
        - wdt:P3587
        broad_mappings:
        - dcterms:identifier
        - schema:identifier
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/cveId
      assignerOrgId:
        description: The UUID of the organisation that was given the CVE identifier.
        range: cve_uuid
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/assignerOrgId
      assignerShortName:
        description: The short name of the organisation that was given the CVE identifier.
        range: cve_short_name
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/assignerShortName
      serial:
        description: A counter that the system of record raises each time a provider changes the record.
        range: integer
        minimum_value: 1
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/serial
      dateReserved:
        description: When the CVE identifier was reserved.
        range: cve_timestamp
        comments:
        - This says nothing about when the flaw was found, reported or disclosed.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/dateReserved
      datePublished:
        description: When the record first appeared in the CVE List.
        range: cve_timestamp
        close_mappings:
        - dcterms:issued
        - schema:datePublished
        - spdx_security:publishedTime
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/datePublished
  CveMetadataPublished:
    is_a: CveRecordMetadata
    description: The metadata of a published record.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished
    slot_usage:
      state:
        range: CvePublishedState
    attributes:
      requesterUserId:
        description: The UUID of the user who asked for the CVE identifier.
        range: cve_uuid
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/requesterUserId
  CveMetadataRejected:
    is_a: CveRecordMetadata
    description: The metadata of a rejected record.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataRejected
    slot_usage:
      state:
        range: CveRejectedState
    attributes:
      dateRejected:
        description: When the CVE identifier was rejected.
        range: cve_timestamp
        close_mappings:
        - spdx_security:withdrawnTime
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/dateRejected
  CveContainers:
    abstract: true
    children_are_mutually_disjoint: true
    description: The sets of vulnerability information in a record, one per providing organisation.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/0/properties/containers CVE_Record_Format.json#/oneOf/1/properties/containers
    slots:
    - cna
  CvePublishedContainers:
    is_a: CveContainers
    description: The containers of a published record, the assigning organisation's and any others'.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/0/properties/containers
    slot_usage:
      cna:
        range: CveCnaPublishedContainer
    attributes:
      adp:
        description: The containers added by Authorized Data Publishers.
        range: CveAdpContainer
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/oneOf/0/properties/containers/properties/adp
  CveRejectedContainers:
    is_a: CveContainers
    description: The container of a rejected record, which only the assigning organisation provides.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/1/properties/containers
    slot_usage:
      cna:
        range: CveCnaRejectedContainer
  CveProviderMetadata:
    description: Who provided a container, and when it was last updated.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/providerMetadata
    slots:
    - dateUpdated
    attributes:
      orgId:
        description: The UUID of the organisation that provided the container.
        range: cve_uuid
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/providerMetadata/properties/orgId
      shortName:
        description: The short name of the organisation that provided the container.
        range: cve_short_name
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/providerMetadata/properties/shortName
  CveCnaContainer:
    abstract: true
    children_are_mutually_disjoint: true
    description: The container from the CVE Numbering Authority that assigned the identifier.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer CVE_Record_Format.json#/definitions/cnaRejectedContainer
    slots:
    - providerMetadata
  CveCnaPublishedContainer:
    is_a: CveCnaContainer
    description: The assigning authority's account of a published vulnerability.
    extra_slots:
      allowed: true
    comments:
    - It accepts keys of the publisher's own, whose names must begin x_ and hold no full stop. JSON Schema
      from LinkML 1.12.1 cannot state that rule on a name, so tests/cve_rules.py checks each extra key.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer
    slots:
    - datePublic
    - cve_title
    - descriptions
    - affected
    - cpeApplicability
    - problemTypes
    - cve_references
    - impacts
    - metrics
    - configurations
    - workarounds
    - solutions
    - exploits
    - timeline
    - credits
    - cve_source
    - cve_tags
    - taxonomyMappings
    slot_usage:
      descriptions:
        required: true
        minimum_cardinality: 1
        list_elements_unique: true
        has_member:
          range_expression:
            slot_conditions:
              lang:
                range: cve_english_language
                required: true
      affected:
        required: true
      cve_references:
        required: true
      cve_tags:
        any_of:
        - range: CveCnaTag
        - range: cve_tag_extension
    attributes:
      dateAssigned:
        description: When the authority tied the CVE identifier to a vulnerability.
        range: cve_timestamp
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/dateAssigned
  CveCnaRejectedContainer:
    is_a: CveCnaContainer
    description: The assigning authority's account of why a record was rejected.
    extra_slots:
      allowed: true
    comments:
    - It accepts keys of the publisher's own, whose names must begin x_ and hold no full stop. tests/cve_rules.py
      checks each extra key.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaRejectedContainer
    attributes:
      rejectedReasons:
        description: Why the record was rejected, in one or more languages.
        range: CveDescription
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        has_member:
          range_expression:
            slot_conditions:
              lang:
                range: cve_english_language
                required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cnaRejectedContainer/properties/rejectedReasons
      replacedBy:
        description: The CVE identifiers to use instead of this one.
        range: cve_identifier
        multivalued: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cnaRejectedContainer/properties/replacedBy
  CveAdpContainer:
    description: What an Authorized Data Publisher adds to a record beside the assigning authority's account.
    extra_slots:
      allowed: true
    comments:
    - It accepts keys of the publisher's own, whose names must begin x_ and hold no full stop, and it
      must hold something beside providerMetadata. tests/cve_rules.py checks both, since LinkML 1.12.1
      can state neither.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/adpContainer
    slots:
    - providerMetadata
    - datePublic
    - cve_title
    - descriptions
    - affected
    - cpeApplicability
    - problemTypes
    - cve_references
    - impacts
    - metrics
    - configurations
    - workarounds
    - solutions
    - exploits
    - timeline
    - credits
    - cve_source
    - cve_tags
    - taxonomyMappings
    slot_usage:
      descriptions:
        minimum_cardinality: 1
        list_elements_unique: true
        has_member:
          range_expression:
            slot_conditions:
              lang:
                range: cve_english_language
                required: true
      cve_tags:
        any_of:
        - range: CveAdpTag
        - range: cve_tag_extension
  CveProduct:
    description: One affected product or package, and which of its versions are affected.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product
    all_of:
    - any_of:
      - slot_conditions:
          vendor:
            value_presence: PRESENT
          product:
            value_presence: PRESENT
      - slot_conditions:
          collectionURL:
            value_presence: PRESENT
          packageName:
            value_presence: PRESENT
    - any_of:
      - slot_conditions:
          versions:
            value_presence: PRESENT
      - slot_conditions:
          defaultStatus:
            value_presence: PRESENT
    attributes:
      vendor:
        description: Who makes or maintains the product. It can be N/A.
        range: cve_text_512
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/vendor
      product:
        description: The name of the affected product.
        range: cve_text_2048
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/product
      collectionURL:
        description: The address of the package collection that gives packageName its meaning.
        range: cve_uri
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/collectionURL
      packageName:
        description: The package's name or identifier within its collection.
        range: cve_text_2048
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/packageName
      packageURL:
        description: A Package URL for the package, with no version in it.
        range: cve_uri
        close_mappings:
        - spdx_software:packageUrl
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/packageURL
      cpes:
        description: Common Platform Enumeration names for the product.
        range: cve_cpe22and23
        multivalued: true
        list_elements_unique: true
        close_mappings:
        - sepses_cve:hasCPE
        related_mappings:
        - spdx_core:ExternalIdentifierType/cpe23
        comments:
        - The upstream suggests cpeApplicability for new records.
        - SPDX 3.0.1 names CPE 2.3 as one kind of external identifier, and this field also admits the
          2.2 form, so that term is only related.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/cpes
      modules:
        description: The affected parts of the product, such as components, commands or APIs.
        range: cve_text_4096
        multivalued: true
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/modules
      programFiles:
        description: The affected source files.
        range: cve_text_1024
        multivalued: true
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/programFiles
      programRoutines:
        description: The affected functions or similar routines in the source.
        range: CveProgramRoutine
        multivalued: true
        inlined_as_list: true
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/programRoutines
      platforms:
        description: The platforms the flaw is limited to. Without this, it applies to all of them.
        range: cve_text_up_to_1024
        multivalued: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/platforms
      repo:
        description: The address of the product's source code repository.
        range: cve_uri
        close_mappings:
        - schema:codeRepository
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/repo
      defaultStatus:
        description: The status of every version the versions list does not cover.
        range: CveVersionStatus
        comments:
        - Left out, it reads as unknown, as the upstream's text says.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/defaultStatus
      versions:
        description: The versions or ranges of versions, each with its status.
        range: CveProductVersion
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions
  CveProgramRoutine:
    description: One affected function, method or similar routine in the source.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product/properties/programRoutines/items
    slots:
    - cve_name
    slot_usage:
      cve_name:
        range: cve_text_4096
        required: true
  CveProductVersion:
    description: A single version or a stretch of versions, and whether it is affected.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items
    slots:
    - cve_version
    - cve_status
    slot_usage:
      cve_version:
        range: cve_version
        required: true
      cve_status:
        required: true
    rules:
    - title: a range below a limit names its version type
      description: An entry with lessThan also has versionType.
      preconditions:
        slot_conditions:
          lessThan:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          versionType:
            value_presence: PRESENT
    - title: a range up to a limit names its version type
      description: An entry with lessThanOrEqual also has versionType.
      preconditions:
        slot_conditions:
          lessThanOrEqual:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          versionType:
            value_presence: PRESENT
    - title: a range has one upper limit
      description: An entry with lessThan has no lessThanOrEqual.
      preconditions:
        slot_conditions:
          lessThan:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          lessThanOrEqual:
            value_presence: ABSENT
    - title: status changes belong to a range
      description: An entry with changes also has lessThan or lessThanOrEqual.
      preconditions:
        slot_conditions:
          changes:
            value_presence: PRESENT
      postconditions:
        any_of:
        - slot_conditions:
            lessThan:
              value_presence: PRESENT
        - slot_conditions:
            lessThanOrEqual:
              value_presence: PRESENT
    attributes:
      versionType:
        description: The numbering system that says how these versions compare, such as semver or git.
        range: cve_text_128
        comments:
        - The upstream lists examples, not a closed list, so this is free text.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/versionType
      lessThan:
        description: The first version above the range, which is not itself in it.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/lessThan
      lessThanOrEqual:
        description: The last version in the range.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/lessThanOrEqual
      changes:
        description: The points within the range where the status changes.
        range: CveVersionChange
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        comments:
        - A reader must sort them, as the upstream says the order cannot be trusted.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/changes
  CveVersionChange:
    description: A point in a range of versions from which the status changes.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/changes/items
    slots:
    - cve_at
    - cve_status
    slot_usage:
      cve_at:
        required: true
      cve_status:
        required: true
  CveCpeApplicabilityElement:
    description: A statement in the CPE Applicability Language of which platforms are affected.
    extra_slots:
      allowed: true
    comments:
    - The upstream does not close this object, so other keys are allowed.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cpeApplicabilityElement
    close_mappings:
    - sepses_cve:VulnerableConfiguration
    slots:
    - operator
    - negate
    attributes:
      nodes:
        description: The groups of matches that the statement combines.
        range: CveCpeNode
        required: true
        multivalued: true
        inlined_as_list: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpeApplicabilityElement/properties/nodes
  CveCpeNode:
    description: A group of CPE matches, combined by an operator.
    extra_slots:
      allowed: true
    comments:
    - The upstream does not close this object, so other keys are allowed.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cpe_node
    slots:
    - operator
    - negate
    slot_usage:
      operator:
        required: true
    attributes:
      cpeMatch:
        description: The CPE matches in the group.
        range: CveCpeMatch
        required: true
        multivalued: true
        inlined_as_list: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_node/properties/cpeMatch
  CveCpeMatch:
    description: One CPE name, optionally bounded by versions, and whether it is vulnerable.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cpe_match
    attributes:
      vulnerable:
        description: Whether what this match covers is vulnerable.
        range: boolean
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/vulnerable
      criteria:
        description: The CPE name to match.
        range: cve_cpe23
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/criteria
      matchCriteriaId:
        description: A UUID for this match.
        range: cve_uuid
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/matchCriteriaId
      versionStartExcluding:
        description: The version the match starts just above.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/versionStartExcluding
      versionStartIncluding:
        description: The version the match starts at.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/versionStartIncluding
      versionEndExcluding:
        description: The version the match ends just below.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/versionEndExcluding
      versionEndIncluding:
        description: The version the match ends at.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/versionEndIncluding
  CveDescription:
    description: A piece of text in one language, with any media that support it.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/description
    slots:
    - lang
    - value
    slot_usage:
      lang:
        required: true
      value:
        range: cve_text_4096
        required: true
    attributes:
      supportingMedia:
        description: Richer forms of the text, such as Markdown or an image.
        range: CveSupportingMedia
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/description/properties/supportingMedia
  CveSupportingMedia:
    description: A richer form of a description, as a media type and its content.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items
    slots:
    - cve_type
    - value
    slot_usage:
      cve_type:
        range: cve_text_256
        required: true
      value:
        range: cve_text_16384
        required: true
    attributes:
      base64:
        description: Whether value is base64 encoded rather than plain UTF-8.
        range: boolean
        ifabsent: 'false'
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items/properties/base64
  CveProblemType:
    description: One kind of problem the vulnerability is, in one or more languages.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/problemTypes/items
    slots:
    - descriptions
    slot_usage:
      descriptions:
        range: CveProblemTypeDescription
        required: true
        minimum_cardinality: 1
        list_elements_unique: true
  CveProblemTypeDescription:
    description: A problem type described in one language, often by a weakness identifier and its title.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items
    slots:
    - lang
    - cve_description
    - cve_type
    - cve_references
    slot_usage:
      lang:
        required: true
      cve_description:
        range: cve_text_4096
        required: true
      cve_type:
        range: cve_text_128
    attributes:
      cweId:
        description: The Common Weakness Enumeration identifier that best fits, such as CWE-79.
        pattern: ^CWE-[1-9][0-9]*$
        comments:
        - The upstream also allows it 5 to 9 characters. tests/cve_rules.py checks the length.
        - Wikidata's P3624 holds the CWE number alone, without the CWE- prefix the format writes, so it
          is close.
        close_mappings:
        - wdt:P3624
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items/properties/cweId
  CveReference:
    description: A link to something about the vulnerability, such as an advisory or a patch.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/reference
    close_mappings:
    - sepses_cve:Reference
    - stix:StixExternalReference
    slots:
    - cve_url
    - cve_name
    - cve_tags
    slot_usage:
      cve_url:
        required: true
      cve_name:
        range: cve_text_512
      cve_tags:
        any_of:
        - range: CveReferenceTag
        - range: cve_tag_extension
  CveImpact:
    description: A consequence of the vulnerability, in words.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/impacts/items
    slots:
    - descriptions
    slot_usage:
      descriptions:
        required: true
        minimum_cardinality: 1
        list_elements_unique: true
        has_member:
          range_expression:
            slot_conditions:
              lang:
                range: cve_english_language
                required: true
    attributes:
      capecId:
        description: The Common Attack Pattern Enumeration identifier that best fits, such as CAPEC-63.
        pattern: ^CAPEC-[1-9][0-9]{0,4}$
        comments:
        - The upstream also allows it 7 to 11 characters. tests/cve_rules.py checks the length.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/impacts/items/properties/capecId
  CveMetric:
    description: One scoring of the vulnerability, in a CVSS version or another format, and where it applies.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics/items
    any_of:
    - slot_conditions:
        cvssV4_0:
          value_presence: PRESENT
    - slot_conditions:
        cvssV3_1:
          value_presence: PRESENT
    - slot_conditions:
        cvssV3_0:
          value_presence: PRESENT
    - slot_conditions:
        cvssV2_0:
          value_presence: PRESENT
    - slot_conditions:
        other:
          value_presence: PRESENT
    attributes:
      format:
        description: The name of the scoring format.
        range: cve_text_64
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/format
      scenarios:
        description: The situations this scoring applies to.
        range: CveMetricScenario
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/scenarios
      cvssV4_0:
        description: A score under CVSS version 4.0.
        range: CvssV40
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV4_0
      cvssV3_1:
        description: A score under CVSS version 3.1.
        range: CvssV31
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV3_1
      cvssV3_0:
        description: A score under CVSS version 3.0.
        range: CvssV30
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV3_0
      cvssV2_0:
        description: A score under CVSS version 2.0.
        range: CvssV20
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV2_0
      other:
        description: A score or impact statement in some other format.
        range: CveOtherMetric
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/other
  CveMetricScenario:
    description: A situation a scoring applies to, in one language.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/scenarios/items
    slots:
    - lang
    - value
    slot_usage:
      lang:
        required: true
      value:
        range: cve_text_4096
        required: true
  CveOtherMetric:
    description: A score or impact statement in a format the record format does not name.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/other
    slots:
    - cve_type
    slot_usage:
      cve_type:
        range: cve_text_128
        required: true
    attributes:
      content:
        description: The statement itself, as an object in whatever shape its format has.
        range: CveOtherMetricContent
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/other/properties/content
  CveOtherMetricContent:
    description: The free-form object inside a metric of another format.
    extra_slots:
      allowed: true
    comments:
    - The upstream asks for at least one key, which tests/cve_rules.py checks.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/other/properties/content
  CveTimelineEvent:
    description: One dated event in the vulnerability's history.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/timeline/items
    slots:
    - lang
    - value
    slot_usage:
      lang:
        required: true
      value:
        range: cve_text_4096
        required: true
    attributes:
      time:
        description: When the event happened.
        range: cve_timestamp
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/timeline/items/properties/time
  CveCredit:
    description: Thanks to someone who helped, in one language.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/credits/items
    slots:
    - lang
    - value
    - cve_type
    slot_usage:
      lang:
        required: true
      value:
        range: cve_text_4096
        required: true
      cve_type:
        range: CveCreditType
        ifabsent: CveCreditType(finder)
    attributes:
      user:
        description: The UUID of the credited person, when the CVE user registry holds them.
        range: cve_uuid
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/credits/items/properties/user
  CveSource:
    description: How the vulnerability came to light, as an object the provider shapes as it likes.
    extra_slots:
      allowed: true
    comments:
    - The upstream asks for at least one key, which tests/cve_rules.py checks.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/source
  CveTaxonomyMapping:
    description: How the vulnerability relates to one version of an outside taxonomy.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items
    attributes:
      taxonomyName:
        description: The name of the taxonomy, such as ATT&CK or CWE.
        range: cve_text_128
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyName
      taxonomyVersion:
        description: The version of the taxonomy.
        range: cve_text_128
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyVersion
      taxonomyRelations:
        description: The relationships to items in the taxonomy.
        range: CveTaxonomyRelation
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations
  CveTaxonomyRelation:
    description: One relationship from an item in a taxonomy to this CVE or to another item.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items
    attributes:
      taxonomyId:
        description: The item in the taxonomy, which is the relationship's subject.
        range: cve_text_2048
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/taxonomyId
      relationshipName:
        description: What the relationship is.
        range: cve_text_128
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/relationshipName
      relationshipValue:
        description: The relationship's target, which is this CVE identifier or another taxonomy item.
        range: cve_text_2048
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/relationshipValue
  CveRecordRoot:
    description: Any one CVE record, published or rejected, as a file or an API answer holds it.
    extra_slots:
      allowed: true
    comments:
    - It has no keys of its own, and a record must be exactly one of the two kinds, each of which is closed.
      So a rejected state with a published container fails.
    annotations:
      upstream_path: CVE_Record_Format.json#/
    exactly_one_of:
    - is_a: CvePublishedRecord
    - is_a: CveRejectedRecord
slots:
  cve_version:
    description: A version string. On a score it is the CVSS version; on a product entry, the product's.
    slot_uri: cve:version
    comments:
    - Each class that uses it narrows it. A top-level slot, so that lokf adapt renames it beside LOKF's
      version.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/version imports/cvss/cvss-v3.0.json#/properties/version
        imports/cvss/cvss-v3.1.json#/properties/version imports/cvss/cvss-v4.0.json#/properties/version
    aliases:
    - version
  vectorString:
    description: The scores' metric values written as one compact string.
    required: true
    close_mappings:
    - sepses_cvss:vectorString
    - spdx_security:vectorString
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/vectorString imports/cvss/cvss-v3.0.json#/properties/vectorString
        imports/cvss/cvss-v3.1.json#/properties/vectorString imports/cvss/cvss-v4.0.json#/properties/vectorString
  baseScore:
    description: The score from 0 to 10 for what is inherent in the flaw.
    range: float
    required: true
    minimum_value: 0
    maximum_value: 10
    close_mappings:
    - sepses_cvss:baseScore
    - spdx_security:score
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/scoreType imports/cvss/cvss-v3.0.json#/definitions/scoreType
        imports/cvss/cvss-v3.1.json#/definitions/scoreType imports/cvss/cvss-v4.0.json#/definitions/scoreType
  baseSeverity:
    description: The rating in words that the base score falls under.
    range: CvssSeverity
    required: true
    close_mappings:
    - sepses_cvss:baseSeverity
    - spdx_security:severity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/baseSeverity imports/cvss/cvss-v3.1.json#/properties/baseSeverity
        imports/cvss/cvss-v4.0.json#/properties/baseSeverity
  temporalScore:
    description: The base score adjusted for what changes over time, such as a fix appearing.
    range: float
    minimum_value: 0
    maximum_value: 10
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/temporalScore imports/cvss/cvss-v3.0.json#/properties/temporalScore
        imports/cvss/cvss-v3.1.json#/properties/temporalScore
  temporalSeverity:
    description: The rating in words for the temporal score.
    range: CvssSeverity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/temporalSeverity imports/cvss/cvss-v3.1.json#/properties/temporalSeverity
  environmentalScore:
    description: The score adjusted for the scorer's own environment.
    range: float
    minimum_value: 0
    maximum_value: 10
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/environmentalScore imports/cvss/cvss-v3.0.json#/properties/environmentalScore
        imports/cvss/cvss-v3.1.json#/properties/environmentalScore
  environmentalSeverity:
    description: The rating in words for the environmental score.
    range: CvssSeverity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/environmentalSeverity imports/cvss/cvss-v3.1.json#/properties/environmentalSeverity
  attackVector:
    description: How far away an attacker can be when using the flaw.
    close_mappings:
    - sepses_cvss:attackVector
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/attackVector imports/cvss/cvss-v3.1.json#/properties/attackVector
        imports/cvss/cvss-v4.0.json#/properties/attackVector
  attackComplexity:
    description: How much is outside the attacker's control when using the flaw.
    close_mappings:
    - sepses_cvss:attackComplexity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/attackComplexity imports/cvss/cvss-v3.1.json#/properties/attackComplexity
        imports/cvss/cvss-v4.0.json#/properties/attackComplexity
  privilegesRequired:
    description: What level of access an attacker needs before using the flaw.
    close_mappings:
    - sepses_cvss:privilegesRequired
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/privilegesRequired imports/cvss/cvss-v3.1.json#/properties/privilegesRequired
        imports/cvss/cvss-v4.0.json#/properties/privilegesRequired
  userInteraction:
    description: Whether someone other than the attacker has to take part.
    close_mappings:
    - sepses_cvss:userInteraction
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/userInteraction imports/cvss/cvss-v3.1.json#/properties/userInteraction
        imports/cvss/cvss-v4.0.json#/properties/userInteraction
  scope:
    description: Whether an attack can reach beyond the component that holds the flaw.
    range: CvssV3Scope
    close_mappings:
    - sepses_cvss:scope
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/scope imports/cvss/cvss-v3.1.json#/properties/scope
  confidentialityImpact:
    description: How much information an attack could expose.
    close_mappings:
    - sepses_cvss:confidentialityImpact
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/confidentialityImpact imports/cvss/cvss-v3.0.json#/properties/confidentialityImpact
        imports/cvss/cvss-v3.1.json#/properties/confidentialityImpact
  integrityImpact:
    description: How much an attack could change that should not change.
    close_mappings:
    - sepses_cvss:integrityImpact
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/integrityImpact imports/cvss/cvss-v3.0.json#/properties/integrityImpact
        imports/cvss/cvss-v3.1.json#/properties/integrityImpact
  availabilityImpact:
    description: How much an attack could disrupt the service.
    close_mappings:
    - sepses_cvss:availabilityImpact
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/availabilityImpact imports/cvss/cvss-v3.0.json#/properties/availabilityImpact
        imports/cvss/cvss-v3.1.json#/properties/availabilityImpact
  exploitCodeMaturity:
    description: How far working attack code has come.
    range: CvssExploitCodeMaturity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/exploitCodeMaturity imports/cvss/cvss-v3.1.json#/properties/exploitCodeMaturity
  remediationLevel:
    description: What kind of fix is available.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/remediationLevel imports/cvss/cvss-v3.0.json#/properties/remediationLevel
        imports/cvss/cvss-v3.1.json#/properties/remediationLevel
  reportConfidence:
    description: How far the flaw's existence and details have been confirmed.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/reportConfidence imports/cvss/cvss-v3.0.json#/properties/reportConfidence
        imports/cvss/cvss-v3.1.json#/properties/reportConfidence
  confidentialityRequirement:
    description: How much confidentiality matters to the scorer for the affected system.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/confidentialityRequirement imports/cvss/cvss-v3.0.json#/properties/confidentialityRequirement
        imports/cvss/cvss-v3.1.json#/properties/confidentialityRequirement imports/cvss/cvss-v4.0.json#/properties/confidentialityRequirement
  integrityRequirement:
    description: How much integrity matters to the scorer for the affected system.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/integrityRequirement imports/cvss/cvss-v3.0.json#/properties/integrityRequirement
        imports/cvss/cvss-v3.1.json#/properties/integrityRequirement imports/cvss/cvss-v4.0.json#/properties/integrityRequirement
  availabilityRequirement:
    description: How much availability matters to the scorer for the affected system.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/availabilityRequirement imports/cvss/cvss-v3.0.json#/properties/availabilityRequirement
        imports/cvss/cvss-v3.1.json#/properties/availabilityRequirement imports/cvss/cvss-v4.0.json#/properties/availabilityRequirement
  modifiedAttackVector:
    description: The attack vector as the scorer's own environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedAttackVector imports/cvss/cvss-v3.1.json#/properties/modifiedAttackVector
        imports/cvss/cvss-v4.0.json#/properties/modifiedAttackVector
  modifiedAttackComplexity:
    description: The attack complexity as the scorer's own environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedAttackComplexity imports/cvss/cvss-v3.1.json#/properties/modifiedAttackComplexity
        imports/cvss/cvss-v4.0.json#/properties/modifiedAttackComplexity
  modifiedPrivilegesRequired:
    description: The privileges needed as the scorer's own environment changes them.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedPrivilegesRequired imports/cvss/cvss-v3.1.json#/properties/modifiedPrivilegesRequired
        imports/cvss/cvss-v4.0.json#/properties/modifiedPrivilegesRequired
  modifiedUserInteraction:
    description: The user interaction as the scorer's own environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedUserInteraction imports/cvss/cvss-v3.1.json#/properties/modifiedUserInteraction
        imports/cvss/cvss-v4.0.json#/properties/modifiedUserInteraction
  modifiedScope:
    description: The scope as the scorer's own environment changes it.
    range: CvssV3ModifiedScope
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedScope imports/cvss/cvss-v3.1.json#/properties/modifiedScope
  modifiedConfidentialityImpact:
    description: The confidentiality impact as the scorer's own environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedConfidentialityImpact imports/cvss/cvss-v3.1.json#/properties/modifiedConfidentialityImpact
  modifiedIntegrityImpact:
    description: The integrity impact as the scorer's own environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedIntegrityImpact imports/cvss/cvss-v3.1.json#/properties/modifiedIntegrityImpact
  modifiedAvailabilityImpact:
    description: The availability impact as the scorer's own environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedAvailabilityImpact imports/cvss/cvss-v3.1.json#/properties/modifiedAvailabilityImpact
  cveMetadata:
    description: The facts about the record itself.
    range: CveRecordMetadata
    required: true
    inlined: true
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/0/properties/cveMetadata CVE_Record_Format.json#/oneOf/1/properties/cveMetadata
  containers:
    description: The vulnerability information, grouped by who provided it.
    range: CveContainers
    required: true
    inlined: true
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/0/properties/containers CVE_Record_Format.json#/oneOf/1/properties/containers
  state:
    description: Whether the record is published or rejected.
    range: CveRecordState
    required: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/state CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/state
  dateUpdated:
    description: When the record or container was last updated.
    range: cve_timestamp
    close_mappings:
    - dcterms:modified
    - schema:dateModified
    - spdx_security:modifiedTime
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/dateUpdated CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/dateUpdated
        CVE_Record_Format.json#/definitions/providerMetadata/properties/dateUpdated
  cna:
    description: The container from the authority that assigned the identifier.
    range: CveCnaContainer
    required: true
    inlined: true
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/0/properties/containers/properties/cna CVE_Record_Format.json#/oneOf/1/properties/containers/properties/cna
  providerMetadata:
    description: Who provided the container.
    range: CveProviderMetadata
    required: true
    inlined: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/providerMetadata
        CVE_Record_Format.json#/definitions/cnaRejectedContainer/properties/providerMetadata CVE_Record_Format.json#/definitions/adpContainer/properties/providerMetadata
  datePublic:
    description: When the vulnerability was made public, if known.
    range: cve_timestamp
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/datePublic CVE_Record_Format.json#/definitions/adpContainer/properties/datePublic
  cve_title:
    description: A short headline for the record or for what the container adds.
    range: cve_text_256
    slot_uri: cve:title
    close_mappings:
    - dcterms:title
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/title CVE_Record_Format.json#/definitions/adpContainer/properties/title
    aliases:
    - title
  descriptions:
    description: The same text in one or more languages.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    close_mappings:
    - dcterms:description
    comments:
    - A list of this kind must hold at least one member in English, stated where a class uses it, since
      a problem type's own list has no such rule.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/descriptions CVE_Record_Format.json#/definitions/englishLanguageDescription
  affected:
    description: The products or packages the vulnerability affects.
    range: CveProduct
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/affected
  cpeApplicability:
    description: Statements in the CPE Applicability Language of which platforms are affected.
    range: CveCpeApplicabilityElement
    multivalued: true
    inlined_as_list: true
    close_mappings:
    - sepses_cve:hasVulnerableConfiguration
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/cpeApplicability
        CVE_Record_Format.json#/definitions/adpContainer/properties/cpeApplicability
  problemTypes:
    description: The kinds of problem the vulnerability is, such as a weakness type.
    range: CveProblemType
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/problemTypes
  cve_references:
    description: Links to more about the vulnerability.
    range: CveReference
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    maximum_cardinality: 512
    list_elements_unique: true
    slot_uri: cve:references
    close_mappings:
    - dcterms:references
    - sepses_cve:hasReference
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/references
    aliases:
    - references
  impacts:
    description: The consequences of the vulnerability, in words.
    range: CveImpact
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/impacts
  metrics:
    description: The scorings of the vulnerability.
    range: CveMetric
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    close_mappings:
    - sepses_cvss:hasCVSS
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics
  configurations:
    description: What must be set up for the vulnerability to be exploitable.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/configurations
  workarounds:
    description: Ways to reduce the risk without a full fix.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/workarounds
  solutions:
    description: Ways to fix the vulnerability.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/solutions
  exploits:
    description: What is known about attacks on the vulnerability.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/exploits
  timeline:
    description: The dated events in the vulnerability's history.
    range: CveTimelineEvent
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/timeline
  credits:
    description: Thanks to those who helped.
    range: CveCredit
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/credits
  cve_source:
    description: How the vulnerability came to light, in the provider's own shape.
    range: CveSource
    inlined: true
    slot_uri: cve:source
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/source
    aliases:
    - source
  taxonomyMappings:
    description: How the vulnerability relates to outside taxonomies.

name: cve
title: Common Vulnerabilities and Exposures (CVE) Record Format
description: A LinkML model of the CVE Record Format, in which the CVE Program publishes each vulnerability
  record, with its CVSS scores. It keeps the format's own keys and values, so a real record validates
  unchanged.
version: 5.2.0
source: https://github.com/CVEProject/cve-schema/blob/v5.2.0/schema/CVE_Record_Format.json
license: Apache-2.0
keywords:
- vulnerability
- CVE
- CVSS
- CVE Numbering Authority
- vulnerability record
see_also:
- https://lmodel.github.io/cve
- https://www.cve.org/
annotations:
  upstream_commit: 5533f6038cc0434e544e69240c704906d591de46
  upstream_published: '2025-10-29'
  upstream_licence: CC0-1.0
comments:
- The version is the edition of the format that the schema renders. upstream/ holds that edition's files
  unchanged, tests/test_coverage.py holds the schema to them, and scripts/check_upstream_release.py reports
  when the edition moves.
prefixes:
  cve: https://w3id.org/lmodel/cve/
  linkml: https://w3id.org/linkml/
  sepses_cvss: http://w3id.org/sepses/vocab/ref/cvss#

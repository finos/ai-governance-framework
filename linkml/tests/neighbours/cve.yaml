enums:
  CvssSeverity:
    description: A CVSS rating in words.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/severityType imports/cvss/cvss-v3.1.json#/definitions/severityType
        imports/cvss/cvss-v4.0.json#/definitions/severityType
    permissible_values:
      NONE:
        description: No severity at all, for a score of 0.
        meaning: spdx_security:CvssSeverityType/none
      LOW:
        description: The lowest rating above none.
        meaning: spdx_security:CvssSeverityType/low
      MEDIUM:
        description: The middle rating.
        meaning: spdx_security:CvssSeverityType/medium
      HIGH:
        description: The rating below critical.
        meaning: spdx_security:CvssSeverityType/high
      CRITICAL:
        description: The highest rating.
        meaning: spdx_security:CvssSeverityType/critical
  CvssV2AccessVector:
    description: How far away an attacker can be, in CVSS 2.0's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/accessVectorType
    permissible_values:
      NETWORK:
        description: From anywhere that can route to the system.
      ADJACENT_NETWORK:
        description: Only from the same local network segment.
      LOCAL:
        description: Only with an account on the system or hands on it.
  CvssV2AccessComplexity:
    description: How hard the flaw is to use, in CVSS 2.0's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/accessComplexityType
    permissible_values:
      HIGH:
        description: Only under unusual, hard-to-arrange conditions.
      MEDIUM:
        description: Under conditions that take some arranging.
      LOW:
        description: With no special conditions.
  CvssV2Authentication:
    description: How many logins an attacker needs, in CVSS 2.0's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/authenticationType
    permissible_values:
      MULTIPLE:
        description: More than one login.
      SINGLE:
        description: One login.
      NONE:
        description: No login at all.
  CvssV2Impact:
    description: How much of one security property an attack could cost, in CVSS 2.0's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/ciaType
    permissible_values:
      NONE:
        description: Nothing is lost.
      PARTIAL:
        description: Some is lost, and the attacker cannot choose all of it.
      COMPLETE:
        description: All of it is lost.
  CvssExploitCodeMaturity:
    description: How far working attack code has come.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/exploitabilityType imports/cvss/cvss-v3.0.json#/definitions/exploitCodeMaturityType
        imports/cvss/cvss-v3.1.json#/definitions/exploitCodeMaturityType
    permissible_values:
      UNPROVEN:
        description: No attack code is known, or the attack is only theory.
      PROOF_OF_CONCEPT:
        description: A demonstration exists that needs skilled work to use.
      FUNCTIONAL:
        description: Working attack code exists for most situations.
      HIGH:
        description: Attack code is reliable and widely available, or no code is needed.
      NOT_DEFINED:
        description: The scorer gave no value, so the metric does not change the score.
  CvssRemediationLevel:
    description: What kind of fix is available.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/remediationLevelType imports/cvss/cvss-v3.0.json#/definitions/remediationLevelType
        imports/cvss/cvss-v3.1.json#/definitions/remediationLevelType
    permissible_values:
      OFFICIAL_FIX:
        description: The vendor offers a complete fix.
      TEMPORARY_FIX:
        description: The vendor offers a stopgap for now.
      WORKAROUND:
        description: Others offer a way round the flaw that is not from the vendor.
      UNAVAILABLE:
        description: No fix exists, or it cannot be applied.
      NOT_DEFINED:
        description: The scorer gave no value, so the metric does not change the score.
  CvssV2ReportConfidence:
    description: How far the flaw has been confirmed, in CVSS 2.0's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/reportConfidenceType
    permissible_values:
      UNCONFIRMED:
        description: A single report or conflicting reports that nobody has checked.
      UNCORROBORATED:
        description: Several unofficial sources agree, with some doubt remaining.
      CONFIRMED:
        description: The vendor accepts it, or a working attack shows it.
      NOT_DEFINED:
        description: The scorer gave no value, so the metric does not change the score.
  CvssV2CollateralDamagePotential:
    description: How much loss could follow beyond the system itself.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/collateralDamagePotentialType
    permissible_values:
      NONE:
        description: No such loss.
      LOW:
        description: Slight loss.
      LOW_MEDIUM:
        description: Moderate loss.
      MEDIUM_HIGH:
        description: Significant loss.
      HIGH:
        description: Catastrophic loss.
      NOT_DEFINED:
        description: The scorer gave no value, so the metric does not change the score.
  CvssV2TargetDistribution:
    description: How much of the environment the flaw exposes.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/targetDistributionType
    permissible_values:
      NONE:
        description: No systems at all, or only in a lab.
      LOW:
        description: Up to about a quarter of systems.
      MEDIUM:
        description: About a quarter to three quarters of systems.
      HIGH:
        description: More than about three quarters of systems.
      NOT_DEFINED:
        description: The scorer gave no value, so the metric does not change the score.
  CvssRequirement:
    description: How much one security property matters to the scorer.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/ciaRequirementType imports/cvss/cvss-v3.0.json#/definitions/ciaRequirementType
        imports/cvss/cvss-v3.1.json#/definitions/ciaRequirementType imports/cvss/cvss-v4.0.json#/definitions/ciaRequirementType
    permissible_values:
      LOW:
        description: A loss would have limited effect.
      MEDIUM:
        description: A loss would have serious effect.
      HIGH:
        description: A loss would have catastrophic effect.
      NOT_DEFINED:
        description: The scorer gave no value, so the metric does not change the score.
  CvssV3AttackVector:
    description: How far away an attacker can be, in CVSS 3's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/attackVectorType imports/cvss/cvss-v3.1.json#/definitions/attackVectorType
    permissible_values:
      NETWORK:
        description: From anywhere that can route to the system.
      ADJACENT_NETWORK:
        description: Only from a logically nearby network.
      LOCAL:
        description: Only by acting on the system itself, directly or through a user.
      PHYSICAL:
        description: Only by touching the hardware.
  CvssV3ModifiedAttackVector:
    description: The attack vector as the scorer's environment changes it, in CVSS 3's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/modifiedAttackVectorType imports/cvss/cvss-v3.1.json#/definitions/modifiedAttackVectorType
    permissible_values:
      NETWORK:
        description: From anywhere that can route to the system.
      ADJACENT_NETWORK:
        description: Only from a logically nearby network.
      LOCAL:
        description: Only by acting on the system itself, directly or through a user.
      PHYSICAL:
        description: Only by touching the hardware.
      NOT_DEFINED:
        description: The scorer gave no value, so the base metric stands.
  CvssAttackComplexity:
    description: How much is outside the attacker's control.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/attackComplexityType imports/cvss/cvss-v3.1.json#/definitions/attackComplexityType
        imports/cvss/cvss-v4.0.json#/definitions/attackComplexityType
    permissible_values:
      HIGH:
        description: Success depends on conditions the attacker must overcome or wait for.
      LOW:
        description: The attacker can succeed again and again with no special effort.
  CvssModifiedAttackComplexity:
    description: The attack complexity as the scorer's environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/modifiedAttackComplexityType imports/cvss/cvss-v3.1.json#/definitions/modifiedAttackComplexityType
        imports/cvss/cvss-v4.0.json#/definitions/modifiedAttackComplexityType
    permissible_values:
      HIGH:
        description: Success depends on conditions the attacker must overcome or wait for.
      LOW:
        description: The attacker can succeed again and again with no special effort.
      NOT_DEFINED:
        description: The scorer gave no value, so the base metric stands.
  CvssPrivilegesRequired:
    description: What access an attacker needs beforehand.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/privilegesRequiredType imports/cvss/cvss-v3.1.json#/definitions/privilegesRequiredType
        imports/cvss/cvss-v4.0.json#/definitions/privilegesRequiredType
    permissible_values:
      HIGH:
        description: Administrator-level access.
      LOW:
        description: Ordinary user access.
      NONE:
        description: No access at all.
  CvssModifiedPrivilegesRequired:
    description: The access needed as the scorer's environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/modifiedPrivilegesRequiredType imports/cvss/cvss-v3.1.json#/definitions/modifiedPrivilegesRequiredType
        imports/cvss/cvss-v4.0.json#/definitions/modifiedPrivilegesRequiredType
    permissible_values:
      HIGH:
        description: Administrator-level access.
      LOW:
        description: Ordinary user access.
      NONE:
        description: No access at all.
      NOT_DEFINED:
        description: The scorer gave no value, so the base metric stands.
  CvssV3UserInteraction:
    description: Whether someone else has to take part, in CVSS 3's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/userInteractionType imports/cvss/cvss-v3.1.json#/definitions/userInteractionType
    permissible_values:
      NONE:
        description: The attack needs nobody else.
      REQUIRED:
        description: Someone other than the attacker has to do something.
  CvssV3ModifiedUserInteraction:
    description: The user interaction as the scorer's environment changes it, in CVSS 3's terms.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/modifiedUserInteractionType imports/cvss/cvss-v3.1.json#/definitions/modifiedUserInteractionType
    permissible_values:
      NONE:
        description: The attack needs nobody else.
      REQUIRED:
        description: Someone other than the attacker has to do something.
      NOT_DEFINED:
        description: The scorer gave no value, so the base metric stands.
  CvssV3Scope:
    description: Whether an attack can reach beyond the flawed component.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/scopeType imports/cvss/cvss-v3.1.json#/definitions/scopeType
    permissible_values:
      UNCHANGED:

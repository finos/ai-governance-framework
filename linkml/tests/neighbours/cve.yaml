    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items/properties/description
    aliases:
    - description
  cve_name:
    description: A name, of a reference or of a routine.
    slot_uri: cve:name
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/reference/properties/name CVE_Record_Format.json#/definitions/product/properties/programRoutines/items/properties/name
    aliases:
    - name
  cve_url:

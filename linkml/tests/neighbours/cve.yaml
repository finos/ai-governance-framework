      CHANGED:
        description: The harm can reach something under another security authority.
  CvssV3ModifiedScope:
    description: The scope as the scorer's environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/definitions/modifiedScopeType imports/cvss/cvss-v3.1.json#/definitions/modifiedScopeType
    permissible_values:

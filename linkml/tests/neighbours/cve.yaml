        CVE_Record_Format.json#/definitions/metrics/items/properties/scenarios/items/properties/value
        CVE_Record_Format.json#/definitions/timeline/items/properties/value CVE_Record_Format.json#/definitions/credits/items/properties/value
  cve_type:
    description: What kind of thing this is. Each class that uses it says what the choices are.
    slot_uri: cve:type
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items/properties/type
        CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items/properties/type
        CVE_Record_Format.json#/definitions/metrics/items/properties/other/properties/type CVE_Record_Format.json#/definitions/credits/items/properties/type
    aliases:
    - type
  cve_description:

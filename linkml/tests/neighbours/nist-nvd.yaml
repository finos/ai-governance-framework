types:
  nvd_timestamp:
    typeof: string
    base: str
    uri: xsd:dateTime
    description: 'A date and time as NVD writes it: ISO 8601, with fractional seconds and a UTC offset
      where the writer gives them.'
    pattern: ^[0-9]{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$
    comments:
    - NVD's schemas say format date-time, which is RFC 3339 and needs a UTC offset. NVD's records and
      responses write none, so a validator that checks the format refuses every real record. This type
      admits both forms, and tests/test_upstream.py lists the departure.
  nvd_uuid:
    typeof: string
    base: str
    uri: xsd:string
    description: A UUID in its usual hexadecimal form with four hyphens.
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    comments:
    - NVD's schemas say format uuid, and LinkML has no such type. NVD writes these in capitals.
  nvd_cve_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: A CVE identifier, such as CVE-2021-44228.
    pattern: ^CVE-[0-9]{4}-[0-9]{4,}$

# Generated by `lokf adapt` from nist_nvd.yaml (nist_nvd 2.2.4); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/nist-nvd-lokf
name: nist-nvd
title: National Vulnerability Database (NVD)
description: 'A LinkML model of the JSON responses of the NVD API 2.0, from the JSON schemas NIST publishes:
  vulnerabilities, products, match strings and change history. NVD''s own keys are the schema''s keys,
  so a real response validates unchanged.'
version: 2.2.4
source: https://csrc.nist.gov/schema/nvd/api/2.0/cve_api_json_2.0.schema
license: Apache-2.0
keywords:
- vulnerability
- NVD
- CVE
- CPE
- CVSS
see_also:
- https://lmodel.github.io/nist-nvd
- https://nvd.nist.gov/developers/start-here
annotations:
  upstream_sha256: 2b9c4e8ab7e6e42aa17ea787f58167beff47c119c6f291405f86ac19c6149e01
comments:
- 'The version is the edition of NVD''s vulnerability schema, as its title names it. Each module''s header
  carries the edition of its own schema: 2.0 for the product and match-string responses, and 2.0.1 for
  the change history. scripts/check_upstream_release.py compares each file''s SHA-256 with its pin, since
  NIST changes them in place with no release.'
- NVD has four kinds of response and no document that holds them, so each response module marks its own
  response as a tree root, and the generators write NvdCveResponse as the top class. Name the kind when
  validating, with linkml-validate -C NvdCpeResponse.
default_prefix: nist_nvd
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  xsd: http://www.w3.org/2001/XMLSchema#
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  cve: https://w3id.org/lmodel/cve/
  spdx3: https://spdx.org/rdf/3.0.1/terms/
  sepses_cvss: http://w3id.org/sepses/vocab/ref/cvss#
  spdx_security: https://spdx.org/rdf/3.0.1/terms/Security/
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  stix: https://w3id.org/lmodel/stix/
  sepses_cve: http://w3id.org/sepses/vocab/ref/cve#
  wd: http://www.wikidata.org/entity/
  wdt: http://www.wikidata.org/prop/direct/
  dcat: http://www.w3.org/ns/dcat#
  sepses_cpe: http://w3id.org/sepses/vocab/ref/cpe#
  prov: http://www.w3.org/ns/prov#
imports:
- linkml:types
- lokf
classes:
  NvdResponseMixin:
    mixin: true
    description: The fields of a page of results, which every NVD API response carries.
    slots:
    - format
    - cve_timestamp
    slot_usage:
      cve_timestamp:
        required: true
    attributes:
      resultsPerPage:
        description: How many results this page holds.
        range: integer
        required: true
        slot_uri: nist_nvd:resultsPerPage
      startIndex:
        description: The position of this page's first result among all the results.
        range: integer
        required: true
        slot_uri: nist_nvd:startIndex
      totalResults:
        description: How many results the request matched in all.
        range: integer
        required: true
        slot_uri: nist_nvd:totalResults
      cve_version:
        description: The response format's version.
        required: true
        slot_uri: nist_nvd:responseVersion
  CvssSeverityBandsMixin:
    mixin: true
    description: The base score and base severity of a CVSS version with severity bands, and the bands
      that tie one to the other.
    comments:
    - The upstream also rules out a score that is not a multiple of 0.1, as a list of numbers no LinkML
      range can state. tests/cve_rules.py checks that.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/anyOf imports/cvss/cvss-v3.1.json#/anyOf imports/cvss/cvss-v4.0.json#/allOf/0/anyOf
    slots:
    - baseScore
    - baseSeverity
    rules:
    - title: base severity NONE
      description: A base severity of NONE goes with a base score of exactly 0.
      preconditions:
        slot_conditions:
          baseSeverity:
            equals_string: NONE
      postconditions:
        slot_conditions:
          baseScore:
            minimum_value: 0
            maximum_value: 0
    - title: base severity LOW
      description: A base severity of LOW goes with a base score from 0.1 to 3.9.
      preconditions:
        slot_conditions:
          baseSeverity:
            equals_string: LOW
      postconditions:
        slot_conditions:
          baseScore:
            minimum_value: 0.1
            maximum_value: 3.9
    - title: base severity MEDIUM
      description: A base severity of MEDIUM goes with a base score from 4.0 to 6.9.
      preconditions:
        slot_conditions:
          baseSeverity:
            equals_string: MEDIUM
      postconditions:
        slot_conditions:
          baseScore:
            minimum_value: 4.0
            maximum_value: 6.9
    - title: base severity HIGH
      description: A base severity of HIGH goes with a base score from 7.0 to 8.9.
      preconditions:
        slot_conditions:
          baseSeverity:
            equals_string: HIGH
      postconditions:
        slot_conditions:
          baseScore:
            minimum_value: 7.0
            maximum_value: 8.9
    - title: base severity CRITICAL
      description: A base severity of CRITICAL goes with a base score from 9.0 to 10.
      preconditions:
        slot_conditions:
          baseSeverity:
            equals_string: CRITICAL
      postconditions:
        slot_conditions:
          baseScore:
            minimum_value: 9.0
            maximum_value: 10.0
    class_uri: cve:CvssSeverityBandsMixin

  NvdCveResponse:
    description: A page of the vulnerability API's results, or a whole data feed.
    mixins:
    - NvdResponseMixin
    slot_usage:
      format:
        equals_string: NVD_CVE
    attributes:
      vulnerabilities:
        description: The vulnerabilities on this page.
        range: NvdVulnerability
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
    close_mappings:
    - schema:DataFeed
    related_mappings:
    - dcat:Distribution
    comments:
    - A feed file is one representation of NVD's data, so it relates to a DCAT distribution, but this
      class also covers one page of an API answer.
    annotations:
      upstream_definition: cve_api_json_2.0.schema#
  NvdVulnerability:
    description: One entry of a response, which only wraps the vulnerability.
    attributes:
      cve:
        description: The vulnerability.
        range: NvdCve
        inlined: true
        required: true
    close_mappings:
    - schema:DataFeedItem
    aliases:
    - def_cve_item
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/def_cve_item
  NvdCve:
    description: A vulnerability as NVD holds it, under its CVE identifier.
    slots:
    - id
    - sourceIdentifier
    - lastModified
    - cve_references
    slot_usage:
      lastModified:
        required: true
        close_mappings:
        - dcterms:modified
        - schema:dateModified
        - spdx3:Security/modifiedTime
        related_mappings:
        - cve:dateUpdated
        comments:
        - 'This is NVD''s own time, not the CVE record''s dateUpdated: the two are set by different parties
          and often differ, so the mapping to it is only a related one.'
    attributes:
      vulnStatus:
        description: Where this vulnerability stands in NVD's analysis.
        range: NvdVulnStatus
      published:
        description: When NVD published this vulnerability.
        range: nvd_timestamp
        required: true
        close_mappings:
        - dcterms:issued
        - schema:datePublished
        - spdx3:Security/publishedTime
        related_mappings:
        - cve:datePublished
        comments:
        - This is NVD's own time, not the CVE record's datePublished. For CVE-2021-44228 the CVE record
          says 2021-12-10T00:00:00.000Z and NVD 2021-12-10T10:15:09.143, so the mapping is only a related
          one.
      evaluatorComment:
        description: A remark from NVD's analyst.
      evaluatorSolution:
        description: A way to resolve the vulnerability, from NVD's analyst.
      evaluatorImpact:
        description: What the vulnerability can lead to, from NVD's analyst.
      cisaExploitAdd:
        description: The day CISA added this vulnerability to its Known Exploited Vulnerabilities catalog.
        range: date
        exact_mappings:
        - kev_catalog:dateAdded
        comments:
        - Equal to the catalog's value for all 1,766 entries of the catalog of 2026-11-03, read through
          the API.
      cisaActionDue:
        description: The day by which CISA says federal agencies must act.
        range: date
        exact_mappings:
        - kev_catalog:dueDate
        comments:
        - Equal to the catalog's value for all 1,766 entries of the catalog of 2026-11-03, read through
          the API.
      cisaRequiredAction:
        description: What CISA says agencies must do about this vulnerability.
        exact_mappings:
        - kev_catalog:requiredAction
        comments:
        - Equal to the catalog's value for all 1,766 entries of the catalog of 2026-11-03, read through
          the API.
      cisaVulnerabilityName:
        description: The name CISA gives this vulnerability in its catalog.
        exact_mappings:
        - kev_catalog:vulnerabilityName
        comments:
        - Equal to the catalog's value for all 1,766 entries of the catalog of 2026-11-03, read through
          the API.
      cveTags:
        description: The labels the record's sources put on it.
        range: NvdCveTag
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
        - cve:tags
      descriptions:
        description: What the vulnerability is, in one or more languages.
        range: NvdLangString
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        close_mappings:
        - cve:descriptions
      metrics:
        description: The scores that NVD and others give this vulnerability.
        range: NvdMetrics
        inlined: true
        close_mappings:
        - cve:metrics
        related_mappings:
        - sepses_cvss:hasCVSS
      affected:
        description: The affected products, by the source that names them.
        range: NvdAffected
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
        - cve:affected
      weaknesses:
        description: The weaknesses behind the vulnerability, by the source that names them.
        range: NvdWeakness
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
        - cve:problemTypes
        related_mappings:
        - sepses_cve:hasCWE
      configurations:
        description: The product configurations that have the vulnerability.
        range: NvdConfiguration
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
        - cve:cpeApplicability
        - sepses_cve:hasVulnerableConfiguration
      vendorComments:
        description: What product vendors have said about this vulnerability.
        range: NvdVendorComment
        multivalued: true
        inlined: true
        inlined_as_list: true
    close_mappings:
    - cve:CveRecord
    - stix:StixVulnerability
    - spdx3:Security/Vulnerability
    - sepses_cve:CVE
    - wd:Q631425
    comments:
    - NVD republishes CVE records and adds its own analysis, so this is close to a CVE record and not
      the same thing. A record of this class also repeats four fields of the CISA Known Exploited Vulnerabilities
      catalog when the catalog lists it.
    aliases:
    - cve_item
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/cve_item
    is_a: Concept
  NvdCveTag:
    description: The labels that one source puts on a record.
    slots:
    - sourceIdentifier
    - cve_tags
    slot_usage:
      cve_tags:
        range: NvdCveTagName
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/cve_item/properties/cveTags/items
  NvdLangString:
    description: A piece of text and the language it is in.
    slots:
    - lang
    attributes:
      value:
        description: The text.
        required: true
        pattern: ^[\s\S]{0,4096}$
        slot_uri: nist_nvd:langStringValue
    close_mappings:
    - cve:CveDescription
    aliases:
    - lang_string
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/lang_string
  NvdReference:
    description: A page about a vulnerability, with NVD's labels for what it is.
    slots:
    - cve_url
    - cve_source
    - cve_tags
    slot_usage:
      cve_tags:
        range: NvdReferenceTag
      cve_source:
        close_mappings:
        - sepses_cve:referenceSource
    close_mappings:
    - cve:CveReference
    - sepses_cve:Reference
    aliases:
    - reference
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/reference
  NvdMetrics:
    description: The scores of a vulnerability, in a list per scoring system and version.
    attributes:
      cvssMetricV40:
        description: The CVSS 4.0 scores.
        range: NvdCvssMetricV40
        multivalued: true
        inlined: true
        inlined_as_list: true
      cvssMetricV31:
        description: The CVSS 3.1 scores.
        range: NvdCvssMetricV31
        multivalued: true
        inlined: true
        inlined_as_list: true
      cvssMetricV30:
        description: The CVSS 3.0 scores.
        range: NvdCvssMetricV30
        multivalued: true
        inlined: true
        inlined_as_list: true
      cvssMetricV2:
        description: The CVSS 2.0 scores.
        range: NvdCvssMetricV2
        multivalued: true
        inlined: true
        inlined_as_list: true
      ssvcV203:
        description: The SSVC 2.0.3 decisions.
        range: NvdSsvcMetricV203
        multivalued: true
        inlined: true
        inlined_as_list: true
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/cve_item/properties/metrics
  NvdCvssMetricV2:
    description: A CVSS 2.0 score, who gave it, and NVD's figures beside it.
    slots:
    - cve_source
    - cve_type
    - cvssData
    - exploitabilityScore
    - impactScore
    slot_usage:
      cve_source:
        required: true
      cve_type:
        required: true
        range: NvdSourceType
      cvssData:
        range: CvssV20
    attributes:
      baseSeverity:
        description: The severity band of the base score, which CVSS 2.0 leaves to NVD.
        range: NvdCvssV2Severity
        slot_uri: nist_nvd:baseSeverity
        close_mappings:
        - sepses_cvss:severity
      acInsufInfo:
        description: Whether NVD lacked the information to rate the access complexity.
        range: boolean
      obtainAllPrivilege:
        description: Whether exploiting this gains every privilege.
        range: boolean
      obtainUserPrivilege:
        description: Whether exploiting this gains a user's privileges.
        range: boolean
      obtainOtherPrivilege:
        description: Whether exploiting this gains some other privilege.
        range: boolean
      userInteractionRequired:
        description: Whether exploiting this needs a user to act.
        range: boolean
    close_mappings:
    - sepses_cvss:CVSS2BaseMetric
    related_mappings:
    - spdx3:Security/CvssV2VulnAssessmentRelationship
    aliases:
    - cvss-v2
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/cvss-v2
  NvdCvssMetricV30:
    description: A CVSS 3.0 score, who gave it, and its subscores.
    slots:
    - cve_source
    - cve_type
    - cvssData
    - exploitabilityScore
    - impactScore
    slot_usage:
      cve_source:
        required: true
      cve_type:
        required: true
        range: NvdSourceType
      cvssData:
        range: CvssV30
    close_mappings:
    - sepses_cvss:CVSS3BaseMetric
    related_mappings:
    - spdx3:Security/CvssV3VulnAssessmentRelationship
    aliases:
    - cvss-v30
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/cvss-v30
  NvdCvssMetricV31:
    description: A CVSS 3.1 score, who gave it, and its subscores.
    slots:
    - cve_source
    - cve_type
    - cvssData
    - exploitabilityScore
    - impactScore
    slot_usage:
      cve_source:
        required: true
      cve_type:
        required: true
        range: NvdSourceType
      cvssData:
        range: CvssV31
    close_mappings:
    - sepses_cvss:CVSS3BaseMetric
    related_mappings:
    - spdx3:Security/CvssV3VulnAssessmentRelationship
    aliases:
    - cvss-v31
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/cvss-v31
  NvdCvssMetricV40:
    description: A CVSS 4.0 score and who gave it.
    slots:
    - cve_source
    - cve_type
    - cvssData
    slot_usage:
      cve_source:
        required: true
      cve_type:
        required: true
        range: NvdSourceType
      cvssData:
        range: CvssV40
    related_mappings:
    - spdx3:Security/CvssV4VulnAssessmentRelationship
    aliases:
    - cvss-v40
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/cvss-v40
  NvdSsvcMetricV203:
    description: A Stakeholder-Specific Vulnerability Categorization (SSVC) decision and who made it.
    slots:
    - cve_source
    slot_usage:
      cve_source:
        required: true
    attributes:
      ssvcData:
        description: The decision.
        range: NvdSsvcData
        inlined: true
        required: true
    related_mappings:
    - spdx3:Security/SsvcVulnAssessmentRelationship
    comments:
    - SPDX records the outcome of an SSVC decision, and NVD the path to it, so the mapping is only a related
      one.
    aliases:
    - ssvc-v203
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/ssvc-v203
  NvdSsvcData:
    description: One SSVC decision, as the answers chosen on the way through a decision tree.
    slots:
    - cve_timestamp
    attributes:
      computed:
        description: The decision in a short form.
      options:
        description: The answers given, each as a decision point and its value.
        range: NvdSsvcOption
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        list_elements_unique: true
      role:
        description: The role of whoever made the decision, such as CISA Coordinator.
        required: true
      cve_version:
        description: Which SSVC release this decision follows.
        required: true
        slot_uri: nist_nvd:ssvcVersion
      decisionTree:
        description: The whole tree this decision came from.
        range: NvdSsvcDecisionTree
        inlined: true
      id:
        description: The vulnerability the decision is about, by whatever identifier.
        slot_uri: nist_nvd:ssvcSubject
      decisionTreeUrl:
        description: Where to find the tree this decision came from.
        range: uri
      generator:
        description: The tool that wrote this decision.
    comments:
    - This class renders the structure of NVD's ssvc-v2.0.3.json. NVD's file also names a $schema key,
      which LinkML's Python generators cannot spell. No record of the modified feed of 2026-11-03 holds
      it, and tests/test_upstream.py lists the departure.
    annotations:
      upstream_definition: ssvc-v2.0.3.json#
  NvdSsvcOption:
    description: One answer on the way through a decision tree, keyed by its decision point.
    attributes:
      exploitation:
        description: How far the vulnerability is known to be exploited, such as none, poc or active.
        any_of:
        - range: string
        - range: string
          multivalued: true
      automatable:
        description: Whether an attacker could automate the attack, as yes or no.
        notes:
        - CVSS 4.0's Automatable differs from this key only by case, so the two share one page of the
          generated docs on a case-insensitive filesystem. Both are real keys, so neither is renamed,
          and tests/test_schema_rules.py pins this as the one such pair.
        any_of:
        - range: string
        - range: string
          multivalued: true
      technicalImpact:
        description: How much control an attacker would gain, as partial or total.
        any_of:
        - range: string
        - range: string
          multivalued: true
    extra_slots:
      range_expression:
        any_of:
        - range: string
        - range: string
          multivalued: true
    comments:
    - NVD's file allows any key, with a string or a list of strings as its value, and extra_slots states
      that. The real data holds one key per object, and only these three, each with a string. They are
      named here because LinkML's Pydantic generator ignores extra_slots, so without them the Pydantic
      model refuses every SSVC decision.
    annotations:
      upstream_definition: ssvc-v2.0.3.json#/properties/options/items
  NvdSsvcDecisionTree:
    class_uri: linkml:Any
    description: A whole SSVC decision tree, in the form of the schema NVD's file names.
    comments:
    - NVD's file refers to a schema at democert.org for this object, and this project does not render
      that schema. No record of the modified feed of 2026-11-03 holds a decision tree, and tests/test_upstream.py
      lists the departure.
  NvdAffected:
    description: The products that one source says the vulnerability affects.
    slots:
    - cve_source
    slot_usage:
      cve_source:
        required: true
    attributes:
      affectedData:
        description: The products.
        range: NvdAffectedProduct
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
    aliases:
    - affected
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/affected
  NvdAffectedProduct:
    description: A product and which of its versions have the vulnerability.
    slots:
    - defaultStatus
    attributes:
      vendor:
        description: Who makes or maintains the product.
        pattern: ^[\s\S]{1,512}$
        close_mappings:
        - cve:vendor
      product:
        description: The product's name.
        pattern: ^[\s\S]{1,2048}$
        close_mappings:
        - cve:product
      collectionURL:
        description: The address of the package collection that holds the product.
        range: uri
        pattern: ^[\s\S]{1,2048}$
        close_mappings:
        - cve:collectionURL
      packageName:
        description: The package's name within that collection.
        pattern: ^[\s\S]{1,2048}$
        close_mappings:
        - cve:packageName
      cpes:
        description: The product's CPE names, in the 2.2 or the 2.3 form.
        multivalued: true
        list_elements_unique: true
        pattern: ([c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9._\-~%]*){0,6})|(cpe:2\.3:[aho*\-](:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!\x22#$%&\x27()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!\x22#$%&\x27()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){4})
        comments:
        - NVD's own pattern, with its quotes written as \x22 and \x27, which mean the same. The Python
          generators cut a raw string at a quote.
        close_mappings:
        - cve:cpes
      modules:
        description: The affected parts of the product.
        multivalued: true
        list_elements_unique: true
        pattern: ^[\s\S]{1,4096}$
        close_mappings:
        - cve:modules
      programFiles:
        description: The affected source code files.
        multivalued: true
        list_elements_unique: true
        pattern: ^[\s\S]{1,1024}$
        close_mappings:
        - cve:programFiles
      programRoutines:
        description: The affected source code routines.
        range: NvdProgramRoutine
        multivalued: true
        inlined: true
        inlined_as_list: true
        list_elements_unique: true
        close_mappings:
        - cve:programRoutines
      platforms:
        description: The platforms the vulnerability is limited to.
        multivalued: true
        minimum_cardinality: 1
        list_elements_unique: true
        pattern: ^[\s\S]{0,1024}$
        close_mappings:
        - cve:platforms
      repo:
        description: The address of the product's source code repository.
        pattern: ^[\s\S]{1,2048}$
        close_mappings:
        - cve:repo
        comments:
        - NVD's file says format uri. Some records write an address that RFC 3986 refuses, such as git://git@gitlab.com:gitlab-org/gitlab.git,
          so this is a string and tests/test_upstream.py lists the departure.
      versions:
        description: The versions or ranges of versions whose status is known.
        range: NvdAffectedVersion
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        close_mappings:
        - cve:versions
      packageURL:
        description: The product's Package URL, with no version in it.
        range: uri
        pattern: ^[\s\S]{1,2048}$
        close_mappings:
        - cve:packageURL
    close_mappings:
    - cve:CveProduct
    notes:
    - NVD's file has the same keys as the CVE Record Format's product. It drops the two rules that the
      CVE format states, that a product names a vendor and product or a collection and package, and that
      it has versions or a default status, so this class does not state them. The default status keeps
      NVD's own enum beside it, so nvd_cve needs no second copy of the CVE module.
    annotations:
      upstream_definition: cve_affected_1.0.json#
  NvdProgramRoutine:
    description: One affected source code routine.
    slots:
    - cve_name
    close_mappings:
    - cve:CveProgramRoutine
    annotations:
      upstream_definition: cve_affected_1.0.json#/properties/programRoutines/items
  NvdAffectedVersion:
    description: The status of one version of a product, or of a range of its versions.
    slots:
    - cve_version
    - cve_status
    slot_usage:
      cve_version:
        description: The version, or the start of the range.
        required: true
        pattern: ^[\s\S]{1,1024}$
      cve_status:
        required: true
        range: NvdVersionStatus
    attributes:
      versionType:
        description: The numbering scheme that orders the versions, such as semver or git.
        pattern: ^[\s\S]{1,128}$
      lessThan:
        description: The first version after the range.
        pattern: ^[\s\S]{1,1024}$
      lessThanOrEqual:
        description: The last version in the range.
        pattern: ^[\s\S]{1,1024}$
      changes:
        description: Where the status changes within the range.
        range: NvdVersionChange
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
    rules:
    - description: A range with a less-than limit names the numbering scheme.
      preconditions:
        slot_conditions:
          lessThan:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          versionType:
            value_presence: PRESENT
    - description: A range with a less-than-or-equal limit names the numbering scheme.
      preconditions:
        slot_conditions:
          lessThanOrEqual:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          versionType:
            value_presence: PRESENT
    - description: A range has one upper limit, not two.
      preconditions:
        slot_conditions:
          lessThan:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          lessThanOrEqual:
            value_presence: ABSENT
    - description: Status changes belong to a range, so they need an upper limit.
      preconditions:
        slot_conditions:
          changes:
            value_presence: PRESENT
          lessThan:
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          lessThanOrEqual:
            value_presence: PRESENT
    close_mappings:
    - cve:CveProductVersion
    notes:
    - 'These four rules state the oneOf of NVD''s file, which has four branches: a version and a status
      alone, those with a numbering scheme, and those with a scheme and one of the two limits.'
    annotations:
      upstream_definition: cve_affected_1.0.json#/properties/versions/items
  NvdVersionChange:
    description: A point within a range of versions where the status changes.
    slots:
    - cve_at
    - cve_status
    slot_usage:
      cve_status:
        required: true
        range: NvdVersionStatus
    close_mappings:
    - cve:CveVersionChange
    annotations:
      upstream_definition: cve_affected_1.0.json#/properties/versions/items/properties/changes/items
  NvdWeakness:
    description: The weaknesses that one source says lie behind a vulnerability.
    slots:
    - cve_source
    - cve_type
    - cve_description
    slot_usage:
      cve_source:
        required: true
      cve_type:
        required: true
        range: NvdSourceType
    close_mappings:
    - cve:CveProblemType
    aliases:
    - weakness
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/weakness
  NvdConfiguration:
    description: A statement of which product configurations have the vulnerability.
    slots:
    - operator
    - negate
    attributes:
      nodes:
        description: The parts of the statement.
        range: NvdConfigurationNode
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
    close_mappings:
    - cve:CveCpeApplicabilityElement
    - sepses_cve:VulnerableConfiguration
    aliases:
    - config
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/config
  NvdConfigurationNode:
    description: One part of a configuration statement, as a set of CPE matches.
    slots:
    - operator
    - negate
    slot_usage:
      operator:
        required: true
    attributes:
      cpeMatch:
        description: The CPE matches of this part.
        range: NvdCpeMatch
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
    close_mappings:
    - cve:CveCpeNode
    aliases:
    - node
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/node
  NvdCpeMatch:
    description: A CPE match string or range, and whether what it matches is vulnerable.
    slots:
    - criteria
    - matchCriteriaId
    - versionStartExcluding
    - versionStartIncluding
    - versionEndExcluding
    - versionEndIncluding
    attributes:
      vulnerable:
        description: Whether what this matches has the vulnerability, rather than only setting the scene.
        range: boolean
        required: true
    close_mappings:
    - cve:CveCpeMatch
    aliases:
    - cpe_match
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/cpe_match
  NvdVendorComment:
    description: What a product's vendor has said about a vulnerability.
    slots:
    - lastModified
    slot_usage:
      lastModified:
        required: true
    attributes:
      organization:
        description: The vendor's name.
        required: true
      comment:
        description: What the vendor said.
        required: true
    close_mappings:
    - schema:Comment
    aliases:
    - vendorComment
    annotations:
      upstream_definition: cve_api_json_2.0.schema#/definitions/vendorComment
  NvdCpeResponse:
    description: A page of the product API's results.
    mixins:
    - NvdResponseMixin
    slot_usage:
      format:
        equals_string: NVD_CPE
    attributes:
      products:
        description: The products on this page.
        range: NvdCpeItem
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
    close_mappings:
    - schema:DataFeed
    annotations:
      upstream_definition: cpe_api_json_2.0.schema#
  NvdCpeItem:
    description: One entry of a product response, which only wraps the CPE name.
    attributes:
      cpe:
        description: The CPE name and what NVD holds about it.
        range: NvdCpe
        inlined: true
        required: true
    close_mappings:
    - schema:DataFeedItem
    aliases:
    - defCpe
    annotations:
      upstream_definition: cpe_api_json_2.0.schema#/definitions/defCpe
  NvdCpe:
    description: A CPE name as NVD holds it, with its UUID.
    slots:
    - cpeName
    - cpeNameId
    - cve_created
    - lastModified
    slot_usage:
      cpeName:
        required: true
      cpeNameId:
        identifier: true
      cve_created:
        required: true
      lastModified:
        required: true
    attributes:
      deprecated:
        description: Whether NVD has retired this CPE name.
        range: boolean
        required: true
      titles:
        description: The product's titles, in one or more languages.
        range: NvdCpeTitle
        multivalued: true
        inlined: true
        inlined_as_list: true
      refs:
        description: Pages about the product.
        range: NvdCpeReference
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
        - dcterms:references
      deprecatedBy:
        description: The CPE names that replace this one.
        range: NvdCpeNameLink
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
        - dcterms:isReplacedBy
      deprecates:
        description: The CPE names this one replaces.
        range: NvdCpeNameLink
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
        - dcterms:replaces
    close_mappings:
    - sepses_cpe:CPE
    notes:
    - The identifier is set on this class alone, because cpeNameId also appears where one CPE name points
      to another. lokf adapt replaces a slot that is an identifier with LOKF's id everywhere, which would
      rename those keys too.
    annotations:
      upstream_definition: cpe_api_json_2.0.schema#/definitions/defCpe/properties/cpe
  NvdCpeTitle:
    description: A product's title in one language.
    slots:
    - cve_title
    - lang
    aliases:
    - defTitle
    annotations:
      upstream_definition: cpe_api_json_2.0.schema#/definitions/defTitle
  NvdCpeReference:
    description: A page about a product, and what kind of page it is.
    slots:
    - cve_type
    slot_usage:
      cve_type:
        range: NvdCpeReferenceType
    attributes:
      ref:
        description: The page's address.
        required: true
        pattern: ^([A-Za-z][A-Za-z0-9+.-]+):(\/\/([^@]+@)?([A-Za-z0-9.\-_~]+)(:\d+)?)?((?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27\[\]()*+,;=:@])+(?:\/(?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27\[\]()*+,;=:@])*)*|(?:\/(?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27()*+,;=:@])+)*)?(\?(?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27\[\]()*+,;=:@]|[/?])*)?(\#(?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27\[\]()*+,;=:@]|[/?])*)?$
        comments:
        - NVD's own pattern, with its single quote written as \x27, which means the same. gen-python cuts
          a raw string at a single quote.
    aliases:
    - defReference
    annotations:
      upstream_definition: cpe_api_json_2.0.schema#/definitions/defReference
  NvdCpeNameLink:
    description: A pointer from one CPE name to another.
    slots:
    - cpeName
    - cpeNameId
    annotations:
      upstream_definition: cpe_api_json_2.0.schema#/definitions/defCpe/properties/cpe/properties/deprecatedBy/items
  NvdCpeMatchResponse:
    description: A page of the match-string API's results.
    mixins:
    - NvdResponseMixin
    slot_usage:
      format:
        equals_string: NVD_CPEMatchString
    attributes:
      matchStrings:
        description: The match strings on this page.
        range: NvdMatchStringItem
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
    close_mappings:
    - schema:DataFeed
    annotations:
      upstream_definition: cpematch_api_json_2.0.schema#
  NvdMatchStringItem:
    description: One entry of a match-string response, which only wraps the match string.
    attributes:
      matchString:
        description: The match string and what NVD holds about it.
        range: NvdMatchString
        inlined: true
        required: true
    close_mappings:
    - schema:DataFeedItem
    aliases:
    - def_matchstring
    annotations:
      upstream_definition: cpematch_api_json_2.0.schema#/definitions/def_matchstring
  NvdMatchString:
    description: A CPE match string or range as NVD holds it, and the CPE names it matches.
    slots:
    - criteria
    - matchCriteriaId
    - versionStartExcluding
    - versionStartIncluding
    - versionEndExcluding
    - versionEndIncluding
    - cve_created
    - lastModified
    - cve_status
    slot_usage:
      matchCriteriaId:
        identifier: true
      cve_created:
        required: true
      lastModified:
        required: true
      cve_status:
        required: true
        range: NvdMatchStringStatus
    attributes:
      cpeLastModified:
        description: When NVD last changed the list of CPE names this matches.
        range: nvd_timestamp
      matches:
        description: The CPE names this matches.
        range: NvdMatchedCpe
        multivalued: true
        inlined: true
        inlined_as_list: true
    notes:
    - The identifier is set on this class alone, because matchCriteriaId also appears in a vulnerability's
      configurations, where the same match string can recur with a different vulnerable flag. So it identifies
      a match string here and not a use of one there.
    aliases:
    - def_match_data
    annotations:
      upstream_definition: cpematch_api_json_2.0.schema#/definitions/def_match_data
  NvdMatchedCpe:
    description: A CPE name that a match string matches.
    slots:
    - cpeName
    - cpeNameId
    slot_usage:
      cpeName:
        required: true
      cpeNameId:
        required: true
    aliases:
    - def_cpe_name
    annotations:
      upstream_definition: cpematch_api_json_2.0.schema#/definitions/def_cpe_name
  NvdHistoryResponse:
    description: A page of the change-history API's results.
    mixins:
    - NvdResponseMixin
    slot_usage:
      format:
        equals_string: NVD_CVEHistory
    attributes:
      cveChanges:
        description: The changes on this page.
        range: NvdChangeItem
        multivalued: true
        inlined: true
        inlined_as_list: true
    close_mappings:
    - schema:DataFeed
    annotations:
      upstream_definition: cve_history_api_json_2.0.schema#
  NvdChangeItem:
    description: One entry of a change-history response, which only wraps the change.
    attributes:
      change:
        description: The change.
        range: NvdChange
        inlined: true
        required: true
    close_mappings:
    - schema:DataFeedItem
    aliases:
    - defChange
    annotations:
      upstream_definition: cve_history_api_json_2.0.schema#/definitions/defChange
  NvdChange:
    description: One change to a vulnerability's record at NVD.
    slots:
    - cveChangeId
    - sourceIdentifier
    - cve_created
    slot_usage:
      cveChangeId:
        identifier: true
      sourceIdentifier:
        required: true
    attributes:
      cveId:
        description: The vulnerability the change is to.
        range: NvdCve
        required: true
        pattern: ^CVE-[0-9]{4}-[0-9]{4,}$
      eventName:
        description: The kind of event, such as Initial Analysis or CVE Modified.
        required: true
        comments:
        - NVD's schema says only that this is a string. The samples read here hold too little of a list
          of 2.4 million changes to close it, so it stays a string.
      details:
        description: What the change did, part by part.
        range: NvdChangeDetail
        multivalued: true
        inlined: true
        inlined_as_list: true
    related_mappings:
    - prov:Activity
    comments:
    - A change is something that happened to a record, so it relates to a PROV activity, but NVD records
      only when and by whom, not the entities it used.
    notes:
    - The identifier is set on this class and not on the slot, so that lokf adapt keeps the key beside
      LOKF's id, as it does for cpeNameId and matchCriteriaId.
    aliases:
    - changeItem
    annotations:
      upstream_definition: cve_history_api_json_2.0.schema#/definitions/changeItem
  NvdChangeDetail:
    description: One part of a change, naming what kind of data changed and how.
    slots:
    - cve_type
    slot_usage:
      cve_type:
        required: true
        comments:
        - NVD's schema says only that this is a string, such as CWE or CVSS V3.1. It stays a string for
          the reason eventName does.
    attributes:
      action:
        description: How the data changed, such as Added.
      oldValue:
        description: The value before the change.
        any_of:
        - range: string
        - range: string
          multivalued: true
        - range: NvdChangeObject
      newValue:
        description: The value after the change.
        any_of:
        - range: string
        - range: string
          multivalued: true
        - range: NvdChangeObject
    aliases:
    - detail
    annotations:
      upstream_definition: cve_history_api_json_2.0.schema#/definitions/detail
  NvdChangeObject:
    description: A value before or after a change that is an object, with any keys.
    extra_slots:
      allowed: true
    comments:
    - NVD's file allows a string, an array or an object as a value, and states nothing of the object's
      keys. The 1,335 values of the three pages read on 2026-11-03 are all strings, so no key is named
      here, and LinkML's Pydantic generator, which ignores extra_slots, would refuse an object.
slots:
  format:
    description: The name NVD gives this kind of response.
    required: true
    slot_uri: nist_nvd:format
    comments:
    - NVD's schemas say only that this is a string. Each response class pins the one value the API's answers
      carry.
  cve_timestamp:
    description: When NVD produced this response or this decision.
    range: nvd_timestamp
    slot_uri: nist_nvd:timestamp
    close_mappings:
    - schema:dateCreated
    aliases:
    - timestamp
  cve_created:
    description: When NVD first recorded this.
    range: nvd_timestamp
    slot_uri: nist_nvd:created
    close_mappings:
    - dcterms:created
    aliases:
    - created
  lastModified:
    description: When NVD last changed this.
    range: nvd_timestamp
    slot_uri: nist_nvd:lastModified
    close_mappings:
    - dcterms:modified
    - schema:dateModified
    comments:
    - A CPE name, a match string and a vendor comment carry this too, so the mappings that hold only of
      a vulnerability sit on NvdCve's use of it.
  sourceIdentifier:
    description: The email address or UUID of the organization that supplied this.
    slot_uri: nist_nvd:sourceIdentifier
  cve_source:
    description: The email address or UUID of the organization that supplied this.
    slot_uri: nist_nvd:source
    aliases:
    - source
  cve_type:
    description: The kind of this thing, from the list its class names.
    slot_uri: nist_nvd:type
    aliases:
    - type
  cve_status:
    description: The state of this thing, from the list its class names.
    slot_uri: nist_nvd:status
    aliases:
    - status
  lang:
    description: The language of the text beside it, as a language code.
    required: true
    slot_uri: nist_nvd:lang
    close_mappings:
    - dcterms:language
    - schema:inLanguage
  cpeName:
    description: A Common Platform Enumeration (CPE) name, in its 2.3 formatted string.
    slot_uri: nist_nvd:cpeName
    related_mappings:
    - spdx3:Core/ExternalIdentifierType/cpe23
    comments:
    - SPDX 3.0.1 names CPE 2.3 as one kind of external identifier. That term is the kind, not a property
      that holds the name, so it is only related.
  cpeNameId:
    description: The UUID that NVD gives a CPE name.
    range: nvd_uuid
    slot_uri: nist_nvd:cpeNameId
  criteria:
    description: A CPE match string, which may hold wildcards.
    required: true
    slot_uri: nist_nvd:criteria
  matchCriteriaId:
    description: The UUID that NVD gives a CPE match string.
    required: true
    range: nvd_uuid
    slot_uri: nist_nvd:matchCriteriaId
  versionStartExcluding:
    description: The version above which the match starts, itself left out.
    slot_uri: nist_nvd:versionStartExcluding
  versionStartIncluding:
    description: The first version the match covers.
    slot_uri: nist_nvd:versionStartIncluding
  versionEndExcluding:
    description: The version below which the match ends, itself left out.
    slot_uri: nist_nvd:versionEndExcluding
  versionEndIncluding:
    description: The last version the match covers.
    slot_uri: nist_nvd:versionEndIncluding
  cve_version:
    description: A version string. On a score it is the CVSS version; on a product entry, the product's.
    slot_uri: cve:version
    comments:
    - Each class that uses it narrows it. A top-level slot, so that lokf adapt renames it beside LOKF's
      version.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/version imports/cvss/cvss-v3.0.json#/properties/version
        imports/cvss/cvss-v3.1.json#/properties/version imports/cvss/cvss-v4.0.json#/properties/version
    aliases:
    - version
  vectorString:
    description: The scores' metric values written as one compact string.
    required: true
    close_mappings:
    - sepses_cvss:vectorString
    - spdx_security:vectorString
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/vectorString imports/cvss/cvss-v3.0.json#/properties/vectorString
        imports/cvss/cvss-v3.1.json#/properties/vectorString imports/cvss/cvss-v4.0.json#/properties/vectorString
    slot_uri: cve:vectorString
  baseScore:
    description: The score from 0 to 10 for what is inherent in the flaw.
    range: float
    required: true
    minimum_value: 0
    maximum_value: 10
    close_mappings:
    - sepses_cvss:baseScore
    - spdx_security:score
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/definitions/scoreType imports/cvss/cvss-v3.0.json#/definitions/scoreType
        imports/cvss/cvss-v3.1.json#/definitions/scoreType imports/cvss/cvss-v4.0.json#/definitions/scoreType
    slot_uri: cve:baseScore
  baseSeverity:
    description: The rating in words that the base score falls under.
    range: CvssSeverity
    required: true
    close_mappings:
    - sepses_cvss:baseSeverity
    - spdx_security:severity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/baseSeverity imports/cvss/cvss-v3.1.json#/properties/baseSeverity
        imports/cvss/cvss-v4.0.json#/properties/baseSeverity
    slot_uri: cve:baseSeverity
  temporalScore:
    description: The base score adjusted for what changes over time, such as a fix appearing.
    range: float
    minimum_value: 0
    maximum_value: 10
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/temporalScore imports/cvss/cvss-v3.0.json#/properties/temporalScore
        imports/cvss/cvss-v3.1.json#/properties/temporalScore
    slot_uri: cve:temporalScore
  temporalSeverity:
    description: The rating in words for the temporal score.
    range: CvssSeverity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/temporalSeverity imports/cvss/cvss-v3.1.json#/properties/temporalSeverity
    slot_uri: cve:temporalSeverity
  environmentalScore:
    description: The score adjusted for the scorer's own environment.
    range: float
    minimum_value: 0
    maximum_value: 10
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/environmentalScore imports/cvss/cvss-v3.0.json#/properties/environmentalScore
        imports/cvss/cvss-v3.1.json#/properties/environmentalScore
    slot_uri: cve:environmentalScore
  environmentalSeverity:
    description: The rating in words for the environmental score.
    range: CvssSeverity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/environmentalSeverity imports/cvss/cvss-v3.1.json#/properties/environmentalSeverity
    slot_uri: cve:environmentalSeverity
  attackVector:
    description: How far away an attacker can be when using the flaw.
    close_mappings:
    - sepses_cvss:attackVector
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/attackVector imports/cvss/cvss-v3.1.json#/properties/attackVector
        imports/cvss/cvss-v4.0.json#/properties/attackVector
    slot_uri: cve:attackVector
  attackComplexity:
    description: How much is outside the attacker's control when using the flaw.
    close_mappings:
    - sepses_cvss:attackComplexity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/attackComplexity imports/cvss/cvss-v3.1.json#/properties/attackComplexity
        imports/cvss/cvss-v4.0.json#/properties/attackComplexity
    slot_uri: cve:attackComplexity
  privilegesRequired:
    description: What level of access an attacker needs before using the flaw.
    close_mappings:
    - sepses_cvss:privilegesRequired
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/privilegesRequired imports/cvss/cvss-v3.1.json#/properties/privilegesRequired
        imports/cvss/cvss-v4.0.json#/properties/privilegesRequired
    slot_uri: cve:privilegesRequired
  userInteraction:
    description: Whether someone other than the attacker has to take part.
    close_mappings:
    - sepses_cvss:userInteraction
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/userInteraction imports/cvss/cvss-v3.1.json#/properties/userInteraction
        imports/cvss/cvss-v4.0.json#/properties/userInteraction
    slot_uri: cve:userInteraction
  scope:
    description: Whether an attack can reach beyond the component that holds the flaw.
    range: CvssV3Scope
    close_mappings:
    - sepses_cvss:scope
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/scope imports/cvss/cvss-v3.1.json#/properties/scope
    slot_uri: cve:scope
  confidentialityImpact:
    description: How much information an attack could expose.
    close_mappings:
    - sepses_cvss:confidentialityImpact
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/confidentialityImpact imports/cvss/cvss-v3.0.json#/properties/confidentialityImpact
        imports/cvss/cvss-v3.1.json#/properties/confidentialityImpact
    slot_uri: cve:confidentialityImpact
  integrityImpact:
    description: How much an attack could change that should not change.
    close_mappings:
    - sepses_cvss:integrityImpact
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/integrityImpact imports/cvss/cvss-v3.0.json#/properties/integrityImpact
        imports/cvss/cvss-v3.1.json#/properties/integrityImpact
    slot_uri: cve:integrityImpact
  availabilityImpact:
    description: How much an attack could disrupt the service.
    close_mappings:
    - sepses_cvss:availabilityImpact
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/availabilityImpact imports/cvss/cvss-v3.0.json#/properties/availabilityImpact
        imports/cvss/cvss-v3.1.json#/properties/availabilityImpact
    slot_uri: cve:availabilityImpact
  exploitCodeMaturity:
    description: How far working attack code has come.
    range: CvssExploitCodeMaturity
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/exploitCodeMaturity imports/cvss/cvss-v3.1.json#/properties/exploitCodeMaturity
    slot_uri: cve:exploitCodeMaturity
  remediationLevel:
    description: What kind of fix is available.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/remediationLevel imports/cvss/cvss-v3.0.json#/properties/remediationLevel
        imports/cvss/cvss-v3.1.json#/properties/remediationLevel
    slot_uri: cve:remediationLevel
  reportConfidence:
    description: How far the flaw's existence and details have been confirmed.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/reportConfidence imports/cvss/cvss-v3.0.json#/properties/reportConfidence
        imports/cvss/cvss-v3.1.json#/properties/reportConfidence
    slot_uri: cve:reportConfidence
  confidentialityRequirement:
    description: How much confidentiality matters to the scorer for the affected system.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/confidentialityRequirement imports/cvss/cvss-v3.0.json#/properties/confidentialityRequirement
        imports/cvss/cvss-v3.1.json#/properties/confidentialityRequirement imports/cvss/cvss-v4.0.json#/properties/confidentialityRequirement
    slot_uri: cve:confidentialityRequirement
  integrityRequirement:
    description: How much integrity matters to the scorer for the affected system.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/integrityRequirement imports/cvss/cvss-v3.0.json#/properties/integrityRequirement
        imports/cvss/cvss-v3.1.json#/properties/integrityRequirement imports/cvss/cvss-v4.0.json#/properties/integrityRequirement
    slot_uri: cve:integrityRequirement
  availabilityRequirement:
    description: How much availability matters to the scorer for the affected system.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/properties/availabilityRequirement imports/cvss/cvss-v3.0.json#/properties/availabilityRequirement
        imports/cvss/cvss-v3.1.json#/properties/availabilityRequirement imports/cvss/cvss-v4.0.json#/properties/availabilityRequirement
    slot_uri: cve:availabilityRequirement
  modifiedAttackVector:
    description: The attack vector as the scorer's own environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedAttackVector imports/cvss/cvss-v3.1.json#/properties/modifiedAttackVector
        imports/cvss/cvss-v4.0.json#/properties/modifiedAttackVector
    slot_uri: cve:modifiedAttackVector
  modifiedAttackComplexity:
    description: The attack complexity as the scorer's own environment changes it.
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/properties/modifiedAttackComplexity imports/cvss/cvss-v3.1.json#/properties/modifiedAttackComplexity
        imports/cvss/cvss-v4.0.json#/properties/modifiedAttackComplexity
    slot_uri: cve:modifiedAttackComplexity
  modifiedPrivilegesRequired:
    description: The privileges needed as the scorer's own environment changes them.
    annotations:

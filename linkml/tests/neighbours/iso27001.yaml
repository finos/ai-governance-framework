      assessment_date:
        description: When the assessment was carried out.
        range: date
      assessment_assessor:
        description: Who carried out the assessment.
      assessment_method_used:
        description: The method this assessment applied.
      assessment_risks:
        description: The risks the assessment identified.
        range: IsmsRisk
        multivalued: true
      assessment_summary:
        description: A summary of what the assessment found.
      assessment_recommendations:
        description: What the assessment recommends.
        multivalued: true
      assessment_next_date:
        description: When the next assessment is planned.
        range: date
  IsmsRisk:
    mixins:
    - IsmsRecordMixin
    description: 'An information security risk in the risk register: where it comes from, what it threatens,
      who owns it, how it is rated before and after controls, and how it is treated.'
    in_subset:
    - isms_risk_management
    annotations:
      iso27001_clause: 6.1.2
    slots:
    - affected_assets
    - affected_security_properties
    attributes:
      risk_source:
        description: Where the risk comes from.
      risk_threat:
        description: The threat that could cause harm.
      risk_vulnerability:
        description: The weakness the threat could exploit.
      risk_owner:
        description: The person who is accountable for the risk and has the authority to manage it.
      risk_likelihood:
        description: How likely the risk is.
        range: IsmsLikelihood
      risk_impact:
        description: How severe the consequences would be.
        range: IsmsImpact
      risk_inherent_level:
        description: The risk's level before controls.
        range: IsmsRiskLevel
      risk_existing_controls:
        description: The organization's controls already acting on the risk.
        range: IsmsControl
        multivalued: true
      risk_residual_level:
        description: The risk's level after controls.
        range: IsmsRiskLevel
      risk_treatment_option:
        description: The treatment chosen for the risk.
        range: IsmsRiskTreatmentOption
      risk_treatment_priority:
        description: How soon the risk is to be treated, in the organization's own terms.
  IsmsRiskTreatmentProcess:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: 'The organization''s process for treating information security risks: how it chooses
      treatments and controls, checks them against Annex A, and produces the Statement of Applicability.'
    in_subset:
    - isms_risk_management
    - isms_documented_information
    annotations:
      iso27001_clause: 6.1.3
    attributes:
      treatment_options_guidance:
        description: How a treatment option is chosen for a risk.
      treatment_control_selection:
        description: How the controls a treatment needs are chosen.
      treatment_annex_a_comparison:
        description: How the chosen controls are compared with Annex A, so that no necessary control is
          left out.
      treatment_soa_template:
        description: The template the Statement of Applicability follows.
      treatment_approval_workflow:
        description: How a treatment plan and its residual risks are approved.
  IsmsRiskTreatmentPlan:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: 'A plan to treat one or more risks: the actions and controls, who carries them out and
      when, and the risk owner''s approval of the plan and of the residual risk.'
    in_subset:
    - isms_risk_management
    - isms_documented_information
    annotations:
      iso27001_clause: 6.1.3
    related_mappings:
    - oscal:PlanOfActionAndMilestones
    slots:
    - implementation_state
    attributes:
      plan_scope:
        description: What the plan covers.
      plan_risks:
        description: The risks the plan treats.
        range: IsmsRisk
        multivalued: true
      plan_actions:
        description: The actions the plan takes.
        multivalued: true
      plan_controls:
        description: The controls the plan puts in place.
        range: IsmsControl
        multivalued: true
      plan_resources:
        description: The resources the plan needs.
      plan_responsible_parties:
        description: Who carries out the plan.
        multivalued: true
      plan_timeline:
        description: When the plan's actions are to happen.
      plan_risk_owner_approval:
        description: The risk owner who approved the plan.
      plan_residual_risk_acceptance:
        description: How the risk owners accepted the risk that remains.
      plan_completion_date:
        description: When the plan was completed.
        range: date
  IsmsStatementOfApplicability:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: 'The Statement of Applicability: each control the organization needs, with why it is
      included and whether it is in place, and each Annex A control it leaves out, with why.'
    in_subset:
    - isms_annex_a
    - isms_documented_information
    annotations:
      iso27001_clause: 6.1.3
    related_mappings:
    - oscal:SspControlImplementation
    attributes:
      soa_entries:
        description: The statement's entries, one for each control included or Annex A control excluded.
        range: IsmsApplicabilityEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
  IsmsApplicabilityEntry:
    abstract: true
    description: One entry of the Statement of Applicability, which either includes a control or excludes
      an Annex A control, and says why.
    in_subset:
    - isms_annex_a
    annotations:
      iso27001_clause: 6.1.3
    slots:
    - entry_annex_a_control
    attributes:
      entry_type:
        description: 'The kind of entry: IsmsIncludedControl or IsmsExcludedControl.'
        range: string
      entry_justification:
        description: Why the control is included or excluded.
        required: true
        pattern: ^\s*\S
  IsmsIncludedControl:
    is_a: IsmsApplicabilityEntry
    description: An entry that includes a control the organization needs, from Annex A or from elsewhere,
      and says whether it is in place.
    in_subset:
    - isms_annex_a
    close_mappings:
    - oscal:SspImplementedRequirement
    comments:
    - An included control names an Annex A control, one of the organization's controls, or both.
    any_of:
    - slot_conditions:
        entry_annex_a_control:
          required: true
    - slot_conditions:
        included_control:
          required: true
    slots:
    - implementation_state
    - responsible_role
    slot_usage:
      implementation_state:
        required: true
    attributes:
      included_control:
        description: The organization's control the entry includes.
        range: IsmsControl
      included_evidence:
        description: What shows that the control is in place.
      included_target_date:
        description: When the control is to be in place, if it is not yet.
        range: date
  IsmsExcludedControl:
    is_a: IsmsApplicabilityEntry
    description: An entry that leaves out an Annex A control the organization does not need, and says
      why.
    in_subset:
    - isms_annex_a
    slot_usage:
      entry_annex_a_control:
        required: true
  IsmsControl:
    mixins:
    - IsmsRecordMixin
    description: A control the organization has determined it needs to treat its risks. It records what
      the control does in the organization's words and which Annex A controls it answers to. It also records
      who owns it, how far it is in place and how well it works.
    in_subset:
    - isms_annex_a
    annotations:
      iso27001_clause: 6.1.3
    related_mappings:
    - oscal:Control
    - nist_sp_800_53:Control
    comments:
    - The text and guidance are the organization's own words, never the text of ISO/IEC 27001 or ISO/IEC
      27002. A control from another source names no Annex A control.
    slots:
    - relevant_controls
    - implementation_state
    attributes:
      control_annex_a_controls:
        description: The Annex A controls the control answers to.
        range: IsmsAnnexAControl
        multivalued: true
      control_theme:
        description: Which of Annex A's four themes the control belongs to.
        range: IsmsControlTheme
      control_text:
        description: What the control does, in the organization's own words.
      control_guidance:
        description: The organization's notes on putting the control in place.
      control_threats:
        description: The threats the control acts against.
        multivalued: true
      control_asset_types:
        description: The kinds of asset the control applies to.
        multivalued: true
      control_owner:
        description: The person who owns the control.
      control_implementation_date:
        description: When the control was put in place.
        range: date
      control_effectiveness:
        description: How well the control works, in the organization's own terms.
      control_last_tested:
        description: When the control was last tested.
        range: date
      control_evidence:
        description: Where the evidence that the control is in place is kept.
        multivalued: true
    is_a: Concept
  IsmsAsset:
    mixins:
    - IsmsRecordMixin
    description: 'An item in the inventory of information and other associated assets: what it is, who
      owns and looks after it, where it is, how it is classified and how much it matters.'
    in_subset:
    - isms_annex_a
    annotations:
      annex_a_control: '5.9'
    related_mappings:
    - oscal:SspInventoryItem
    - spdx_software:Package
    slots:
    - relevant_controls
    attributes:
      asset_category:
        description: What kind of asset it is, such as information, software, hardware or a service.
      asset_owner:
        description: Who owns the asset.
      asset_custodian:
        description: Who looks after the asset from day to day.
      asset_classification:
        description: The information classification the asset carries.
      asset_location:
        description: Where the asset is, physically or logically.
      asset_criticality:
        description: How much the asset matters, in the organization's own terms.
    is_a: Concept
  IsmsResource:
    mixins:
    - IsmsRecordMixin
    description: A resource provided for the ISMS, such as people, time, tools or budget.
    in_subset:
    - isms_core
    annotations:
      iso27001_clause: '7.1'
    attributes:
      resource_category:
        description: What kind of resource it is.
      resource_quantity:
        description: How much of the resource is provided.
      resource_allocation_date:
        description: When the resource was allocated.
        range: date
      resource_allocated_to:
        description: What the resource is allocated to.
      resource_cost:
        description: What the resource costs.
      resource_availability:
        description: Whether the resource is available now, in the organization's own terms.
  IsmsCompetenceRecord:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: The evidence of one person's competence for work that affects information security, and
      what is done to close any gap.
    in_subset:
    - isms_core
    - isms_documented_information
    annotations:
      iso27001_clause: '7.2'
    attributes:
      competence_person:
        description: The person the record is about.
      competence_role:
        description: The role the person holds.
        range: IsmsRole
      competence_required:
        description: The competences the role needs.
        multivalued: true
      competence_education:
        description: The person's relevant education.
        multivalued: true
      competence_training:
        description: The training the person has completed.
        multivalued: true
      competence_experience:
        description: The person's relevant experience.
        multivalued: true
      competence_assessment_date:
        description: When the person's competence was last assessed.
        range: date
      competence_gaps:
        description: The gaps the assessment found.
        multivalued: true
      competence_actions:
        description: What is done to close the gaps.
        multivalued: true
  IsmsAwarenessProgramme:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: The programme that makes people working for the organization aware of the policy, their
      part in the ISMS and what failing it would mean.
    in_subset:
    - isms_core
    annotations:
      iso27001_clause: '7.3'
    attributes:
      awareness_topics:
        description: The topics the programme covers.
        multivalued: true
      awareness_methods:
        description: How the programme is delivered.
        multivalued: true
      awareness_audience:
        description: Whom the programme is for.
      awareness_frequency:
        description: How often the programme runs.
      awareness_completion_tracking:
        description: How completion is tracked.
      awareness_effectiveness:
        description: How the programme's effect is measured.
  IsmsCommunicationPlan:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: The plan for communication about the ISMS, inside the organization and outside it.
    in_subset:
    - isms_core
    - isms_documented_information
    annotations:
      iso27001_clause: '7.4'
    attributes:
      communication_items:
        description: The communications the plan provides for.
        range: IsmsCommunication
        multivalued: true
        inlined: true
        inlined_as_list: true
  IsmsCommunication:
    description: 'One communication the plan provides for: what about, why, to whom, how often, how, and
      who communicates.'
    in_subset:
    - isms_core
    annotations:
      iso27001_clause: '7.4'
    slots:
    - responsible_role
    attributes:
      communication_subject:
        description: What the communication is about.
        required: true
      communication_purpose:
        description: Why it is communicated.
      communication_audience:
        description: To whom it is communicated.
      communication_frequency:
        description: How often it is communicated.
      communication_method:
        description: How it is communicated.
      communication_records_required:
        description: Whether a record of the communication is kept.
        range: boolean
  IsmsDocumentedInformation:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: A piece of documented information the ISMS keeps under control that no more specific
      record describes, such as a procedure, a standard, a plan or a report.
    in_subset:
    - isms_documented_information
    annotations:
      iso27001_clause: '7.5'
    attributes:
      document_kind:
        description: What kind of documented information it is.
        range: IsmsDocumentKind
        required: true
    is_a: Concept
  IsmsOperationalProcedure:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: A procedure by which the organization plans and controls the processes that meet its
      information security requirements.
    in_subset:
    - isms_documented_information
    annotations:
      iso27001_clause: '8.1'
    slots:
    - relevant_controls
    attributes:
      procedure_scope:
        description: What the procedure covers.
      procedure_criteria:
        description: The criteria the processes are run to.
      procedure_control_measures:
        description: The measures that control the processes.
        multivalued: true
      procedure_roles:
        description: The roles that carry out the procedure.
        range: IsmsRole
        multivalued: true
      procedure_change_control:
        description: How changes to the processes are controlled.
    is_a: Concept
  IsmsMonitoringProgramme:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: The programme of monitoring, measurement, analysis and evaluation of information security
      performance and of the ISMS's effectiveness.
    in_subset:
    - isms_performance_evaluation
    - isms_documented_information
    annotations:
      iso27001_clause: '9.1'
    attributes:
      monitoring_items:
        description: What the programme monitors and measures.
        range: IsmsMonitoringItem
        multivalued: true
        inlined: true
        inlined_as_list: true
  IsmsMonitoringItem:
    description: 'One thing the monitoring programme measures: what, how, how often and by whom it is
      measured and analysed, and against what thresholds.'
    in_subset:
    - isms_performance_evaluation
    annotations:
      iso27001_clause: '9.1'
    slots:
    - responsible_role
    attributes:
      monitoring_metric:
        description: The name of what is measured.
        required: true
      monitoring_description:
        description: What the measurement shows.
      monitoring_method:
        description: How it is measured.
      monitoring_frequency:
        description: How often it is measured.
      monitoring_analysis_frequency:
        description: How often the results are analysed and evaluated.
      monitoring_analyst:
        description: Who analyses and evaluates the results.
      monitoring_target:
        description: The value aimed for.
      monitoring_alert_threshold:
        description: The value that calls for action.
      monitoring_current_value:
        description: The value last measured.
      monitoring_trend:
        description: Which way the value is moving.
  IsmsAuditProgramme:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: 'An internal audit programme: the audits planned over a period, how often and why, and
      the resources and auditors they need.'
    in_subset:
    - isms_performance_evaluation
    - isms_documented_information
    annotations:
      iso27001_clause: 9.2.2
    related_mappings:
    - oscal:AssessmentPlan
    attributes:
      programme_period:
        description: The period the programme covers.
      programme_audits:
        description: The audits the programme plans.
        range: IsmsAudit
        multivalued: true
      programme_frequency_rationale:
        description: Why the audits happen as often as they do.
      programme_resources:
        description: The resources the programme needs.
      programme_auditor_qualifications:
        description: The qualifications the auditors need.
      programme_status:
        description: Where the programme stands, in the organization's own terms.
  IsmsAudit:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: 'An audit of the ISMS: an internal audit, or an audit by a customer or a certification
      body, with its scope, criteria, team, findings and conclusion.'
    in_subset:
    - isms_performance_evaluation
    - isms_documented_information
    annotations:
      iso27001_clause: '9.2'
    related_mappings:
    - oscal:AssessmentPlan
    comments:
    - An audit of several management systems at once lists each standard in audit_standards.
    attributes:
      audit_type:
        description: Who carries out the audit, relative to the organization.
        range: IsmsAuditType
        required: true
      audit_standards:
        description: The management system standards the audit covers.
        range: IsmsManagementSystemStandard
        multivalued: true
      audit_scope:
        description: What the audit covers.
      audit_criteria:
        description: What the audit compares the ISMS against.
        multivalued: true
      audit_objectives:
        description: What the audit sets out to establish.
        multivalued: true
      audit_period_start:
        description: When the audit began.
        range: date
      audit_period_end:
        description: When the audit ended.
        range: date
      audit_lead:
        description: Who led the audit.
      audit_team:
        description: Who else audited.
        multivalued: true
      audit_auditees:
        description: Who represented the parts of the organization audited.
        multivalued: true
      audit_plan:
        description: The documented information that holds the audit plan.
        range: IsmsDocumentedInformation
      audit_findings:
        description: What the audit found, good and bad.
        range: IsmsAuditFinding
        multivalued: true
        inlined: true
        inlined_as_list: true
      audit_conclusion:
        description: The audit's overall conclusion.
      audit_report_date:
        description: When the audit report was issued.
        range: date
      audit_report_distribution:
        description: Who received the audit report.
        multivalued: true
  IsmsAuditFinding:
    mixins:
    - IsmsRecordMixin
    description: 'One finding of an audit: a nonconformity, an observation or a strength, with the requirement
      or control it concerns, its evidence and how it is closed.'
    in_subset:
    - isms_performance_evaluation
    annotations:
      iso27001_clause: '9.2'
    attributes:
      finding_type:
        description: What kind of finding it is.
        range: IsmsAuditFindingType
        required: true
      finding_requirement:
        description: The clause or Annex A control of ISO/IEC 27001:2022 the finding concerns, by number.
        range: isms_requirement_reference
      finding_control:
        description: The organization's control the finding concerns.
        range: IsmsControl
      finding_evidence:
        description: The objective evidence for the finding.
      finding_root_cause:
        description: What the analysis of the finding's cause found.
      finding_risk:
        description: What the finding means for risk.
      finding_recommendation:
        description: What the auditor recommends.
      finding_auditee_response:
        description: How the auditee responded.
      finding_corrective_action:
        description: The corrective action the finding led to.
        range: IsmsCorrectiveAction
      finding_closure_status:
        description: Whether the finding is closed, in the organization's own terms.
      finding_closure_date:
        description: When the finding was closed.
        range: date
  IsmsManagementReview:
    mixins:
    - IsmsRecordMixin
    - IsmsDocumentControlMixin
    description: 'A review of the ISMS by top management: what it considered, what it decided and what
      it asked to be done.'
    in_subset:
    - isms_performance_evaluation
    - isms_documented_information
    annotations:
      iso27001_clause: '9.3'
    attributes:
      review_held_on:
        description: When the review was held.
        range: date
        required: true
      review_attendees:
        description: Who attended the review.
        multivalued: true
      review_previous_actions:
        description: Where the actions from earlier reviews stand.
      review_context_changes:
        description: How the issues that bear on the ISMS have changed.
      review_interested_party_changes:
        description: How interested parties' needs and expectations have changed.
      review_interested_party_feedback:
        description: What interested parties said.
      review_performance_trends:
        description: The trends in information security performance.
      review_audit_results:
        description: What the audits found.
      review_risk_assessment_results:
        description: What the risk assessments found.
      review_risk_treatment_status:
        description: Where risk treatment stands.
      review_risks_and_opportunities:
        description: How risks and opportunities have changed.
      review_improvement_opportunities:
        description: The opportunities for improvement raised.
        multivalued: true
      review_decisions:
        description: What the review decided.
        multivalued: true
      review_actions:
        description: What the review asked to be done.
        multivalued: true
      review_next_date:
        description: When the next review is planned.
        range: date
  IsmsNonconformity:
    mixins:
    - IsmsRecordMixin
    description: 'A nonconformity: a requirement not met, how it was found and contained, its consequences
      and cause, and how it was closed.'
    in_subset:
    - isms_improvement
    annotations:
      iso27001_clause: '10.2'
    attributes:
      nonconformity_source:
        description: How the nonconformity came to light, such as an audit, a review or an incident.
      nonconformity_detected_on:
        description: When the nonconformity was found.
        range: date
      nonconformity_detected_by:
        description: Who or what found it.
      nonconformity_requirement:
        description: The requirement that was not met, of ISO/IEC 27001, of the organization or of an
          interested party.
      nonconformity_immediate_actions:
        description: What was done at once to control and correct it.
        multivalued: true
      nonconformity_consequences:
        description: How its consequences were dealt with.
      nonconformity_root_cause:
        description: What caused it.
      nonconformity_similar_check:
        description: Whether similar nonconformities exist or could occur, and where.
      nonconformity_status:
        description: Where the nonconformity stands, in the organization's own terms.
      nonconformity_closure_date:
        description: When it was closed.
        range: date
      nonconformity_closure_evidence:
        description: What shows that it is closed.
  IsmsCorrectiveAction:
    mixins:
    - IsmsRecordMixin
    description: An action that removes the cause of one or more nonconformities so that they do not recur,
      and the check that it worked.
    in_subset:
    - isms_improvement
    annotations:
      iso27001_clause: '10.2'
    related_mappings:
    - oscal:PoamItem
    slots:
    - responsible_role
    attributes:
      action_nonconformities:
        description: The nonconformities the action addresses.
        range: IsmsNonconformity
        multivalued: true
      action_root_cause:
        description: The cause the action removes.
      action_target_date:
        description: When the action is to be complete.
        range: date
      action_completion_date:
        description: When the action was complete.
        range: date
      action_resources:
        description: The resources the action needs.
      action_effectiveness_criteria:
        description: How the action's effect will be judged.
      action_effectiveness_review_date:
        description: When the action's effect was reviewed.
        range: date
      action_effective:
        description: Whether the review found the action effective.
        range: boolean
      action_isms_changes:
        description: The changes to the ISMS the action needs.
      action_status:
        description: Where the action stands, in the organization's own terms.
  IsmsImprovementOpportunity:
    mixins:
    - IsmsRecordMixin
    description: An opportunity to improve the ISMS's suitability, adequacy or effectiveness, and what
      came of it.
    in_subset:
    - isms_improvement
    annotations:
      iso27001_clause: '10.1'
    slots:
    - responsible_role
    attributes:
      improvement_source:
        description: Where the opportunity came from, such as a review, an audit or daily work.
      improvement_identified_on:
        description: When the opportunity was identified.
        range: date
      improvement_identified_by:
        description: Who identified it.
      improvement_benefit:
        description: What the improvement is expected to bring.
      improvement_priority:
        description: How soon it is to be acted on, in the organization's own terms.
      improvement_plan:
        description: How the improvement is to be made.
      improvement_target_date:
        description: When the improvement is to be made.
        range: date
      improvement_completion_date:
        description: When it was made.
        range: date
      improvement_outcome:
        description: What the improvement brought.
      improvement_status:
        description: Where it stands, in the organization's own terms.
  IsmsSecurityEvent:
    mixins:
    - IsmsRecordMixin
    description: An information security event someone reported, and the assessment of whether it is an
      incident. An event assessed as an incident is recorded as an IsmsSecurityIncident.
    in_subset:
    - isms_annex_a
    annotations:
      annex_a_control: '5.25'
    slots:
    - affected_assets
    attributes:
      event_type:
        description: 'The kind of record: IsmsSecurityEvent, or IsmsSecurityIncident for an event assessed
          as an incident.'
        range: string
      event_occurred_at:
        description: When the event happened, or when it was first noticed.
        range: datetime
      event_reporter:
        description: Who reported the event.
      event_assessment:
        description: What the assessment of the event found.
  IsmsSecurityIncident:
    is_a: IsmsSecurityEvent
    description: 'An information security event assessed as an incident: its category and severity, how
      it was detected, contained, eradicated and recovered from, the evidence collected, who was told,
      and what was learned.'
    in_subset:
    - isms_annex_a
    annotations:
      annex_a_control: '5.26'
    slots:
    - affected_security_properties
    attributes:
      incident_category:
        description: What kind of incident it is.
        range: IsmsIncidentCategory
      incident_severity:
        description: How severe the incident is.
        range: IsmsRiskLevel
      incident_detection_method:
        description: How the incident was detected.
      incident_response_actions:
        description: What was done in response.
        multivalued: true
      incident_containment_actions:
        description: What was done to contain it.
        multivalued: true
      incident_eradication_actions:
        description: What was done to remove its cause.
        multivalued: true
      incident_recovery_actions:
        description: What was done to restore normal operation.
        multivalued: true
      incident_root_cause:
        description: What caused the incident.
      incident_lessons_learned:
        description: What the organization learned from it.
        multivalued: true
        annotations:
          annex_a_control: '5.27'
      incident_evidence:
        description: The evidence collected about it.
        multivalued: true
        annotations:
          annex_a_control: '5.28'
      incident_notification_required:
        description: Whether authorities or other parties had to be told.
        range: boolean
      incident_notifications:
        description: Whom the organization told, and when.
        multivalued: true
      incident_closed_at:
        description: When the incident was closed.
        range: datetime
      incident_review:
        description: What the review after the incident found.

    attributes:
      isms_organization:
        description: The organization that runs the ISMS.
        range: IsmsOrganization
        inlined: true
      isms_top_management:
        description: The person or group that directs and controls the organization at the highest level.
      isms_governing_body:
        description: The body top management answers to, such as a board, where there is one.
      isms_leadership_evidence:
        description: What shows that top management leads and commits to the ISMS.
        multivalued: true
        annotations:
          iso27001_clause: '5.1'
      isms_scope:
        description: The scope of the ISMS, as the organization states it.
        annotations:
          iso27001_clause: '4.3'
      isms_scope_boundaries:

      organization_locations:
        description: The countries or regions the organization works in.
        multivalued: true
      organization_jurisdictions:
        description: The jurisdictions whose laws and regulations apply to the organization.
        multivalued: true
      organization_parent:
        description: The organization's parent, if it has one.
      organization_subsidiaries:
        description: The organization's subsidiaries, if it has any.
        multivalued: true

        description: The criteria for carrying out a risk assessment.
      risk_assessment_method:
        description: The method used to identify, analyse and evaluate risks.
      risk_likelihood_scale:
        description: The scale for rating likelihood.
      risk_impact_scale:
        description: The scale for rating consequences.
      risk_matrix:
        description: How likelihood and consequence combine into a risk level.

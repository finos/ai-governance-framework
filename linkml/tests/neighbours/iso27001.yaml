# Generated by `lokf adapt` from iso27001.yaml (iso27001 2022/Amd 1:2024); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/iso27001-lokf
name: iso27001
title: ISO/IEC 27001:2022 information security management system records
description: A LinkML model of the records an organization keeps to run an information security management
  system (ISMS) to ISO/IEC 27001:2022 with Amendment 1:2024. The records cover the ISMS's context and
  scope, policies, roles and objectives, risks and their treatment, and its controls and Statement of
  Applicability. They also cover the support and operation it needs, its audits and management reviews,
  and its nonconformities, corrective actions and improvements. The 93 reference controls of Annex A appear
  by their numbers alone.
version: 2022/Amd 1:2024
source: https://www.iso.org/standard/82875.html
license: Apache-2.0
see_also:
- https://lmodel.github.io/iso27001
- https://www.iso.org/standard/82875.html
- https://www.iso.org/standard/88435.html
annotations:
  standard: ISO/IEC 27001:2022
  edition: '3'
  publication_date: '2022-10-25'
  amendment: ISO/IEC 27001:2022/Amd 1:2024
  amendment_publication_date: '2024-02-23'
  terms_reference: ISO/IEC 27000:2026
  iso_open_data_date: '2026-10-28'
comments:
- The version is the edition the schema models, 2022, with its one amendment, Amd 1:2024, and source is
  ISO's page for that edition. ISO Open Data's records of both, and of ISO/IEC 27002:2022 and ISO/IEC
  27000:2026, are copied to src/iso27001/schema/iso-open-data/ as of the date in the annotations. scripts/check_upstream_release.py
  reports when ISO publishes another supplement or edition. The release tags are the schema's own versions.
- ISO/IEC 27001 is copyright ISO and IEC, and none of its text is reproduced here. Each element cites
  the clause or Annex A control it models by number, in the iso27001_clause or annex_a_control annotation,
  and its description is this project's own words. A licence holder can merge the standard's wording into
  a private copy with the overlay that src/iso27001/schema/OVERLAY.md describes.
- The terms follow ISO/IEC 27000, which ISO/IEC 27001 refers to for them. On the pinned date its current
  edition is ISO/IEC 27000:2026, which ISO's record titles an overview, where every earlier edition was
  an overview and vocabulary. Whether that edition still defines the terms has not been checked against
  its text.
- Every record that other records refer to has an isms_id, and a reference holds that identifier. IsmsManagementSystem
  holds each kind of record in a list of its own.
- The mappings name terms of the released lmodel/oscal, lmodel/spdx and lmodel/nist-sp-800-53 schemas,
  and come from the SSSOM files in src/iso27001/mappings/.
default_prefix: iso27001
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  iso27001: https://w3id.org/lmodel/iso27001/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
  oscal: https://w3id.org/lmodel/oscal/
  nist_sp_800_53: https://w3id.org/lmodel/nist-sp-800-53/
  spdx_core: https://spdx.org/rdf/3.0.1/terms/Core/
  spdx_software: https://spdx.org/rdf/3.0.1/terms/Software/
imports:
- linkml:types
- lokf
subsets:
  isms_core:
    description: The records of the ISMS's context, leadership, planning and support (clauses 4 to 7).
  isms_risk_management:
    description: The records of risk assessment and risk treatment (clauses 6.1.2, 6.1.3, 8.2 and 8.3).
  isms_annex_a:
    description: The Annex A reference controls, the organization's controls and the Statement of Applicability,
      and the records Annex A controls call for.
  isms_performance_evaluation:
    description: The records of monitoring, internal audit and management review (clause 9).
  isms_improvement:
    description: The records of continual improvement, nonconformity and corrective action (clause 10).
  isms_documented_information:
    description: The records that are documented information under document control (clause 7.5).
types:
  isms_duration:
    typeof: string
    base: str
    uri: xsd:duration
    description: A length of time as ISO 8601 writes it, such as P7Y for seven years or P30D for thirty
      days.
    pattern: ^P(?=[0-9T])([0-9]+Y)?([0-9]+M)?([0-9]+W)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+S)?)?$
  isms_requirement_reference:
    typeof: string
    base: str
    uri: xsd:string
    description: The number of a clause of ISO/IEC 27001:2022, from 4 to 10, such as 6.1.2, or of an Annex
      A control, such as A.5.9.
    pattern: ^(([4-9]|10)(\.[0-9]{1,2}){0,2}|A\.[5-8]\.[0-9]{1,2})$
slots:
  responsible_role:
    description: The role that answers for the record's activity or outcome.
    range: IsmsRole
  relevant_controls:
    description: The organization's controls that the record concerns.
    range: IsmsControl
    multivalued: true
  affected_assets:
    description: The assets the risk, event or incident affects.
    range: IsmsAsset
    multivalued: true
  affected_security_properties:
    description: Which of confidentiality, integrity and availability the risk or incident threatens.
    range: IsmsSecurityProperty
    multivalued: true
  implementation_state:
    description: How far the control or the plan has been put into effect.
    range: IsmsImplementationStatus
  entry_annex_a_control:
    description: The Annex A control a Statement of Applicability entry concerns.
    range: IsmsAnnexAControl
classes:
  IsmsRecordMixin:
    mixin: true
    description: 'What every record of the ISMS has, so that other records can refer to it: an identifier,
      a title and a description.'
    comments:
    - It is a mixin, not a base class, so that the adapt copy can re-root some record classes on LOKF's
      Concept and leave the others as they are. lokf adapt replaces isms_id with LOKF's id, and a class
      that declares id itself must descend from Concept.
    slots:
    - id
    - title
    - description
    slot_usage:
      title:
        required: true
        pattern: ^\s*\S
        range: string
      description:
        range: string
  IsmsDocumentControlMixin:
    mixin: true
    description: The control that documented information is kept under. It records who wrote, owns and
      approved the information, when it takes effect and is reviewed, and how it is classified, distributed,
      stored and changed. It also records how long it is retained, and whether it came from outside the
      organization.
    in_subset:
    - isms_documented_information
    annotations:
      iso27001_clause: '7.5'
    attributes:
      document_reference:
        description: The reference the organization's document control gives it.
      document_version:
        description: The version of the document.
      document_author:
        description: Who wrote the document.
      document_owner:
        description: Who answers for the document's content and upkeep.
      document_approver:
        description: Who approved the document.
      document_approval_date:
        description: When the document was approved.
        range: date
      document_effective_date:
        description: When the document takes effect.
        range: date
      document_last_review_date:
        description: When the document was last reviewed.
        range: date
      document_next_review_date:
        description: When the document is next due for review.
        range: date
      document_status:
        description: Where the document stands in its life, in the organization's own terms, such as draft,
          approved or withdrawn.
      document_classification:
        description: The information classification the document carries.
      document_retention:
        description: How long the document is kept, as an ISO 8601 duration.
        range: isms_duration
      document_distribution:
        description: How the document is distributed, accessed, retrieved and used.
        multivalued: true
      document_storage:
        description: How the document is stored and preserved, so that it stays legible.
      document_change_control:
        description: How changes to the document are controlled, such as version control.
      document_external_origin:
        description: Whether the document comes from outside the organization and is kept because the
          ISMS needs it.
        range: boolean
      document_external_source:
        description: Who the document came from, when it comes from outside.
  IsmsManagementSystem:
    mixins:
    - IsmsRecordMixin
    description: 'One organization''s information security management system: its scope and context, and
      every record it keeps, each kind in a list of its own.'
    in_subset:
    - isms_core
    annotations:
      iso27001_clause: '4.4'
    related_mappings:

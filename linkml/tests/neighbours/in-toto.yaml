  attestation_tag: v1.2.0
  attestation_commit: df02077bf97218a8860a5c534eff1f1381f56984
comments:
- The version is the release of in-toto/attestation the model renders, and the specification pages and
  protocol buffer definitions of that release are copied to src/in_toto_linkml/schema/attestation/ at
  the tag and commit in the annotations. The release tags are the schema's own versions, and scripts/check_upstream_release.py
  reads the same pins and reports when the in-toto project releases again or the copy drifts.
- in_toto_core imports only the LinkML types, in_toto_predicates imports the core, and this file adds
  only the document root, so an importer can take one module. lmodel/slsa imports the core and models
  SLSA's own predicates.

name: in-toto
title: in-toto Attestation Framework
description: 'A LinkML model of the in-toto Attestation Framework: the statement that binds an attestation
  to its subjects, the resource descriptor and digest set that identify an artifact, the predicate types
  the in-toto project has vetted, and the vetted predicates that no other lmodel schema models.'
version: 1.2.0
source: https://github.com/in-toto/attestation/tree/v1.2.0
license: Apache-2.0
in_language: en
keywords:
- in-toto
- attestation
- predicate type
- software supply chain
see_also:
- https://lmodel.github.io/in-toto
- https://github.com/in-toto/attestation/blob/v1.2.0/spec/README.md
- https://in-toto.io/

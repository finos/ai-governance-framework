        required: true
  InTotoStatement:
    description: 'The statement layer of an in-toto attestation: the subjects it is about, the type of
      its predicate and the predicate itself.'
    aliases:
    - Statement
    exact_mappings:
    - in_toto_io:Statement/v1
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/statement.md
    comments:
    - The signature envelope around a statement, and the bundle that collects signed statements, are outside
      this model.
    - A statement is the attestation, and its predicate is one kind of claim about the subjects, such
      as a test result or build provenance.
    - Its exact mapping is the type URI its statement_type holds, as each predicate class maps to its
      predicate_type.
    slots:
    - in_toto_linkml_predicate
    attributes:
      statement_type:
        aliases:
        - _type
        slot_uri: in_toto_linkml:statement_type
        description: The in-toto statement type, always https://in-toto.io/Statement/v1.
        range: in_toto_type_uri
        required: true
        pattern: ^https://in-toto\.io/Statement/v1$
      subject:
        slot_uri: in_toto_linkml:subject
        description: The artifacts the predicate is about, each with a digest.
        range: InTotoStatementSubject
        multivalued: true
        required: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
      predicate_type:
        aliases:
        - predicateType
        slot_uri: in_toto_linkml:predicate_type
        description: The URI that names the predicate's type and so its schema, such as https://in-toto.io/attestation/test-result/v0.1.
        range: in_toto_type_uri
        required: true
  InTotoPredicate:
    abstract: true
    description: The base of every predicate an in-toto statement can carry; predicate_kind names the
      concrete kind.
    aliases:
    - Predicate
    children_are_mutually_disjoint: true
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/predicate.md
    comments:
    - The statement's predicate_type names the predicate's type by URI, and each concrete class says which
      URI it renders. Nothing ties the two, since a schema that imports this module may model a predicate
      under its own URI.
    - A predicate is of one kind only, so the kinds that extend this class are mutually disjoint.
    attributes:
      predicate_kind:
        slot_uri: in_toto_linkml:predicate_kind
        description: The kind of predicate, one of this class's descendants.
        range: string
  InTotoPredicateType:
    description: A type of predicate an in-toto statement can carry, named by the URI a statement's predicate_type
      holds.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/predicate.md
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/README.md
    comments:
    - The type URI includes the predicate's major version and changes when the predicate changes incompatibly;
      a minor version keeps it.
    - Anyone can define a predicate type. The in-toto project vets some of them, and vetted_as names which
      vetted type this one is.
    attributes:
      predicate_type_uri:
        description: The URI that names the predicate type, such as https://in-toto.io/attestation/test-result/v0.1.
        range: in_toto_type_uri
        required: true
      predicate_version:
        description: The version of the predicate's specification, as its page states it, such as 0.1.0.
      predicate_specification:
        description: The page that specifies the predicate.
        range: uri
      vetted_as:
        description: The vetted predicate this type is, when the in-toto project vetted it.
        range: InTotoVettedPredicate
    is_a: Concept
  InTotoObjectEntry:
    description: One key of a JSON object whose keys the framework leaves to the producer, and the key's
      values.
    close_mappings:

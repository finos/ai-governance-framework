        range: InTotoSvrVerifier
        required: true
        inlined: true
      time_created:
        aliases:
        - timeCreated
        description: When the verification took place.
        range: in_toto_timestamp
        required: true
      verified_properties:
        aliases:
        - properties
        description: The properties of the subjects that passed verification, scoped to the framework
          or policy verified, such as SLSA_BUILD_LEVEL_3.
        multivalued: true
        required: true
  InTotoSvrVerifier:
    description: The entity that performed a simple verification.
    aliases:
    - Verifier
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/svr.md
    comments:
    - A verifier with configurable policies may add fields of its own that say which policy it applied;
      this schema does not model them.
    attributes:
      svr_verifier_id:
        aliases:
        - id
        description: The URI that identifies the verifier, versioned when its verification logic changes
          materially.
        range: in_toto_type_uri
        required: true
  InTotoScaiAttributeReport:
    is_a: InTotoPredicate
    description: 'The Software Supply Chain Attribute Integrity (SCAI) predicate: assertions about functional
      attributes of the subjects or their producer, each with the evidence for it.'
    aliases:
    - AttributeReport
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/scai.md
    exact_mappings:
    - in_toto:scai/v0.3
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/scai/v0.3.
    attributes:
      scai_attributes:
        aliases:
        - attributes
        description: One or more attribute assertions about the subjects.
        range: InTotoScaiAttributeAssertion
        multivalued: true
        required: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
      scai_producer:
        aliases:
        - producer
        description: The producer of the subjects, where that applies.
        range: InTotoResourceDescriptor
        inlined: true
  InTotoScaiAttributeAssertion:
    description: 'One SCAI assertion: an attribute of the subject or its producer, what it applies to,
      under which conditions, and the evidence for it.'
    aliases:
    - AttributeAssertion
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/scai.md
    attributes:
      scai_attribute:
        aliases:
        - attribute
        description: The functional feature asserted, in a form the producer and consumer agree on.
        required: true
      scai_target:
        aliases:
        - target
        description: The artifact or metadata object the attribute applies to.
        range: InTotoResourceDescriptor
        inlined: true
      scai_conditions:
        aliases:
        - conditions
        description: The conditions under which the attribute arises.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
      scai_evidence:
        aliases:
        - evidence
        description: The evidence, authenticated where possible, for the asserted attribute.
        range: InTotoResourceDescriptor
        inlined: true
        comments:
        - Without evidence a consumer may judge the assertion by who produced the attestation.
  InTotoLink:
    is_a: InTotoPredicate
    description: 'The predicate that records one step of an in-toto layout: the command it ran and the
      materials it read, for a supply chain that migrates from in-toto 0.9 links.'
    aliases:
    - Link
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/link.md
    exact_mappings:
    - in_toto:link/v0.3
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/link/v0.3.
    - The statement's subjects are the step's products, and each subject's resource_name is unique within
      the attestation; the validator does not check this.
    attributes:
      step_name:
        aliases:
        - name
        description: The name of the step, which a layout uses to find the link metadata it verifies.
        required: true
      step_command:
        aliases:
        - command
        description: The command the step ran, and its arguments; possibly empty.
        multivalued: true
      materials:
        description: The artifacts the step read.
        range: InTotoLinkMaterial
        multivalued: true
        inlined: true
        inlined_as_list: true
        comments:
        - Each material's resource_name is unique among them; the validator does not check this.
      step_byproducts:
        aliases:
        - byproducts
        description: What else the step recorded, such as its standard output, in keys the in-toto specification
          describes.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
      step_environment:
        aliases:
        - environment
        description: The environment the step ran in, in keys the producer chooses.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
  InTotoLinkMaterial:
    is_a: InTotoResourceDescriptor
    description: One material of a link, a resource descriptor with a name and a digest.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/link.md
    notes:
    - The name is required through a slot condition rather than slot_usage, because resource_name is an
      attribute of the parent class and the LinkML loader refuses slot_usage on an inherited attribute.
    slot_usage:
      digest:
        required: true
    all_of:
    - slot_conditions:
        resource_name:
          required: true
          any_of:
          - range: string
  InTotoReference:
    is_a: InTotoPredicate
    description: The predicate that points from the subjects, as a whole, to documents about them, such
      as a bill of materials.
    aliases:
    - Reference
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    exact_mappings:
    - in_toto:reference/v0.1
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/reference/v0.1.
    - Several documents in one predicate read as if each had an attestation of its own with everything
      else unchanged.
    attributes:
      reference_attester:
        aliases:
        - attester
        description: The system that provides the documents.
        range: InTotoReferenceAttester
        required: true
        inlined: true
      referenced_documents:
        aliases:
        - references
        description: The documents referred to.
        range: InTotoReferencedDocument
        multivalued: true
        required: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
  InTotoReferenceAttester:
    description: The system that provides the documents a Reference predicate points to.
    aliases:
    - Attester
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    attributes:
      reference_attester_id:
        aliases:
        - id
        description: The URI that identifies the system.
        range: in_toto_type_uri
        required: true
  InTotoReferencedDocument:
    is_a: InTotoResourceDescriptor
    description: 'One document a Reference predicate points to: a resource descriptor with a download
      location and a media type.'
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    comments:
    - A document of unknown type takes media_type application/octet-stream.
    notes:
    - Both fields are required through slot conditions rather than slot_usage, because they are attributes
      of the parent class and the LinkML loader refuses slot_usage on an inherited attribute.
    all_of:
    - slot_conditions:
        download_location:
          required: true
          any_of:
          - range: uri
    - slot_conditions:
        media_type:
          required: true
          any_of:
          - range: string
  InTotoRelease:
    is_a: InTotoPredicate
    description: The predicate that ties the subjects to one release name and version of a package, so
      that consumers can check what the release should contain.
    aliases:
    - Release
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/release.md
    exact_mappings:
    - in_toto:release/v0.1
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/release/v0.1. The
      page is at version 0.2, which renamed releaseId to packageId, and its examples keep that URI.
    - Each subject's resource_name is the artifact's file name as it would appear on disk.
    attributes:
      release_purl:
        aliases:
        - purl
        description: The package URL that names the release, with its version and, unless the package
          type needs them, no qualifiers or subpath.
        range: in_toto_resource_uri
        close_mappings:
        - spdx_software:packageUrl
        required: true
        pattern: ^pkg:[A-Za-z][A-Za-z0-9.+-]*/[^?#]+@[^@?#]+
        comments:
        - The version follows the last @, as the purl specification parses a package URL, so a scoped
          npm name such as @angular/http may keep its @ unencoded, as the page's first example does.
      package_id:
        aliases:
        - packageId
        description: A stable identifier for the package that does not change between releases, so that
          a consumer can tell a renamed package from a reused name.
  InTotoRuntimeTrace:
    is_a: InTotoPredicate
    description: The predicate that records what a monitor traced while a supply chain step, such as a
      build, ran.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    exact_mappings:
    - in_toto:runtime-trace/v0.1
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/runtime-trace/v0.1.
    attributes:
      trace_monitor:
        aliases:
        - monitor
        description: The monitor instance that traced the run.
        range: InTotoTraceMonitor
        required: true
        inlined: true
      monitored_process:
        aliases:
        - monitoredProcess
        description: The process the monitor watched.
        range: InTotoMonitoredProcess
        required: true
        inlined: true
      monitor_log:
        aliases:
        - monitorLog
        description: The events the monitor traced.
        range: InTotoMonitorLog
        required: true
        inlined: true
      trace_metadata:
        aliases:
        - metadata
        description: Other properties of the monitoring event.
        range: InTotoTraceMetadata
        inlined: true
  InTotoTraceMonitor:
    description: The monitor instance that produced a runtime trace.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    attributes:
      monitor_type:
        aliases:
        - type
        description: The URI of the monitor's type.
        range: in_toto_type_uri
        required: true
      monitor_config_source:
        aliases:
        - configSource
        description: The monitor's configuration.
        range: InTotoResourceDescriptor
        inlined: true
      trace_policy:
        aliases:
        - tracePolicy
        description: The trace policy the monitor applied, in the monitor's own format, which monitor_type
          names.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
  InTotoMonitoredProcess:
    description: The process a runtime trace watched.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    attributes:
      host_id:
        aliases:
        - hostID
        description: The URI that identifies the host the process ran on.
        range: uri
        required: true
      process_type:
        aliases:
        - type
        description: The URI of the type of process, such as the build type when the monitor watched a
          build.
        range: in_toto_type_uri
        required: true
      process_event:
        aliases:
        - event
        description: The job or task the attestation is about.
        required: true
  InTotoMonitorLog:
    description: 'The events a runtime trace''s monitor recorded: processes, network activity and file
      accesses, at least one of them.'
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    notes:
    - Each condition in any_of names its range through a nested any_of, because the JSON Schema generator
      leaves a condition's own range out, and a null value would then count as present.
    attributes:
      traced_processes:
        aliases:
        - process
        description: The processes the monitor observed, one JSON object each, written as its JSON text,
          in a format monitor_type determines.
        multivalued: true
      traced_network:
        aliases:
        - network
        description: The network activity the monitor observed, one JSON object each, written as its JSON
          text, in a format monitor_type determines.
        multivalued: true
      file_access:
        aliases:
        - fileAccess
        description: The files the run accessed, each with its path and digests; one file may appear more
          than once, with different digests if it changed.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
        comments:
        - A monitor that cannot pause the build, such as one that uses eBPF, guarantees less about these
          digests than one that can.
    any_of:
    - slot_conditions:
        traced_processes:
          required: true
          multivalued: true
    - slot_conditions:
        traced_network:
          required: true
          multivalued: true
    - slot_conditions:
        file_access:
          required: true
          multivalued: true
  InTotoTraceMetadata:
    description: Other properties of a runtime trace's monitoring event.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    attributes:
      build_started_on:
        aliases:
        - buildStartedOn
        description: When the monitored build started.
        range: in_toto_timestamp
        close_mappings:
        - spdx_build:buildStartTime
      build_finished_on:
        aliases:
        - buildFinishedOn
        description: When the monitored build finished.
        range: in_toto_timestamp
        close_mappings:
        - spdx_build:buildEndTime
  InTotoVulns:
    is_a: InTotoPredicate
    description: 'The predicate that records the result of one vulnerability scan of the subjects: the
      scanner, its database and the vulnerabilities it found.'
    aliases:
    - Vulns
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    exact_mappings:
    - in_toto:vulns/v0.2
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/vulns/v0.2.
    attributes:
      vuln_scanner:
        aliases:
        - scanner
        description: The scanner that ran, its version and the database it used.
        range: InTotoVulnScanner
        required: true
        inlined: true
      scan_metadata:
        aliases:
        - metadata
        description: When the scan ran.
        range: InTotoScanMetadata
        required: true
        inlined: true
  InTotoVulnScanner:
    description: The scanner a VULNS predicate records, with its results.
    aliases:
    - Scanner
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      scanner_uri:
        aliases:
        - uri
        description: The URI that identifies the scanner's source.
        range: in_toto_resource_uri
        required: true
      scanner_version:
        aliases:
        - version
        description: The scanner's version.
        comments:
        - The page types it as a ResourceURI, and its example is a plain version, 0.19.2, so the schema
          takes any string.
      vuln_db:
        aliases:
        - db
        description: The vulnerability database the scanner used.
        range: InTotoVulnDatabase
        inlined: true
      scan_results:
        aliases:
        - result
        description: The vulnerabilities the scanner found; an empty list means it found none.
        range: InTotoVulnResult
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
  InTotoVulnDatabase:
    description: The vulnerability database a scanner used.
    aliases:
    - VulnDatabase
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      db_uri:
        aliases:
        - uri
        description: The URI that identifies the database's source.
        range: in_toto_resource_uri
      db_version:
        aliases:
        - version
        description: The database's version.
      db_last_update:
        aliases:
        - lastUpdate
        description: When the database was last updated.
        range: in_toto_timestamp
        required: true
  InTotoVulnResult:
    description: One vulnerability a scanner found.
    related_mappings:
    - spdx_security:Vulnerability
    aliases:
    - Result
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    comments:
    - SPDX 3 describes a vulnerability as an element of its own and ties it to the artifact by a relationship,
      where this result is the scanner's finding about the subjects, so the two are related rather than
      the same.
    attributes:
      vuln_id:
        aliases:
        - id
        description: The vulnerability's identifier, such as GHSA-fxph-q3j8-mv87 or CVE-2017-5645.
        required: true
      vuln_severity:
        aliases:
        - severity
        description: The vulnerability's severity, by one or more scoring methods.
        range: InTotoVulnSeverity
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      vuln_annotations:
        aliases:
        - annotations
        description: Custom information the scanner adds, as key and value pairs.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
        comments:
        - The page calls them a list of key and value pairs, and the protocol buffer definition a list
          of objects. Each pair of each object is one entry, in order, so a key may appear more than once.
  InTotoVulnSeverity:
    description: One severity score of a vulnerability, by one scoring method.
    aliases:
    - Severity
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      severity_method:
        aliases:
        - method
        description: The scoring method, such as nvd or cvss.
        required: true
      severity_score:
        aliases:
        - score
        description: The score under that method, as a string.
        required: true
  InTotoScanMetadata:
    description: When a vulnerability scan ran.
    aliases:
    - ScanMetadata
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      scan_started_on:
        aliases:
        - scanStartedOn
        description: When the scan started.
        range: in_toto_timestamp
        required: true
      scan_finished_on:
        aliases:
        - scanFinishedOn
        description: When the scan finished.
        range: in_toto_timestamp
        required: true
  InTotoDocument:
    description: A document that holds in-toto statements and the predicate types they name.
    attributes:
      in_toto_statements:
        description: The statements, each an in-toto attestation without its envelope.
        range: InTotoStatement
        multivalued: true
        inlined: true
        inlined_as_list: true
      in_toto_predicate_types:
        description: The predicate types.
        range: InTotoPredicateType
        multivalued: true
        inlined: true
        inlined_as_list: true
slots:
  resource_uri:
    description: The URI that identifies a resource, such as a package URL, a git repository address or
      an OCI image reference.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#resourceuri
    aliases:
    - uri
    slot_uri: in_toto_linkml:resource_uri
    range: in_toto_resource_uri
  digest:
    description: The cryptographic digests of a resource's content, keyed by algorithm.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/digest_set.md
    slot_uri: in_toto_linkml:digest
    range: InTotoDigestSet
    inlined: true
  in_toto_linkml_predicate:
    description: The predicate, one of the kinds this schema or an importing one models; predicate_kind
      names which. Unset means the same as empty.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/statement.md
    slot_uri: in_toto_linkml:predicate
    range: InTotoPredicate
    inlined: true
    comments:
    - 'It is a slot of its own rather than an attribute of InTotoStatement, because LOKF''s predicate
      is a relation''s type: `lokf adapt` renames a slot whose name LOKF defines, with the name of the
      schema it adapts as a prefix, and keeps its IRI. This repository''s copy calls it in_toto_linkml_predicate,
      and lmodel/slsa''s calls it slsa_predicate.'
    aliases:
    - predicate
types:
  in_toto_resource_uri:
    typeof: uri
    description: A URI that identifies or locates a resource, such as a package URL or a git repository
      address, with its scheme and authority in lowercase.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#resourceuri
    comments:
    - The framework recommends a package URL (pkg:) or an SPDX download location (git+https:), and allows
      one that does not resolve.
    pattern: ^[a-z][a-z0-9+.-]*:(//[^/?#A-Z]*([/?#].*)?|[^/].*|/[^/].*|/)?$
  in_toto_type_uri:
    typeof: uri
    description: A URI that names a type, such as a statement's or a predicate's, with its scheme and
      authority in lowercase.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#typeuri
    comments:
    - The framework asks that it carry a version and registers none, since the namespace of a URI keeps
      two types apart.
    pattern: ^[a-z][a-z0-9+.-]*:(//[^/?#A-Z]*([/?#].*)?|[^/].*|/[^/].*|/)?$
  in_toto_timestamp:
    typeof: string
    base: str
    uri: xsd:dateTime
    description: A point in time in RFC 3339 format in the UTC time zone, written with a trailing Z, such
      as 1985-04-12T23:20:50.52Z.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#timestamp
    comments:
    - It extends string rather than datetime, because the LinkML Python runtime writes a datetime's Z
      as +00:00, which the framework does not allow.
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$
enums:
  InTotoTestResultValue:
    description: The result of a test run, as a Test Result predicate records it.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/test-result.md
    - https://www.w3.org/TR/EARL10-Schema/
    comments:
    - PASSED and FAILED mean the outcomes of the same names in W3C's Evaluation and Report Language (EARL)
      1.0. EARL has no outcome for a pass with warnings, so WARNED is unmapped.
    - The meanings are full addresses with no prefix bound for them, because the Python generator writes
      no namespace for a prefix bound only in an imported module, and shortens a full address to any prefix
      that covers it. The Python model holds no meaning for them; the other generators keep it.
    permissible_values:
      PASSED:
        description: The run passed.
        meaning: http://www.w3.org/ns/earl#passed
      WARNED:
        description: The run passed with warnings.
      FAILED:
        description: The run failed.
        meaning: http://www.w3.org/ns/earl#failed
  InTotoVettedPredicate:
    description: The thirteen predicate types the in-toto project lists as vetted at release v1.2.0, each
      with the predicate_type a statement of it carries at the version its page describes.
    comments:
    - The in-toto project's own types are CURIEs under in_toto. The others are full addresses with no
      prefix bound for them, because the Python generator writes no namespace for a prefix bound only
      in an imported module.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/README.md
    permissible_values:
      CYCLONEDX:
        description: A CycloneDX bill of materials for software artifacts.
        meaning: https://cyclonedx.org/bom/v1.4
        see_also:
        - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/cyclonedx.md
        - https://cyclonedx.org/
        comments:
        - The page gives https://cyclonedx.org/bom in its header, and this URI in its example.
      LINK:
        description: One step of an in-toto layout, for migration from in-toto 0.9.
        meaning: in_toto:link/v0.3
        see_also:
        - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/link.md
      REFERENCE:
        description: References to documents relevant to a resource.
        meaning: in_toto:reference/v0.1
        see_also:

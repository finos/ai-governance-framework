    description: A set of one or more digests over one artifact, keyed by algorithm, from which a consumer
      picks the algorithm it trusts.
    aliases:
    - DigestSet
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/digest_set.md
    comments:
    - A field named after an algorithm that SPDX 3 also names relates to SPDX's individual for it. BLAKE2b
      relates to all three of SPDX's BLAKE2b individuals, because the framework allows any length from
      32 to 64 bytes, where SPDX names only lengths of 32, 48 and 64 bytes. SPDX has no individual for
      the other algorithms, and an SPDX document records them as other.
    - The named algorithms take lowercase hexadecimal, and additional_digests holds any other algorithm,
      such as an SCS's own revision type.
    - A consumer accepts only the algorithms it considers secure and ignores the rest, and two sets match
      when any accepted algorithm matches.
    - SHAKE and BLAKE2 digests can be of any length, and this schema asks for at least 32 bytes, since
      a shorter digest resists collisions too weakly to identify an artifact.
    notes:
    - Each condition in any_of names its range through a nested any_of, because the JSON Schema generator
      leaves a condition's own range out, and a null value would then count as present.

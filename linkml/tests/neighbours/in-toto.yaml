  InTotoAdditionalDigest:
    description: One digest under an algorithm that InTotoDigestSet does not name, such as an SCS's own
      revision type.
    related_mappings:
    - spdx_core:Hash
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/digest_set.md
    comments:
    - In the attestation's JSON the algorithm is a key of the digest set beside the named ones, and an
      algorithm the framework does not define documents how its value is encoded.
    - An SCS that does not use cryptographic digests defines a canonical revision type of its own that
      includes the repository, such as svn_revision_id.
    - Each algorithm appears once in a list, since the attestation's JSON uses it as a key; the validator
      does not check this.
    - It is related to, not the same as, an SPDX 3 Hash, whose algorithm comes from a closed list, where
      this one's may be a revision type rather than a digest.
    attributes:
      algorithm:
        description: The algorithm's name, as the key the attestation's JSON uses, such as svn_revision_id.
        slot_uri: spdx:algorithm
        required: true
        pattern: ^[a-z][A-Za-z0-9_.:-]*$
        none_of:
        - equals_string_in:
          - sha256
          - sha224
          - sha384
          - sha512
          - sha512_224
          - sha512_256
          - sha3_224
          - sha3_256
          - sha3_384
          - sha3_512
          - shake128
          - shake256
          - blake2b
          - blake2s
          - ripemd160
          - sm3
          - gost
          - sha1
          - md5
          - dirHash
          - gitCommit
          - gitTree
          - gitBlob
          - gitTag
          - dir_hash
          - git_commit
          - git_tree
          - git_blob
          - git_tag
        comments:
        - An algorithm that InTotoDigestSet names, by its JSON key or by its field name, goes in that
          field instead.
        - A name starts with a lowercase letter, as the framework's own names do, so that SHA256 is not
          taken for sha256, and it may hold a colon, as go-witness's gitoid:sha256 does. The framework
          itself sets no rule for other names.
      value:
        slot_uri: in_toto_linkml:value
        related_mappings:
        - spdx_core:hashValue
        description: The digest under that algorithm, in the encoding the algorithm documents.
        required: true
        pattern: ^\S+$
  InTotoAnnotation:
    description: 'One vendor-specific annotation on a resource descriptor: a key and its values.'
    close_mappings:
    - spdx_core:DictionaryEntry
    comments:
    - The attestation's JSON allows any JSON value. A string becomes one value and an array one value
      per item; any other value or item is written as its JSON text, so one value cannot tell a string
      from a one-item array.
    - Each key appears once in a list, since the attestation's JSON uses it as a key; the validator does
      not check this.
    attributes:
      annotation_key:
        slot_uri: in_toto_linkml:annotation_key
        close_mappings:
        - spdx_core:key
        description: The annotation's key.
        required: true
      annotation_values:
        slot_uri: in_toto_linkml:annotation_values
        close_mappings:
        - spdx_core:value
        description: The annotation's values.
        multivalued: true
  InTotoResourceDescriptor:
    description: A reference to a software artifact or other resource by URI or digest, or the resource
      itself as content, with optional metadata.
    aliases:
    - ResourceDescriptor
    related_mappings:
    - spdx_core:Artifact
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/resource_descriptor.md
    comments:
    - A descriptor carries at least one of a URI, a digest or its content; a field that needs a particular
      one says so.
    - It describes an artifact, where an SPDX 3 Artifact is the artifact itself, so the two are related
      rather than the same.
    notes:
    - Each condition in any_of names its range through a nested any_of, because the JSON Schema generator
      leaves a condition's own range out, and a null value would then count as present.
    slots:
    - resource_uri
    - digest
    attributes:
      resource_name:
        aliases:
        - name
        slot_uri: in_toto_linkml:resource_name
        description: A name for the resource within the attestation that carries it.
      download_location:
        aliases:
        - downloadLocation
        slot_uri: in_toto_linkml:download_location
        close_mappings:
        - spdx_software:downloadLocation
        - dcat:downloadURL
        description: Where the resource can be fetched, when that differs from its identifying URI.
        range: in_toto_resource_uri
      media_type:
        description: The IANA media type of the resource's content.
        aliases:
        - mediaType
        slot_uri: dcat:mediaType
        close_mappings:
        - spdx_core:contentType
      content:
        slot_uri: in_toto_linkml:content
        description: The resource's content itself, base64-encoded, for a resource small enough to carry
          inline.
        pattern: ^[A-Za-z0-9+/_-]+={0,2}$
        comments:
        - The in-toto framework asks for content under 1 KB, so that attestations stay small.
      annotations:
        slot_uri: in_toto_linkml:annotations
        description: Vendor-specific annotations on the resource, such as the source references a SLSA
          Source Verification Summary records.
        range: InTotoAnnotation
        multivalued: true
        inlined: true
        inlined_as_list: true
    any_of:
    - slot_conditions:
        resource_uri:
          required: true
          any_of:
          - range: uri
    - slot_conditions:
        digest:
          required: true
          any_of:
          - range: InTotoDigestSet
    - slot_conditions:
        content:
          required: true
          any_of:
          - range: string
  InTotoStatementSubject:
    is_a: InTotoResourceDescriptor
    description: 'One artifact an in-toto statement is about: a resource descriptor that carries a digest.'
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/statement.md
    slot_usage:

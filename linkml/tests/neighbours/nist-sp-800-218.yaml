id: https://w3id.org/lmodel/nist-sp-800-218-lokf
name: nist-sp-800-218
title: Secure Software Development Framework (SSDF) version 1.1
description: 'A LinkML model of the Secure Software Development Framework (SSDF) version 1.1, which NIST
  Special Publication 800-218 recommends: its practice groups, practices and tasks, the notional implementation
  examples of each task, and the references that map each task to other secure software development documents.'
version: 1.1.0
source: https://doi.org/10.6028/NIST.SP.800-218
license: Apache-2.0
see_also:
- https://lmodel.github.io/nist-sp-800-218
- https://csrc.nist.gov/pubs/sp/800/218/final
- https://csrc.nist.gov/projects/ssdf
- https://github.com/usnistgov/oscal-content/tree/v1.6.0/nist.gov/SP800-218/ver1
annotations:
  cprt_framework_version: SP_800_218_1_1_0
  publication_date: 2022-02
  oscal_content_tag: v1.6.0
  oscal_content_commit: f0de6d8d8c059d374f15e0ae07508d82e370fc1d
comments:
- The version is the SSDF version that SP 800-218 defines, and source is the publication's digital object
  identifier. NIST's Cybersecurity and Privacy Reference Tool names the same version SP_800_218_1_1_0,
  and the catalog NIST publishes for it in usnistgov/oscal-content is copied to src/nist_sp_800_218/schema/oscal-content/
  at the tag and commit in the annotations. scripts/check_upstream_release.py reads the same pins and
  reports when NIST publishes a newer edition or changes the catalog. The release tags are the schema's
  own versions.
- SP 800-218 is a work of the United States Government and is not subject to copyright in the United States.
  The descriptions here are this project's own words; NIST's text of each practice, task and example stays
  in the catalog copy.
- NIST's catalog renders each practice group as an OSCAL group, each practice and task as an OSCAL control,
  each example as a part and each reference as a link. The broad_mappings name those lmodel/oscal classes.
default_prefix: nist_sp_800_218
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  nist_sp_800_218: https://w3id.org/lmodel/nist-sp-800-218/
  oscal: https://w3id.org/lmodel/oscal/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
- linkml:types
- lokf
types:
  ssdf_group_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The two letters that name one of the four practice groups.
    pattern: ^(PO|PS|PW|RV)$
  ssdf_practice_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A practice''s identifier: its group''s letters, a dot and the practice''s number within
      the group, such as PO.1.'
    pattern: ^(PO|PS|PW|RV)\.[1-9][0-9]*$
  ssdf_task_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A task''s identifier: its practice''s identifier, a dot and the task''s number within
      the practice, such as PO.1.1.'
    pattern: ^(PO|PS|PW|RV)\.[1-9][0-9]*\.[1-9][0-9]*$
  ssdf_example_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'The identifier NIST''s reference data gives a notional implementation example: its task''s
      identifier, a dot and the example''s number, such as PO.1.1.1.'
    pattern: ^(PO|PS|PW|RV)\.[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
slots: {}
classes:
  SsdfFramework:
    class_uri: nist_sp_800_218:Framework
    description: 'One version of the SSDF as a whole: its practice groups, each holding its practices
      and their tasks.'
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/218/final
    attributes:
      ssdf_version:
        description: The SSDF version, as NIST numbers it in the publication's title, such as 1.1.
        required: true
        pattern: ^[0-9]+\.[0-9]+$
      practice_groups:
        description: The practice groups, in the order SP 800-218 gives them.
        range: SsdfPracticeGroup
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
  SsdfPracticeGroup:
    class_uri: nist_sp_800_218:PracticeGroup
    description: 'One of the four groups SP 800-218 sorts its practices into: preparing the organization,
      protecting the software, producing well-secured software, and responding to vulnerabilities.'
    see_also:
    - https://csrc.nist.gov/projects/ssdf
    broad_mappings:
    - oscal:Group
    slots:
    - title
    - description
    attributes:
      group_id:
        description: The group's two letters, such as PO for Prepare the Organization.
        range: ssdf_group_identifier
        required: true
      group_practices:
        description: The practices of the group. A knowledge bundle relates a practice to its group with
          isPartOf instead.
        range: SsdfPractice
        multivalued: true
        inlined: true
        inlined_as_list: true
    slot_usage:
      title:
        range: string
      description:
        range: string
    is_a: Concept
  SsdfPractice:
    class_uri: nist_sp_800_218:Practice
    description: 'A secure software development practice: a named outcome with an identifier, a short
      explanation of what it is and why it helps, and the tasks that may be needed to achieve it.'
    see_also:
    - https://csrc.nist.gov/projects/ssdf
    broad_mappings:
    - oscal:Control
    slots:
    - title
    - description
    attributes:
      practice_id:
        description: The practice's identifier, such as PO.1.
        range: ssdf_practice_identifier
        required: true
      practice_tasks:
        description: The tasks of the practice. A knowledge bundle relates a task to its practice with
          isPartOf instead.
        range: SsdfTask
        multivalued: true
        inlined: true
        inlined_as_list: true
    slot_usage:
      title:
        range: string
      description:
        range: string
    is_a: Concept
  SsdfTask:
    class_uri: nist_sp_800_218:Task
    description: An action that may be needed to perform a practice, with notional examples of how it
      could be implemented and references to the documents whose practices it maps to.
    see_also:
    - https://csrc.nist.gov/projects/ssdf
    broad_mappings:
    - oscal:Control
    slots:
    - description
    attributes:
      task_id:
        description: The task's identifier, such as PO.1.1.
        range: ssdf_task_identifier
        required: true
      former_task_ids:
        description: The identifiers the task had in an earlier SSDF version, which SP 800-218 notes beside
          the task after moving it, such as PW.3.1 for PO.1.3.
        range: ssdf_task_identifier
        multivalued: true
      implementation_examples:
        description: Notional examples of tools, processes or other methods that could help implement
          the task. SP 800-218 requires none of them and does not claim they are the only ways.
        range: SsdfImplementationExample
        multivalued: true
        inlined: true
        inlined_as_list: true
      task_references:
        description: The established secure development documents the task maps to, each with the parts
          of the document it maps to.
        range: SsdfReference
        multivalued: true
        inlined: true
        inlined_as_list: true
    slot_usage:
      description:
        range: string
    is_a: Concept
  SsdfImplementationExample:
    class_uri: nist_sp_800_218:ImplementationExample
    description: 'A notional implementation example: one type of tool, process or other method that could
      help implement a task.'
    see_also:
    - https://csrc.nist.gov/projects/ssdf
    broad_mappings:
    - oscal:Part
    slots:
    - description
    slot_usage:
      description:
        required: true
        range: string
    attributes:
      example_id:
        description: The example's identifier in NIST's reference data, such as PO.1.1.1 for the first
          example of task PO.1.1.
        range: ssdf_example_identifier
        required: true
  SsdfReference:
    class_uri: nist_sp_800_218:Reference
    description: A pointer from a task to an established secure development document, and to the parts
      of that document the task maps to.
    see_also:
    - https://csrc.nist.gov/projects/ssdf
    broad_mappings:
    - oscal:Link
    attributes:
      reference_document:
        description: The document the task maps to, by the label SP 800-218 gives it.
        range: SsdfReferenceDocument
        required: true
      mapped_items:
        description: The parts of the document the task maps to, as SP 800-218 lists them, such as the
          clause, control or activity identifiers SM.3, DE.1.
        required: true
        pattern: ^\s*\S
enums:
  SsdfReferenceDocument:
    description: The established secure development documents that SP 800-218 maps its tasks to, by the
      labels its References list gives them. SP 800-218 cites each at the edition shown in its title.
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-218
    permissible_values:
      BSAFSS:
        title: The BSA Framework for Secure Software, version 1.1 (2020)
        description: BSA's framework for securing the software lifecycle.
        see_also:

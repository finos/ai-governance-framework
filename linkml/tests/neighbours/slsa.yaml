        description: The algorithm's name, as the key the attestation's JSON uses, such as svn_revision_id.
        slot_uri: spdx:algorithm
        required: true
        pattern: ^[a-z][A-Za-z0-9_.:-]*$
        none_of:
        - equals_string_in:
          - sha256
          - sha224
          - sha384
          - sha512
          - sha512_224
          - sha512_256
          - sha3_224
          - sha3_256
          - sha3_384
          - sha3_512
          - shake128
          - shake256
          - blake2b
          - blake2s
          - ripemd160
          - sm3
          - gost
          - sha1
          - md5
          - dirHash
          - gitCommit
          - gitTree
          - gitBlob
          - gitTag
          - dir_hash
          - git_commit
          - git_tree
          - git_blob
          - git_tag

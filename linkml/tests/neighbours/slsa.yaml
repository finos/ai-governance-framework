    - A platform with several modes of operation at different levels has a different builder_id for each.
    - 'Related to SPDX''s Tool, hardware or software that carries out a function: the platform''s software
      and hardware are tools, and the people and organizations trusted to run it are not.'
    slots:
    - component_versions
    - id
    attributes:
      build_level:
        description: The highest SLSA Build level the platform's provenance can meet.
        range: SlsaBuildLevel
      hosted:
        description: Whether the platform is a hosted service on shared or dedicated infrastructure rather
          than an individual's workstation.
        range: boolean
        comments:
        - Build L2 and above require a hosted platform.
      builder_dependencies:
        description: Dependencies of the platform's orchestrator that do not run inside the build but
          may affect provenance generation or its guarantees.
        aliases:
        - builderDependencies
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
    in_subset:
    - slsa_build_track
    is_a: Concept
  SlsaControlPlane:
    description: The component of a build platform that orchestrates each build and generates its provenance,
      outside the tenant's control.
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#build-model
    slots:
    - build_platform
    in_subset:
    - slsa_build_track
    is_a: Concept
  SlsaComponentVersion:
    description: The version of one named component of a platform.
    comments:
    - Each component appears once in a list, since the attestation's JSON uses its name as a key; the
      validator does not check this.
    attributes:
      component:
        description: The component's name.
        required: true
      component_version:
        description: The component's version string.
    in_subset:
    - slsa_build_track
  SlsaPackageRegistry:
    description: A distribution platform that resolves package names to immutable package artifacts within
      an ecosystem.
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#distribution-model
    slots:
    - ecosystem
    - id
    attributes: {}
    in_subset:
    - slsa_build_track
    - slsa_dependency_track
    is_a: Concept
  SlsaPackage:
    description: A unit of software distributed under a package name, which is the primary security boundary
      SLSA protects. Its artifacts are the outputs of builds.
    close_mappings:
    - spdx_software:Package
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#distribution-model
    slots:
    - ecosystem
    attributes:
      package_name:
        description: The name consumers use to obtain the package within its ecosystem and registry.
        required: true
      registry:
        description: The registry the package is published to.
        range: SlsaPackageRegistry
      package_artifacts:
        description: The immutable artifacts the package name has resolved to.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      guac_uri:
        description: Where a GUAC instance answers queries about the package's dependency and provenance
          graph.
        range: uri
        in_subset:
        - slsa_ssf
      security_insights_uri:
        description: The SECURITY-INSIGHTS.yml file of the project that produces the package.
        range: uri
        in_subset:
        - slsa_ssf
    in_subset:
    - slsa_build_track
    - slsa_dependency_track
    is_a: Concept
  SlsaBuildProvenance:
    is_a: SlsaPredicate
    description: The predicate that says how a build platform produced a set of artifacts, so that consumers
      can verify the build met their expectations and others can rebuild it.
    exact_mappings:
    - slsa_dev:provenance/v1
    close_mappings:
    - spdx_build:Build
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#provenance
    comments:
    - The statement that carries it has predicate_type https://slsa.dev/provenance/v1.
    - Complicated provenance generation was the challenge with the most issues in the study (Tamanna et
      al., 2024, CI.1).
    attributes:
      build_definition:
        description: The inputs to the build; required at Build L1.
        aliases:
        - buildDefinition
        range: SlsaBuildDefinition
        required: true
        inlined: true
      run_details:
        description: What is specific to this execution of the build; required at Build L1.
        aliases:
        - runDetails
        range: SlsaRunDetails
        required: true
        inlined: true
    in_subset:
    - slsa_build_track
  SlsaBuildDefinition:
    description: The inputs to a build, in enough detail to initialize it and begin execution; the builder
      vouches for their accuracy.
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#builddefinition
    attributes:
      build_type:
        description: The URI of the template that says how to run the build and read its parameters and
          dependencies; required at Build L1.
        aliases:
        - buildType
        close_mappings:
        - spdx_build:buildType
        range: in_toto_type_uri
        required: true
      external_parameters:
        description: The inputs under the tenant's control; required at Build L1, complete at Build L3
          and verified by consumers.
        aliases:
        - externalParameters
        broad_mappings:
        - spdx_build:parameter
        related_mappings:
        - spdx_build:configSourceEntrypoint
        - spdx_build:configSourceUri
        range: SlsaBuildParameter
        multivalued: true
        required: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
        comments:
        - Verifiers reject parameters they do not recognize here.
        - SPDX's configSource fields name the three parts of SLSA 0.2's configSource, which SLSA 1.0 records
          as external parameters for its entry point and URI, and as a resolved dependency for its URI
          and digest.
      internal_parameters:
        description: The inputs the platform sets itself; kept for debugging, incident response and reproduction,
          and not verified by consumers.
        aliases:
        - internalParameters
        close_mappings:
        - spdx_build:environment
        related_mappings:
        - spdx_build:parameter
        comments:
        - 'Close to SPDX''s environment, the session the build ran in: SLSA 1.0 renamed 0.2''s environment
          to internalParameters, with a slight change in meaning.'
        - 'Related, not narrower: SPDX''s parameter is an input provided to the builder, and an internal
          parameter is one the platform sets itself.'
        range: SlsaBuildParameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      resolved_dependencies:
        description: The artifacts fetched during the build, as far as the platform knows them; completeness
          is best effort through Build L3.
        aliases:
        - resolvedDependencies
        related_mappings:
        - spdx_build:configSourceUri
        - spdx_build:configSourceDigest
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      hermetic:
        description: Whether the build could reach only the dependencies it declared, with no other network
          or filesystem access.
        range: boolean
        comments:
        - SLSA v1.2 does not require hermetic builds; Build L3's isolation is a different property, and
          hermeticity is a candidate for a future Build L4.
        - The study cites a 2023 industry survey in which over half the participants found hermetic builds
          hard to implement, and lists "hermetic build" among SLSA's unclear terms (Tamanna et al., 2024,
          UC.1).
        in_subset:
        - slsa_adoption_study
      provenance_generation_tool:
        description: The tool that generated this provenance, named by URI.
        range: uri
        comments:
        - Naming the generator supports the strategy of standardizing provenance generation (Tamanna et
          al., 2024, S3.1).
        in_subset:
        - slsa_adoption_study
      pipeline_orchestrator:
        description: The CI/CD system that coordinated the build, named by URI, where it differs from
          the builder.
        range: uri
        comments:
        - In the Secure Software Factory architecture this is the Build Service layer, distinct from the
          provenance-generating builder.
        in_subset:
        - slsa_ssf
    in_subset:
    - slsa_build_track
  SlsaBuildParameter:
    description: One named input to a build, with a string value.
    broad_mappings:
    - spdx_core:DictionaryEntry
    comments:
    - The specification recommends string values; a structured value is written as its JSON text.
    - Each name appears once in a list, since the attestation's JSON uses it as a key; the validator does
      not check this.
    attributes:
      parameter_name:
        description: The parameter's name.
        broad_mappings:
        - spdx_core:key
        required: true
      parameter_value:
        description: The parameter's value.
        broad_mappings:
        - spdx_core:value
    in_subset:
    - slsa_build_track
  SlsaRunDetails:
    description: 'What is specific to one execution of a build: the platform that ran it, metadata about
      the run and its by-products.'
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#rundetails
    attributes:
      builder:
        description: The build platform that ran the build and is trusted to have written this provenance;
          required at Build L1.
        range: SlsaBuildPlatform
        required: true
        inlined: true
      build_metadata:
        description: Metadata about this execution of the build.
        aliases:
        - metadata
        range: SlsaBuildMetadata
        inlined: true
      byproducts:
        description: Artifacts the build produced beside its outputs that may help debugging or incident
          response, such as logs.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
    in_subset:
    - slsa_build_track
  SlsaBuildMetadata:
    description: 'Metadata about one execution of a build: its identifier and when it started and finished.'
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#buildmetadata
    attributes:
      invocation_id:
        description: An identifier for this build invocation, in a format the builder defines; useful
          for finding its logs.
        aliases:
        - invocationId
        close_mappings:
        - spdx_build:buildId
      started_on:
        description: When the build started.
        aliases:
        - startedOn
        close_mappings:
        - spdx_build:buildStartTime
        range: in_toto_timestamp
      finished_on:
        description: When the build finished.
        aliases:
        - finishedOn
        close_mappings:
        - spdx_build:buildEndTime
        range: in_toto_timestamp
    in_subset:
    - slsa_build_track
  SlsaVerificationSummary:
    is_a: SlsaPredicate
    description: The predicate in which a verifier records that it evaluated artifacts against a policy
      and the SLSA levels they met, so consumers can rely on the verifier instead of reading every underlying
      attestation.
    exact_mappings:
    - slsa_dev:verification_summary/v1
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary
    - https://slsa.dev/spec/v1.2/source-requirements#source-verification-summary-attestation
    comments:
    - The statement that carries it has predicate_type https://slsa.dev/verification_summary/v1.
    - A Source VSA is this predicate with the repository as resource_uri and the revision id in the subject's
      digest.
    - Verification tooling and the places attestations are stored were an adoption difficulty practitioners
      reported (Tamanna et al., 2024, LF.1).
    slots:
    - resource_uri
    slot_usage:
      resource_uri:
        description: The URI consumers fetch the artifact from, which the verifier verified it as.
        required: true
    attributes:
      verifier:
        description: The verifier that made this determination.
        range: SlsaVerifier
        required: true
        inlined: true
      time_verified:
        description: When the verification happened.
        aliases:
        - timeVerified
        range: in_toto_timestamp
      policy:
        description: The policy the subject was verified against, by URI and preferably by digest too.
        range: SlsaVerificationSummaryPolicy
        required: true
        inlined: true
      input_attestations:
        description: Every attestation the verifier consulted, each with a digest; complete when present.
        aliases:
        - inputAttestations
        range: SlsaVerificationSummaryInputAttestation
        multivalued: true
        inlined: true
        inlined_as_list: true
      verification_result:
        description: Whether the subject passed the policy.
        aliases:
        - verificationResult
        range: SlsaVerificationResult
        required: true
      verified_levels:
        description: The highest level verified in each track, any verified property, and any result of
          the issuer's own; a level implies the levels below it.
        aliases:
        - verifiedLevels
        range: slsa_result_value
        pattern: ^(SLSA_BUILD_LEVEL_(UNEVALUATED|[0-3])|SLSA_SOURCE_LEVEL_(UNEVALUATED|[0-4])|SLSA_SOURCE_TWO_PARTY_REVIEWED|SLSA_BUILD_REPRODUCED|([!-RT-rt-~]|[Ss]$|[Ss][!-KM-km-~]|[Ss][Ll]$|[Ss][Ll][!-RT-rt-~]|[Ss][Ll][Ss]$|[Ss][Ll][Ss][!-@B-`b-~]|[Ss][Ll][Ss][Aa]$|[Ss][Ll][Ss][Aa][!-^`-~])[!-~]*)$
        multivalued: true
        required: true
        minimum_cardinality: 1
        comments:
        - A VSA lists at most one level per track, and only FAILED when verification failed; the validator
          checks neither.
      organization_properties:
        description: Properties the organization defines for the revision, each prefixed ORG_SOURCE_;
          ORG_SOURCE_INTERNAL_ marks one not meant for external consumers.
        multivalued: true
        pattern: ^ORG_SOURCE_
        deprecated: Write these properties in verified_levels, where the attestation's JSON puts them;
          this field goes in a later release.
        deprecated_element_has_possible_replacement: slsa:verified_levels
        in_subset:
        - slsa_source_track
      dependency_levels:
        description: How many transitive dependencies were verified at each level; absent when the verifier
          makes no claim about dependencies.
        aliases:
        - dependencyLevels
        range: SlsaDependencyLevelCount
        multivalued: true
        inlined: true
        inlined_as_list: true
        comments:
        - The attestation's JSON tells an empty map (no dependencies) from an absent one (no claim); this
          list cannot, so an empty list reads as no claim.
      slsa_version:
        description: The SLSA specification version the verifier applied, as MAJOR.MINOR.
        aliases:
        - slsaVersion
        pattern: ^[0-9]+\.[0-9]+$
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaDependencyLevelCount:
    description: The number of an artifact's transitive dependencies verified at one level, each counted
      once per track at its highest level.
    comments:
    - Each level appears once in a list, since the attestation's JSON uses it as a key; the validator
      does not check this.
    attributes:
      verified_level:
        description: The level the dependencies were verified at, or a result of the issuer's own.
        range: slsa_result_value
        pattern: ^(SLSA_BUILD_LEVEL_(UNEVALUATED|[0-3])|SLSA_SOURCE_LEVEL_(UNEVALUATED|[0-4])|SLSA_SOURCE_TWO_PARTY_REVIEWED|SLSA_BUILD_REPRODUCED|([!-RT-rt-~]|[Ss]$|[Ss][!-KM-km-~]|[Ss][Ll]$|[Ss][Ll][!-RT-rt-~]|[Ss][Ll][Ss]$|[Ss][Ll][Ss][!-@B-`b-~]|[Ss][Ll][Ss][Aa]$|[Ss][Ll][Ss][Aa][!-^`-~])[!-~]*)$
        required: true
      dependency_count:
        description: How many dependencies were verified at that level.
        range: integer
        minimum_value: 0
        required: true
    in_subset:
    - slsa_build_track
  SlsaVerificationSummaryPolicy:
    is_a: InTotoResourceDescriptor
    description: 'The policy a verification summary applied: a resource descriptor that names the policy
      by URI.'
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#policy
    comments:
    - A digest is recommended as well, to pin the exact version of the policy.
    slot_usage:
      resource_uri:
        required: true
      digest:
        recommended: true
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaVerificationSummaryInputAttestation:
    is_a: InTotoResourceDescriptor
    description: 'One attestation a verifier consulted: a resource descriptor that carries the attestation''s
      digest.'
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#inputAttestations
    slot_usage:
      digest:
        required: true
      resource_uri:
        recommended: true
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaSourceControlSystem:
    description: The platform or services that host a source repository and enforce its organization's
      policies on authentication, authorization and change management.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    comments:
    - The SCS issues the Source VSAs and source provenance for the revisions it hosts.
    attributes: {}
    in_subset:
    - slsa_source_track
    slots:
    - id
    is_a: Concept
  SlsaSourceRepository:
    description: A self-contained unit that holds a set of files, their revision history and metadata
      such as branches and tags.
    close_mappings:
    - doap:Repository
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    attributes:
      hosted_by:
        description: The source control system that hosts the repository.
        range: SlsaSourceControlSystem
    in_subset:
    - slsa_source_track
    slots:
    - id
    is_a: Concept
  SlsaSourceRevision:
    description: 'A logically immutable snapshot of a repository''s tracked files, with its version-control
      metadata: author, time and parent revisions.'
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    comments:
    - A revision id is unique within its repository and may recur in another; a document that holds revisions
      from several repositories qualifies them.
    slots:
    - repository
    - id
    attributes:
      authored_by:
        description: The identity of the person or automation that authored the revision.
      authored_at:
        description: When the revision was created.
        range: datetime
      parent_revisions:
        description: The revisions this one descends from, which together form the change history.
        range: SlsaSourceRevision
        multivalued: true
      source_level:
        description: The SLSA Source level the SCS asserts for the revision.
        range: SlsaSourceLevel
      review_type:
        description: The form of review that approved the revision.
        range: SlsaReviewType
        in_subset:
        - slsa_adoption_study
    in_subset:
    - slsa_source_track
    is_a: Concept
  SlsaNamedReference:
    description: A user-friendly name for a revision in a repository, such as main or v1.2.3; reference_type
      says whether it is a branch or a tag.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    comments:
    - A branch moves and a tag never does, so no named reference is both, which children_are_mutually_disjoint
      states for the ontology.
    children_are_mutually_disjoint: true
    slots:
    - repository
    - slsa_revision
    attributes:
      reference_type:
        description: The kind of named reference, one of this class's descendants.
        range: string
      reference_name:
        description: The reference's name, fully qualified in git, such as refs/heads/main.
        required: true
      protected:
        description: Whether the organization has the SCS enforce its technical controls on this reference.
        range: boolean
    in_subset:
    - slsa_source_track
  SlsaBranch:
    is_a: SlsaNamedReference
    description: A named reference that moves to track a line of development.
    narrow_mappings:
    - doap:GitBranch
    in_subset:
    - slsa_source_track
  SlsaTag:
    is_a: SlsaNamedReference
    description: A named reference meant never to move once created.
    comments:
    - A version-control tag that is allowed to move, such as latest, is a named reference and not a tag
      in this sense.
    in_subset:
    - slsa_source_track
  SlsaSourceProvenance:
    is_a: SlsaPredicate
    description: Evidence from an SCS of how a revision came to exist and which technical controls were
      enforced when it did.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#source-provenance-attestations
    comments:
    - SLSA leaves the format of source provenance to each SCS and defines no predicate type for it; this
      class holds what the specification says such provenance conveys.
    - Source L2 and above require the SCS to issue it with each new revision.
    slots:
    - slsa_revision
    slot_usage:
      slsa_revision:
        required: true
    attributes:
      controls_enforced:
        description: The technical controls the SCS enforced when the revision was created, as the organization
          documents them.
        multivalued: true
        comments:
        - Two-party review is a control many single-maintainer projects cannot meet (Tamanna et al., 2024,
          LF.2).
    in_subset:
    - slsa_source_track
  SlsaDependencyInventory:
    description: The inventory of every third-party build dependency, direct and transitive, of one artifact
      version.
    see_also:
    - https://slsa.dev/spec/draft/dependency-track
    comments:
    - The Dependency track is a working draft and not part of the SLSA v1.2 release.
    - A build-time SBOM or a lock file with hashes is a common form of the inventory.
    attributes:
      artifact:
        description: The artifact whose dependencies are inventoried.
        range: InTotoResourceDescriptor
        required: true
        inlined: true
      dependencies:
        description: The dependencies, each as a resource descriptor.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      dependency_level:
        description: The SLSA Dependency level the producer's process meets for this artifact.
        range: SlsaDependencyLevel
    in_subset:
    - slsa_dependency_track
  SlsaBuildImageProducer:
    is_a: SlsaParty
    description: The party that creates and distributes build images; the hosted build platform itself,
      or a third party in a bring-your-own-image setting.
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    in_subset:
    - slsa_build_environment_track
  SlsaBuildImage:
    description: 'The template a build environment is instantiated from, such as a VM or container image:
      root filesystem, guest OS and packages, build executor and build agent.'
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    comments:
    - The Build Environment track is a working draft and not part of the SLSA v1.2 release.
    slots:
    - build_env_level
    - id
    attributes:
      provenance:
        description: The build provenance of the image itself, required at Build Environment L1.
        range: SlsaBuildProvenance
        inlined: true
      produced_by:
        description: The party that created and distributes the image.
        range: SlsaBuildImageProducer
        inlined: true
    in_subset:
    - slsa_build_environment_track
    is_a: Concept
  SlsaMeasurement:
    description: The digest of one component or state of a build environment, to compare with its reference
      value.
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    slots:
    - digest
    attributes:
      measured_component:
        description: The component or state that was measured, such as the bootloader, guest kernel, build
          agent or root filesystem.
        required: true
    in_subset:
    - slsa_build_environment_track
  SlsaBuildEnvironmentAttestation:
    is_a: SlsaPredicate
    description: 'Evidence of the state of a build environment when a build was dispatched to it: the
      image it came from and the measurements taken at boot.'
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#buildenv-levels
    comments:
    - The track names no single predicate type; platforms issue this evidence in formats such as SCAI
      or a VSA.
    slots:
    - build_env_level
    attributes:
      build_id:
        description: The immutable identifier of the build execution the environment was assigned to.
        required: true
      build_image:
        description: The image the environment was instantiated from.
        range: SlsaBuildImage
      measurements:
        description: The measurements of the environment's components taken during boot.
        range: SlsaMeasurement
        multivalued: true
        inlined: true
        inlined_as_list: true
    in_subset:
    - slsa_build_environment_track
  SlsaAdoptionMetadata:
    description: The adoption challenges a deployment meets and the strategies it applies, from the study's
      taxonomy.
    see_also:
    - https://arxiv.org/abs/2409.05014
    notes:
    - The study analysed 1,523 SLSA-related GitHub issues from 233 repositories and derived four challenge
      themes and five strategy themes.
    attributes:
      challenges:
        description: The challenge themes that apply.
        range: SlsaAdoptionChallenge
        multivalued: true
      strategies:
        description: The strategy themes applied or recommended.
        range: SlsaAdoptionStrategy
        multivalued: true
    in_subset:
    - slsa_adoption_study
  SlsaDocument:
    description: A document that holds SLSA attestations and the parties, platforms, packages, repositories
      and images they concern.
    attributes:
      attestations:
        description: The attestations, as in-toto statements with SLSA's fields.
        range: SlsaStatement
        multivalued: true
        inlined: true
        inlined_as_list: true
      parties:
        description: The parties, each in its role.
        range: SlsaParty
        multivalued: true
        inlined: true
        inlined_as_list: true
      build_platforms:
        description: The build platforms.
        range: SlsaBuildPlatform
        multivalued: true
        inlined: true
        inlined_as_list: true
      control_planes:
        description: The control planes of the build platforms.
        range: SlsaControlPlane
        multivalued: true
        inlined: true
        inlined_as_list: true
      packages:
        description: The packages.
        range: SlsaPackage

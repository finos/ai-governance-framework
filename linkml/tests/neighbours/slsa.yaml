  SlsaStatement:
    is_a: InTotoStatement
    description: 'An in-toto statement with the fields this schema adds: where the signed attestation
      is stored, the tool that signed it and the transparency log entry that records the signature.'
    see_also:
    - https://slsa.dev/spec/v1.2/attestation-model
    - https://slsa.dev/spec/v1.2/distributing-provenance
    comments:
    - InTotoStatement comes from lmodel/in-toto and holds only what the in-toto specification defines,
      so the fields SLSA's adoption study and the Secure Software Factory add live on this subclass. A
      statement without them is a valid SlsaStatement too.
    - Attestation and provenance are often confused; a statement is the attestation, and build provenance
      is one kind of predicate it may carry (Tamanna et al., 2024, UC.1).
    attributes:
      attestation_storage_uri:
        description: Where the signed attestation is stored or can be fetched.
        range: uri
        comments:
        - 'SLSA asks producers to publish attestations in at least one place and preferably more: beside
          the source repository''s releases, beside the artifact in its package registry, which it prefers
          in the long term, or elsewhere with an entry in a transparency log.'
        - Where to store attestations was an open question for practitioners (Tamanna et al., 2024, LF.1).
        in_subset:
        - slsa_adoption_study
      signing_tool:
        description: The tool that signed the attestation, named by URI, such as Cosign or Notation.
        range: uri
        in_subset:
        - slsa_ssf
      transparency_log_entry:
        description: The transparency log entry that records the signature, such as a Rekor entry.
        range: uri
        in_subset:

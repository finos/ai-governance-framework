slots:
  resource_uri:
    description: The URI that identifies a resource, such as a package URL, a git repository address or
      an OCI image reference.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#resourceuri
    aliases:
    - uri
    slot_uri: in_toto_linkml:resource_uri
    range: in_toto_resource_uri
  digest:
    description: The cryptographic digests of a resource's content, keyed by algorithm.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/digest_set.md
    slot_uri: in_toto_linkml:digest
    range: InTotoDigestSet
    inlined: true
  slsa_predicate:
    description: The predicate, one of the kinds this schema or an importing one models; predicate_kind
      names which. Unset means the same as empty.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/statement.md
    slot_uri: in_toto_linkml:predicate
    range: InTotoPredicate
    inlined: true
    comments:
    - 'It is a slot of its own rather than an attribute of InTotoStatement, because LOKF''s predicate
      is a relation''s type: `lokf adapt` renames a slot whose name LOKF defines, with the name of the
      schema it adapts as a prefix, and keeps its IRI. This repository''s copy calls it in_toto_linkml_predicate,
      and lmodel/slsa''s calls it slsa_predicate.'
    aliases:
    - predicate
  component_versions:
    description: The version of each named component of a platform.
    aliases:
    - version
    slot_uri: slsa:component_versions
    range: SlsaComponentVersion
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
    - slsa_build_track
  ecosystem:
    description: The package ecosystem whose rules govern how a package is named and distributed, such
      as PyPA, npm or OCI.
    slot_uri: slsa:ecosystem
    comments:
    - One ecosystem's tools can name the same package differently, which the study found affects attestations
      and provenance, so verifiers match provenance to package names with care (Tamanna et al., 2024,
      UR.1).
    in_subset:
    - slsa_build_track
    - slsa_dependency_track
  build_platform:
    description: The build platform this party or component belongs to or uses.
    slot_uri: slsa:build_platform
    range: SlsaBuildPlatform
    in_subset:
    - slsa_build_track
  repository:
    description: The source repository this belongs to.
    slot_uri: slsa:repository
    range: SlsaSourceRepository
    in_subset:
    - slsa_source_track
  slsa_revision:
    description: The source revision this refers to.
    slot_uri: slsa:revision
    range: SlsaSourceRevision
    in_subset:
    - slsa_source_track
    aliases:
    - revision
  build_env_level:
    description: The SLSA Build Environment level this meets.
    slot_uri: slsa:build_env_level
    range: SlsaBuildEnvironmentLevel
    in_subset:
    - slsa_build_environment_track
types:
  in_toto_resource_uri:
    typeof: uri
    description: A URI that identifies or locates a resource, such as a package URL or a git repository
      address, with its scheme and authority in lowercase.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#resourceuri
    comments:
    - The framework recommends a package URL (pkg:) or an SPDX download location (git+https:), and allows
      one that does not resolve.
    pattern: ^[a-z][a-z0-9+.-]*:(//[^/?#A-Z]*([/?#].*)?|[^/].*|/[^/].*|/)?$
  in_toto_type_uri:
    typeof: uri
    description: A URI that names a type, such as a statement's or a predicate's, with its scheme and
      authority in lowercase.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#typeuri
    comments:
    - The framework asks that it carry a version and registers none, since the namespace of a URI keeps
      two types apart.
    pattern: ^[a-z][a-z0-9+.-]*:(//[^/?#A-Z]*([/?#].*)?|[^/].*|/[^/].*|/)?$
  in_toto_timestamp:
    typeof: string
    base: str
    uri: xsd:dateTime
    description: A point in time in RFC 3339 format in the UTC time zone, written with a trailing Z, such
      as 1985-04-12T23:20:50.52Z.
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#timestamp
    comments:
    - It extends string rather than datetime, because the LinkML Python runtime writes a datetime's Z
      as +00:00, which the framework does not allow.
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$
  slsa_result_value:
    typeof: string
    base: str
    description: 'A result as a VSA writes it: one of the SLSA-defined results SlsaResult lists, or one
      of the issuer''s own, which never starts with SLSA_.'
    pattern: ^(SLSA_BUILD_LEVEL_(UNEVALUATED|[0-3])|SLSA_SOURCE_LEVEL_(UNEVALUATED|[0-4])|SLSA_SOURCE_TWO_PARTY_REVIEWED|SLSA_BUILD_REPRODUCED|([!-RT-rt-~]|[Ss]$|[Ss][!-KM-km-~]|[Ss][Ll]$|[Ss][Ll][!-RT-rt-~]|[Ss][Ll][Ss]$|[Ss][Ll][Ss][!-@B-`b-~]|[Ss][Ll][Ss][Aa]$|[Ss][Ll][Ss][Aa][!-^`-~])[!-~]*)$
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#slsaresult
    comments:
    - An issuer's own result, such as an organization's ORG_SOURCE_ property, is printable ASCII with
      no spaces and does not start with SLSA_ in any letter case, so that it cannot pass for an SLSA result.
    - It names the base its typeof already gives, because the SQL generator reads base alone and reports
      a type without one.
    notes:
    - The pattern lists the values of SlsaResult that start with SLSA_ and then admits any other value
      that does not, written without a lookahead, which SHACL's regular expressions lack. One type in
      place of any_of over the enum and a pattern keeps the OWL output valid, since gen-owl makes the
      enum a class.
    - verified_levels and verified_level repeat the pattern through a YAML anchor, because gen-pydantic
      checks a slot's pattern but not its type's.
    - tests/test_schema_rules.py checks the pattern against SlsaResult.
    in_subset:
    - slsa_build_track
    - slsa_source_track
enums:
  SlsaBuildLevel:
    description: The levels of the SLSA Build track, each adding protection against tampering with the
      build or its provenance.
    see_also:
    - https://slsa.dev/spec/v1.2/build-track-basics
    permissible_values:
      SLSA_BUILD_LEVEL_0:
        description: No requirements; the absence of SLSA, as for development or test builds.
      SLSA_BUILD_LEVEL_1:
        description: Provenance exists and shows how the package was built; it prevents mistakes but is
          easy to forge.
      SLSA_BUILD_LEVEL_2:
        description: A hosted platform generates and signs the provenance, so tampering after the build
          needs an explicit attack.
        comments:
        - Keeping the provenance generator, the verifier and signing tools such as cosign working in CI
          workflows was a common difficulty (Tamanna et al., 2024, CI.2).
      SLSA_BUILD_LEVEL_3:
        description: A hardened platform prevents runs from influencing one another and keeps signing
          material away from build steps, so forging provenance needs an exploit.
        comments:
        - Practitioners reported difficulty in generating provenance for the higher levels (Tamanna et
          al., 2024, CI.1).
    in_subset:
    - slsa_build_track
  SlsaVerificationResult:
    description: The outcome of verifying an artifact against a policy.
    see_also:
    - https://www.w3.org/TR/EARL10-Schema/
    comments:
    - PASSED and FAILED mean the outcomes of the same names in W3C's Evaluation and Report Language (EARL)
      1.0, for which a policy is a test criterion; the mapping is this project's own.
    - The meanings are full addresses with no prefix bound for them, because the Python generator writes
      no namespace for a prefix bound only in an imported module, and shortens a full address to any prefix
      that covers it. The Python model holds no meaning for them; the other generators keep it.
    permissible_values:
      PASSED:
        description: The artifact met the policy.
        meaning: http://www.w3.org/ns/earl#passed
      FAILED:
        description: The artifact did not meet the policy.
        meaning: http://www.w3.org/ns/earl#failed
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaResult:
    description: 'A result of evaluating an artifact against SLSA: a track level, a verified property,
      or a failure. A level implies the levels below it in the same track.'
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#slsaresult
    - https://slsa.dev/spec/v1.2/verified-properties
    comments:
    - Issuers may add values of their own, but none that start with SLSA_; this enum lists the SLSA-defined
      values, and slsa_result_value, which verified_levels takes, admits both.
    - The working-draft Dependency and Build Environment tracks name no results yet, so none are listed
      for them.
    - 'Only FAILED has a public term: it means EARL''s failed, as SlsaVerificationResult''s FAILED does,
      since a VSA lists it only when verification failed. No vocabulary names SLSA''s levels or verified
      properties.'
    permissible_values:
      SLSA_BUILD_LEVEL_UNEVALUATED:
        description: The issuer makes no claim about the Build track level.
      SLSA_BUILD_LEVEL_0:
        description: No Build track guarantees were verified.
      SLSA_BUILD_LEVEL_1:
        description: Build level 1 was verified.
      SLSA_BUILD_LEVEL_2:
        description: Build level 2 was verified.
      SLSA_BUILD_LEVEL_3:
        description: Build level 3 was verified.
      SLSA_SOURCE_LEVEL_UNEVALUATED:
        description: The issuer makes no claim about the Source track level.
      SLSA_SOURCE_LEVEL_0:
        description: No Source track guarantees were verified.
      SLSA_SOURCE_LEVEL_1:
        description: Source level 1 was verified.
      SLSA_SOURCE_LEVEL_2:
        description: Source level 2 was verified.
      SLSA_SOURCE_LEVEL_3:
        description: Source level 3 was verified.
      SLSA_SOURCE_LEVEL_4:
        description: Source level 4 was verified.
      SLSA_SOURCE_TWO_PARTY_REVIEWED:
        description: The verified property that two trusted persons reviewed the source, at whatever source
          level.
      SLSA_BUILD_REPRODUCED:
        description: The verified property that two or more independent build platforms reproduced the
          artifact.
      FAILED:
        description: Policy evaluation failed.
        meaning: http://www.w3.org/ns/earl#failed
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaSourceLevel:
    description: The levels of the SLSA Source track, each adding trust in how a revision was created.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#basics
    permissible_values:
      SLSA_SOURCE_LEVEL_0:
        description: No Source track guarantees; a revision for which the SCS issues no Source VSA is
          at this level.
      SLSA_SOURCE_LEVEL_1:
        description: The source is managed in a version control system, so it has discrete, immutable
          revisions.
      SLSA_SOURCE_LEVEL_2:
        description: Branch history is continuous and retained, and the SCS issues source provenance for
          each new revision.
      SLSA_SOURCE_LEVEL_3:
        description: The SCS enforces the organization's technical controls on protected named references
          and provides evidence of them.
      SLSA_SOURCE_LEVEL_4:
        description: Two trusted persons agree to every change on protected branches.
        comments:
        - Whether pair or mob programming counts as two-party review is an open question (Tamanna et al.,
          2024, LF.2).
    in_subset:
    - slsa_source_track
  SlsaReviewType:
    description: The forms of review that may approve a revision, including the contested forms the adoption
      study records.
    see_also:
    - https://arxiv.org/abs/2409.05014
    annotations:
      study_theme: LF.2
    permissible_values:
      TWO_PARTY:
        description: A reviewer distinct from the author approved the change, both being trusted persons.
      PAIR_PROGRAMMING:
        description: Two developers wrote the change together at one workstation or screen; whether this
          counts as two-party review is open.
      MOB_PROGRAMMING:
        description: A group wrote the change together; whether this counts as two-party review is open.
      AUTOMATED:
        description: A tool or bot reviewed the change with no second person, which is not two-party review.
        comments:
        - At Source L4 an organization may still exempt a trusted robot's own changes from two-party review.
    in_subset:
    - slsa_source_track
    - slsa_adoption_study
  SlsaDependencyLevel:
    description: The levels of the SLSA Dependency track, each reducing the risk third-party dependencies
      bring.
    see_also:
    - https://slsa.dev/spec/draft/dependency-track#levels
    permissible_values:
      SLSA_DEPENDENCY_LEVEL_0:
        description: No Dependency track claims.
      SLSA_DEPENDENCY_LEVEL_1:
        description: An inventory of all build dependencies, direct and transitive, exists.
      SLSA_DEPENDENCY_LEVEL_2:
        description: Every known vulnerability in the dependencies was triaged before release.
      SLSA_DEPENDENCY_LEVEL_3:
        description: Every third-party build dependency is consumed from a location the producer controls.
      SLSA_DEPENDENCY_LEVEL_4:
        description: An ingestion policy keeps compromised upstream dependencies out of the build.
    in_subset:
    - slsa_dependency_track
  SlsaBuildEnvironmentLevel:
    description: The levels of the SLSA Build Environment track, each extending integrity further into
      the compute that runs builds.
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#track-overview
    permissible_values:
      SLSA_BUILD_ENV_LEVEL_0:
        description: No Build Environment track claims.
      SLSA_BUILD_ENV_LEVEL_1:
        description: The build image has signed build provenance, protecting against tampering while the
          image is distributed.
      SLSA_BUILD_ENV_LEVEL_2:
        description: The compute platform attests to the environment's state at boot, protecting against
          tampering through the control plane.
      SLSA_BUILD_ENV_LEVEL_3:
        description: Trusted hardware attests to the host's state, protecting against tampering through
          the host interface.
    in_subset:
    - slsa_build_environment_track
  SlsaAdoptionChallenge:
    description: The four themes of difficulty practitioners met when adopting SLSA.
    see_also:
    - https://arxiv.org/abs/2409.05014
    permissible_values:
      COMPLEX_IMPLEMENTATION:
        description: Generating provenance and maintaining the required tools is complicated.
        annotations:
          study_theme: CI
        comments:
        - 'Sub-themes: complicated provenance generation (CI.1) and intricate tool maintenance (CI.2);
          901 issues.'
      UNCLEAR_COMMUNICATION:
        description: SLSA's terms and its guidance for particular ecosystems are hard to understand.
        annotations:
          study_theme: UC
        comments:
        - 'Sub-themes: unclear definitions of key terms (UC.1) and unclear documentation, such as how
          to apply SLSA in an ecosystem (UC.2); 357 issues.'
      LIMITED_FEASIBILITY:
        description: Verification tooling, attestation storage and two-party review are hard to put into
          practice.
        annotations:
          study_theme: LF
        comments:
        - 'Sub-themes: limited attestation verification, including where attestations are stored (LF.1),
          and two-party review requirements, which projects with one maintainer find hard to meet (LF.2);
          219 issues.'
      UNCLEAR_RELEVANCE:
        description: Which attacks SLSA mitigates, and how it differs from other practices, is unclear.
        annotations:
          study_theme: UR
        comments:
        - 'Sub-theme: unclear relevance, including tools that name one package differently within an ecosystem
          (UR.1); 46 issues.'
    in_subset:
    - slsa_adoption_study
  SlsaAdoptionStrategy:
    description: The five themes of strategy practitioners proposed for the adoption challenges.
    see_also:
    - https://arxiv.org/abs/2409.05014
    permissible_values:
      ENHANCE_ALIGNMENT_FLEXIBILITY:
        description: Make SLSA fit more contexts, with build-system tracks, gamified levels, flexibility
          for varied organizations and alignment with OpenSSF practices.
        annotations:
          study_theme: S1
      PROVIDE_DETAILED_DOCUMENTATION:
        description: Give clearer definitions, standard terms, negative examples and better navigation.
        annotations:
          study_theme: S2
      STREAMLINE_PROVENANCE_GENERATION:
        description: Simplify and standardize provenance generation with tools and templates, and fix
          release-tool inconsistencies.
        annotations:
          study_theme: S3
      IMPROVE_VERIFICATION_PROCESS:
        description: Strengthen verification and level determination, tag versions early, and give downstream
          users more signals.
        annotations:
          study_theme: S4
      COLLABORATE_WITH_COMMUNITY:
        description: Align with industry standards, guide newcomers, and share knowledge across projects.
        annotations:
          study_theme: S5
    in_subset:
    - slsa_adoption_study
subsets:
  slsa_build_track:
    description: Elements of the SLSA Build track, which measures the trustworthiness of a build and its
      provenance.
  slsa_source_track:
    description: Elements of the SLSA Source track, which measures how source revisions are created and
      managed.
  slsa_dependency_track:
    description: Elements of the SLSA Dependency track, a working-draft track for managing risk from third-party
      dependencies.
  slsa_build_environment_track:
    description: Elements of the SLSA Build Environment track, a working-draft track for the integrity
      of the compute environment that runs builds.
  slsa_adoption_study:
    description: Elements this schema adds from an empirical study of SLSA adoption (Tamanna et al., 2024,
      arXiv:2409.05014). They are not part of the SLSA specification.
  slsa_ssf:
    description: Elements this schema adds from the CNCF TAG-Security Secure Software Factory reference
      architecture and the OpenSSF supply-chain projects. They are not part of the SLSA specification.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: SlsaParty, SlsaBuildPlatform, SlsaControlPlane,
  SlsaPackageRegistry, SlsaPackage, SlsaSourceControlSystem, SlsaSourceRepository, SlsaSourceRevision,
  SlsaBuildImage; dropped for LOKF''s: builder_id, registry_uri, scs_uri, repository_uri, revision_id,
  image_uri; renamed, IRIs unchanged: predicate -> slsa_predicate, revision -> slsa_revision; designators
  demoted: predicate_kind, party_type, reference_type.'

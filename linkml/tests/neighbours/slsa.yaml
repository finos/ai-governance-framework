    comments:
    - In the attestation's JSON the algorithm is a key of the digest set beside the named ones, and an
      algorithm the framework does not define documents how its value is encoded.
    - An SCS that does not use cryptographic digests defines a canonical revision type of its own that
      includes the repository, such as svn_revision_id.
    - Each algorithm appears once in a list, since the attestation's JSON uses it as a key; the validator
      does not check this.
    - It is related to, not the same as, an SPDX 3 Hash, whose algorithm comes from a closed list, where
      this one's may be a revision type rather than a digest.

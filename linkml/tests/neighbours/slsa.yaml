        - An algorithm that InTotoDigestSet names, by its JSON key or by its field name, goes in that
          field instead.
        - A name starts with a lowercase letter, as the framework's own names do, so that SHA256 is not
          taken for sha256, and it may hold a colon, as go-witness's gitoid:sha256 does. The framework
          itself sets no rule for other names.

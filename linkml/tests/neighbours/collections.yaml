imports:
- linkml:types
- lokf
slots:
  element:
    description: A thing the collection holds, named by its IRI.
    comments:
    - In a bag, each item's itemContent is also an element, as the path rule states after CO's property
      chain.
    slot_uri: coll:element
    narrow_mappings:
    - swan:element
    - odpce:hasMember
    - ore:aggregates
    domain: Collection
    range: CoElement
    multivalued: true
    path_rule:
      traverse: item
      followed_by:
        traverse: itemContent
  elementOf:
    description: A collection that holds the thing as an element.
    slot_uri: coll:elementOf
    narrow_mappings:
    - odpce:isMemberOf
    inverse: element
    domain: CoElement
    range: Collection
    multivalued: true
    inlined: true
    inlined_as_list: true
  co_size:
    description: 'How many times the collection holds a thing, counting each repeat: the number of elements
      of a set, or of items of a bag or a list.'
    notes:
    - CO gives every collection exactly one size. The schema leaves it optional, since a reader can count;
      where it is given, the tests check that it equals the count.
    aliases:
    - size
    slot_uri: coll:size
    exact_mappings:
    - swan:size
    - odpbag:size
    - odpset:size
    narrow_mappings:
    - mo:track_count
    - schema:numberOfItems
    domain: Collection
    range: integer
    minimum_value: 0
  item:
    description: An item of the bag, which holds one of its elements.
    comments:
    - In a list, the item after an item of the list is also an item of it, as the path rule states after
      CO's property chain.
    slot_uri: coll:item
    narrow_mappings:
    - swan:item
    - mo:track
    domain: Bag
    range: CoItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    path_rule:
      traverse: item
      followed_by:
        traverse: nextItem
  itemOf:
    description: A bag that holds the item.
    slot_uri: coll:itemOf
    narrow_mappings:
    - odpbag:itemOf
    - ore:proxyIn
    inverse: item
    domain: CoItem
    range: Bag
    multivalued: true
    inlined: true
    inlined_as_list: true
  itemContent:
    description: The element that the item wraps.
    notes:
    - CoItem requires it. CO's OWL file makes itemContent functional, so an item wraps at most one element,
      and CO's wiki page StructureBag says that an item links exactly one resource.
    see_also:
    - https://github.com/collections-ontology/collections-ontology/blob/58e55d956991878307d430eede7790d5e5da206f/StructureBag.md
    slot_uri: coll:itemContent
    exact_mappings:
    - swan:itemContent
    - odpbag:itemContent
    close_mappings:
    - schema:item
    narrow_mappings:
    - mo:publication_of
    - ore:proxyFor
    domain: CoItem
    range: CoElement
  itemContentOf:
    description: An item that wraps the thing.
    slot_uri: coll:itemContentOf
    narrow_mappings:
    - mo:published_as
    inverse: itemContent
    domain: CoElement
    range: CoItem
    multivalued: true
    inlined: true
    inlined_as_list: true
  co_index:
    description: The place of the item in its list, counting from 1.
    aliases:
    - index
    slot_uri: coll:index
    close_mappings:
    - schema:position
    narrow_mappings:
    - mo:track_number
    domain: ListItem
    range: integer
    minimum_value: 1
  firstItem:
    description: The first item of the list.
    comments:
    - It holds a copy of the item with index 1, which has no previous item.
    notes:
    - CO makes it a narrower form of item, which is not stated here. LinkML's inheritance is monotonic,
      so a slot under item would be multivalued, as item is, and this one holds one item.
    slot_uri: coll:firstItem
    narrow_mappings:
    - swan:firstItem
    domain: List
    range: ListItem
    inlined: true
  firstItemOf:
    description: A list whose first item this is.
    is_a: itemOf
    slot_uri: coll:firstItemOf
    narrow_mappings:
    - odplist:firstItemOf
    inverse: firstItem
    domain: ListItem
    range: List
    multivalued: true
    inlined: true
    inlined_as_list: true
  lastItem:
    description: The last item of the list.
    comments:
    - It holds a copy of the item with the highest index, which has no next item.
    notes:
    - CO makes it a narrower form of item, which is not stated here for the reason given on firstItem.
    slot_uri: coll:lastItem
    narrow_mappings:
    - swan:lastItem
    domain: List
    range: ListItem
    inlined: true
  lastItemOf:
    description: A list whose last item this is.
    is_a: itemOf
    slot_uri: coll:lastItemOf
    narrow_mappings:
    - odplist:lastItemOf
    inverse: lastItem
    domain: ListItem
    range: List
    multivalued: true
    inlined: true
    inlined_as_list: true
  nextItem:
    description: The item that comes straight after this one.
    comments:
    - It holds a copy of the item whose index is one higher.
    notes:
    - 'CO makes it a narrower form of followedBy. It is stated on followedBy, as transitive_form_of, not
      here as is_a: LinkML''s inheritance is monotonic, so a slot under followedBy would be multivalued
      and transitive, as followedBy is, and this one is neither.'
    slot_uri: coll:nextItem
    exact_mappings:
    - swan:nextItem
    close_mappings:
    - schema:nextItem
    domain: ListItem
    range: ListItem
    inlined: true
  previousItem:
    description: The item that comes straight before this one.
    comments:
    - It holds a copy of the item whose index is one lower.
    notes:
    - CO makes it a narrower form of precededBy. It is stated on precededBy, as transitive_form_of, not
      here as is_a, for the reason given on nextItem.
    slot_uri: coll:previousItem
    exact_mappings:
    - swan:previousItem
    close_mappings:
    - schema:previousItem
    broad_mappings:
    - seq:directlyFollows
    inverse: nextItem
    domain: ListItem
    range: ListItem
    inlined: true
  followedBy:
    description: An item that comes somewhere after this one.
    comments:
    - It holds copies of items whose index is higher.
    slot_uri: coll:followedBy
    exact_mappings:
    - swan:followedBy
    domain: ListItem
    range: ListItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    transitive: true
    transitive_form_of: nextItem
  precededBy:
    description: An item that comes somewhere before this one.
    comments:
    - It holds copies of items whose index is lower.
    slot_uri: coll:precededBy
    exact_mappings:
    - swan:preceededBy
    inverse: followedBy
    domain: ListItem
    range: ListItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    transitive: true
    transitive_form_of: previousItem
classes:
  Collection:
    class_uri: coll:Collection
    exact_mappings:
    - swan:Collection
    - odpce:Collection
    narrow_mappings:
    - ore:Aggregation
    description: A group of things that is taken as a whole.
    comments:
    - Its children are marked mutually disjoint because gen-owl drops disjoint_with (linkml issue 3950),
      so this is how the generated ontology states that a set is never a bag.
    children_are_mutually_disjoint: true
    slots:
    - co_size
    - element
    disjoint_with:
    - CoItem
    is_a: Concept
  Set:
    is_a: Collection
    class_uri: coll:Set
    exact_mappings:
    - swan:Set
    - odpset:Set
    description: A collection that holds each of its elements once.
    comments:
    - 'No validator checks that the elements differ: LinkML 1.12.1''s generators drop list_elements_unique,
      so the tests check it.'
    slot_usage:
      element:
        list_elements_unique: true
  Bag:
    is_a: Collection
    class_uri: coll:Bag
    exact_mappings:
    - swan:Bag
    - odpbag:Bag
    description: A collection that may hold one element more than once, in no order.
    slots:
    - item
    disjoint_with:
    - Set
  List:
    is_a: Bag
    class_uri: coll:List
    exact_mappings:
    - swan:List
    - odplist:List
    narrow_mappings:
    - mo:Record
    broad_mappings:
    - schema:ItemList
    description: A collection whose items come in order, one after another.
    comments:
    - 'No validator checks the order: that the indexes count from 1 with no gap or repeat, and that firstItem,
      lastItem and each item''s links agree with them. The tests check it.'
    slots:
    - firstItem
    - lastItem
    slot_usage:
      item:
        range: ListItem
  CoElement:
    description: A thing that a collection holds, named by its IRI.
    comments:
    - CO puts no limit on what a collection holds. A value of element or itemContent is the IRI of a CoElement,
      so the RDF of a collection links to its elements rather than holding their IRIs as text.
    notes:
    - Not a term of CO, so its IRI is the schema's own. CO says that what an item wraps is not itself
      an item, which disjoint_with states.
    disjoint_with:
    - CoItem
    attributes: {}
    slots:
    - id
    is_a: Concept
  CoItem:
    class_uri: coll:Item
    exact_mappings:
    - swan:Item
    - odpbag:Item
    description: An entry of a bag, which wraps one of the bag's elements.
    aliases:
    - Item
    notes:
    - CO says that every item is an item of some bag. The schema leaves itemOf optional, since a bag holds
      its items inline.
    slots:
    - itemContent
    slot_usage:
      itemContent:
        required: true
  ListItem:
    is_a: CoItem
    class_uri: coll:ListItem
    exact_mappings:
    - swan:ListItem
    - odplist:ListItem
    close_mappings:
    - schema:ListItem
    narrow_mappings:
    - mo:Track
    - ore:Proxy
    description: An item of a list, which has a place in the list's order.
    slots:
    - co_index
    - nextItem
    - previousItem
    - followedBy
    - precededBy
    slot_usage:
      co_index:
        required: true

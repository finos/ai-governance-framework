id: https://w3id.org/lmodel/d3fend-lokf
name: d3fend
title: MITRE D3FEND Knowledge Graph
description: 'A LinkML model of MITRE D3FEND, the knowledge graph of cybersecurity countermeasures. It
  models the graph as a catalogue of records: each kind of entry is a class, each property of the ontology
  is a slot under its own IRI, and every term of D3FEND 1.6.0 is a record that validates against them.'
version: 1.6.0
source: https://d3fend.mitre.org/ontologies/d3fend/1.6.0/d3fend.ttl
license: Apache-2.0
keywords:
- countermeasure
- D3FEND
- cybersecurity
- knowledge graph
- defensive technique
- digital artifact
see_also:
- https://lmodel.github.io/d3fend
- https://d3fend.mitre.org/
annotations:
  upstream_tag: 1.6.0
  upstream_commit: 91629abb966e
  upstream_release_date: '2026-08-31'
  upstream_copyright: Copyright 2022 The MITRE Corporation
  upstream_license: The MITRE Corporation (MITRE) hereby grants you a non-exclusive, royalty-free license
    to use D3FEND for research, development, and commercial purposes. Any copy you make for such purposes
    is authorized provided that you reproduce MITRE's copyright designation and this license in any such
    copy.
  upstream_terms: https://d3fend.mitre.org/tou
comments:
- The version is the edition of D3FEND the schema renders. upstream/ holds its Turtle file unchanged,
  scripts/d3fend_to_linkml.py writes the catalogue and the slots from it, and scripts/check_upstream_release.py
  reports when it moves.
prefixes:
  d3fend: https://w3id.org/lmodel/d3fend/
  linkml: https://w3id.org/linkml/
  owl: http://www.w3.org/2002/07/owl#
  xsd: http://www.w3.org/2001/XMLSchema#
  BFO: http://purl.obolibrary.org/obo/BFO_
  COMMONCOREONTOLOGY: http://www.ontologyrepository.com/CommonCoreOntologies/
  IAO: http://purl.obolibrary.org/obo/IAO_
  attack: https://w3id.org/lmodel/attack/
  capec: https://w3id.org/lmodel/capec/
  cco: https://www.commoncoreontologies.org/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  nist_sp_800_53: https://w3id.org/lmodel/nist-sp-800-53/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#
  stix: https://w3id.org/lmodel/stix/

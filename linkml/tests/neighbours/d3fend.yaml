    is_a: Concept
  D3fendThing:
    title: Thing
    is_a: D3fendEntry
    description: 'An entry with no narrower kind here: a root of D3FEND''s tree, or a term such as a plan,
      a step, a group, a time or a condition.'
  D3fendThreatModelThing:
    title: Threat Model Thing
    is_a: D3fendEntry
    description: A term from a threat model outside D3FEND, such as ATT&CK, ATLAS, SPARTA or CAPEC, with
      no narrower kind here.
    class_uri: d3f:ExternalThreatModelThing
    annotations:
      d3fend_branches: d3f:ExternalThreatModelThing
  D3fendThreatModelTechnique:
    title: Threat Model Technique
    is_a: D3fendThreatModelThing
    description: A technique of ATT&CK Mobile, ATT&CK ICS, ATLAS or SPARTA. D3FEND places these under
      their frameworks and not under its own offensive technique.
    annotations:
      d3fend_branches: d3f:ATTACKMobileTechnique d3f:ATTACKICSTechnique d3f:ATLASTechnique d3f:SPARTATechnique
    related_mappings:
    - attack:AttackTechnique
  D3fendAttackDataSource:
    title: ATT&CK Enterprise Data Source
    is_a: D3fendThreatModelThing
    description: A data source of ATT&CK Enterprise, which D3FEND relates to its digital artifacts.
    class_uri: d3f:ATTACKEnterpriseDataSource
    annotations:
      d3fend_branches: d3f:ATTACKEnterpriseDataSource
    close_mappings:
    - attack:AttackDataSource
  D3fendAttackMitigation:
    title: ATT&CK Enterprise Mitigation
    is_a: D3fendThreatModelThing
    description: A mitigation of ATT&CK Enterprise, which D3FEND relates to its defensive techniques.
    class_uri: d3f:ATTACKEnterpriseMitigation
    annotations:
      d3fend_branches: d3f:ATTACKEnterpriseMitigation
    close_mappings:
    - attack:AttackMitigation
  D3fendControlCatalog:
    title: Control Catalog
    is_a: D3fendEntry
    description: A published list of controls, one edition of which holds D3FEND's control entries as
      members.
    class_uri: d3f:ControlCatalog
    annotations:
      d3fend_branches: d3f:ControlCatalog
    rules:
    - title: An individual holds version
      description: A class restriction on ControlCatalog states that its instances hold version, and every
        individual of this edition does.
      preconditions:
        slot_conditions:
          owl_kind:
            required: true
            equals_string: individual
      postconditions:
        slot_conditions:
          d3fend_version:
            required: true
  D3fendExternalControl:
    title: External Control
    is_a: D3fendEntry
    description: A control another catalogue defines, which D3FEND relates to its techniques.
    class_uri: d3f:ExternalControl
    annotations:
      d3fend_branches: d3f:ExternalControl
  D3fendCciControl:
    title: CCI Control
    is_a: D3fendExternalControl
    description: An item of the Control Correlation Identifier list that DISA publishes.
    class_uri: d3f:CCIControl
    annotations:
      d3fend_branches: d3f:CCIControl
    rules:
    - title: An individual holds published
      description: A class restriction on CCIControl states that its instances hold published, and every
        individual of this edition does.
      preconditions:
        slot_conditions:
          owl_kind:
            required: true
            equals_string: individual
      postconditions:
        slot_conditions:
          published:
            required: true
  D3fendNistControl:
    title: NIST Control
    is_a: D3fendExternalControl
    description: A control or control enhancement of a revision of NIST SP 800-53.
    class_uri: d3f:NISTControl
    annotations:
      d3fend_branches: d3f:NISTControl
    related_mappings:
    - nist_sp_800_53:Control
    - nist_sp_800_53:ControlEnhancement
  D3fendTechniqueReference:
    title: Technique Reference
    is_a: D3fendEntry
    description: A source behind a knowledge base article, such as a patent or a paper. rdf_type says
      which of D3FEND's reference types it is, since all of them hold the same fields.
    class_uri: d3f:TechniqueReference
    annotations:
      d3fend_branches: d3f:TechniqueReference
    slots:
    - kb_author
    - kb_mitre_analysis
    rules:
    - title: An individual holds has_link and kb_reference_title
      description: A class restriction on TechniqueReference states that its instances hold has_link and
        kb_reference_title, and every individual of this edition does.
      preconditions:
        slot_conditions:
          owl_kind:
            required: true
            equals_string: individual
      postconditions:
        slot_conditions:
          has_link:
            required: true
          kb_reference_title:
            required: true
  D3fendAgent:
    title: Agent
    is_a: D3fendEntry
    description: Something capable of intentional action, such as a person, an organization or an attacker.
    class_uri: d3f:Agent
    annotations:
      d3fend_branches: d3f:Agent
  D3fendEvent:
    title: Event
    is_a: D3fendEntry
    description: Something that happens in a system over a finite span of time, with the artifacts that
      take part in it.
    class_uri: d3f:Event
    annotations:
      d3fend_branches: d3f:Event
    slots:
    - has_input
    - has_output
  D3fendArtifact:
    title: Artifact
    is_a: D3fendEntry
    description: A man-made thing that techniques act on. Those that are not digital, such as a physical
      lock, stay here.
    class_uri: d3f:Artifact
    annotations:
      d3fend_branches: d3f:Artifact
    slots:
    - input_of
    - may_have_weakness
    - output_of
  D3fendDigitalArtifact:
    title: Digital Artifact
    is_a: D3fendArtifact
    description: 'An artifact that carries information for a digital system, such as a file, a process
      or a network packet: the common ground where offensive and defensive techniques meet.'
    class_uri: d3f:DigitalArtifact
    annotations:
      d3fend_branches: d3f:DigitalArtifact
    slots:
    - process_security_context
  D3fendWeakness:
    title: Weakness
    is_a: D3fendEntry
    description: A condition in a system component that can contribute to a vulnerability. Nearly all
      of these entries name a CWE entry.
    class_uri: d3f:Weakness
    annotations:
      d3fend_branches: d3f:Weakness
    slots:
    - may_be_weakness_of
    close_mappings:
    - cwe:CweWeakness
  D3fendTechnique:
    title: Technique
    is_a: D3fendEntry
    description: A way of doing something in or to a computer system. Its narrower kinds say whose way
      it is.
    class_uri: d3f:Technique
    annotations:
      d3fend_branches: d3f:Technique
    slots:
    - kb_reference
  D3fendAnalyticTechnique:
    title: Analytic Technique
    is_a: D3fendTechnique
    description: A mathematical method a defensive technique can use to find patterns in data, such as
      a form of machine learning or a statistical measure.
    class_uri: d3f:AnalyticTechnique
    annotations:
      d3fend_branches: d3f:AnalyticTechnique
  D3fendOffensiveTechnique:
    title: Offensive Technique
    is_a: D3fendTechnique
    description: A way an adversary acts, drawn from ATT&CK Enterprise, related to the artifacts it touches
      and to the tactic it serves.
    class_uri: d3f:OffensiveTechnique
    annotations:
      d3fend_branches: d3f:OffensiveTechnique
    close_mappings:
    - attack:AttackTechnique
  D3fendDefensiveTechnique:
    title: Defensive Technique
    is_a: D3fendTechnique
    description: 'A countermeasure: a method that makes a system harder to attack, related to the artifacts
      it acts on and to the tactic it enables.'
    class_uri: d3f:DefensiveTechnique
    annotations:
      d3fend_branches: d3f:DefensiveTechnique
  D3fendGoal:
    title: Goal
    is_a: D3fendEntry
    description: An aim that a tactic or a technique serves.
    class_uri: d3f:Goal
    annotations:
      d3fend_branches: d3f:Goal
  D3fendOffensiveTactic:
    title: Offensive Tactic
    is_a: D3fendGoal
    description: A tactic of an adversary, from the ATT&CK, ATLAS or SPARTA framework, which an offensive
      technique enables.
    class_uri: d3f:OffensiveTactic
    annotations:
      d3fend_branches: d3f:OffensiveTactic
    related_mappings:
    - attack:AttackTactic
  D3fendDefensiveTactic:
    title: Defensive Tactic
    is_a: D3fendGoal
    description: One of D3FEND's seven defensive aims, such as Detect or Harden, which a defensive technique
      enables.
    class_uri: d3f:DefensiveTactic
    annotations:
      d3fend_branches: d3f:DefensiveTactic
  D3fendDisjointGroup:
    title: Disjoint Group
    description: A set of D3FEND classes of which no two share an instance.
    annotations:
      owl_type: owl:AllDisjointClasses
    attributes:
      members:
        description: The classes in the group.
        slot_uri: owl:members
        required: true
        multivalued: true
        range: D3fendEntry
        inlined: false
  D3fendCatalog:
    title: Catalog
    description: One edition of the D3FEND ontology, with its header and all its entries.
    slots:
    - comment
    - release_date
    - id
    attributes:
      version_info:
        title: Version
        description: The edition of the ontology.
        slot_uri: owl:versionInfo
        required: true
      version_iri:
        title: Version IRI
        description: The IRI of this edition of the ontology.
        slot_uri: owl:versionIRI
        range: uri
      ontology_title:
        title: Ontology Title
        description: The title of the ontology.
        slot_uri: dcterms:title
      ontology_description:
        title: Ontology Description
        description: The description of the ontology.
        slot_uri: dcterms:description
      ontology_license:
        title: Ontology License
        description: The licence the ontology states.
        slot_uri: dcterms:license
      disjoint_groups:
        title: Disjoint Groups
        description: The sets of classes the ontology declares mutually disjoint.
        multivalued: true
        range: D3fendDisjointGroup
        inlined_as_list: true
      entries:
        title: Entries
        description: Every class and individual of the ontology, as one record each.
        required: true
        multivalued: true
        range: D3fendEntry
        inlined_as_list: true
    is_a: Concept
enums:
  D3fendOwlKind:
    title: OWL Kind
    description: How the ontology declares a term.
    permissible_values:
      class:
        title: Class
        description: The term is an owl:Class only.
        meaning: owl:Class
      individual:
        title: Individual
        description: The term is an owl:NamedIndividual only.
        meaning: owl:NamedIndividual
      class_and_individual:
        title: Class and Individual
        description: The term is punned, both an owl:Class and an owl:NamedIndividual.
types:
  d3fend_date_time:
    title: Date Time
    description: A date and time as the ontology writes it, which may carry no time zone.
    typeof: string
    uri: xsd:dateTime
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})?$
    comments:
    - LinkML's datetime type asks a JSON Schema format checker for a time zone, which most of D3FEND's
      values do not have.
  d3fend_uri:
    title: Address
    description: An address as the ontology writes it, typed xsd:anyURI.
    typeof: string
    uri: xsd:anyURI
    comments:
    - LinkML's uri type asks a JSON Schema format checker for a valid address, and three of D3FEND's has-link
      values are empty strings.
slots:
  owl_kind:
    title: OWL Kind
    description: Whether the ontology declares the term a class, an individual or both.
    range: D3fendOwlKind
  subclass_of:
    title: Subclass Of
    description: The D3FEND classes directly above the term.
    slot_uri: rdfs:subClassOf
    range: D3fendEntry
    multivalued: true
    inlined: false
  abuses:
    title: abuses
    description: 'x abuses y: The entity x applies an artifact y to a wrong thing or person; x applies
      y badly or incorrectly.'
    slot_uri: d3f:abuses
    is_a: uses
    range: D3fendEntry
    multivalued: true
    inlined: false
    aliases:
    - misapplies
    - misuses
    annotations:
      owl_property: object
      is_defined_by: http://wordnet-rdf.princeton.edu/id/01163606-v
  access_mediated_by:
    title: access-mediated-by
    description: 'x access-mediated-by y: The entity or resource x has its access regulated, controlled,
      or facilitated by entity y, which acts as an intermediary or gatekeeper to enforce access control
      policies.'
    slot_uri: d3f:access-mediated-by
    is_a: associated_with
    inverse: mediates_access_to
    range: D3fendEntry
    multivalued: true
    inlined: false
    annotations:
      owl_property: object
    domain: D3fendEntry
  accessed_by:
    title: accessed-by
    description: 'x accessed-by y: The entity or resource x is accessed by entity y.'
    slot_uri: d3f:accessed-by
    is_a: associated_with
    mixins:
    - may_be_accessed_by
    inverse: accesses
    range: D3fendEntry
    multivalued: true
    inlined: false
    annotations:
      owl_property: object
    domain: D3fendEntry
  accesses:
    title: accesses
    description: 'x accesses y: The subject x takes the action of reading from, writing into, or executing
      the stored information in the object y. Reads, writes, and executes are specific cases of accesses.'
    slot_uri: d3f:accesses
    is_a: associated_with
    mixins:
    - may_access
    inverse: accessed_by
    range: D3fendEntry
    multivalued: true
    inlined: false
    annotations:
      owl_property: object
      is_defined_by: http://wordnet-rdf.princeton.edu/id/02673854-n
    domain: D3fendEntry
  addressed_by:
    title: addressed-by
    description: 'x addressed-by y: Relates a resource x (e.g., network host, peripheral device, disk
      sector, a memory cell or other logical or physical entity) to a discrete address y in an address
      space that points to it.'
    slot_uri: d3f:addressed-by
    is_a: associated_with
    inverse: addresses
    range: D3fendEntry
    multivalued: true
    inlined: false
    annotations:
      owl_property: object
    domain: D3fendEntry
  addresses:
    title: addresses
    description: 'x addresses y: Relates a pointer x to a digital artifact y located in the address space
      to which x points. The address space is part of some digital store, whether it be in memory, an
      image, or a persistent storage device.'
    slot_uri: d3f:addresses
    is_a: associated_with
    inverse: addressed_by
    range: D3fendEntry
    multivalued: true
    inlined: false
    aliases:
    - points-to
    see_also:
    - http://dbpedia.org/resource/Pointer_(computer_programming)
    - http://wordnet-rdf.princeton.edu/id/02253826-v
    annotations:
      owl_property: object
    domain: D3fendEntry
  adds:
    title: adds
    description: 'x adds y: The subject x adds a data object y, such as a file, to some other digital
      artifact, such as a directory. Examples include an agent or technique adding a record to a database
      or a domain entry to a DNS server.'
    slot_uri: d3f:adds
    is_a: associated_with
    mixins:
    - may_add
    range: D3fendEntry
    multivalued: true
    inlined: false
    annotations:
      owl_property: object
  alt_label:
    title: altLabel
    description: D3FEND's property "altLabel", which the ontology does not define.
    slot_uri: skos:altLabel
    range: string
    multivalued: true
    annotations:
      owl_property: annotation
  analyzes:
    title: analyzes
    description: 'x analyzes y: The subject x breaks down object y into components or essential features,
      assessing y by quantitative methods, qualitative methods, or both. Usually the analysis is done
      in terms of some model or framework.'

id: https://w3id.org/lmodel/nist-sp-800-171-lokf
name: nist-sp-800-171
title: Protecting Controlled Unclassified Information in Nonfederal Systems and Organizations (SP 800-171
  Revision 3)
description: 'A LinkML model of NIST Special Publication 800-171 Revision 3, the security requirements
  for protecting controlled unclassified information (CUI) in nonfederal systems and organizations: its
  seventeen requirement families, each security requirement with its statement, discussion, references
  and source controls, the organization-defined parameters (ODPs) a requirement leaves to the organization,
  and the assessment objectives and methods that SP 800-171A Revision 3 gives each requirement.'
version: 3.0.0
source: https://doi.org/10.6028/NIST.SP.800-171r3
license: Apache-2.0
see_also:
- https://lmodel.github.io/nist-sp-800-171
- https://csrc.nist.gov/pubs/sp/800/171/r3/final
- https://doi.org/10.6028/NIST.SP.800-171Ar3
- https://csrc.nist.gov/projects/protecting-controlled-unclassified-information
- https://github.com/usnistgov/oscal-content/tree/v1.6.0/nist.gov/SP800-171/rev3
annotations:
  cprt_framework_version: SP_800_171_3_0_0
  publication_date: 2024-05
  oscal_content_tag: v1.6.0
  oscal_content_commit: f0de6d8d8c059d374f15e0ae07508d82e370fc1d
comments:
- The version is the revision of SP 800-171 the schema renders, written as NIST's Cybersecurity and Privacy
  Reference Tool numbers it (SP_800_171_3_0_0), and source is the publication's digital object identifier.
  The catalog NIST publishes for that revision in usnistgov/oscal-content, which carries the assessment
  procedures of SP 800-171A Revision 3 as well, is copied to src/nist_sp_800_171/schema/oscal-content/
  at the tag and commit in the annotations. scripts/check_upstream_release.py reads the same pins and
  reports when NIST publishes a newer revision or changes the catalog. The catalog's own metadata version
  (1.1.0) numbers the catalog, not the publication. The release tags are the schema's own versions.
- SP 800-171 is a work of the United States Government and is not subject to copyright in the United States.
  The descriptions here are this project's own words; NIST's text of each requirement, discussion, parameter
  and assessment procedure stays in the catalog copy.
- NIST's catalog renders each family as an OSCAL group, each security requirement as an OSCAL control
  of class requirement, each statement item, discussion, assessment objective and assessment method as
  a part, each organization-defined parameter as a parameter, and each reference and source control as
  a link to a back-matter resource. The broad_mappings name those lmodel/oscal classes.
default_prefix: nist_sp_800_171
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  nist_sp_800_171: https://w3id.org/lmodel/nist-sp-800-171/
  oscal: https://w3id.org/lmodel/oscal/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
- linkml:types
- lokf
types:
  sp800171_family_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A family''s number, as SP 800-171 Revision 3 numbers its seventeen families: 03, a dot
      and two digits from 01 to 17, such as 03.01 for Access Control.'
    pattern: ^03\.(0[1-9]|1[0-7])$
  sp800171_requirement_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A security requirement''s identifier: its family''s number, a dot and the requirement''s
      two-digit number within the family, such as 03.01.01.'
    pattern: ^03\.(0[1-9]|1[0-7])\.(0[1-9]|[1-9][0-9])$
  sp800171_item_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The identifier of a lettered item of a requirement statement, such as 03.01.01.a, or
      of a numbered item under it, such as 03.01.01.c.01.
    pattern: ^03\.(0[1-9]|1[0-7])\.(0[1-9]|[1-9][0-9])\.[a-z](\.(0[1-9]|[1-9][0-9]))?$
  sp800171_odp_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'An organization-defined parameter''s identifier, as SP 800-171A writes it: A, the requirement''s
      identifier, ODP and the parameter''s two-digit number in square brackets, such as A.03.01.01.ODP[01].'
    pattern: ^A\.03\.(0[1-9]|1[0-7])\.(0[1-9]|[1-9][0-9])\.ODP\[(0[1-9]|[1-9][0-9])\]$
  sp800171_objective_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'An assessment objective''s identifier, as SP 800-171A writes it: A and the identifier
      of the requirement or statement item it assesses, such as A.03.01.01.e, with a two-digit number
      in square brackets when that item has several objectives, such as A.03.01.01.b[01]. NIST''s catalog
      writes the bracketed number as a dotted one, A.03.01.01.b.01.'
    pattern: ^A\.03\.(0[1-9]|1[0-7])\.(0[1-9]|[1-9][0-9])(\.[a-z](\.(0[1-9]|[1-9][0-9]))?)?(\[(0[1-9]|[1-9][0-9])\])?$
  sp800171_source_control_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'The identifier of a control of SP 800-53 Revision 5 as NIST''s catalog of SP 800-171
      writes it: the family''s two letters, a hyphen and the control''s two-digit number, with a two-digit
      enhancement number in parentheses where it is one, such as AC-02 and AC-02(03).'
    pattern: ^[A-Z]{2}-(0[1-9]|[1-9][0-9])(\((0[1-9]|[1-9][0-9])\))?$
  sp800171_cited_publication_name:
    typeof: string
    base: str
    uri: xsd:string
    description: 'The short name SP 800-171 gives a publication it references: the series (SP, FIPS or
      IR) and the publication''s number, with the number of a part or volume where the publication has
      one, such as SP 800-57-1, SP 800-160-1, IR 8011-2 or FIPS 140-3. The short name leaves out the publication''s
      revision, which the citation and the address carry: SP 800-53 stands for Revision 5.'
    pattern: ^(FIPS|IR|SP) [1-9][0-9]*(-[0-9A-Z]+)*$
slots:
  family_number:
    description: The family's number, such as 03.01.
    range: sp800171_family_identifier
    required: true
    comments:
    - 'A slot of its own, listed first in Sp800171Family''s slots, rather than an attribute, so that the
      generated Python dataclasses key a list of families by their number and not by their title: they
      key an inlined list by the first required slot of the class, and a class lists its slots before
      its attributes. The adapt copy roots the family on LOKF''s Concept, whose id is its identifier,
      so the number cannot be marked as one.'
classes:
  Sp800171Publication:
    class_uri: nist_sp_800_171:Publication
    description: 'One revision of SP 800-171 as a whole: its requirement families, each holding its security
      requirements, with the assessment procedures of the matching revision of SP 800-171A inside each
      requirement.'
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/171/r3/final
    broad_mappings:
    - oscal:Catalog
    attributes:
      sp800171_revision:
        description: The revision of SP 800-171 the document renders, as NIST numbers it, such as 3.
        required: true
        pattern: ^[1-9][0-9]*$
      requirement_families:
        description: The requirement families, in the order SP 800-171 gives them.
        range: Sp800171Family
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
  Sp800171Family:
    class_uri: nist_sp_800_171:Family
    description: One of the seventeen families that SP 800-171 Revision 3 sorts its security requirements
      into, such as Access Control (03.01) or Supply Chain Risk Management (03.17).
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/171/r3/final
    broad_mappings:
    - oscal:Group
    slots:
    - family_number
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        range: string
    attributes:
      family_requirements:
        description: The security requirements of the family, the withdrawn ones included, in the order
          SP 800-171 numbers them. A knowledge bundle relates a requirement to its family with isPartOf
          instead.
        range: Sp800171Requirement
        multivalued: true
        inlined: true
        inlined_as_list: true
    is_a: Concept
  Sp800171Requirement:
    class_uri: nist_sp_800_171:Requirement
    description: 'A security requirement of SP 800-171: a numbered, named requirement for protecting CUI,
      with its statement, discussion, references and source controls, the organization-defined parameters
      its statement leaves open, and the assessment objectives and methods SP 800-171A gives it. A requirement
      that Revision 3 withdrew keeps its number and says which requirements took its place.'
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/171/r3/final
    broad_mappings:
    - oscal:Control
    slots:
    - title
    - description
    attributes:
      requirement_id:
        description: The requirement's identifier, such as 03.01.01.
        range: sp800171_requirement_identifier
        required: true
      requirement_status:
        description: Withdrawn when Revision 3 withdrew the requirement. A requirement with no status
          is in force.
        range: Sp800171RequirementStatus
      incorporated_into_requirements:
        description: For a withdrawn requirement, the requirements of Revision 3 that incorporate what
          it required, as the catalog states them.
        range: sp800171_requirement_identifier
        multivalued: true
      addressed_by_requirements:
        description: For a withdrawn requirement, the requirements of Revision 3 that address what it
          required, as the catalog states them.
        range: sp800171_requirement_identifier
        multivalued: true
      requirement_statement:
        description: The requirement statement when SP 800-171 writes it as one piece of text and not
          as lettered items. The catalog marks an organization-defined parameter in the text with an insert
          placeholder that names the parameter.
        pattern: ^\s*\S
      requirement_items:
        description: The lettered items of the requirement statement, in order, each with its numbered
          items where it has them. A requirement has either these or a statement, never both.
        range: Sp800171RequirementItem
        multivalued: true
        inlined: true
        inlined_as_list: true
      requirement_discussion:
        description: 'The requirement''s discussion: SP 800-171''s explanation of what the requirement
          means and how it relates to other requirements.'
        pattern: ^\s*\S
      requirement_parameters:
        description: The organization-defined parameters the requirement statement leaves to the organization,
          in the order SP 800-171A numbers them.
        range: Sp800171Parameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      requirement_objectives:
        description: 'The assessment objectives SP 800-171A gives the requirement: the determination statements
          an assessor checks.'
        range: Sp800171AssessmentObjective
        multivalued: true
        inlined: true
        inlined_as_list: true
      requirement_methods:
        description: The assessment methods SP 800-171A gives the requirement, each with the objects it
          is applied to.
        range: Sp800171AssessmentMethod
        multivalued: true
        inlined: true
        inlined_as_list: true
      requirement_references:
        description: The publications SP 800-171 lists under the requirement's references, each with its
          citation and address as the catalog gives them.
        range: Sp800171Reference
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_controls:
        description: The controls of SP 800-53 Revision 5 the requirement is drawn from, by their identifiers,
          as the catalog lists them among the requirement's references. The identifier is data; the schema
          maps nothing to a model of SP 800-53.
        range: sp800171_source_control_identifier
        multivalued: true
    slot_usage:
      title:
        range: string
      description:
        range: string
    is_a: Concept
  Sp800171RequirementItem:
    class_uri: nist_sp_800_171:RequirementItem
    description: 'One item of a requirement statement: a lettered item such as 03.01.01.a, or a numbered
      item under a lettered one such as 03.01.01.c.01.'
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/171/r3/final
    broad_mappings:
    - oscal:Part
    attributes:
      requirement_item_id:
        description: The item's identifier, such as 03.01.01.a.
        range: sp800171_item_identifier
        required: true
      requirement_item_text:
        description: What the item requires. The catalog marks an organization-defined parameter in the
          text with an insert placeholder that names the parameter.
        required: true
        pattern: ^\s*\S
      requirement_subitems:
        description: The numbered items under a lettered item, in order.
        range: Sp800171RequirementItem
        multivalued: true
        inlined: true
        inlined_as_list: true
  Sp800171Parameter:
    class_uri: nist_sp_800_171:Parameter
    description: 'An organization-defined parameter (ODP): a value, such as a time period or a frequency,
      that a requirement statement leaves to the organization, with the guideline SP 800-171A gives for
      defining it. A few parameters are a selection among choices instead of a value.'
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-171Ar3
    broad_mappings:
    - oscal:Parameter
    attributes:
      odp_id:
        description: The parameter's identifier, such as A.03.01.01.ODP[01].
        range: sp800171_odp_identifier
        required: true
      odp_label:
        description: What kind of value the parameter takes, such as time period or frequency, or SELECTED
          PARAMETER VALUES for a selection.
        required: true
        pattern: ^\s*\S
      odp_usage:
        description: How the requirement statement names the parameter, such as organization-defined time
          period.
      odp_guideline:
        description: 'The determination SP 800-171A gives for the parameter: what the organization must
          have defined, such as the time period for account inactivity before disabling is defined.'
      odp_choices:
        description: For a selection, the choices SP 800-171 offers, in its order. A choice may itself
          carry an insert placeholder naming another parameter.
        multivalued: true
      odp_selection_count:
        description: How many of the choices a selection takes.
        range: Sp800171SelectionCount
    is_a: Concept
  Sp800171AssessmentObjective:
    class_uri: nist_sp_800_171:AssessmentObjective
    description: 'An assessment objective of SP 800-171A: one determination statement that an assessor
      checks, tied to the requirement or to one item of its statement.'
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-171Ar3
    broad_mappings:
    - oscal:Part
    attributes:
      requirement_objective_id:
        description: The objective's identifier, such as A.03.01.01.b[01].
        range: sp800171_objective_identifier
        required: true
      requirement_determination:
        description: 'The determination statement: what the assessor determines is the case, such as system
          accounts are created in accordance with organizational policy, procedures, prerequisites, and
          criteria.'
        required: true
        pattern: ^\s*\S
      assessed_requirement_item:
        description: The statement item the objective assesses, such as 03.01.01.b. Absent when the objective
          assesses a requirement whose statement is one piece of text.
        range: sp800171_item_identifier
  Sp800171AssessmentMethod:
    class_uri: nist_sp_800_171:AssessmentMethod
    description: One of the three assessment methods SP 800-171A applies to a requirement, examine, interview
      or test, with the assessment objects (documents, people, processes or mechanisms) it is applied
      to.
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-171Ar3
    broad_mappings:
    - oscal:Part
    attributes:
      requirement_method_kind:
        description: Which method it is.
        range: Sp800171AssessmentMethodKind
        required: true
      requirement_method_objects:
        description: The assessment objects, one entry each, in the order SP 800-171A lists them, such
          as access control policy and procedures or system administrators.
        required: true
        multivalued: true
        minimum_cardinality: 1
        pattern: ^\s*\S
  Sp800171Reference:
    class_uri: nist_sp_800_171:Reference
    description: A publication that SP 800-171 lists under a requirement's references, by the short name
      the publication gives it, with the full citation and the address NIST's catalog gives it.
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/171/r3/final
    broad_mappings:
    - oscal:Resource
    attributes:
      cited_publication:
        description: The publication's short name, such as SP 800-63-3.
        range: sp800171_cited_publication_name
        required: true
      cited_publication_citation:
        description: The full citation, as the catalog's back matter gives it.
        required: true
      cited_publication_url:
        description: The publication's address, which the catalog gives as its digital object identifier
          at doi.org.
        range: uri
        required: true
        pattern: ^https://doi\.org/10\.[0-9]+/\S+$
enums:
  Sp800171RequirementStatus:
    description: The one status SP 800-171 Revision 3 states for a requirement. A requirement in force
      carries none.
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/171/r3/final
    permissible_values:
      withdrawn:
        description: Revision 3 withdrew the requirement; other requirements incorporate or address what
          it required, or nothing does.
  Sp800171AssessmentMethodKind:
    description: The three assessment methods of SP 800-171A.
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-171Ar3
    permissible_values:
      examine:
        description: Reviewing, inspecting, observing, studying or analysing assessment objects such as
          policies, plans, records and configurations.
      interview:
        description: Holding discussions with people such as administrators and personnel with security
          responsibilities.
      test:
        description: Exercising mechanisms or processes under specified conditions and comparing the result
          with what is expected.
  Sp800171SelectionCount:
    description: How many choices a selection parameter takes, as OSCAL states it.
    permissible_values:
      one:
        description: Exactly one of the choices.
      one_or_more:
        description: One or more of the choices.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: Sp800171Family, Sp800171Requirement, Sp800171Parameter;
  folded into LOKF''s: title -> title, description -> description.'

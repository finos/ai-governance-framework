    - sender
    - sentTime
    - subject
    - uco_to
    - xMailer
    - xOriginatingIP
  EmbeddedDevice:
    is_a: Device
    class_uri: uco-observable:EmbeddedDevice
    description: An embedded device is a highly specialized microprocessor device meant for one or very
      few specific purposes and is usually embedded or included within another object or as part of a
      larger system. Examples include answer machine, door access logger, card scanner, etc.
  EncodedStreamFacet:
    is_a: Facet
    class_uri: uco-observable:EncodedStreamFacet
    description: An encoded stream facet is a grouping of characteristics unique to the conversion of
      a body of data content from one form to another form.
    slots:
    - encodingMethod
  EncryptedStreamFacet:
    is_a: Facet
    class_uri: uco-observable:EncryptedStreamFacet
    description: An encrypted stream facet is a grouping of characteristics unique to the conversion of
      a body of data content from one form to another obfuscated form in such a way that reversing the
      conversion to obtain the original data form can only be accomplished through possession and use
      of a specific key.
    slots:
    - encryptionIV
    - encryptionKey
    - encryptionMethod
    - encryptionMode
  EnvironmentVariable:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:EnvironmentVariable
    description: An environment variable is a grouping of characteristics unique to a dynamic-named value
      that can affect the way running processes will behave on a computer. [based on https://en.wikipedia.org/wiki/Environment_variable]
    slots:
    - uco_name
    - observable_value
  EventLog:
    is_a: ObservableObject
    class_uri: uco-observable:EventLog
    description: An event log is a collection of event records.
  EventRecord:
    is_a: ObservableObject
    class_uri: uco-observable:EventRecord
    description: An event record is something that happens in a digital context (e.g., operating system
      events).
  EventRecordFacet:
    is_a: Facet
    class_uri: uco-observable:EventRecordFacet
    description: An event record facet is a grouping of characteristics unique to something that happens
      in a digital context (e.g., operating system events).
    slots:
    - account
    - application
    - cyberAction
    - eventID
    - eventRecordDevice
    - eventRecordID
    - eventRecordRaw
    - eventRecordServiceName
    - eventRecordText
    - observableCreatedTime
    - observable_endTime
    - observable_eventType
    - observable_startTime
  ExtInodeFacet:
    is_a: Facet
    class_uri: uco-observable:ExtInodeFacet
    description: An extInode facet is a grouping of characteristics unique to a file system object (file,
      directory, etc.) conformant to the extended file system (EXT or related derivations) specification.
    slots:
    - extDeletionTime
    - extFileType
    - extFlags
    - extHardLinkCount
    - extInodeChangeTime
    - extInodeID
    - extPermissions
    - extSGID
    - extSUID
  ExtractedString:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:ExtractedString
    description: An extracted string is a grouping of characteristics unique to a series of characters
      pulled from an observable object.
    slots:
    - byteStringValue
    - encoding
    - englishTranslation
    - language
    - length
    - stringValue
  ExtractedStringsFacet:
    is_a: Facet
    class_uri: uco-observable:ExtractedStringsFacet
    description: An extracted strings facet is a grouping of characteristics unique to one or more sequences
      of characters pulled from an observable object.
    slots:
    - strings
  File:
    is_a: FileSystemObject
    class_uri: uco-observable:File
    description: A file is a computer resource for recording data discretely on a computer storage device.
    disjoint_with:
    - URL
  FileFacet:
    is_a: Facet
    class_uri: uco-observable:FileFacet
    description: A file facet is a grouping of characteristics unique to the storage of a file (computer
      resource for recording data discretely in a computer storage device) on a file system (process that
      manages how and where data on a storage device is stored, accessed and managed). [based on https://en.wikipedia.org/Computer_file
      and https://www.techopedia.com/definition/5510/file-system]
    slots:
    - accessedTime
    - allocationStatus
    - extension
    - fileName
    - filePath
    - isDirectory
    - metadataChangeTime
    - observableCreatedTime
    - observable_modifiedTime
    - sizeInBytes
  FilePermissionsFacet:
    is_a: Facet
    class_uri: uco-observable:FilePermissionsFacet
    description: A file permissions facet is a grouping of characteristics unique to the access rights
      (e.g., view, change, navigate, execute) of a file on a file system.
    slots:
    - owner
  FileSystem:
    is_a: ObservableObject
    class_uri: uco-observable:FileSystem
    description: A file system is the process that manages how and where data on a storage medium is stored,
      accessed and managed. [based on https://www.techopedia.com/definition/5510/file-system]
  FileSystemFacet:
    is_a: Facet
    class_uri: uco-observable:FileSystemFacet
    description: A file system facet is a grouping of characteristics unique to the process that manages
      how and where data on a storage medium is stored, accessed and managed. [based on https://www.techopedia.com/definition/5510/file-system]
    slots:
    - clusterSize
    - fileSystemType
  FileSystemObject:
    is_a: ObservableObject
    class_uri: uco-observable:FileSystemObject
    description: A file system object is an informational object represented and managed within a file
      system.
  ForumPost:
    is_a: Message
    class_uri: uco-observable:ForumPost
    description: A forum post is message submitted by a user account to an online forum where the message
      content (and typically metadata including who posted it and when) is viewable by any party with
      viewing permissions on the forum.
  ForumPrivateMessage:
    is_a: Message
    class_uri: uco-observable:ForumPrivateMessage
    description: A forum private message (aka PM or DM (direct message)) is a one-to-one message from
      one specific user account to another specific user account on an online form where transmission
      is managed by the online forum platform and the message is only viewable by the parties directly
      involved.
  FragmentFacet:
    is_a: Facet
    class_uri: uco-observable:FragmentFacet
    description: A fragment facet is a grouping of characteristics unique to an individual piece of the
      content of a file.
    slots:
    - fragmentIndex
    - totalFragments
  GUI:
    is_a: ObservableObject
    class_uri: uco-observable:GUI
    description: A GUI is a graphical user interface that allows users to interact with electronic devices
      through graphical icons and audio indicators such as primary notation, instead of text-based user
      interfaces, typed command labels or text navigation. [based on https://en.wikipedia.org/wiki/Graphical_user_interface]
  GamingConsole:
    is_a: Device
    class_uri: uco-observable:GamingConsole
    description: A gaming console (video game console or game console) is an electronic system that connects
      to a display, typically a TV or computer monitor, for the primary purpose of playing video games.
  GenericObservableObject:
    is_a: ObservableObject
    class_uri: uco-observable:GenericObservableObject
    description: A generic observable object is an article or unit within the digital domain.
  GeoLocationEntry:
    is_a: ObservableObject
    class_uri: uco-observable:GeoLocationEntry
    description: A geolocation entry is a single application-specific geolocation entry.
  GeoLocationEntryFacet:
    is_a: Facet
    class_uri: uco-observable:GeoLocationEntryFacet
    description: A geolocation entry facet is a grouping of characteristics unique to a single application-specific
      geolocation entry.
    slots:
    - application
    - observableCreatedTime
    - observable_location
  GeoLocationLog:
    is_a: ObservableObject
    class_uri: uco-observable:GeoLocationLog
    description: A geolocation log is a record containing geolocation tracks and/or geolocation entries.
  GeoLocationLogFacet:
    is_a: Facet
    class_uri: uco-observable:GeoLocationLogFacet
    description: A geolocation log facet is a grouping of characteristics unique to a record containing
      geolocation tracks and/or geolocation entries.
    slots:
    - application
    - observableCreatedTime
  GeoLocationTrack:
    is_a: ObservableObject
    class_uri: uco-observable:GeoLocationTrack
    description: A geolocation track is a set of contiguous geolocation entries representing a path/track
      taken.
  GeoLocationTrackFacet:
    is_a: Facet
    class_uri: uco-observable:GeoLocationTrackFacet
    description: A geolocation track facet is a grouping of characteristics unique to a set of contiguous
      geolocation entries representing a path/track taken.
    slots:
    - application
    - geoLocationEntry
    - observable_endTime
    - observable_startTime
  GlobalFlagType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:GlobalFlagType
    description: 'A global flag type is a grouping of characteristics unique to the Windows systemwide
      global variable named NtGlobalFlag that enables various internal debugging, tracing, and validation
      support in the operating system. [based on "Windows Global Flags, Chapter 3: System Mechanisms of
      Windows Internals by Solomon, Russinovich, and Ionescu]'
    slots:
    - uco_abbreviation
    - destination
    - hexadecimalValue
    - symbolicName
  HTTPConnection:
    is_a: NetworkConnection
    class_uri: uco-observable:HTTPConnection
    description: An HTTP connection is network connection that is conformant to the Hypertext Transfer
      Protocol (HTTP) standard.
  HTTPConnectionFacet:
    is_a: Facet
    class_uri: uco-observable:HTTPConnectionFacet
    description: An HTTP connection facet is a grouping of characteristics unique to portions of a network
      connection that are conformant to the Hypertext Transfer Protocol (HTTP) standard.
    slots:
    - httpMesageBodyLength
    - httpMessageBodyData
    - httpRequestHeader
    - requestMethod
    - requestValue
    - requestVersion
  Hostname:
    is_a: ObservableObject
    class_uri: uco-observable:Hostname
    description: A hostname is a label that is assigned to a device connected to a computer network and
      that is used to identify the device in various forms of electronic communication, such as the World
      Wide Web. A hostname may be a domain name, if it is properly organized into the domain name system.
      A domain name may be a hostname if it has been assigned to an Internet host and associated with
      the host's IP address. [based on https://en.wikipedia.org/wiki/Hostname]
  ICMPConnection:
    is_a: NetworkConnection
    class_uri: uco-observable:ICMPConnection
    description: An ICMP connection is a network connection that is conformant to the Internet Control
      Message Protocol (ICMP) standard.
  ICMPConnectionFacet:
    is_a: Facet
    class_uri: uco-observable:ICMPConnectionFacet
    description: An ICMP connection facet is a grouping of characteristics unique to portions of a network
      connection that are conformant to the Internet Control Message Protocol (ICMP) standard.
    slots:
    - icmpCode
    - icmpType
  IComHandlerActionType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:IComHandlerActionType
    description: An IComHandler action type is a grouping of characteristics unique to a Windows Task-related
      action that fires a Windows COM handler (smart code in the client address space that can optimize
      calls between a client and server). [based on https://docs.microsoft.com/en-us/windows/win32/taskschd/comhandleraction]
    slots:
    - comClassID
    - comData
  IExecActionType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:IExecActionType
    description: An IExec action type is a grouping of characteristics unique to an action that executes
      a command-line operation on a Windows operating system. [based on https://docs.microsoft.com/en-us/windows/win32/api/taskschd/nn-taskschd-iexecaction?redirectedfrom=MSDN]
    slots:
    - execArguments
    - execProgramHashes
    - execProgramPath
    - execWorkingDirectory
  IPAddress:
    is_a: DigitalAddress
    class_uri: uco-observable:IPAddress
    description: An IP address is an Internet Protocol (IP) standards conformant identifier assigned to
      a device to enable routing and management of IP standards conformant communication to or from that
      device.
  IPAddressFacet:
    is_a: DigitalAddressFacet
    class_uri: uco-observable:IPAddressFacet
    description: An IP address facet is a grouping of characteristics unique to an Internet Protocol (IP)
      standards conformant identifier assigned to a device to enable routing and management of IP standards
      conformant communication to or from that device.
  IPNetmask:
    is_a: ObservableObject
    class_uri: uco-observable:IPNetmask
    description: An IP netmask is a 32-bit 'mask' used to divide an IP address into subnets and specify
      the network's available hosts.
  IPhone:
    is_a: SmartPhone
    mixins:
    - AppleDevice
    class_uri: uco-observable:IPhone
    description: An iPhone is a smart phone that applies the iOS mobile operating system.
  IPv4Address:
    is_a: IPAddress
    class_uri: uco-observable:IPv4Address
    description: An IPv4 (Internet Protocol version 4) address is an IPv4 standards conformant identifier
      assigned to a device to enable routing and management of IPv4 standards conformant communication
      to or from that device.
  IPv4AddressFacet:
    is_a: IPAddressFacet
    class_uri: uco-observable:IPv4AddressFacet
    description: An IPv4 (Internet Protocol version 4) address facet is a grouping of characteristics
      unique to an IPv4 standards conformant identifier assigned to a device to enable routing and management
      of IPv4 standards conformant communication to or from that device.
  IPv6Address:
    is_a: IPAddress
    class_uri: uco-observable:IPv6Address
    description: An IPv6 (Internet Protocol version 6) address is an IPv6 standards conformant identifier
      assigned to a device to enable routing and management of IPv6 standards conformant communication
      to or from that device.
  IPv6AddressFacet:
    is_a: IPAddressFacet
    class_uri: uco-observable:IPv6AddressFacet
    description: An IPv6 (Internet Protocol version 6) address facet is a grouping of characteristics
      unique to an IPv6 standards conformant identifier assigned to a device to enable routing and management
      of IPv6 standards conformant communication to or from that device.
  IShowMessageActionType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:IShowMessageActionType
    description: An IShow message action type is a grouping of characteristics unique to an action that
      shows a message box when a task is activate. [based on https://docs.microsoft.com/en-us/windows/win32/api/taskschd/nn-taskschd-ishowmessageaction?redirectedfrom=MSDN]
    slots:
    - showMessageBody
    - showMessageTitle
  Image:
    is_a: ObservableObject
    class_uri: uco-observable:Image
    description: An image is a complete copy of a hard disk, memory, or other digital media.
  ImageFacet:
    is_a: Facet
    class_uri: uco-observable:ImageFacet
    description: An image facet is a grouping of characteristics unique to a complete copy of a hard disk,
      memory, or other digital media.
    slots:
    - imageType
  InstantMessagingAddress:
    is_a: DigitalAddress
    class_uri: uco-observable:InstantMessagingAddress
    description: UCO 1.5.0 declares the class uco-observable:InstantMessagingAddress without a definition.
  InstantMessagingAddressFacet:
    is_a: DigitalAddressFacet
    class_uri: uco-observable:InstantMessagingAddressFacet
    description: An instant messaging address facet is a grouping of characteristics unique to an identifier
      assigned to enable routing and management of instant messaging digital communication.
  Junction:
    is_a: FileSystemObject
    class_uri: uco-observable:Junction
    description: A junction is a specific NTFS (New Technology File System) reparse point to redirect
      a directory access to another directory which can be on the same volume or another volume. A junction
      is similar to a directory symbolic link but may differ on whether they are processed on the local
      system or on the remote file server. [based on https://jp-andre.pagesperso-orange.fr/junctions.html]
  Laptop:
    is_a: Computer
    class_uri: uco-observable:Laptop
    description: A laptop, laptop computer, or notebook computer is a small, portable personal computer
      with a screen and alphanumeric keyboard. These typically have a clam shell form factor with the
      screen mounted on the inside of the upper lid and the keyboard on the inside of the lower lid, although
      2-in-1 PCs with a detachable keyboard are often marketed as laptops or as having a laptop mode.
      (Devices categorized by their manufacturer as a Laptop)
  Library:
    is_a: ObservableObject
    class_uri: uco-observable:Library
    description: A library is a suite of data and programming code that is used to develop software programs
      and applications. [based on https://www.techopedia.com/definition/3828/software-library]
  LibraryFacet:
    is_a: Facet
    class_uri: uco-observable:LibraryFacet
    description: A library facet is a grouping of characteristics unique to a suite of data and programming
      code that is used to develop software programs and applications. [based on https://www.techopedia.com/definition/3828/software-library]
    slots:
    - libraryType
  MACAddress:
    is_a: DigitalAddress
    class_uri: uco-observable:MACAddress
    description: A MAC address is a media access control standards conformant identifier assigned to a
      network interface to enable routing and management of communications at the data link layer of a
      network segment.
  MACAddressFacet:
    is_a: DigitalAddressFacet
    class_uri: uco-observable:MACAddressFacet
    description: A MAC address facet is a grouping of characteristics unique to a media access control
      standards conformant identifier assigned to a network interface to enable routing and management
      of communications at the data link layer of a network segment.
  Memory:
    is_a: ObservableObject
    class_uri: uco-observable:Memory
    description: Memory is a particular region of temporary information storage (e.g., RAM (random access
      memory), ROM (read only memory)) on a digital device.
  MemoryFacet:
    is_a: Facet
    class_uri: uco-observable:MemoryFacet
    description: A memory facet is a grouping of characteristics unique to a particular region of temporary
      information storage (e.g., RAM (random access memory), ROM (read only memory)) on a digital device.
    slots:
    - blockType
    - isInjected
    - isMapped
    - isProtected
    - isVolatile
    - regionEndAddress
    - regionSize
    - regionStartAddress
  Message:
    is_a: ObservableObject
    class_uri: uco-observable:Message
    description: A message is a discrete unit of electronic communication intended by the source for consumption
      by some recipient or group of recipients. [based on https://en.wikipedia.org/wiki/Message]
  MessageFacet:
    is_a: Facet
    class_uri: uco-observable:MessageFacet
    description: A message facet is a grouping of characteristics unique to a discrete unit of electronic
      communication intended by the source for consumption by some recipient or group of recipients. [based
      on https://en.wikipedia.org/wiki/Message]
    slots:
    - application
    - uco_from
    - messageID
    - messageText
    - messageType
    - sentTime
    - sessionID
    - uco_to
  MessageThread:
    is_a: ObservableObject
    class_uri: uco-observable:MessageThread
    description: A message thread is a running commentary of electronic messages pertaining to one topic
      or question.
  MessageThreadFacet:
    is_a: Facet
    class_uri: uco-observable:MessageThreadFacet
    description: A message thread facet is a grouping of characteristics unique to a running commentary
      of electronic messages pertaining to one topic or question.
    slots:
    - messageThread
    - observable_participant
    - visibility
  MftRecordFacet:
    is_a: Facet
    class_uri: uco-observable:MftRecordFacet
    description: An MFT record facet is a grouping of characteristics unique to the details of a single
      file as managed in an NTFS (new technology filesystem) master file table (which is a collection
      of information about all files on an NTFS filesystem). [based on https://docs.microsoft.com/en-us/windows/win32/devnotes/master-file-table]

  StorageMediumFacet:
    is_a: Facet
    class_uri: uco-observable:StorageMediumFacet
    description: A storage medium facet is a grouping of characteristics unique to a the storage capabilities
      of a piece of equipment or a mechanism designed to serve a special purpose or perform a special

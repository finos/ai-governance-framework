  SoftwareFacet:
    is_a: Facet
    class_uri: uco-observable:SoftwareFacet
    description: A software facet is a grouping of characteristics unique to a software program (a definitively
      scoped instance of a collection of data or computer instructions that tell the computer how to work).
      [based on https://en.wikipedia.org/wiki/Software]
    slots:
    - language
    - manufacturer
    - observable_cpeid
    - observable_swid
    - observable_version
  StateChangeEffectFacet:
    is_a: DefinedEffectFacet
    class_uri: uco-observable:StateChangeEffectFacet
    description: A state change effect facet is a grouping of characteristics unique to the effects of
      actions upon observable objects where a state of the observable object is changed.
    slots:
    - newObject
    - oldObject
  StorageMedium:
    is_a: Device

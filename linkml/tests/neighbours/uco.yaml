      to provide a specific security function to protect computer networks.
  Semaphore:
    is_a: ObservableObject
    class_uri: uco-observable:Semaphore
    description: A semaphore is a variable or abstract data type used to control access to a common resource
      by multiple processes and avoid critical section problems in a concurrent system such as a multitasking
      operating system. [based on https://en.wikipedia.org/wiki/Semaphore_(programming)]
  SendControlCodeEffectFacet:
    is_a: DefinedEffectFacet
    class_uri: uco-observable:SendControlCodeEffectFacet
    description: A send control code effect facet is a grouping of characteristics unique to the effects
      of actions upon observable objects where a control code, or other control-oriented communication
      signal, is sent to the observable object. An example of this would be an action sending a control
      code changing the running state of a process.
    slots:
    - controlCode
  Server:
    is_a: Computer
    class_uri: uco-observable:Server
    description: A server is a server rack-mount based computer, minicomputer, supercomputer, etc.
  ShopListing:
    is_a: ObservableObject
    class_uri: uco-observable:ShopListing
    description: A shop listing is a listing of offered products on an online marketplace/shop.
  SmartDevice:
    is_a: Device
    class_uri: uco-observable:SmartDevice

    - mftFileID
    - mftFileNameAccessedTime
    - mftFileNameCreatedTime
    - mftFileNameLength
    - mftFileNameModifiedTime
    - mftFileNameRecordChangeTime
    - mftFlags
    - mftParentID
    - mftRecordChangeTime
    - ntfsHardLinkCount
    - ntfsOwnerID
    - ntfsOwnerSID
  MimePartType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:MimePartType
    description: A mime part type is a grouping of characteristics unique to a component of a multi-part
      email body.
    slots:
    - uco_body
    - bodyRaw
    - contentDisposition
    - contentType
  MobileAccount:
    is_a: DigitalAccount
    class_uri: uco-observable:MobileAccount
    description: A mobile account is an arrangement with an entity to enable and control the provision
      of some capability or service on a portable computing device. [based on https://www.lexico.com/definition/mobile_device]
  MobileAccountFacet:
    is_a: Facet
    class_uri: uco-observable:MobileAccountFacet
    description: A mobile account facet is a grouping of characteristics unique to an arrangement with
      an entity to enable and control the provision of some capability or service on a portable computing
      device. [based on https://www.lexico.com/definition/mobile_device]
    slots:
    - IMSI
    - MSISDN
    - MSISDNType
  MobileDevice:
    is_a: Device
    class_uri: uco-observable:MobileDevice
    description: A mobile device is a portable computing device. [based on https://www.lexico.com.definition/mobile_device]
  MobileDeviceFacet:
    is_a: Facet
    class_uri: uco-observable:MobileDeviceFacet
    description: A mobile device facet is a grouping of characteristics unique to a portable computing
      device. [based on https://www.lexico.com/definition/mobile_device]
    slots:
    - ESN
    - IMEI
    - bluetoothDeviceName
    - clockSetting
    - keypadUnlockCode
    - mockLocationsAllowed
    - network
    - phoneActivationTime
    - storageCapacityInBytes
  MobilePhone:
    is_a: MobileDevice
    class_uri: uco-observable:MobilePhone
    description: A mobile phone is a portable telephone that at least can make and receive calls over
      a radio frequency link while the user is moving within a telephone service area. This category encompasses
      all types of mobiles, simple and smart and satellite ones all together.
  Mutex:
    is_a: ObservableObject
    class_uri: uco-observable:Mutex
    description: A mutex is a mechanism that enforces limits on access to a resource when there are many
      threads of execution. A mutex is designed to enforce a mutual exclusion concurrency control policy,
      and with a variety of possible methods there exists multiple unique implementations for different
      applications. [based on https://en.wikipedia.org/wiki/Lock_(computer_science)]
  MutexFacet:
    is_a: Facet
    class_uri: uco-observable:MutexFacet
    description: A mutex facet is a grouping of characteristics unique to a mechanism that enforces limits
      on access to a resource when there are many threads of execution. A mutex is designed to enforce
      a mutual exclusion concurrency control policy, and with a variety of possible methods there exists
      multiple unique implementations for different applications. [based on https://en.wikipedia.org/wiki/Lock_(computer_science)]
    slots:
    - isNamed
    - mutexName
  NTFSFile:
    is_a: File
    class_uri: uco-observable:NTFSFile
    description: An NTFS file is a New Technology File System (NTFS) file.
  NTFSFileFacet:
    is_a: Facet
    class_uri: uco-observable:NTFSFileFacet

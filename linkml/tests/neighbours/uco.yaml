  BrowserBookmarkFacet:
    is_a: Facet
    class_uri: uco-observable:BrowserBookmarkFacet
    description: A browser bookmark facet is a grouping of characteristics unique to a saved shortcut
      that directs a WWW (World Wide Web) browser software program to a particular WWW accessible resource.
      [based on https://techterms.com/definition/bookmark]

    permissible_values:
      Draft: {}
      Final: {}
      Deprecated: {}
  AccountTypeVocab:
    enum_uri: uco-vocabulary:AccountTypeVocab
    title: Account Type Vocabulary
    description: UCO 1.5.0 declares the vocabulary uco-vocabulary:AccountTypeVocab without a definition.
    permissible_values:
      ldap: {}
      nis: {}
      openid: {}
      radius: {}
      tacacs: {}
      unix: {}
      windows_domain: {}

  BotConfiguration:
    is_a: ObservableObject
    class_uri: uco-observable:BotConfiguration
    description: A bot configuration is a set of contextual settings for a software application that runs
      automated tasks (scripts) over the Internet at a much higher rate than would be possible for a human

  AutonomousSystem:
    is_a: ObservableObject
    class_uri: uco-observable:AutonomousSystem
    description: An autonomous system is a collection of connected Internet Protocol (IP) routing prefixes
      under the control of one or more network operators on behalf of a single administrative entity or
      domain that presents a common, clearly defined routing policy to the Internet. [based on https://en.wikipedia.org/wiki/Autonomous_system_(Internet)]
  AutonomousSystemFacet:
    is_a: Facet
    class_uri: uco-observable:AutonomousSystemFacet
    description: An autonomous system facet is a grouping of characteristics unique to a collection of
      connected Internet Protocol (IP) routing prefixes under the control of one or more network operators

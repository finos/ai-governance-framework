  Socket:
    is_a: FileSystemObject
    class_uri: uco-observable:Socket
    description: A socket is a special file used for inter-process communication, which enables communication
      between two processes. In addition to sending data, processes can send file descriptors across a
      Unix domain socket connection using the sendmsg() and recvmsg() system calls. Unlike named pipes
      which allow only unidirectional data flow, sockets are fully duplex-capable. [based on https://en.wikipedia.org/wiki/Unix_file_types]
  SocketAddress:
    is_a: Address
    class_uri: uco-observable:SocketAddress
    description: A socket address (combining and IP address and a port number) is a composite identifier
      for a network socket endpoint supporting internet protocol communications.
  Software:
    is_a: ObservableObject
    class_uri: uco-observable:Software
    description: Software is a definitely scoped instance of a collection of data or computer instructions

  BlackberryPhone:
    is_a: SmartPhone
    class_uri: uco-observable:BlackberryPhone
    description: A blackberry phone is a smart phone that applies the Blackberry OS mobile operating system.
      (Blackberry 10 re-introduces Blackberry OS, prior to that the OS was Android.)
  BlockDeviceNode:
    is_a: FileSystemObject
    class_uri: uco-observable:BlockDeviceNode
    description: A block device node is a UNIX filesystem special file that serves as a conduit to communicate
      with devices, providing buffered randomly accesible input and output. Block device nodes are used

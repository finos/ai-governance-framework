    - observable_modifiedTime
    - owner
  Adaptor:
    is_a: Device
    class_uri: uco-observable:Adaptor
    description: An adaptor is a device that physically converts the pin outputs but does not alter the
      underlying protocol (e.g. uSD to SD, CF to ATA, etc.)
  Address:
    is_a: ObservableObject
    class_uri: uco-observable:Address
    description: An address is an identifier assigned to enable routing and management of information.
  AlternateDataStream:
    is_a: ObservableObject
    class_uri: uco-observable:AlternateDataStream
    description: An alternate data stream is data content stored within an NTFS file that is independent
      of the standard content stream of the file and is hidden from access by default NTFS file viewing
      mechanisms.
  AlternateDataStreamFacet:
    is_a: Facet

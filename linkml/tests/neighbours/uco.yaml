    - gid
    - shell
  UNIXFile:
    is_a: File
    class_uri: uco-observable:UNIXFile
    description: A UNIX file is a file pertaining to the UNIX operating system.
  UNIXFilePermissionsFacet:
    is_a: Facet
    class_uri: uco-observable:UNIXFilePermissionsFacet
    description: A UNIX file permissions facet is a grouping of characteristics unique to the access rights

    - totalSpace
  DomainName:
    is_a: ObservableObject
    class_uri: uco-observable:DomainName
    description: A domain name is an identification string that defines a realm of administrative autonomy,
      authority or control within the Internet. [based on https://en.wikipedia.org/wiki/Domain_name]
  DomainNameFacet:
    is_a: Facet
    class_uri: uco-observable:DomainNameFacet
    description: A domain name facet is a grouping of characteristics unique to an identification string
      that defines a realm of administrative autonomy, authority or control within the Internet. [based
      on https://en.wikipedia.org/wiki/Domain_name]
    slots:
    - isTLD
    - observable_value
  Drone:
    is_a: MobileDevice
    class_uri: uco-observable:Drone
    description: A drone, unmanned aerial vehicle (UAV), is an aircraft without a human pilot, crew, or
      passengers that typically involve a ground-based controller and a system for communications with
      the UAV.
  EXIFFacet:
    is_a: Facet
    class_uri: uco-observable:EXIFFacet
    description: An EXIF (exchangeable image file format) facet is a grouping of characteristics unique
      to the formats for images, sound, and ancillary tags used by digital cameras (including smartphones),
      scanners and other systems handling image and sound files recorded by digital cameras conformant
      to JEIDA/JEITA/CIPA specifications. [based on https://en.wikipedia.org/wiki/Exif]
    slots:
    - exifData
  EmailAccount:
    is_a: DigitalAccount
    class_uri: uco-observable:EmailAccount
    description: An email account is an arrangement with an entity to enable and control the provision
      of electronic mail (email) capabilities or services.
  EmailAccountFacet:
    is_a: Facet
    class_uri: uco-observable:EmailAccountFacet
    description: An email account facet is a grouping of characteristics unique to an arrangement with
      an entity to enable and control the provision of electronic mail (email) capabilities or services.
    slots:
    - emailAddress
  EmailAddress:
    is_a: DigitalAddress
    class_uri: uco-observable:EmailAddress
    description: An email address is an identifier for an electronic mailbox to which electronic mail
      messages (conformant to the Simple Mail Transfer Protocol (SMTP)) are sent from and delivered to.
  EmailAddressFacet:
    is_a: DigitalAddressFacet
    class_uri: uco-observable:EmailAddressFacet
    description: An email address facet is a grouping of characteristics unique to an identifier for an
      electronic mailbox to which electronic mail messages (conformant to the Simple Mail Transfer Protocol
      (SMTP)) are sent from and delivered to.
  EmailMessage:
    is_a: Message
    class_uri: uco-observable:EmailMessage
    description: An email message is a message that is an instance of an electronic mail correspondence
      conformant to the internet message format described in RFC 5322 and related RFCs.
  EmailMessageFacet:
    is_a: Facet
    class_uri: uco-observable:EmailMessageFacet
    description: An email message facet is a grouping of characteristics unique to a message that is an
      instance of an electronic mail correspondence conformant to the internet message format described
      in RFC 5322 and related RFCs.
    slots:
    - application
    - bcc

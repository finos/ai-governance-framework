# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/uco-lokf
name: uco
title: Unified Cyber Ontology (UCO)
description: 'A LinkML rendering of the Unified Cyber Ontology (UCO) 1.5.0: one module per UCO namespace,
  with every class, property and vocabulary keeping its UCO IRI, and lmodel/collections'' schema for the
  Collections Ontology terms UCO uses.'
version: 1.5.0
source: https://github.com/ucoProject/UCO/releases/tag/1.5.0
license: Apache-2.0
see_also:
- https://lmodel.github.io/uco
- https://unifiedcyberontology.org/releases/1.5.0/
comments:
- scripts/uco_to_linkml.py writes every YAML file in this folder from UCO's files in upstream/. Change
  the script or the copy, never the files.
- Each module imports the modules its UCO file imports, and this file imports them in that order, so an
  importer can import one module alone.
- collections/collections.yaml is lmodel/collections' schema at its v0.1.0 release, copied unchanged.
  It renders the Collections Ontology (CO) 2.0 with CO's names and IRIs, and UCO's threads build on its
  Bag and CoItem.
- The descriptions are UCO's rdfs:comment texts, which the UCO Community publishes under the Apache License
  2.0.
- 'Where UCO defines one local name in more than one namespace, the namespace that comes first in this
  file''s imports keeps it, and each other takes its namespace as a prefix: action_endTime, action_object,
  action_startTime, action_value, marking_statement, observable_context, observable_cpeid, observable_creator,
  observable_endTime, observable_eventType, observable_key, observable_location, observable_modifiedTime,
  observable_participant, observable_references, observable_startTime, observable_swid, observable_value,
  observable_version, types_value.'
- 'Declared in uco_core although their IRIs are in UCO''s types namespace, since Event''s eventAttribute
  ranges over them and uco-core imports no other UCO namespace: Dictionary (uco-types:Dictionary), entry
  (uco-types:entry), DictionaryEntry (uco-types:DictionaryEntry), key (uco-types:key), types_value (uco-types:value).'
- 'Left out: SHACL advice (severity sh:Info or sh:Warning), SPARQL constraints, sh:not, sh:xone, paths
  of more than one property, shapes on a property''s objects, that hasFacet is inverse functional, and
  UCO''s rule that a UcoThing is never a blank node, which a facet inlined here is when written as RDF.'

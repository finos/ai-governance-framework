  UserAccount:
    is_a: DigitalAccount
    class_uri: uco-observable:UserAccount
    description: A user account is an account controlling a user's access to a network, system or platform.
  UserAccountFacet:
    is_a: Facet
    class_uri: uco-observable:UserAccountFacet
    description: A user account facet is a grouping of characteristics unique to an account controlling
      a user's access to a network, system, or platform.
    slots:
    - canEscalatePrivs
    - homeDirectory
    - isPrivileged
    - isServiceAccount
  UserSession:
    is_a: ObservableObject
    class_uri: uco-observable:UserSession
    description: A user session is a temporary and interactive information interchange between two or
      more communicating devices within the managed scope of a single user. [based on https://en.wikipedia.org/wiki/Session_(computer_science)]
  UserSessionFacet:
    is_a: Facet
    class_uri: uco-observable:UserSessionFacet
    description: A user session facet is a grouping of characteristics unique to a temporary and interactive
      information interchange between two or more communicating devices within the managed scope of a
      single user. [based on https://en.wikipedia.org/wiki/Session_(computer_science)]
    slots:
    - effectiveGroup
    - effectiveGroupID
    - effectiveUser
    - loginTime
    - logoutTime
  ValuesEnumeratedEffectFacet:
    is_a: DefinedEffectFacet
    class_uri: uco-observable:ValuesEnumeratedEffectFacet
    description: A values enumerated effect facet is a grouping of characteristics unique to the effects
      of actions upon observable objects where a value of the observable object is enumerated. An example
      of this would be the values of a registry key.
    slots:
    - values
  Volume:
    is_a: ObservableObject
    class_uri: uco-observable:Volume
    description: A volume is a single accessible storage area (volume) with a single file system. [based
      on https://en.wikipedia.org/wiki/Volume_(computing)]
  VolumeFacet:
    is_a: Facet
    class_uri: uco-observable:VolumeFacet
    description: A volume facet is a grouping of characteristics unique to a single accessible storage
      area (volume) with a single file system. [based on https://en.wikipedia.org/wiki/Volume_(computing)]
    slots:
    - sectorSize
    - volumeID
  WearableDevice:
    is_a: SmartDevice
    class_uri: uco-observable:WearableDevice
    description: A wearable device is an electronic device that is designed to be worn on a person's body.
  WebPage:
    is_a: ObservableObject
    class_uri: uco-observable:WebPage
    description: A web page is a specific collection of information provided by a website and displayed
      to a user in a web browser. A website typically consists of many web pages linked together in a
      coherent fashion. [based on https://en.wikipedia.org/wiki/Web_page]
  WhoIs:
    is_a: ObservableObject
    class_uri: uco-observable:WhoIs
    description: WhoIs is a response record conformant to the WHOIS protocol standard (RFC 3912). [based
      on https://en.wikipedia.org/wiki/WHOIS]
  WhoIsFacet:
    is_a: Facet
    class_uri: uco-observable:WhoIsFacet
    description: A whois facet is a grouping of characteristics unique to a response record conformant
      to the WHOIS protocol standard (RFC 3912). [based on https://en.wikipedia.org/wiki/WHOIS]
    slots:
    - creationDate
    - dnssec
    - domainID
    - domainName
    - expirationDate
    - ipAddress
    - lookupDate
    - nameServer
    - regionalInternetRegistry
    - registrantContactInfo
    - registrantIDs
    - registrarInfo
    - remarks
    - serverName
    - sponsoringRegistrar
    - uco_status
    - updatedDate
    slot_usage:
      uco_status:
        any_of:
        - range: TaskStatusVocab
        - range: WhoisStatusTypeVocab
        - range: string
  WhoisContactFacet:
    is_a: ContactFacet
    class_uri: uco-observable:WhoisContactFacet
    title: WhoIsContactFacet
    description: A Whois contact type is a grouping of characteristics unique to contact-related information
      present in a response record conformant to the WHOIS protocol standard (RFC 3912). [based on https://en.wikipedia.org/wiki/WHOIS]
    slots:
    - whoisContactType
  WhoisRegistrarInfoType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:WhoisRegistrarInfoType
    description: A Whois registrar info type is a grouping of characteristics unique to registrar-related
      information present in a response record conformant to the WHOIS protocol standard (RFC 3912). [based
      on https://en.wikipedia.org/wiki/WHOIS]
    slots:
    - contactPhoneNumber
    - emailAddress
    - geolocationAddress
    - referralURL
    - registrarGUID
    - registrarID
    - registrarName
    - whoisServer
  WifiAddress:
    is_a: MACAddress
    class_uri: uco-observable:WifiAddress
    description: A Wi-Fi address is a media access control (MAC) standards-conformant identifier assigned
      to a device network interface to enable routing and management of IEEE 802.11 standards-conformant
      communications to and from that device.
  WifiAddressFacet:
    is_a: MACAddressFacet
    class_uri: uco-observable:WifiAddressFacet
    description: A Wi-Fi address facet is a grouping of characteristics unique to a media access control
      (MAC) standards conformant identifier assigned to a device network interface to enable routing and
      management of IEEE 802.11 standards-conformant communications to and from that device.
  Wiki:
    is_a: ObservableObject
    class_uri: uco-observable:Wiki
    description: A wiki is an online hypertext publication collaboratively edited and managed by its own
      audience directly using a web browser. A typical wiki contains multiple pages/articles for the subjects
      or scope of the project and could be either open to the public or limited to use within an organization
      for maintaining its internal knowledge base. [based on https://en.wikipedia.org/wiki/Wiki]
  WikiArticle:
    is_a: ObservableObject
    class_uri: uco-observable:WikiArticle
    description: A wiki article is one or more pages in a wiki focused on characterizing a particular
      topic.
  WindowsAccount:
    is_a: DigitalAccount
    class_uri: uco-observable:WindowsAccount
    description: A Windows account is a user account on a Windows operating system.
  WindowsAccountFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsAccountFacet
    description: A Windows account facet is a grouping of characteristics unique to a user account on
      a Windows operating system.
    slots:
    - groups
  WindowsActiveDirectoryAccount:
    is_a: DigitalAccount
    class_uri: uco-observable:WindowsActiveDirectoryAccount
    description: A Windows Active Directory account is an account managed by directory-based identity-related
      services of a Windows operating system.
  WindowsActiveDirectoryAccountFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsActiveDirectoryAccountFacet
    description: A Windows Active Directory account facet is a grouping of characteristics unique to an
      account managed by directory-based identity-related services of a Windows operating system.
    slots:
    - activeDirectoryGroups
    - objectGUID
  WindowsComputerSpecification:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsComputerSpecification
    description: A Windows computer specification is the hardware ans software of a programmable electronic
      device that can store, retrieve, and process data running a Microsoft Windows operating system.
      [based on merriam-webster.com/dictionary/computer]
  WindowsComputerSpecificationFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsComputerSpecificationFacet
    description: A Windows computer specification facet is a grouping of characteristics unique to the
      hardware and software of a programmable electronic device that can store, retrieve, and process
      data running a Microsoft Windows operating system. [based on merriam-webster.com/dictionary/computer]
    slots:
    - domain
    - globalFlagList
    - lastShutdownDate
    - msProductID
    - msProductName
    - netBIOSName
    - osInstallDate
    - osLastUpgradeDate
    - registeredOrganization
    - registeredOwner
    - windowsDirectory
    - windowsSystemDirectory
    - windowsTempDirectory
  WindowsCriticalSection:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsCriticalSection
    description: A Windows critical section is a Windows object that provides synchronization similar
      to that provided by a mutex object, except that a critical section can be used only by the threads
      of a single process. Critical section objects cannot be shared across processes. Event, mutex, and
      semaphore objects can also be used in a single-process application, but critical section objects
      provide a slightly faster, more efficient mechanism for mutual-exclusion synchronization (a processor-specific
      test and set instruction). Like a mutex object, a critical section object can be owned by only one
      thread at a time, which makes it useful for protecting a shared resource from simultaneous access.
      Unlike a mutex object, there is no way to tell whether a critical section has been abandoned. [based
      on https://docs.microsoft.com/en-us/windows/win32/sync/critical-section-objects]
  WindowsEvent:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsEvent
    description: A Windows event is a notification record of an occurance of interest (system, security,
      application, etc.) on a Windows operating system.
  WindowsFilemapping:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsFilemapping
    description: A Windows file mapping is the association of a file's contents with a portion of the
      virtual address space of a process within a Windows operating system. The system creates a file
      mapping object (also known as a section object) to maintain this association. A file view is the
      portion of virtual address space that a process uses to access the file's contents. File mapping
      allows the process to use both random input and output (I/O) and sequential I/O. It also allows
      the process to work efficiently with a large data file, such as a database, without having to map
      the whole file into memory. Multiple processes can also use memory-mapped files to share data. Processes
      read from and write to the file view using pointers, just as they would with dynamically allocated
      memory. The use of file mapping improves efficiency because the file resides on disk, but the file
      view resides in memory.[based on https://docs.microsoft.com/en-us/windows/win32/memory/file-mapping]
  WindowsHandle:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsHandle
    description: A Windows handle is an abstract reference to a resource within the Windows operating
      system, such as a window, memory, an open file or a pipe. It is the mechanism by which applications
      interact with such resources in the Windows operating system.
  WindowsHook:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsHook
    description: A Windows hook is a mechanism by which an application can intercept events, such as messages,
      mouse actions, and keystrokes within the Windows operating system. A function that intercepts a
      particular type of event is known as a hook procedure. A hook procedure can act on each event it
      receives, and then modify or discard the event. [based on https://docs.microsoft.com/en-us/windows/win32/winmsg/about-hooks]
  WindowsMailslot:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsMailslot
    description: A Windows mailslot is is a pseudofile that resides in memory, and may be accessed using
      standard file functions. The data in a mailslot message can be in any form, but cannot be larger
      than 424 bytes when sent between computers. Unlike disk files, mailslots are temporary. When all
      handles to a mailslot are closed, the mailslot and all the data it contains are deleted. [based
      on https://docs.microsoft.com/en-us/windows/win32/ipc/about-mailslots]
  WindowsNetworkShare:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsNetworkShare
    description: A Windows network share is a Windows computer resource made available from one host to
      other hosts on a computer network. It is a device or piece of information on a computer that can
      be remotely accessed from another computer transparently as if it were a resource in the local machine.
      Network sharing is made possible by inter-process communication over the network. [based on https://en.wikipedia.org/wiki/Shared_resource]
  WindowsPEBinaryFile:
    is_a: File
    class_uri: uco-observable:WindowsPEBinaryFile
    description: A Windows PE binary file is a Windows portable executable (PE) file.
  WindowsPEBinaryFileFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsPEBinaryFileFacet
    description: A Windows PE binary file facet is a grouping of characteristics unique to a Windows portable
      executable (PE) file.
    slots:
    - characteristics
    - fileHeaderHashes
    - impHash
    - machine
    - numberOfSections
    - numberOfSymbols
    - optionalHeader
    - peType
    - pointerToSymbolTable
    - sections
    - sizeOfOptionalHeader
    - timeDateStamp
  WindowsPEFileHeader:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:WindowsPEFileHeader
    description: A Windows PE file header is a grouping of characteristics unique to the 'header' of a
      Windows PE (Portable Executable) file, consisting of a collection of metadata about the overall
      nature and structure of the file.
    slots:
    - timeDateStamp
  WindowsPEOptionalHeader:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:WindowsPEOptionalHeader
    description: A Windows PE optional header is a grouping of characteristics unique to the 'optional
      header' of a Windows PE (Portable Executable) file, consisting of a collection of metadata about
      the executable code structure of the file.
    slots:
    - addressOfEntryPoint
    - baseOfCode
    - uco_checksum
    - dllCharacteristics
    - fileAlignment
    - imageBase
    - loaderFlags
    - magic
    - majorImageVersion
    - majorLinkerVersion
    - majorOSVersion
    - majorSubsystemVersion
    - minorImageVersion
    - minorLinkerVersion
    - minorOSVersion
    - minorSubsystemVersion
    - numberOfRVAAndSizes
    - sectionAlignment
    - sizeOfCode
    - sizeOfHeaders
    - sizeOfHeapCommit
    - sizeOfHeapReserve
    - sizeOfImage
    - sizeOfInitializedData
    - sizeOfStackCommit
    - sizeOfStackReserve
    - sizeOfUninitializedData
    - subsystem
    - win32VersionValue
  WindowsPESection:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:WindowsPESection
    description: A Windows PE section is a grouping of characteristics unique to a specific default or
      custom-defined region of a Windows PE (Portable Executable) file, consisting of an individual portion
      of the actual executable content of the file delineated according to unique purpose and memory protection
      requirements.
    slots:
    - entropy
    - hashes
    - uco_name
    - size
    slot_usage:
      hashes:
        multivalued: true
        inlined_as_list: true
  WindowsPrefetch:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsPrefetch
    description: The Windows prefetch contains entries in a Windows prefetch file (used to speed up application
      startup starting with Windows XP).
  WindowsPrefetchFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsPrefetchFacet
    description: A Windows prefetch facet is a grouping of characteristics unique to entries in the Windows
      prefetch file (used to speed up application startup starting with Windows XP).
    slots:
    - accessedDirectory
    - accessedFile
    - applicationFileName
    - firstRun
    - lastRun
    - prefetchHash
    - timesExecuted
    - volume
  WindowsProcess:
    is_a: Process
    class_uri: uco-observable:WindowsProcess
    description: A Windows process is a program running on a Windows operating system.
  WindowsProcessFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsProcessFacet
    description: A Windows process facet is a grouping of characteristics unique to a program running
      on a Windows operating system.
    slots:
    - aslrEnabled
    - depEnabled
    - ownerSID
    - priority
    - startupInfo
    - windowTitle
  WindowsRegistryHive:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsRegistryHive
    description: The Windows registry hive is a particular logical group of keys, subkeys, and values
      in a Windows registry (a hierarchical database that stores low-level settings for the Microsoft
      Windows operating system and for applications that opt to use the registry). [based on https://en.wikipedia.org/wiki/Windows_Registry]
  WindowsRegistryHiveFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsRegistryHiveFacet
    description: A Windows registry hive facet is a grouping of characteristics unique to a particular
      logical group of keys, subkeys, and values in a Windows registry (a hierarchical database that stores
      low-level settings for the Microsoft Windows operating system and for applications that opt to use
      the registry). [based on https://en.wikipedia.org/wiki/Windows_Registry]
    slots:
    - hiveType
  WindowsRegistryKey:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsRegistryKey
    description: A Windows registry key is a particular key within a Windows registry (a hierarchical
      database that stores low-level settings for the Microsoft Windows operating system and for applications
      that opt to use the registry). [based on https://en.wikipedia.org/wiki/Windows_Registry]
  WindowsRegistryKeyFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsRegistryKeyFacet
    description: A Windows registry key facet is a grouping of characteristics unique to a particular
      key within a Windows registry (A hierarchical database that stores low-level settings for the Microsoft
      Windows operating system and for applications that opt to use the registry). [based on https://en.wikipedia.org/wiki/Windows_Registry]
    slots:
    - numberOfSubkeys
    - observable_creator
    - observable_key
    - observable_modifiedTime
    - registryValues
  WindowsRegistryValue:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:WindowsRegistryValue
    description: A Windows registry value is a grouping of characteristics unique to a particular value
      within a Windows registry (a hierarchical database that stores low-level settings for the Microsoft
      Windows operating system and for applications that opt to use the registry. [based on https://en.wikipedia.org/wiki/Windows_Registry]
    slots:
    - data
    - dataType
    - uco_name
  WindowsService:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsService
    description: A Windows service is a specific Windows service (a computer program that operates in
      the background of a Windows operating system, similar to the way a UNIX daemon runs on UNIX). [based
      on https://en.wikipedia.org/wiki/Windows_service]
  WindowsServiceFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsServiceFacet
    description: A Windows service facet is a grouping of characteristics unique to a specific Windows
      service (a computer program that operates in the background of a Windows operating system, similar
      to the way a UNIX daemon runs on UNIX). [based on https://en.wikipedia.org/wiki/Windows_service]
    slots:
    - descriptions
    - displayName
    - groupName
    - serviceName
    - serviceStatus
    - serviceType
    - startCommandLine
    - startType
  WindowsSystemRestore:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsSystemRestore
    description: A Windows system restore is a capture of a Windows computer's state (including system
      files, installed applications, Windows Registry, and system settings) at a particular point in time
      such that the computer can be reverted to that state in the event of system malfunctions or other
      problems. [based on https://en.wikipedia.org/wiki/System_Restore]
  WindowsTask:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsTask
    description: A Windows task is a process that is scheduled to execute on a Windows operating system
      by the Windows Task Scheduler. [based on http://msdn.microsoft.com/en-us/library/windows/desktop/aa381311(v=vs.85).aspx]
  WindowsTaskFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsTaskFacet
    description: A Windows Task facet is a grouping of characteristics unique to a Windows Task (a process
      that is scheduled to execute on a Windows operating system by the Windows Task Scheduler). [based
      on http://msdn.microsoft.com/en-us/library/windows/desktop/aa381311(v=vs.85).aspx]
    slots:
    - account
    - accountLogonType
    - accountRunLevel
    - actionList
    - application
    - exitCode
    - flags
    - imageName
    - maxRunTime
    - mostRecentRunTime
    - nextRunTime
    - observableCreatedTime
    - uco_parameters
    - priority
    - uco_status
    - taskComment
    - taskCreator
    - triggerList
    - workItemData
    - workingDirectory
    slot_usage:
      priority:
        any_of:
        - range: TaskPriorityVocab
        - range: integer
        - range: string
      uco_status:
        range: TaskStatusVocab
  WindowsThread:
    is_a: ProcessThread
    class_uri: uco-observable:WindowsThread
    description: A Windows thread is a single thread of execution within a Windows process.
  WindowsThreadFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsThreadFacet
    description: A Windows thread facet is a grouping os characteristics unique to a single thread of
      execution within a Windows process.
    slots:
    - creationFlags
    - creationTime
    - observableCreatedTime
    - observable_context
    - parameterAddress
    - priority
    - runningStatus
    - securityAttributes
    - stackSize
    - startAddress
    - threadID
    slot_usage:
      priority:
        range: integer
  WindowsVolumeFacet:
    is_a: Facet
    class_uri: uco-observable:WindowsVolumeFacet
    description: A Windows volume facet is a grouping of characteristics unique to a single accessible
      storage area (volume) with a single Windows file system. [based on https://en.wikipedia.org/wiki/Volume_(computing)]
    slots:
    - driveLetter
    - driveType
    - windowsVolumeAttributes
  WindowsWaitableTime:
    is_a: ObservableObject
    class_uri: uco-observable:WindowsWaitableTime
    description: 'A Windows waitable timer is a synchronization object within the Windows operating system
      whose state is set to signaled when a specified due time arrives. There are two types of waitable
      timers that can be created: manual-reset and synchronization. A timer of either type can also be
      a periodic timer. [based on https://docs.microsoft.com/en-us/windows/win32/sync/waitable-timer-objects]'
  WirelessNetworkConnection:
    is_a: NetworkConnection
    class_uri: uco-observable:WirelessNetworkConnection
    description: A wireless network connection is a connection (completed or attempted) across an IEEE
      802.11 standards-confromant digital network (a group of two or more computer systems linked together).
      [based on https://www.webopedia.com/TERM/N/network.html]
  WirelessNetworkConnectionFacet:
    is_a: Facet
    class_uri: uco-observable:WirelessNetworkConnectionFacet
    description: A wireless network connection facet is a grouping of characteristics unique to a connection
      (completed or attempted) across an IEEE 802.11 standards-conformant digital network (a group of
      two or more computer systems linked together). [based on https://www.webopedia.com/TERM/N/network.html]
    slots:
    - baseStation
    - password
    - ssid
    - wirelessNetworkSecurityMode
  WriteBlocker:
    is_a: Device
    class_uri: uco-observable:WriteBlocker
    description: A write blocker is a device that allows read-only access to storage mediums in order
      to preserve the integrity of the data being analyzed. Examples include Tableau, Cellibrite, Talon,
      etc.
  X509Certificate:
    is_a: ObservableObject
    class_uri: uco-observable:X509Certificate
    description: A X.509 certificate is a public key digital identity certificate conformant to the X.509
      PKI (Public Key Infrastructure) standard.
  X509CertificateFacet:
    is_a: Facet
    class_uri: uco-observable:X509CertificateFacet
    description: A X.509 certificate facet is a grouping of characteristics unique to a public key digital
      identity certificate conformant to the X.509 PKI (Public Key Infrastructure) standard.
    slots:
    - isSelfSigned
    - issuer
    - issuerHash
    - observable_version
    - serialNumber
    - signature
    - signatureAlgorithm
    - subject
    - subjectHash
    - subjectPublicKeyAlgorithm
    - subjectPublicKeyExponent
    - subjectPublicKeyModulus
    - thumbprintHash
    - validityNotAfter
    - validityNotBefore
    - x509v3extensions
  X509V3Certificate:
    is_a: ObservableObject
    class_uri: uco-observable:X509V3Certificate
    description: An X.509 v3 certificate is a public key digital identity certificate conformant to the
      X.509 v3 PKI (Public Key Infrastructure) standard.
  X509V3ExtensionsFacet:
    is_a: Facet
    class_uri: uco-observable:X509V3ExtensionsFacet
    description: An X.509 v3 certificate extensions facet is a grouping of characteristics unique to a
      public key digital identity certificate conformant to the X.509 v3 PKI (Public Key Infrastructure)
      standard.
    slots:
    - authorityKeyIdentifier
    - basicConstraints
    - certificatePolicies
    - crlDistributionPoints
    - extendedKeyUsage
    - inhibitAnyPolicy
    - issuerAlternativeName
    - keyUsage
    - nameConstraints
    - policyConstraints
    - policyMappings
    - privateKeyUsagePeriodNotAfter
    - privateKeyUsagePeriodNotBefore
    - subjectAlternativeName
    - subjectDirectoryAttributes
    - subjectKeyIdentifier
  UcoDocument:
    class_uri: uco_linkml:UcoDocument
    description: A document of UCO data, as a JSON-LD file of UCO holds one graph.
    slots:
    - graph

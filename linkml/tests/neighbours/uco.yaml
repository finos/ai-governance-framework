    - urlHistoryEntry
  URLVisit:
    is_a: ObservableObject
    class_uri: uco-observable:URLVisit
    description: A URL visit characterizes the properties of a visit of a URL within a particular browser.
  URLVisitFacet:
    is_a: Facet

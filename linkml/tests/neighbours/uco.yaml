      to cloud-based networks or via smartphone
  SmartPhone:
    is_a: MobilePhone
    mixins:
    - Computer
    - SmartDevice
    class_uri: uco-observable:SmartPhone
    description: A smartphone is a portable device that combines mobile telephone and computing functions
      into one unit. Examples include iPhone, Samsung Galaxy, Huawei, Blackberry. (Inferred by model and
      OperatingSystemFacet)
  Snapshot:
    is_a: FileSystemObject
    class_uri: uco-observable:Snapshot
    description: A snapshot is a file system object representing a snapshot of the contents of a part

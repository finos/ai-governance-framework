classes:
  Collection:
    class_uri: coll:Collection
    description: A group of things that is taken as a whole.
    slots:
    - co_size
    - element
    disjoint_with:
    - CoItem
  Set:
    is_a: Collection
    class_uri: coll:Set
    description: A collection that holds each of its elements once.
    comments:
    - 'No validator checks that the elements differ: LinkML 1.12.1''s generators drop list_elements_unique,
      so the tests check it.'
    slot_usage:
      element:
        list_elements_unique: true
  Bag:
    is_a: Collection
    class_uri: coll:Bag
    description: A collection that may hold one element more than once, in no order.
    slots:
    - item
    disjoint_with:
    - Set
  List:
    is_a: Bag
    class_uri: coll:List
    description: A collection whose items come in order, one after another.
    comments:
    - 'No validator checks the order: that the indexes count from 1 with no gap or repeat, and that firstItem,
      lastItem and each item''s links agree with them. The tests check it.'
    slots:
    - firstItem
    - lastItem
    slot_usage:
      item:
        range: ListItem
  CoItem:
    class_uri: coll:Item
    description: An entry of a bag, which wraps one of the bag's elements.
    slots:
    - itemContent
    slot_usage:
      itemContent:
        required: true
  ListItem:
    is_a: CoItem
    class_uri: coll:ListItem
    description: An item of a list, which has a place in the list's order.
    slots:
    - co_index
    - nextItem
    - previousItem
    - followedBy
    - precededBy
    slot_usage:
      co_index:
        required: true
  Annotation:
    is_a: Assertion
    class_uri: uco-core:Annotation
    description: An annotation is an assertion made in relation to one or more objects.
    slots:
    - object
    slot_usage:
      object:
        required: true
  Assertion:
    is_a: UcoObject
    class_uri: uco-core:Assertion
    description: An assertion is a statement declared to be true.
    slots:
    - statement
  AttributedName:
    is_a: UcoObject
    class_uri: uco-core:AttributedName
    description: An attributed name is a name of an entity issued by some attributed naming authority.
    slots:
    - namingAuthority
  Bundle:
    is_a: EnclosingCompilation
    class_uri: uco-core:Bundle
    description: A bundle is a container for a grouping of UCO content with no presumption of shared context.
  Compilation:
    is_a: UcoObject
    class_uri: uco-core:Compilation
    description: A compilation is a grouping of things.
  ConfidenceFacet:
    is_a: Facet
    class_uri: uco-core:ConfidenceFacet
    description: A confidence is a grouping of characteristics unique to an asserted level of certainty
      in the accuracy of some information.
    slots:
    - confidence
  ContextualCompilation:
    is_a: Compilation
    class_uri: uco-core:ContextualCompilation
    description: A contextual compilation is a grouping of things sharing some context (e.g., a set of
      network connections observed on a given day, all accounts associated with a given person).
    slots:
    - object
  ControlledVocabulary:
    is_a: UcoObject
    class_uri: uco-core:ControlledVocabulary
    description: A controlled vocabulary is an explicitly constrained set of string values.
    slots:
    - constrainingVocabularyName
    - constrainingVocabularyReference
    - value
  Dictionary:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-types:Dictionary
    description: A dictionary is list of (term/key, value) pairs with each term/key having an expectation
      to exist no more than once. types:Dictionary alone does not validate this expectation, but validation
      is available. For use cases where this expectation must be validated, the subclass types:ProperDictionary
      should be used instead of types:Dictionary. For instances where this expectation has been found
      to be violated, the subclass types:ImproperDictionary should be used instead of types:Dictionary.
    slots:
    - entry
  DictionaryEntry:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-types:DictionaryEntry
    description: A dictionary entry is a single (term/key, value) pair.
    slots:
    - key
    - types_value
  EnclosingCompilation:
    is_a: Compilation
    class_uri: uco-core:EnclosingCompilation
    description: An enclosing compilation is a container for a grouping of things.
    slots:
    - object
    slot_usage:
      object:
        required: true
  Event:
    is_a: UcoObject
    class_uri: uco-core:Event
    description: An Event is a noteworthy occurrence (something that happens or might happen).
    slots:
    - endTime
    - eventAttribute
    - eventContext
    - eventType
    - startTime
  ExternalReference:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-core:ExternalReference
    description: Characteristics of a reference to a resource outside of the UCO.
    slots:
    - definingContext
    - externalIdentifier
    - referenceURL
  Facet:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-core:Facet
    description: A facet is a grouping of characteristics singularly unique to a particular inherent aspect
      of a UCO domain object.
  Grouping:
    is_a: ContextualCompilation
    class_uri: uco-core:Grouping
    description: A grouping is a compilation of referenced UCO content with a shared context.
    slots:
    - uco_context
  IdentityAbstraction:
    is_a: UcoObject
    class_uri: uco-core:IdentityAbstraction
    description: An identity abstraction is a grouping of identifying characteristics unique to an individual
      or organization. This class is an ontological structural abstraction for this concept. Implementations
      of this concept should utilize the identity:Identity class.
  Item:
    is_a: UcoObject
    class_uri: uco-core:Item
    description: An item is a distinct article or unit.
  MarkingDefinitionAbstraction:
    is_a: UcoObject
    class_uri: uco-core:MarkingDefinitionAbstraction
    description: A marking definition abstraction is a grouping of characteristics unique to the expression
      of a specific data marking conveying restrictions, permissions, and other guidance for how marked
      data can be used and shared. This class is an ontological structural abstraction for this concept.
      Implementations of this concept should utilize the marking:MarkingDefinition class.
  ModusOperandi:
    is_a: UcoObject
    class_uri: uco-core:ModusOperandi
    description: A modus operandi is a particular method of operation (how a particular entity behaves
      or the resources they use).
  Relationship:
    is_a: UcoObject
    class_uri: uco-core:Relationship
    description: A relationship is a grouping of characteristics unique to an assertion that one or more
      objects are related to another object in some way.
    slots:
    - endTime
    - isDirectional
    - kindOfRelationship
    - uco_source
    - startTime
    - uco_target
  UcoInherentCharacterizationThing:
    is_a: UcoThing
    class_uri: uco-core:UcoInherentCharacterizationThing
    description: A UCO inherent characterization thing is a grouping of characteristics unique to a particular
      inherent aspect of a UCO domain object.
    disjoint_with:
    - UcoObject
  UcoObject:
    is_a: Concept
    class_uri: uco-core:UcoObject
    description: A UCO object is a representation of a fundamental concept either directly inherent to
      the cyber domain or indirectly related to the cyber domain and necessary for contextually characterizing
      cyber domain concepts and relationships. Within the Unified Cyber Ontology (UCO) structure this
      is the base class acting as a consistent, unifying and interoperable foundation for all explicit
      and inter-relatable content objects.
    disjoint_with:
    - UcoInherentCharacterizationThing
    slots:
    - id
    - createdBy
    - uco_description
    - externalReference
    - hasFacet
    - modifiedTime
    - uco_name
    - objectCreatedTime
    - objectMarking
    - objectStatus
    - specVersion
    - tag
  UcoThing:
    class_uri: uco-core:UcoThing
    description: UcoThing is the top-level class for individuals within UCO.
    see_also:
    - uco-core:UcoThing-identifier-regex-shape
    slots:
    - type
  UcoType:
    class_uri: uco-core:UcoType
    description: UcoType is the top-level class for metaclasses within UCO. An instance of core:UcoType
      is also an instance of owl:Class, and is or specializes core:UcoThing.
    disjoint_with:
    - UcoThing
    slots:
    - id
    - type
    is_a: Concept
  Configuration:
    is_a: UcoObject
    class_uri: uco-configuration:Configuration
    description: A configuration is a grouping of characteristics unique to a set of parameters or initial
      settings for the use of a tool, application, software, or other cyber object.
    see_also:
    - https://github.com/ucoProject/UCO/issues/432
    slots:
    - configurationEntry
    - dependencies
    - usageContextAssumptions
  ConfigurationEntry:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-configuration:ConfigurationEntry
    description: A configuration entry is a grouping of characteristics unique to a particular parameter
      or initial setting for the use of a tool, application, software, or other cyber object.
    slots:
    - itemDescription
    - itemName
    - itemObject
    - itemType
    - itemValue
  Dependency:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-configuration:Dependency
    description: A dependency is a grouping of characteristics unique to something that a tool or other
      software relies on to function as intended.
    slots:
    - dependencyDescription
    - dependencyType
  GPSCoordinatesFacet:
    is_a: Facet
    class_uri: uco-location:GPSCoordinatesFacet
    description: A GPS coordinates facet is a grouping of characteristics unique to the expression of
      quantified dilution of precision (DOP) for an asserted set of geolocation coordinates typically
      associated with satellite navigation such as the Global Positioning System (GPS).
    slots:
    - hdop
    - pdop
    - tdop
    - vdop
  LatLongCoordinatesFacet:
    is_a: Facet
    class_uri: uco-location:LatLongCoordinatesFacet
    description: A lat long coordinates facet is a grouping of characteristics unique to the expression
      of a geolocation as the intersection of specific latitude, longitude, and altitude values.
    slots:
    - altitude
    - latitude
    - longitude
  Location:
    is_a: UcoObject
    class_uri: uco-location:Location
    description: A location is a geospatial place, site, or position.
  SimpleAddressFacet:
    is_a: Facet
    class_uri: uco-location:SimpleAddressFacet
    description: A simple address facet is a grouping of characteristics unique to a geolocation expressed
      as an administrative address.
    slots:
    - addressType
    - country
    - locality
    - postalCode
    - region
    - street
  AddressFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:AddressFacet
    description: An address facet is a grouping of characteristics unique to an administrative identifier
      for a geolocation associated with a specific identity.
    slots:
    - address
  AffiliationFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:AffiliationFacet
    description: An affiliation is a grouping of characteristics unique to the established affiliations
      of an entity.
  BirthInformationFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:BirthInformationFacet
    description: Birth information is a grouping of characteristics unique to information pertaining to
      the birth of an entity.
    slots:
    - birthdate
  CountryOfResidenceFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:CountryOfResidenceFacet
    description: Country of residence is a grouping of characteristics unique to information related to
      the country, or countries, where an entity resides.
  EventsFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:EventsFacet
    description: Events is a grouping of characteristics unique to information related to specific relevant
      things that happen in the lifetime of an entity.
  IdentifierFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:IdentifierFacet
    description: Identifier is a grouping of characteristics unique to information that uniquely and specifically
      identities an entity.
  Identity:
    is_a: IdentityAbstraction
    class_uri: uco-identity:Identity
    description: An identity is a grouping of identifying characteristics unique to an individual or organization.
  IdentityFacet:
    is_a: Facet
    class_uri: uco-identity:IdentityFacet
    description: An identity facet is a grouping of characteristics unique to a particular aspect of an
      identity.
  LanguagesFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:LanguagesFacet
    description: Languages is a grouping of characteristics unique to specific syntactically and grammatically
      standardized forms of communication (human or computer) in which an entity has proficiency (comprehends,
      speaks, reads, or writes).
  NationalityFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:NationalityFacet
    description: Nationality is a grouping of characteristics unique to the condition of an entity belonging
      to a particular nation.
  OccupationFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:OccupationFacet
    description: Occupation is a grouping of characteristics unique to the job or profession of an entity.
  UcoOrganization:
    is_a: Identity
    class_uri: uco-identity:Organization
    description: An organization is a grouping of identifying characteristics unique to a group of people
      who work together in an organized way for a shared purpose. [based on https://dictionary.cambridge.org/us/dictionary/english/organization]
    aliases:
    - Organization
  OrganizationDetailsFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:OrganizationDetailsFacet
    description: Organization details is a grouping of characteristics unique to an identity representing
      an administrative and functional structure.
  UcoPerson:
    is_a: Identity
    class_uri: uco-identity:Person
    description: A person is a grouping of identifying characteristics unique to a human being regarded
      as an individual. [based on https://www.lexico.com/en/definition/person]
    aliases:
    - Person
  PersonalDetailsFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:PersonalDetailsFacet
    description: Personal details is a grouping of characteristics unique to an identity representing
      an individual person.
  PhysicalInfoFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:PhysicalInfoFacet
    description: Physical info is a grouping of characteristics unique to the outwardly observable nature
      of an individual person.
  QualificationFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:QualificationFacet
    description: Qualification is a grouping of characteristics unique to particular skills, capabilities
      or their related achievements (educational, professional, etc.) of an entity.
  RelatedIdentityFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:RelatedIdentityFacet
    description: <Needs fleshed out from CIQ>
  SimpleNameFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:SimpleNameFacet
    description: A simple name facet is a grouping of characteristics unique to the personal name (e.g.,
      Dr. John Smith Jr.) held by an identity.
    slots:
    - familyName
    - givenName
    - honorificPrefix
    - honorificSuffix
  VisaFacet:
    is_a: IdentityFacet
    class_uri: uco-identity:VisaFacet
    description: Visa is a grouping of characteristics unique to information related to a person's ability
      to enter, leave, or stay for a specified period of time in a country.
  GranularMarking:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-marking:GranularMarking
    description: A granular marking is a grouping of characteristics unique to specification of marking
      definitions (restrictions, permissions, and other guidance for how data can be used and shared)
      that apply to particular portions of a particular UCO object.
    slots:
    - contentSelectors
    - marking
  LicenseMarking:
    is_a: MarkingModel
    class_uri: uco-marking:LicenseMarking
    title: License Marking
    description: A license marking is a grouping of characteristics unique to the expression of data marking
      definitions (restrictions, permissions, and other guidance for how data can be used and shared)
      to convey details of license restrictions that apply to the data.
    slots:
    - definitionType
    - uco_license
    slot_usage:
      definitionType:
        multivalued: true
        has_member:
          equals_string: license
  MarkingDefinition:
    is_a: MarkingDefinitionAbstraction
    class_uri: uco-marking:MarkingDefinition
    description: A marking definition is a grouping of characteristics unique to the expression of a specific
      data marking conveying restrictions, permissions, and other guidance for how marked data can be
      used and shared.
    slots:
    - uco_definition
    - definitionType
    slot_usage:
      definitionType:
        required: true
  MarkingModel:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-marking:MarkingModel
    description: A marking model is a grouping of characteristics unique to the expression of a particular
      form of data marking definitions (restrictions, permissions, and other guidance for how data can
      be used and shared).
  ReleaseToMarking:
    is_a: MarkingModel
    class_uri: uco-marking:ReleaseToMarking
    title: Release-To Marking
    description: A release-to marking is a grouping of characteristics unique to the expression of data
      marking definitions (restrictions, permissions, and other guidance for how data can be used and
      shared) to convey details of authorized persons and/or organizations to which to the associated
      content may be released. The existence of the Release-To marking restricts access to ONLY those
      identities explicitly listed, regardless of whether another data marking exists that allows sharing
      with other members of the community.
    slots:
    - authorizedIdentities
    - definitionType
    slot_usage:
      definitionType:
        multivalued: true
        has_member:
          equals_string: release-to
  StatementMarking:
    is_a: MarkingModel
    class_uri: uco-marking:StatementMarking
    title: Statement Marking
    description: A statement marking is a grouping of characteristics unique to the expression of data
      marking definitions (restrictions, permissions, and other guidance for how data can be used and
      shared) to convey details of a textual marking statement, (e.g., copyright) whose semantic meaning
      should apply to the associated content. Statement markings are generally not machine-readable. An
      example of this would be a simple marking to apply copyright information, such as 'Copyright 2014
      Acme Inc.'.
    slots:
    - definitionType
    - marking_statement
    slot_usage:
      definitionType:
        multivalued: true
        has_member:
          equals_string: statement
  TermsOfUseMarking:
    is_a: MarkingModel
    class_uri: uco-marking:TermsOfUseMarking
    title: Terms Of Use Marking
    description: A terms of use marking is a grouping of characteristics unique to the expression of data
      marking definitions (restrictions, permissions, and other guidance for how data can be used and
      shared) to convey details of a textual statement specifying the Terms of Use (that is, the conditions
      under which the content may be shared, applied, or otherwise used) of the marked content. An example
      of this would be used to communicate a simple statement, such as 'Acme Inc. is not responsible for
      the content of this file'.
    slots:
    - definitionType
    - termsOfUse
    slot_usage:
      definitionType:
        multivalued: true
        has_member:
          equals_string: terms-of-use
  LogicalPattern:
    is_a: Pattern
    class_uri: uco-pattern:LogicalPattern
    description: A logical pattern is a grouping of characteristics unique to an informational pattern
      expressed via a structured pattern expression following the rules of logic.
    slots:
    - patternExpression
  Pattern:
    is_a: UcoObject
    class_uri: uco-pattern:Pattern
    description: A pattern is a combination of properties, acts, tendencies, etc., forming a consistent
      or characteristic arrangement.
  PatternExpression:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-pattern:PatternExpression
    description: A pattern expression is a grouping of characteristics unique to an explicit logical expression
      defining a pattern (e.g., regular expression, SQL Select expression, etc.).
  BenevolentRole:
    is_a: UcoRole
    class_uri: uco-role:BenevolentRole
    description: A benevolent role is a role with positive and/or beneficial intent.
  MaliciousRole:
    is_a: UcoRole
    class_uri: uco-role:MaliciousRole
    description: A malicious role is a role with malevolent intent.
  NeutralRole:
    is_a: UcoRole
    class_uri: uco-role:NeutralRole
    description: A neutral role is a role with impartial intent.
  UcoRole:
    is_a: UcoObject
    class_uri: uco-role:Role
    description: A role is a usual or customary function based on contextual perspective.
    aliases:
    - Role
  AnalyticTool:
    is_a: Tool
    class_uri: uco-tool:AnalyticTool
    description: An analytic tool is an artifact of hardware and/or software utilized to accomplish a
      task or purpose of explanation, interpretation or logical reasoning.
  BuildFacet:
    is_a: Facet
    class_uri: uco-tool:BuildFacet
    description: A build facet is a grouping of characteristics unique to a particular version of a software.
    slots:
    - buildInformation
  BuildInformationType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-tool:BuildInformationType
    description: A build information type is a grouping of characteristics that describe how a particular
      version of software was converted from source code to executable code.
    slots:
    - buildConfiguration
    - buildID
    - buildLabel
    - buildOutputLog
    - buildProject
    - buildScript
    - buildUtility
    - buildVersion
    - compilationDate
    - compilers
    - libraries
  BuildUtilityType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-tool:BuildUtilityType
    description: A build utility type characterizes the tool used to convert from source code to executable
      code for a particular version of software.
    slots:
    - buildUtilityName
    - cpeid
    - swid
  CompilerType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-tool:CompilerType
    description: A compiler type is a grouping of characteristics unique to a specific program that translates
      computer code written in one programming language (the source language) into another language (the
      target language). Typically a program that translates source code from a high-level programming
      language to a lower-level language (e.g., assembly language, object code, or machine code) to create
      an executable program. [based on https://en.wikipedia.org/wiki/Compiler]
    slots:
    - compilerInformalDescription
    - cpeid
    - swid
  ConfiguredTool:
    is_a: Tool
    class_uri: uco-tool:ConfiguredTool
    description: A ConfiguredTool is a Tool that is known to be configured to run in a more specified
      manner than some unconfigured or less-configured Tool.
    slots:
    - isConfigurationOf
    - usesConfiguration
    slot_usage:
      isConfigurationOf:
        range: Tool
  DefensiveTool:
    is_a: Tool
    class_uri: uco-tool:DefensiveTool
    description: A defensive tool is an artifact of hardware and/or software utilized to accomplish a
      task or purpose of guarding.
  LibraryType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-tool:LibraryType
    description: A library type is a grouping of characteristics unique to a collection of resources incorporated
      into the build of a software.
    slots:
    - libraryName
    - libraryVersion
  MaliciousTool:
    is_a: Tool
    class_uri: uco-tool:MaliciousTool
    description: A malicious tool is an artifact of hardware and/or software utilized to accomplish a
      malevolent task or purpose.
  Tool:
    is_a: UcoObject
    class_uri: uco-tool:Tool
    description: A tool is an element of hardware and/or software utilized to carry out a particular function.
    slots:
    - creator
    - uco_references
    - servicePack
    - toolType
    - uco_version
  Victim:
    is_a: NeutralRole
    class_uri: uco-victim:Victim
    description: A victim is a role played by a person or organization that is/was the target of some
      malicious action.
  VictimTargeting:
    is_a: Victim
    class_uri: uco-victim:VictimTargeting
    description: A victim targeting is a grouping of characteristics unique to people or organizations
      that are the target of some malicious activity.
  ControlledDictionary:
    is_a: Dictionary
    class_uri: uco-types:ControlledDictionary
    description: A controlled dictionary is a list of (term/key, value) pairs where each term/key exists
      no more than once and is constrained to an explicitly defined set of values.
    slots:
    - entry
    slot_usage:
      entry:
        range: ControlledDictionaryEntry
  ControlledDictionaryEntry:
    is_a: DictionaryEntry
    class_uri: uco-types:ControlledDictionaryEntry
    description: A controlled dictionary entry is a single (term/key, value) pair where the term/key is
      constrained to an explicitly defined set of values.
  Hash:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-types:Hash
    description: A hash is a grouping of characteristics unique to the result of applying a mathematical
      algorithm that maps data of arbitrary size to a bit string (the 'hash') and is a one-way function,
      that is, a function which is practically infeasible to invert. This is commonly used for integrity
      checking of data. [based on https://en.wikipedia.org/wiki/Cryptographic_hash_function]
    slots:
    - hashMethod
    - hashValue
  ImproperDictionary:
    is_a: Dictionary
    class_uri: uco-types:ImproperDictionary
    description: UCO 1.5.0 declares the class uco-types:ImproperDictionary without a definition.
    disjoint_with:
    - ProperDictionary
    slots:
    - repeatsKey
  ProperDictionary:
    is_a: Dictionary
    class_uri: uco-types:ProperDictionary
    description: A proper dictionary is list of (term/key, value) pairs with each term/key existing no
      more than once.
    disjoint_with:
    - ImproperDictionary
  Thread:
    is_a: Concept
    mixins:
    - Bag
    class_uri: uco-types:Thread
    description: A semi-ordered array of items, that can be present in multiple copies. Implementation
      of a UCO Thread is similar to a Collections Ontology List, except a Thread may fork and merge -
      that is, one of its members may have two or more direct successors, and two or more direct predecessors.
    disjoint_with:
    - List
    slots:
    - id
    - item
    - threadOriginItem
    - threadTerminalItem
    slot_usage:
      item:
        range: ThreadItem
        inlined: false
        inlined_as_list: false
      threadOriginItem:
        inlined: false
        inlined_as_list: false
      threadTerminalItem:
        inlined: false
        inlined_as_list: false
  ThreadItem:
    is_a: Concept
    mixins:
    - CoItem
    class_uri: uco-types:ThreadItem
    description: A ThreadItem is a member of a thread.
    disjoint_with:
    - ListItem
    slots:
    - id
    - itemContent
    - threadNextItem
    - threadPredecessor
    - threadPreviousItem
    - threadSuccessor
    slot_usage:
      itemContent:
        range: UcoObject
        required: false
        inlined: false
  Action:
    is_a: UcoObject
    class_uri: uco-action:Action
    description: An action is something that may be done or performed.
    disjoint_with:
    - Event
    slots:
    - actionCount
    - actionStatus
    - action_endTime
    - action_object
    - action_startTime
    - environment
    - error
    - instrument
    - location
    - participant
    - performer
    - result
    - subaction
  ActionArgumentFacet:
    is_a: Facet
    class_uri: uco-action:ActionArgumentFacet
    description: An action argument facet is a grouping of characteristics unique to a single parameter
      of an action.
    slots:
    - action_value
    - argumentName
  ActionEstimationFacet:
    is_a: Facet
    class_uri: uco-action:ActionEstimationFacet
    description: An action estimation facet is a grouping of characteristics unique to decision-focused
      approximation aspects for an action that may potentially be performed.
    slots:
    - estimatedCost
    - estimatedEfficacy
    - estimatedImpact
    - objective
  ActionFrequencyFacet:
    is_a: Facet
    class_uri: uco-action:ActionFrequencyFacet
    description: An action frequency facet is a grouping of characteristics unique to the frequency of
      occurrence for an action.
    slots:
    - rate
    - scale
    - trend
    - units
  ActionLifecycle:
    is_a: Action
    class_uri: uco-action:ActionLifecycle
    description: An action lifecycle is an action pattern consisting of an ordered set of multiple actions
      or subordinate action lifecycles.
    none_of:
    - slot_conditions:
        actionCount:
          value_presence: PRESENT
    - slot_conditions:
        actionStatus:
          value_presence: PRESENT
    - slot_conditions:
        action_endTime:
          value_presence: PRESENT
    - slot_conditions:
        action_startTime:
          value_presence: PRESENT
    - slot_conditions:
        error:
          value_presence: PRESENT
    slots:
    - actionCount
    - actionStatus
    - action_endTime
    - action_startTime
    - error
    - phase
    slot_usage:
      phase:
        maximum_cardinality: 1
  ActionPattern:
    is_a: Action
    mixins:
    - Pattern
    class_uri: uco-action:ActionPattern
    description: An action pattern is a grouping of characteristics unique to a combination of actions
      forming a consistent or characteristic arrangement.
  ArrayOfAction:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-action:ArrayOfAction
    description: An array of action is an ordered list of references to things that may be done or performed.
    slots:
    - action
  Technique:
    is_a: UcoType
    class_uri: uco-action:Technique
    description: A technique is a class of actions joined by some common characteristics. The class uco-action:Technique
      is a metaclass. A Technique instance is an owl:Class that is a subclass of uco-action:Action.
    slots:
    - techniqueID
  Analysis:
    is_a: Action
    class_uri: uco-analysis:Analysis
    description: An analysis is an action of detailed examination of something in order to understand
      its nature, context or essential features.
  AnalyticResult:
    is_a: Assertion
    class_uri: uco-analysis:AnalyticResult
    description: An analytic result is a characterization of the understanding resulting from an analysis
      action.
    slots:
    - originatingAnalysis
    - resultContent
  AnalyticResultFacet:
    is_a: Facet
    class_uri: uco-analysis:AnalyticResultFacet
    description: An analytic result facet is a grouping of characteristics unique to the results of an
      analysis action.
  ArtifactClassification:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-analysis:ArtifactClassification
    description: An artifact classification is a single specific assertion that a particular class of
      a classification taxonomy applies to something.
    slots:
    - class
    - classificationConfidence
  ArtifactClassificationResultFacet:
    is_a: AnalyticResultFacet
    class_uri: uco-analysis:ArtifactClassificationResultFacet
    description: An artifact classification result facet is a grouping of characteristics unique to the
      results of an artifact classification analysis action.
    slots:
    - classification
  API:
    is_a: ObservableObject
    class_uri: uco-observable:API
    description: An API (application programming interface) is a computing interface that defines interactions
      between multiple software or mixed hardware-software intermediaries. It defines the kinds of calls
      or requests that can be made, how to make them, the data formats that should be used, the conventions
      to follow, etc. [based on https://en.wikipedia.org/wiki/API]
  ARPCache:
    is_a: ObservableObject
    class_uri: uco-observable:ARPCache
    description: An ARP cache is a collection of Address Resolution Protocol (ARP) entries (mostly dynamic)
      that are created when an IP address is resolved to a MAC address (so the computer can effectively
      communicate with the IP address). [based on https://en.wikipedia.org/wiki/ARP_cache]
  ARPCacheEntry:
    is_a: ObservableObject
    class_uri: uco-observable:ARPCacheEntry
    description: An ARP cache entry is a single Address Resolution Protocol (ARP) response record that
      is created when an IP address is resolved to a MAC address (so the computer can effectively communicate
      with the IP address). [based on https://en.wikipedia.org/wiki/ARP_cache]
  Account:
    is_a: ObservableObject
    class_uri: uco-observable:Account
    description: An account is an arrangement with an entity to enable and control the provision of some
      capability or service.
  AccountAuthenticationFacet:
    is_a: Facet

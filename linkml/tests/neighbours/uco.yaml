    slots:
    - targetFile
  TCPConnection:
    is_a: NetworkConnection
    class_uri: uco-observable:TCPConnection
    description: A TCP connection is a network connection that is conformant to the Transfer
  TCPConnectionFacet:
    is_a: Facet
    class_uri: uco-observable:TCPConnectionFacet

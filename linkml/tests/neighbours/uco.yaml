    description: An account authentication facet is a grouping of characteristics unique to the mechanism
      of accessing an account.
    slots:
    - password
    - passwordLastChanged
    - passwordType
  AccountFacet:
    is_a: Facet
    class_uri: uco-observable:AccountFacet
    description: An account facet is a grouping of characteristics unique to an arrangement with an entity
      to enable and control the provision of some capability or service.
    slots:
    - accountIdentifier
    - accountIssuer
    - accountType
    - expirationTime
    - isActive

    - profileBackgroundLocation
    - profileBannerHash
    - profileBannerLocation
    - profileImageHash
    - profileImageLocation
    - profileIsProtected
    - profileIsVerified
    - statusesCount
    - twitterHandle
    - twitterId
    - userLocationString
  UNIXAccount:
    is_a: DigitalAccount
    class_uri: uco-observable:UNIXAccount
    description: A UNIX account is an account on a UNIX operating system.
  UNIXAccountFacet:
    is_a: Facet
    class_uri: uco-observable:UNIXAccountFacet
    description: A UNIX account facet is a grouping of characteristics unique to an account on a UNIX
      operating system.

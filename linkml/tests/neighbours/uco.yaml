types:
  uco_base64_binary:
    typeof: string
    base: str
    uri: xsd:base64Binary
    description: 'XSD''s base64Binary: binary data in the Base64 alphabet, padded with =.'
    pattern: ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
  uco_byte:
    typeof: integer
    base: int
    uri: xsd:byte
    description: 'XSD''s byte: an integer from -128 to 127.'
    minimum_value: -128
    maximum_value: 127
  uco_duration:
    typeof: string
    base: str
    uri: xsd:duration
    description: 'XSD''s duration: a length of time such as P1DT2H, in ISO 8601''s form.'
    pattern: ^-?P(?!$)(\d+Y)?(\d+M)?(\d+D)?(T(?!$)(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$
  uco_hex_binary:
    typeof: string
    base: str
    uri: xsd:hexBinary
    description: 'XSD''s hexBinary: binary data as pairs of hexadecimal digits.'
    pattern: ^([0-9a-fA-F]{2})*$
  uco_non_negative_integer:
    typeof: integer
    base: int
    uri: xsd:nonNegativeInteger
    description: 'XSD''s nonNegativeInteger: an integer of zero or more.'
    minimum_value: 0
  uco_positive_integer:
    typeof: integer
    base: int
    uri: xsd:positiveInteger
    description: 'XSD''s positiveInteger: an integer of one or more.'
    minimum_value: 1
  uco_unsigned_int:
    typeof: integer
    base: int
    uri: xsd:unsignedInt
    description: 'XSD''s unsignedInt: an integer from 0 to 4294967295.'
    minimum_value: 0
    maximum_value: 4294967295
  uco_unsigned_short:
    typeof: integer
    base: int
    uri: xsd:unsignedShort
    description: 'XSD''s unsignedShort: an integer from 0 to 65535.'
    minimum_value: 0
    maximum_value: 65535
  Time:
    typeof: string
    base: str
    uri: uco-time:Time
    description: UCO 1.5.0 declares the datatype uco-time:Time without a definition.
  TimeRange:
    typeof: string
    base: str
    uri: uco-time:TimeRange
    description: UCO 1.5.0 declares the datatype uco-time:TimeRange without a definition.
  Timestamp:
    typeof: string
    base: str
    uri: uco-time:Timestamp
    description: UCO 1.5.0 declares the datatype uco-time:Timestamp without a definition.
  Identifier:
    typeof: string
    base: str
    uri: uco-types:Identifier
    description: An identifier is a string conformant to the specified UUID-based format for UCO object
      identifiers.
  NativeFormatString:
    typeof: string
    base: str
    uri: uco-types:NativeFormatString
    description: Specifies data in its native format of some external language. The data may be encoded
      in Base64 per [RFC4648]. Data encoded in Base64 must be denoted as such using the encoded property.
  StructuredText:
    typeof: string
    base: str
    uri: uco-types:StructuredText
    description: Expresses string-based data in some information structuring format (e.g., HTML5).
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: UcoObject, UcoType, Thread, ThreadItem;
  dropped for LOKF''s: id, type; renamed, IRIs unchanged: Organization -> UcoOrganization, Person -> UcoPerson,
  Role -> UcoRole, context -> uco_context, description -> uco_description, name -> uco_name, source ->
  uco_source, target -> uco_target, definition -> uco_definition, license -> uco_license, references ->
  uco_references, version -> uco_version, abbreviation -> uco_abbreviation, body -> uco_body, checksum
  -> uco_checksum, from -> uco_from, parameters -> uco_parameters, status -> uco_status, to -> uco_to,
  url -> uco_url.'

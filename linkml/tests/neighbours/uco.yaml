    - iEmailAction
    - iExecAction
    - iShowMessageAction
  TriggerType:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:TriggerType
    description: A trigger type is a grouping of characterizes unique to a set of criteria that, when
      met, starts the execution of a task within a Windows operating system. [based on https://docs.microsoft.com/en-us/windows/win32/taskschd/task-triggers]
    slots:

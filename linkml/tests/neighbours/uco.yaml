    - sid
  NTFSFilePermissionsFacet:
    is_a: Facet
    class_uri: uco-observable:NTFSFilePermissionsFacet
    description: An NTFS file permissions facet is a grouping of characteristics unique to the access
      rights (e.g., view, change, navigate, execute) of a file on an NTFS (new technology filesystem)
      file system.
  NamedPipe:
    is_a: FileSystemObject
    class_uri: uco-observable:NamedPipe
    description: A named pipe is a mechanism for FIFO (first-in-first-out) inter-process communication.
      It is persisted as a filesystem object (that can be deleted like any other file), can be written
      to or read from by any process and exists beyond the lifespan of any process interacting with it
      (unlike simple anonymous pipes). [based on https://en.wikipedia.org/wiki/Named_pipe]
  NetworkAppliance:
    is_a: Appliance
    class_uri: uco-observable:NetworkAppliance
    description: A network appliance is a purpose-built computer with software or firmware that is designed
      to provide a specific network management function.
  NetworkConnection:
    is_a: ObservableObject
    class_uri: uco-observable:NetworkConnection
    description: A network connection is a connection (completed or attempted) across a digital network
      (a group of two or more computer systems linked together). [based on https://www.webopedia.com/TERM/N/network.html]
  NetworkConnectionFacet:
    is_a: Facet
    class_uri: uco-observable:NetworkConnectionFacet
    description: A network connection facet is a grouping of characteristics unique to a connection (complete
      or attempted) accross a digital network (a group of two or more computer systems linked together).
      [based on https://www.webopedia.com/TERM/N/network.html]
    slots:
    - destinationPort
    - dst
    - isActive
    - observable_endTime
    - observable_startTime
    - protocols
    - sourcePort
    - src
  NetworkFlow:
    is_a: ObservableObject
    class_uri: uco-observable:NetworkFlow
    description: A network flow is a sequence of data transiting one or more digital network (a group
      or two or more computer systems linked together) connections. [based on https://www.webopedia.com/TERM/N/network.html]
  NetworkFlowFacet:
    is_a: Facet
    class_uri: uco-observable:NetworkFlowFacet
    description: A network flow facet is a grouping of characteristics unique to a sequence of data transiting
      one or more digital network (a group of two or more computer systems linked together) connections.
      [based on https://www.webopedia.com/TERM/N/network.html]
    slots:
    - dstBytes
    - dstPackets
    - dstPayload
    - ipfix
    - srcBytes
    - srcPackets
    - srcPayload
  NetworkInterface:
    is_a: ObservableObject
    class_uri: uco-observable:NetworkInterface
    description: A network interface is a software or hardware interface between two pieces of equipment
      or protocol layers in a computer network.
  NetworkInterfaceFacet:
    is_a: Facet
    class_uri: uco-observable:NetworkInterfaceFacet
    description: A network interface facet is a grouping of characteristics unique to a software or hardware
      interface between two pieces of equipment or protocol layers in a computer network.
    slots:
    - adapterName
    - dhcpLeaseExpires
    - dhcpLeaseObtained
    - dhcpServer
    - ip
    - ipGateway
    - macAddress
  NetworkProtocol:
    is_a: ObservableObject
    class_uri: uco-observable:NetworkProtocol
    description: A network protocol is an established set of structured rules that determine how data
      is transmitted between different devices in the same network. Essentially, it allows connected devices
      to communicate with each other, regardless of any differences in their internal processes, structure
      or design. [based on https://www.comptia.org/content/guides/what-is-a-network-protocol]
  NetworkRoute:
    is_a: ObservableObject
    class_uri: uco-observable:NetworkRoute
    description: A network route is a specific path (of specific network nodes, connections and protocols)
      for traffic in a network or between or across multiple networks.
  NetworkSubnet:
    is_a: ObservableObject
    class_uri: uco-observable:NetworkSubnet
    description: A network subnet is a logical subdivision of an IP network. [based on https://en.wikipedia.org/wiki/Subnetwork]
  Note:
    is_a: ObservableObject
    class_uri: uco-observable:Note
    description: A note is a brief textual record.
  NoteFacet:
    is_a: Facet
    class_uri: uco-observable:NoteFacet
    description: A note facet is a grouping of characteristics unique to a brief textual record.
    slots:
    - application
    - observableCreatedTime
    - observable_modifiedTime
    - text
  Observable:
    is_a: UcoObject
    class_uri: uco-observable:Observable
    description: An observable is a characterizable item or action within the digital domain.
  ObservableAction:
    is_a: Observable
    mixins:
    - Action
    class_uri: uco-observable:ObservableAction
    description: An observable action is a grouping of characteristics unique to something that may be
      done or performed within the digital domain.
  ObservableObject:
    is_a: Observable
    mixins:
    - Item
    class_uri: uco-observable:ObservableObject
    description: An observable object is a grouping of characteristics unique to a distinct article or
      unit within the digital domain.
    slots:
    - hasChanged
    - state
  ObservablePattern:
    is_a: Observable
    class_uri: uco-observable:ObservablePattern
    description: An observable pattern is a grouping of characteristics unique to a logical pattern composed
      of observable object and observable action properties.
  ObservableRelationship:
    is_a: Observable
    mixins:
    - Relationship
    class_uri: uco-observable:ObservableRelationship
    description: An observable relationship is a grouping of characteristics unique to an assertion of
      an association between two observable objects.
  Observation:
    is_a: Action
    class_uri: uco-observable:Observation
    description: An observation is a temporal perception of an observable.
    slots:
    - uco_name
    slot_usage:
      uco_name:
        required: true
        equals_string: observe
  OnlineService:
    is_a: ObservableObject
    class_uri: uco-observable:OnlineService
    description: An online service is a particular provision mechanism of information access, distribution
      or manipulation over the Internet.
  OnlineServiceFacet:
    is_a: Facet
    class_uri: uco-observable:OnlineServiceFacet
    description: An online service facet is a grouping of characteristics unique to a particular provision
      mechanism of information access, distribution or manipulation over the Internet.
    slots:
    - inetLocation
    - uco_name
    - observable_location
    slot_usage:
      observable_location:
        multivalued: true
  OperatingSystem:
    is_a: ObservableObject
    class_uri: uco-observable:OperatingSystem
    description: An operating system is the software that manages computer hardware, software resources,
      and provides common services for computer programs. [based on https://en.wikipedia.org/wiki/Operating_system]
  OperatingSystemFacet:
    is_a: Facet
    class_uri: uco-observable:OperatingSystemFacet
    description: An operating system facet is a grouping of characteristics unique to the software that
      manages computer hardware, software resources, and provides common services for computer programs.
      [based on https://en.wikipedia.org/wiki/Operating_system]
    slots:
    - advertisingID
    - bitness
    - environmentVariables
    - installDate
    - isLimitAdTrackingEnabled
    - manufacturer
    - observable_version
  PDFFile:
    is_a: File
    class_uri: uco-observable:PDFFile
    description: A PDF file is a Portable Document Format (PDF) file.
  PDFFileFacet:
    is_a: Facet
    class_uri: uco-observable:PDFFileFacet
    description: A PDF file facet is a grouping of characteristics unique to a PDF (Portable Document
      Format) file.
    slots:
    - documentInformationDictionary
    - isOptimized
    - observable_version
    - pdfCreationDate
    - pdfId0
    - pdfId1
    - pdfModDate
  PathRelationFacet:
    is_a: Facet
    class_uri: uco-observable:PathRelationFacet
    description: A path relation facet is a grouping of characteristics unique to the location of one
      object within another containing object.
    slots:
    - path
    slot_usage:
      path:
        multivalued: true
  PaymentCard:
    is_a: ObservableObject
    class_uri: uco-observable:PaymentCard
    description: A payment card is a physical token that is part of a payment system issued by financial
      institutions, such as a bank, to a customer that enables its owner (the cardholder) to access the
      funds in the customer's designated bank accounts, or through a credit account and make payments
      by electronic funds transfer and access automated teller machines (ATMs). [based on https://en.wikipedia.org/wiki/Payment_card]
  PhoneAccount:
    is_a: DigitalAccount
    class_uri: uco-observable:PhoneAccount
    description: A phone account is an arrangement with an entity to enable and control the provision
      of a telephony capability or service.
  PhoneAccountFacet:
    is_a: Facet
    class_uri: uco-observable:PhoneAccountFacet
    description: A phone account facet is a grouping of characteristics unique to an arrangement with
      an entity to enable and control the provision of a telephony capability or service.
    slots:
    - phoneNumber
  Pipe:
    is_a: ObservableObject
    class_uri: uco-observable:Pipe
    description: A pipe is a mechanism for one-way inter-process communication using message passing where
      data written by one process is buffered by the operating system until it is read by the next process,
      and this uni-directional channel disappears when the processes are completed. [based on https://en.wikipedia.org/wiki/Pipeline_(Unix)
      ; https://en.wikipedia.org/wiki/Anonymous_pipe]
  Post:
    is_a: Message
    class_uri: uco-observable:Post
    description: A post is message submitted to an online discussion/publishing site (forum, blog, etc.).
  Process:
    is_a: ObservableObject
    class_uri: uco-observable:Process
    description: A process is an instance of a computer program executed on an operating system.
  ProcessFacet:
    is_a: Facet
    class_uri: uco-observable:ProcessFacet
    description: A process facet is a grouping of characteristics unique to an instance of a computer
      program executed on an operating system.
    slots:
    - arguments
    - binary
    - creatorUser
    - currentWorkingDirectory
    - environmentVariables
    - exitStatus
    - exitTime
    - isHidden
    - observableCreatedTime
    - parent
    - pid
    - uco_status
  ProcessThread:
    is_a: ObservableObject
    class_uri: uco-observable:ProcessThread
    description: A process thread is the smallest sequence of programmed instructions that can be managed
      independently by a scheduler on a computer, which is typically a part of the operating system. It
      is a component of a process. Multiple threads can exist within one process, executing concurrently
      and sharing resources such as memory, while different processes do not share these resources. In
      particular, the threads of a process share its executable code and the values of its dynamically
      allocated variables and non-thread-local global variables at any given time. [based on https://en.wikipedia.org/wiki/Thread_(computing)]
  Profile:
    is_a: ObservableObject
    class_uri: uco-observable:Profile
    description: A profile is an explicit digital representation of identity and characteristics of the
      owner of a single user account associated with an online service or application. [based on https://en.wikipedia.org/wiki/User_profile]
  ProfileFacet:
    is_a: Facet
    class_uri: uco-observable:ProfileFacet
    description: A profile facet is a grouping of characteristics unique to an explicit digital representation
      of identity and characteristics of the owner of a single user account associated with an online
      service or application. [based on https://en.wikipedia.org/wiki/User_profile]
    slots:
    - contactAddress
    - contactEmail
    - contactMessaging
    - contactPhone
    - contactURL
    - displayName
    - uco_name
    - profileAccount
    - profileCreated
    - profileIdentity
    - profileLanguage
    - profileService
    - profileWebsite
  PropertiesEnumeratedEffectFacet:
    is_a: DefinedEffectFacet
    class_uri: uco-observable:PropertiesEnumeratedEffectFacet
    description: A properties enumerated effect facet is a grouping of characteristics unique to the effects
      of actions upon observable objects where a characteristic of the observable object is enumerated.
      An example of this would be startup parameters for a process.
    slots:
    - properties
  PropertyReadEffectFacet:
    is_a: DefinedEffectFacet
    class_uri: uco-observable:PropertyReadEffectFacet
    description: A properties read effect facet is a grouping of characteristics unique to the effects
      of actions upon observable objects where a characteristic is read from an observable object. An
      example of this would be the current running state of a process.
    slots:
    - observable_value
    - propertyName
  ProtocolConverter:
    is_a: Device
    class_uri: uco-observable:ProtocolConverter
    description: A protocol converter is a device that converts from one protocol to another (e.g. SD
      to USB, SATA to USB, etc.
  RasterPicture:
    is_a: File
    class_uri: uco-observable:RasterPicture
    description: A raster picture is a raster (or bitmap) image.
  RasterPictureFacet:
    is_a: Facet
    class_uri: uco-observable:RasterPictureFacet
    description: A raster picture facet is a grouping of characteristics unique to a raster (or bitmap)
      image.
    slots:
    - bitsPerPixel
    - camera
    - imageCompressionMethod
    - pictureHeight
    - pictureType
    - pictureWidth
  RecoveredObject:
    is_a: ObservableObject
    class_uri: uco-observable:RecoveredObject
    description: An observable object that was the result of a recovery operation.
  RecoveredObjectFacet:
    is_a: Facet
    class_uri: uco-observable:RecoveredObjectFacet
    description: Recoverability status of name, metadata, and content.
    slots:
    - contentRecoveredStatus
    - metadataRecoveredStatus
    - nameRecoveredStatus
  ReparsePoint:
    is_a: FileSystemObject
    class_uri: uco-observable:ReparsePoint
    description: A reparse point is a type of NTFS (New Technology File System) object which is an optional
      attribute of files and directories meant to define some sort of preprocessing before accessing the
      said file or directory. For instance reparse points can be used to redirect access to files which
      have been moved to long term storage so that some application would retrieve them and make them
      directly accessible. A reparse point contains a reparse tag and data that are interpreted by a filesystem
      filter identified by the tag. [based on https://jp-andre.pagesperso-orange.fr/junctions.html ; https://en.wikipedia.org/wiki/NTFS_reparse_point]
  SIMCard:
    is_a: Device
    class_uri: uco-observable:SIMCard
    description: A SIM card is a subscriber identification module card intended to securely store the
      international mobile subscriber identity (IMSI) number and its related key, which are used to identify
      and authenticate subscribers on mobile telephony. [based on https://en.wikipedia.org/wiki/SIM_card]
  SIMCardFacet:
    is_a: Facet
    class_uri: uco-observable:SIMCardFacet
    description: A SIM card facet is a grouping of characteristics unique to a subscriber identification
      module card intended to securely store the international mobile subscriber identity (IMSI) number
      and its related key, which are used to identify and authenticate subscribers on mobile telephony
      devices (such as mobile phones and computers). [based on https://en.wikipedia.org/wiki/SIM_card]
    slots:
    - ICCID
    - IMSI
    - PIN
    - PUK
    - SIMForm
    - SIMType
    - carrier
    - storageCapacityInBytes
  SIPAddress:
    is_a: DigitalAddress
    class_uri: uco-observable:SIPAddress
    description: A SIP address is an identifier for Session Initiation Protocol (SIP) communication.
  SIPAddressFacet:
    is_a: DigitalAddressFacet
    class_uri: uco-observable:SIPAddressFacet
    description: A SIP address facet is a grouping of characteristics unique to a Session Initiation Protocol
      (SIP) standards conformant identifier assigned to a user to enable routing and management of SIP
      standards conformant communication to or from that user loosely coupled from any particular devices.
  SMSMessage:
    is_a: Message
    class_uri: uco-observable:SMSMessage
    description: An SMS message is a message conformant to the short message service (SMS) communication
      protocol standards.
  SMSMessageFacet:
    is_a: Facet
    class_uri: uco-observable:SMSMessageFacet
    description: A SMS message facet is a grouping of characteristics unique to a message conformant to
      the short message service (SMS) communication protocol standards.
    slots:
    - isRead
  SQLiteBlob:
    is_a: ObservableObject
    class_uri: uco-observable:SQLiteBlob
    description: An SQLite blob is a blob (binary large object) of data within an SQLite database. [based
      on https://en.wikipedia.org/wiki/SQLite]
  SQLiteBlobFacet:
    is_a: Facet
    class_uri: uco-observable:SQLiteBlobFacet
    description: An SQLite blob facet is a grouping of characteristics unique to a blob (binary large
      object) of data within an SQLite database. [based on https://en.wikipedia.org/wiki/SQLite]
    slots:
    - columnName
    - rowCondition
    - rowIndex
    - tableName
  SecurityAppliance:
    is_a: Appliance
    class_uri: uco-observable:SecurityAppliance

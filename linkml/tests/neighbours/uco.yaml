  URLHistory:
    is_a: ObservableObject
    class_uri: uco-observable:URLHistory
    description: A URL history characterizes the stored URL history for a particular web browser
  URLHistoryEntry:
    is_a: UcoInherentCharacterizationThing
    class_uri: uco-observable:URLHistoryEntry
    title: URL History Entry
    description: A URL history entry is a grouping of characteristics unique to the properties of a single
      URL history entry for a particular browser.
    slots:

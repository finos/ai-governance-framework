name: spdx
title: System Package Data Exchange (SPDX)
description: 'A LinkML rendering of the SPDX 3.0.1 model: its nine profiles, each a module, with every
  class, property and vocabulary keeping its SPDX IRI.'
version: 3.0.1
source: https://spdx.org/rdf/3.0.1/spdx-model.ttl
license: Apache-2.0
see_also:
- https://lmodel.github.io/spdx
- https://spdx.github.io/spdx-spec/v3.0.1/
- https://spdx.dev/specifications/
comments:
- scripts/spdx_to_linkml.py writes every YAML file in this folder from the vendored model, upstream/spdx-model.ttl.
  Change the script or the model, never the files.
- spdx_core imports only the LinkML types, each profile module imports the modules it references, and
  this file adds nothing of its own, so an importer can import one profile alone.
- The element descriptions are the model's rdfs:comment texts, which the SPDX Project publishes under
  the Community Specification License 1.0.
- The model's individuals (NoAssertionElement, NoneElement, NoAssertionLicense, NoneLicense and SpdxOrganization)
  are instance data, not schema. A reference to one is an IRI like any other Element reference.

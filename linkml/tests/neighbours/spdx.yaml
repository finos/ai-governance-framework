    in_subset:
    - spdx_expanded_licensing
  isOsiApproved:
    description: Specifies whether the License is listed as approved by the Open Source Initiative (OSI).
    slot_uri: spdx_expanded_licensing:isOsiApproved
    range: boolean
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/isOsiApproved/
    in_subset:
    - spdx_expanded_licensing
  licenseXml:
    description: Identifies all the text and metadata associated with a license in the license XML format.
    slot_uri: spdx_expanded_licensing:licenseXml
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/licenseXml/
    in_subset:
    - spdx_expanded_licensing
  listVersionAdded:
    description: Specifies the SPDX License List version in which this ListedLicense or ListedLicenseException
      identifier was first added.
    slot_uri: spdx_expanded_licensing:listVersionAdded
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/listVersionAdded/
    in_subset:
    - spdx_expanded_licensing
  member:
    description: A license expression participating in a license set.
    slot_uri: spdx_expanded_licensing:member
    range: AnyLicenseInfo
    required: true
    multivalued: true
    minimum_cardinality: 2
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/member/
    in_subset:
    - spdx_expanded_licensing
  obsoletedBy:
    description: Specifies the licenseId that is preferred to be used in place of a deprecated License
      or LicenseAddition.
    slot_uri: spdx_expanded_licensing:obsoletedBy
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/obsoletedBy/
    in_subset:
    - spdx_expanded_licensing
  seeAlso:
    description: Contains a URL where the License or LicenseAddition can be found in use.
    slot_uri: spdx_expanded_licensing:seeAlso
    range: uri
    multivalued: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/seeAlso/
    in_subset:
    - spdx_expanded_licensing
  standardAdditionTemplate:
    description: Identifies the full text of a LicenseAddition, in SPDX templating format.
    slot_uri: spdx_expanded_licensing:standardAdditionTemplate
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/standardAdditionTemplate/
    in_subset:
    - spdx_expanded_licensing
  standardLicenseHeader:
    description: Provides a License author's preferred text to indicate that a file is covered by the
      License.
    slot_uri: spdx_expanded_licensing:standardLicenseHeader
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/standardLicenseHeader/
    in_subset:
    - spdx_expanded_licensing
  standardLicenseTemplate:
    description: Identifies the full text of a License, in SPDX templating format.
    slot_uri: spdx_expanded_licensing:standardLicenseTemplate
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/standardLicenseTemplate/
    in_subset:
    - spdx_expanded_licensing
  subjectAddition:
    description: A LicenseAddition participating in a 'with addition' model.
    slot_uri: spdx_expanded_licensing:subjectAddition
    range: LicenseAddition
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/subjectAddition/
    in_subset:
    - spdx_expanded_licensing
  subjectExtendableLicense:
    description: A License participating in a 'with addition' model.
    slot_uri: spdx_expanded_licensing:subjectExtendableLicense
    range: ExtendableLicense
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/subjectExtendableLicense/
    in_subset:
    - spdx_expanded_licensing
  subjectLicense:
    description: A License participating in an 'or later' model.
    slot_uri: spdx_expanded_licensing:subjectLicense
    range: License
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/ExpandedLicensing/Properties/subjectLicense/
    in_subset:
    - spdx_expanded_licensing
  actionStatement:
    description: Provides advise on how to mitigate or remediate a vulnerability when a VEX product is
      affected by it.
    slot_uri: spdx_security:actionStatement
    range: string
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/actionStatement/
    in_subset:
    - spdx_security
  actionStatementTime:
    description: Records the time when a recommended action was communicated in a VEX statement to mitigate
      a vulnerability.
    slot_uri: spdx_security:actionStatementTime
    range: date_time_stamp
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/actionStatementTime/
    in_subset:
    - spdx_security
  assessedElement:
    description: Specifies an Element contained in a piece of software where a vulnerability was found.
    slot_uri: spdx_security:assessedElement
    range: SoftwareArtifact
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/assessedElement/
    in_subset:
    - spdx_security
  catalogType:
    description: Specifies the exploit catalog type.
    slot_uri: spdx_security:catalogType
    range: ExploitCatalogType
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/catalogType/
    in_subset:
    - spdx_security
  decisionType:
    description: Provide the enumeration of possible decisions in the [Stakeholder-Specific Vulnerability
      Categorization (SSVC) decision tree](https://www.cisa.gov/stakeholder-specific-vulnerability-categorization-ssvc).
    slot_uri: spdx_security:decisionType
    range: SsvcDecisionType
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/decisionType/
    in_subset:
    - spdx_security
  exploited:
    description: Describe that a CVE is known to have an exploit because it's been listed in an exploit
      catalog.
    slot_uri: spdx_security:exploited
    range: boolean
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/exploited/
    in_subset:
    - spdx_security
  impactStatement:
    description: Explains why a VEX product is not affected by a vulnerability. It is an alternative in
      VexNotAffectedVulnAssessmentRelationship to the machine-readable justification label.
    slot_uri: spdx_security:impactStatement
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/impactStatement/
    in_subset:
    - spdx_security
  impactStatementTime:
    description: Timestamp of impact statement.
    slot_uri: spdx_security:impactStatementTime
    range: date_time_stamp
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/impactStatementTime/
    in_subset:
    - spdx_security
  justificationType:
    description: Impact justification label to be used when linking a vulnerability to an element representing
      a VEX product with a VexNotAffectedVulnAssessmentRelationship relationship.
    slot_uri: spdx_security:justificationType
    range: VexJustificationType
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/justificationType/
    in_subset:
    - spdx_security
  modifiedTime:
    description: Specifies a time when a vulnerability assessment was modified
    slot_uri: spdx_security:modifiedTime
    range: date_time_stamp
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/modifiedTime/
    in_subset:
    - spdx_security
  percentile:
    description: The percentile of the current probability score.
    slot_uri: spdx_security:percentile
    range: decimal
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/percentile/
    in_subset:
    - spdx_security
  probability:
    description: A probability score between 0 and 1 of a vulnerability being exploited.
    slot_uri: spdx_security:probability
    range: decimal
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/probability/
    in_subset:
    - spdx_security
  publishedTime:
    description: Specifies the time when a vulnerability was published.
    slot_uri: spdx_security:publishedTime
    range: date_time_stamp
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/publishedTime/
    in_subset:
    - spdx_security
  score:
    description: Provides a numerical (0-10) representation of the severity of a vulnerability.
    slot_uri: spdx_security:score
    range: decimal
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/score/
    in_subset:
    - spdx_security
  security_locator:
    description: Provides the location of an exploit catalog.
    slot_uri: spdx_security:locator
    range: uri
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/locator/
    in_subset:
    - spdx_security
  severity:
    description: Specifies the CVSS qualitative severity rating of a vulnerability in relation to a piece
      of software.
    slot_uri: spdx_security:severity
    range: CvssSeverityType
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/severity/
    in_subset:
    - spdx_security
  statusNotes:
    description: Conveys information about how VEX status was determined.
    slot_uri: spdx_security:statusNotes
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/statusNotes/
    in_subset:
    - spdx_security
  vectorString:
    description: Specifies the CVSS vector string for a vulnerability.
    slot_uri: spdx_security:vectorString
    range: string
    required: true
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/vectorString/
    in_subset:
    - spdx_security
  vexVersion:
    description: Specifies the version of a VEX statement.
    slot_uri: spdx_security:vexVersion
    range: string
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/vexVersion/
    in_subset:
    - spdx_security
  withdrawnTime:
    description: Specified the time and date when a vulnerability was withdrawn.
    slot_uri: spdx_security:withdrawnTime
    range: date_time_stamp
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/withdrawnTime/
    in_subset:
    - spdx_security
enums:
  AnnotationType:
    enum_uri: spdx_core:AnnotationType
    description: Specifies the type of an annotation.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/AnnotationType/
    in_subset:
    - spdx_core
    permissible_values:
      other:
        description: Used to store extra information about an Element which is not part of a review (e.g.
          extra information provided during the creation of the Element).
        meaning: spdx_core:AnnotationType/other
      review:
        description: Used when someone reviews the Element.
        meaning: spdx_core:AnnotationType/review
  ExternalIdentifierType:
    enum_uri: spdx_core:ExternalIdentifierType
    description: Specifies the type of an external identifier.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/ExternalIdentifierType/
    in_subset:
    - spdx_core
    permissible_values:
      cpe22:
        description: '[Common Platform Enumeration Specification 2.2](https://cpe.mitre.org/files/cpe-specification_2.2.pdf)'
        meaning: spdx_core:ExternalIdentifierType/cpe22
      cpe23:
        description: '[Common Platform Enumeration: Naming Specification Version 2.3](https://csrc.nist.gov/publications/detail/nistir/7695/final)'
        meaning: spdx_core:ExternalIdentifierType/cpe23
      cve:
        description: Common Vulnerabilities and Exposures identifiers, an identifier for a specific software
          flaw defined within the official CVE Dictionary and that conforms to the [CVE specification](https://csrc.nist.gov/glossary/term/cve_id).
        meaning: spdx_core:ExternalIdentifierType/cve
      email:
        description: Email address, as defined in [RFC 3696](https://datatracker.ietf.org/doc/rfc3986/)
          Section 3.
        meaning: spdx_core:ExternalIdentifierType/email
      gitoid:
        description: '[Gitoid](https://www.iana.org/assignments/uri-schemes/prov/gitoid), stands for [Git
          Object ID](https://git-scm.com/book/en/v2/Git-Internals-Git-Objects). A gitoid of type blob
          is a unique hash of a binary artifact. A gitoid may represent either an [Artifact Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-identifier-types)
          for the software artifact or an [Input Manifest Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#input-manifest-identifier)
          for the software artifact''s associated [Artifact Input Manifest](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-input-manifest);
          this ambiguity exists because the Artifact Input Manifest is itself an artifact, and the gitoid
          of that artifact is its valid identifier. Gitoids calculated on software artifacts (Snippet,
          File, or Package Elements) should be recorded in the SPDX 3.0 SoftwareArtifact''s contentIdentifier
          property. Gitoids calculated on the Artifact Input Manifest (Input Manifest Identifier) should
          be recorded in the SPDX 3.0 Element''s externalIdentifier property. See [OmniBOR Specification](https://github.com/omnibor/spec/),
          a minimalistic specification for describing software [Artifact Dependency Graphs](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-dependency-graph-adg).'
        meaning: spdx_core:ExternalIdentifierType/gitoid
      other:
        description: Used when the type does not match any of the other options.
        meaning: spdx_core:ExternalIdentifierType/other
      packageUrl:
        description: Package URL, as defined in the corresponding [Annex](https://spdx.github.io/spdx-spec/v3.0.1/annexes/pkg-url-specification/)
          of this specification.
        meaning: spdx_core:ExternalIdentifierType/packageUrl
      securityOther:
        description: Used when there is a security related identifier of unspecified type.
        meaning: spdx_core:ExternalIdentifierType/securityOther
      swhid:
        description: SoftWare Hash IDentifier, a persistent intrinsic identifier for digital artifacts,
          such as files, trees (also known as directories or folders), commits, and other objects typically
          found in version control systems. The format of the identifiers is defined in the [SWHID specification](https://www.swhid.org/specification/v1.1/4.Syntax)
          (ISO/IEC DIS 18670). They typically look like `swh:1:cnt:94a9ed024d3859793618152ea559a168bbcbb5e2`.
        meaning: spdx_core:ExternalIdentifierType/swhid
      swid:
        description: Concise Software Identification (CoSWID) tag, as defined in [RFC 9393](https://datatracker.ietf.org/doc/rfc9393/)
          Section 2.3.
        meaning: spdx_core:ExternalIdentifierType/swid
      urlScheme:
        description: '[Uniform Resource Identifier (URI) Schemes](https://www.iana.org/assignments/uri-schemes/uri-schemes.xhtml).
          The scheme used in order to locate a resource.'
        meaning: spdx_core:ExternalIdentifierType/urlScheme
  ExternalRefType:
    enum_uri: spdx_core:ExternalRefType
    description: Specifies the type of an external reference.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/ExternalRefType/
    in_subset:
    - spdx_core
    permissible_values:
      altDownloadLocation:
        description: A reference to an alternative download location.
        meaning: spdx_core:ExternalRefType/altDownloadLocation
      altWebPage:
        description: A reference to an alternative web page.
        meaning: spdx_core:ExternalRefType/altWebPage
      binaryArtifact:
        description: A reference to binary artifacts related to a package.
        meaning: spdx_core:ExternalRefType/binaryArtifact
      bower:
        description: A reference to a Bower package. The package locator format, looks like `package#version`,
          is defined in the "install" section of [Bower API documentation](https://bower.io/docs/api/#install).
        meaning: spdx_core:ExternalRefType/bower
      buildMeta:
        description: A reference build metadata related to a published package.
        meaning: spdx_core:ExternalRefType/buildMeta
      buildSystem:
        description: A reference build system used to create or publish the package.
        meaning: spdx_core:ExternalRefType/buildSystem
      certificationReport:
        description: A reference to a certification report for a package from an accredited/independent
          body.
        meaning: spdx_core:ExternalRefType/certificationReport
      chat:
        description: A reference to the instant messaging system used by the maintainer for a package.
        meaning: spdx_core:ExternalRefType/chat
      componentAnalysisReport:
        description: A reference to a Software Composition Analysis (SCA) report.
        meaning: spdx_core:ExternalRefType/componentAnalysisReport
      cwe:
        description: '[Common Weakness Enumeration](https://csrc.nist.gov/glossary/term/common_weakness_enumeration).
          A reference to a source of software flaw defined within the official [CWE List](https://cwe.mitre.org/data/)
          that conforms to the [CWE specification](https://cwe.mitre.org/).'
        meaning: spdx_core:ExternalRefType/cwe
      documentation:
        description: A reference to the documentation for a package.
        meaning: spdx_core:ExternalRefType/documentation
      dynamicAnalysisReport:
        description: A reference to a dynamic analysis report for a package.
        meaning: spdx_core:ExternalRefType/dynamicAnalysisReport
      eolNotice:
        description: A reference to the End Of Sale (EOS) and/or End Of Life (EOL) information related
          to a package.
        meaning: spdx_core:ExternalRefType/eolNotice
      exportControlAssessment:
        description: A reference to a export control assessment for a package.
        meaning: spdx_core:ExternalRefType/exportControlAssessment
      funding:
        description: A reference to funding information related to a package.
        meaning: spdx_core:ExternalRefType/funding
      issueTracker:
        description: A reference to the issue tracker for a package.
        meaning: spdx_core:ExternalRefType/issueTracker
      license:
        description: A reference to additional license information related to an artifact.
        meaning: spdx_core:ExternalRefType/license
      mailingList:
        description: A reference to the mailing list used by the maintainer for a package.
        meaning: spdx_core:ExternalRefType/mailingList
      mavenCentral:
        description: A reference to a Maven repository artifact. The artifact locator format is defined
          in the [Maven documentation](https://maven.apache.org/guides/mini/guide-naming-conventions.html)
          and looks like `groupId:artifactId[:version]`.
        meaning: spdx_core:ExternalRefType/mavenCentral
      metrics:
        description: A reference to metrics related to package such as OpenSSF scorecards.
        meaning: spdx_core:ExternalRefType/metrics
      npm:
        description: A reference to an npm package. The package locator format is defined in the [npm
          documentation](https://docs.npmjs.com/cli/v10/configuring-npm/package-json) and looks like `package@version`.
        meaning: spdx_core:ExternalRefType/npm
      nuget:
        description: A reference to a NuGet package. The package locator format is defined in the [NuGet
          documentation](https://docs.nuget.org) and looks like `package/version`.
        meaning: spdx_core:ExternalRefType/nuget
      other:
        description: Used when the type does not match any of the other options.
        meaning: spdx_core:ExternalRefType/other
      privacyAssessment:
        description: A reference to a privacy assessment for a package.
        meaning: spdx_core:ExternalRefType/privacyAssessment
      productMetadata:
        description: A reference to additional product metadata such as reference within organization's
          product catalog.
        meaning: spdx_core:ExternalRefType/productMetadata
      purchaseOrder:
        description: A reference to a purchase order for a package.
        meaning: spdx_core:ExternalRefType/purchaseOrder
      qualityAssessmentReport:
        description: A reference to a quality assessment for a package.
        meaning: spdx_core:ExternalRefType/qualityAssessmentReport
      releaseHistory:
        description: A reference to a published list of releases for a package.
        meaning: spdx_core:ExternalRefType/releaseHistory
      releaseNotes:
        description: A reference to the release notes for a package.
        meaning: spdx_core:ExternalRefType/releaseNotes
      riskAssessment:
        description: A reference to a risk assessment for a package.
        meaning: spdx_core:ExternalRefType/riskAssessment
      runtimeAnalysisReport:
        description: A reference to a runtime analysis report for a package.
        meaning: spdx_core:ExternalRefType/runtimeAnalysisReport
      secureSoftwareAttestation:
        description: A reference to information assuring that the software is developed using security
          practices as defined by [NIST SP 800-218 Secure Software Development Framework (SSDF) Version
          1.1](https://csrc.nist.gov/pubs/sp/800/218/final) or [CISA Secure Software Development Attestation
          Form](https://www.cisa.gov/resources-tools/resources/secure-software-development-attestation-form).
        meaning: spdx_core:ExternalRefType/secureSoftwareAttestation
      securityAdversaryModel:
        description: A reference to the security adversary model for a package.
        meaning: spdx_core:ExternalRefType/securityAdversaryModel
      securityAdvisory:
        description: A reference to a published security advisory (where advisory as defined per [ISO
          29147:2018](https://www.iso.org/standard/72311.html)) that may affect one or more elements,
          e.g., vendor advisories or specific NVD entries.
        meaning: spdx_core:ExternalRefType/securityAdvisory
      securityFix:
        description: A reference to the patch or source code that fixes a vulnerability.
        meaning: spdx_core:ExternalRefType/securityFix
      securityOther:
        description: A reference to related security information of unspecified type.
        meaning: spdx_core:ExternalRefType/securityOther
      securityPenTestReport:
        description: A reference to a [penetration test](https://en.wikipedia.org/wiki/Penetration_test)
          report for a package.
        meaning: spdx_core:ExternalRefType/securityPenTestReport
      securityPolicy:
        description: A reference to instructions for reporting newly discovered security vulnerabilities
          for a package.
        meaning: spdx_core:ExternalRefType/securityPolicy
      securityThreatModel:
        description: A reference the [security threat model](https://en.wikipedia.org/wiki/Threat_model)
          for a package.
        meaning: spdx_core:ExternalRefType/securityThreatModel
      socialMedia:
        description: A reference to a social media channel for a package.
        meaning: spdx_core:ExternalRefType/socialMedia
      sourceArtifact:
        description: A reference to an artifact containing the sources for a package.
        meaning: spdx_core:ExternalRefType/sourceArtifact
      staticAnalysisReport:
        description: A reference to a static analysis report for a package.
        meaning: spdx_core:ExternalRefType/staticAnalysisReport
      support:
        description: A reference to the software support channel or other support information for a package.
        meaning: spdx_core:ExternalRefType/support
      vcs:
        description: A reference to a version control system related to a software artifact.
        meaning: spdx_core:ExternalRefType/vcs
      vulnerabilityDisclosureReport:
        description: A reference to a Vulnerability Disclosure Report (VDR) which provides the software
          supplier's analysis and findings describing the impact (or lack of impact) that reported vulnerabilities
          have on packages or products in the supplier's SBOM as defined in [NIST SP 800-161 Cybersecurity
          Supply Chain Risk Management Practices for Systems and Organizations](https://csrc.nist.gov/pubs/sp/800/161/r1/final).
        meaning: spdx_core:ExternalRefType/vulnerabilityDisclosureReport
      vulnerabilityExploitabilityAssessment:
        description: A reference to a Vulnerability Exploitability eXchange (VEX) statement which provides
          information on whether a product is impacted by a specific vulnerability in an included package
          and, if affected, whether there are actions recommended to remediate. See also [NTIA VEX one-page
          summary](https://ntia.gov/files/ntia/publications/vex_one-page_summary.pdf).
        meaning: spdx_core:ExternalRefType/vulnerabilityExploitabilityAssessment
  HashAlgorithm:
    enum_uri: spdx_core:HashAlgorithm
    description: A mathematical algorithm that maps data of arbitrary size to a bit string.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/HashAlgorithm/
    in_subset:
    - spdx_core
    permissible_values:
      adler32:
        description: Adler-32 checksum is part of the widely used zlib compression library as defined
          in [RFC 1950](https://datatracker.ietf.org/doc/rfc1950/) Section 2.3.
        meaning: spdx_core:HashAlgorithm/adler32
      blake2b256:
        description: BLAKE2b algorithm with a digest size of 256, as defined in [RFC 7693](https://datatracker.ietf.org/doc/rfc7693/)
          Section 4.
        meaning: spdx_core:HashAlgorithm/blake2b256
      blake2b384:
        description: BLAKE2b algorithm with a digest size of 384, as defined in [RFC 7693](https://datatracker.ietf.org/doc/rfc7693/)
          Section 4.
        meaning: spdx_core:HashAlgorithm/blake2b384
      blake2b512:
        description: BLAKE2b algorithm with a digest size of 512, as defined in [RFC 7693](https://datatracker.ietf.org/doc/rfc7693/)
          Section 4.
        meaning: spdx_core:HashAlgorithm/blake2b512
      blake3:
        description: '[BLAKE3](https://github.com/BLAKE3-team/BLAKE3-specs/blob/master/blake3.pdf)'
        meaning: spdx_core:HashAlgorithm/blake3
      crystalsDilithium:
        description: '[Dilithium](https://pq-crystals.org/dilithium/)'
        meaning: spdx_core:HashAlgorithm/crystalsDilithium
      crystalsKyber:
        description: '[Kyber](https://pq-crystals.org/kyber/)'
        meaning: spdx_core:HashAlgorithm/crystalsKyber
      falcon:
        description: '[FALCON](https://falcon-sign.info/falcon.pdf)'
        meaning: spdx_core:HashAlgorithm/falcon
      md2:
        description: MD2 message-digest algorithm, as defined in [RFC 1319](https://datatracker.ietf.org/doc/rfc1319/).
        meaning: spdx_core:HashAlgorithm/md2
      md4:
        description: MD4 message-digest algorithm, as defined in [RFC 1186](https://datatracker.ietf.org/doc/rfc1186/).
        meaning: spdx_core:HashAlgorithm/md4
      md5:
        description: MD5 message-digest algorithm, as defined in [RFC 1321](https://datatracker.ietf.org/doc/rfc1321/).
        meaning: spdx_core:HashAlgorithm/md5
      md6:
        description: '[MD6 hash function](https://people.csail.mit.edu/rivest/pubs/RABCx08.pdf)'
        meaning: spdx_core:HashAlgorithm/md6
      other:
        description: any hashing algorithm that does not exist in this list of entries
        meaning: spdx_core:HashAlgorithm/other
      sha1:
        description: SHA-1, a secure hashing algorithm, as defined in [RFC 3174](https://datatracker.ietf.org/doc/rfc3174/).
        meaning: spdx_core:HashAlgorithm/sha1
      sha224:
        description: SHA-2 with a digest length of 224, as defined in [RFC 3874](https://datatracker.ietf.org/doc/rfc3874/).
        meaning: spdx_core:HashAlgorithm/sha224
      sha256:
        description: SHA-2 with a digest length of 256, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
        meaning: spdx_core:HashAlgorithm/sha256
      sha384:
        description: SHA-2 with a digest length of 384, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
        meaning: spdx_core:HashAlgorithm/sha384
      sha3_224:
        description: SHA-3 with a digest length of 224, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
        meaning: spdx_core:HashAlgorithm/sha3_224
      sha3_256:
        description: SHA-3 with a digest length of 256, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
        meaning: spdx_core:HashAlgorithm/sha3_256
      sha3_384:
        description: SHA-3 with a digest length of 384, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
        meaning: spdx_core:HashAlgorithm/sha3_384
      sha3_512:
        description: SHA-3 with a digest length of 512, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
        meaning: spdx_core:HashAlgorithm/sha3_512
      sha512:
        description: SHA-2 with a digest length of 512, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
        meaning: spdx_core:HashAlgorithm/sha512
  LifecycleScopeType:
    enum_uri: spdx_core:LifecycleScopeType
    description: Provide an enumerated set of lifecycle phases that can provide context to relationships.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/LifecycleScopeType/
    in_subset:
    - spdx_core
    permissible_values:
      build:
        description: A relationship has specific context implications during an element's build phase,
          during development.
        meaning: spdx_core:LifecycleScopeType/build
      design:
        description: A relationship has specific context implications during an element's design.
        meaning: spdx_core:LifecycleScopeType/design
      development:
        description: A relationship has specific context implications during development phase of an element.
        meaning: spdx_core:LifecycleScopeType/development
      other:
        description: A relationship has other specific context information necessary to capture that the
          above set of enumerations does not handle.
        meaning: spdx_core:LifecycleScopeType/other
      runtime:
        description: A relationship has specific context implications during the execution phase of an
          element.
        meaning: spdx_core:LifecycleScopeType/runtime
      test:
        description: A relationship has specific context implications during an element's testing phase,
          during development.
        meaning: spdx_core:LifecycleScopeType/test
  PresenceType:
    enum_uri: spdx_core:PresenceType
    description: Categories of presence or absence.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/PresenceType/
    in_subset:
    - spdx_core
    permissible_values:
      'no':
        description: Indicates absence of the field.
        meaning: spdx_core:PresenceType/no
      noAssertion:
        description: Makes no assertion about the field.
        meaning: spdx_core:PresenceType/noAssertion
      'yes':
        description: Indicates presence of the field.
        meaning: spdx_core:PresenceType/yes
  ProfileIdentifierType:
    enum_uri: spdx_core:ProfileIdentifierType
    description: Enumeration of the valid profiles.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/ProfileIdentifierType/
    in_subset:
    - spdx_core
    permissible_values:
      ai:
        description: the element follows the AI profile specification
        meaning: spdx_core:ProfileIdentifierType/ai
      build:
        description: the element follows the Build profile specification
        meaning: spdx_core:ProfileIdentifierType/build
      core:
        description: the element follows the Core profile specification
        meaning: spdx_core:ProfileIdentifierType/core
      dataset:
        description: the element follows the Dataset profile specification
        meaning: spdx_core:ProfileIdentifierType/dataset
      expandedLicensing:
        description: the element follows the ExpandedLicensing profile specification
        meaning: spdx_core:ProfileIdentifierType/expandedLicensing
      extension:
        description: the element follows the Extension profile specification
        meaning: spdx_core:ProfileIdentifierType/extension
      lite:
        description: the element follows the Lite profile specification
        meaning: spdx_core:ProfileIdentifierType/lite
      security:
        description: the element follows the Security profile specification
        meaning: spdx_core:ProfileIdentifierType/security
      simpleLicensing:
        description: the element follows the SimpleLicensing profile specification
        meaning: spdx_core:ProfileIdentifierType/simpleLicensing
      software:
        description: the element follows the Software profile specification
        meaning: spdx_core:ProfileIdentifierType/software
  RelationshipCompleteness:
    enum_uri: spdx_core:RelationshipCompleteness
    description: Indicates whether a relationship is known to be complete, incomplete, or if no assertion
      is made with respect to relationship completeness.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/RelationshipCompleteness/
    in_subset:
    - spdx_core
    permissible_values:
      complete:
        description: The relationship is known to be exhaustive.
        meaning: spdx_core:RelationshipCompleteness/complete
      incomplete:
        description: The relationship is known not to be exhaustive.
        meaning: spdx_core:RelationshipCompleteness/incomplete
      noAssertion:
        description: No assertion can be made about the completeness of the relationship.
        meaning: spdx_core:RelationshipCompleteness/noAssertion
  RelationshipType:
    enum_uri: spdx_core:RelationshipType
    description: Information about the relationship between two Elements.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/RelationshipType/
    in_subset:
    - spdx_core
    permissible_values:
      affects:
        description: The `from` Vulnerability affects each `to` Element. The use of the `affects` type
          is constrained to `VexAffectedVulnAssessmentRelationship` classed relationships.
        meaning: spdx_core:RelationshipType/affects
      amendedBy:
        description: The `from` Element is amended by each `to` Element.
        meaning: spdx_core:RelationshipType/amendedBy
      ancestorOf:
        description: The `from` Element is an ancestor of each `to` Element.
        meaning: spdx_core:RelationshipType/ancestorOf
      availableFrom:
        description: The `from` Element is available from the additional supplier described by each `to`
          Element.
        meaning: spdx_core:RelationshipType/availableFrom
      configures:
        description: The `from` Element is a configuration applied to each `to` Element, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/configures
      contains:
        description: The `from` Element contains each `to` Element.
        meaning: spdx_core:RelationshipType/contains
      coordinatedBy:
        description: The `from` Vulnerability is coordinatedBy the `to` Agent(s) (vendor, researcher,
          or consumer agent).
        meaning: spdx_core:RelationshipType/coordinatedBy
      copiedTo:
        description: The `from` Element has been copied to each `to` Element.
        meaning: spdx_core:RelationshipType/copiedTo
      delegatedTo:
        description: The `from` Agent is delegating an action to the Agent of the `to` Relationship (which
          must be of type invokedBy), during a LifecycleScopeType (e.g. the `to` invokedBy Relationship
          is being done on behalf of `from`).
        meaning: spdx_core:RelationshipType/delegatedTo
      dependsOn:
        description: The `from` Element depends on each `to` Element, during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/dependsOn
      descendantOf:
        description: The `from` Element is a descendant of each `to` Element.
        meaning: spdx_core:RelationshipType/descendantOf
      describes:
        description: The `from` Element describes each `to` Element. To denote the root(s) of a tree of
          elements in a collection, the rootElement property should be used.
        meaning: spdx_core:RelationshipType/describes
      doesNotAffect:
        description: The `from` Vulnerability has no impact on each `to` Element. The use of the `doesNotAffect`
          is constrained to `VexNotAffectedVulnAssessmentRelationship` classed relationships.
        meaning: spdx_core:RelationshipType/doesNotAffect
      expandsTo:
        description: The `from` archive expands out as an artifact described by each `to` Element.
        meaning: spdx_core:RelationshipType/expandsTo
      exploitCreatedBy:
        description: The `from` Vulnerability has had an exploit created against it by each `to` Agent.
        meaning: spdx_core:RelationshipType/exploitCreatedBy
      fixedBy:
        description: Designates a `from` Vulnerability has been fixed by the `to` Agent(s).
        meaning: spdx_core:RelationshipType/fixedBy
      fixedIn:
        description: A `from` Vulnerability has been fixed in each `to` Element. The use of the `fixedIn`
          type is constrained to `VexFixedVulnAssessmentRelationship` classed relationships.
        meaning: spdx_core:RelationshipType/fixedIn
      foundBy:
        description: Designates a `from` Vulnerability was originally discovered by the `to` Agent(s).
        meaning: spdx_core:RelationshipType/foundBy
      generates:
        description: The `from` Element generates each `to` Element.
        meaning: spdx_core:RelationshipType/generates
      hasAddedFile:
        description: Every `to` Element is a file added to the `from` Element (`from` hasAddedFile `to`).
        meaning: spdx_core:RelationshipType/hasAddedFile
      hasAssessmentFor:
        description: Relates a `from` Vulnerability and each `to` Element with a security assessment.
          To be used with `VulnAssessmentRelationship` types.
        meaning: spdx_core:RelationshipType/hasAssessmentFor
      hasAssociatedVulnerability:
        description: Used to associate a `from` Artifact with each `to` Vulnerability.
        meaning: spdx_core:RelationshipType/hasAssociatedVulnerability
      hasConcludedLicense:
        description: The `from` SoftwareArtifact is concluded by the SPDX data creator to be governed
          by each `to` license.
        meaning: spdx_core:RelationshipType/hasConcludedLicense
      hasDataFile:
        description: 'The `from` Element treats each `to` Element as a data file. A data file is an artifact
          that stores data required or optional for the `from` Element''s functionality. A data file can
          be a database file, an index file, a log file, an AI model file, a calibration data file, a
          temporary file, a backup file, and more. For AI training dataset, test dataset, test artifact,
          configuration data, build input data, and build output data, please consider using the more
          specific relationship types: `trainedOn`, `testedOn`, `hasTest`, `configures`, `hasInput`, and
          `hasOutput`, respectively. This relationship does not imply dependency.'
        meaning: spdx_core:RelationshipType/hasDataFile
      hasDeclaredLicense:
        description: The `from` SoftwareArtifact was discovered to actually contain each `to` license,
          for example as detected by use of automated tooling.
        meaning: spdx_core:RelationshipType/hasDeclaredLicense
      hasDeletedFile:
        description: Every `to` Element is a file deleted from the `from` Element (`from` hasDeletedFile
          `to`).
        meaning: spdx_core:RelationshipType/hasDeletedFile
      hasDependencyManifest:
        description: The `from` Element has manifest files that contain dependency information in each
          `to` Element.
        meaning: spdx_core:RelationshipType/hasDependencyManifest
      hasDistributionArtifact:
        description: The `from` Element is distributed as an artifact in each `to` Element (e.g. an RPM
          or archive file).
        meaning: spdx_core:RelationshipType/hasDistributionArtifact
      hasDocumentation:
        description: The `from` Element is documented by each `to` Element.
        meaning: spdx_core:RelationshipType/hasDocumentation
      hasDynamicLink:
        description: The `from` Element dynamically links in each `to` Element, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/hasDynamicLink
      hasEvidence:
        description: Every `to` Element is considered as evidence for the `from` Element (`from` hasEvidence
          `to`).
        meaning: spdx_core:RelationshipType/hasEvidence
      hasExample:
        description: Every `to` Element is an example for the `from` Element (`from` hasExample `to`).
        meaning: spdx_core:RelationshipType/hasExample
      hasHost:
        description: The `from` Build was run on the `to` Element during a LifecycleScopeType period (e.g.
          the host that the build runs on).
        meaning: spdx_core:RelationshipType/hasHost
      hasInput:
        description: The `from` Build has each `to` Element as an input, during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasInput
      hasMetadata:
        description: Every `to` Element is metadata about the `from` Element (`from` hasMetadata `to`).
        meaning: spdx_core:RelationshipType/hasMetadata
      hasOptionalComponent:
        description: Every `to` Element is an optional component of the `from` Element (`from` hasOptionalComponent
          `to`).
        meaning: spdx_core:RelationshipType/hasOptionalComponent
      hasOptionalDependency:
        description: The `from` Element optionally depends on each `to` Element, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/hasOptionalDependency
      hasOutput:
        description: The `from` Build element generates each `to` Element as an output, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/hasOutput
      hasPrerequisite:
        description: The `from` Element has a prerequisite on each `to` Element, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/hasPrerequisite
      hasProvidedDependency:
        description: The `from` Element has a dependency on each `to` Element, dependency is not in the
          distributed artifact, but assumed to be provided, during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasProvidedDependency
      hasRequirement:
        description: The `from` Element has a requirement on each `to` Element, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/hasRequirement
      hasSpecification:
        description: Every `to` Element is a specification for the `from` Element (`from` hasSpecification
          `to`), during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasSpecification
      hasStaticLink:
        description: The `from` Element statically links in each `to` Element, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/hasStaticLink
      hasTest:
        description: Every `to` Element is a test artifact for the `from` Element (`from` hasTest `to`),
          during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasTest
      hasTestCase:
        description: Every `to` Element is a test case for the `from` Element (`from` hasTestCase `to`).
        meaning: spdx_core:RelationshipType/hasTestCase
      hasVariant:
        description: Every `to` Element is a variant the `from` Element (`from` hasVariant `to`).
        meaning: spdx_core:RelationshipType/hasVariant
      invokedBy:
        description: The `from` Element was invoked by the `to` Agent, during a LifecycleScopeType period
          (for example, a Build element that describes a build step).
        meaning: spdx_core:RelationshipType/invokedBy
      modifiedBy:
        description: The `from` Element is modified by each `to` Element.
        meaning: spdx_core:RelationshipType/modifiedBy
      other:
        description: Every `to` Element is related to the `from` Element where the relationship type is
          not described by any of the SPDX relationship types (this relationship is directionless).
        meaning: spdx_core:RelationshipType/other
      packagedBy:
        description: Every `to` Element is a packaged instance of the `from` Element (`from` packagedBy
          `to`).
        meaning: spdx_core:RelationshipType/packagedBy
      patchedBy:
        description: Every `to` Element is a patch for the `from` Element (`from` patchedBy `to`).
        meaning: spdx_core:RelationshipType/patchedBy
      publishedBy:
        description: Designates a `from` Vulnerability was made available for public use or reference
          by each `to` Agent.
        meaning: spdx_core:RelationshipType/publishedBy
      reportedBy:
        description: Designates a `from` Vulnerability was first reported to a project, vendor, or tracking
          database for formal identification by each `to` Agent.
        meaning: spdx_core:RelationshipType/reportedBy
      republishedBy:
        description: Designates a `from` Vulnerability's details were tracked, aggregated, and/or enriched
          to improve context (i.e. NVD) by each `to` Agent.
        meaning: spdx_core:RelationshipType/republishedBy
      serializedInArtifact:
        description: The `from` SpdxDocument can be found in a serialized form in each `to` Artifact.
        meaning: spdx_core:RelationshipType/serializedInArtifact
      testedOn:
        description: The `from` Element has been tested on the `to` Element(s).
        meaning: spdx_core:RelationshipType/testedOn
      trainedOn:
        description: The `from` Element has been trained on the `to` Element(s).
        meaning: spdx_core:RelationshipType/trainedOn
      underInvestigationFor:
        description: The `from` Vulnerability impact is being investigated for each `to` Element. The
          use of the `underInvestigationFor` type is constrained to `VexUnderInvestigationVulnAssessmentRelationship`
          classed relationships.
        meaning: spdx_core:RelationshipType/underInvestigationFor
      usesTool:
        description: The `from` Element uses each `to` Element as a tool, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/usesTool
  SupportType:
    enum_uri: spdx_core:SupportType
    description: Indicates the type of support that is associated with an artifact.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/SupportType/
    in_subset:
    - spdx_core
    permissible_values:
      deployed:
        description: in addition to being supported by the supplier, the software is known to have been
          deployed and is in use. For a software as a service provider, this implies the software is now
          available as a service.
        meaning: spdx_core:SupportType/deployed
      development:
        description: the artifact is in active development and is not considered ready for formal support
          from the supplier.
        meaning: spdx_core:SupportType/development
      endOfSupport:
        description: there is a defined end of support for the artifact from the supplier. This may also
          be referred to as end of life. There is a validUntilDate that can be used to signal when support
          ends for the artifact.
        meaning: spdx_core:SupportType/endOfSupport
      limitedSupport:
        description: the artifact has been released, and there is limited support available from the supplier.
          There is a validUntilDate that can provide additional information about the duration of support.
        meaning: spdx_core:SupportType/limitedSupport
      noAssertion:
        description: no assertion about the type of support is made. This is considered the default if
          no other support type is used.
        meaning: spdx_core:SupportType/noAssertion
      noSupport:
        description: there is no support for the artifact from the supplier, consumer assumes any support
          obligations.
        meaning: spdx_core:SupportType/noSupport
      support:
        description: the artifact has been released, and is supported from the supplier. There is a validUntilDate
          that can provide additional information about the duration of support.
        meaning: spdx_core:SupportType/support
  ContentIdentifierType:
    enum_uri: spdx_software:ContentIdentifierType
    description: Specifies the type of a content identifier.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Vocabularies/ContentIdentifierType/
    in_subset:
    - spdx_software
    permissible_values:
      gitoid:
        description: '[Gitoid](https://www.iana.org/assignments/uri-schemes/prov/gitoid), stands for [Git
          Object ID](https://git-scm.com/book/en/v2/Git-Internals-Git-Objects). A gitoid of type blob
          is a unique hash of a binary artifact. A gitoid may represent either an [Artifact Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-identifier-types)
          for the software artifact or an [Input Manifest Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#input-manifest-identifier)
          for the software artifact''s associated [Artifact Input Manifest](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-input-manifest);
          this ambiguity exists because the Artifact Input Manifest is itself an artifact, and the gitoid
          of that artifact is its valid identifier. Gitoids calculated on software artifacts (Snippet,
          File, or Package Elements) should be recorded in the SPDX 3.0 SoftwareArtifact''s contentIdentifier
          property. Gitoids calculated on the Artifact Input Manifest (Input Manifest Identifier) should
          be recorded in the SPDX 3.0 Element''s externalIdentifier property. See [OmniBOR Specification](https://github.com/omnibor/spec/),
          a minimalistic specification for describing software [Artifact Dependency Graphs](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-dependency-graph-adg).'
        meaning: spdx_software:ContentIdentifierType/gitoid
      swhid:
        description: SoftWare Hash IDentifier, a persistent intrinsic identifier for digital artifacts,
          such as files, trees (also known as directories or folders), commits, and other objects typically
          found in version control systems. The format of the identifiers is defined in the [SWHID specification](https://www.swhid.org/specification/v1.1/4.Syntax)
          (ISO/IEC DIS 18670). They typically look like `swh:1:cnt:94a9ed024d3859793618152ea559a168bbcbb5e2`.
        meaning: spdx_software:ContentIdentifierType/swhid
  FileKindType:
    enum_uri: spdx_software:FileKindType
    description: Enumeration of the different kinds of SPDX file.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Vocabularies/FileKindType/
    in_subset:
    - spdx_software
    permissible_values:
      directory:
        description: The file represents a directory and all content stored in that directory.
        meaning: spdx_software:FileKindType/directory
      file:
        description: The file represents a single file (default).
        meaning: spdx_software:FileKindType/file
  SbomType:
    enum_uri: spdx_software:SbomType
    description: Provides a set of values to be used to describe the common types of SBOMs that tools
      may create.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Vocabularies/SbomType/
    in_subset:
    - spdx_software
    permissible_values:
      analyzed:
        description: SBOM generated through analysis of artifacts (e.g., executables, packages, containers,
          and virtual machine images) after its build. Such analysis generally requires a variety of heuristics.
          In some contexts, this may also be referred to as a "3rd party" SBOM.
        meaning: spdx_software:SbomType/analyzed
      build:
        description: SBOM generated as part of the process of building the software to create a releasable
          artifact (e.g., executable or package) from data such as source files, dependencies, built components,
          build process ephemeral data, and other SBOMs.
        meaning: spdx_software:SbomType/build
      deployed:
        description: SBOM provides an inventory of software that is present on a system. This may be an
          assembly of other SBOMs that combines analysis of configuration options, and examination of
          execution behavior in a (potentially simulated) deployment environment.
        meaning: spdx_software:SbomType/deployed
      design:
        description: SBOM of intended, planned software project or product with included components (some
          of which may not yet exist) for a new software artifact.
        meaning: spdx_software:SbomType/design
      runtime:
        description: SBOM generated through instrumenting the system running the software, to capture
          only components present in the system, as well as external call-outs or dynamically loaded components.
          In some contexts, this may also be referred to as an "Instrumented" or "Dynamic" SBOM.
        meaning: spdx_software:SbomType/runtime
      source:
        description: SBOM created directly from the development environment, source files, and included
          dependencies used to build an product artifact.
        meaning: spdx_software:SbomType/source
  SoftwarePurpose:
    enum_uri: spdx_software:SoftwarePurpose
    description: Provides information about the primary purpose of an Element.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Vocabularies/SoftwarePurpose/
    in_subset:
    - spdx_software
    permissible_values:
      application:
        description: The Element is a software application.
        meaning: spdx_software:SoftwarePurpose/application
      archive:
        description: The Element is an archived collection of one or more files (.tar, .zip, etc.).
        meaning: spdx_software:SoftwarePurpose/archive
      bom:
        description: The Element is a bill of materials.
        meaning: spdx_software:SoftwarePurpose/bom
      configuration:
        description: The Element is configuration data.
        meaning: spdx_software:SoftwarePurpose/configuration
      container:
        description: The Element is a container image which can be used by a container runtime application.
        meaning: spdx_software:SoftwarePurpose/container
      data:
        description: The Element is data.
        meaning: spdx_software:SoftwarePurpose/data
      device:
        description: The Element refers to a chipset, processor, or electronic board.
        meaning: spdx_software:SoftwarePurpose/device
      deviceDriver:
        description: The Element represents software that controls hardware devices.
        meaning: spdx_software:SoftwarePurpose/deviceDriver
      diskImage:
        description: The Element refers to a disk image that can be written to a disk, booted in a VM,
          etc. A disk image typically contains most or all of the components necessary to boot, such as
          bootloaders, kernels, firmware, userspace, etc.
        meaning: spdx_software:SoftwarePurpose/diskImage
      documentation:
        description: The Element is documentation.
        meaning: spdx_software:SoftwarePurpose/documentation
      evidence:
        description: The Element is the evidence that a specification or requirement has been fulfilled.
        meaning: spdx_software:SoftwarePurpose/evidence
      executable:
        description: The Element is an Artifact that can be run on a computer.
        meaning: spdx_software:SoftwarePurpose/executable
      file:
        description: The Element is a single file which can be independently distributed (configuration
          file, statically linked binary, Kubernetes deployment, etc.).
        meaning: spdx_software:SoftwarePurpose/file
      filesystemImage:
        description: The Element is a file system image that can be written to a disk (or virtual) partition.
        meaning: spdx_software:SoftwarePurpose/filesystemImage
      firmware:
        description: The Element provides low level control over a device's hardware.
        meaning: spdx_software:SoftwarePurpose/firmware
      framework:
        description: The Element is a software framework.
        meaning: spdx_software:SoftwarePurpose/framework
      install:
        description: The Element is used to install software on disk.
        meaning: spdx_software:SoftwarePurpose/install
      library:
        description: The Element is a software library.
        meaning: spdx_software:SoftwarePurpose/library
      manifest:
        description: The Element is a software manifest.
        meaning: spdx_software:SoftwarePurpose/manifest
      model:
        description: The Element is a machine learning or artificial intelligence model.
        meaning: spdx_software:SoftwarePurpose/model
      module:
        description: The Element is a module of a piece of software.
        meaning: spdx_software:SoftwarePurpose/module
      operatingSystem:
        description: The Element is an operating system.
        meaning: spdx_software:SoftwarePurpose/operatingSystem
      other:
        description: The Element doesn't fit into any of the other categories.
        meaning: spdx_software:SoftwarePurpose/other
      patch:
        description: The Element contains a set of changes to update, fix, or improve another Element.
        meaning: spdx_software:SoftwarePurpose/patch
      platform:
        description: The Element represents a runtime environment.
        meaning: spdx_software:SoftwarePurpose/platform
      requirement:
        description: The Element provides a requirement needed as input for another Element.
        meaning: spdx_software:SoftwarePurpose/requirement
      source:
        description: The Element is a single or a collection of source files.
        meaning: spdx_software:SoftwarePurpose/source
      specification:
        description: The Element is a plan, guideline or strategy how to create, perform or analyze an
          application.
        meaning: spdx_software:SoftwarePurpose/specification
      test:
        description: The Element is a test used to verify functionality on an software element.
        meaning: spdx_software:SoftwarePurpose/test
  EnergyUnitType:
    enum_uri: spdx_ai:EnergyUnitType
    description: Specifies the unit of energy consumption.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/AI/Vocabularies/EnergyUnitType/
    in_subset:
    - spdx_ai
    permissible_values:
      kilowattHour:
        description: Kilowatt-hour.
        meaning: spdx_ai:EnergyUnitType/kilowattHour
      megajoule:
        description: Megajoule.
        meaning: spdx_ai:EnergyUnitType/megajoule
      other:
        description: Any other units of energy measurement.
        meaning: spdx_ai:EnergyUnitType/other
  SafetyRiskAssessmentType:
    enum_uri: spdx_ai:SafetyRiskAssessmentType
    description: Specifies the safety risk level.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/AI/Vocabularies/SafetyRiskAssessmentType/
    in_subset:
    - spdx_ai
    permissible_values:
      high:
        description: The second-highest level of risk posed by an AI system.
        meaning: spdx_ai:SafetyRiskAssessmentType/high
      low:
        description: Low/no risk is posed by an AI system.
        meaning: spdx_ai:SafetyRiskAssessmentType/low
      medium:
        description: The third-highest level of risk posed by an AI system.
        meaning: spdx_ai:SafetyRiskAssessmentType/medium
      serious:
        description: The highest level of risk posed by an AI system.
        meaning: spdx_ai:SafetyRiskAssessmentType/serious
  ConfidentialityLevelType:
    enum_uri: spdx_dataset:ConfidentialityLevelType
    description: Categories of confidentiality level.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Dataset/Vocabularies/ConfidentialityLevelType/
    in_subset:
    - spdx_dataset
    permissible_values:
      amber:
        description: Data points in the dataset can be shared only with specific organizations and their
          clients on a need to know basis.
        meaning: spdx_dataset:ConfidentialityLevelType/amber
      clear:
        description: Dataset may be distributed freely, without restriction.
        meaning: spdx_dataset:ConfidentialityLevelType/clear
      green:
        description: Dataset can be shared within a community of peers and partners.
        meaning: spdx_dataset:ConfidentialityLevelType/green
      red:
        description: Data points in the dataset are highly confidential and can only be shared with named
          recipients.
        meaning: spdx_dataset:ConfidentialityLevelType/red
  DatasetAvailabilityType:
    enum_uri: spdx_dataset:DatasetAvailabilityType
    description: Availability of dataset.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Dataset/Vocabularies/DatasetAvailabilityType/
    in_subset:
    - spdx_dataset
    permissible_values:
      clickthrough:
        description: the dataset is not publicly available and can only be accessed after affirmatively
          accepting terms on a clickthrough webpage.
        meaning: spdx_dataset:DatasetAvailabilityType/clickthrough
      directDownload:
        description: the dataset is publicly available and can be downloaded directly.
        meaning: spdx_dataset:DatasetAvailabilityType/directDownload
      query:
        description: the dataset is publicly available, but not all at once, and can only be accessed
          through queries which return parts of the dataset.
        meaning: spdx_dataset:DatasetAvailabilityType/query
      registration:
        description: the dataset is not publicly available and an email registration is required before
          accessing the dataset, although without an affirmative acceptance of terms.
        meaning: spdx_dataset:DatasetAvailabilityType/registration
      scrapingScript:
        description: the dataset provider is not making available the underlying data and the dataset
          must be reassembled, typically using the provided script for scraping the data.
        meaning: spdx_dataset:DatasetAvailabilityType/scrapingScript
  DatasetType:
    enum_uri: spdx_dataset:DatasetType
    description: Enumeration of dataset types.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Dataset/Vocabularies/DatasetType/
    in_subset:
    - spdx_dataset
    permissible_values:
      audio:
        description: data is audio based, such as a collection of music from the 80s.
        meaning: spdx_dataset:DatasetType/audio
      categorical:
        description: data that is classified into a discrete number of categories, such as the eye color
          of a population of people.
        meaning: spdx_dataset:DatasetType/categorical
      graph:
        description: data is in the form of a graph where entries are somehow related to each other through
          edges, such a social network of friends.
        meaning: spdx_dataset:DatasetType/graph
      image:
        description: data is a collection of images such as pictures of animals.
        meaning: spdx_dataset:DatasetType/image
      noAssertion:
        description: data type is not known.
        meaning: spdx_dataset:DatasetType/noAssertion
      numeric:
        description: data consists only of numeric entries.
        meaning: spdx_dataset:DatasetType/numeric
      other:
        description: data is of a type not included in this list.
        meaning: spdx_dataset:DatasetType/other
      sensor:
        description: data is recorded from a physical sensor, such as a thermometer reading or biometric
          device.
        meaning: spdx_dataset:DatasetType/sensor
      structured:
        description: data is stored in tabular format or retrieved from a relational database.
        meaning: spdx_dataset:DatasetType/structured
      syntactic:
        description: data describes the syntax or semantics of a language or text, such as a parse tree
          used for natural language processing.
        meaning: spdx_dataset:DatasetType/syntactic
      text:
        description: data consists of unstructured text, such as a book, Wikipedia article (without images),
          or transcript.
        meaning: spdx_dataset:DatasetType/text
      timeseries:
        description: data is recorded in an ordered sequence of timestamped entries, such as the price
          of a stock over the course of a day.
        meaning: spdx_dataset:DatasetType/timeseries
      timestamp:
        description: data is recorded with a timestamp for each entry, but not necessarily ordered or
          at specific intervals, such as when a taxi ride starts and ends.
        meaning: spdx_dataset:DatasetType/timestamp
      video:
        description: data is video based, such as a collection of movie clips featuring Tom Hanks.
        meaning: spdx_dataset:DatasetType/video
  CvssSeverityType:
    enum_uri: spdx_security:CvssSeverityType
    description: Specifies the CVSS base, temporal, threat, or environmental severity type.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/CvssSeverityType/
    in_subset:
    - spdx_security
    permissible_values:
      critical:
        description: When a CVSS score is between 9.0 - 10.0
        meaning: spdx_security:CvssSeverityType/critical
      high:
        description: When a CVSS score is between 7.0 - 8.9
        meaning: spdx_security:CvssSeverityType/high
      low:
        description: When a CVSS score is between 0.1 - 3.9
        meaning: spdx_security:CvssSeverityType/low
      medium:
        description: When a CVSS score is between 4.0 - 6.9
        meaning: spdx_security:CvssSeverityType/medium
      none:
        description: When a CVSS score is 0.0
        meaning: spdx_security:CvssSeverityType/none
  ExploitCatalogType:
    enum_uri: spdx_security:ExploitCatalogType
    description: Specifies the exploit catalog type.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/ExploitCatalogType/
    in_subset:
    - spdx_security
    permissible_values:
      kev:
        description: CISA's Known Exploited Vulnerability (KEV) Catalog
        meaning: spdx_security:ExploitCatalogType/kev
      other:
        description: Other exploit catalogs
        meaning: spdx_security:ExploitCatalogType/other
  SsvcDecisionType:
    enum_uri: spdx_security:SsvcDecisionType
    description: Specifies the SSVC decision type.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/SsvcDecisionType/
    in_subset:
    - spdx_security
    permissible_values:
      act:
        description: The vulnerability requires attention from the organization's internal, supervisory-level
          and leadership-level individuals. Necessary actions include requesting assistance or information
          about the vulnerability, as well as publishing a notification either internally and/or externally.
          Typically, internal groups would meet to determine the overall response and then execute agreed
          upon actions. CISA recommends remediating Act vulnerabilities as soon as possible.
        meaning: spdx_security:SsvcDecisionType/act
      attend:
        description: The vulnerability requires attention from the organization's internal, supervisory-level
          individuals. Necessary actions include requesting assistance or information about the vulnerability,
          and may involve publishing a notification either internally and/or externally. CISA recommends
          remediating Attend vulnerabilities sooner than standard update timelines.
        meaning: spdx_security:SsvcDecisionType/attend
      track:
        description: The vulnerability does not require action at this time. The organization would continue
          to track the vulnerability and reassess it if new information becomes available. CISA recommends
          remediating Track vulnerabilities within standard update timelines.
        meaning: spdx_security:SsvcDecisionType/track
      trackStar:
        description: ("Track*" in the SSVC spec) The vulnerability contains specific characteristics that
          may require closer monitoring for changes. CISA recommends remediating Track* vulnerabilities
          within standard update timelines.
        meaning: spdx_security:SsvcDecisionType/trackStar
  VexJustificationType:
    enum_uri: spdx_security:VexJustificationType
    description: Specifies the VEX justification type.
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/VexJustificationType/
    in_subset:
    - spdx_security
    permissible_values:
      componentNotPresent:
        description: The software is not affected because the vulnerable component is not in the product.
        meaning: spdx_security:VexJustificationType/componentNotPresent
      inlineMitigationsAlreadyExist:
        description: Built-in inline controls or mitigations prevent an adversary from leveraging the
          vulnerability.
        meaning: spdx_security:VexJustificationType/inlineMitigationsAlreadyExist
      vulnerableCodeCannotBeControlledByAdversary:
        description: The vulnerable component is present, and the component contains the vulnerable code.
          However, vulnerable code is used in such a way that an attacker cannot mount any anticipated
          attack.
        meaning: spdx_security:VexJustificationType/vulnerableCodeCannotBeControlledByAdversary
      vulnerableCodeNotInExecutePath:
        description: The affected code is not reachable through the execution of the code, including non-anticipated
          states of the product.
        meaning: spdx_security:VexJustificationType/vulnerableCodeNotInExecutePath
      vulnerableCodeNotPresent:
        description: The product is not affected because the code underlying the vulnerability is not
          present in the product.
        meaning: spdx_security:VexJustificationType/vulnerableCodeNotPresent
types:
  date_time_stamp:
    typeof: string
    base: str
    uri: xsd:dateTimeStamp
    description: 'A UTC timestamp as SPDX writes one: a date, a time to the second and a trailing Z.'
    pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
    in_subset:
    - spdx_core
  spdx_media_type:
    typeof: string
    base: str
    uri: xsd:string
    description: An IANA media type, such as text/plain.
    pattern: ^[^\/]+\/[^\/]+$
    in_subset:
    - spdx_core
    aliases:
    - media_type
  semver:
    typeof: string
    base: str
    uri: xsd:string
    description: A semantic version, such as 3.0.1.
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    in_subset:
    - spdx_core
  positive_integer:
    typeof: integer
    base: int
    uri: xsd:positiveInteger
    description: An integer of one or more.
    minimum_value: 1
    in_subset:
    - spdx_core
  non_negative_integer:
    typeof: integer
    base: int
    uri: xsd:nonNegativeInteger
    description: An integer of zero or more.
    minimum_value: 0
    in_subset:
    - spdx_core
subsets:
  spdx_core:
    description: Elements of the SPDX Core profile.
  spdx_software:
    description: Elements of the SPDX Software profile.
  spdx_security:
    description: Elements of the SPDX Security profile.
  spdx_simple_licensing:
    description: Elements of the SPDX Simple Licensing profile.
  spdx_expanded_licensing:
    description: Elements of the SPDX Expanded Licensing profile.
  spdx_ai:
    description: Elements of the SPDX AI profile.
  spdx_dataset:
    description: Elements of the SPDX Dataset profile.
  spdx_build:
    description: Elements of the SPDX Build profile.
  spdx_extension:
    description: Elements of the SPDX Extension profile.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: Element; dropped for LOKF''s: type, spdxId;
  renamed, IRIs unchanged: Agent -> SpdxAgent, Organization -> SpdxOrganization, Person -> SpdxPerson,
  media_type -> spdx_media_type, algorithm -> spdx_algorithm, context -> spdx_context, created -> spdx_created,
  description -> spdx_description, from -> spdx_from, name -> spdx_name, to -> spdx_to.'

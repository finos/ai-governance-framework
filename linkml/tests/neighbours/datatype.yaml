# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/datatype-lokf
name: datatype
title: Datatype Ontology
description: 'A LinkML rendering of the Datatype Ontology ("Datatypes") of the Australian Government Linked
  Data Working Group (AGLDWG), by Simon Cox of CSIRO. In its own words: a set of classes representing
  data-types. These may be used for observation results, or for the range of specific properties in other
  applications where scaled numbers, ranges, percents etc are required. Each class and property keeps
  the ontology''s local name and IRI.'
version: '2019-10-03'
source: http://linked.data.gov.au/def/datatype
license: Apache-2.0
see_also:
- https://lmodel.github.io/datatype
- https://github.com/AGLDWG/datatype-ont/tree/dd8f24120cd59f686086f58175de37807c569e18
annotations:
  upstream_repository: https://github.com/AGLDWG/datatype-ont
  upstream_branch: master
  upstream_commit: dd8f24120cd59f686086f58175de37807c569e18
  upstream_created: '2019-03-25'
  upstream_creator: Simon J.D. Cox, CSIRO, https://orcid.org/0000-0002-3884-3420
  upstream_licence: CC0-1.0 in the ontology's dcterms:license; CC-BY-4.0 in the repository's LICENSE
comments:
- The ontology states no owl:versionInfo or owl:versionIRI, and its repository has no tag or release,
  so the version is the ontology's dcterms:modified date. upstream/ copies its Turtle file and licence
  at the commit in the annotations, and scripts/check_upstream_release.py reports when the master branch
  moves.
- The title and description of each of the ontology's terms are its rdfs:label and skos:definition. The
  ontology states CC0 1.0 as its dcterms:license, and the repository's LICENSE, added later, is CC BY
  4.0 (https://creativecommons.org/licenses/by/4.0/). This rendering follows CC BY 4.0, is provided as
  is, and carries the attribution that https://github.com/lmodel/datatype/blob/main/NOTICE gives.
- 'The classes are closed: a value carries only the properties the ontology''s restrictions on its class
  name. OWL leaves a class open to other properties, so data that adds, say, a standard to a QuantitativeMeasure
  is valid OWL but not valid here.'
prefixes:
  datatype_linkml: https://w3id.org/lmodel/datatype/
  data: http://linked.data.gov.au/def/datatype/
  linkml: https://w3id.org/linkml/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: datatype_linkml
default_range: string
imports:
- linkml:types
- lokf
slots:
  rdf_value:
    title: value
    description: The main value of a structured value, as RDF's own rdf:value property names it. The ontology
      restricts it on Concept and makes value, min, max and uncertainty its sub-properties.
    slot_uri: rdf:value
  value:
    title: data value
    description: simple value (a literal)
    slot_uri: data:value
    is_a: rdf_value
  min:
    title: data minimum
    description: Minimum value of range
    slot_uri: data:min
    is_a: rdf_value
    range: decimal
  max:
    title: data maximum
    description: Maximum value of a range
    slot_uri: data:max
    is_a: rdf_value
    range: decimal
  uncertainty:
    title: data uncertainty
    description: Uncertainty for a quantitative value
    slot_uri: data:uncertainty
    is_a: rdf_value
    range: decimal
  standard:
    title: data standard
    description: Measurement standard, scale, uom, reference system, controlled vocabulary, taxonomy etc
    slot_uri: data:standard
    range: uriorcurie
    comments:
    - No class of the ontology restricts this property; it is the parent of unit and vocabulary.
  datatype_unit:
    title: unit of measure
    description: Measurement scale
    slot_uri: data:unit
    is_a: standard
    range: uriorcurie
    comments:
    - The unit by its IRI, such as http://qudt.org/vocab/unit/M from the QUDT units vocabulary. The ontology
      states no range.
    aliases:
    - unit
  vocabulary:
    title: vocabulary
    description: controlled vocabulary, taxonomy etc
    slot_uri: data:vocabulary
    is_a: standard
    range: uriorcurie
    comments:
    - The vocabulary by its IRI. The ontology's range is a skos:ConceptScheme, a skos:Collection or an
      owl:Ontology, which the validator cannot check of an IRI.
classes:
  Boolean:
    title: Boolean
    description: Class to encapsulate a true-or-false value
    class_uri: data:Boolean
    slots:
    - value
    slot_usage:
      value:
        range: boolean
        required: true
  DatatypeConcept:
    title: Concept
    description: Class to encapsulate a classifier, usually a values from a controlled vocabulary
    class_uri: data:Concept
    slots:
    - rdf_value
    - vocabulary
    slot_usage:
      rdf_value:
        range: uriorcurie
        required: true
        comments:
        - The concept by its IRI. The ontology's range is a skos:Concept, which the validator cannot check
          of an IRI.
      vocabulary:
        required: true
    aliases:
    - Concept
  Count:
    title: Count
    description: Class to encapsulate an integer value
    class_uri: data:Count
    slots:
    - value
    - uncertainty
    slot_usage:
      value:
        range: integer
        required: true
  QuantitativeMeasure:
    title: Quantitative Measure
    description: Class to encapsulate a quantitative measure value
    class_uri: data:QuantitativeMeasure
    slots:
    - value
    - datatype_unit
    - uncertainty
    slot_usage:
      value:
        range: decimal
        required: true
      datatype_unit:
        required: true
  QuantitativeRange:
    title: Quantitative Range
    description: Class to encapsulate a quantitative range
    class_uri: data:QuantitativeRange
    slots:
    - min
    - max
    - datatype_unit
    - uncertainty
    slot_usage:
      min:
        required: true
      max:
        required: true
      datatype_unit:
        required: true
  Percent:
    title: Percent
    description: Class to encapsulate a quantitative measure expressed as a percent value
    class_uri: data:Percent
    is_a: QuantitativeMeasure
    slot_usage:
      datatype_unit:
        pattern: ^http://qudt\.org/vocab/unit/PERCENT$
        comments:
        - 'The ontology''s owl:hasValue: the unit is QUDT''s PERCENT and no other. A pattern states it,
          since equals_string needs a string range.'
  PercentRange:
    title: Percent range
    description: Class to encapsulate a quantitative range expressed as in percent values
    class_uri: data:PercentRange
    is_a: QuantitativeRange
    slot_usage:
      datatype_unit:
        pattern: ^http://qudt\.org/vocab/unit/PERCENT$
        comments:
        - 'The ontology''s owl:hasValue: the unit is QUDT''s PERCENT and no other. A pattern states it,
          since equals_string needs a string range.'
  Text:
    title: Text
    description: Class to encapsulate a textual value
    class_uri: data:Text
    slots:
    - value
    slot_usage:
      value:
        range: string
        required: true
notes:
- 'Adapted for LOKF by `lokf adapt`. renamed, IRIs unchanged: Concept -> DatatypeConcept, unit -> datatype_unit.'

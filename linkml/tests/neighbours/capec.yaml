# Generated by `lokf adapt` from capec.yaml (capec 3.9); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/capec-lokf
name: capec
title: Common Attack Pattern Enumeration and Classification (CAPEC)
description: A LinkML model of the CAPEC catalogue. It keeps the keys and listed values of the catalogue's
  XML Schema, so the catalogue validates as MITRE spells it once scripts/capec_to_json.py has turned it
  into data.
version: '3.9'
source: https://capec.mitre.org/data/xsd/ap_schema_v3.5.xsd
license: Apache-2.0
keywords:
- attack pattern
- CAPEC
- threat modelling
- adversary technique
- MITRE
see_also:
- https://lmodel.github.io/capec
- https://capec.mitre.org/
annotations:
  xsd_version: '3.5'
  xsd_namespace: http://capec.mitre.org/capec-3
  xsd_date: '2021-10-21'
  catalogue_date: '2023-01-24'
comments:
- The version is the version of the catalogue that the schema renders, and xsd_version is the version
  of the XSD that catalogue names. upstream/ holds both files unchanged, tests/test_coverage.py holds
  the schema to the XSD, and scripts/check_upstream_release.py reports when either moves.
- MITRE's latest catalogue is dated January 2023 and its latest news item March 2023. No page says CAPEC
  has stopped, so the watch keeps asking.
prefixes:
  capec: https://w3id.org/lmodel/capec/
  cwe: https://w3id.org/lmodel/cwe/
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  sepses_capec: http://w3id.org/sepses/vocab/ref/capec#
  skos: http://www.w3.org/2004/02/skos/core#
  stix: https://w3id.org/lmodel/stix/
  attack: https://w3id.org/lmodel/attack/
  wdt: http://www.wikidata.org/prop/direct/
  wd: http://www.wikidata.org/entity/
default_prefix: capec
default_range: string
imports:
- linkml:types
- lokf
classes:
  CapecExternalReference:
    description: A publication or page outside CAPEC that entries point to for more detail.
    annotations:
      xsd_type: ExternalReferenceType
    close_mappings:
    - stix:StixExternalReference
    - sepses_capec:Reference
    - cwe:CweExternalReference
    attributes:
      Author:
        multivalued: true
        description: A person or body who wrote the work.
        close_mappings:
        - dcterms:creator
        - sepses_capec:referenceAuthor
      Edition:
        description: Which edition of the work is meant.
        close_mappings:
        - schema:bookEdition
      Publication:
        description: The journal, conference or larger work that holds it.
      Publication_Year:
        range: capec_year
        description: The year it appeared.
        close_mappings:
        - sepses_capec:referencePublicationYear
      Publication_Month:
        range: capec_month
        description: The month it appeared.
        close_mappings:
        - sepses_capec:referencePublicationMonth
      Publication_Day:
        range: capec_day
        description: The day of the month it appeared.
        close_mappings:
        - sepses_capec:referencePublicationDay
      Publisher:
        description: Who published it.
        close_mappings:
        - dcterms:publisher
        - sepses_capec:referencePublisher
      URL:
        range: capec_uri
        description: Where it can be read.
        close_mappings:
        - schema:url
        - sepses_capec:referenceUrl
      URL_Date:
        range: date
        description: The day someone last confirmed the address worked.
    slots:
    - id
    - title
    slot_usage:
      title:
        required: true
        range: string
    is_a: Concept
  CapecReference:
    description: One citation by an entry of an external reference.
    annotations:
      xsd_type: ReferencesType/Reference
    attributes:
      External_Reference_ID:
        required: true
        range: CapecExternalReference
        pattern: ^REF-[0-9]+$
        description: The reference cited.
      Section:
        description: The section title or page that this citation means.
  CapecNote:
    description: A remark on an entry that no other field can hold.
    annotations:
      xsd_type: NotesType/Note
    close_mappings:
    - skos:note
    attributes:
      Type:
        required: true
        range: CapecNoteType
        description: What kind of remark it is.
      Value:
        required: true
        range: capec_structured_text
        description: The remark itself.
  CapecTaxonomyMapping:
    description: A link from an entry to the matching entry of another taxonomy.
    annotations:
      xsd_type: TaxonomyMappingsType/Taxonomy_Mapping
    close_mappings:
    - skos:mappingRelation
    attributes:
      Taxonomy_Name:
        required: true
        range: CapecTaxonomyName
        description: The other taxonomy.
      Entry_ID:
        description: The other entry's identifier in that taxonomy.
      Entry_Name:
        description: The other entry's name in that taxonomy.
      Mapping_Fit:
        range: CapecTaxonomyMappingFit
        description: How well the two entries fit.
  CapecExcludeRelated:
    description: An ancestor under which a relation does not hold.
    comments:
    - The relation it sits on applies through every path up the hierarchy except those through this ancestor.
    annotations:
      xsd_type: ExcludeRelatedType
    attributes:
      Exclude_ID:
        required: true
        range: CapecEntry
        pattern: ^[1-9][0-9]*$
        description: The number of the ancestor.
        comments:
        - The XSD says only that this is an ancestor, so it ranges over any entry. Every one of the 260
          in CAPEC 3.9 is a category, which tests/test_catalogue.py pins.
  CapecExclusionsMixin:
    mixin: true
    description: The field of any relation that can leave out some ancestors.
    attributes:
      Exclude_Related:
        range: CapecExcludeRelated
        multivalued: true
        inlined_as_list: true
        description: Ancestors under which the relation does not hold.
  CapecTaxonomyMappedMixin:
    mixin: true
    description: The field of an entry that can map to other taxonomies.
    attributes:
      Taxonomy_Mappings:
        range: CapecTaxonomyMapping
        multivalued: true
        inlined_as_list: true
        description: Matching entries in other taxonomies.
  CapecSubmission:
    description: Who first put an entry forward, and when.
    annotations:
      xsd_type: ContentHistoryType/Submission
    close_mappings:
    - sepses_capec:SubmissionHistory
    attributes:
      Submission_Name:
        description: The submitter's name.
        close_mappings:
        - sepses_capec:submissionName
      Submission_Organization:
        description: The submitter's organisation.
        close_mappings:
        - sepses_capec:submissionOrganization
      Submission_Date:
        range: date
        description: The day it was submitted.
        close_mappings:
        - dcterms:dateSubmitted
        - sepses_capec:submissionDate
      Submission_Comment:
        description: A remark on the submission.
  CapecModification:
    description: One later edit to an entry.
    annotations:
      xsd_type: ContentHistoryType/Modification
    close_mappings:
    - sepses_capec:ModificationHistory
    attributes:
      Modification_Name:
        description: The editor's name.
        close_mappings:
        - sepses_capec:modificationName
      Modification_Organization:
        description: The editor's organisation.
        close_mappings:
        - sepses_capec:modificationOrganization
      Modification_Date:
        range: date
        description: The day of the edit.
        close_mappings:
        - dcterms:modified
        - sepses_capec:modificationDate
      Modification_Importance:
        range: CapecImportance
        description: How much the edit matters to anyone relying on the entry.
      Modification_Comment:
        description: What the edit did.
        close_mappings:
        - sepses_capec:modificationComment
  CapecContribution:
    description: Help given to an entry by someone other than its submitter.
    annotations:
      xsd_type: ContentHistoryType/Contribution
    attributes:
      Type:
        required: true
        range: CapecContributionType
        description: Whether the help was content or feedback.
      Contribution_Name:
        description: The contributor's name.
      Contribution_Organization:
        description: The contributor's organisation.
      Contribution_Date:
        range: date
        description: The day of the contribution.
      Contribution_Comment:
        description: A remark on the contribution.
  CapecPreviousEntryName:
    description: A name an entry used to carry.
    annotations:
      xsd_type: ContentHistoryType/Previous_Entry_Name
    attributes:
      Date:
        required: true
        range: date
        description: The day the name changed.
      Value:
        required: true
        description: The earlier name.
  CapecContentHistory:
    description: The record of who wrote and changed an entry.
    annotations:
      xsd_type: ContentHistoryType
    attributes:
      Submission:
        range: CapecSubmission
        inlined: true
        description: The entry's first submission.
      Modification:
        range: CapecModification
        multivalued: true
        inlined_as_list: true
        description: Each later edit.
      Contribution:
        range: CapecContribution
        multivalued: true
        inlined_as_list: true
        description: Each contribution from someone else.
      Previous_Entry_Name:
        range: CapecPreviousEntryName
        multivalued: true
        inlined_as_list: true
        description: Each name the entry used to carry.
  CapecEntry:
    abstract: true
    description: Anything in the catalogue with a CAPEC number, whether an attack pattern, a category
      or a view.
    comments:
    - The XSD has no such base. It repeats these fields on its three entry types, whose numbers do not
      overlap, so a member reference can point to any of them.
    annotations:
      xsd_type: AttackPatternType CategoryType ViewType
    attributes:
      Status:
        required: true
        range: CapecStatus
        description: How far the entry has got through review.
        close_mappings:
        - sepses_capec:status
      References:
        range: CapecReference
        multivalued: true
        inlined_as_list: true
        description: The external references the entry cites.
        close_mappings:
        - sepses_capec:hasReference
      Notes:
        range: CapecNote
        multivalued: true
        inlined_as_list: true
        description: Remarks that no other field can hold.
      Content_History:
        range: CapecContentHistory
        inlined: true
        description: Who wrote and changed the entry.
    slots:
    - id
    - title
    slot_usage:
      title:
        required: true
        range: string
    is_a: Concept
  CapecAlternateTerm:
    description: Another name by which an attack pattern is known.
    annotations:
      xsd_type: AlternateTermsType/Alternate_Term
    attributes:
      Term:
        required: true
        description: The other name.
        close_mappings:
        - skos:altLabel
      Description:
        range: capec_structured_text
        description: Where or how the other name is used.
  CapecRelatedAttackPattern:
    description: A relation from one attack pattern to another.
    mixins:
    - CapecExclusionsMixin
    annotations:
      xsd_type: RelatedAttackPatternType/Related_Attack_Pattern
    close_mappings:
    - sepses_capec:RelatedAttackPattern
    attributes:
      Nature:
        required: true
        range: CapecRelatedNature
        description: What kind of relation it is.
        close_mappings:
        - sepses_capec:relatedAttackPatternNature
      CAPEC_ID:
        required: true
        range: CapecAttackPattern
        pattern: ^[1-9][0-9]*$
        description: The other attack pattern.
        close_mappings:
        - sepses_capec:relatedAttackPatternCAPECId
  CapecTechnique:
    description: One way of carrying out a step of an attack.
    annotations:
      xsd_type: ExecutionFlowType/Attack_Step/Technique
    attributes:
      CAPEC_ID:
        range: CapecEntry
        description: The entry that the technique itself amounts to.
        comments:
        - The XSD types this one as xs:string and not as a number, and no technique in CAPEC 3.9 sets
          it. It has no pattern, so any string validates as the XSD allows, and it ranges over an entry
          so that the key means one thing.
      Value:
        required: true
        range: capec_structured_text
        description: The technique.
  CapecAttackStep:
    description: One step of the way an adversary typically carries out an attack.
    comments:
    - Eleven flows in CAPEC 3.9 repeat a step number, as in 1, 1, 2, 1, and the XSD does not ask for a
      sequence, so no rule states one.
    annotations:
      xsd_type: ExecutionFlowType/Attack_Step
    close_mappings:
    - sepses_capec:ExecutionFlow
    attributes:
      Step:
        required: true
        range: integer
        description: The step's number.
        close_mappings:
        - sepses_capec:attackStep
      Phase:
        required: true
        range: CapecAttackStepPhase
        description: The stage of the attack it belongs to.
        close_mappings:
        - sepses_capec:attackStepPhase
      Description:
        required: true
        range: capec_structured_text
        description: What the adversary does in this step.
        close_mappings:
        - sepses_capec:attackStepDescription
      Technique:
        range: CapecTechnique
        multivalued: true
        inlined_as_list: true
        description: Ways of doing it.
        close_mappings:
        - sepses_capec:attackStepTechnique
  CapecSkill:
    description: A skill or piece of knowledge an adversary needs.
    annotations:
      xsd_type: SkillsType/Skill
    close_mappings:
    - sepses_capec:SkillRequired
    attributes:
      Level:
        required: true
        range: CapecSkillLevel
        description: How much of it is needed.
        close_mappings:
        - sepses_capec:skillLevel
      Value:
        required: true
        description: What the skill is.
        comments:
        - The XSD allows this text to be empty, and in two skills of CAPEC 3.9 it is.
        close_mappings:
        - sepses_capec:skillDescription
  CapecConsequence:
    description: One thing that can happen if an attack succeeds.
    annotations:
      xsd_type: ConsequencesType/Consequence
    close_mappings:
    - sepses_capec:Consequence
    attributes:
      Consequence_ID:
        description: The CAPEC team's identifier for a consequence repeated across patterns, in the form
          CC-1.
      Scope:
        required: true
        multivalued: true
        range: CapecScope
        description: The security properties violated.
        close_mappings:
        - sepses_capec:consequenceScope
      Impact:
        multivalued: true
        range: CapecTechnicalImpact
        description: What the attack does to the system.
        close_mappings:
        - sepses_capec:consequenceImpact
      Likelihood:
        range: CapecLikelihood
        description: How likely this consequence is, beside the pattern's others.
      Note:
        range: capec_structured_text
        description: A remark on the consequence.
        close_mappings:
        - sepses_capec:consequenceNote
  CapecRelatedWeakness:
    description: A weakness in the Common Weakness Enumeration that can make an attack possible.
    comments:
    - The XSD says that any one of a pattern's weaknesses, not all of them, may be enough for the attack
      to succeed.
    - CWE holds the same link from its own side. CAPEC 3.9 and CWE 5.0 each name the same 1212 pairs,
      which tests/test_catalogue.py holds, so the two classes are the two ends of one link and the mapping
      is related.
    annotations:
      xsd_type: RelatedWeaknessesType/Related_Weakness
    close_mappings:
    - sepses_capec:RelatedWeakness
    related_mappings:
    - cwe:CweRelatedAttackPattern
    attributes:
      CWE_ID:
        related_mappings:
        - cwe:CweWeakness
        required: true
        range: capec_numeric_id
        description: The weakness's number in the Common Weakness Enumeration.
        exact_mappings:
        - wdt:P3624
  CapecMemberOf:
    description: A statement that an entry belongs to a view or a category.
    mixins:
    - CapecExclusionsMixin
    annotations:
      xsd_type: RelationshipsType/Member_Of
    attributes:
      CAPEC_ID:
        required: true
        range: CapecEntry
        pattern: ^[1-9][0-9]*$
        description: The view or category it belongs to.
  CapecHasMember:
    description: A statement that a view or a category holds an entry.
    mixins:
    - CapecExclusionsMixin
    annotations:
      xsd_type: RelationshipsType/Has_Member
    attributes:
      CAPEC_ID:
        required: true
        range: CapecEntry
        pattern: ^[1-9][0-9]*$
        description: The attack pattern or category it holds.
  CapecRelationships:
    description: Which entries a category or a view holds, and which it belongs to.
    annotations:
      xsd_type: RelationshipsType
    attributes:
      Member_Of:
        range: CapecMemberOf
        multivalued: true
        inlined_as_list: true
        description: What this entry belongs to.
      Has_Member:
        range: CapecHasMember
        multivalued: true
        inlined_as_list: true
        description: What this entry holds.
  CapecStakeholder:
    description: One kind of person a view is meant for, and what they would get from it.
    annotations:
      xsd_type: AudienceType/Stakeholder
    attributes:
      Type:
        required: true
        range: CapecStakeholderType
        description: The kind of person.
      Description:
        required: true
        range: capec_structured_text
        description: What they would find useful in the view.
  CapecAttackPattern:
    is_a: CapecEntry
    mixins:
    - CapecTaxonomyMappedMixin
    description: A catalogued way that adversaries go about an attack, with what it takes and how to resist
      it.
    comments:
    - MITRE publishes the same entries in STIX as attack-pattern objects, in the mitre/cti repository,
      and marks each with a capec external reference, so the STIX mapping is close.
    - ATT&CK describes a technique an adversary was seen to use, while this describes a general pattern,
      and the taxonomy mappings join them, so that mapping is only related.
    annotations:
      xsd_type: AttackPatternType
    close_mappings:
    - stix:StixAttackPattern
    - sepses_capec:CAPEC
    - schema:DefinedTerm
    - skos:Concept
    related_mappings:
    - attack:AttackTechnique
    attributes:
      Abstraction:
        required: true
        range: CapecAbstraction
        description: How concrete the pattern is.
        close_mappings:
        - sepses_capec:abstraction
      Extended_Description:
        range: capec_structured_text
        description: A longer account of the pattern.
      Alternate_Terms:
        range: CapecAlternateTerm
        multivalued: true
        inlined_as_list: true
        description: Other names for the pattern.
        close_mappings:
        - stix:aliases
      Likelihood_Of_Attack:
        range: CapecLikelihood
        description: How likely an attack of this kind is to succeed.
        close_mappings:
        - sepses_capec:likelihoodOfAttack
      Typical_Severity:
        range: CapecSeverity
        description: How bad the outcome usually is.
        close_mappings:
        - sepses_capec:typicalSeverity
      Related_Attack_Patterns:
        range: CapecRelatedAttackPattern
        multivalued: true
        inlined_as_list: true
        description: The pattern's relations to others.
        close_mappings:
        - sepses_capec:hasRelatedAttackPattern
      Execution_Flow:
        range: CapecAttackStep
        multivalued: true
        inlined_as_list: true
        description: The steps an adversary typically takes.
        close_mappings:
        - sepses_capec:hasExecutionFlow
      Prerequisites:
        range: capec_structured_text
        multivalued: true
        description: Conditions that must hold for the attack to work.
        close_mappings:
        - sepses_capec:prerequisite
      Skills_Required:
        range: CapecSkill
        multivalued: true
        inlined_as_list: true
        description: The skills an adversary needs.
        close_mappings:
        - sepses_capec:hasSkillRequired
      Resources_Required:
        range: capec_structured_text
        multivalued: true
        description: What an adversary must have to hand, such as tools or addresses.
        close_mappings:
        - sepses_capec:resourceRequired
      Indicators:
        range: capec_structured_text
        multivalued: true
        description: Signs that an attack is near, under way or over.
        close_mappings:
        - sepses_capec:indicator
      Consequences:
        range: CapecConsequence
        multivalued: true
        inlined_as_list: true
        description: What can happen if the attack succeeds.
        close_mappings:
        - sepses_capec:hasConsequence
      Mitigations:
        range: capec_structured_text
        multivalued: true
        description: Ways to prevent the attack or lessen its harm.
        comments:
        - The mitre/cti repository publishes each of these as a STIX course-of-action joined by a mitigates
          relationship, so that mapping is only related.
        close_mappings:
        - sepses_capec:hasMitigation
        related_mappings:
        - stix:StixCourseOfAction
      Example_Instances:
        range: capec_structured_text
        multivalued: true
        description: Concrete examples of the attack.
        close_mappings:
        - skos:example
      Related_Weaknesses:
        range: CapecRelatedWeakness
        multivalued: true
        inlined_as_list: true
        description: The weaknesses that can make the attack possible.
        close_mappings:
        - sepses_capec:hasRelatedWeakness
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: capec_structured_text
    slots:
    - description
  CapecCategory:
    is_a: CapecEntry
    mixins:
    - CapecTaxonomyMappedMixin
    description: A group of attack patterns that share an effect or intent, and not itself a pattern of
      attack.
    annotations:
      xsd_type: CategoryType
    close_mappings:
    - skos:Collection
    attributes:
      Relationships:
        range: CapecRelationships
        inlined: true
        description: What the category holds and belongs to.
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: capec_structured_text
    slots:
    - description
  CapecView:
    is_a: CapecEntry
    description: One way of looking over the catalogue, by a hierarchy or by a slice of its entries.
    comments:
    - A graph view reads as a concept scheme, while a slice is only a selection, so the mapping is related.
    annotations:
      xsd_type: ViewType
    related_mappings:
    - skos:ConceptScheme
    attributes:
      Type:
        required: true
        range: CapecViewType
        description: How the view selects its entries.
      Audience:
        range: CapecStakeholder
        multivalued: true
        inlined_as_list: true
        description: Who the view is meant for.
      Members:
        range: CapecRelationships
        inlined: true
        description: The entries the view holds.
      Filter:
        description: A query over the catalogue that selects the view's entries.
        comments:
        - The XSD calls this an XSL query. Eight of the nine in CAPEC 3.9 are XPath 1.0, and view 553's
          is XPath 2.0.
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: capec_structured_text
    slots:
    - description
  CapecAttackPatternCatalog:
    description: One release of the whole catalogue, with its entries and the references they share.
    comments:
    - Wikidata's item is the catalogue in general and this class is one release of it, so the item is
      related.
    annotations:
      xsd_type: Attack_Pattern_Catalog
    close_mappings:
    - schema:DefinedTermSet
    - skos:ConceptScheme
    related_mappings:
    - wd:Q2986817
    attributes:
      Name:
        required: true
        description: The catalogue's name.
        close_mappings:
        - schema:name
      Version:
        required: true
        description: The catalogue's version, which together with its name identifies it.
        close_mappings:
        - schema:version
      Date:
        required: true
        range: date
        description: The day this catalogue was made or last updated.
        close_mappings:
        - dcterms:date
      Attack_Patterns:
        range: CapecAttackPattern
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: The attack patterns.
      Categories:
        range: CapecCategory
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: The categories.
      Views:
        range: CapecView
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: The views.
      External_References:
        range: CapecExternalReference
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: The external references that entries cite.
enums:
  CapecImportance:
    description: How much a change to an entry matters to anyone relying on it.
    annotations:
      xsd_type: ImportanceEnumeration
    permissible_values:
      Normal:
        description: A change that leaves the entry's meaning as it was.
      Critical:
        description: A change to the entry's meaning or to how it may be read.
  CapecNoteType:
    description: What kind of remark a note makes.
    annotations:
      xsd_type: NoteTypeEnumeration
    permissible_values:
      Maintenance:
        description: Work on the entry still to be done.
      Relationship:
        description: Detail on how entries relate.
      Research Gap:
        description: Something the research community could look into further.
      Terminology:
        description: A question of wording, such as competing uses of one term.
      Other:
        description: A remark of no listed kind.
  CapecStatus:
    description: How far an entry has got through CAPEC's review.
    comments:
    - The XSD and MITRE's schema documentation list these values and define only what happens to a deprecated
      entry, so the others carry no description here.
    annotations:
      xsd_type: StatusEnumeration
    permissible_values:
      Deprecated:
        description: Withdrawn from the catalogue, though its number stays taken.
      Draft: null
      Incomplete: null
      Obsolete: null
      Stable: null
      Usable: null
  CapecTaxonomyMappingFit:
    description: How well an entry fits the entry of another taxonomy that it maps to.
    comments:
    - The XSD and MITRE's schema documentation list these values without defining them. The mappings rest
      on the names of the first three values, and CAPEC 3.9 sets none of them.
    annotations:
      xsd_type: TaxonomyMappingFitEnumeration
    permissible_values:
      Exact:
        close_mappings:
        - skos:exactMatch
      CAPEC More Abstract:
        close_mappings:
        - skos:narrowMatch
      CAPEC More Specific:
        close_mappings:
        - skos:broadMatch
      Imprecise: null
      Perspective: null
  CapecTaxonomyName:
    description: The other taxonomies that CAPEC maps to.
    annotations:
      xsd_type: TaxonomyNameEnumeration
    permissible_values:
      ATTACK:
        description: MITRE ATT&CK. An entry's Entry_ID there is the technique's number without its T.
      WASC:
        description: The Web Application Security Consortium's threat classification.
      OWASP Attacks:
        description: The attack list of the Open Worldwide Application Security Project.
  CapecContributionType:
    description: Whether a contribution changed an entry's content or only commented on it.
    annotations:
      xsd_type: ContentHistoryType/Contribution/@Type
    permissible_values:
      Content:
        description: Text given to the entry.
      Feedback:
        description: Remarks on the entry.
  CapecAbstraction:
    description: How concrete an attack pattern is.
    annotations:
      xsd_type: AbstractionEnumeration
    permissible_values:
      Meta:
        description: A broad approach, free of any one technology, for use in design-level threat modelling.
      Standard:
        description: One method or technique, often only a part of a whole attack.
      Detailed:
        description: One technique against one technology, usually with its steps set out.
  CapecLikelihood:
    description: How likely something is to happen.
    annotations:
      xsd_type: LikelihoodEnumeration
    permissible_values:
      High: null
      Medium: null
      Low: null
      Unknown:
        description: Nobody knows how likely it is.
  CapecRelatedNature:
    description: How one attack pattern relates to another.
    comments:
    - 'The natures come in pairs: ChildOf and ParentOf, CanFollow and CanPrecede. The XSD says CanAlsoBe
      need not hold in both directions and says nothing on whether PeerOf does. CAPEC 3.9 uses ChildOf
      and never ParentOf, and records no pair from both ends.'
    annotations:
      xsd_type: RelatedNatureEnumeration
    permissible_values:
      ChildOf:
        description: The other pattern is more abstract, and this one specialises it.
        annotations:
          inverse: ParentOf
        close_mappings:
        - skos:broader
      ParentOf:
        description: The other pattern is less abstract, and it specialises this one.
        annotations:
          inverse: ChildOf
        close_mappings:
        - skos:narrower
      CanFollow:
        description: In a chain of attack, this pattern may come after the other.
        annotations:
          inverse: CanPrecede
      CanPrecede:
        description: In a chain of attack, this pattern may come before the other.
        annotations:
          inverse: CanFollow
      CanAlsoBe:
        description: In some settings this pattern can also be read as the other one, though not always
          the reverse.
      PeerOf:
        description: The two are alike in a way that no other nature covers.
        related_mappings:
        - skos:related
  CapecScope:
    description: The security property that a consequence violates.
    annotations:
      xsd_type: ScopeEnumeration
    permissible_values:
      Confidentiality: null
      Integrity: null
      Availability: null
      Access Control: null
      Accountability: null
      Authentication: null
      Authorization: null
      Non-Repudiation: null
      Other: null
  CapecSeverity:
    description: How bad the typical outcome of an attack is.
    annotations:
      xsd_type: SeverityEnumeration
    permissible_values:
      Very High: null
      High: null
      Medium: null
      Low: null
      Very Low: null
  CapecSkillLevel:
    description: How much skill or knowledge an adversary needs.
    annotations:
      xsd_type: SkillLevelEnumeration
    permissible_values:
      High: null
      Medium: null
      Low: null
      Unknown:
        description: Nobody knows how much is needed.
  CapecStakeholderType:
    description: The kinds of people a view is meant for.
    annotations:
      xsd_type: StakeholderEnumeration
    permissible_values:
      Academic Researchers: null
      Applied Researchers: null
      Assessment Customers: null
      Assessment Vendors: null
      CAPEC Team: null
      Educators: null
      Information Providers: null
      Software Customers: null
      Software Designers: null
      Software Developers: null
      Software Vendors: null
      Other: null
  CapecTechnicalImpact:
    description: What a successful attack does to the system, in technical terms.
    annotations:
      xsd_type: TechnicalImpactEnumeration
    permissible_values:
      Modify Data: null
      Read Data: null
      Unreliable Execution: null
      Resource Consumption: null
      Execute Unauthorized Commands: null
      Gain Privileges: null
      Bypass Protection Mechanism: null
      Hide Activities: null
      Alter Execution Logic: null
      Other: null
  CapecViewType:
    description: How a view selects its entries.
    annotations:
      xsd_type: ViewTypeEnumeration
    permissible_values:
      Implicit:
        description: A slice picked by a filter on an attribute, such as every pattern of one status.
      Explicit:
        description: A slice picked by hand because of something outside the catalogue, such as a list.
      Graph:
        description: A hierarchy seen from one standpoint, often from category down to detailed pattern.
  CapecAttackStepPhase:
    description: Which stage of an attack a step belongs to.
    comments:
    - The XSD and MITRE's schema documentation list these values without defining them.
    annotations:
      xsd_type: ExecutionFlowType/Attack_Step/Phase
    permissible_values:
      Explore: null
      Experiment: null
      Exploit: null
types:
  capec_numeric_id:
    typeof: string
    pattern: ^[1-9][0-9]*$
    description: The number of a CAPEC entry or a CWE weakness, written as a string of digits.
    comments:
    - The XSD types these as xs:integer. They name things and nothing counts them, and the rdflib dumper
      in linkml-runtime 1.12.1 cannot turn a bare identifier into an IRI, so the digits stay a string.
  capec_reference_id:
    typeof: string
    pattern: ^REF-[0-9]+$
    description: The identifier of an external reference, such as REF-1.
    comments:
    - The XSD types this as xs:string and gives REF-1 as its form, which every reference in the catalogue
      follows.
  capec_structured_text:
    typeof: string
    description: Text that may hold XHTML markup such as paragraphs and lists, with no namespace prefix.
  capec_uri:
    typeof: string
    base: str
    uri: xsd:anyURI
    description: An address, as XML Schema's anyURI admits it.
    comments:
    - LinkML's own uri type asks for an RFC 3986 URI, which the validator enforces, and anyURI also admits
      a relative reference. CAPEC 3.9 writes none, but lmodel/cwe's catalogue does, and both schemas keep
      the XSD's looseness.
  capec_year:
    typeof: string
    pattern: ^-?([1-9][0-9]{3,}|0[0-9]{3})(Z|[+-]((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?$
    description: A year in the XSD's xs:gYear form, such as 2004.
  capec_month:
    typeof: string
    pattern: ^--(0[1-9]|1[0-2])(Z|[+-]((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?$
    description: A month in the XSD's xs:gMonth form, such as --02 for February.
  capec_day:
    typeof: string
    pattern: ^---(0[1-9]|[12][0-9]|3[01])(Z|[+-]((0[0-9]|1[0-3]):[0-5][0-9]|14:00))?$
    description: A day of the month in the XSD's xs:gDay form, such as ---08.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: CapecExternalReference, CapecEntry; dropped
  for LOKF''s: Reference_ID, ID; folded into LOKF''s: CapecExternalReference.Title -> title, CapecEntry.Name
  -> title, CapecAttackPattern.Description -> description, CapecCategory.Summary -> description, CapecView.Objective
  -> description.'

      control_id:
        required: true
    in_subset:
    - assessment_common
  SelectObjectiveById:
    description: Used to select a control objective for inclusion/exclusion.
    slots:
    - objective_id
    - remarks
    slot_usage:
      objective_id:
        required: true
    in_subset:
    - assessment_common
  AssessmentSubject:
    description: Identifies system elements being assessed, such as components, inventory items, and locations.

    - ssp
  SspInventoryItem:
    is_a: InventoryItem
    description: SSP-scoped inventory item with allows-authenticated-scan property typing.
    slot_usage:
      props:
        range: SspAllowsAuthenticatedScanProp
    in_subset:
    - ssp
  AssessmentResultsDocument:
    is_a: OscalDocument
    description: Root wrapper for an OSCAL Assessment Results document.
    slots:
    - assessment_results
    slot_usage:
      assessment_results:
        required: true
    in_subset:
    - assessment_results
  AssessmentResults:

    mixins:
    - OscalCommon
    slots:
    - subject_uuid
    - oscal_type
    - oscal_title
    slot_usage:
      subject_uuid:
        required: true
      oscal_type:
        any_of:
        - range: SelectSubjectTypeEnum
        - range: string
        required: true
    in_subset:
    - assessment_common
  AssessmentSubjectPlaceholder:
    description: Used when the assessment subjects will be determined as part of one or more other assessment

    - OscalCommon
    slots:
    - uuid
    - oscal_title
    - oscal_description
    - start
    - end
    - logged_by
    - related_tasks
    slot_usage:
      uuid:
        required: true
      start:
        required: true
    in_subset:
    - assessment_results
  ComponentDefinitionDocument:

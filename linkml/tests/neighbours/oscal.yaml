id: https://w3id.org/lmodel/oscal-lokf
name: oscal
title: Open Security Controls Assessment Language (OSCAL)
description: 'A LinkML model of NIST''s Open Security Controls Assessment Language (OSCAL) 1.2.3: the
  catalog, profile, component definition, system security plan, assessment plan, assessment results, plan
  of action and milestones, and mapping collection models, each in a module of its own.'
license: Apache-2.0
version: 1.2.3
source: https://github.com/usnistgov/OSCAL/tree/e061961c7702afeabffdf5e59894d35e748dade1/src/metaschema
see_also:
- https://lmodel.github.io/oscal
- https://pages.nist.gov/OSCAL/
- https://pages.nist.gov/OSCAL-Reference/models/v1.2.3/
- https://github.com/usnistgov/OSCAL/releases/tag/v1.2.3
annotations:
  oscal_tag: v1.2.3
  oscal_commit: e061961c7702afeabffdf5e59894d35e748dade1
  uuid: 5bda39c3-8ebf-4717-b21f-c96a20c27f18
  last-modified: '2026-10-28T23:30:00Z'
comments:
- The version is the OSCAL release the model renders. Its tag and commit are in the annotations, and src/oscal/schema/metaschema/
  holds that commit's metaschema sources, where every allowed-values list an enum renders is defined;
  each enum's oscal_allowed_values annotation names its lists. scripts/check_upstream_release.py reads
  the same pins and reports when NIST tags a newer release or the copy drifts. The release tags are the
  schema's own versions.
notes:
- 'Every time the content of an OSCAL file changes, the following must also change:'
- A new UUID value must be generated and assigned to the root element's uuid.
- The last-modified field in metadata must be assigned with the date and time at the moment the file is
  saved with the modified content.
- These are two mechanisms by which tools can quickly know if a file has changed since it was last encountered.
  This document level UUID is the only UUID in OSCAL associated with version control.
- When converting between formats, such as XML to JSON, these values should remain the same. This enables
  tools to know the content within the two formats is equivalent.
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: Catalog, Profile, AssessmentPlan, SystemSecurityPlan,
  AssessmentResults, ComponentDefinition, MappingCollection, PlanOfActionAndMilestones; renamed, IRIs
  unchanged: Revision -> OscalRevision, Role -> OscalRole, Citation -> OscalCitation, Parameter -> OscalParameter,
  title -> oscal_title, description -> oscal_description, id -> oscal_id, name -> oscal_name, type ->
  oscal_type, status -> oscal_status, sources -> oscal_sources, last-modified -> oscal_last_modified,
  version -> oscal_version, media-type -> oscal_media_type, algorithm -> oscal_algorithm, constraints
  -> oscal_constraints, unit -> oscal_unit, target -> oscal_target, reason -> oscal_reason, source ->
  oscal_source, predicate -> oscal_predicate; renamed for one canonical form: oscal-version -> oscal_oscal_version.'
prefixes:
  oscal: https://w3id.org/lmodel/oscal/
  linkml: https://w3id.org/linkml/
default_prefix: oscal
default_range: string
imports:
- linkml:types
- lokf
classes:
  HasPropsAndLinks:
    mixin: true
    description: Mixin providing the props and links slots that are common to many OSCAL objects.
    slots:
    - props
    - links
    in_subset:
    - oscal_catalog
  OscalCommon:
    mixin: true
    description: Mixin providing props, links, and remarks slots common to most OSCAL objects. Extends
      HasPropsAndLinks.
    mixins:
    - HasPropsAndLinks
    slots:
    - remarks
    in_subset:
    - oscal_catalog
  HasResponsibleRoles:
    mixin: true
    description: Mixin providing the responsible-roles slot for objects that carry role assignments.
    slots:
    - responsible_roles
    in_subset:
    - oscal_catalog
  HasResponsibleParties:
    mixin: true
    description: Mixin providing the responsible-parties slot for objects that carry party assignments.
    slots:
    - responsible_parties
    in_subset:
    - oscal_catalog
  OscalDocument:
    description: A root wrapper for an OSCAL document, which may be of any OSCAL document type (e.g. Catalog,
      Profile, Assessment Plan, SSP).
    in_subset:
    - oscal_catalog
  CatalogDocument:
    is_a: OscalDocument
    description: Root wrapper for an OSCAL Catalog document.
    slots:
    - catalog
    slot_usage:
      catalog:
        required: true
    in_subset:
    - oscal_catalog
  Catalog:
    description: A structured, organized collection of control information.
    slots:
    - uuid
    - metadata
    - back_matter
    - params
    - controls
    - groups
    slot_usage:
      uuid:
        required: true
        description: Provides a globally unique means to identify a given catalog instance.
      metadata:
        required: true
    in_subset:
    - oscal_catalog
    is_a: Concept
  Group:
    description: A group of controls, or of groups of controls.
    mixins:
    - HasPropsAndLinks
    slots:
    - oscal_id
    - class_
    - oscal_title
    - params
    - parts
    - groups
    - controls
    slot_usage:
      oscal_id:
        description: Identifies the group for the purpose of cross-linking within the defining instance
          or from other instances that reference the catalog.
      class_:
        description: A textual label that provides a sub-type or characterization of the group.
      oscal_title:
        required: true
        description: A name given to the group, which may be used by a tool for display and navigation.
    in_subset:
    - oscal_catalog
  Control:
    description: A structured object representing a requirement or guideline, which when implemented will
      reduce an aspect of risk related to an information system and its information.
    mixins:
    - HasPropsAndLinks
    slots:
    - oscal_id
    - class_
    - oscal_title
    - params
    - parts
    - controls
    slot_usage:
      oscal_id:
        required: true
        description: Identifies a control such that it can be referenced in the defining catalog and other
          OSCAL instances (e.g., profiles).
      class_:
        description: A textual label that provides a sub-type or characterization of the control.
      oscal_title:
        required: true
        description: A name given to the control, which may be used by a tool for display and navigation.
    in_subset:
    - oscal_catalog
  Metadata:
    description: Provides information about the containing document, and defines concepts shared across
      the document.
    mixins:
    - OscalCommon
    - HasResponsibleParties
    slots:
    - oscal_title
    - published
    - oscal_last_modified
    - oscal_version
    - oscal_oscal_version
    - document_ids
    - revisions
    - roles
    - locations
    - parties
    - actions
    slot_usage:
      oscal_title:
        required: true
        description: A name given to the document.
      oscal_last_modified:
        required: true
        description: The date and time the document was last stored for later retrieval.
      oscal_version:
        required: true
        description: Used to distinguish a specific revision of an OSCAL document.
      oscal_oscal_version:
        required: true
        description: The OSCAL model version the document was authored against.
      props:
        range: MetadataProperty
      links:
        range: Link
    in_subset:
    - oscal_metadata
  OscalRevision:
    description: An entry in a sequential list of revisions to the containing document.
    mixins:
    - OscalCommon
    slots:
    - oscal_title
    - published
    - oscal_last_modified
    - oscal_version
    - oscal_oscal_version
    slot_usage:
      oscal_version:
        required: true
      props:
        range: RevisionProperty
      links:
        range: Link
    in_subset:
    - oscal_metadata
    class_uri: oscal:Revision
    aliases:
    - Revision
  DocumentId:
    description: A document identifier qualified by an identifier scheme.
    slots:
    - scheme
    - identifier
    slot_usage:
      scheme:
        any_of:
        - range: DocumentIdSchemeEnum
        - range: URIType
      identifier:
        required: true
    in_subset:
    - oscal_metadata
  OscalRole:
    description: Defines a function, which might be assigned to a party in a specific situation.
    mixins:
    - OscalCommon
    slots:
    - oscal_id
    - oscal_title
    - short_name
    - oscal_description
    slot_usage:
      oscal_id:
        required: true
        description: A unique identifier for the role.
      oscal_title:
        required: true
    in_subset:
    - oscal_metadata
    class_uri: oscal:Role
    aliases:
    - Role
  Location:
    description: A physical point of presence, which may be associated with people, organizations, or
      other concepts within the current or linked OSCAL document.
    mixins:
    - OscalCommon
    slots:
    - uuid
    - oscal_title
    - email_addresses
    - telephone_numbers
    - address
    - urls
    slot_usage:
      uuid:
        required: true
      props:
        range: LocationProperty
    in_subset:
    - oscal_metadata
  Party:
    description: An organization or person, which may be associated with roles or other concepts within
      the current or linked OSCAL document.
    mixins:
    - OscalCommon
    slots:
    - uuid
    - oscal_type
    - oscal_name
    - short_name
    - email_addresses
    - telephone_numbers
    - external_ids
    - addresses
    - location_uuids
    - member_of_organizations
    slot_usage:
      uuid:
        required: true
      oscal_type:
        range: PartyTypeEnum
        required: true
        description: A category describing the kind of party the object describes.
      oscal_name:
        range: string
        description: The full name of the party.
      props:
        range: PartyProperty
      external_ids:
        range: MetadataPartyExternalId
    rules:
    - title: addresses-xor-location-uuids
      description: A party may have inline addresses or location UUID references, but not both (metaschema
        <choice> constraint).
      preconditions:
        slot_conditions:
          addresses:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          location_uuids:
            value_presence: ABSENT
    - title: location-uuids-xor-addresses
      preconditions:
        slot_conditions:
          location_uuids:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          addresses:
            value_presence: ABSENT
    in_subset:
    - oscal_metadata
  PartyExternalId:
    description: An identifier for a person or organization using a designated scheme, e.g. an Open Researcher
      and Contributor ID (ORCID).
    slots:
    - scheme
    - oscal_id
    slot_usage:
      scheme:
        any_of:
        - range: PartyExternalIdSchemeEnum
        - range: URIType
        required: true
        description: Indicates the type of external identifier.
      oscal_id:
        range: string
        required: true
    in_subset:
    - oscal_metadata
  ResponsibleParty:
    description: A reference to a set of persons and/or organizations that have responsibility for performing
      the referenced role in the context of the containing object.
    mixins:
    - OscalCommon
    slots:
    - role_id
    - party_uuids
    slot_usage:
      role_id:
        any_of:
        - range: MetadataResponsiblePartyRoleIdEnum
        - range: TokenType
        required: true
        description: A reference to a role performed by a party.
      party_uuids:
        required: true
    in_subset:
    - oscal_metadata
  ResponsibleRole:
    description: A reference to a role with responsibility for performing a function relative to the containing
      object, optionally associated with a set of persons and/or organizations that perform that role.
    mixins:
    - OscalCommon
    slots:
    - role_id
    - party_uuids
    slot_usage:
      role_id:
        required: true
        description: A human-oriented identifier reference to a role performed.
    in_subset:
    - oscal_metadata
  Action:
    description: An action applied by a role within a given party to the content.
    mixins:
    - OscalCommon
    - HasResponsibleParties
    slots:
    - uuid
    - oscal_type
    - date
    - system
    slot_usage:
      uuid:
        required: true
        description: A unique identifier that can be used to reference this defined action elsewhere in
          an OSCAL document.
      oscal_type:
        range: ActionTypeEnum
        required: true
        description: The type of action documented by the assembly, such as an approval.
      system:
        any_of:
        - range: ActionSystemEnum
        - range: URIType
        required: true
    in_subset:
    - oscal_metadata
  TelephoneNumber:
    description: A telephone service number as defined by ITU-T E.164.
    slots:
    - oscal_type
    - number
    slot_usage:
      oscal_type:
        any_of:
        - range: PhoneTypeEnum
        - range: string
        description: 'Indicates the type of phone number. Recommended values: home, office, mobile. Other
          values are permitted (OSCAL allow-other="yes").'
      number:
        required: true
    in_subset:
    - oscal_metadata
  Address:
    description: A postal address for the location.
    slots:
    - oscal_type
    - addr_lines
    - city
    - state
    - postal_code
    - country
    slot_usage:
      oscal_type:
        any_of:
        - range: AddressTypeEnum
        - range: string
        description: 'Indicates the type of address. Recommended values: home, work. Other values are
          permitted (OSCAL allow-other="yes").'
    in_subset:
    - oscal_metadata
  Hash:
    description: A representation of a cryptographic digest generated over a resource using a specified
      hash algorithm.
    slots:
    - value
    - oscal_algorithm
    slot_usage:
      value:
        required: true
      oscal_algorithm:
        required: true
    in_subset:
    - oscal_metadata
  Property:
    description: An attribute, characteristic, or quality of the containing object expressed as a namespace
      qualified name/value pair.
    slots:
    - oscal_name
    - uuid
    - ns
    - value
    - class_
    - remarks
    - group
    slot_usage:
      oscal_name:
        required: true
        description: A textual label, within a namespace, that identifies a specific attribute, characteristic,
          or quality of the property's containing object.
      uuid:
        description: A unique identifier for a property.
      ns:
        description: A namespace qualifying the property's name. This allows different organizations to
          associate distinct semantics with the same name.
      value:
        required: true
        description: Indicates the value of the attribute, characteristic, or quality.
      class_:
        description: A textual label that provides a sub-type or characterization of the property's name.
    in_subset:
    - oscal_metadata
  MetadataProperty:
    is_a: Property
    description: Metadata-scoped OSCAL property.
    slot_usage:
      oscal_name:
        range: MetadataPropNameEnum
    in_subset:
    - oscal_metadata
  RevisionProperty:
    is_a: Property
    description: Revision-scoped OSCAL property.
    slot_usage:
      oscal_name:
        range: RevisionPropNameEnum
    in_subset:
    - oscal_metadata
  LocationProperty:
    is_a: Property
    description: Location-scoped OSCAL property.
    slot_usage:
      oscal_name:
        range: LocationPropNameEnum
      value:
        any_of:
        - range: LocationPropTypeEnum
        - range: string
      class_:
        any_of:
        - range: LocationDataCenterClassEnum
        - range: string
    in_subset:
    - oscal_metadata
  PartyProperty:
    is_a: Property
    description: Party-scoped OSCAL property.
    slot_usage:
      oscal_name:
        range: PartyPropNameEnum
    in_subset:
    - oscal_metadata
  ResourceProperty:
    is_a: Property
    description: Back-matter resource-scoped OSCAL property.
    slot_usage:
      oscal_name:
        range: ResourcePropNameEnum
      value:
        any_of:
        - range: ResourcePropTypeEnum
        - range: string
    in_subset:
    - oscal_back_matter
  PartProperty:
    is_a: Property
    description: Control-common part-scoped OSCAL property.
    slot_usage:
      oscal_name:
        range: PartPropNameEnum
    in_subset:
    - oscal_control_common
  ParameterProperty:
    is_a: Property
    description: Control-common parameter-scoped OSCAL property.
    slot_usage:
      oscal_name:
        any_of:
        - range: ParameterPropNameEnum
        - range: RmfParameterPropNameEnum
    in_subset:
    - oscal_control_common
  MetadataPartyExternalId:
    is_a: PartyExternalId
    description: Metadata-scoped external identifier.
    in_subset:
    - oscal_metadata
  Link:
    description: A reference to a local or remote resource, that has a specific relation to the containing
      object.
    slots:
    - href
    - rel
    - resource_fragment
    - oscal_media_type
    - text
    slot_usage:
      href:
        required: true
        description: A resolvable URL reference to a resource.
      rel:
        any_of:
        - range: MetadataLinkRelEnum
        - range: TokenType
    in_subset:
    - oscal_metadata
  BackMatter:
    description: A collection of resources that may be referenced from within the OSCAL document instance.
    slots:
    - resources
    in_subset:
    - oscal_back_matter
  Resource:
    description: A resource associated with content in the containing document instance. A resource may
      be directly included in the document using base64 encoding or may point to one or more equivalent
      internet resources.
    slots:
    - uuid
    - oscal_title
    - oscal_description
    - props
    - document_ids
    - remarks
    - citation
    - rlinks
    - base64
    slot_usage:
      uuid:
        required: true
        description: A unique identifier for a resource.
      oscal_title:
        description: An optional name given to the resource, which may be used by a tool for display and
          navigation.
      oscal_description:
        description: An optional short summary of the resource used to indicate the purpose of the resource.
      props:
        range: ResourceProperty
      document_ids:
        range: DocumentId
    in_subset:
    - oscal_back_matter
  OscalCitation:
    description: An optional citation consisting of end note text using structured markup.
    mixins:
    - HasPropsAndLinks
    slots:
    - text
    slot_usage:
      text:
        required: true
        description: A line of citation text.
      links:
        range: Link
    in_subset:
    - oscal_back_matter
    class_uri: oscal:Citation
    aliases:
    - Citation
  ResourceLink:
    description: A URL-based pointer to an external resource with an optional hash for verification and
      change detection.
    slots:
    - href
    - oscal_media_type
    - hashes
    slot_usage:
      href:
        required: true
        description: A resolvable URL pointing to the referenced resource.
    in_subset:
    - oscal_back_matter
  Base64Resource:
    description: A resource encoded using the Base64 alphabet defined by RFC 2045.
    slots:
    - oscal_media_type
    - value
    - filename
    slot_usage:
      value:
        range: Base64Type
        required: true
    in_subset:
    - oscal_back_matter
  Part:
    description: An annotated, markup-based textual element of a control's or catalog group's definition,
      or a child of another part.
    mixins:
    - HasPropsAndLinks
    slots:
    - oscal_id
    - oscal_name
    - ns
    - class_
    - oscal_title
    - prose
    - parts
    slot_usage:
      oscal_id:
        description: A unique identifier for the part.
      oscal_name:
        required: true
        description: A textual label that uniquely identifies the part's semantic type, which exists in
          a value space qualified by the ns.
      ns:
        description: An optional namespace qualifying the part's name. This allows different organizations
          to associate distinct semantics with the same name.
      class_:
        description: An optional textual providing a sub-type or characterization of the part's name,
          or a category to which the part belongs.
      oscal_title:
        description: An optional name given to the part, which may be used by a tool for display and navigation.
      prose:
        description: Permits multiple paragraphs, lists, tables etc.
      props:
        range: PartProperty
    in_subset:
    - oscal_control_common
  OscalParameter:
    description: Parameters provide a mechanism for the dynamic assignment of value(s) in a control.
    mixins:
    - OscalCommon
    slots:
    - oscal_id
    - class_
    - depends_on
    - label
    - usage
    - oscal_constraints
    - guidelines
    - values
    - select
    slot_usage:
      oscal_id:
        required: true
        description: A unique identifier for the parameter.
      class_:
        description: A textual label that provides a characterization of the type, purpose, use or scope
          of the parameter.
      props:
        range: ParameterProperty
    rules:
    - title: values-xor-select
      description: A parameter may have prescribed values or a selection construct, but not both (metaschema
        <choice> constraint).
      preconditions:
        slot_conditions:
          values:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          select:
            value_presence: ABSENT
    - title: select-xor-values
      preconditions:
        slot_conditions:
          select:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          values:
            value_presence: ABSENT
    in_subset:
    - oscal_control_common
    class_uri: oscal:Parameter
    aliases:
    - Parameter
  ParameterConstraint:
    description: A formal or informal expression of a constraint or test.
    slots:
    - oscal_description
    - tests
    slot_usage:
      oscal_description:
        description: A textual summary of the constraint to be applied.
    in_subset:
    - oscal_control_common
  ConstraintTest:
    description: A test expression which is expected to be evaluated by a tool.
    slots:
    - remarks
    - expression
    slot_usage:
      expression:
        required: true
    in_subset:
    - oscal_control_common
  ParameterGuideline:
    description: A prose statement that provides a recommendation for the use of a parameter.
    slots:
    - prose
    slot_usage:
      prose:
        required: true
        description: Prose permits multiple paragraphs, lists, tables etc.
    in_subset:
    - oscal_control_common
  ParameterSelection:
    description: Presenting a choice among alternatives.
    slots:
    - how_many
    - choice
    in_subset:
    - oscal_control_common
  IncludeAll:
    description: Include all controls from the imported catalog or profile resources.
    in_subset:
    - oscal_control_common
  ControlMatching:
    description: Selecting a set of controls by matching their IDs with a wildcard pattern.
    slots:
    - remarks
    - pattern
    in_subset:
    - oscal_control_common
  SelectControlById:
    description: Select a control or controls from an imported control set.
    slots:
    - with_child_controls
    - with_ids
    - matching
    in_subset:
    - oscal_control_common
  ProfileDocument:
    is_a: OscalDocument
    description: Root wrapper for an OSCAL Profile document.
    slots:
    - profile
    slot_usage:
      profile:
        required: true
    in_subset:
    - profile
  Profile:
    description: An OSCAL Profile that designates a set of controls from one or more catalogs or profiles,
      optionally restructures and modifies them, to describe a basis for a security standard or body of
      practice.
    slots:
    - uuid
    - metadata
    - imports
    - merge
    - modify
    - back_matter
    slot_usage:
      uuid:
        required: true
      metadata:
        required: true
      imports:
        required: true
    in_subset:
    - profile
    is_a: Concept
  ProfileImport:
    description: Designates a referenced source catalog or profile that provides a source of control information
      for use in creating a new overlay or baseline.
    slots:
    - href
    - include_all
    - include_controls
    - exclude_controls
    slot_usage:
      href:
        required: true
      include_controls:
        range: SelectControlById
      exclude_controls:
        range: SelectControlById
    in_subset:
    - profile
  ProfileMerge:
    description: Provides structuring directives that instruct how controls are organized after profile
      resolution.
    slots:
    - combine
    - flat
    - as_is
    - custom
    in_subset:
    - profile
  CombinationRule:
    description: Defines how to resolve duplicate instances of the same control (e.g., controls with the
      same ID) encountered in a profile merge.
    slots:
    - method
    slot_usage:
      method:
        range: CombinationMethodEnum
    in_subset:
    - profile
  MergeFlat:
    description: Directs that controls appear without any grouping structure after profile resolution.
    in_subset:
    - profile
  MergeCustom:
    description: Provides an alternate grouping structure that selected controls will be placed in after
      profile resolution.
    slots:
    - groups
    - insert_controls
    slot_usage:
      groups:
        range: ProfileGroup
    in_subset:
    - profile
  ProfileGroup:
    description: A group of (selected) controls or of groups of controls within a profile custom merge
      structure.
    mixins:
    - OscalCommon
    slots:
    - oscal_id
    - class_
    - oscal_title
    - params
    - parts
    - groups
    - insert_controls
    slot_usage:
      oscal_title:
        required: true
      groups:
        range: ProfileGroup
    in_subset:
    - profile
  ProfileModify:
    description: Set parameters or amend controls in resolution.
    slots:
    - set_parameters
    - alters
    slot_usage:
      set_parameters:
        range: ParameterSetting
        description: A parameter setting to be propagated to points of insertion.
    in_subset:
    - profile
  ParameterSetting:
    description: A parameter setting to be propagated to points of insertion in a resolved profile.
    mixins:
    - HasPropsAndLinks

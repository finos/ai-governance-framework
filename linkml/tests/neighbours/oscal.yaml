    - oscal_description
    - include_all
    - include_controls
    - exclude_controls
    slot_usage:
      include_controls:
        range: AssessmentSelectControlById
      exclude_controls:
        range: AssessmentSelectControlById
    in_subset:
    - assessment_common
  ControlObjectiveSelection:
    description: Identifies the control objectives of the assessment.
    mixins:
    - OscalCommon

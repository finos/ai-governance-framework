      subject_uuid:
        required: true
      oscal_type:
        any_of:
        - range: SelectSubjectTypeEnum
        - range: string
        required: true
    in_subset:
    - assessment_common
  SubjectReference:
    description: A human-oriented identifier reference to a resource. Use type to indicate whether the

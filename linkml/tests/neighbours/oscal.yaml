    - system_ids
    - system_name
    - system_name_short
    - oscal_description
    - props
    - links
    - date_authorized
    - security_sensitivity_level
    - system_information
    - security_impact_level
    - system_status
    - authorization_boundary
    - network_architecture
    - data_flow
    - responsible_parties
    - remarks
    slot_usage:
      system_ids:
        required: true
      system_name:
        required: true
      oscal_description:
        required: true
      system_information:
        required: true
      system_status:
        required: true
      authorization_boundary:
        required: true
      props:
        range: SspSystemCharacteristicsProp
      responsible_parties:
        range: SspSystemCharacteristicsResponsibleParty
    in_subset:
    - ssp
  SystemInformation:
    description: Contains details about all information types that are stored, processed, or transmitted
      by the system, such as privacy information.
    slots:
    - props
    - links
    - information_types
    slot_usage:
      information_types:
        required: true
      props:
        range: SspSystemInformationProp
      links:
        range: SspSystemInformationLink
    in_subset:
    - ssp
  InformationType:
    description: Contains details about one information type that is stored, processed, or transmitted
      by the system, such as privacy information, and its impact level.
    slots:
    - uuid
    - oscal_title
    - oscal_description
    - categorizations
    - props
    - links
    - confidentiality_impact
    - integrity_impact
    - availability_impact
    slot_usage:
      oscal_title:
        required: true
      oscal_description:
        required: true
    in_subset:
    - ssp
  InformationTypeCategorization:
    description: A set of information type identifiers qualified by the given identification system used.
    attributes:
      system:
        any_of:
        - range: InformationTypeCategorizationSystemEnum
        - range: URIType
        required: true
        description: Specifies the information type identification system used. Recommended values are
          in InformationTypeCategorizationSystemEnum; other values are permitted (OSCAL allow-other="yes").
      information_type_ids:
        range: string
        multivalued: true
        description: An identifier qualified by the given identification system used, such as NIST SP
          800-60.
    in_subset:
    - ssp
  ImpactLevel:
    description: The expected level of impact resulting from the described information's confidentiality,
      integrity, or availability affect.
    slots:
    - props
    - links
    - base
    - selected
    - adjustment_justification
    slot_usage:
      base:
        any_of:
        - range: Fips199ImpactLevelEnum
        - range: string
        required: true
      selected:
        any_of:
        - range: Fips199ImpactLevelEnum
        - range: string
    in_subset:
    - ssp
  SecurityImpactLevel:
    description: The overall level of expected impact resulting from unauthorized disclosure, modification,
      or loss of access to information.
    slots:
    - security_objective_confidentiality
    - security_objective_integrity
    - security_objective_availability
    slot_usage:
      security_objective_confidentiality:
        required: true
      security_objective_integrity:
        required: true
      security_objective_availability:
        required: true
    in_subset:
    - ssp
  SystemStatus:
    description: Describes the operational status of the system.
    attributes:
      state:
        range: SystemOperatingStatusEnum
        required: true
        description: The current operating status of the system.
    slots:
    - remarks
    in_subset:
    - ssp
  AuthorizationBoundary:
    description: A description of this system's authorization boundary, optionally supplemented with diagrams
      that illustrate the authorization boundary.
    slots:
    - oscal_description
    - props
    - links
    - diagrams
    - remarks
    slot_usage:
      oscal_description:
        required: true
    in_subset:
    - ssp
  Diagram:
    description: A graphic that provides a visual representation the system, or some aspect of it.
    slots:
    - uuid
    - oscal_description
    - props
    - links
    - caption
    - remarks
    slot_usage:
      uuid:
        required: true
      links:
        range: SspDiagramLink
    in_subset:
    - ssp
  NetworkArchitecture:
    description: A description of the system's network architecture, optionally supplemented with diagrams
      that illustrate the network architecture.
    slots:
    - oscal_description
    - props
    - links
    - diagrams
    - remarks
    slot_usage:
      oscal_description:
        required: true
    in_subset:
    - ssp
  DataFlow:
    description: A description of the logical flow of information within the system and across its boundaries,
      optionally supplemented with diagrams.
    slots:
    - oscal_description
    - props
    - links
    - diagrams
    - remarks
    slot_usage:
      oscal_description:
        required: true
    in_subset:
    - ssp
  SystemImplementation:
    description: Provides information as to how the system is implemented.
    slots:
    - props
    - links
    - leveraged_authorizations
    - users
    - components
    - inventory_items
    - remarks
    slot_usage:
      components:
        required: true
        range: SspSystemComponent
      inventory_items:
        range: SspInventoryItem
    in_subset:
    - ssp
  LeveragedAuthorization:
    description: A description of another authorized system from which this system inherits capabilities

      method:
        range: MappingMethodEnum
      oscal_status:
        range: MappingStatusEnum
      source_resource:
        required: true
      target_resource:
        required: true
      maps:
        required: true
    in_subset:
    - mapping_collection
  Map:
    description: A relationship-based mapping entry between source and target sets.
    mixins:
    - OscalCommon
    slots:
    - uuid
    - ns
    - matching_rationale
    - relationship
    - oscal_sources
    - targets
    - qualifiers
    - confidence_score
    - coverage
    slot_usage:
      uuid:
        required: true
      relationship:
        required: true
      oscal_sources:
        range: MappingItem
        required: true
      targets:
        required: true
    in_subset:
    - mapping_collection
  MappingItem:
    description: A source or target item participating in a mapping entry.
    mixins:
    - OscalCommon
    slots:
    - oscal_type
    - id_ref
    slot_usage:
      oscal_type:
        range: MappingSubjectTypeEnum
        required: true
      id_ref:
        required: true
    in_subset:
    - mapping_collection
  MappingResourceReference:
    description: A reference to the source or target resource for a mapping.
    mixins:
    - OscalCommon
    slots:
    - ns
    - oscal_type
    - href
    slot_usage:
      oscal_type:
        any_of:
        - range: MappingResourceTypeEnum
        - range: TokenType
        required: true
        description: The semantic type of the referenced resource. OSCAL defines catalog and profile,
          while locally defined values are also permitted.
      href:
        required: true
    in_subset:
    - mapping_collection
  QualifierItem:
    description: A qualifier describing requirements or incompatibilities.
    slots:
    - subject
    - oscal_predicate
    - category
    - oscal_description
    - remarks
    slot_usage:
      category:
        range: QualifierCategoryEnum
        required: true
      oscal_description:
        required: true
      oscal_predicate:
        required: true
      subject:
        required: true
    in_subset:
    - mapping_collection
  GapSummary:
    description: A summary of controls that were not mapped.
    slots:
    - uuid
    - unmapped_controls
    slot_usage:
      uuid:
        required: true
      unmapped_controls:
        required: true
    in_subset:
    - mapping_collection
  ConfidenceScore:
    description: Confidence represented as a category and/or percentage value.
    slots:
    - category
    - percentage
    slot_usage:
      category:
        any_of:
        - range: ConfidenceCategoryEnum
        - range: string
    in_subset:
    - mapping_collection
  Coverage:
    description: A percentage representing target coverage by source mappings.
    slots:
    - generation_method
    - target_coverage
    slot_usage:
      target_coverage:
        required: true
    in_subset:
    - mapping_collection
  PoamDocument:
    is_a: OscalDocument
    description: Root wrapper for an OSCAL Plan of Action and Milestones document.
    slots:
    - plan_of_action_and_milestones
    slot_usage:
      plan_of_action_and_milestones:
        required: true
    in_subset:
    - poam
  PlanOfActionAndMilestones:
    description: A plan of action and milestones that identifies initial and residual risks, deviations,
      and disposition.
    slots:
    - uuid
    - metadata
    - import_ssp
    - system_id
    - local_definitions
    - observations
    - risks
    - findings
    - poam_items
    - back_matter
    slot_usage:
      uuid:
        required: true
      metadata:
        required: true
      local_definitions:
        range: PoamLocalDefinitions
        inlined: true
      poam_items:
        required: true
    in_subset:
    - poam
    is_a: Concept
  PoamLocalDefinitions:
    description: Allows components and inventory items to be defined within the POA&M for cases where
      no OSCAL SSP is available with the POA&M.
    slots:
    - components
    - inventory_items
    - assessment_assets
    - remarks
    in_subset:
    - poam
  PoamItem:
    description: Describes an individual POA&M item.
    mixins:
    - OscalCommon
    slots:
    - uuid
    - oscal_title
    - oscal_description
    - origins
    - related_findings
    - related_observations
    - related_risks
    slot_usage:
      oscal_title:
        required: true
      oscal_description:
        required: true
    in_subset:
    - poam
  RelatedFinding:
    description: Relates a POA&M item to a referenced finding.
    slots:
    - finding_uuid
    - remarks
    slot_usage:
      finding_uuid:
        required: true
    in_subset:
    - poam
slots:
  uuid:

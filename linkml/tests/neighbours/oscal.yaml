    slots:
    - uuid
    - oscal_title
    - props
    - links
    - party_uuid
    - date_authorized
    - remarks
    slot_usage:
      uuid:
        required: true
      oscal_title:
        required: true
      party_uuid:
        required: true
      date_authorized:
        required: true
      links:
        range: SspLeveragedAuthorizationLink
    in_subset:
    - ssp
  SspControlImplementation:
    description: Describes how the system satisfies a set of controls.
    slots:
    - oscal_description
    - set_parameters
    - implemented_requirements
    slot_usage:
      set_parameters:
        range: SetParameter
        description: Identifies the parameter that will be set by the enclosed value.
      implemented_requirements:
        range: SspImplementedRequirement
        required: true
      oscal_description:
        required: true
    in_subset:
    - ssp
  SspImplementedRequirement:
    description: Describes how the system satisfies an individual control.
    slots:
    - uuid
    - control_id
    - props
    - links
    - set_parameters
    - responsible_roles
    - statements
    - by_components
    - remarks
    slot_usage:
      set_parameters:
        range: SetParameter
        description: Identifies the parameter that will be set by the enclosed value.
      statements:
        range: SspStatement
      uuid:
        required: true
      control_id:
        required: true
      props:
        range: SspControlOriginationProp
      responsible_roles:
        range: SspImplementedRequirementResponsibleRole
    in_subset:
    - ssp
  SspStatement:
    description: Identifies which statements within a control are addressed.
    slots:
    - statement_id
    - uuid
    - props
    - links
    - responsible_roles
    - by_components
    - remarks
    slot_usage:
      statement_id:
        required: true
      uuid:
        required: true
      props:
        range: SspControlOriginationProp
      responsible_roles:
        range: SspImplementedRequirementResponsibleRole
    in_subset:
    - ssp
  ByComponent:
    description: Defines how the referenced component implements a set of controls.
    slots:
    - component_uuid
    - uuid
    - oscal_description
    - props
    - links
    - set_parameters
    - implementation_status
    - export
    - inherited
    - satisfied
    - responsible_roles
    - remarks
    slot_usage:
      set_parameters:
        range: SetParameter
        description: Identifies the parameter that will be set by the enclosed value.
      component_uuid:
        required: true
      uuid:
        required: true
      oscal_description:
        required: true
      props:
        range: SspControlOriginationProp
      links:
        range: SspByComponentLink
      responsible_roles:
        range: SspByComponentResponsibleRole
    in_subset:
    - ssp
  Export:
    description: Defines a set of control implementations that are provided as reference implementations
      for use by organizations implementing the leveraged system.
    slots:
    - oscal_description
    - props
    - links
    - provided
    - responsibilities
    in_subset:
    - ssp
  ProvidedControlImplementation:
    description: Describes a capability which may be inherited by a leveraging system.
    slots:
    - uuid
    - oscal_description
    - props
    - links
    - responsible_roles
    - remarks
    slot_usage:
      uuid:
        required: true
      oscal_description:
        required: true
      responsible_roles:
        range: SspByComponentResponsibleRole
    in_subset:
    - ssp
  ControlResponsibility:
    description: Describes a control implementation responsibility imposed on a leveraging system.
    slots:
    - uuid
    - provided_uuid
    - oscal_description
    - props
    - links
    - responsible_roles
    - remarks
    slot_usage:
      uuid:
        required: true
      oscal_description:
        required: true
      responsible_roles:
        range: SspByComponentResponsibleRole
    in_subset:
    - ssp
  InheritedControlImplementation:
    description: Describes a control implementation inherited by a leveraging system.
    slots:
    - uuid
    - provided_uuid
    - oscal_description
    - props
    - links
    - responsible_roles
    - remarks
    slot_usage:
      uuid:
        required: true
      oscal_description:
        required: true
      responsible_roles:
        range: SspByComponentResponsibleRole
    in_subset:
    - ssp
  SatisfiedControlImplementation:
    description: Describes how this system satisfies a responsibility imposed by a leveraged system.
    slots:
    - uuid
    - responsibility_uuid
    - oscal_description
    - props
    - links
    - responsible_roles
    - remarks
    slot_usage:
      uuid:
        required: true
      oscal_description:
        required: true
      responsible_roles:
        range: SspByComponentResponsibleRole
    in_subset:
    - ssp
  SspSystemCharacteristicsProp:

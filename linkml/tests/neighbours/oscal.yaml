    - uuid
    - metadata
    - import_ap
    - local_definitions
    - results
    - back_matter
    slot_usage:
      uuid:
        required: true
        description: Assessment Results Universally Unique Identifier.
      metadata:
        required: true
      import_ap:
        required: true
      local_definitions:
        range: AssessmentResultsLocalDefinitions
        inlined: true
      results:
        required: true
    in_subset:
    - assessment_results
    is_a: Concept
  ImportAssessmentPlan:
    description: Used by assessment-results to import information about the original plan for assessing
      the system.
    slots:
    - href
    - remarks
    slot_usage:
      href:
        required: true
    in_subset:
    - assessment_results
  AssessmentResultsLocalDefinitions:
    description: Used to define data objects that are referenced by the assessment results but do not
      appear in the imported assessment plan.
    slots:
    - objectives_and_methods
    - activities
    - remarks
    in_subset:
    - assessment_results
  Result:
    description: Identifies all of the assessment observations and findings, initial and residual risks,
      deviations, and disposition for a particular execution of the assessment.
    mixins:
    - OscalCommon
    slots:
    - uuid
    - oscal_title
    - oscal_description
    - start
    - end
    - local_definitions
    - reviewed_controls
    - attestations
    - assessment_log
    - observations
    - risks
    - findings
    slot_usage:
      uuid:
        required: true
      oscal_title:
        required: true
      oscal_description:
        required: true
      start:
        required: true
      local_definitions:
        range: ResultLocalDefinitions
        inlined: true
      reviewed_controls:
        required: true
      assessment_log:
        inlined: true
    in_subset:
    - assessment_results
  ResultLocalDefinitions:

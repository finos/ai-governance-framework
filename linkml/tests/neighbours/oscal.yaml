    slot_usage:
      rel:
        any_of:
        - range: DiagramLinkRelEnum
        - range: string
    in_subset:
    - ssp
  SspLeveragedAuthorizationLink:
    is_a: Link
    description: SSP-scoped link used in leveraged authorization objects.
    slot_usage:
      rel:
        any_of:
        - range: LeveragedAuthorizationLinkRelEnum
        - range: string
    in_subset:
    - ssp
  SspByComponentLink:
    is_a: Link
    description: SSP-scoped link used in by-component contexts.
    slot_usage:
      rel:
        any_of:
        - range: ByComponentLinkRelEnum
        - range: string
    in_subset:
    - ssp
  SspSystemCharacteristicsResponsibleParty:

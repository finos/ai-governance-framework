  oscal_id:
    range: TokenType
    description: A unique human-oriented identifier within a particular context.
    slot_uri: oscal:id
    aliases:
    - id
  class_:
    range: TokenType
    description: A textual label that provides a sub-type or characterization.
    comments:
    - OSCAL's key is `class`. A slot or alias named `class` makes the generated dataclasses invalid Python,
      and gen-doc names a page after the slot, so `_class` hid its page from the site. `class_` is the
      spelling the generated Pydantic model gives a slot named `class`.
    notes: null
  oscal_name:
    range: TokenType
    description: A textual label that uniquely identifies an attribute or semantic type.
    slot_uri: oscal:name
    aliases:
    - name
  ns:
    range: URIType
    description: An optional namespace qualifying a name. Allows different organizations to associate
      distinct semantics with the same name.
  oscal_type:
    range: string
    description: Indicates the nature or kind of the containing object.
    slot_uri: oscal:type
    aliases:
    - type
  value:
    range: string
    description: The value associated with the containing object.
  scheme:
    range: URIType
    description: Qualifies the kind of identifier using a URI.
  role_id:
    range: TokenType
    description: A reference to a role by its identifier.
  control_id:
    range: TokenType
    description: A reference to a control by its identifier.
  include_all:
    range: IncludeAll
    inlined: true
    description: Include all selectable objects in the containing OSCAL selection context.
  include_controls:
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Control-selection entries to include in the containing OSCAL context. The concrete entry
      class is selected by class-level slot_usage.
  exclude_controls:
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Control-selection entries to exclude in the containing OSCAL context. The concrete entry
      class is selected by class-level slot_usage.
  param_id:
    range: TokenType
    description: The identifier for the parameter being set or referenced.
  statement_id:
    range: TokenType
    description: A reference to a control statement identifier.
  implemented_requirements:
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Control implementation requirement entries in the containing OSCAL context. The concrete
      entry class is selected by class-level slot_usage.
  statements:
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Control statement implementation entries in the containing OSCAL context. The concrete
      entry class is selected by class-level slot_usage.
  method:
    description: Method indicator used by the containing OSCAL context. Allowed values are constrained
      by class-level slot_usage.
  oscal_status:
    description: Status indicator used by the containing OSCAL context. Allowed values are constrained

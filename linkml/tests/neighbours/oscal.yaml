  ImportProfile:
    description: Used to import the OSCAL profile representing the system's control baseline.
    slots:
    - href
    - remarks
    slot_usage:
      href:
        required: true
    in_subset:
    - ssp
  SystemCharacteristics:
    description: Contains the characteristics of the system, such as its name, purpose, and security impact
      level.

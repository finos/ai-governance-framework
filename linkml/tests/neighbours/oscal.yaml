    - uuid
    - metadata
    - import_ssp
    - local_definitions
    - terms_and_conditions
    - assessment_subjects
    - assessment_assets
    - reviewed_controls
    - tasks
    - back_matter
    slot_usage:
      uuid:
        required: true
        description: Assessment Plan Universally Unique Identifier.
      metadata:
        required: true
      import_ssp:
        required: true
      reviewed_controls:
        required: true
    in_subset:
    - assessment_plan

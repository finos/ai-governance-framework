    slots:
    - system_security_plan
    slot_usage:
      system_security_plan:
        required: true
    in_subset:
    - ssp
  SystemSecurityPlan:
    description: A system security plan, such as those described in NIST SP 800-18.
    slots:
    - uuid
    - metadata
    - import_profile
    - system_characteristics
    - system_implementation
    - control_implementation
    - back_matter
    slot_usage:
      uuid:
        required: true
      metadata:
        required: true
      import_profile:
        required: true
      system_characteristics:
        required: true
      system_implementation:
        required: true
      control_implementation:
        required: true
    in_subset:
    - ssp

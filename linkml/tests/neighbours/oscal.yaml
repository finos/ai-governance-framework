types:
  UUIDType:
    uri: xsd:string
    base: str
    description: A type 4 or type 5 UUID per RFC 4122.
    pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[45][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
  URIType:
    uri: xsd:anyURI
    base: str
    description: A universal resource identifier formatted according to RFC3986.
  URIReferenceType:
    uri: xsd:anyURI
    base: str
    description: A URI Reference, either a URI or relative-reference, per RFC3986.
  DateTimeWithTimezoneType:
    uri: xsd:dateTime
    base: str
    description: A string representing a point in time with a required timezone.
    pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$
  MarkupLineType:
    uri: xsd:string
    base: str
    description: A single line of Markdown content (no newlines).
  MarkupMultilineType:
    uri: xsd:string
    base: str
    description: Multiple lines of Markdown content.
  TokenType:
    uri: xsd:string
    base: str
    description: A non-colonized XML NCName token.
  Base64Type:
    typeof: string
    uri: xsd:base64Binary
    base: str
    description: Binary data encoded using Base64 as defined by RFC4648.
  EmailAddressType:
    uri: xsd:string
    base: str
    description: An email address string formatted according to RFC 6531.
    pattern: ^.+@.+$
  NonNegativeIntegerType:
    typeof: integer
    uri: xsd:nonNegativeInteger
    base: int
    minimum_value: 0
    description: A non-negative integer value (>= 0), as used for port range boundaries. OSCAL 1.2.2 restored
      this minimum in its JSON datatype. Each slot with this range repeats it, because the generated Pydantic
      model reads a minimum from the slot and not from the type.
  PositiveIntegerType:
    typeof: integer
    uri: xsd:positiveInteger
    base: int
    minimum_value: 1
    description: A positive integer value (>= 1), as used for task recurrence periods. OSCAL 1.2.2 restored
      this minimum in its JSON datatype. Each slot with this range repeats it, because the generated Pydantic
      model reads a minimum from the slot and not from the type.
subsets:
  oscal_catalog:
    description: 'Classes originating from the oscal-catalog namespace: the root catalog document, groups,
      and controls.'
  oscal_metadata:
    description: 'Classes originating from the oscal-metadata namespace: document metadata, parties, roles,
      locations, and utility types such as Property, Link, and Hash.'
  oscal_back_matter:
    description: 'Classes originating from the oscal-metadata back-matter definition: back-matter container
      and its constituent resource types.'
  oscal_control_common:
    description: 'Classes originating from the oscal-control-common namespace: parts, parameters, constraints,
      guidelines, selections, and control-matching helpers.'
  profile:
    description: Classes that form the root OSCAL Profile document and its profile-specific structural
      containers.
  assessment_plan:
    description: Classes that form the root Assessment Plan document and its direct structural containers
      (local-definitions, terms-and-conditions).
  assessment_common:
    description: 'Classes originating from the oscal-assessment-common namespace: subjects, assets, activities,
      tasks, findings, observations, risks, and related helper types.'
  implementation_common:
    description: 'Classes originating from the oscal-implementation-common namespace: system components,
      protocols, inventory items, users, and set-parameter.'
  ssp:
    description: Classes that form the root OSCAL System Security Plan document and its SSP-specific structural
      containers.
  assessment_results:
    description: Classes that form the root OSCAL Assessment Results document and its assessment-results-specific
      structural containers.
  component_definition:
    description: Classes that form the root OSCAL Component Definition document and component-definition-specific
      structural containers.
  mapping_collection:
    description: Classes that form the root OSCAL Mapping Collection document and mapping-specific structural
      containers.
  poam:
    description: Classes that form the root OSCAL Plan of Action and Milestones document and its POA&M-specific
      structural containers.

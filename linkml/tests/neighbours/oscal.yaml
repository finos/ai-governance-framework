    description: SSP-scoped responsible party for system characteristics.
    slot_usage:
      role_id:
        any_of:
        - range: SystemCharacteristicsResponsibleRoleIdEnum
        - range: TokenType
    in_subset:
    - ssp
  SspImplementedRequirementResponsibleRole:
    is_a: ResponsibleRole
    description: SSP-scoped responsible role used by implemented requirement and statement contexts.
    slot_usage:
      role_id:
        any_of:
        - range: ImplementedRequirementResponsibleRoleIdEnum
        - range: TokenType
    in_subset:
    - ssp
  SspByComponentResponsibleRole:
    is_a: ResponsibleRole
    description: SSP-scoped responsible role used by by-component contexts.
    slot_usage:
      role_id:
        any_of:
        - range: ByComponentResponsibleRoleIdEnum
        - range: TokenType
    in_subset:
    - ssp
  SspSystemComponent:

    - HasPropsAndLinks
    - HasResponsibleRoles
    slots:
    - statement_id
    - uuid
    - oscal_description
    - remarks
    slot_usage:
      statement_id:
        required: true
      uuid:
        required: true
      oscal_description:
        required: true
    in_subset:
    - component_definition
  MappingCollectionDocument:

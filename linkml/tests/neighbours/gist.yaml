slots:
  allows:
    slot_uri: gist:allows
    description: Relates a permission to a particular activity or type of activity it allows.
    title: allows
    examples:
    - value: An easement grants a right to cross or otherwise use someone else's land for a specified
        purpose.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  comes_from_agent:
    is_a: has_participant
    slot_uri: gist:comesFromAgent
    description: Relates something to the originating agent.
    title: comes from agent
    comments:
    - This is not the inverse of gist:goesToAgent, as both properties have the message or shipment as
      the subject.
    - This property is intended to describe the physical or electronic transfer of something, such as
      a package or email, from one agent to another, whereas gist:hasGiver is typically used in more abstract
      contexts such as agreements, obligations, contracts, etc. However, there are contexts in which either
      may be appropriate, such as the giving of a gift.
    examples:
    - value: A package is shipped by a person; a purchase order is emailed to a vendor by an organization.
    range: Any
    multivalued: true
    any_of:
    - range: GistOrganization
    - range: GistPerson
    in_subset:
    - gist_core
  comes_from_place:
    slot_uri: gist:comesFromPlace
    description: Relates something to its place of origin.
    title: comes from place
    examples:
    - value: A letter has a return address indicating its origin; a delivery route originates at a distribution
        center; a trail originates at the trailhead.
    range: Any
    multivalued: true
    any_of:
    - range: Address
    - range: GeoLocation
    in_subset:
    - gist_core
  conforms_to:
    slot_uri: gist:conformsTo
    description: The subject is consistent with or satisfies the requirements, rules, or expectations
      established by the object.
    title: conforms to
    examples:
    - value: Meet an obligation; adhere to a specification or standard; meet terms and conditions of an
        offer; comply with a regulation.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      range_includes: gist:Intention
  contributes_to:
    slot_uri: gist:contributesTo
    description: The subject helps achieve or fulfill the goals or functions of the object.
    title: contributes to
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  goes_to_agent:
    is_a: has_participant
    slot_uri: gist:goesToAgent
    description: Relates something to the agent that receives it.
    title: goes to agent
    comments:
    - This is not the inverse of gist:comesFromAgent, as both properties have the message or shipment
      as the subject.
    - This property is intended to describe the physical or electronic transfer of something, such as
      a package or email, from one agent to another, whereas gist:hasRecipient is typically used in more
      abstract contexts such as agreements, obligations, contracts, etc. However, there are contexts in
      which either may be appropriate, such as the receiving of a gift.
    examples:
    - value: A package is sent to a person; a purchase order email is received by a vendor.
    range: Any
    multivalued: true
    any_of:
    - range: GistOrganization
    - range: GistPerson
    in_subset:
    - gist_core
  goes_to_place:
    slot_uri: gist:goesToPlace
    description: Relates something to its destination place.
    title: goes to place
    examples:
    - value: A letter has an address indicating its destination; a segment of a delivery route terminates
        at a delivery location; a trail terminates at an intersection with another trail.
    range: Any
    multivalued: true
    any_of:
    - range: Address
    - range: GeoLocation
    in_subset:
    - gist_core
  has_accuracy:
    slot_uri: gist:hasAccuracy
    description: Relates a magnitude to another magnitude that describes its accuracy.
    title: has accuracy
    comments:
    - |-
      gist uses the ISO-5725 definition of accuracy, which is a combination of trueness (a measure of systemic error) and precision (a measure of random error). The accuracy of a measurement method describes how close its measurements are to actual values. Similarly, the accuracy of an individual measurement is its likely closeness to the actual value. When we say a temperature measurement is accurate to within a tenth of a degree, it means with a certain probability such as 95%.

      Note that the unit of measure of the accuracy has to be compatible with the unit of measure of the original magnitude (e.g. something measured in meters could have an accuracy in terms of millimeters or any other unit that measures distance).
    examples:
    - value: Temperature accurate to tenth of a degree C; length accurate to the nearest centimeter.
    range: Magnitude
    multivalued: false
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:Magnitude
  has_addend:
    slot_uri: gist:hasAddend
    description: Relates an aspect to another aspect that is an additive component of it.
    title: has addend
    comments:
    - Commonly used with financial metrics.
    examples:
    - value: In the equation 'profit = revenue - expenses', revenue is an addend and expenses is a subtrahend.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_address:
    slot_uri: gist:hasAddress
    description: Relates something to its physical or electronic address.
    title: has address
    examples:
    - value: A brick-and-mortar store has a street address; a person can be contacted electronically via
        an email address.
    range: Address
    multivalued: true
    in_subset:
    - gist_core
  has_aspect:
    slot_uri: gist:hasAspect
    description: Relates a magnitude to its aspect (measurable characteristic).
    title: has aspect
    range: Aspect
    multivalued: false
    in_subset:
    - gist_core
  has_biological_parent:
    slot_uri: gist:hasBiologicalParent
    description: Relates a living thing to its biological parent.
    title: has biological parent
    domain: LivingThing
    range: LivingThing
    multivalued: true
    in_subset:
    - gist_core
  has_broader:
    slot_uri: gist:hasBroader
    description: Relates a thing to another thing with a broader meaning.
    title: has broader
    examples:
    - value: The aspect distance is broader than the aspect height.
    range: Any
    multivalued: true
    transitive: true
    in_subset:
    - gist_core
  has_direct_broader:
    is_a: has_broader
    slot_uri: gist:hasDirectBroader
    description: Relates a thing to another thing with a broader meaning, when there is no intermediate
      between them.
    title: has direct broader
    comments:
    - Unlike gist:hasBroader, this property is not transitive. It is safest to use this property when
      semantic directness is inherent in the relationship. Otherwise, there is a risk of making a hasDirectBroader
      assertion and then later inserting an intermediate part; this will result in making an asserted
      triple false even though there was no change in the world. When in doubt, use the transitive version
      gist:hasBroader.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_divisor:
    slot_uri: gist:hasDivisor
    description: Relates a unit of measure to another unit of measure that is a divisor, or relates an
      aspect to another aspect that is a divisor.
    title: has divisor
    comments:
    - Provides a supplemental method of decomposing a unit of measure or an aspect into component factors.
      Enables dimensional analysis such as miles per hour x hours = miles.
    examples:
    - value: Miles per hour has miles as a multiplier and hour as a divisor; speed has distance as a multiplier
        and duration as a divisor.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_giver:
    is_a: has_participant
    slot_uri: gist:hasGiver
    description: Relates something to the participant that provides it.
    title: has giver
    comments:
    - This property is often used in abstract contexts such as agreements, obligations, contracts, etc.,
      whereas gist:comesFromAgent is intended to describe the physical or electronic transfer of something,
      such as a package or email, from one agent to another. However, there are contexts in which either
      may be appropriate, such as the giving of a gift.
    examples:
    - value: An offer is made by a giver; an obligation has a giver who is obligated to another person;
        a gift is presented by the giver.
    range: Any
    multivalued: true
    disjoint_with:
    - has_recipient
    in_subset:
    - gist_core
  has_goal:
    slot_uri: gist:hasGoal
    description: Relates something to the end towards which it directs effort.
    title: has goal
    examples:
    - value: The sales division of a company has the goal of acquiring new customers and contracts.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_incumbent:
    slot_uri: gist:hasIncumbent
    description: Relates a position to the thing or person that currently holds that position.
    title: has incumbent
    comments:
    - To create a temporal view, define a subclass of gist:TemporalRelation for this property (e.g., Incumbency).
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_magnitude:
    slot_uri: gist:hasMagnitude
    description: Relates a thing to a magnitude.
    title: has magnitude
    examples:
    - value: A car or model of car has magnitudes for length, width, weight, average miles per gallon,
        etc.
    range: Magnitude
    multivalued: true
    in_subset:
    - gist_core
  has_multiplier:
    slot_uri: gist:hasMultiplier
    description: Relates a unit of measure to another unit of measure that is a factor, or relates an
      aspect to another aspect that is a factor.
    title: has multiplier
    comments:
    - Provides a supplemental method of decomposing a unit of measure or aspect into component factors.
      Enables dimensional analysis such as miles per hour x hours = miles.
    examples:
    - value: Miles per hour has miles as a multiplier and hours as a divisor; speed has distance as a
        multiplier and duration as a divisor.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_navigational_parent:
    slot_uri: gist:hasNavigationalParent
    description: Relates a child category to a parent category in an informal (e.g., faceted) hierarchy.
    title: has navigational parent
    examples:
    - value: Refrigerator handles are not refrigerators, but it may be useful to represent their relationship
        hierarchically for a faceted UI filter.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_participant:
    slot_uri: gist:hasParticipant
    description: Relates something (e.g. an agreement) to things that play a role, or take part or are
      otherwise involved in some way.
    title: has participant
    comments:
    - The thing with participants will often be an agreement, event or obligation. Participation does
      not imply agency.
    - This will most often be used as an abstract property. Use subproperties that indicate the nature
      of the participation (e.g. hasBorrower, hasVenue).
    examples:
    - value: An event of transferring money has a participating account that receives the money.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_party:
    is_a: has_participant
    slot_uri: gist:hasParty
    description: Relates an event, agreement, or obligation to a participating person or organization.
    title: has party
    comments:
    - Subproperties may be defined to describe specific parties, such as hasLender and hasBorrower for
      a loan.
    examples:
    - value: Loan agreements have lender and borrower parties.
    range: Any
    multivalued: true
    any_of:
    - range: GistOrganization
    - range: GistPerson
    in_subset:
    - gist_core
  has_physical_location:
    slot_uri: gist:hasPhysicalLocation
    description: Relates something to its physical location.
    title: has physical location
    comments:
    - This property does not distinguish between things whose locations are stable and those whose locations
      change over time; e.g., a fire hydrant vs. a car.
    range: GeoLocation
    multivalued: true
    transitive: true
    in_subset:
    - gist_core
  has_recipient:
    is_a: has_participant
    slot_uri: gist:hasRecipient
    description: Relates something to the participant that receives or is intended to receive it.
    title: has recipient
    comments:
    - This property is used in abstract contexts such as agreements, obligations, contracts, etc., whereas
      gist:goesToAgent is intended to describe the physical or electronic transfer of something, such
      as a package or email, from one agent to another. However, there are contexts in which either may
      be appropriate, such as the giving of a gift.
    examples:
    - value: An offer is made to a recipient; an obligation has a recipient to whom another person is
        obligated; a gift is bestowed upon a recipient.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_subtrahend:
    slot_uri: gist:hasSubtrahend
    description: Relates an aspect to another aspect that is a subtracted component of it.
    title: has subtrahend
    comments:
    - Commonly used with financial metrics.
    examples:
    - value: In the equation 'profit = revenue - expenses', revenue is an addend and expenses is a subtrahend.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  has_unique_broader:
    is_a: has_broader
    slot_uri: gist:hasUniqueBroader
    description: Relates a thing to a unique other thing with a broader meaning.
    title: has unique broader
    range: Any
    multivalued: false
    in_subset:
    - gist_core
  has_unique_navigational_parent:
    is_a: has_navigational_parent
    slot_uri: gist:hasUniqueNavigationalParent
    description: Relates a subject category to a unique parent category in an informal (e.g., faceted)
      hierarchy.
    title: has unique navigational parent
    range: Any
    multivalued: false
    in_subset:
    - gist_core
  has_unit_group:
    slot_uri: gist:hasUnitGroup
    description: Relates an aspect to a unit group. The aspect can be measured using any of the members
      of the unit group.
    title: has unit group
    examples:
    - value: The aspect distance can have a unit group that includes the units meter, inch, foot, etc.
    domain: Aspect
    range: UnitGroup
    multivalued: true
    in_subset:
    - gist_core
  has_unit_of_measure:
    slot_uri: gist:hasUnitOfMeasure
    description: Relates a magnitude to its unit of measure.
    title: has unit of measure
    examples:
    - value: The magnitude 87 inches of height has unit of measure inches.
    domain: Magnitude
    range: UnitOfMeasure
    multivalued: true
    in_subset:
    - gist_core
  is_about:
    slot_uri: gist:isAbout
    description: Subject matter of a document.
    title: is about
    domain: Content
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  is_affected_by:
    slot_uri: gist:isAffectedBy
    description: Relates an affected thing to the source of the effect.
    title: is affected by
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  is_allocated_by:
    slot_uri: gist:isAllocatedBy
    description: Relates something to whomever or whatever assigns or distributes it.
    title: is allocated by
    comments:
    - The allocator may be a person, organization, or automated process.
    examples:
    - value: A U.S. Social Security number is allocated by the U.S. Social Security Administration; the
        media type https://www.iana.org/assignments/media-types/text/csv is allocated by the Internet
        Assigned Numbers Authority (IANA).
    range: Any
    multivalued: true
    any_of:
    - range: IntellectualProperty
    - range: GistOrganization
    - range: GistPerson
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:Category, gist:ID
  is_assignment_of:
    slot_uri: gist:isAssignmentOf
    description: Relates an assignment to the resource it assigns.
    title: is assignment of
    comments:
    - People, organizations, monetary amounts, equipment can all be assigned.
    - While typically this predicate will be used with assignment subjects, there may be other use cases,
      and therefore a domain is not specified.
    examples:
    - value: Assignment of a person to a project.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:Assignment
      range_includes: gist:Equipment, gist:IntellectualProperty, gist:Organization, gist:Person
  is_assignment_to:
    slot_uri: gist:isAssignmentTo
    description: Relates something (typically an assignment) to the thing the resource is assigned to,
      such as a project, position, organization, pay rate, or billing rate.
    title: is assignment to
    comments:
    - While typically this predicate will be used with gist:Assignment subjects, there may be other use
      cases, and therefore a domain is not specified.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:Assignment
  is_based_on:
    slot_uri: gist:isBasedOn
    description: The object is a foundation for, a starting point for, gave rise to, or justifies the
      subject.
    title: is based on
    examples:
    - value: A document is based on a document template; a metric computing the average income of a population
        is based on the metric for individual income.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  is_categorized_by:
    slot_uri: gist:isCategorizedBy
    description: Relates something to a taxonomy term or other less formally defined classification.
    title: is categorized by
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      range_includes: gist:Category
  is_connected_to:
    slot_uri: gist:isConnectedTo
    description: A non-owning, non-causal, non-subordinate (i.e., peer-to-peer) relationship.
    title: is connected to
    range: Any
    multivalued: true
    symmetric: true
    in_subset:
    - gist_core
  is_direct_part_of:
    is_a: is_part_of
    slot_uri: gist:isDirectPartOf
    description: The relationship between a part and a whole where the part has independent existence
      and there are no other parts in between.
    title: is direct part of
    comments:
    - Because the part has independent existence, there is no cascading delete.
    - It is safest to use this property when semantic directness is inherent in the relationship, rather
      than simply expressing a chosen granularity. For example, a spark plug is a direct part of an engine
      block; there cannot be any intermediate parts. Otherwise, there is a risk of making an isDirectPartOf
      assertion and then later inserting an intermediate part; this will result in making an asserted
      triple false even though there was no change in the world. When in doubt, use the transitive version
      gist:isPartOf.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  is_expressed_in:
    slot_uri: gist:isExpressedIn
    description: Relates something to the language it is expressed in.
    title: is expressed in
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:Text
      range_includes: gist:Language
  is_first_member_of:
    is_a: is_member_of
    slot_uri: gist:isFirstMemberOf
    description: Relates the first member of an ordered collection to the collection.
    title: is first member of
    comments:
    - Given the Open World Assumption, the absence of a predecessor does not entail that an ordered member
      is the first member of an ordered collection. This property is used to explicitly indicate the first
      member. Since ordered collections need not be strictly ordered, there can be more than one first
      member.
    domain: OrderedMember
    range: OrderedCollection
    multivalued: false
    in_subset:
    - gist_core
  is_geo_contained_in:
    slot_uri: gist:isGeoContainedIn
    description: Relates one geographic location to another that contains it.
    title: is geographically contained in
    domain: GeoLocation
    range: GeoLocation
    multivalued: true
    transitive: true
    in_subset:
    - gist_core
  is_governed_by:
    slot_uri: gist:isGovernedBy
    description: Relates an entity to another entity that controls, directs, determines or has a guiding
      influence or authority over it.
    title: is governed by
    examples:
    - value: A country geographic region is governed by a country government; the installation and use
        of software is governed by a license.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  is_identified_by:
    slot_uri: gist:isIdentifiedBy
    description: Relates something to a content object that uniquely identifies it.
    title: is identified by
    comments:
    - 'This is like a URI: a thing can have more than one ID, but each ID can refer to only one thing.
      Note that it is possible to have two IDs with the same text that refer to different things.'
    range: ID
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      owl_inverse_functional: true
  is_made_up_of:
    slot_uri: gist:isMadeUpOf
    description: Relates something to a substance that it is made up of.
    title: is made up of
    examples:
    - value: A vase is made of clay; water is made up of hydrogen and oxygen.
    range: PhysicalSubstance
    multivalued: true
    in_subset:
    - gist_core
  is_member_of:
    slot_uri: gist:isMemberOf
    description: Relates a member individual to the thing, such as a collection or organization, that
      it is a member of.
    title: is member of
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      range_includes: gist:Collection, gist:Organization
  is_part_of:
    slot_uri: gist:isPartOf
    description: The relationship between a part and a whole where the part has independent existence.
    title: is part of
    comments:
    - Because the part has independent existence, there is no cascading delete.
    - The transitive version of gist:isDirectPartOf.
    range: Any
    multivalued: true
    transitive: true
    in_subset:
    - gist_core
  is_produced_by:
    slot_uri: gist:isProducedBy
    description: Relates something to the thing that created, composed, or brought it into existence.
    title: is produced by
    examples:
    - value: A deliverable is produces by a task.
    - value: A measurement is produced by a sensor.
    - value: A painting is produced by a person.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  is_recognized_by:
    slot_uri: gist:isRecognizedBy
    description: Relates something to a party that formally acknowledges its existence, validity, or legality.
    title: is recognized by
    examples:
    - value: The existence of a particular company is recognized by the state.
    range: Any
    multivalued: true
    any_of:
    - range: GistOrganization
    - range: GistPerson
    in_subset:
    - gist_core
  is_rendered_on:
    slot_uri: gist:isRenderedOn
    description: Relates content to the media on which it is rendered.
    title: is rendered on
    examples:
    - value: A document is rendered on a computer screen; a piece of music is rendered through speakers.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  is_triggered_by:
    slot_uri: gist:isTriggeredBy
    description: Relates a contingency, such as an event or obligation, to the event that gives rise to
      it.
    title: is triggered by
    comments:
    - For obligations, this property describes what must happen to trigger the contingent obligation.
      Other uses include controls, processes, etc.
    examples:
    - value: Fire insurance is contingent on a particular building burning down; the death benefit payout
        on a life insurance policy is contingent on the death of the insured person.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  is_under_jurisdiction_of:
    slot_uri: gist:isUnderJurisdictionOf
    description: Relates a law, contract, etc., to the system of law or government which has the power,
      right, or authority to interpret and apply it.
    title: is under jurisdiction of
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      range_includes: gist:GovernmentOrganization
  links:
    slot_uri: gist:links
    description: Relates a network link to a network node that it connects to another node. Used when
      the connection is undirected or the direction is not known.
    title: links
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:NetworkLink
      range_includes: gist:NetworkNode
  links_from:
    is_a: links
    slot_uri: gist:linksFrom
    description: Relates a network link to its origin network node. Unlike the superproperty, this represents
      a directed connection.
    title: links from
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:NetworkLink
      range_includes: gist:NetworkNode
  links_to:
    is_a: links
    slot_uri: gist:linksTo
    description: Relates a network link to its destination network node. Unlike the superproperty, this
      represents a directed connection.
    title: links to
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:NetworkLink
      range_includes: gist:NetworkNode
  occurs_in:
    slot_uri: gist:occursIn
    description: Relates something, such as an event, to the geographic location where it did, does, or
      will happen.
    title: occurs in
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  offers_to_provide:
    slot_uri: gist:offersToProvide
    description: Relates an offer to the thing being made available for exchange.
    title: offers to provide
    comments:
    - This will most often be a good or service, but could be an amount of money, e.g., for currency exchange.
    examples:
    - value: An offer to provide a specific product in exchange for an amount of money or to pay a certain
        price for a home that is for sale.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:Offer
  offers_to_receive:
    slot_uri: gist:offersToReceive
    description: Relates an offer to the thing expected in return for the offered item.
    title: offers to receive
    comments:
    - This will most often be an amount of money, but could be anything of value, as in swaps.
    examples:
    - value: A vendor makes an offer to receive a particular amount of money in exchange for the offered
        product; an offer to receive a home in exchange for an amount of money.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:Offer
  owns:
    slot_uri: gist:owns
    description: Relates a party to something that it possesses and controls.
    title: owns
    comments:
    - The ultimate form of ownership is the right to destroy.
    - There is a long list of potential range classes.
    notes:
    - 'OWL domain: (gist:Organization | gist:Person)'
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  precedes:
    slot_uri: gist:precedes
    description: A generic ordering relation indicating that the subject comes before the object.
    title: precedes
    comments:
    - The less-than symbol is often used to represent this relation.
    - This is the transitive version of gist:precedesDirectly.
    - Typically this predicate would be used asymmetrically and irreflexively, but the ontology does not
      formalize this.
    range: Any
    multivalued: true
    transitive: true
    in_subset:
    - gist_core
  precedes_directly:
    is_a: precedes
    slot_uri: gist:precedesDirectly
    description: A generic ordering relation indicating that the subject comes immediately before the
      object.
    title: precedes directly
    comments:
    - If two items in an ordered collection share the same position, they both directly precede the following
      element.
    - It is safest to use this property only when the directness has a semantic correspondence with the
      world. Only break a direct link by inserting an intermediate item when that change corresponds to
      a change in the world.
    - Typically this predicate would be used asymmetrically and irreflexively, but the ontology does not
      formalize this.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  prevents:
    slot_uri: gist:prevents
    description: Relates an intention to behavior that it prohibits.
    title: prevents
    examples:
    - value: A city ordinance prohibits jaywalking.
    notes:
    - See guidance on removing this term in the next major release at https://github.com/semanticarts/gist/issues/1380#issuecomment-3617257248
    domain: Intention
    range: Behavior
    multivalued: true
    deprecated: gist marks this term owl:deprecated.
    deprecated_element_has_exact_replacement: prohibits
    in_subset:
    - gist_core
    exact_mappings:
    - gist:prohibits
    annotations:
      owl:deprecated: true
  prohibits:
    slot_uri: gist:prohibits
    description: Relates an intention to a behavior that it forbids or seeks to prevent.
    title: prohibits
    comments:
    - A behavior can be prohibited without being prevented. For example, a speed limit may prohibit driving
      faster than a stated speed but does not always succeed in preventing drivers from exceeding that
      speed.
    examples:
    - value: A city ordinance prohibits jaywalking.
    - value: Private property laws prohibit someone from entering private land marked with a 'No Trespassing'
        sign.
    domain: Intention
    range: Behavior
    multivalued: true
    in_subset:
    - gist_core
  provides_order_for:
    slot_uri: gist:providesOrderFor
    description: Links a member of an ordered collection to the real-world item it represents in that
      collection.
    title: provides order for
    domain: OrderedMember
    range: Any
    multivalued: false
    in_subset:
    - gist_core
  refers_to:
    slot_uri: gist:refersTo
    description: Relates something to another resource that it points to, indicates, or references.
    title: refers to
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  requires:
    slot_uri: gist:requires
    description: The subject needs the object or makes it necessary, mandatory, or compulsory.
    title: requires
    comments:
    - |-
      This predicate is defined generally enough to encompass a few different meanings of the English word 'requires':

        1. To need something or to make something necessary.
        2. To order or demand something, or to order someone to do something, especially because of a rule or law.
        3. To make it officially necessary for someone to do something.

      Implementations requiring a more specific meaning should define subproperties.
    examples:
    - value: Humans require air; solar power requires sunshine.
    range: Any
    multivalued: true
    in_subset:
    - gist_core
  actual_end_date:
    is_a: actual_end_date_time
    slot_uri: gist:actualEndDate
    description: The actual date that something ended, with precision of one day.
    title: actual end date
    comments:
    - Used for things where the precision of a date is sufficient, such as most projects, tasks, and the
      like. Recommended usage is to zero out the hours through microseconds to avoid spurious precision.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  actual_end_date_time:
    is_a: end_date_time
    slot_uri: gist:actualEndDateTime
    description: The actual date and time that something ended, with no implied precision.
    title: actual end date time
    comments:
    - This is an abstraction over the various precisions of actual end time, and is not expected to be
      asserted directly. Values of predicates with different precisions can be compared since they are
      all formally xsd:datetimes.
    range: datetime
    in_subset:
    - gist_core
  actual_end_microsecond:
    is_a: actual_end_date_time
    slot_uri: gist:actualEndMicrosecond
    description: The actual time that something ended, expressed as a system time used for timestamps.
    title: actual end microsecond
    comments:
    - A system time will be as precise as the system can supply, typically at least milliseconds, sometimes
      microseconds. The convention for timestamps, such as recording a transaction, is to specify just
      the end point; the start time is rarely needed.
    examples:
    - value: '''2021-06-01T08:03:27.12324-6:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  actual_end_minute:
    is_a: actual_end_date_time
    slot_uri: gist:actualEndMinute
    description: The actual date and time that something ended, with precision of one minute.
    title: actual end minute
    comments:
    - Used for things like meetings and time card entries, where the hour and minute are important. Recommended
      usage is to zero out the seconds and microseconds to avoid spurious precision.
    examples:
    - value: '''2021-06-01T08:32:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  actual_end_year:
    is_a: actual_end_date_time
    slot_uri: gist:actualEndYear
    description: The actual date that something ended, with precision of one year.
    title: actual end year
    comments:
    - Used for things where the precision of a year is sufficient. Recommended usage is to zero out the
      hours through microseconds to avoid spurious precision. Note that it is not valid to zero out months
      and days, so arbitrary values must be included.
    examples:
    - value: '''2021-01-01T00:00:00-06:00''^^xsd:dateTime'
    - value: The tenure of the previous chairman of the board ended in 2021.
    range: datetime
    in_subset:
    - gist_core
  actual_start_date:
    is_a: actual_start_date_time
    slot_uri: gist:actualStartDate
    description: The actual date that something started, with precision of one day.
    title: actual start date
    comments:
    - Used for things where the precision of a date is sufficient, such as most projects, tasks, and the
      like. Recommended usage is to zero out the hours through microseconds to avoid spurious precision.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  actual_start_date_time:
    is_a: start_date_time
    slot_uri: gist:actualStartDateTime
    description: The actual date and time that something started, with no implied precision.
    title: actual start date time
    comments:
    - This is an abstraction over the various precisions of actual start time, and is not expected to
      be asserted directly. Values of predicates with different precisions can be compared since they
      are all formally xsd:datetimes.
    range: datetime
    in_subset:
    - gist_core
  actual_start_microsecond:
    is_a: actual_start_date_time
    slot_uri: gist:actualStartMicrosecond
    description: The actual time that something started, expressed as a system time used for timestamps.
    title: actual start microsecond
    comments:
    - A system time will be as precise as the system can supply, typically at least milliseconds, sometimes
      microseconds. The convention for timestamps, such as recording a transaction, is to specify just
      the end point; the start time is rarely needed. This property is defined for the cases when you
      do need to capture the runtime of a system process, and is then used in conjunction with gist:actualEndMicrosecond.
    examples:
    - value: '''2021-06-01T08:03:27.12324-6:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  actual_start_minute:
    is_a: actual_start_date_time
    slot_uri: gist:actualStartMinute
    description: The actual date and time that something started, with precision of one minute.
    title: actual start minute
    comments:
    - Used for things like meetings and time card entries, where the hour and minute are important. Recommended
      usage is to zero out the seconds and microseconds to avoid spurious precision.
    examples:
    - value: '''2021-06-01T08:32:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  actual_start_year:
    is_a: actual_start_date_time
    slot_uri: gist:actualStartYear
    description: The actual date that something started, with precision of one year.
    title: actual start year
    comments:
    - Used for things where the precision of a year is sufficient. Recommended usage is to zero out the
      hours through microseconds to avoid spurious precision. Note that it is not valid to zero out months
      and days, so arbitrary values must be included.
    examples:
    - value: '''2021-01-01T00:00:00-06:00''^^xsd:dateTime'
    - value: The tenure of the current chairman of the board began in 2021.
    range: datetime
    in_subset:
    - gist_core
  at_date_time:
    slot_uri: gist:atDateTime
    description: The date and time at which something did or will occur, with variants for precision,
      start and end, and actual vs. planned.
    title: at date time
    comments:
    - |-
      This is the top level property for asserting time, and is not expected to be asserted directly.

      The subproperties allow the ontologist to do three things:
      1) Distinguish start and end times.
      2) Indicate whether a time is planned or actual. This is useful for everything from project management to calendar appointments and the like. It is also useful for date effectivities; i.e., something valid up to a planned date).
      3) Distinguish varying levels of precision; sort of a simple version of the Allen functions.

      All datetimes are of the same format: '2021-06-01T08:03:27.12324-6:00'^^xsd:dateTime. This is compatible with and a subset of ISO 8601.

      Time zone offset, such as -6:00 (of which there are a few dozen) is recognized in the date itself, as shown. The actual time zone standard (of which there are 131) may optionally be attached to the event or other object itself.

      There will be many historical dates that do not have a time zone offset (e.g., Lincoln's birthday, as well as about 75% of all legacy systems), and in that case the offset can be omitted.

      The conventions for precision that are repeated in each property name are as follows:
        - *DateTime is an abstraction over the various precisions of its subproperties.
        - *Date refers to a calendar date (e.g., birthdays and invoice dates) and is assumed to have precision of one day. Time zone offset is allowed.
        - *Minute refers to clock time; e.g., a meeting will start at 9:15 with a timezone offset. Precision is assumed to have precision of one minute.
        - *Microsecond refers to system time, and it will be as precise as the system can supply; typically at least milliseconds, sometime microseconds.
    range: datetime
    in_subset:
    - gist_core
  birth_date:
    is_a: start_date_time
    slot_uri: gist:birthDate
    description: The date some living thing was or will be born, with precision of one day.
    title: birth date
    comments:
    - This is a subproperty of gist:startDateTime rather than gist:actualStartDate because some living
      things have yet to be born. This property refers to a calendar date and is assumed to precision
      of one day (time zone offset is allowed). It is recommended to zero out the hours through microseconds
      to avoid spurious precision. Implementations requiring a birthdate to the minute can define a subproperty.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  contained_text:
    slot_uri: gist:containedText
    description: Relates an entity containing textual information to the string constituting that textual
      information.
    title: contained text
    comments:
    - If there are multiple strings associated with an entity, it is an implementation decision whether
      to combine them into a single contained text value or to use multiple contained text assertions.
    examples:
    - value: The string associated with a tag or with text content.
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:Content, gist:ContentExpression, gist:Tag, gist:Text
  conversion_factor:
    slot_uri: gist:conversionFactor
    description: A value that relates a unit of measure to units of the International System of Units.
    title: conversion factor
    comments:
    - |-
      To convert a numeric value from one unit of measure to another, multiply by the conversion factor of the first unit and then divide by the conversion factor of the second unit.

      For example, to convert 27 feet to yards:

        the conversion factor of foot is 0.3048
        the conversion factor of yard is 0.9144

        so

        27 feet = (27 x 0.3048) / 0.9144 = 9 yards
    examples:
    - value: In the equation 1 inch = 0.0254 meters, the value 0.0254 is the conversion factor of inch.
    notes:
    - 'OWL range: (xsd:decimal | xsd:double)'
    domain: UnitOfMeasure
    multivalued: false
    any_of:
    - range: decimal
    - range: double
    in_subset:
    - gist_core
    see_also:
    - gist:conversionOffset
  conversion_offset:
    slot_uri: gist:conversionOffset
    description: |-
      A value used along with a conversion factor to relate a unit to its corresponding unit in the International System of Units. In the equation below, the conversion offset is 459.669607 and the conversion factor is 5/9.

      y degrees Fahrenheit = (y + 459.669607) x 5/9 degrees Kelvin

      To convert from Fahrenheit to Kelvin, first add the offset and then multiply by the conversion factor.

      To convert from Kelvin to Fahrenheit, reverse the steps: first divide by the conversion factor and then subtract the offset.
    title: conversion offset
    domain: UnitOfMeasure
    range: decimal
    multivalued: false
    in_subset:
    - gist_core
  death_date:
    is_a: actual_end_date
    slot_uri: gist:deathDate
    description: The date some living thing died.
    title: death date
    comments:
    - Refers to a calendar date and is assumed to have precision of one day (time zone offset is allowed).
      Recommended usage is to zero out the hours through microseconds to avoid spurious precision. Implementations
      requiring a death date to the minute can define a subproperty.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  gist_description:
    slot_uri: gist:description
    description: A statement about someone or something's attributes or characteristics.
    title: description
    comments:
    - This property is used to describe instance data which is not part of the ontology. A definition
      and a description have different semantics. Use skos:definition for a statement of the meaning of
      a thing and gist:description to describe a thing's attributes, characteristics, or features.
    examples:
    - value: '''The Empire State Building is a 102-story Art Deco skyscraper in midtown Manhattan in New
        York City. It was designed by Shreve, Lamb & Harmon and built from 1930 to 1931.'''
    - value: A person does not have a definition, but might be described as being six feet tall with brown
        hair and blue eyes; an ontology class or taxonomy term has a definition.
    in_subset:
    - gist_core
    aliases:
    - description
  encrypted_text:
    is_a: contained_text
    slot_uri: gist:encryptedText
    description: Encoded text produced from readable data by an algorithm so that it can only be understood
      or restored with a decryption key.
    title: encrypted text
    range: string
    in_subset:
    - gist_core
  end_date_time:
    is_a: at_date_time
    slot_uri: gist:endDateTime
    description: The date and time that something ends.
    title: end date time
    comments:
    - 'This property is neutral along two dimensions: precision (e.g., day, second, millisecond) and actual
      vs. planned. As such, it will generally not be asserted directly except in special cases (e.g.,
      for time intervals).'
    - Values of predicates with different precisions can be compared since they are all formally xsd:datetimes.
    range: datetime
    in_subset:
    - gist_core
  exponent_of_ampere:
    slot_uri: gist:exponentOfAmpere
    description: The exponent of ampere in a product of powers of base units.
    title: exponent of ampere
    examples:
    - value: |-
        In the equation '1 milliampere = 0.001 x ampere'

        the conversionFactor for milliampere is 0.001
        the exponent of ampere is 1
        all other exponents are zero

        Every member of a unit group containing milliampere must be a multiple of ampere.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_bit:
    slot_uri: gist:exponentOfBit
    description: The exponent of bit in a product of powers of base units.
    title: exponent of bit
    examples:
    - value: |-
        In the equation '1 megabit per second = 1000000 x bit per second'

        the conversion factor for megabit per second is 1000000
        the exponent of bit is 1
        the exponent of second is -1
        all other exponents are zero

        Every member of a unit group containing megabit per second must be a multiple of bit per second.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_candela:
    slot_uri: gist:exponentOfCandela
    description: The exponent of candela in a product of powers of base units.
    title: exponent of candela
    examples:
    - value: |-
        In the equation '1 candlepower = 1 x candela'

        the conversion factor for candlepower is 1
        the exponent of candela is 1
        all other exponents are zero

        Every member of a unit group containing candlepower must be a multiple of candela.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_kelvin:
    slot_uri: gist:exponentOfKelvin
    description: The exponent of Kelvin in a product of powers of base units.
    title: exponent of Kelvin
    examples:
    - value: |-
        In the equation 'y degrees Fahrenheit = (y + 459.6669607) x 5/9 degrees Kelvin'

        the conversion offset for degree Fahrenheit is 459.6669607
        the conversion factor for degree Fahrenheit is 5/9
        the exponent of Kelvin is 1
        all other exponents are zero

        Every member of a unit group containing degree Fahrenheit will have a similar equation, with different offset or conversion factor (or both).
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_kilogram:
    slot_uri: gist:exponentOfKilogram
    description: The exponent of kilogram in a product of powers of base units.
    title: exponent of kilogram
    examples:
    - value: |-
        In the equation '1 millimole per gram = 1 x mole per kilogram'

        the conversion factor for millimole per gram is 1
        the exponent of mole is 1
        the exponent of kilogram is -1
        all other exponents are zero

        Every member of a unit group containing millimole per gram must be a multiple of mole per kilogram.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_meter:
    slot_uri: gist:exponentOfMeter
    description: The exponent of meter in a product of powers of base units.
    title: exponent of meter
    examples:
    - value: |-
        In the equation '1 microgram per milliliter = 0.001 x kilogram per meterCubed'

        the conversion factor for microgram per milliliter is 0.001
        the exponent of kilogram is 1
        the exponent of meter is -3
        all other exponents are zero

        Every member of a unit group containing microgram per milliliter must be a multiple of kilogram per meterCubed.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_mole:
    slot_uri: gist:exponentOfMole
    description: The exponent of mole in a product of powers of base units.
    title: exponent of mole
    examples:
    - value: |-
        In the equation '1 katal = 1 x mole per second'

        the conversion factor for katal is 1
        the exponent of mole is 1
        the exponent of second is -1
        all other exponents are zero

        Every member of a unit group containing katal must be a multiple of mole per second.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_number:
    slot_uri: gist:exponentOfNumber
    description: The exponent of number in a product of powers of base units.
    title: exponent of number
    comments:
    - Use when the unit of measure involves a count or other number.
    examples:
    - value: |-
        In the equation '1 beat per minute = 0.016667 x number per second'

        the conversion factor for beat per minute is 0.016667
        the exponent of number is 1
        the exponent of second is -1
        all other exponents are zero

        Every member of a unit group containing beat per minute must be a multiple of number per second.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_other:
    slot_uri: gist:exponentOfOther
    description: Indicates whether a unit of measure can be expressed in terms of the standard exponents
      (as shown in the examples).
    title: exponent of other
    comments:
    - |-
      Set the value to 0 if the units of measure in the unit group can be expressed using the standard set of exponents (as in the examples).

      Otherwise set the value to 1, which typically means the units of measure in the group use a logarithmic scale.
    examples:
    - value: Decibel, pH, and octave are units of measure that are logarithmic. Their unit groups have
        exponent of other = 1.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_radian:
    slot_uri: gist:exponentOfRadian
    description: The exponent of radian in a product of powers of base units.
    title: exponent of radian
    examples:
    - value: |-
        In the equation '1 revolution = 6.283 x radian'

        the conversion factor for revolution is 6.283
        the exponent of radian is 1
        all other exponents are zero

        Every member of a unit group containing revolution must be a multiple of radian.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_second:
    slot_uri: gist:exponentOfSecond
    description: The exponent of second in a product of powers of base units.
    title: exponent of second
    examples:
    - value: |-
        In the equation '1 watt-hour = 3600 x kilogram meterSquared per secondSquared'

        the conversion factor for watt-hour is 3600
        the exponent of kilogram is 1
        the exponent of meter is 2
        the exponent of second is -2
        all other exponents are zero

        Every member of a unit group containing watt-hour must be a multiple of kilogram meterSquared per secondSquared.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_steradian:
    slot_uri: gist:exponentOfSteradian
    description: The exponent of steradian in a product of powers of base units.
    title: exponent of steradian
    comments:
    - Steradian is a measure of solid angle.
    examples:
    - value: |-
        In the equation '1 watt per square meter steradian = 1 x kilogram per secondCubed steradian'

        the conversion factor for watt per square meter steradian is 1
        the exponent of kilogram is 1
        the exponent of second is -3
        the exponent of steradian is -1
        all other exponents are zero

        Every member of a unit group containing watt per square meter steradian must a multiple of kilogram per secondCubed steradian.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  exponent_of_us_dollar:
    slot_uri: gist:exponentOfUSDollar
    description: The exponent of US Dollar in a product of powers of base units.
    title: exponent of US dollar
    comments:
    - The factors for converting from one currency to another change constantly.
    examples:
    - value: |-
        In the equation '1 million dollars per week = 1.65344 x dollar per second'

        the conversion factor for million dollars per week is 1.65344
        the exponent of US Dollar is 1
        the exponent of second is -1
        all other exponents are zero

        Every member of a unit group containing million dollars per week must be a multiple of dollar per second.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    range: decimal
    in_subset:
    - gist_core
  id_text:
    slot_uri: gist:idText
    description: A text string that identifies an individual.
    title: id text
    comments:
    - A common use case would be for preexisting internal company identifiers.
    - Often, there will be just one identifying text string. More would be appropriate if the individual
      had different identifiers, such as employee number and social security number. A good way to model
      that would be to have functional subproperties of idText, such as departmentNumber.
    - This property is an alternative to using the property gist:isIdentifiedBy in conjunction with instances
      of the class gist:ID.
    examples:
    - value: The id text for a car is '4Y1SL65848Z411439'; the id text for the HR department of some company
        is H31415.
    range: string
    in_subset:
    - gist_core
  is_recorded_at:
    is_a: at_date_time
    slot_uri: gist:isRecordedAt
    description: The date that something was posted (which is not necessarily the date it occurred). It
      must be after the date of occurrence, but could be before or after the planned date.
    title: is recorded at
    comments:
    - Precision may vary according to context.
    examples:
    - value: The date and time a customer payment or stock purchase was posted.
    in_subset:
    - gist_core
  latitude:
    slot_uri: gist:latitude
    description: Degrees above or below the equator.
    title: latitude
    domain: GeoPoint
    range: double
    in_subset:
    - gist_core
  longitude:
    slot_uri: gist:longitude
    description: Degrees from the prime meridian.
    title: longitude
    domain: GeoPoint
    range: double
    in_subset:
    - gist_core
  gist_name:
    slot_uri: gist:name
    description: Relates an individual to (one of) its name(s).
    title: name
    in_subset:
    - gist_core
    aliases:
    - name
  numeric_value:
    slot_uri: gist:numericValue
    description: The actual value of a magnitude.
    title: numeric value
    notes:
    - 'OWL range: (xsd:byte | xsd:decimal | xsd:double | xsd:float | xsd:int | xsd:integer | xsd:long
      | xsd:negativeInteger | xsd:nonNegativeInteger | xsd:nonPositiveInteger | xsd:positiveInteger |
      xsd:short | xsd:unsignedByte | xsd:unsignedInt | xsd:unsignedLong | xsd:unsignedShort | owl:rational
      | owl:real)'
    any_of:
    - range: xsd_byte
    - range: decimal
    - range: double
    - range: float
    - range: xsd_int
    - range: integer
    - range: xsd_long
    - range: xsd_negative_integer
    - range: xsd_non_negative_integer
    - range: xsd_non_positive_integer
    - range: xsd_positive_integer
    - range: xsd_short
    - range: xsd_unsigned_byte
    - range: xsd_unsigned_int
    - range: xsd_unsigned_long
    - range: xsd_unsigned_short
    - range: owl_rational
    - range: owl_real
    in_subset:
    - gist_core
  planned_end_date:
    is_a: planned_end_date_time
    slot_uri: gist:plannedEndDate
    description: The date that something is or was planned to end, with precision of one day.
    title: planned end date
    comments:
    - Used for anything with a planned end date, such as when a lease will expire, when an offer is no
      longer available, etc. Typically a planned date is in the future when first captured, but when tasks
      run late, we leave the plan where it was and compare it to the actual. Recommended usage is to zero
      out the hours through microseconds to avoid spurious precision.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  planned_end_date_time:
    is_a: end_date_time
    slot_uri: gist:plannedEndDateTime
    description: The date that something is or was planned to end, with no implied precision.
    title: planned end date time
    comments:
    - This is an abstraction over the various precisions of planned end time, and is not expected to be
      asserted directly. Values of predicates with different precisions can be compared since they are
      all formally xsd:datetimes.
    - This property, unlike gist:actualEndDateTime, does not have a subproperty for microsecond precision,
      because planned times typically are not expressed at that level of granularity. Typically a planned
      date is in the future when first captured, but when tasks run late, we leave the plan where it was
      and compare it to the actual.
    range: datetime
    in_subset:
    - gist_core
  planned_end_minute:
    is_a: planned_end_date_time
    slot_uri: gist:plannedEndMinute
    description: The date and time that something is or was planned to end, with precision of one minute.
    title: planned end minute
    comments:
    - Used for things like meetings and time card entries, where the hour and minute are important. Recommended
      usage is to zero out the seconds and microseconds to avoid spurious precision.Typically a planned
      date is in the future when first captured, but when tasks run late, we leave the plan where it was
      and compare it to the actual.
    examples:
    - value: '''2021-06-01T08:32:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  planned_end_year:
    is_a: planned_end_date_time
    slot_uri: gist:plannedEndYear
    description: The date that something is or was planned to end, with precision of one year.
    title: planned end year
    comments:
    - Used for anything with a planned end date where precision of one year is sufficient. Typically a
      planned date is in the future when first captured, but when tasks run late, we leave the plan where
      it was and compare it to the actual. Recommended usage is to zero out the hours through microseconds
      to avoid spurious precision. Note that it is not valid to zero out months and days, so arbitrary
      values must be included.
    examples:
    - value: '''2021-01-01T00:00:00-06:00''^^xsd:dateTime'
    - value: The automobile manufacturer announced that it will stop producing gas-powered vehicles in
        2035.
    range: datetime
    in_subset:
    - gist_core
  planned_start_date:
    is_a: planned_start_date_time
    slot_uri: gist:plannedStartDate
    description: The date that something is or was planned to start, with precision of one day.
    title: planned start date
    comments:
    - Used for anything with a planned start date, such as when a lease will start, when a configuration
      becomes available, etc. Typically a planned date is in the future when first captured, but when
      tasks run late, we leave the plan where it was and compare it to the actual. Recommended usage is
      to zero out the hours through microseconds to avoid spurious precision.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  planned_start_date_time:
    is_a: start_date_time
    slot_uri: gist:plannedStartDateTime
    description: The date and time that something is or was planned to start, with no implied precision.
    title: planned start date time
    comments:
    - This is an abstraction over the various precisions of planned start time, and is not expected to
      be asserted directly. Values of predicates with different precisions can be compared since they
      are all formally xsd:datetimes.
    - This property, unlike gist:actualStartDateTime, does not have a subproperty for microsecond precision,
      because planned times typically are not expressed at that level of granularity. Typically a planned
      date is in the future when first captured, but when tasks run late, we leave the plan where it was
      and compare it to the actual.
    range: datetime
    in_subset:
    - gist_core
  planned_start_minute:
    is_a: planned_start_date_time
    slot_uri: gist:plannedStartMinute
    description: The date and time that something is or was planned to start, with precision of one minute.
    title: planned start minute
    comments:
    - Used for things like meetings and time card entries, where the hour and minute are important. Typically
      a planned date is in the future when first captured, but when tasks run late, we leave the plan
      where it was and compare it to the actual. Recommended usage is to zero out the seconds and microseconds
      to avoid spurious precision.
    examples:
    - value: '''2021-06-01T08:32:00-06:00''^^xsd:dateTime'
    range: datetime
    in_subset:
    - gist_core
  planned_start_year:
    is_a: planned_start_date_time
    slot_uri: gist:plannedStartYear
    description: The date that something is or was planned to start, with precision of one year.
    title: planned start year
    comments:
    - Used for anything with a planned start date where precision of one year is sufficient. Typically
      a planned date is in the future when first captured, but when tasks run late, we leave the plan
      where it was and compare it to the actual. Recommended usage is to zero out the hours through microseconds
      to avoid spurious precision. Note that it is not valid to zero out months and days, so arbitrary
      values must be included.
    examples:
    - value: '''2021-01-01T00:00:00-06:00''^^xsd:dateTime'
    - value: The automobile manufacturer announced that its full line-up will include only electric cars
        starting in 2035.
    range: datetime
    in_subset:
    - gist_core
  sequence:
    slot_uri: gist:sequence
    description: A number that specifies the position of an element within a series.
    title: sequence
    range: integer
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:OrderedMember
  start_date_time:
    is_a: at_date_time
    slot_uri: gist:startDateTime
    description: The date and time that something starts.
    title: start date time
    comments:
    - 'This property is neutral along two dimensions: precision (e.g., day, second, millisecond) and actual
      vs. planned. As such, it will generally not be asserted directly except in special cases (e.g.,
      for time intervals).'
    - Values of predicates with different precisions can be compared since they are all formally xsd:datetimes.
    range: datetime
    in_subset:
    - gist_core
  symbol:
    slot_uri: gist:symbol
    description: A symbol for something using only ASCII characters.
    title: symbol
    examples:
    - value: The ASCII symbol for square meter is m^2.
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:UnitOfMeasure
  unique_text:
    is_a: contained_text
    slot_uri: gist:uniqueText
    description: The unique string value of some content object, to be used when there is no possibility
      of having more than one value.
    title: unique text
    comments:
    - 'Note that the uniqueness only goes in one direction: a product catalog number might also be an
      employee ID.'
    examples:
    - value: The unique string for a vehicle identification number.
    multivalued: false
    in_subset:
    - gist_core
    annotations:
      domain_includes: gist:ID, gist:MediaType, gist:Tag, gist:Text
  domain_includes:
    slot_uri: gist:domainIncludes
    implements:
    - owl:AnnotationProperty
    description: Relates a property to a class that the property is expected to be used on.
    title: domain includes
    comments:
    - There may be multiple domainIncludes assertions on a single property.
    - This property is used to guide the ontology user; like all annotation properties, it does not play
      a role in inference.
    examples:
    - value: The domain of the property gist:containedText includes gist:Tag and gist:Text.
    in_subset:
    - gist_core
    broad_mappings:
    - skos:scopeNote
  is_superseded_by:
    slot_uri: gist:isSupersededBy
    implements:
    - owl:AnnotationProperty
    description: Relates a deprecated term to a term that replaces it, which is either an exact (in the
      case of simple renaming) or approximate (in the case of renaming and some semantic change) semantic
      match.
    title: is superseded by
    examples:
    - value: gist:connectedTo was superseded by gist:isConnectedTo (renaming with no semantic change).
    in_subset:
    - gist_core
  gist_license:
    slot_uri: gist:license
    implements:
    - owl:AnnotationProperty
    description: Relates something to its conditions of use.
    title: license
    comments:
    - Could refer to a license object by URI or name or could consist of the license text itself.
    examples:
    - value: The gist ontology is licensed under the CC By 4.0 license.
    in_subset:
    - gist_core
    aliases:
    - license
  range_includes:
    slot_uri: gist:rangeIncludes
    implements:
    - owl:AnnotationProperty
    description: Relates a property to a class that is an expected type of its values.
    title: range includes
    comments:
    - There may be multiple rangeIncludes assertions on a single property.
    - This property is used to guide the ontology user; like all annotation properties, it does not play
      a role in inference.
    examples:
    - value: The range of the property gist:isCategorizedBy includes gist:Category.
    in_subset:
    - gist_core
    broad_mappings:
    - skos:scopeNote
classes:
  Account:
    is_a: Agreement
    class_uri: gist:Account
    description: An agreement having a balance.
    title: Account
    examples:
    - value: A bank account, a credit card account, an accounts receivable account.
    notes:
    - 'OWL equivalentClass: (gist:Agreement & ∃hasMagnitude.∃hasAspect=_Aspect_financial_balance)'
    close_mappings:
    - common_domain_model:Account
    in_subset:
    - gist_core
  Address:
    is_a: Content
    class_uri: gist:Address
    description: A reference to a place (real or virtual) that can be located by some routing algorithm
      and where messages or things can be sent or received.
    title: Address
    examples:
    - value: A PO Box, a URL to a PDF file.
    narrow_mappings:
    - common_domain_model:Address
    in_subset:
    - gist_core
  AddressUsageType:
    is_a: Category
    class_uri: gist:AddressUsageType
    description: A category indicating the context or manner in which an address may be used.
    title: Address Usage Type
    comments:
    - If you are using temporal relations involving addresses, this category should be used to qualify
      the temporal relation rather than the address itself, since the same address may have different
      uses in different contexts, by different people and organizations, or at different times.
    examples:
    - value: Billing, business, personal, postal, residence.
    in_subset:
    - gist_core
  Agreement:
    is_a: Intention
    class_uri: gist:Agreement
    description: A mutually understood arrangement in which two or more parties make commitments to one
      another.
    title: Agreement
    comments:
    - While an agreement has two or more parties, and contains commitments which bind those parties, it
      will not always be necessary to instantiate each individual commitment.
    examples:
    - value: A gym membership is an agreement in which the member commits to paying the gym a certain
        price and the gym commits to allowing access to their facilities.
    notes:
    - 'OWL equivalentClass: (gist:Intention & ∃hasParty.(gist:Organization | gist:Person) & ≥2^isDirectPartOf.gist:Commitment)'
    close_mappings:
    - common_domain_model:Agreement
    narrow_mappings:
    - common_domain_model:MasterAgreement
    - dpv:DataProcessingAgreement
    in_subset:
    - gist_core
  Aspect:
    mixins:
    - GistThing
    class_uri: gist:Aspect
    description: A measurable characteristic.
    title: Aspect
    comments:
    - Depending on implementation, every aspect should be related to a unit group either directly or through
      a broader aspect. For example, angle of incidence could be related to the broader concept of angle,
      which in turn is related to a unit group, or it could be related directly to the unit group without
      the hierarchical relationship.
    - 'Rule of thumb: use the least specific aspect that serves the intended purpose, increasing specificity
      only when required (e.g., to distinguish between two magnitudes attached to the same object).'
    examples:
    - value: Length, weight, cost, cycle time, defect rate, wheelbase, billing rate.
    disjoint_with:
    - Event
    in_subset:
    - gist_core
    slots:
    - has_unit_group
    is_a: Concept
  Assignment:
    is_a: TemporalRelation
    class_uri: gist:Assignment
    description: A temporal relationship between an assignee, the thing assigned, and the resource that
      made the assignment.
    title: Assignment
    comments:
    - Based on the Open World Assumption, the assigner may not be asserted or known.
    - For some assignments, such as the assignment of a person to a task, it may seem equally correct
      in ordinary speech to say it is an assignment of a task to a person. Since gist:isAssignmentTo and
      gist:isAssignmentOf have no formal domains or ranges, the choice of which predicate to use for which
      is left as an implementation decision. Consistency is a key consideration.
    examples:
    - value: An employee is assigned to a task by a supervisor. A person is assigned to a position.
    notes:
    - 'OWL equivalentClass: (gist:TemporalRelation & ∃hasGiver.owl:Thing & ∃isAssignmentOf.owl:Thing &
      ∃isAssignmentTo.owl:Thing)'
    close_mappings:
    - common_domain_model:NaturalPersonRole
    related_mappings:
    - common_domain_model:RelatedParty
    - common_domain_model:Counterparty
    in_subset:
    - gist_core
  Behavior:
    is_a: Category
    class_uri: gist:Behavior
    description: A category indicating the nature of an activity.
    title: Behavior
    examples:
    - value: Drilling and cutting are two different kinds of manufacturing event.
    in_subset:
    - gist_core
  Building:
    is_a: Landmark
    class_uri: gist:Building
    description: A relatively permanent man-made structure situated on a plot of land, having a roof and
      walls, commonly used for dwelling, entertaining, or working.
    title: Building
    comments:
    - 'User discretion can be applied to edge cases: e.g., is a traditional yurt ''relatively permanently
      situated'' although it is portable and has a tent-like construction?'
    examples:
    - value: A house, school, store, factory, chicken coop.
    - value: 'Negative examples: houseboats (not built on land), caves (not man-made), food trucks and
        RVs (not permanently situated).'
    deprecated: gist marks this term owl:deprecated.
    in_subset:
    - gist_core
    annotations:
      owl:deprecated: true
  BundledCatalogItem:
    is_a: CatalogItem
    class_uri: gist:BundledCatalogItem
    description: Any combination of descriptions of things offered together.
    title: Bundled Catalog Item
    examples:
    - value: A kit containing several parts offered together; a product plus a warranty.
    notes:
    - 'OWL equivalentClass: (gist:CatalogItem & ∃^isDirectPartOf.gist:CatalogItem)'
    in_subset:
    - gist_core
  CatalogItem:
    is_a: Specification
    class_uri: gist:CatalogItem
    description: A description of a product or service to be delivered, given in a sufficient level of
      detail that a receiver could determine whether delivery constituted discharge of the obligation
      to deliver.
    title: Catalog Item
    comments:
    - In short, an unambiguous characterization of what it is that a potential buyer is paying for.
    in_subset:
    - gist_core
  Category:
    mixins:
    - GistThing
    class_uri: gist:Category
    description: A concept or label used to categorize other instances without specifying any formal semantics.
    title: Category
    comments:
    - Often a type can be modeled either as an owl:Class or as a gist:Category. Use the latter if you
      don't care much about the formal structure of the different types, or if there is a whole hierarchy
      of types that are going to be managed by a group separate from the ontology developers. The formal
      structure may be defined elsewhere and linked to, if necessary.
    examples:
    - value: Tags used in folksonomies; formal definitions from other systems.
    notes:
    - 'OWL subClassOf restrictions: ∃isAllocatedBy.(gist:IntellectualProperty | gist:Organization | gist:Person)'
    disjoint_with:
    - Event
    in_subset:
    - gist_core
    is_a: Concept
  Collection:
    is_a: Composite
    class_uri: gist:Collection
    description: A grouping of things.
    title: Collection
    comments:
    - Individuals are placed in the collection using the gist:isMemberOf property. Collections typically
      are created because the members are functionally connected in some way. This definition allows a
      collection to have zero members.
    examples:
    - value: A jury is a group of people; a financial ledger is a collection of transaction entries; a
        route is an (ordered) collection of segments.
    in_subset:
    - gist_core
  Commitment:
    is_a: Intention
    class_uri: gist:Commitment
    description: A promise made by a single party to one or more parties to do or not do something or
      act in a particular way.
    title: Commitment
    comments:
    - A commitment is unilateral in that it is binding on only one party. This contrasts with gist:Agreement,
      which consists of commitments that bind two or more parties.
    - A single commitment may be made to multiple parties at once; it is a single commitment rather than
      multiple commitments if the same action would fulfill the obligation to all the parties simultaneously.
      For example, a performer makes a single commitment to hold a performance to all ticket purchasers;
      by holding the performance, the commitment to all parties is fulfilled in a single action.
    - The manner in which a commitment is binding may vary. In a business context, we are typically interested
      in commitments that are legally binding.
    examples:
    - value: Upon selling a treasury bill, the U.S. government makes a commitment to pay the purchaser
        a stated amount of money at a stated time.
    - value: When signing an NDA, the signatory commits to keeping specified information confidential.
    notes:
    - 'OWL equivalentClass: (gist:Intention & (gist:Requirement | gist:Restriction) & ∃hasGiver.(gist:Organization
      | gist:Person) & ∃isCategorizedBy.gist:DegreeOfCommitment)'
    in_subset:
    - gist_core
  Component:
    mixins:
    - GistThing
    class_uri: gist:Component
    description: Something that, while having an independent existence, is inherently part of or designed
      to be part of a larger entity, such as a system or network.
    title: Component
    comments:
    - A component may be designed or intended as part of a whole without actually being so; e.g., a car
      steering wheel that is not installed in any car.
    - Many things are in a trivial sense a part of a larger thing, but are not considered components because
      they are not inherently part of that larger thing. For example, while a book may be part of a library
      (a collection of books), it is not inherently so, and thus is not a component. A playing card, on
      the other hand, could be considered a component in (member of) a deck of cards. This may be use
      case-dependent; e.g., car parts might be modeled as components in an automobile manufacturing context
      but not in a retail auto parts store.
    - Physical substances, such as ingredients in a cake batter, do not meet the independent existence
      criterion, so are not components.
    - This class is not disjoint with gist:Composite, because a component may itself break down into smaller
      components.
    - This is an abstract class that is not directly instantiated. Users will define subclasses that are
      meaningful to their domain of interest.
    disjoint_with:
    - PhysicalSubstance
    in_subset:
    - gist_core
    is_a: Concept
  Composite:
    mixins:
    - GistThing
    class_uri: gist:Composite
    description: Something which is made up of various parts or elements that are independently identifiable.
    title: Composite
    comments:
    - Some composites, like systems, networks, and ordered collections, have internal organization, while
      others, such as unordered collections, typically do not.
    - This class is not disjoint with gist:Component, because a composite can itself be a component of
      a larger composite.
    - This is an abstract class that will not be directly instantiated.
    examples:
    - value: A library (collection of books); a network of pipes and valves; a computer network of routers
        and computers.
    in_subset:
    - gist_core
    is_a: Concept
  ContemporaryEvent:
    is_a: Event
    class_uri: gist:ContemporaryEvent
    description: An event that has started but has not yet ended.
    title: Contemporary Event
    comments:
    - When the event actually ends, it will cease being contemporary.
    notes:
    - 'OWL equivalentClass: (gist:Event & =1actualStartDateTime & ≤0actualEndDateTime)'
    in_subset:
    - gist_core
  Content:
    mixins:
    - GistThing
    class_uri: gist:Content
    description: Information available in some medium.
    title: Content
    comments:
    - Categories are not content until they are written down.
    - This class includes both abstract content and its expression, but it must have at least one expression
      in order to be content. For example, the idea a writer has for a book is not content until it is
      expressed in some form, but a single content object may have multiple expressions - e.g., the particular
      print and audio editions.
    examples:
    - value: The literary work 'The Adventures of Huckleberry Finn' by Mark Twain, independent of any
        particular edition.
    disjoint_with:
    - GeoPoint
    - GeoRegion
    - GistOrganization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
    in_subset:
    - gist_core
    slots:
    - is_about
    is_a: Concept
  ContentExpression:
    is_a: Content
    class_uri: gist:ContentExpression
    description: Content reduced to text, audio, etc.
    title: Content Expression
    comments:
    - If it contains text (written or spoken), it will be expressed in a language.
    - While the content expression is less abstract than a 'Work,' it is more abstract than the specific
      physical items that render the expression. For example, any physical or electronic book with ISBN-13
      978-1953649805 is associated with the same content expression.
    examples:
    - value: A specific print or audio edition of 'The Adventures of Huckleberry Finn,' such as the one
        identified by ISBN-13 978-1953649805.
    notes:
    - 'OWL subClassOf restrictions: ∃isCategorizedBy.gist:GeneralMediaType'
    in_subset:
    - gist_core
  ContingentEvent:
    is_a: Event
    class_uri: gist:ContingentEvent
    description: An event with a probability of happening in the future, and usually dependent upon some
      other event or condition.
    title: Contingent Event
    examples:
    - value: A fire insurance payout is contingent on a particular building burning down; selling 20 shares
        of stock in a given company is contingent on the price dropping below $200/share; the death benefit
        payout on a life insurance policy is contingent on the death of the insured person.
    notes:
    - 'OWL equivalentClass: (gist:Event & ∃hasMagnitude.∃hasAspect=_Aspect_probability & ∃isTriggeredBy.gist:Event)'
    in_subset:
    - gist_core
  ContingentObligation:
    is_a: Commitment
    class_uri: gist:ContingentObligation
    description: An obligation that is not yet firm. There is some contingent event whose occurrence will
      cause the obligation to become firm.
    title: Contingent Obligation
    comments:
    - A contingent obligation might have a getter counterparty (as in the case of insurance); but it might
      not (as in the case of an offer).
    notes:
    - 'OWL equivalentClass: (gist:Commitment & ∃hasGiver.(gist:Organization | gist:Person) & ∃isTriggeredBy.gist:Event)'
    broad_mappings:
    - dpv:Obligation
    in_subset:
    - gist_core
  Contract:
    is_a: Agreement
    class_uri: gist:Contract
    description: An agreement which can be enforced by law.
    title: Contract
    notes:
    - 'OWL equivalentClass: (gist:Agreement & ∃isUnderJurisdictionOf.gist:GovernmentOrganization)'
    related_mappings:
    - dpv:Contract
    in_subset:
    - gist_core
  ContractTerm:
    is_a: Specification
    class_uri: gist:ContractTerm
    description: A specification of some aspect of a contract.
    title: Contract Term
    narrow_mappings:
    - common_domain_model:CollateralProvisions
    in_subset:
    - gist_core
  ControlledVocabulary:
    is_a: Collection
    class_uri: gist:ControlledVocabulary
    description: A collection of terms approved and managed by some organization or person.
    title: Controlled Vocabulary
    comments:
    - A controlled vocabulary is similar to a skos:ConceptScheme, but it could also be used for things
      that are not concepts, such as organizations, US presidents, geographic regions, etc. Hierarchical
      relationships between instances of the controlled vocabulary are possible.
    notes:
    - 'OWL equivalentClass: (gist:Collection & ∃isGovernedBy.(gist:Organization | gist:Person) & ∃^isMemberOf.gist:Category)'
    in_subset:
    - gist_core
  CountryGeoRegion:
    is_a: GovernedGeoRegion
    class_uri: gist:CountryGeoRegion
    description: A geographic region governed by exactly one country government.
    title: Country Geographic Region
    notes:
    - 'OWL subClassOf restrictions: =1isGovernedBy'
    - 'OWL equivalentClass: (gist:GovernedGeoRegion & ∃isGovernedBy.gist:CountryGovernment)'
    in_subset:
    - gist_core
  CountryGovernment:
    is_a: GovernmentOrganization
    class_uri: gist:CountryGovernment
    description: A government organization which asserts both sovereignty (i.e., it is not governed by
      some other government organization) and governance over an entity generally recognized as a country.
    title: Country Government
    comments:
    - While a country government may enter into treaties with other country governments, there are no
      governing relationships among the treaty members.
    notes:
    - 'OWL subClassOf restrictions: =1^isGovernedBy.gist:CountryGeoRegion; ≤0isGovernedBy.gist:GovernmentOrganization'
    - 'OWL equivalentClass: (gist:GovernmentOrganization & ∃^isGovernedBy.gist:CountryGeoRegion)'
    disjoint_with:
    - SubCountryGovernment
    in_subset:
    - gist_core
  DegreeOfCommitment:
    is_a: Category
    class_uri: gist:DegreeOfCommitment
    description: The difficulty of reversing a commitment.
    title: Degree Of Commitment
    examples:
    - value: A car rental typically has a lower degree of commitment than an airfare reservation.
    in_subset:
    - gist_core
  Determination:
    is_a: Event
    class_uri: gist:Determination
    description: An event whose purpose is to establish a specific result, value, or outcome, usually
      by research, measuring, evaluating, or calculating.
    title: Determination
    examples:
    - value: Measuring the sulfur content of crude oil; evaluating a loan application for approval; estimating
        the price of gas for the next three months; determining whether and by how much an interest rate
        should change; classifying a purchase into a budget category.
    close_mappings:
    - iso22989:Decision
    in_subset:
    - gist_core
  Discipline:
    is_a: Category
    class_uri: gist:Discipline
    description: An area of study or practice.
    title: Discipline
    examples:
    - value: Finance, accounting, project management, acoustics, ballistics.
    in_subset:
    - gist_core
  ElectronicAddress:
    is_a: Address
    class_uri: gist:ElectronicAddress
    description: An address referring to a locatable virtual place that does not physically exist but
      is made by software or electronics to appear to do so.
    title: Electronic Address
    related_mappings:
    - common_domain_model:ContactInformation
    aliases:
    - Virtual Address
    examples:
    - value: A file system path, website URL, IP address, email address, mobile or landline telephone
        number.
    disjoint_with:
    - PhysicalAddress
    in_subset:
    - gist_core
  ElectronicAddressType:
    is_a: Category
    class_uri: gist:ElectronicAddressType
    description: A category indicating a kind of electronic address. Such a category is usually based
      on the technology that enables routing to the address referent.
    title: Electronic Address Type
    examples:
    - value: A URL, file system path, email address, mobile telephone number.
    in_subset:
    - gist_core
  Equipment:
    is_a: PhysicalIdentifiableItem
    class_uri: gist:Equipment
    description: Human-made, tangible property other than land or buildings used to perform a task or
      activity.
    title: Equipment
    examples:
    - value: A machine, a router, a car, a baseball bat.
    notes:
    - 'OWL equivalentClass: (gist:PhysicalIdentifiableItem & ∃isCategorizedBy.gist:EquipmentType)'
    in_subset:
    - gist_core
  EquipmentType:
    is_a: Category
    class_uri: gist:EquipmentType
    description: A category of equipment.
    title: Equipment Type
    in_subset:
    - gist_core
  Event:
    mixins:
    - GistThing
    class_uri: gist:Event
    description: Something that occurs over a period of time, often characterized as an activity being
      carried out by some person, organization, or software application or brought about by natural forces.
    title: Event
    comments:
    - An event does not necessarily have either planned or actual start or end datetimes. For example,
      a conference can be in the planning phase without any dates selected, but is nevertheless an (unscheduled)
      event. The subclasses of gist:Event state particular restrictions on planned and actual start and
      end dates.
    - An event occurs during a time interval, which is distinct from the event.
    examples:
    - value: A transaction, conference, baseball game, earthquake.
    disjoint_with:
    - Language
    - Magnitude
    - TimeInterval
    - UnitOfMeasure
    narrow_mappings:
    - common_domain_model:BusinessEvent
    - iso22989:AILifecycleProcess
    - iso22989:DataProcess
    - iso22989:Action
    in_subset:
    - gist_core
    is_a: Concept
  EventSpecification:
    is_a: Specification
    class_uri: gist:EventSpecification
    description: A characterization of an event that might happen.
    title: Event Specification
    comments:
    - This concept is useful for risk assessment and insurance policies.
    examples:
    - value: An insurance company defines the characteristics of a weather event that must be satisfied
        for it to qualify as a hail storm covered in its homeowner's policy; a bank defines the point
        at which a borrower defaults on a loan.
    in_subset:
    - gist_core
  FormattedContent:
    is_a: ContentExpression
    class_uri: gist:FormattedContent
    description: Content encoded in a specific format, but existing as data independent of any particular
      physical medium.
    title: Formatted Content
    comments:
    - Each instance of formatted content is a distinct formatting of some Content. Thus, a PDF-formatted
      version and an HTML-formatted version of the same content are separate instances of formatted content.
    examples:
    - value: A document in PDF format; an image in JPEG format.
    notes:
    - 'OWL equivalentClass: (gist:ContentExpression & ∃isExpressedIn.gist:MediaType)'
    in_subset:
    - gist_core
  Function:
    is_a: Intention
    class_uri: gist:Function
    description: The activity that a human-made item is intended to perform.
    title: Function
    examples:
    - value: Transmit electricity, provide ballast, control ambient temperature.
    in_subset:
    - gist_core
  GeneralMediaType:
    is_a: Category
    class_uri: gist:GeneralMediaType
    description: The real-world media type for content.
    title: General Media Type
    examples:
    - value: Audio, still image, video, textual, physical (e.g., a statue), performance (e.g., a play),
        oil or pastel for a painting.
    in_subset:
    - gist_core
  GeoLocation:
    mixins:
    - GistThing
    class_uri: gist:GeoLocation
    description: A physical location, with the earth as a frame of reference.
    title: Geographic Location
    comments:
    - A geographic location may be a point, region, or volume.
    narrow_mappings:
    - dpv:StorageLocation
    in_subset:
    - gist_core
    slots:
    - is_geo_contained_in
    is_a: Concept
  GeoPoint:
    is_a: GeoLocation
    class_uri: gist:GeoPoint
    description: An individual point on or above the Earth's surface, identified by latitude, longitude
      and altitude. Altitude is the distance measured from sea level. If altitude is missing, the point
      is assumed to be at the Earth's surface. These points are described using decimal latitude/longitude.
    title: Geographic Point
    notes:
    - 'OWL equivalentClass: (∃hasMagnitude.∃hasAspect=_Aspect_altitude & ∃latitude.xsd:double & ∃longitude.xsd:double)'
    disjoint_with:
    - IntellectualProperty
    - Intention
    - Language
    - Magnitude
    - GistOrganization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
    in_subset:
    - gist_core
    slots:
    - latitude
    - longitude
  GeoRegion:
    is_a: GeoLocation
    class_uri: gist:GeoRegion
    description: A bounded region (or set of regions) on the surface of the Earth.
    title: Geographic Region
    comments:
    - A geographic region could be non-contiguous; e.g., the region governed by the US federal government
      is the contiguous area of the lower 48 states plus Alaska, Hawaii, and overseas territories. Child
      classes in lower ontologies can make this distinction.
    examples:
    - value: The bounded shape that defines the region occupied by Crater Lake; the bounded area known
        as the contiguous USA.
    notes:
    - 'OWL subClassOf restrictions: (gist:GeoLocation & ∃hasMagnitude.∃hasAspect=_Aspect_area)'
    disjoint_with:
    - IntellectualProperty
    - Intention
    - Language
    - Magnitude
    - GistOrganization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - Template
    - UnitOfMeasure
    in_subset:
    - gist_core
  GeoRoute:
    is_a: OrderedCollection
    class_uri: gist:GeoRoute
    description: An ordered set of geographic points that defines a path from a starting point to an ending
      point.
    title: Geographic Route
    comments:
    - A geographic route could describe a bus route by identifying the points where the bus stops. A geographic
      route could describe the boundary of a polygonal geographic region (it does not have to be a traveled
      route).
    notes:
    - 'OWL equivalentClass: (gist:OrderedCollection & ∃^isMemberOf.gist:GeoPoint)'
    in_subset:
    - gist_core
  GeoVolume:
    is_a: GeoLocation
    class_uri: gist:GeoVolume
    description: A three-dimensional space on or near the surface of the Earth.
    title: Geographic Volume
    examples:
    - value: An oil reservoir, the body of a lake, or an airspace.
    notes:
    - 'OWL equivalentClass: (gist:GeoLocation & ∃hasMagnitude.∃hasAspect=_Aspect_volume & ∃^isGeoContainedIn.gist:GeoPoint)'
    in_subset:
    - gist_core
  GovernedGeoRegion:
    is_a: GeoRegion
    class_uri: gist:GovernedGeoRegion
    description: A geographic region governed by at least one government organization.
    title: Governed Geographic Region
    comments:
    - Geographic regions do not need not be physically contiguous in order to constitute a governed geographic
      region; e.g., Alaska and Hawaii are part of the region governed by the United States.
    notes:
    - 'OWL equivalentClass: (gist:GeoRegion & ∃isGovernedBy.gist:GovernmentOrganization)'
    in_subset:
    - gist_core
  GovernmentOrganization:
    is_a: GistOrganization
    class_uri: gist:GovernmentOrganization
    description: An independent organization exercising political and/or regulatory authority over a political
      unit, people, geographical region, etc., as well as performing certain functions for this unit or
      body.
    title: Government Organization
    comments:
    - Includes administrative, regulatory, and enforcement organizations created or sanctioned by country
      or sub-country governments.
    examples:
    - value: 'Negative example: A corporation, which is owned and therefore not independent.'
    - value: The State of Washington Office of Financial Management; the Food and Drug Administration;
        the Scottish Parliament.
    disjoint_with:
    - IntergovernmentalOrganization
    broad_mappings:
    - common_domain_model:LegalEntity
    in_subset:
    - gist_core
  HistoricalEvent:
    is_a: Event
    class_uri: gist:HistoricalEvent
    description: An event which occurred in time, with an actual end earlier than the present moment.
    title: Historical Event
    notes:
    - 'OWL subClassOf restrictions: ∃actualStartDateTime.xsd:dateTime'
    - 'OWL equivalentClass: (gist:Event & ∃actualEndDateTime.xsd:dateTime)'
    in_subset:
    - gist_core
  ID:
    is_a: Content
    class_uri: gist:ID
    description: Content that is used to uniquely identify something or someone.
    title: ID
    comments:
    - Used in conjunction with gist:isIdentifiedBy.
    examples:
    - value: SSN for a person; serial number for a product; employee ID for a person.
    notes:
    - 'OWL equivalentClass: (gist:Content & ∃isAllocatedBy.(gist:IntellectualProperty | gist:Organization
      | gist:Person) & ∃uniqueText.xsd:string)'
    close_mappings:
    - common_domain_model:Identifier
    - common_domain_model:AssignedIdentifier
    narrow_mappings:
    - common_domain_model:PartyIdentifier
    - common_domain_model:PersonIdentifier
    - common_domain_model:EntityIdentifier
    in_subset:
    - gist_core
  IntellectualProperty:
    mixins:
    - GistThing
    class_uri: gist:IntellectualProperty
    description: An intangible work, invention, or concept, independent of its being expressed in text,
      audio, video, image, or live performance. IP can also be tacit knowledge, know-how, or skill.
    title: Intellectual Property
    comments:
    - For literature this could be called the 'Work,' except that 'work' is a highly overloaded term (expenditure
      of energy, resource consumption, art). Often the first expression precedes our recognition of the
      IP, but subsequent expressions are known to be derivatives of the IP, even if they are expression-to-expression
      translations (or copies).
    - This concept includes works that are out of copyright or were never formally registered; the defining
      feature is not that it is legally protected but that it is an intangible creation of the human mind.
    examples:
    - value: The Old Man and The Sea; the Page Rank algorithm; the brand Coca Cola.
    disjoint_with:
    - Magnitude
    - GistOrganization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
    related_mappings:
    - dpv:IntellectualPropertyData
    in_subset:
    - gist_core
    is_a: Concept
  Intention:
    mixins:
    - GistThing
    class_uri: gist:Intention
    description: A goal, desire, or aspiration.
    title: Intention
    comments:
    - The 'teleological' aspect of a system that indicates things are done with a purpose.
    disjoint_with:
    - Magnitude
    - GistOrganization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
    in_subset:
    - gist_core
    slots:
    - prevents
    - prohibits
    is_a: Concept
  IntergovernmentalOrganization:
    is_a: GistOrganization
    class_uri: gist:IntergovernmentalOrganization
    description: An organization whose members are government organizations. This can comprise regional,
      municipal, state/province, or national level entities.
    title: Intergovernmental Organization
    examples:
    - value: The United Nations, the European Union, the Metropolitan Transit Authority.
    notes:
    - 'OWL equivalentClass: (gist:Organization & ≥2^isMemberOf.gist:GovernmentOrganization)'
    in_subset:
    - gist_core
  KnowledgeConcept:
    is_a: IntellectualProperty
    class_uri: gist:KnowledgeConcept
    description: An abstract concept that arises from the distillation of experience. It is similar to
      a category but, rather than being a simple tag, it has rich structure.
    title: Knowledge Concept
    comments:
    - |-
      Some knowledge is about specific instances that already exist in the knowledge graph. We may have knowledge that Judge Jones is more lenient on repeat offenders in the morning; we may know that the earliest killing frost in Fort Collins is the last week of September.

      These fit the broader definition of knowledge, the distillation of experience. But they do not require any new instances. Judge Jones and Fort Collins already exist and have a place in our knowledge graph.

      But some knowledge requires that we synthesize new instances in order to have a place to consolidate the knowledge. A disease isn't a tangible thing, like a person or a building. A disease is a prediction that a person's health will decline in a predictable way (without treatment and with treatment). The number of diseases continues to grow as we collectively learn more and more granular distinctions. Lung cancer used to be a single disease, but now we have dozens of fine-grained distinctions; e.g., non-lymphoma small cell fusiform is different from alveolar adenocarcinoma because we now know the prognosis and treatment are different.

      This superclass is meant as a place for subclasses that will have the instances that represent the foci of the knowledge we have acquired. Note the distinction between a particular portion of, say, gold, which instantiates gist:PhysicalSubstance, and the concept of gold, which instantiates gist:KnowledgeConcept.

      In some ontologies what we are calling knowledge concepts are defined as classes; e.g., non-lymphoma small cell fusiform and alveolar adenocarcinoma would be two classes rather than two instances. But using a class makes it harder to connect the concept to other instances in a knowledge graph, and furthermore such classes would lack instances.
    examples:
    - value: Most domains will define a few subclasses, such as gene, protein, chemical, disease, subject
        matter, industry, method.
    related_mappings:
    - iso22989:KnowledgeGraph
    in_subset:
    - gist_core
  Landmark:
    is_a: PhysicalIdentifiableItem
    class_uri: gist:Landmark
    description: Something permanently attached to the Earth.
    title: Landmark
    notes:
    - 'OWL subClassOf restrictions: ∃hasPhysicalLocation.(gist:GeoRegion | gist:GeoVolume)'
    - See guidance on removing the term in the next major release at https://github.com/semanticarts/gist/issues/947#issuecomment-1679566885.
    deprecated: gist marks this term owl:deprecated.
    in_subset:
    - gist_core
    annotations:
      owl:deprecated: true
  Language:
    mixins:
    - GistThing
    class_uri: gist:Language
    description: A recognized, organized set of symbols and grammar.
    title: Language
    examples:
    - value: Natural languages such as English and Spanish; computer languages such as OWL, Python, and
        XML.
    disjoint_with:
    - Magnitude
    - GistOrganization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
    deprecated: gist marks this term owl:deprecated.
    in_subset:
    - gist_core
    annotations:
      owl:deprecated: true
    is_a: Concept
  LivingThing:
    is_a: PhysicalIdentifiableItem
    class_uri: gist:LivingThing
    description: Something that is currently, or at some point in time was, alive.
    title: Living Thing
    comments:
    - Not all life forms have exactly two parents, so the restriction only specifies a minimum of one.
    examples:
    - value: A cat, a mushroom, a tree.
    - value: 'Negative examples: fictional life forms such as unicorns or Mickey Mouse.'
    notes:
    - 'OWL equivalentClass: (gist:PhysicalIdentifiableItem & ∃hasBiologicalParent.gist:LivingThing & =1birthDate)'
    in_subset:
    - gist_core
    slots:
    - has_biological_parent
  Magnitude:
    mixins:
    - GistThing
    class_uri: gist:Magnitude
    description: The amount of a measurable characteristic (aspect).
    title: Magnitude
    comments:
    - An accuracy can be assigned to a magnitude using the property has accuracy.
    examples:
    - value: A model of car could have a wheelbase of 113.2 inches. In this example, the aspect is wheelbase,
        the unit of measure is inch, and the numeric value is 113.2.
    notes:
    - 'OWL equivalentClass: (∃hasAspect.gist:Aspect & ∃hasUnitOfMeasure.gist:UnitOfMeasure & ∃numericValue.rdfs:Literal)'
    disjoint_with:
    - GistOrganization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
    close_mappings:
    - common_domain_model:Quantity
    - common_domain_model:Measure
    narrow_mappings:
    - common_domain_model:Money
    related_mappings:
    - common_domain_model:Price
    in_subset:
    - gist_core
    see_also:
    - gist:hasAccuracy
    slots:
    - has_unit_of_measure
    is_a: Concept
  MediaType:
    is_a: Category
    class_uri: gist:MediaType
    description: A digitized type that computer applications can recognize.
    title: Media Type
    comments:
    - The unique text for an IANA media type is the concatenation of the 'Type name', a slash '/', and
      the 'Subtype name' as provided on the page displayed when you resolve the URI of the media type.
    examples:
    - value: application/sparql-results+xml
    notes:
    - 'OWL subClassOf restrictions: ∃uniqueText.xsd:string'
    in_subset:
    - gist_core
    see_also:
    - https://www.iana.org/assignments/media-types/media-types.xhtml
  Medium:
    is_a: Category
    class_uri: gist:Medium
    description: A physical material on which a work can be rendered, represented, or implemented.
    title: Medium
    examples:
    - value: Paper, clay, a computer monitor.
    in_subset:
    - gist_core
  Message:
    is_a: ContentExpression
    class_uri: gist:Message
    description: A specific instance of content sent from a sender to at least one other recipient.
    title: Message
    examples:
    - value: An email, voice, or web service message; a phone call.
    notes:
    - 'OWL equivalentClass: (gist:ContentExpression & ∃comesFromAgent.(gist:Organization | gist:Person)
      & ∃goesToAgent.(gist:Organization | gist:Person))'
    in_subset:
    - gist_core
  Network:
    is_a: Composite
    class_uri: gist:Network
    description: A composite consisting of nodes connected by links.
    title: Network
    examples:
    - value: A physical network could include connected computers or routers, whereas a social network
        would consist of related person or organization members (or their proxies, such as accounts).
    notes:
    - 'OWL equivalentClass: (gist:Composite & ∃^isMemberOf.(gist:NetworkLink | gist:NetworkNode))'
    in_subset:
    - gist_core
  NetworkLink:
    is_a: Component
    class_uri: gist:NetworkLink
    description: An abstract representation of the connection between two or more nodes in a network.
    title: Network Link
    comments:
    - Each network link is connected to a network node via the property gist:links or one of its subproperties.
    examples:
    - value: A network link may be physical, such as pipes, wired or wireless networks, but may also be
        a link in a non-physical network, such as organizational structures or social networks.
    notes:
    - 'OWL subClassOf restrictions: ∀links.gist:NetworkNode; =2links'
    - 'OWL equivalentClass: (gist:Component & ∃isMemberOf.gist:Network & ∃links.gist:NetworkNode)'
    in_subset:
    - gist_core
  NetworkNode:
    is_a: Component
    class_uri: gist:NetworkNode
    description: A node in a network.
    title: Network Node
    examples:
    - value: A person's account is a node in a social network; a valve is a node in a network of pipes.
    notes:
    - 'OWL subClassOf restrictions: ∃isMemberOf.gist:Network'
    in_subset:
    - gist_core
  Offer:
    is_a: ContingentObligation
    class_uri: gist:Offer
    description: A contingent commitment to buy, sell, swap or provide one or more described or identified
      goods or services in exchange for another (or others).
    title: Offer
    comments:
    - Dates on an offer represent the time period the offer is valid for, as in '25% off through October
      25, 2025.'
    examples:
    - value: An offer to sell a book for a given price; an offer to purchase real estate for a particular
        price; an offer to swap a sea kayak for a mountain bike; currency exchange. A donation may be
        modeled as an offer to receive money typically in exchange for $0.00, but sometimes for items
        of value such as coffee mugs or T-shirts.
    notes:
    - 'OWL equivalentClass: (gist:ContingentObligation & ∃hasGiver.(gist:Organization | gist:Person) &
      ∃offersToProvide.owl:Thing & ∃offersToReceive.owl:Thing & ∃plannedEndDateTime.xsd:dateTime & ∃plannedStartDateTime.xsd:dateTime)'
    in_subset:
    - gist_core
  OrderedCollection:
    is_a: Collection
    class_uri: gist:OrderedCollection
    description: A collection whose members are ordered in some way.
    title: Ordered Collection
    comments:
    - Includes partially ordered collections as well as collections in which members occupy the same position
      in a 'tie.' All members of an ordered collection are ordered members.
    notes:
    - 'OWL equivalentClass: (gist:Collection & (∃^isFirstMemberOf.gist:OrderedMember | =0^isMemberOf)
      & ∀^isMemberOf.gist:OrderedMember)'
    in_subset:
    - gist_core
  OrderedMember:
    is_a: Component
    class_uri: gist:OrderedMember
    description: A member of an ordered collection serving as a proxy for a real world item, which can
      appear in different orders in different collections. The ordered member appears in exactly one ordered
      collection.
    title: Ordered Member
    comments:
    - An ordered member points to the real world item via the providesOrderFor property. Ordering information
      is represented either as a number in a sequence, or by preceding or following another ordered member.
    examples:
    - value: A person may rank 12th in the Boston Marathon but 29th in the New York City Marathon.
    notes:
    - 'OWL equivalentClass: (gist:Component & (∃precedesDirectly.gist:OrderedMember | ∃^precedesDirectly.gist:OrderedMember
      | ∃sequence.xsd:integer) & ∃providesOrderFor.owl:Thing & ∀isMemberOf.gist:OrderedCollection & =1isMemberOf)'
    in_subset:
    - gist_core
    slots:
    - is_first_member_of
    - provides_order_for
  GistOrganization:
    mixins:
    - GistThing
    class_uri: gist:Organization
    description: A structured entity formed to achieve specific goals, typically involving members with
      defined roles.
    title: Organization
    comments:
    - Not all organizations have members, e.g. shell companies.
    - While typically the members of organizations are people, in some cases they are other organizations;
      e.g., the members of the United Nations are country governments.
    examples:
    - value: Legal entities like companies; non-legal entities like clubs, committees, or departments.
    disjoint_with:
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - SchemaMetaData
    - UnitOfMeasure
    close_mappings:
    - common_domain_model:LegalEntity
    broad_mappings:
    - common_domain_model:Party
    - dpv:LegalEntity
    narrow_mappings:
    - common_domain_model:BusinessUnit
    - dpv:OrganisationalUnit
    - iso22989:Organization
    related_mappings:
    - dpv:ThirdParty
    in_subset:
    - gist_core
    slots:
    - owns
    aliases:
    - Organization
    is_a: Concept
  Permission:
    is_a: Intention
    class_uri: gist:Permission
    description: A description of things one is permitted to do.
    title: Permission
    examples:
    - value: Permission could be broad, such as free speech, but more often is very specific, such as
        the right to enter a particular property.
    notes:
    - 'OWL equivalentClass: (gist:Intention & ∃allows.gist:Behavior)'
    exact_mappings:
    - dpv:Permission
    in_subset:
    - gist_core
  GistPerson:
    is_a: LivingThing
    class_uri: gist:Person
    description: A human being who was or is alive.
    title: Person
    examples:
    - value: 'Negative example: fictional characters.'
    notes:
    - 'OWL subClassOf restrictions: ∀hasBiologicalParent.gist:Person'
    - 'OWL equivalentClass: (gist:LivingThing & ∃hasBiologicalParent.gist:Person)'
    exact_mappings:
    - dpv:NaturalPerson
    close_mappings:
    - common_domain_model:NaturalPerson
    broad_mappings:
    - common_domain_model:Party
    narrow_mappings:
    - dpv:DataSubject
    related_mappings:
    - iso22989:AIUser
    - iso22989:DataSubject
    in_subset:
    - gist_core
    slots:
    - owns
    aliases:
    - Person
  PhysicalActionType:
    is_a: Category
    class_uri: gist:PhysicalActionType
    description: A category indicating the type of an action based on its effect in the physical world.
    title: Physical Action Type
    examples:
    - value: Lifting a garage door, turning off a valve, dropping cadmium rods.
    in_subset:
    - gist_core
  PhysicalAddress:
    is_a: Address
    class_uri: gist:PhysicalAddress
    description: An address that refers to a locatable place within the physical universe.
    title: Physical Address
    examples:
    - value: 1600 Pennsylvania Avenue NW, Washington, DC 20500; PO Box 7704, San Francisco, CA 94120-7704;
        Room 317 in the Louvre Museum.
    notes:
    - 'OWL equivalentClass: (gist:Address & ∃refersTo.gist:GeoLocation)'
    close_mappings:
    - common_domain_model:Address
    in_subset:
    - gist_core
  PhysicalAddressType:
    is_a: Category
    class_uri: gist:PhysicalAddressType
    description: A category indicating local customary characterizations of physical addresses.
    title: Physical Address Type
    examples:
    - value: Street address, PO box, FPO code.
    in_subset:
    - gist_core
  PhysicalEvent:
    is_a: Event
    class_uri: gist:PhysicalEvent
    description: An event that can be said to have occurred at some place in space.
    title: Physical Event
    examples:
    - value: A meeting, a car accident.
    - value: 'Negative examples: Excludes events that have no meaningful location, such as financial events
        or project milestones.'
    notes:
    - 'OWL equivalentClass: (gist:Event & ∃occursIn.gist:GeoLocation)'
    in_subset:
    - gist_core
  PhysicalIdentifiableItem:
    mixins:
    - GistThing
    class_uri: gist:PhysicalIdentifiableItem
    description: A discrete physical object which, if subdivided, will result in parts that are distinguishable
      in nature from the whole and in general also from the other parts.
    title: Physical Identifiable Item
    comments:
    - This concept generally corresponds to count nouns in English. By contrast, physical substances,
      such as an amount of water, flour, or sand, are mass nouns. Physical identifiable items are made
      up of physical substances; e.g., a cake is made up of butter, flour, and sugar; a statue is made
      of bronze. If you divide a physical substance such as an amount of water into parts, you have two
      amounts of water otherwise indistinguishable from one another; if you divide a physical identifiable
      item such as a computer into parts, each part is different from the whole.
    examples:
    - value: A laptop, a physical book, a car, a building, a landmark (such as a tree stump with an etched
        marking to denote a campsite).
    notes:
    - 'OWL subClassOf restrictions: ∃isMadeUpOf.gist:PhysicalSubstance; ∃hasMagnitude.∃hasAspect=_Aspect_mass;
      ∃hasMagnitude.∃hasAspect=_Aspect_volume'
    disjoint_with:
    - SchemaMetaData
    - UnitOfMeasure
    in_subset:
    - gist_core
    is_a: Concept
  PhysicalSubstance:
    mixins:
    - GistThing
    class_uri: gist:PhysicalSubstance
    description: An undifferentiated amount of physical material which, when subdivided, results in each
      part being indistinguishable in nature from the whole and from every other part.
    title: Physical Substance
    comments:
    - An instance of this class has weight and takes up space. We mean the physical gold in a ring, not
      the concept of gold that shows up in the periodic table. The latter would be an instance of gist:KnowledgeConcept.
    - This concept generally corresponds to mass nouns in English. By contrast, instances of gist:PhysicalIdentifiableItem,
      such as a computer, book, or car, are count nouns. Physical identifiable items are made up of physical
      substances; e.g., a cake is made up of butter, flour, and sugar; a ring is made of gold. If you
      divide a physical substance such as an amount of water into parts, you have different amounts of
      water otherwise indistinguishable from one another; if you divide a physical identifiable item such
      as a computer into parts, each part will be distinguishable from the original whole.
    examples:
    - value: An amount of water, penicillin, sand, or gold.
    - value: 'Negative example: the concept of gold.'
    notes:
    - 'OWL subClassOf restrictions: ∃hasMagnitude.∃hasAspect=_Aspect_volume; ∃hasMagnitude.∃hasAspect=_Aspect_mass'
    disjoint_with:
    - UnitOfMeasure
    in_subset:
    - gist_core
    is_a: Concept
  ProductCategory:
    is_a: Category
    class_uri: gist:ProductCategory
    description: Any of many ways of categorizing products.
    title: Product Category
    examples:
    - value: Automobile models, NATO product codes.
    in_subset:
    - gist_core
  ProductSpecification:
    is_a: CatalogItem
    class_uri: gist:ProductSpecification
    description: A description of something that could be physically warehoused or digitally stored and
      physically or digitally delivered.
    title: Product Specification
    notes:
    - 'OWL equivalentClass: (gist:CatalogItem & ∃isCategorizedBy.gist:ProductCategory)'
    related_mappings:
    - common_domain_model:TradableProduct
    in_subset:
    - gist_core
  Project:
    is_a: Task
    class_uri: gist:Project
    description: A task, usually of longer duration, made up of other tasks.
    title: Project
    examples:
    - value: Designing an insurance product; adding a new feature to a software application; assessing
        the level of risk for a mortgage application.
    notes:
    - 'OWL equivalentClass: (gist:Task & ∃^isPartOf.gist:Task)'
    in_subset:
    - gist_core
  ReferenceValue:
    is_a: Magnitude
    class_uri: gist:ReferenceValue
    description: A magnitude that was neither measured nor estimated but set by fiat.
    title: Reference Value
    examples:
    - value: The sales goal for a company.
    in_subset:
    - gist_core
  RenderedContent:
    is_a: FormattedContent
    class_uri: gist:RenderedContent
    description: Content expressed via some physical medium.
    title: Rendered Content
    comments:
    - Renderings of the same file on two different monitors are separate instances of rendered content.
    examples:
    - value: Words printed on paper; audio played on speakers; an image displayed on a monitor; an original
        painting.
    notes:
    - 'OWL equivalentClass: (gist:FormattedContent & ∃isRenderedOn.gist:Medium)'
    in_subset:
    - gist_core
  Requirement:
    is_a: Intention
    class_uri: gist:Requirement
    description: The obligation of a person or organization to behave in a certain way.
    title: Requirement
    examples:
    - value: In the US, drivers must drive on the right side of the road.
    in_subset:
    - gist_core
  Restriction:
    is_a: Intention
    class_uri: gist:Restriction
    description: A description of things one is prevented from doing.
    title: Restriction
    examples:
    - value: In the US, tax laws restrict the amount of money a person can put in retirement accounts
        over the course of a year.
    notes:
    - 'OWL equivalentClass: (gist:Intention & ∃prevents.gist:Behavior)'
    in_subset:
    - gist_core
  ScheduledEvent:
    is_a: Event
    class_uri: gist:ScheduledEvent
    description: An event with a planned start datetime.
    title: Scheduled Event
    comments:
    - If the event already started, but has not yet ended, it is a contemporary event with an actual start
      datetime. If the event is over, it is a historical event having an actual end datetime. The event
      always retains its planned start datetime, and thus continues to be a scheduled event.
    notes:
    - 'OWL equivalentClass: (gist:Event & ∃plannedStartDateTime.xsd:dateTime)'
    related_mappings:
    - common_domain_model:Schedule
    in_subset:
    - gist_core
  ScheduledTask:
    is_a: ScheduledEvent
    class_uri: gist:ScheduledTask
    description: A task with a planned start datetime.
    title: Scheduled Task
    comments:
    - If work on the task has already started, but has not yet ended, it will have an actual start datetime.
      If the task is completed, it will also have an actual end datetime. The task always retains its
      planned start time, and thus continues to be a scheduled task.
    notes:
    - 'Additional named superclasses (modelled as OWL multiple inheritance): Task'
    - 'OWL equivalentClass: (gist:ScheduledEvent & gist:Task)'
    in_subset:
    - gist_core
  SchemaMetaData:
    mixins:
    - GistThing
    class_uri: gist:SchemaMetaData
    description: Superclass for all types of metadata.
    title: Schema Meta Data
    comments:
    - The definition of this class needs additional work.
    examples:
    - value: Relational concepts, such as tables and columns; tool inputs, such as queries and R2RML maps.
    disjoint_with:
    - UnitOfMeasure
    deprecated: gist marks this term owl:deprecated.
    in_subset:
    - gist_core
    annotations:
      owl:deprecated: true
    is_a: Concept
  ServiceSpecification:
    is_a: CatalogItem
    class_uri: gist:ServiceSpecification
    description: A description of something that can be done for a person or organization (which produces
      some form of an act).
    title: Service Specification
    notes:
    - 'OWL equivalentClass: (gist:CatalogItem & ∃^isBasedOn.gist:Event)'
    in_subset:
    - gist_core
  Specification:
    is_a: Intention
    class_uri: gist:Specification
    description: The set of characteristics and constraints on their values that specify what it means
      to be a particular type of thing, such as a material, product, service or event. A specification
      is sufficiently precise to allow evaluating conformance to the specification.
    title: Specification
    comments:
    - Although a characterization of how to do something is often called a specification, the intended
      meaning here is limited to specifying what something is. The focus is on the what, not the how.
      Use gist:TaskTemplate for specifying the how, such as a plan or process specification. Use gist:conformsTo
      to assert that something conforms to a specification. To represent a definition of a particular
      type of thing that is not sufficiently precise to be a gist:Specification, consider using gist:KnowledgeConcept.
    examples:
    - value: The specification of the iPhone 14; hypothetical events covered by a homeowner's insurance
        policy; a drug quality specification - a set of acceptance criteria for quality characteristics
        that must be controlled to ensure a drug is fit for its intended use.
    related_mappings:
    - common_domain_model:EligibleCollateralCriteria
    in_subset:
    - gist_core
  SubCountryGovernment:
    is_a: GovernmentOrganization
    class_uri: gist:SubCountryGovernment
    description: The government of a governed geographic region other than a country which is under the
      direct or indirect control of a country government.
    title: Sub-Country Government
    comments:
    - Note that the predicate gist:isGovernedBy is used both for the relationship a governed geographic
      region has to its government and for the relationship a sub-region government has to the government
      of the larger region.
    - There are many types of sub-regions of a country and the governments thereof (as well as different
      terms, like 'province' and 'state,' which refer to essentially the same type of thing). We should
      not automatically assume 'state,' 'county,' and 'city.' Subclasses or categories can be defined
      if greater specificity is needed.
    - This class applies only to organizations governing geographic regions. Regulatory and bureaucratic
      organizations are members of the more generic gist:GovernmentOrganization class.
    notes:
    - 'OWL equivalentClass: (gist:GovernmentOrganization & ∃isGovernedBy.gist:CountryGovernment & ∃^isGovernedBy.gist:GeoRegion)'
    in_subset:
    - gist_core
  System:
    is_a: Composite
    class_uri: gist:System
    description: A composite made up of interacting or interdependent components that together operate
      as a whole.
    title: System
    comments:
    - May be used to refer to either man-made or natural systems.
    examples:
    - value: A manufacturing system, a storm system.
    notes:
    - 'OWL equivalentClass: (gist:Composite & ∃^isDirectPartOf.gist:Component)'
    in_subset:
    - gist_core
  Tag:
    is_a: Category
    class_uri: gist:Tag
    description: A term in a folksonomy used to categorize things. Tags can be made up on the fly by users.
    title: Tag
    comments:
    - Whether to use gist:containedText or gist:uniqueText on tags is an implementation decision. Since
      the latter is a subproperty of the former, the restriction remains valid either way.
    notes:
    - 'OWL subClassOf restrictions: ∃containedText.xsd:string'
    in_subset:
    - gist_core
  Task:
    is_a: Event
    class_uri: gist:Task
    description: An activity or piece of work that is either proposed, planned, scheduled, underway, or
      completed.
    title: Task
    comments:
    - Something that could potentially be executed, which is merely described but not proposed in any
      specific way, such as a business process for onboarding a new employee, or the steps in a recipe
      for making polyethylene from ethylene, is not a task but rather a task template.
    - This term is broader than the English word 'task,' which implies assignment, responsibility, or
      duty. In ordinary English going to a concert has a goal but is (generally) done for pleasure rather
      than out of obligation, and would not be considered a task, while according to the gist definition
      it is a task. The expansion of meaning is deliberate, so that anything that has a goal and can be
      specified by a task template is a task.
    - Use the property gist:isBasedOn to link a task back to the task template.
    notes:
    - 'OWL equivalentClass: (gist:Event & ∃hasGoal.gist:Intention)'
    related_mappings:
    - common_domain_model:Workflow
    - iso22989:Task
    in_subset:
    - gist_core
  TaskTemplate:
    is_a: Template
    class_uri: gist:TaskTemplate
    description: An outline of a task of a particular type, which is the basis for executing such tasks.
    title: Task Template
    comments:
    - A task template may define a single activity or a series of activities; the level of granularity
      can be varied according to use case. For example, in a new employee onboarding process, signing
      up for benefits might be one activity, or it might be broken down into signing up for health insurance,
      signing up for dental insurance, etc.
    - Use the property isBasedOn to link the Task back to the TaskTemplate.
    examples:
    - value: A business process for onboarding new employees.
    notes:
    - 'OWL equivalentClass: (gist:Template & ∃hasGoal.gist:Intention)'
    in_subset:
    - gist_core
  Template:
    mixins:
    - GistThing
    class_uri: gist:Template
    description: Something used to make objects in its own image.
    title: Template
    comments:
    - Use gist:isBasedOn to link the object made from the template back to the template.
    examples:
    - value: A die in manufacturing is used to make stamped parts; a form provides a structure and fields
        to be filled in; a cookie cutter is a template for cookies.
    disjoint_with:
    - UnitOfMeasure
    in_subset:
    - gist_core
    is_a: Concept
  TemporalRelation:
    mixins:
    - GistThing
    class_uri: gist:TemporalRelation
    description: A relationship existing for a period of time.
    title: Temporal Relation
    comments:
    - A temporal relation must have a minimum of two participants. For example, both the employer and
      the employee are participants in a temporal relation representing a period of employment. Note that
      'participant' does not imply agency; a non-sentient being can participate in a temporal relation.
      For example, both a person and a house could be participants in a hypothetical relation 'lives at.'
    examples:
    - value: The relationship between a person and their employer; the relationship between a person or
        business and an address.
    notes:
    - 'OWL subClassOf restrictions: =1startDateTime; ≥2hasParticipant'
    in_subset:
    - gist_core
    is_a: Concept
  Text:
    is_a: ContentExpression
    class_uri: gist:Text
    description: Content expressed as a written sequence of characters.
    title: Text
    comments:
    - Text is expressed in a language (human or computer) and may but need not specify an encoding.
    examples:
    - value: 'Negative example: photographs or scans of text are not text. These instead depict a subject,
        which happens to be text.'
    notes:
    - 'OWL equivalentClass: (gist:ContentExpression & ∃isExpressedIn.gist:Language & ∃containedText.xsd:string)'
    in_subset:
    - gist_core
  TimeInterval:
    mixins:
    - GistThing
    class_uri: gist:TimeInterval
    description: A span of time with a known start time, end time, and duration. As long as two of the
      three are known, the third can be inferred.
    title: Time Interval
    comments:
    - An ongoing state of affairs with an unknown end time in the future cannot be a time interval; e.g.
      the lifespan of a living person cannot be a time interval, as the end time is unknown.
    - This is distinct from a duration, which describes how long a time interval lasts (e.g., one hour;
      3 days; 22 minutes).
    examples:
    - value: 7pm to 9pm on Jan 1, 2001; fiscal year 2023 (according to some particular definition of fiscal
        year); the week starting at midnight of January 12, 2023 and lasting exactly 168 hours.
    notes:
    - 'OWL subClassOf restrictions: =1startDateTime; =1hasMagnitude.∃hasAspect=_Aspect_duration; =1endDateTime'
    related_mappings:
    - common_domain_model:Period
    in_subset:
    - gist_core
    is_a: Concept
  Transaction:
    is_a: Event
    class_uri: gist:Transaction
    description: An exchange or transfer of goods, services, or funds.
    title: Transaction
    comments:
    - Different sorts of transactions can have different datetime precisions. For example, an electronic
      transaction would have a gist:actualEndMicrosecond.
    related_mappings:
    - common_domain_model:Trade
    - common_domain_model:TradeState
    in_subset:
    - gist_core
  UnitGroup:
    is_a: Collection
    class_uri: gist:UnitGroup
    description: A collection of units of measure that can all be used to measure the same aspects.
    title: Unit Group
    comments:
    - Typically there is one unit group per aspect. An example of an aspect with two unit groups is vehicle
      efficiency, which can be measured by miles per gallon (distance per volume) or by liters per 100
      kilometers (volume per distance). These two units of measure need to be in different unit groups
      because they have different values of exponents. When adding a unit of measure to a unit group,
      make sure it has the same exponents as the other members of the unit group.
    examples:
    - value: The units of measure bit, byte, kilobit, kilobyte, etc. are all in the same unit group because
        they can all be used to measure an amount of data.
    notes:
    - 'OWL subClassOf restrictions: ∃^isMemberOf.gist:UnitOfMeasure'
    disjoint_with:
    - UnitOfMeasure

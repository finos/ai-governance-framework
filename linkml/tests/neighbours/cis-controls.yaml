# Generated by `lokf adapt` from cis_controls.yaml (cis_controls 8.1.2); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/cis-controls-lokf
name: cis-controls
title: CIS Critical Security Controls
description: A LinkML model of the structure of the CIS Critical Security Controls (CIS Controls), Version
  8.1, which the Center for Internet Security (CIS) publishes. It models the Controls and the Safeguards
  of each Control. For each Safeguard it records the asset class, the security function and the Implementation
  Groups that include it. It names each Control and Safeguard by its number and carries none of CIS's
  text.
version: 8.1.2
source: https://www.cisecurity.org/controls/v8-1
license: Apache-2.0
see_also:
- https://lmodel.github.io/cis-controls
- https://www.cisecurity.org/controls/cis-controls-list
- https://www.cisecurity.org/controls/implementation-groups
- https://www.cisecurity.org/insights/white-papers/guide-to-asset-classes-cis-critical-security-controls-v8-1
annotations:
  cis_site_version: '8.1'
  revision_date: 2025-03
  pages_read_on: '2026-10-30'
comments:
- The version is the label that the pages of CIS's guide carry for its revision of March 2025. CIS's site
  calls the edition Version 8.1. The guide's change log names two minor revisions of it, v8.1.1 in August
  2024 and v8.1.2 in March 2025. They corrected small errors, among them the security function of two
  Safeguards. The source is CIS's page for Version 8.1. scripts/check_upstream_release.py holds the same
  pins and reports when CIS's pages name a newer version.
- 'CIS licenses the CIS Controls under CC BY-NC-ND 4.0 and requires its prior approval for commercial
  use, while this schema is Apache-2.0. So the schema carries no CIS text: none of the guide''s titles,
  descriptions, overviews or explanations. The descriptions here are this project''s own words, and so
  are the title and description that src/cis_controls/data/cis-controls-8.1.2.yaml gives each Control
  and Safeguard, written from what each requires. The text slots, title and description, are optional
  and hold text their user has the right to use; NOTICE states the position.'
- The edition holds 18 Controls and 153 Safeguards. Implementation Group 1 holds 56 of the Safeguards,
  Implementation Group 2 adds 74 to make 130, and Implementation Group 3 adds the last 23, so it holds
  all 153. CIS's pages on the CIS Controls list and on each Implementation Group state these numbers.
default_prefix: cis_controls
default_range: string
prefixes:
  cis_controls: https://w3id.org/lmodel/cis-controls/
  linkml: https://w3id.org/linkml/
  nist_csf_v2: https://w3id.org/lmodel/nist-csf-v2/
  oscal: https://w3id.org/lmodel/oscal/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
- linkml:types
- lokf
types:
  cis_control_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A Control''s identifier: its number from 1 to 18, as CIS writes it, such as 4 for Control
      4.'
    pattern: ^([1-9]|1[0-8])$
  cis_safeguard_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A Safeguard''s identifier, as CIS writes it: the number of its Control, a dot and the
      Safeguard''s number within the Control, such as 4.1 for Safeguard 4.1.'
    pattern: ^([1-9]|1[0-8])\.[1-9][0-9]?$
slots:
  cis_control_id:
    description: The Control's identifier, its number, such as 4.
    range: cis_control_identifier
    required: true
    comments:
    - 'The identifier is CIS''s own number, so data joins with CIS''s guide and with the crosswalks that
      cite it without a translation. It is a string, so quote it in YAML: YAML reads an unquoted 4 as
      a number and an unquoted 1.10 as the number 1.1. The validator rejects either as not a string, but
      a file loaded into the generated dataclasses without validation would turn 1.10 into 1.1.'
  cis_safeguard_id:
    description: The Safeguard's identifier, its number, such as 4.1.
    range: cis_safeguard_identifier
    required: true
    comments:
    - It starts with the number of the Control that holds the Safeguard. The validator cannot check that
      against the Control a Safeguard is listed under; tests/test_data.py checks it over the examples.
classes:
  CisControls:
    class_uri: cis_controls:Controls
    description: 'One edition of the CIS Controls as a whole: its Controls, each holding its Safeguards.'
    see_also:
    - https://www.cisecurity.org/controls/cis-controls-list
    broad_mappings:
    - oscal:Catalog
    attributes:
      cis_version:
        description: The edition, as CIS numbers it, such as 8.1, or the revision the guide's pages carry,
          such as 8.1.2.
        required: true
        pattern: ^[0-9]+\.[0-9]+(\.[0-9]+)?$
      cis_controls:
        description: The Controls, in CIS's order.
        range: CisControl
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
  CisControl:
    class_uri: cis_controls:Control
    description: 'One of the CIS Controls: a group of Safeguards on one subject, named by its number,
      such as Control 4.'
    see_also:
    - https://www.cisecurity.org/controls/cis-controls-list
    broad_mappings:
    - oscal:Group
    slots:
    - cis_control_id
    - title
    - description
    attributes:
      control_safeguards:
        description: The Safeguards of the Control. A knowledge bundle relates a Safeguard to its Control
          with isPartOf instead.
        range: CisSafeguard
        multivalued: true
        inlined: true
        inlined_as_list: true
    slot_usage:
      title:
        range: string
      description:
        range: string
    is_a: Concept
  CisSafeguard:
    class_uri: cis_controls:Safeguard
    description: 'One Safeguard of a Control: a single action an enterprise takes, named by its Control''s
      number and its own, such as Safeguard 4.1.'
    see_also:
    - https://www.cisecurity.org/controls/cis-controls-list
    broad_mappings:
    - oscal:Control
    slots:
    - cis_safeguard_id
    - title
    - description
    attributes:
      safeguard_asset_class:
        description: The class of enterprise asset the Safeguard is about.
        range: CisAssetClass
        required: true
      safeguard_security_function:
        description: The security function the Safeguard serves, one of the six functions of the NIST
          Cybersecurity Framework (CSF) 2.0.
        range: CisSecurityFunction
        required: true
      safeguard_implementation_groups:
        description: The Implementation Groups that include the Safeguard.
        range: CisImplementationGroup
        required: true
        multivalued: true
        minimum_cardinality: 1
        maximum_cardinality: 3
        has_member:
          equals_string: IG3
        comments:
        - 'The groups are cumulative: a Safeguard in IG1 is in IG2 and IG3 too, and one in IG2 is in IG3.
          The schema states the part of that rule the validator can check, that every Safeguard is in
          IG3. The JSON Schema that LinkML 1.12.1 generates drops the rest, so a list of IG1 and IG3 without
          IG2 passes the validator. tests/test_data.py checks the whole rule over the examples.'
    slot_usage:
      title:
        range: string
      description:
        range: string
    is_a: Concept
enums:
  CisImplementationGroup:
    description: One of the three Implementation Groups, CIS's tiers for deciding which Safeguards an
      enterprise puts in place first. Each group includes every Safeguard of the groups before it.
    see_also:
    - https://www.cisecurity.org/controls/implementation-groups
    permissible_values:
      IG1:
        title: Implementation Group 1
        description: The first group, where every enterprise starts.
      IG2:
        title: Implementation Group 2
        description: The second group, which adds Safeguards to the first.
      IG3:
        title: Implementation Group 3
        description: The third group, which adds the rest and so holds every Safeguard.
  CisAssetClass:
    description: One of the classes of enterprise asset that the CIS Controls sort their Safeguards by.
      Each Safeguard is about one class.
    see_also:
    - https://www.cisecurity.org/insights/white-papers/guide-to-asset-classes-cis-critical-security-controls-v8-1
    comments:
    - CIS revised the classes, and which Safeguard is about which, in Version 8.1. CIS's guide divides
      each class further, but a Safeguard names only the class.
    permissible_values:
      DEVICES:
        title: Devices
        description: The enterprise's hardware, wherever it runs.
      SOFTWARE:
        title: Software
        description: The programs and systems that run on the enterprise's devices.
      DATA:
        title: Data
        description: The information the enterprise holds, uses and moves.
      USERS:
        title: Users
        description: The people and accounts with access to the enterprise's assets.
      NETWORK:
        title: Network
        description: How the enterprise's devices connect, and how its networks are laid out.
      DOCUMENTATION:
        title: Documentation
        description: The enterprise's written governance, such as its policies and procedures.
  CisSecurityFunction:
    description: The security function a Safeguard serves. The values are the six functions of the NIST
      Cybersecurity Framework (CSF) 2.0, to which Version 8.1 aligned the CIS Controls.
    see_also:
    - https://www.cisecurity.org/controls/v8-1
    related_mappings:
    - nist_csf_v2:Function
    comments:
    - lmodel/nist-csf-v2 v0.1.0 models a CSF function as an instance of its class CsfFunction, IRI nist_csf_v2:Function,
      named by the two letters in its csf_function_id. It publishes no IRI for each function, so the values
      carry no meaning; each value's csf_function_id annotation gives the letters, and the enum names
      the class in related_mappings.
    permissible_values:
      GOVERN:
        title: Govern
        description: The CSF 2.0 function GOVERN.
        annotations:
          csf_function_id: GV
      IDENTIFY:
        title: Identify
        description: The CSF 2.0 function IDENTIFY.
        annotations:
          csf_function_id: ID
      PROTECT:
        title: Protect
        description: The CSF 2.0 function PROTECT.
        annotations:
          csf_function_id: PR
      DETECT:
        title: Detect
        description: The CSF 2.0 function DETECT.
        annotations:
          csf_function_id: DE
      RESPOND:
        title: Respond
        description: The CSF 2.0 function RESPOND.
        annotations:
          csf_function_id: RS
      RECOVER:
        title: Recover
        description: The CSF 2.0 function RECOVER.
        annotations:
          csf_function_id: RC
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: CisControl, CisSafeguard; folded into
  LOKF''s: title -> title, description -> description.'

# Generated by `lokf adapt` from cwe.yaml (cwe 5.0); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/cwe-lokf
name: cwe
title: Common Weakness Enumeration (CWE) List and Schema
description: A LinkML model of the Common Weakness Enumeration, the catalogue of software and hardware
  weakness types that The MITRE Corporation publishes for the CWE Program. It renders the catalogue's
  XML Schema with its own element names and values, so the whole catalogue validates with both unchanged.
version: '5.0'
source: https://cwe.mitre.org/data/xsd/cwe_schema_v8.0.xsd
license: Apache-2.0
keywords:
- weakness
- CWE
- root cause mapping
- software weakness
- hardware weakness
- secure coding
see_also:
- https://lmodel.github.io/cwe
- https://cwe.mitre.org/
annotations:
  xsd_version: '8.0'
  xsd_namespace: http://cwe.mitre.org/cwe-8
  xsd_date: '2026-10-28'
comments:
- The version is the edition of the CWE List that the schema renders, which is the first edition under
  XML Schema 8.0. upstream/ holds both files unchanged, tests/test_coverage.py holds the schema to the
  XSD, and scripts/check_upstream_release.py reports when either moves.
- The file behind the cwe_schema_latest.xsd link is an earlier copy of 8.0, which the catalogue breaks
  in 69 places. The source above is the file the catalogue itself names, and it validates with no error.
prefixes:
  capec: https://w3id.org/lmodel/capec/
  cwe: https://w3id.org/lmodel/cwe/
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  sepses_cwe: http://w3id.org/sepses/vocab/ref/cwe#
  skos: http://www.w3.org/2004/02/skos/core#
  xsd: http://www.w3.org/2001/XMLSchema#
  cve: https://w3id.org/lmodel/cve/
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  spdx_core: https://spdx.org/rdf/3.0.1/terms/Core/
  wdt: http://www.wikidata.org/prop/direct/
  wd: http://www.wikidata.org/entity/
default_prefix: cwe
default_range: string
imports:
- linkml:types
- lokf
classes:
  CweExternalReference:
    description: A source that entries of the catalogue cite, such as a paper, a book or a web page.
    close_mappings:
    - sepses_cwe:Reference
    - capec:CapecExternalReference
    annotations:
      xsd_type: ExternalReferenceType
    attributes:
      Author:
        description: A person or group who wrote the source.
        multivalued: true
        exact_mappings:
        - sepses_cwe:referenceAuthor
        close_mappings:
        - dcterms:creator
      Edition:
        description: The edition of the source.
        exact_mappings:
        - sepses_cwe:referenceEdition
        close_mappings:
        - schema:bookEdition
      Publication:
        description: The journal, conference or other publication that holds the source.
      Publication_Year:
        description: The year the source came out.
        range: cwe_publication_year
        exact_mappings:
        - sepses_cwe:referencePublicationYear
      Publication_Month:
        description: The month the source came out.
        range: cwe_publication_month
        exact_mappings:
        - sepses_cwe:referencePublicationMonth
      Publication_Day:
        description: The day of the month the source came out.
        range: cwe_publication_day
        exact_mappings:
        - sepses_cwe:referencePublicationDay
      Publisher:
        description: Who published the source.
        exact_mappings:
        - sepses_cwe:referencePublisher
        close_mappings:
        - dcterms:publisher
      URL:
        description: An address where the source can be read.
        range: uri
        comments:
        - One entry of CWE 5.0, REF-1068, holds the word Original here, which the XSD's anyURI admits.
        exact_mappings:
        - sepses_cwe:referenceUrl
        close_mappings:
        - schema:url
      URL_Date:
        description: The date on which the address was last seen to work.
        range: date
      Alt_URL:
        description: Another address of the source, usually one with fewer restrictions.
        range: uri
      Alt_URL_Date:
        description: The date on which the other address was last seen to work.
        range: date
      Media_Type:
        description: A form the source takes.
        range: CweReferenceMediaType
        multivalued: true
      Access_Restrictions:
        description: What stands between a reader and the source.
        range: CweReferenceAccessRestriction
      Rationale:
        description: A hint at why the source was cited.
        range: CweReferenceRationale
        multivalued: true
    slots:
    - id
    - title
    slot_usage:
      title:
        required: true
        range: string
    is_a: Concept
  CweReference:
    description: A citation of an external reference from an entry or from one of its parts.
    annotations:
      xsd_type: ReferencesType/Reference
    attributes:
      External_Reference_ID:
        description: The external reference being cited.
        required: true
        range: CweExternalReference
      Section:
        description: The section or page of the source that this citation means.
  CweDimension:
    description: One aspect of a weakness, or of how two weaknesses differ, named in a word or two.
    annotations:
      xsd_type: DimensionElementType
    attributes:
      Type:
        description: The kind of aspect, such as a behaviour or a resource.
        required: true
        range: CweDimensionType
      Value:
        description: The aspect itself, such as Generation or Page.
        required: true
        annotations:
          xsd_text_of: xs:string
  CweCustomPhase:
    description: A life cycle stage from a field whose stages differ from those of software.
    comments:
    - XML Schema cannot tie the value to the domain, as a comment in the XSD regrets, so the XSD takes
      either list under either domain. The rules below state what it means, and tests/test_schema_rules.py
      holds their lists to the two enums.
    annotations:
      xsd_type: CustomPhaseType
    attributes:
      Domain:
        description: The field whose life cycle the stage belongs to.
        required: true
        range: CweCustomPhaseDomain
      Value:
        description: The stage.
        required: true
        any_of:
        - range: CweAiPhase
        - range: CweHardwarePhase
        annotations:
          xsd_text_of: CustomPhaseEnumeration
    rules:
    - description: A stage in the AI domain comes from the AI list.
      preconditions:
        slot_conditions:
          Domain:
            equals_string: AI
      postconditions:
        slot_conditions:
          Value:
            equals_string_in:
            - Data Collection
            - Training
            - Fine-tuning
            - Testing
            - Tokenization
            - Prompting
            - Output Processing
            - Component Interaction
            - Re-training / Feedback
    - description: A stage in the Hardware domain comes from the hardware list.
      preconditions:
        slot_conditions:
          Domain:
            equals_string: Hardware
      postconditions:
        slot_conditions:
          Value:
            equals_string_in:
            - Hardware Requirements
            - Hardware Architecture
            - Hardware Microarchitecture
            - Implementation & Physical Design
            - Pre-Manufacturing Verification
            - Hardware Manufacturing
            - Post-Manufacturing Validation
            - Device Configuration & Personalization
            - Device / System Integration
            - Field Operations & Sustainment
            - Reuse
            - Decommissioning
  CweNote:
    description: A remark on an entry that fits nowhere else.
    annotations:
      xsd_type: NotesType/Note
    attributes:
      Type:
        description: What the note is about.
        required: true
        range: CweNoteType
      Version:
        description: The CWE version the note belongs to.
      ReleaseDate:
        description: The release date of that version.
        range: date
      Value:
        description: The text of the note.
        range: cwe_structured_text
        annotations:
          xsd_text_of: StructuredTextType
  CweTaxonomyMapping:
    description: A link from an entry to an entry of another taxonomy.
    annotations:
      xsd_type: TaxonomyMappingsType/Taxonomy_Mapping
    attributes:
      Taxonomy_Name:
        description: The other taxonomy.
        required: true
        range: CweTaxonomyName
      Entry_ID:
        description: The identifier of the entry in the other taxonomy.
      Entry_Name:
        description: The name of the entry in the other taxonomy.
      Mapping_Fit:
        description: How closely the two entries match.
        range: CweMappingFit
  CweContentHistory:
    description: The record of who wrote an entry and how it has changed since.
    annotations:
      xsd_type: ContentHistoryType
    attributes:
      Submission:
        description: The original submission of the entry, or each of several.
        required: true
        multivalued: true
        range: CweSubmission
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasSubmissionHistory
      Modification:
        description: A change made to the entry.
        multivalued: true
        range: CweModification
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasModificationHistory
        - skos:changeNote
      Contribution:
        description: Feedback or content that someone gave to the entry.
        multivalued: true
        range: CweContribution
        inlined: true
        inlined_as_list: true
      Previous_Entry_Name:
        description: A name the entry used to have.
        multivalued: true
        range: CwePreviousEntryName
        inlined: true
        inlined_as_list: true
  CweSubmission:
    description: Who first submitted an entry, and when it joined the list.
    close_mappings:
    - sepses_cwe:SubmissionHistory
    annotations:
      xsd_type: ContentHistoryType/Submission
    any_of:
    - slot_conditions:
        Submission_Name:
          required: true
    - slot_conditions:
        Submission_Organization:
          required: true
    attributes:
      Submission_Name:
        description: A person or group who submitted the entry.
        multivalued: true
        exact_mappings:
        - sepses_cwe:submissionName
      Submission_Organization:
        description: The organization the submitter belongs to.
        exact_mappings:
        - sepses_cwe:submissionOrganization
      Submission_Date:
        description: The date of the submission.
        required: true
        range: date
        exact_mappings:
        - sepses_cwe:submissionDate
      Submission_Version:
        description: The first CWE version that held the submission.
        required: true
      Submission_ReleaseDate:
        description: The release date of that version.
        required: true
        range: date
      Submission_Comment:
        description: A remark on the submission.
  CweModification:
    description: One change made to an entry.
    close_mappings:
    - sepses_cwe:ModificationHistory
    annotations:
      xsd_type: ContentHistoryType/Modification
    attributes:
      Modification_Name:
        description: The person who made or suggested the change.
        exact_mappings:
        - sepses_cwe:modificationName
      Modification_Organization:
        description: The organization that person belongs to.
        exact_mappings:
        - sepses_cwe:modificationOrganization
      Modification_Date:
        description: The date of the change.
        required: true
        range: date
        exact_mappings:
        - sepses_cwe:modificationDate
      Modification_Version:
        description: The first CWE version that held the change.
        required: true
      Modification_ReleaseDate:
        description: The release date of that version.
        required: true
        range: date
      Modification_Importance:
        description: How much the change matters to people who rely on the entry.
        range: CweImportance
      Modification_Comment:
        description: What changed.
        required: true
        exact_mappings:
        - sepses_cwe:modificationComment
  CweContribution:
    description: Feedback or content that someone gave to an entry.
    annotations:
      xsd_type: ContentHistoryType/Contribution
    attributes:
      Type:
        description: Whether the contribution was feedback or content.
        required: true
        range: CweContributionType
      Contribution_Name:
        description: A person or group who contributed.
        multivalued: true
      Contribution_Organization:
        description: The organization the contributor belongs to.
      Contribution_Date:
        description: The date of the contribution.
        required: true
        range: date
      Contribution_Version:
        description: The first CWE version that held the contribution.
        required: true
      Contribution_ReleaseDate:
        description: The release date of that version.
        required: true
        range: date
      Contribution_Comment:
        description: A remark on the contribution.
  CwePreviousEntryName:
    description: A name an entry had before.
    annotations:
      xsd_type: ContentHistoryType/Previous_Entry_Name
    attributes:
      Date:
        description: The date the name stopped being used.
        required: true
        range: date
      Version:
        description: The CWE version in which the name changed.
      Value:
        description: The earlier name.
        required: true
        annotations:
          xsd_text_of: xs:string
  CweEntry:
    abstract: true
    description: 'Any item of the CWE List that has an identifier of its own: a weakness, a grouping or
      a view.'
    see_also:
    - https://cwe.mitre.org/documents/glossary/index.html#Entry
    annotations:
      xsd_type: WeaknessType GroupingType ViewType
    attributes:
      Status:
        description: How far the entry has come and how much it can be trusted.
        required: true
        range: CweStatus
        exact_mappings:
        - sepses_cwe:status
      References:
        description: The external references the entry cites.
        multivalued: true
        range: CweReference
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasReference
      Mapping_Notes:
        description: Guidance on whether to map a real vulnerability to this entry.
        required: true
        range: CweMappingNotes
        inlined: true
      Notes:
        description: Remarks on the entry that fit nowhere else.
        multivalued: true
        range: CweNote
        inlined: true
        inlined_as_list: true
        close_mappings:
        - skos:note
      Content_History:
        description: Who wrote the entry and how it has changed since.
        required: true
        range: CweContentHistory
        inlined: true
    slots:
    - id
    - title
    slot_usage:
      title:
        required: true
        range: string
    is_a: Concept
  CweWeakness:
    is_a: CweEntry
    description: A type of mistake or condition in software, firmware, hardware or a service that can
      leave a product open to attack.
    see_also:
    - https://cwe.mitre.org/documents/glossary/index.html#Weakness
    comments:
    - The SPDX external reference type names a weakness as a target of a link, and an NVD weakness names
      one as the cause of a vulnerability, so both are related.
    close_mappings:
    - sepses_cwe:CWE
    - schema:DefinedTerm
    - skos:Concept
    related_mappings:
    - spdx_core:ExternalRefType/cwe
    - nist_nvd:NvdWeakness
    annotations:
      xsd_type: WeaknessType
    rules:
    - description: A compound weakness is a chain or a composite.
      preconditions:
        slot_conditions:
          Abstraction:
            equals_string: Compound
      postconditions:
        slot_conditions:
          Structure:
            none_of:
            - equals_string: Simple
    - description: A chain is a compound weakness.
      preconditions:
        slot_conditions:
          Structure:
            equals_string: Chain
      postconditions:
        slot_conditions:
          Abstraction:
            equals_string: Compound
    - description: A composite is a compound weakness.
      preconditions:
        slot_conditions:
          Structure:
            equals_string: Composite
      postconditions:
        slot_conditions:
          Abstraction:
            equals_string: Compound
    attributes:
      Abstraction:
        description: How far the weakness is described in general terms or tied to a specific product.
        required: true
        range: CweAbstraction
        exact_mappings:
        - sepses_cwe:abstraction
      Structure:
        description: Whether the weakness stands alone or is made up of others.
        required: true
        range: CweStructure
        exact_mappings:
        - sepses_cwe:structure
      Diagram:
        description: The path on MITRE's site of a diagram of the weakness.
      Extended_Description:
        description: More about the weakness than its short description gives.
        range: cwe_structured_text
        exact_mappings:
        - sepses_cwe:extendedDescription
      Technical_Nuance:
        description: Finer technical detail that helps tell this weakness from close relatives.
        range: cwe_structured_text
      Dimensions:
        description: The aspects of the weakness that this entry centres on.
        multivalued: true
        range: CweDimension
        inlined: true
        inlined_as_list: true
      Related_Weaknesses:
        description: How this weakness relates to others in the list.
        multivalued: true
        range: CweRelatedWeakness
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasRelatedWeakness
        related_mappings:
        - skos:semanticRelation
      Weakness_Ordinalities:
        description: Whether the weakness tends to be a first cause or the result of another.
        multivalued: true
        range: CweWeaknessOrdinality
        inlined: true
        inlined_as_list: true
      Applicable_Platforms:
        description: The languages, systems, architectures and technologies where the weakness can appear.
        range: CweApplicablePlatforms
        inlined: true
        close_mappings:
        - sepses_cwe:hasApplicablePlatform
      Background_Details:
        description: Background that helps a reader but does not describe the weakness itself.
        multivalued: true
        range: cwe_structured_text
        close_mappings:
        - sepses_cwe:backgroundDetail
      Alternate_Terms:
        description: Other names people use for the weakness.
        multivalued: true
        range: CweAlternateTerm
        inlined: true
        inlined_as_list: true
      Modes_Of_Introduction:
        description: How and when the weakness can get into a product.
        multivalued: true
        range: CweIntroduction
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasModeOfIntroduction
      Exploitation_Factors:
        description: Conditions that make exploiting the weakness more likely.
        multivalued: true
        range: cwe_structured_text
      Likelihood_Of_Exploit:
        description: How likely it is that the weakness gets exploited.
        range: CweLikelihood
        exact_mappings:
        - sepses_cwe:likelihoodOfExploit
      Common_Consequences:
        description: What can follow when the weakness is exploited.
        multivalued: true
        range: CweConsequence
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasCommonConsequence
      Detection_Methods:
        description: Ways of finding the weakness, with what each is good for.
        multivalued: true
        range: CweDetectionMethod
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasDetectionMethod
      Potential_Mitigations:
        description: Ways of preventing the weakness or reducing what it can do.
        multivalued: true
        range: CweMitigation
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasPotentialMitigation
      Demonstrative_Examples:
        description: Worked examples of how the weakness looks in code.
        multivalued: true
        range: CweDemonstrativeExample
        inlined: true
        inlined_as_list: true
      Observed_Examples:
        description: Real cases of the weakness, usually CVE records.
        multivalued: true
        range: CweObservedExample
        inlined: true
        inlined_as_list: true
      Functional_Areas:
        description: The parts of a product where the weakness tends to appear.
        multivalued: true
        range: CweFunctionalArea
      Affected_Resources:
        description: The system resources that exploiting the weakness can affect.
        multivalued: true
        range: CweResource
      Taxonomy_Mappings:
        description: Links to entries of other taxonomies.
        multivalued: true
        range: CweTaxonomyMapping
        inlined: true
        inlined_as_list: true
      Related_Attack_Patterns:
        description: Attack patterns that may apply where the weakness is present.
        multivalued: true
        range: CweRelatedAttackPattern
        inlined: true
        inlined_as_list: true
        close_mappings:
        - sepses_cwe:hasCAPEC
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: string
    slots:
    - description
  CweGrouping:
    is_a: CweEntry
    description: A set of weaknesses gathered by something they share, for browsing and not for mapping
      real vulnerabilities to. Schema versions before 8.0 called it a category.
    close_mappings:
    - skos:Collection
    annotations:
      xsd_type: GroupingType
    attributes:
      Relationships:
        description: The entries this grouping holds.
        range: CweRelationships
        inlined: true
      Taxonomy_Mappings:
        description: Links to entries of other taxonomies.
        multivalued: true
        range: CweTaxonomyMapping
        inlined: true
        inlined_as_list: true
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: cwe_structured_text
    slots:
    - description
  CweView:
    is_a: CweEntry
    description: A way of looking at the catalogue, as a subset of its entries seen from one standpoint.
    see_also:
    - https://cwe.mitre.org/documents/glossary/index.html#View
    comments:
    - A graph view arranges concepts as a scheme does, but a slice is a flat list, so the SKOS concept
      scheme is only related.
    related_mappings:
    - skos:ConceptScheme
    annotations:
      xsd_type: ViewType
    attributes:
      Type:
        description: How the view selects and arranges its entries.
        required: true
        range: CweViewType
      Audience:
        description: The people who may find the view useful, and why.
        multivalued: true
        range: CweStakeholder
        inlined: true
        inlined_as_list: true
      Members:
        description: The entries a view names one by one, when it is not selected by a filter.
        range: CweRelationships
        inlined: true
      Filter:
        description: The XPath expression that selects the entries of an implicit slice.
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: cwe_structured_text
    slots:
    - description
  CweRelatedWeakness:
    description: A link from a weakness to another weakness, in one view.
    close_mappings:
    - sepses_cwe:RelatedWeakness
    annotations:
      xsd_type: RelatedWeaknessesType/Related_Weakness
    attributes:
      Nature:
        description: How the two weaknesses relate.
        required: true
        range: CweRelatedNature
        exact_mappings:
        - sepses_cwe:relatedWeaknessNature
      CWE_ID:
        description: The weakness at the other end of the link.
        required: true
        range: CweWeakness
        pattern: ^[1-9][0-9]*$
        exact_mappings:
        - sepses_cwe:relatedCWE
      View_ID:
        description: The view in which the link holds.
        required: true
        range: CweView
        pattern: ^[1-9][0-9]*$
        exact_mappings:
        - sepses_cwe:relatedWeaknessViewId
      Chain_ID:
        description: The named chain that the link belongs to.
        range: CweWeakness
        pattern: ^[1-9][0-9]*$
      Ordinal:
        description: Marks this as the link to prefer in the view.
        range: CweOrdinal
        exact_mappings:
        - sepses_cwe:relatedWeaknessOrdinal
      Dimensions:
        description: The aspects in which the two weaknesses differ.
        multivalued: true
        range: CweDimension
        inlined: true
        inlined_as_list: true
  CweWeaknessOrdinality:
    description: Whether a weakness tends to be a first cause or the result of another.
    annotations:
      xsd_type: WeaknessOrdinalitiesType/Weakness_Ordinality
    attributes:
      Ordinality:
        description: The position in the sequence of causes.
        required: true
        range: CweOrdinality
        exact_mappings:
        - sepses_cwe:weaknessOrdinality
      Description:
        description: The setting in which the weakness takes this position.
  CweApplicablePlatforms:
    description: The kinds of platform where a weakness can appear.
    close_mappings:
    - sepses_cwe:ApplicablePlatform
    annotations:
      xsd_type: ApplicablePlatformsType
    attributes:
      Language:
        description: A programming language, or a family of them.
        multivalued: true
        range: CweLanguagePlatform
        inlined: true
        inlined_as_list: true
      Operating_System:
        description: An operating system, or a family of them.
        multivalued: true
        range: CweOperatingSystemPlatform
        inlined: true
        inlined_as_list: true
      Architecture:
        description: A hardware architecture, or a family of them.
        multivalued: true
        range: CweArchitecturePlatform
        inlined: true
        inlined_as_list: true
      Technology:
        description: A technology, or a family of them.
        multivalued: true
        range: CweTechnologyPlatform
        inlined: true
        inlined_as_list: true
  CweLanguagePlatform:
    description: A language where a weakness can appear, named or by its family.
    annotations:
      xsd_type: ApplicablePlatformsType/Language
    attributes:
      Name:
        description: The name of the language.
        range: CweLanguageName
      Class:
        description: The family of languages.
        range: CweLanguageClass
      Prevalence:
        description: How regularly the weakness applies here.
        required: true
        range: CwePrevalence
      Note:
        description: A remark on this platform.
        range: cwe_structured_text
  CweOperatingSystemPlatform:
    description: An operating system where a weakness can appear, named or by its family.
    annotations:
      xsd_type: ApplicablePlatformsType/Operating_System
    attributes:
      Name:
        description: The name of the operating system.
        range: CweOperatingSystemName
      Version:
        description: The version of the operating system.
      CPE_ID:
        description: The Common Platform Enumeration name of the operating system.
      Class:
        description: The family of operating systems.
        range: CweOperatingSystemClass
      Prevalence:
        description: How regularly the weakness applies here.
        required: true
        range: CwePrevalence
      Note:
        description: A remark on this platform.
        range: cwe_structured_text
  CweArchitecturePlatform:
    description: A hardware architecture where a weakness can appear, named or by its family.
    annotations:
      xsd_type: ApplicablePlatformsType/Architecture
    attributes:
      Name:
        description: The name of the architecture.
        range: CweArchitectureName
      Class:
        description: The family of architectures.
        range: CweArchitectureClass
      Prevalence:
        description: How regularly the weakness applies here.
        required: true
        range: CwePrevalence
      Note:
        description: A remark on this platform.
        range: cwe_structured_text
  CweTechnologyPlatform:
    description: A technology where a weakness can appear, named or by its family.
    annotations:
      xsd_type: ApplicablePlatformsType/Technology
    attributes:
      Name:
        description: The name of the technology.
        range: CweTechnologyName
      Class:
        description: The family of technologies.
        range: CweTechnologyClass
      Prevalence:
        description: How regularly the weakness applies here.
        required: true
        range: CwePrevalence
      Note:
        description: A remark on this platform.
        range: cwe_structured_text
  CweAlternateTerm:
    description: Another name people use for a weakness.
    annotations:
      xsd_type: AlternateTermsType/Alternate_Term
    attributes:
      Term:
        description: The name.
        required: true
        close_mappings:
        - skos:altLabel
      Role:
        description: The part the name plays when people talk about the weakness.
        multivalued: true
        range: CweAlternateTermRole
      Description:
        description: When and how the name is used.
        range: cwe_structured_text
  CweIntroduction:
    description: One way a weakness can get into a product.
    close_mappings:
    - sepses_cwe:ModeOfIntroduction
    annotations:
      xsd_type: ModesOfIntroductionType/Introduction
    attributes:
      Phase:
        description: A life cycle stage where the weakness can get in.
        multivalued: true
        range: CwePhase
        close_mappings:
        - sepses_cwe:modeOfIntroductionPhase
      Custom_Phase:
        description: A stage from the life cycle of a field such as hardware or AI.
        multivalued: true
        range: CweCustomPhase
        inlined: true
        inlined_as_list: true
      Note:
        description: The usual way this happens.
        range: cwe_structured_text
        close_mappings:
        - sepses_cwe:modeOfIntroductionNote
  CweConsequence:
    description: One thing that can follow when a weakness is exploited.
    close_mappings:
    - sepses_cwe:CommonConsequence
    annotations:
      xsd_type: CommonConsequencesType/Consequence
    attributes:
      Consequence_ID:
        description: An identifier for this consequence.
      Scope:
        description: A security property the consequence violates.
        required: true
        multivalued: true
        range: CweScope
        close_mappings:
        - sepses_cwe:consequenceScope
      Impact:
        description: What an attacker can achieve.
        required: true
        multivalued: true
        range: CweTechnicalImpact
        close_mappings:
        - sepses_cwe:consequenceImpact
      Likelihood:
        description: How likely this consequence is beside the others.
        range: CweLikelihood
      Note:
        description: A remark on the consequence.
        range: cwe_structured_text
        close_mappings:
        - sepses_cwe:consequenceNote
  CweDetectionMethod:
    description: One way of finding a weakness.
    close_mappings:
    - sepses_cwe:DetectionMethod
    annotations:
      xsd_type: DetectionMethodsType/Detection_Method
    attributes:
      Detection_Method_ID:
        description: An identifier that lets entries share this text, such as DM-14.
      Method:
        description: The way of finding the weakness.
        required: true
        range: CweDetectionMethodName
        exact_mappings:
        - sepses_cwe:detectionMethod
      Phase:
        description: A life cycle stage where the method applies.
        multivalued: true
        range: CwePhase
      Custom_Phase:
        description: A stage from the life cycle of a field such as hardware or AI.
        multivalued: true
        range: CweCustomPhase
        inlined: true
        inlined_as_list: true
      Description:
        description: How the method applies to this weakness.
        required: true
        range: cwe_structured_text
        exact_mappings:
        - sepses_cwe:detectionDescription
      Effectiveness:
        description: How well the method finds the weakness.
        range: CweDetectionEffectiveness
        exact_mappings:
        - sepses_cwe:detectionEffectiveness
      Effectiveness_Notes:
        description: The strengths and limits of the method here.
        range: cwe_structured_text
        exact_mappings:
        - sepses_cwe:detectionEffectivenessNote
  CweMitigation:
    description: One way of preventing a weakness or reducing what it can do.
    close_mappings:
    - sepses_cwe:PotentialMitigation
    annotations:
      xsd_type: PotentialMitigationsType/Mitigation
    attributes:
      Mitigation_ID:
        description: An identifier that lets entries share this text, such as MIT-5.
      Phase:
        description: A life cycle stage where the mitigation applies.
        multivalued: true
        range: CwePhase
        close_mappings:
        - sepses_cwe:mitigationPhase
      Custom_Phase:
        description: A stage from the life cycle of a field such as hardware or AI.
        multivalued: true
        range: CweCustomPhase
        inlined: true
        inlined_as_list: true
      Strategy:
        description: The general approach the mitigation follows.
        range: CweMitigationStrategy
      Description:
        description: What to do, with its strengths and limits.
        required: true
        range: cwe_structured_text
        exact_mappings:
        - sepses_cwe:mitigationDescription
      Effectiveness:
        description: How well the mitigation prevents the weakness.
        range: CweEffectiveness
        exact_mappings:
        - sepses_cwe:mitigationEffectiveness
      Effectiveness_Notes:
        description: The strengths and limits of the mitigation here.
        range: cwe_structured_text
        exact_mappings:
        - sepses_cwe:mitigationEffectivenessNote
  CweDemonstrativeExample:
    description: A worked example of how a weakness looks in code.
    annotations:
      xsd_type: DemonstrativeExamplesType/Demonstrative_Example
    attributes:
      Demonstrative_Example_ID:
        description: An identifier that lets entries share this example, such as DX-221.
      Title_Text:
        description: A title for the example.
      Intro_Text:
        description: The setting of the code, and what it is trying to do.
        required: true
        range: cwe_structured_text
      Entries:
        description: The example's prose and code, in the order they are meant to be read.
        comments:
        - The XSD gives this list no name, because it writes a repeating choice of two elements. The name
          is the one the CWE REST API uses, and it is the one key here that is not in the XSD.
        multivalued: true
        range: CweExampleEntry
        inlined: true
        inlined_as_list: true
  CweExampleEntry:
    description: One step of a worked example, either some prose or some code.
    annotations:
      xsd_type: DemonstrativeExamplesType/Demonstrative_Example#choice
    exactly_one_of:
    - slot_conditions:
        Body_Text:
          required: true
    - slot_conditions:
        Example_Code:
          required: true
    attributes:
      Body_Text:
        description: Prose that explains the code around it.
        range: cwe_structured_text
      Example_Code:
        description: A block of code.
        range: CweExampleCode
        inlined: true
  CweExampleCode:
    description: A block of code in a worked example.
    annotations:
      xsd_type: StructuredCodeType
    attributes:
      Nature:
        description: What the code shows.
        required: true
        range: CweCodeNature
      Language:
        description: The language of the code.
        range: CweLanguageName
      Value:
        description: The code, as an XHTML fragment with its special characters escaped.
        range: cwe_structured_text
        annotations:
          xsd_text_of: StructuredTextType
  CweObservedExample:
    description: A real case of a weakness, usually a CVE record.
    annotations:
      xsd_type: ObservedExampleType/Observed_Example
    attributes:
      Reference:
        description: The identifier of the case, such as a CVE identifier.
        required: true
        comments:
        - In CWE 5.0 it holds a CVE identifier in 3173 of 3183 cases and an external reference such as
          [REF-1100] in the rest, so lmodel/cve's cveId is only related.
        related_mappings:
        - cve:cveId
      Description:
        description: What went wrong in that case, as it bears on the weakness.
        required: true
        range: cwe_structured_text
      Link:
        description: An address with more about the case.
        required: true
        range: uri
      Rationale:
        description: A hint at why this case was chosen.
        multivalued: true
        range: CweObservedExampleRationale
  CweRelatedAttackPattern:
    description: A pointer from a weakness to an attack pattern in the CAPEC list.
    comments:
    - CAPEC holds the same link from its own side. CWE 5.0 and CAPEC 3.9 each name the same 1212 pairs,
      which tests/test_catalogue.py holds, so the two classes are the two ends of one link and the mapping
      is related.
    annotations:
      xsd_type: RelatedAttackPatternsType/Related_Attack_Pattern
    related_mappings:
    - capec:CapecRelatedWeakness
    attributes:
      CAPEC_ID:
        description: The number of the attack pattern in the CAPEC list.
        required: true
        range: cwe_capec_id
        related_mappings:
        - capec:CapecAttackPattern
  CweStakeholder:
    description: A group of people who may find a view useful.
    annotations:
      xsd_type: AudienceType/Stakeholder
    attributes:
      Type:
        description: The group.
        required: true
        range: CweStakeholderType
      Description:
        description: What in the view this group may find useful.
  CweMember:
    description: A link from a grouping or a view to an entry it holds or belongs to, in one view.
    annotations:
      xsd_type: MemberType
    attributes:
      CWE_ID:
        description: The entry at the other end of the link.
        required: true
        range: CweEntry
        pattern: ^[1-9][0-9]*$
      View_ID:
        description: The view in which the link holds.
        required: true
        range: CweView
        pattern: ^[1-9][0-9]*$
      Dimensions:
        description: The aspects in which the two entries differ.
        multivalued: true
        range: CweDimension
        inlined: true
        inlined_as_list: true
  CweRelationships:
    description: The entries that a grouping or a view holds or belongs to.
    annotations:
      xsd_type: RelationshipsType
    any_of:
    - slot_conditions:
        Member_Of:
          required: true
    - slot_conditions:
        Has_Member:
          required: true
    attributes:
      Member_Of:
        description: An entry that holds this one.
        multivalued: true
        range: CweMember
        inlined: true
        inlined_as_list: true
      Has_Member:
        description: An entry that this one holds.
        multivalued: true
        range: CweMember
        inlined: true
        inlined_as_list: true
  CweMappingNotes:
    description: Guidance on whether to map a real vulnerability to an entry, and on what to use instead.
    annotations:
      xsd_type: MappingNotesType
    attributes:
      Usage:
        description: Whether the entry may be used for mapping.
        required: true
        range: CweUsage
        exact_mappings:
        - sepses_cwe:mappingUsage
      Rationale:
        description: Why the entry has that usage.
        required: true
        range: cwe_structured_text
      Comments:
        description: More advice for someone mapping to the entry.
        required: true
        range: cwe_structured_text
      Reasons:
        description: Short labels that sum up the usage.
        required: true
        multivalued: true
        range: CweMappingReason
        inlined: true
        inlined_as_list: true
      Suggestions:
        description: Other weaknesses that may suit the mapping better.
        multivalued: true
        range: CweMappingSuggestion
        inlined: true
        inlined_as_list: true
  CweMappingReason:
    description: One short label that sums up the usage of an entry.
    annotations:
      xsd_type: ReasonsType/Reason
    attributes:
      Type:
        description: The label.
        required: true
        range: CweReason
  CweMappingSuggestion:
    description: A weakness that may suit a mapping better than this entry.
    annotations:
      xsd_type: SuggestionsType/Suggestion
    attributes:
      CWE_ID:
        description: The suggested weakness.
        required: true
        range: CweWeakness
        pattern: ^[1-9][0-9]*$
      Comment:
        description: When the suggestion applies.
        required: true
  CweWeaknessCatalog:
    description: One release of the CWE List, with all its entries and the sources they cite.
    comments:
    - Wikidata's item is the catalogue in general and this class is one release of it, so the item is
      related.
    close_mappings:
    - skos:ConceptScheme
    - schema:DefinedTermSet
    related_mappings:
    - wd:Q2682392
    annotations:
      xsd_type: Weakness_Catalog
    attributes:
      Name:
        description: The name of the catalogue, which is CWE.
        required: true
      Version:
        description: The version of this release.
        required: true
      Date:
        description: The date of this release.
        required: true
        range: date
      Weaknesses:
        description: The weakness entries.
        multivalued: true
        range: CweWeakness
        inlined: true
        inlined_as_list: true
      Groupings:
        description: The grouping entries.
        multivalued: true
        range: CweGrouping
        inlined: true
        inlined_as_list: true
      Views:
        description: The view entries.
        multivalued: true
        range: CweView
        inlined: true
        inlined_as_list: true
      External_References:
        description: The sources that the entries cite.
        multivalued: true
        range: CweExternalReference
        inlined: true
        inlined_as_list: true
enums:
  CweAbstraction:
    description: How far a weakness is described in general terms or tied to a specific product or resource.
    annotations:
      xsd_type: AbstractionEnumeration
    permissible_values:
      Pillar:
        description: The most general level, a theme that the weaknesses under it share.
      Class:
        description: A very general weakness, usually independent of any language or technology.
      Base:
        description: A weakness general enough to apply widely and detailed enough to find or prevent
          it.
      Variant:
        description: A weakness tied to a particular language, technology or kind of product.
      Compound:
        description: An entry that ties two or more weaknesses together, as a chain or a composite.
  CweAlternateTermRole:
    description: The part an alternate term plays when people talk about a weakness.
    annotations:
      xsd_type: AlternateTermRoleEnumeration
    permissible_values:
      Abbreviation: null
      Acronym: null
      Alternate-Spelling: null
      Attack-Focused: null
      Impact-Oriented: null
      Multi-Weakness: null
      Multiple-Interpretation: null
      Common-Name: null
      Discouraged: null
      Legacy: null
      Other: null
  CweArchitectureClass:
    description: A broad family of hardware architectures.
    annotations:
      xsd_type: ArchitectureClassEnumeration
    permissible_values:
      Embedded: null
      Microcomputer: null
      Workstation: null
      Not Architecture-Specific:
        description: The weakness can appear on many architectures.
  CweArchitectureName:
    description: A named hardware architecture.
    annotations:
      xsd_type: ArchitectureNameEnumeration
    permissible_values:
      Alpha: null
      ARM: null
      Itanium: null
      Power Architecture: null
      SPARC: null
      x86: null
      Other: null
  CweDetectionMethodName:
    description: A way of finding a weakness.
    annotations:
      xsd_type: DetectionMethodEnumeration
    permissible_values:
      Automated Analysis: null
      Automated Dynamic Analysis: null
      Automated Static Analysis: null
      Automated Static Analysis - Source Code: null
      Automated Static Analysis - Binary or Bytecode: null
      Fuzzing: null
      Manual Analysis: null
      Manual Dynamic Analysis: null
      Manual Static Analysis: null
      Manual Static Analysis - Source Code: null
      Manual Static Analysis - Binary or Bytecode: null
      White Box: null
      Black Box: null
      Architecture or Design Review: null
      Dynamic Analysis with Manual Results Interpretation: null
      Dynamic Analysis with Automated Results Interpretation: null
      Formal Verification: null
      Simulation / Emulation: null
      Other: null
  CweDetectionEffectiveness:
    description: How well a detection method finds a weakness.
    annotations:
      xsd_type: DetectionEffectivenessEnumeration
    permissible_values:
      High:
        description: It finds the weakness often and with few false reports.
      Moderate:
        description: It works in several situations but misses some forms or gives some false reports.
      SOAR Partial:
        description: The State Of the Art Report rates it as cost-effective for part of the job.
      Opportunistic:
        description: It does not aim at this weakness and finds it only by the way.
      Limited:
        description: It helps only in some situations.
      None:
        description: It does not find the weakness.
  CweEffectiveness:
    description: How well a mitigation prevents a weakness.
    annotations:
      xsd_type: EffectivenessEnumeration
    permissible_values:
      High:
        description: It often removes the weakness altogether.
      Moderate:
        description: It prevents several forms of the weakness but does not cover them all.
      Limited:
        description: It helps only in some situations or against some forms of the weakness.
      Incidental:
        description: It protects by chance and cannot be relied on.
      Discouraged Common Practice:
        description: A habit people often follow that does not work well enough to recommend.
      Defense in Depth:
        description: It adds a layer of protection and does not remove the weakness by itself.
      None:
        description: It does not prevent the weakness.
  CweFunctionalArea:
    description: The part of a product where a weakness is most likely to appear.
    annotations:
      xsd_type: FunctionalAreaEnumeration
    permissible_values:
      Authentication: null
      Authorization: null
      Code Libraries: null
      Counters: null
      Cryptography: null
      Error Handling: null
      Interprocess Communication: null
      File Processing: null
      Logging: null
      Memory Management: null
      Networking: null
      Number Processing: null
      Program Invocation: null
      Protection Mechanism: null
      Session Management: null
      Signals: null
      String Processing: null
      Not Functional-Area-Specific: null
      Power: null
      Clock: null
  CweImportance:
    description: How much a change to an entry matters to people who already rely on it.
    annotations:
      xsd_type: ImportanceEnumeration
    permissible_values:
      Normal: null
      Critical:
        description: The change alters what the entry means or how it may be read.
  CweLanguageClass:
    description: A broad family of programming languages.
    annotations:
      xsd_type: LanguageClassEnumeration
    permissible_values:
      Assembly: null
      Compiled: null
      Hardware Description Language: null
      Interpreted: null
      Object-Oriented: null
      Memory-Unsafe: null
      Not Language-Specific:
        description: The weakness can appear in many languages.
  CweLanguageName:
    description: A named programming language or notation.
    annotations:
      xsd_type: LanguageNameEnumeration
    permissible_values:
      Ada: null
      Algorithm: null
      ARM Assembly: null
      ASP: null
      ASP.NET: null
      Basic: null
      C: null
      C++:
        title: C plus plus
      C#:
        title: C sharp
      COBOL: null
      Fortran: null
      F#:
        title: F sharp
      Go: null
      HTML: null
      Java: null
      JavaScript: null
      JSON: null
      JSP: null
      Objective-C: null
      Pascal: null
      Perl: null
      PHP: null
      Pseudocode: null
      Python: null
      Ruby: null
      Rust: null
      Shell: null
      SQL: null
      Swift: null
      SystemVerilog: null
      VB.NET: null
      Verilog: null
      VHDL: null
      XML: null
      x86 Assembly: null
      Other: null
  CweLikelihood:
    description: How likely something is to happen.
    annotations:
      xsd_type: LikelihoodEnumeration
    permissible_values:
      High: null
      Medium: null
      Low: null
      Unknown:
        description: Nobody knows how likely it is.
  CweMitigationStrategy:
    description: A general approach that a mitigation follows.
    annotations:
      xsd_type: MitigationStrategyEnumeration
    permissible_values:
      Attack Surface Reduction: null
      Compilation or Build Hardening: null
      Enforcement by Conversion: null
      Environment Hardening: null
      Firewall: null
      Input Validation: null
      Language Selection: null
      Libraries or Frameworks: null
      Resource Limitation: null
      Output Encoding: null
      Parameterization: null
      Refactoring: null
      Sandbox or Jail: null
      Separation of Privilege: null
  CweNoteType:
    description: What a note on an entry is about.
    annotations:
      xsd_type: NoteTypeEnumeration
    permissible_values:
      Applicable Platform:
        description: More detail on the platforms the entry lists.
      Maintenance:
        description: Work the entry still needs, such as sharper concepts or better relationships.
      Relationship:
        description: More detail on how the entry relates to others.
      Research Gap:
        description: A topic researchers have not yet explored enough.
      Terminology:
        description: A discussion of the words used for the weakness.
      Theoretical:
        description: The weakness described in the terms of vulnerability theory.
      Other:
        description: Anything useful that fits no other type.
  CweOrdinal:
    description: Marks the relationship to prefer among several in one view.
    annotations:
      xsd_type: OrdinalEnumeration
    permissible_values:
      Primary:
        description: The relationship to follow first in that view.
  CweOrdinality:
    description: How a weakness stands to other weaknesses in a sequence of causes.
    annotations:
      xsd_type: OrdinalityEnumeration
    permissible_values:
      Indirect:
        description: A quality problem that makes other weaknesses easier to introduce or harder to find.
      Primary:
        description: The weakness exists without depending on another one.
      Resultant:
        description: The weakness exists only because another one is present.
  CweOperatingSystemClass:
    description: A broad family of operating systems.
    annotations:
      xsd_type: OperatingSystemClassEnumeration
    permissible_values:
      Linux: null
      macOS: null
      Unix: null
      Windows: null
      Not OS-Specific:
        description: The weakness can appear on many operating systems.
  CweOperatingSystemName:
    description: A named operating system.
    annotations:
      xsd_type: OperatingSystemNameEnumeration
    permissible_values:
      AIX: null
      Android: null
      BlackBerry OS: null
      Chrome OS: null
      Darwin: null
      FreeBSD: null
      iOS: null
      macOS: null
      NetBSD: null
      OpenBSD: null
      Red Hat: null
      Solaris: null
      SUSE: null
      tvOS: null
      Ubuntu: null
      watchOS: null
      Windows 9x: null
      Windows Embedded: null
      Windows NT: null
      Other: null
  CwePhase:
    description: A stage of a product life cycle.
    annotations:
      xsd_type: PhaseEnumeration
    permissible_values:
      Policy: null
      Requirements: null
      Architecture and Design: null
      Implementation: null
      Build and Compilation: null
      Testing: null
      Documentation: null
      Bundling: null
      Distribution: null
      Installation: null
      System Configuration: null
      Operation: null
      Patching and Maintenance: null
      Porting: null
      Integration: null
      Manufacturing: null
      Decommissioning and End-of-Life: null
  CweAiPhase:
    description: A stage of the life cycle of an artificial intelligence system.
    annotations:
      xsd_type: AIPhaseEnumeration
    permissible_values:
      Data Collection: null
      Training: null
      Fine-tuning: null
      Testing: null
      Tokenization: null
      Prompting: null
      Output Processing: null
      Component Interaction: null
      Re-training / Feedback: null
  CweHardwarePhase:
    description: A stage of the life cycle of a hardware product.
    annotations:
      xsd_type: HardwarePhaseEnumeration
    permissible_values:
      Hardware Requirements: null
      Hardware Architecture: null
      Hardware Microarchitecture: null
      Implementation & Physical Design: null
      Pre-Manufacturing Verification: null
      Hardware Manufacturing: null
      Post-Manufacturing Validation: null
      Device Configuration & Personalization: null
      Device / System Integration: null
      Field Operations & Sustainment: null
      Reuse: null
      Decommissioning: null
  CweCustomPhaseDomain:
    description: The field whose own life cycle a custom phase belongs to.
    annotations:
      xsd_type: CustomPhaseDomainEnumeration
    permissible_values:
      AI: null
      Hardware: null
  CweDimensionType:
    description: The aspect of a weakness that a dimension names, such as a behaviour or a resource.
    annotations:
      xsd_type: DimensionEnumeration
    permissible_values:
      Behavior-Type: null
      Behavior-Property: null
      Resource-Type: null
      Resource-Property: null
      Input-Type: null
      Input-Property: null
      Info-Type: null
      Info-Property: null
      Code-Type: null
      Code-Property: null
      Technology: null
      Language-Type: null
      Language-Property: null
      Framework: null
      Common-Name: null
      Attack: null
      Acronym: null
      Other: null
  CwePrevalence:
    description: How regularly a weakness applies to a platform.
    annotations:
      xsd_type: PrevalenceEnumeration
    permissible_values:
      Often: null
      Sometimes: null
      Rarely: null
      Undetermined: null
      None: null
  CweReason:
    description: A short label for why an entry may not suit vulnerability mapping.
    comments:
    - Category stays beside Grouping because XSD 8.0 lists both. The data of CWE 5.0 uses only Grouping.
    annotations:
      xsd_type: ReasonEnumeration
    permissible_values:
      Abstraction: null
      Category: null
      Grouping: null
      View: null
      Deprecated: null
      Potential Deprecation: null
      Frequent Misuse: null
      Frequent Misinterpretation: null
      Multiple Use: null
      CWE Overlap: null
      Acceptable-Use: null
      Frequently-Resultant: null
      Potential Major Changes: null
      Other: null
  CweRelatedNature:
    description: How one weakness relates to another.
    comments:
    - ChildOf and ParentOf are inverses, as are CanPrecede and CanFollow, and Requires and RequiredBy.
      PeerOf and Overlaps read the same in both directions, as the CWE news article of 2026-10-28 says.
      The XSD says CanAlsoBe need not be reciprocal.
    annotations:
      xsd_type: RelatedNatureEnumeration
    permissible_values:
      ChildOf:
        description: The related weakness is more general than this one.
        close_mappings:
        - skos:broader
      ParentOf:
        description: The related weakness is more specific than this one.
        close_mappings:
        - skos:narrower
      StartsWith:
        description: 'For a named chain only: the related weakness is where the chain begins.'
      CanFollow:
        description: In a chain, the related weakness can come before this one.
      CanPrecede:
        description: In a chain, the related weakness can come after this one.
      RequiredBy:
        description: 'For composites only: the related composite needs this weakness to be present.'
      Requires:
        description: 'For composites only: this composite needs the related weakness to be present.'
      CanAlsoBe:
        description: In some settings this weakness may be seen as the related one, with neither being
          a parent of the other.
      PeerOf:
        description: The two are similar in a way that no other nature fits.
        related_mappings:
        - skos:related
      Overlaps:
        description: The two weaknesses share some ground, which CWE would rather avoid.
  CweResource:
    description: A kind of system resource that exploiting a weakness can affect.
    annotations:
      xsd_type: ResourceEnumeration
    permissible_values:
      CPU: null
      File or Directory: null
      Memory: null
      System Process: null
      Other: null
  CweScope:
    description: The security property a consequence violates.
    annotations:
      xsd_type: ScopeEnumeration
    permissible_values:
      Confidentiality: null
      Integrity: null
      Availability: null
      Access Control: null
      Accountability: null
      Authentication: null
      Authorization: null
      Non-Repudiation: null
      Other: null
  CweStatus:
    description: How far an entry has come in its life and how much it can be trusted.
    annotations:
      xsd_type: StatusEnumeration
    permissible_values:
      Deprecated:
        description: Taken out of CWE, usually because it duplicated another entry or was made by mistake.
      Draft:
        description: Its important elements are filled in and readable, though it may still have problems.
      Incomplete:
        description: Some important elements are missing and its quality is not assured.
      Obsolete:
        description: Still correct but no longer relevant, usually because a newer entry replaced it.
      Stable:
        description: Its important elements have been checked and are not expected to change much.
      Usable:
        description: It has had close review and its critical elements have been checked.
  CweStakeholderType:
    description: A group of people who may have a use for a view.
    annotations:
      xsd_type: StakeholderEnumeration
    permissible_values:
      Academic Researchers: null
      Applied Researchers: null
      Assessment Teams: null
      Assessment Tool Vendors: null
      CWE Team: null
      Educators: null
      Hardware Designers: null
      Information Providers: null
      Product Customers: null
      Product Vendors: null
      Software Developers: null
      Vulnerability Analysts: null
      Other: null
  CweStructure:
    description: Whether a weakness stands alone or is made up of others.
    annotations:
      xsd_type: StructureEnumeration
    permissible_values:
      Chain:
        description: Several weaknesses that must be reached one after another to give a vulnerability.
      Composite:
        description: Several weaknesses that give a vulnerability only when they occur together.
      Simple:
        description: One weakness whose exploitation does not depend on another.
  CweCodeNature:
    description: What a block of example code shows.
    annotations:
      xsd_type: StructuredCodeNatureEnumeration
    permissible_values:
      Attack:
        description: An attack against the code.
      Bad:
        description: Code that has the weakness.
      Good:
        description: Code that avoids the weakness.
      Informative:
        description: Background that shows neither good nor bad code.
      Mitigation:
        description: A way of addressing the weakness.
      Result:
        description: What running the code produces.
  CweMappingFit:
    description: How closely a CWE entry matches an entry of another taxonomy.
    annotations:
      xsd_type: TaxonomyMappingFitEnumeration
    permissible_values:
      Exact: null
      CWE More Abstract:

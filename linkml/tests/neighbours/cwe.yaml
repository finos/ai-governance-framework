types:
  cwe_entry_id:
    typeof: string
    base: str
    uri: xsd:string
    description: The number that identifies an entry of the CWE List, written as text, such as 79.
    comments:
    - The XSD types it as an integer. It stays a string because LinkML's RDF dumper needs an identifier
      it can expand, and the catalogue's XML holds text anyway.
    pattern: ^[1-9][0-9]*$
    annotations:
      xsd_type: xs:integer
  cwe_capec_id:
    typeof: string
    base: str
    uri: xsd:string
    description: The number of an attack pattern in the CAPEC list, written as text, such as 63.
    pattern: ^[1-9][0-9]*$
    annotations:
      xsd_type: xs:integer
  cwe_reference_id:
    typeof: string
    base: str
    uri: xsd:string
    description: The identifier of an external reference in the catalogue, such as REF-1.
    comments:
    - The XSD types it as a string with no pattern. CWE 5.0 writes REF and a number on all but one, whose
      identifier is the bare number 1300.
    annotations:
      xsd_type: xs:string
  cwe_structured_text:
    typeof: string
    base: str
    uri: xsd:string
    description: Text that may hold XHTML markup, kept as a well-formed fragment without the namespace
      prefix and with its special characters escaped.
    comments:
    - A consumer that shows this text as HTML must sanitize it first, since it can quote attack strings.
    annotations:
      xsd_type: StructuredTextType
  cwe_publication_year:
    typeof: string
    base: str
    uri: xsd:gYear
    description: A year in XML Schema's form, such as 2021.
    pattern: ^-?[0-9]{4,}(Z|[+-][0-9]{2}:[0-9]{2})?$
    annotations:
      xsd_type: xs:gYear
  cwe_publication_month:
    typeof: string
    base: str
    uri: xsd:gMonth
    description: A month in XML Schema's form, two hyphens and two digits, such as --03.
    pattern: ^--(0[1-9]|1[0-2])(Z|[+-][0-9]{2}:[0-9]{2})?$
    annotations:
      xsd_type: xs:gMonth
  cwe_publication_day:
    typeof: string
    base: str
    uri: xsd:gDay
    description: A day of the month in XML Schema's form, three hyphens and two digits, such as ---06.
    pattern: ^---(0[1-9]|[12][0-9]|3[01])(Z|[+-][0-9]{2}:[0-9]{2})?$
    annotations:
      xsd_type: xs:gDay
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: CweExternalReference, CweEntry; dropped
  for LOKF''s: Reference_ID, ID; folded into LOKF''s: CweExternalReference.Title -> title, CweEntry.Name
  -> title, CweWeakness.Description -> description, CweGrouping.Summary -> description, CweView.Objective
  -> description.'

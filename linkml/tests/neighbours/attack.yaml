    - body_raw_ref
    - content_type
    - content_disposition
    any_of:
    - slot_conditions:
        stix_body:
          required: true
    - slot_conditions:
        body_raw_ref:
          required: true
    rules:
    - description: body and body_raw_ref exclude each other.
      preconditions:
        slot_conditions:
          stix_body:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          body_raw_ref:
            value_presence: ABSENT
    close_mappings:
    - uco-observable:MimePartType
    class_uri: stix:StixMimePart
  StixWindowsRegistryValue:
    description: A value found under a Windows registry key.
    slots:
    - stix_name
    - data
    - data_type
    any_of:
    - slot_conditions:
        stix_name:
          required: true
    - slot_conditions:
        data:
          required: true
    - slot_conditions:
        data_type:
          required: true
    close_mappings:
    - uco-observable:WindowsRegistryValue
    class_uri: stix:StixWindowsRegistryValue
  StixX509V3Extensions:
    description: The standard X.509 v3 extensions of a certificate.
    slots:
    - basic_constraints
    - name_constraints
    - policy_constraints
    - key_usage
    - extended_key_usage
    - subject_key_identifier
    - authority_key_identifier
    - subject_alternative_name
    - issuer_alternative_name
    - subject_directory_attributes
    - crl_distribution_points
    - inhibit_any_policy
    - private_key_usage_period_not_before
    - private_key_usage_period_not_after
    - certificate_policies
    - policy_mappings
    any_of:
    - slot_conditions:
        basic_constraints:
          required: true
    - slot_conditions:
        name_constraints:
          required: true
    - slot_conditions:
        policy_constraints:
          required: true
    - slot_conditions:
        key_usage:
          required: true
    - slot_conditions:
        extended_key_usage:
          required: true
    - slot_conditions:
        subject_key_identifier:
          required: true
    - slot_conditions:
        authority_key_identifier:
          required: true
    - slot_conditions:
        subject_alternative_name:
          required: true
    - slot_conditions:
        issuer_alternative_name:
          required: true
    - slot_conditions:
        subject_directory_attributes:
          required: true
    - slot_conditions:
        crl_distribution_points:
          required: true
    - slot_conditions:
        inhibit_any_policy:
          required: true
    - slot_conditions:
        private_key_usage_period_not_before:
          required: true
    - slot_conditions:
        private_key_usage_period_not_after:
          required: true
    - slot_conditions:
        certificate_policies:
          required: true
    - slot_conditions:
        policy_mappings:
          required: true
    close_mappings:
    - uco-observable:X509V3ExtensionsFacet
    class_uri: stix:StixX509V3Extensions
  StixFileExtensions:
    description: 'The extensions of a file: the predefined ntfs-ext, raster-image-ext, pdf-ext, archive-ext
      and windows-pebinary-ext, and extensions that an extension definition defines.'
    extra_slots:
      range_expression:
        any_of:
        - range: StixNtfsExtension
        - range: StixRasterImageExtension
        - range: StixPdfExtension
        - range: StixArchiveExtension
        - range: StixWindowsPeBinaryExtension
        - range: StixExtension
    class_uri: stix:StixFileExtensions
  StixNetworkTrafficExtensions:
    description: 'The extensions of network traffic: the predefined http-request-ext, icmp-ext, socket-ext
      and tcp-ext, and extensions that an extension definition defines.'
    extra_slots:
      range_expression:
        any_of:
        - range: StixHttpRequestExtension
        - range: StixIcmpExtension
        - range: StixSocketExtension
        - range: StixTcpExtension
        - range: StixExtension
    class_uri: stix:StixNetworkTrafficExtensions
  StixProcessExtensions:
    description: 'The extensions of a process: the predefined windows-process-ext and windows-service-ext,
      and extensions that an extension definition defines.'
    extra_slots:
      range_expression:
        any_of:
        - range: StixWindowsProcessExtension
        - range: StixWindowsServiceExtension
        - range: StixExtension
    class_uri: stix:StixProcessExtensions
  StixUserAccountExtensions:
    description: 'The extensions of a user account: the predefined unix-account-ext, and extensions that
      an extension definition defines.'
    extra_slots:
      range_expression:
        any_of:
        - range: StixUnixAccountExtension
        - range: StixExtension
    class_uri: stix:StixUserAccountExtensions
  StixSocketOptions:
    description: The options of a network socket, as a dictionary of option names, such as SO_RCVBUF,
      to integer values.
    extra_slots:
      range_expression:
        range: integer
    class_uri: stix:StixSocketOptions
  StixExifTags:
    description: The EXIF tags of an image file, as a dictionary of tag names to string or integer values.
    extra_slots:
      range_expression:
        any_of:
        - range: string
        - range: integer
    class_uri: stix:StixExifTags
  StixPdfDocumentInfo:
    description: The document information dictionary of a PDF file, as a dictionary of string values.
    extra_slots:
      range_expression:
        range: string
    class_uri: stix:StixPdfDocumentInfo
  StixAttackPattern:
    description: Attack Patterns are a type of TTP that describe ways that adversaries attempt to compromise
      targets.
    is_a: StixDomainObject
    slots:
    - aliases
    - stix_name
    - stix_description
    - kill_chain_phases
    slot_usage:
      id: {}
      stix_type:
        equals_string: attack-pattern
      stix_name:
        required: true
    annotations:
      stix_type: attack-pattern
    class_uri: stix:StixAttackPattern
  StixCampaign:
    description: A Campaign is a grouping of adversary behavior that describes a set of malicious activities
      or attacks that occur over a period of time against a specific set of targets.
    is_a: StixDomainObject
    slots:
    - stix_name
    - stix_description
    - aliases
    - first_seen
    - last_seen
    - objective
    slot_usage:
      id: {}
      stix_type:
        equals_string: campaign
      stix_name:
        required: true
    annotations:
      stix_type: campaign
    class_uri: stix:StixCampaign
  StixCourseOfAction:
    description: A Course of Action is an action taken either to prevent an attack or to respond to an
      attack that is in progress.
    is_a: StixDomainObject
    slots:
    - stix_name
    - stix_description
    slot_usage:
      id: {}
      stix_type:
        equals_string: course-of-action
      stix_name:
        required: true
    annotations:
      stix_type: course-of-action
    class_uri: stix:StixCourseOfAction
  StixGrouping:
    description: A Grouping object explicitly asserts that the referenced STIX Objects have a shared content.
    is_a: StixDomainObject
    slots:
    - stix_name
    - stix_description
    - stix_context
    - object_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: grouping
      stix_context:
        required: true
      object_refs:
        required: true
    annotations:
      stix_type: grouping
    close_mappings:
    - uco-core:Grouping
    class_uri: stix:StixGrouping
  StixIncident:
    description: The Incident object in STIX 2.1 is a stub, to be expanded in future STIX 2 releases.
    is_a: StixDomainObject
    slots:
    - stix_name
    - stix_description
    slot_usage:
      id: {}
      stix_type:
        equals_string: incident
      stix_name:
        required: true
    annotations:
      stix_type: incident
    class_uri: stix:StixIncident
  StixIndicator:
    description: Indicators contain a pattern that can be used to detect suspicious or malicious cyber
      activity.
    is_a: StixDomainObject
    slots:
    - indicator_types
    - stix_name
    - stix_description
    - pattern
    - pattern_type
    - pattern_version
    - valid_from
    - valid_until
    - kill_chain_phases
    slot_usage:
      id: {}
      stix_type:
        equals_string: indicator
      pattern:
        required: true
      pattern_type:
        required: true
      valid_from:
        required: true
    annotations:
      stix_type: indicator
    class_uri: stix:StixIndicator
  StixInfrastructure:
    description: Infrastructure objects describe systems, software services, and associated physical or
      virtual resources.
    is_a: StixDomainObject
    slots:
    - stix_name
    - stix_description
    - infrastructure_types
    - aliases
    - kill_chain_phases
    - first_seen
    - last_seen
    slot_usage:
      id: {}
      stix_type:
        equals_string: infrastructure
      stix_name:
        required: true
    annotations:
      stix_type: infrastructure
    class_uri: stix:StixInfrastructure
  StixIntrusionSet:
    description: An Intrusion Set is a grouped set of adversary behavior and resources with common properties
      that is believed to be orchestrated by a single organization.
    is_a: StixDomainObject
    slots:
    - stix_name
    - stix_description
    - aliases
    - first_seen
    - last_seen
    - goals
    - resource_level
    - primary_motivation
    - secondary_motivations
    slot_usage:
      id: {}
      stix_type:
        equals_string: intrusion-set
      stix_name:
        required: true
    annotations:
      stix_type: intrusion-set
    class_uri: stix:StixIntrusionSet
  StixLocation:
    description: A geographic location, given as a region, a civic address, a latitude and longitude,
      or any mix of them.
    is_a: StixDomainObject
    slots:
    - stix_description
    - stix_name
    - latitude
    - longitude
    - precision
    - region
    - country
    - administrative_area
    - city
    - street_address
    - postal_code
    slot_usage:
      id: {}
      stix_type:
        equals_string: location
    any_of:
    - slot_conditions:
        region:
          required: true
    - slot_conditions:
        country:
          required: true
    - slot_conditions:
        latitude:
          required: true
        longitude:
          required: true
    rules:
    - description: A latitude needs a longitude.
      preconditions:
        slot_conditions:
          latitude:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          longitude:
            required: true
    - description: A longitude needs a latitude.
      preconditions:
        slot_conditions:
          longitude:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          latitude:
            required: true
    - description: A precision needs a latitude and a longitude.
      preconditions:
        slot_conditions:
          precision:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          latitude:
            required: true
          longitude:
            required: true
    annotations:
      stix_type: location
    close_mappings:
    - uco-location:Location
    class_uri: stix:StixLocation
  StixMalware:
    description: 'Malicious code: a program inserted into a system, usually covertly, to compromise its
      data, applications or operating system, or to disrupt its owner.'
    is_a: StixDomainObject
    slots:
    - aliases
    - first_seen
    - last_seen
    - operating_system_refs
    - architecture_execution_envs
    - implementation_languages
    - capabilities
    - sample_refs
    - malware_types
    - stix_name
    - stix_description
    - kill_chain_phases
    - is_family
    slot_usage:
      id: {}
      stix_type:
        equals_string: malware
      is_family:
        required: true
    annotations:
      stix_type: malware
    class_uri: stix:StixMalware
  StixMalwareAnalysis:
    description: Malware Analysis captures the metadata and results of a particular analysis performed
      (static or dynamic) on the malware instance or family.
    is_a: StixDomainObject
    slots:
    - product
    - stix_version
    - configuration_version
    - modules
    - analysis_engine_version
    - analysis_definition_version
    - submitted
    - analysis_started
    - analysis_ended
    - result_name
    - result
    - host_vm_ref
    - operating_system_ref
    - installed_software_refs
    - analysis_sco_refs
    - sample_ref
    slot_usage:
      id: {}
      stix_type:
        equals_string: malware-analysis
      product:
        required: true
    any_of:
    - slot_conditions:
        result:
          required: true
    - slot_conditions:
        analysis_sco_refs:
          required: true
    annotations:
      stix_type: malware-analysis
    class_uri: stix:StixMalwareAnalysis
  StixNote:
    description: A Note is a comment or note containing informative text to help explain the context of
      one or more STIX Objects (SDOs or SROs) or to provide additional analysis that is not contained
      in the original object.
    is_a: StixDomainObject
    slots:
    - abstract
    - content
    - authors
    - object_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: note
      content:
        required: true
      object_refs:
        required: true
    annotations:
      stix_type: note
    class_uri: stix:StixNote
  StixObservedData:
    description: Observed data conveys information that was observed on systems and networks, such as
      log data or network traffic, using the Cyber Observable specification.
    is_a: StixDomainObject
    slots:
    - first_observed
    - last_observed
    - number_observed
    - objects
    - object_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: observed-data
      first_observed:
        required: true
      last_observed:
        required: true
      number_observed:
        required: true
      object_refs:
        range: StixObject
        any_of:
        - range: StixCyberObservableObject
        - range: StixRelationshipObject
        pattern: ^(?!(attack-pattern|campaign|course-of-action|grouping|identity|incident|indicator|infrastructure|intrusion-set|location|malware|malware-analysis|note|observed-data|opinion|report|threat-actor|tool|vulnerability)--)[a-z][a-z0-9-]+[a-z0-9]--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      objects:
        range: StixObservedObjects
        inlined: true
        description: The observed cyber-observable objects, as a dictionary keyed by index. Deprecated
          in STIX 2.1; use object_refs.
    any_of:
    - slot_conditions:
        objects:
          required: true
    - slot_conditions:
        object_refs:
          required: true
    rules:
    - description: objects and object_refs exclude each other.
      preconditions:
        slot_conditions:
          objects:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          object_refs:
            value_presence: ABSENT
    annotations:
      stix_type: observed-data
    class_uri: stix:StixObservedData
  StixOpinion:
    description: An Opinion is an assessment of the correctness of the information in a STIX Object produced
      by a different entity and captures the level of agreement or disagreement using a fixed scale.
    is_a: StixDomainObject
    slots:
    - explanation
    - authors
    - object_refs
    - opinion
    slot_usage:
      id: {}
      stix_type:
        equals_string: opinion
      object_refs:
        required: true
      opinion:
        required: true
    annotations:
      stix_type: opinion
    class_uri: stix:StixOpinion
  StixReport:
    description: Reports are collections of threat intelligence focused on one or more topics, such as
      a description of a threat actor, malware, or attack technique, including context and related details.
    is_a: StixDomainObject
    slots:
    - report_types
    - stix_name
    - stix_description
    - published
    - object_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: report
      stix_name:
        required: true
      object_refs:
        required: true
      published:
        required: true
    annotations:
      stix_type: report
    class_uri: stix:StixReport
  StixThreatActor:
    description: Threat Actors are actual individuals, groups, or organizations believed to be operating
      with malicious intent.
    is_a: StixDomainObject
    slots:
    - threat_actor_types
    - stix_name
    - stix_description
    - aliases
    - roles
    - goals
    - first_seen
    - last_seen
    - sophistication
    - resource_level
    - primary_motivation
    - secondary_motivations
    - personal_motivations
    slot_usage:
      id: {}
      stix_type:
        equals_string: threat-actor
      stix_name:
        required: true
      roles:
        any_of:
        - range: StixThreatActorRole
        - range: string
    annotations:
      stix_type: threat-actor
    class_uri: stix:StixThreatActor
  StixTool:
    description: Tools are legitimate software that can be used by threat actors to perform attacks.
    is_a: StixDomainObject
    slots:
    - aliases
    - tool_types
    - stix_name
    - stix_description
    - tool_version
    - kill_chain_phases
    slot_usage:
      id: {}
      stix_type:
        equals_string: tool
      stix_name:
        required: true
    annotations:
      stix_type: tool
    broad_mappings:
    - uco-tool:Tool
    class_uri: stix:StixTool
  StixVulnerability:
    description: A Vulnerability is a mistake in software that can be directly used by a hacker to gain
      access to a system or network.
    is_a: StixDomainObject
    slots:
    - stix_name
    - stix_description
    slot_usage:
      id: {}
      stix_type:
        equals_string: vulnerability
      stix_name:
        required: true
    annotations:
      stix_type: vulnerability
    class_uri: stix:StixVulnerability
  StixObservedObjects:
    description: The cyber-observable objects of an observed data object, keyed by an index such as "0".
      STIX 2.1 deprecates this form in favour of object_refs.
    extra_slots:
      range_expression:
        range: StixCyberObservableObject
        inlined: true
    class_uri: stix:StixObservedObjects
  StixRelationship:
    description: The Relationship object is used to link together two SDOs in order to describe how they
      are related to each other.
    is_a: StixRelationshipObject
    slots:
    - relationship_type
    - stix_description
    - source_ref
    - target_ref
    - start_time
    - stop_time
    slot_usage:
      id: {}
      stix_type:
        equals_string: relationship
      relationship_type:
        required: true
      source_ref:
        required: true
      target_ref:
        required: true
    annotations:
      stix_type: relationship
    close_mappings:
    - uco-core:Relationship
    class_uri: stix:StixRelationship
  StixSighting:
    description: The belief that something in cyber threat intelligence, such as an indicator, malware
      or a threat actor, was seen.
    is_a: StixRelationshipObject
    slots:
    - stix_description
    - first_seen
    - last_seen
    - count
    - sighting_of_ref
    - observed_data_refs
    - where_sighted_refs
    - summary
    slot_usage:
      id: {}
      stix_type:
        equals_string: sighting
      sighting_of_ref:
        required: true
    annotations:
      stix_type: sighting
    class_uri: stix:StixSighting
  StixBundle:
    description: 'A bundle: a collection of STIX objects grouped together in one container. A bundle is
      a container for transport, not a STIX object, so it carries no spec_version.'
    slots:
    - id
    - stix_type
    - objects
    slot_usage:
      id: {}
      stix_type:
        equals_string: bundle
      objects:
        description: The STIX objects in the bundle.
        range: StixObject
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    annotations:
      stix_type: bundle
    close_mappings:
    - uco-core:Bundle
    class_uri: stix:StixBundle
    is_a: Concept
  AttackTechnique:
    description: 'A technique: how an adversary achieves a tactic''s goal. Its ATT&CK ID is T and four
      digits, and a sub-technique''s adds a full stop and three digits.'
    comments:
    - A sub-technique is a technique too, with x_mitre_is_subtechnique set and a subtechnique-of relationship
      to its parent.
    is_a: StixAttackPattern
    slots:
    - x_mitre_attack_spec_version
    - x_mitre_version
    - x_mitre_deprecated
    - x_mitre_old_attack_id
    - x_mitre_domains
    - x_mitre_modified_by_ref
    - x_mitre_contributors
    - x_mitre_platforms
    - x_mitre_is_subtechnique
    - x_mitre_impact_type
    - x_mitre_network_requirements
    - x_mitre_tactic_type
    - x_mitre_detection
    - x_mitre_data_sources
    - x_mitre_defense_bypassed
    - x_mitre_permissions_required
    - x_mitre_effective_permissions
    - x_mitre_system_requirements
    - x_mitre_remote_support
    slot_usage:
      external_references:
        required: true
      kill_chain_phases:
        range: AttackKillChainPhase
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_is_subtechnique:
        required: true
    annotations:
      stix_type: attack-pattern
      attack_id_pattern: ^T\d{4}(\.\d{3})?$
  AttackTactic:
    description: 'A tactic: an adversary''s goal, the reason for a technique. Its ATT&CK ID is TA and
      four digits.'
    is_a: StixDomainObject
    slots:
    - stix_name
    - stix_description
    - x_mitre_attack_spec_version
    - x_mitre_version
    - x_mitre_deprecated
    - x_mitre_old_attack_id
    - x_mitre_domains
    - x_mitre_modified_by_ref
    - x_mitre_contributors
    - x_mitre_shortname
    slot_usage:
      id: {}
      stix_type:
        equals_string: x-mitre-tactic
      stix_name:
        required: true
      stix_description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
      x_mitre_shortname:
        required: true
    annotations:
      stix_type: x-mitre-tactic
      attack_id_pattern: ^TA\d{4}$
  AttackGroup:
    description: 'A group: a set of related intrusion activity that the security community tracks under
      a name. Its ATT&CK ID is G and four digits.'
    is_a: StixIntrusionSet
    slots:
    - x_mitre_attack_spec_version
    - x_mitre_version
    - x_mitre_deprecated
    - x_mitre_old_attack_id
    - x_mitre_domains
    - x_mitre_modified_by_ref
    - x_mitre_contributors
    slot_usage:
      external_references:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
    annotations:
      stix_type: intrusion-set
      attack_id_pattern: ^G\d{4}$
  AttackCampaign:
    description: 'A campaign: intrusion activity over a stated period against common targets, with the
      sources for when it was first and last seen. Its ATT&CK ID is C and four digits.'
    is_a: StixCampaign
    slots:
    - x_mitre_attack_spec_version
    - x_mitre_version
    - x_mitre_deprecated
    - x_mitre_old_attack_id
    - x_mitre_domains
    - x_mitre_modified_by_ref
    - x_mitre_contributors
    - x_mitre_first_seen_citation
    - x_mitre_last_seen_citation
    slot_usage:
      stix_description:
        required: true
      created_by_ref:
        required: true
      object_marking_refs:
        required: true
      revoked:
        required: true
      external_references:
        required: true
      aliases:
        required: true
      first_seen:
        required: true
      last_seen:
        required: true
      x_mitre_attack_spec_version:
        required: true
      x_mitre_version:
        required: true
      x_mitre_domains:
        required: true
      x_mitre_modified_by_ref:
        required: true
      x_mitre_first_seen_citation:
        required: true
      x_mitre_last_seen_citation:
        required: true

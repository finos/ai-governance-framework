  x_mitre_data_sources:
    description: 'The data that can reveal the technique, each as "Data Source Name: Data Component Name".'
    deprecated: The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in 4.0.0; detection
      strategies and analytics take its place.
    multivalued: true
    minimum_cardinality: 1
    pattern: ^\s*[^:\s][^:]*:\s*[^:\s][^:]*$
    slot_uri: attack:x_mitre_data_sources
    annotations:
      attack_excluded_domains: mobile-attack
  x_mitre_defense_bypassed:
    description: The defenses a defense-evasion technique can get past.
    deprecated: The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in 4.0.0.
    range: AttackBypassedDefense
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_defense_bypassed
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: defense-evasion
  x_mitre_permissions_required:
    description: The lowest level of permission a privilege-escalation technique needs on a system.
    deprecated: The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in 4.0.0.
    range: AttackRequiredPermission
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_permissions_required
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: privilege-escalation
  x_mitre_effective_permissions:
    description: The level of permission a privilege-escalation technique gains.
    deprecated: The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in 4.0.0.
    range: AttackEffectivePermission
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_effective_permissions
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: privilege-escalation
  x_mitre_system_requirements:
    description: What the system must have or be, such as software or a patch level, for the technique
      to work.
    deprecated: The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in 4.0.0.
    multivalued: true
    minimum_cardinality: 1
    pattern: \S
    slot_uri: attack:x_mitre_system_requirements
    annotations:
      attack_domains: enterprise-attack
  x_mitre_remote_support:
    description: Whether an execution technique can run something on a remote system.
    deprecated: The ADM deprecates it in ATT&CK specification 3.3.0 and removes it in 4.0.0.
    range: boolean
    slot_uri: attack:x_mitre_remote_support
    annotations:
      attack_domains: enterprise-attack
      attack_tactic: execution
  x_mitre_shortname:
    description: The tactic's short name, which a technique's kill chain phase uses as its phase name.
    range: AttackTacticShortname
    slot_uri: attack:x_mitre_shortname
  x_mitre_first_seen_citation:
    description: 'The sources for when the campaign was first seen, each written "(Citation: name)" with
      no separator, where each name is the source name of one of the campaign''s external references.'
    comments:
    - As in the ADM, a name holds no colon and is not blank.
    pattern: '^(\(Citation: [^):]*[^):\s][^):]*\))+$'
    slot_uri: attack:x_mitre_first_seen_citation
  x_mitre_last_seen_citation:
    description: The sources for when the campaign was last seen, written as x_mitre_first_seen_citation
      is.
    pattern: '^(\(Citation: [^):]*[^):\s][^):]*\))+$'
    slot_uri: attack:x_mitre_last_seen_citation
  x_mitre_sectors:
    description: The industry sectors in which the asset is commonly found.
    range: AttackAssetSector
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_sectors
  x_mitre_related_assets:
    description: The names a sector gives to devices like the asset, each with how it relates to the asset.
    range: AttackRelatedAsset
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_related_assets
  related_asset_sectors:
    description: The sectors that use the related asset's name.
    range: AttackAssetSector
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:related_asset_sectors
  x_mitre_collection_layers:
    description: Where the data source's data can be collected.
    range: AttackCollectionLayer
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_collection_layers
  x_mitre_data_source_ref:
    description: The data source the data component belongs to.
    deprecated: The ADM deprecates it in ATT&CK specification 3.3.0, with data sources, and removes it
      in 4.0.0.
    range: AttackDataSource
    pattern: ^x-mitre-data-source--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: attack:x_mitre_data_source_ref
  x_mitre_log_sources:
    description: The logs that hold the data component's data, each a pair of log and channel that appears
      once.
    range: AttackLogSource
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_log_sources
  channel:
    description: A channel or event type within a log, such as 1 for process creation in Sysmon.
    pattern: \S
    slot_uri: attack:channel
  x_mitre_analytic_refs:
    description: The analytics that carry out the detection strategy, each named once.
    range: AttackAnalytic
    pattern: ^x-mitre-analytic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:x_mitre_analytic_refs
  x_mitre_log_source_references:
    description: The logs the analytic reads, each a data component with a log and channel of its own,
      named once.
    range: AttackLogSourceReference
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_log_source_references
  x_mitre_data_component_ref:
    description: The data component whose log the reference names.
    range: AttackDataComponent
    pattern: ^x-mitre-data-component--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    slot_uri: attack:x_mitre_data_component_ref
  x_mitre_mutable_elements:
    description: The parts of the analytic a defender may tune to their environment, such as a time window,
      each named once.
    range: AttackMutableElement
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_mutable_elements
  field:
    description: The name of the part of an analytic that can be tuned.
    pattern: \S
    slot_uri: attack:field
  tactic_refs:
    description: The tactics of the matrix, in the order the matrix shows them. MITRE's data writes this
      ATT&CK property without the x_mitre_ prefix.
    range: AttackTactic
    pattern: ^x-mitre-tactic--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    multivalued: true
    minimum_cardinality: 1
    slot_uri: attack:tactic_refs
  x_mitre_contents:
    description: The objects the collection holds, each at one version.
    range: AttackObjectVersionReference
    multivalued: true
    minimum_cardinality: 1
    inlined_as_list: true
    slot_uri: attack:x_mitre_contents
classes:
  StixObject:
    description: 'Any STIX object: the base of the domain, relationship and cyber-observable objects and
      of the meta objects.'
    abstract: true
    slots:
    - id
    - stix_type
    - spec_version
    - object_marking_refs
    - granular_markings
    - extensions
    class_uri: stix:StixObject
    is_a: Concept
  StixCommonObject:
    description: 'The base of the objects that carry STIX''s common properties: the domain and relationship
      objects, language content and extension definitions.'
    abstract: true
    is_a: StixObject
    slots:
    - created_by_ref
    - stix_created
    - modified
    - revoked
    - labels
    - confidence
    - lang
    - external_references
    slot_usage:
      spec_version:
        required: true
      stix_created:
        required: true
      modified:
        required: true
    class_uri: stix:StixCommonObject
  StixDomainObject:
    description: 'A STIX Domain Object (SDO): a higher-level concept of cyber threat intelligence, such
      as an attack pattern, a malware family or a threat actor.'
    abstract: true
    is_a: StixCommonObject
    class_uri: stix:StixDomainObject
  StixRelationshipObject:
    description: 'A STIX Relationship Object (SRO): a relationship or a sighting that links other objects.'
    abstract: true
    is_a: StixCommonObject
    class_uri: stix:StixRelationshipObject
  StixCyberObservableObject:
    description: 'A STIX Cyber-observable Object (SCO): a fact observed on a network or host, such as
      a file, an address or a process.'
    abstract: true
    is_a: StixObject
    slots:
    - defanged
    class_uri: stix:StixCyberObservableObject
  StixIdentity:
    description: An individual, organization or group, such as ACME, Inc., or a class of them.
    is_a: StixDomainObject
    slots:
    - roles
    - stix_name
    - stix_description
    - identity_class
    - sectors
    - contact_information
    slot_usage:
      id: {}
      stix_type:
        equals_string: identity
      stix_name:
        required: true
    annotations:
      stix_type: identity
    close_mappings:
    - uco-identity:Identity
    class_uri: stix:StixIdentity
  StixMarkingDefinition:
    description: 'A marking definition: a statement, a Traffic Light Protocol (TLP) level or another marking
      that applies to the objects that reference it.'
    is_a: StixObject
    slots:
    - created_by_ref
    - stix_created
    - external_references
    - stix_name
    - definition_type
    - stix_definition
    slot_usage:
      id: {}
      stix_type:
        equals_string: marking-definition
      spec_version:
        required: true
      stix_created:
        required: true
    comments:
    - created keeps the millisecond precision STIX 2.1 gives every object's created. OASIS's JSON schema
      asks a marking definition for a timestamp of any precision.
    rules:
    - description: Without extensions, a marking definition states its definition and definition type.
      preconditions:
        slot_conditions:
          extensions:
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          stix_definition:
            required: true
          definition_type:
            required: true
    annotations:
      stix_type: marking-definition
    close_mappings:
    - uco-marking:MarkingDefinition
    class_uri: stix:StixMarkingDefinition
  StixLanguageContent:
    description: The language-content object represents text content for STIX Objects represented in languages
      other than that of the original object.
    is_a: StixCommonObject
    slots:
    - object_ref
    - object_modified
    - contents
    slot_usage:
      id: {}
      stix_type:
        equals_string: language-content
      object_ref:
        required: true
      contents:
        required: true
    annotations:
      stix_type: language-content
    class_uri: stix:StixLanguageContent
  StixExtensionDefinition:
    description: The STIX Extension Definition object allows producers of threat intelligence to extend
      existing STIX objects or to create entirely new STIX objects in a standardized way.
    is_a: StixCommonObject
    slots:
    - stix_name
    - stix_description
    - schema
    - stix_version
    - extension_types
    - extension_properties
    slot_usage:
      id: {}
      stix_type:
        equals_string: extension-definition
      stix_name:
        required: true
      schema:
        required: true
      stix_version:
        required: true
      extension_types:
        required: true
    annotations:
      stix_type: extension-definition
    class_uri: stix:StixExtensionDefinition
  StixExternalReference:
    description: External references are used to describe pointers to information represented outside
      of STIX.
    slots:
    - source_name
    - stix_description
    - stix_url
    - hashes
    - external_id
    slot_usage:
      source_name:
        required: true
    any_of:
    - slot_conditions:
        external_id:
          required: true
    - slot_conditions:
        stix_description:
          required: true
    - slot_conditions:
        stix_url:
          required: true
    rules:
    - description: A reference to the CVE list names a CVE identifier.
      preconditions:
        slot_conditions:
          source_name:
            equals_string: cve
      postconditions:
        slot_conditions:
          external_id:
            required: true
            pattern: ^CVE-\d{4}-(0\d{3}|[1-9]\d{3,})$
    - description: A reference to CAPEC names a CAPEC identifier.
      preconditions:
        slot_conditions:
          source_name:
            equals_string: capec
      postconditions:
        slot_conditions:
          external_id:
            required: true
            pattern: ^CAPEC-\d+$
    close_mappings:
    - uco-core:ExternalReference
    class_uri: stix:StixExternalReference
  StixKillChainPhase:
    description: A phase in a kill chain, named by the chain and the phase.
    slots:
    - kill_chain_name
    - phase_name
    slot_usage:
      kill_chain_name:
        required: true
      phase_name:
        required: true
    class_uri: stix:StixKillChainPhase
  StixGranularMarking:
    description: 'A marking of parts of an object: the properties its selectors name, marked either by
      a marking definition or with a language.'
    comments:
    - STIX 2.1 requires exactly one of marking_ref and lang. OASIS's JSON schema requires marking_ref,
      which rejects a language marking. The schema follows the standard.
    slots:
    - marking_ref
    - selectors
    - lang
    slot_usage:
      selectors:
        required: true
    exactly_one_of:
    - slot_conditions:
        marking_ref:
          required: true
    - slot_conditions:
        lang:
          required: true
    close_mappings:
    - uco-marking:GranularMarking
    class_uri: stix:StixGranularMarking
  StixStatementMarking:
    description: 'The definition of a statement marking: a statement, such as a copyright or terms of
      use.'
    slots:
    - statement
    slot_usage:
      statement:
        required: true
    close_mappings:
    - uco-marking:StatementMarking
    class_uri: stix:StixStatementMarking
  StixTlpMarking:
    description: 'The definition of a Traffic Light Protocol (TLP) marking: its level.'
    slots:
    - tlp
    slot_usage:
      tlp:
        required: true
    class_uri: stix:StixTlpMarking
  StixExtension:
    description: An extension of an object that an extension definition defines. Besides its extension
      type it carries the properties that its definition's schema states.
    slots:
    - extension_type
    slot_usage:
      extension_type:
        required: true
    extra_slots:
      allowed: true
    class_uri: stix:StixExtension
  StixHashes:
    description: A dictionary of hashes. Each key names a hash algorithm, from the hash-algorithm-ov vocabulary
      (StixHashAlgorithm) or a custom one, and each value is the hash as a string.
    extra_slots:
      range_expression:
        range: string
    class_uri: stix:StixHashes
  StixExtensions:
    description: A dictionary of extensions, keyed by an extension definition's identifier.
    extra_slots:
      range_expression:
        range: StixExtension
    class_uri: stix:StixExtensions
  StixDictionary:
    description: A dictionary of key and value pairs that STIX leaves open.
    extra_slots:
      allowed: true
    class_uri: stix:StixDictionary
  StixLanguageContents:
    description: The translations of a language content object, keyed by language code. Each value maps
      the translated properties to their translations.
    extra_slots:
      range_expression:
        range: StixDictionary
    class_uri: stix:StixLanguageContents
  StixArtifact:
    description: An array of bytes, carried as base64 in payload_bin, or a link to a file-like payload.
    is_a: StixCyberObservableObject
    slots:
    - mime_type
    - payload_bin
    - stix_url
    - hashes
    - encryption_algorithm
    - decryption_key
    slot_usage:
      id: {}
      stix_type:
        equals_string: artifact
      mime_type:
        pattern: ^(application|audio|font|image|message|model|multipart|text|video)/[a-zA-Z0-9.+_-]+
    any_of:
    - slot_conditions:
        payload_bin:
          required: true
    - slot_conditions:
        stix_url:
          required: true
    rules:
    - description: payload_bin and url exclude each other.
      preconditions:
        slot_conditions:
          payload_bin:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          stix_url:
            value_presence: ABSENT
    - description: An artifact given by url carries its hashes.
      preconditions:
        slot_conditions:
          stix_url:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          hashes:
            required: true
    - description: A decryption key needs an encryption algorithm.
      preconditions:
        slot_conditions:
          decryption_key:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          encryption_algorithm:
            required: true
    annotations:
      stix_type: artifact
    class_uri: stix:StixArtifact
  StixAutonomousSystem:
    description: The AS object represents the properties of an Autonomous Systems (AS).
    is_a: StixCyberObservableObject
    slots:
    - number
    - stix_name
    - rir
    slot_usage:
      id: {}
      stix_type:
        equals_string: autonomous-system
      number:
        required: true
    annotations:
      stix_type: autonomous-system
    close_mappings:
    - uco-observable:AutonomousSystem
    class_uri: stix:StixAutonomousSystem
  StixDirectory:
    description: The Directory Object represents the properties common to a file system directory.
    is_a: StixCyberObservableObject
    slots:
    - path
    - path_enc
    - ctime
    - mtime
    - atime
    - contains_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: directory
      path:
        required: true
      contains_refs:
        range: StixCyberObservableObject
        any_of:
        - range: StixFile
        - range: StixDirectory
        pattern: ^(file|directory)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    annotations:
      stix_type: directory
    close_mappings:
    - uco-observable:Directory
    class_uri: stix:StixDirectory
  StixDomainName:
    description: The Domain Name represents the properties of a network domain name.
    is_a: StixCyberObservableObject
    slots:
    - value
    - resolves_to_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: domain-name
      value:
        required: true
      resolves_to_refs:
        range: StixCyberObservableObject
        any_of:
        - range: StixIpv4Address
        - range: StixIpv6Address
        - range: StixDomainName
        pattern: ^(ipv4-addr|ipv6-addr|domain-name)--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    annotations:
      stix_type: domain-name
    close_mappings:
    - uco-observable:DomainName
    class_uri: stix:StixDomainName
  StixEmailAddress:
    description: The Email Address Object represents a single email address.
    is_a: StixCyberObservableObject
    slots:
    - value
    - display_name
    - belongs_to_ref
    slot_usage:
      id: {}
      stix_type:
        equals_string: email-addr
      value:
        required: true
    annotations:
      stix_type: email-addr
    close_mappings:
    - uco-observable:EmailAddress
    class_uri: stix:StixEmailAddress
  StixEmailMessage:
    description: The Email Message Object represents an instance of an email message.
    is_a: StixCyberObservableObject
    slots:
    - email_date
    - content_type
    - from_ref
    - sender_ref
    - to_refs
    - cc_refs
    - bcc_refs
    - message_id
    - subject
    - received_lines
    - additional_header_fields
    - raw_email_ref
    - is_multipart
    - stix_body
    - body_multipart
    slot_usage:
      id: {}
      stix_type:
        equals_string: email-message
      is_multipart:
        required: true
    rules:
    - description: body and body_multipart exclude each other.
      preconditions:
        slot_conditions:
          stix_body:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          body_multipart:
            value_presence: ABSENT
    annotations:
      stix_type: email-message
    close_mappings:
    - uco-observable:EmailMessage
    class_uri: stix:StixEmailMessage
  StixFile:
    description: The File Object represents the properties of a file.
    is_a: StixCyberObservableObject
    slots:
    - hashes
    - size
    - stix_name
    - name_enc
    - magic_number_hex
    - mime_type
    - ctime
    - mtime
    - atime
    - parent_directory_ref
    - contains_refs
    - content_ref
    slot_usage:
      id: {}
      stix_type:
        equals_string: file
      extensions:
        range: StixFileExtensions
    any_of:
    - slot_conditions:
        hashes:
          required: true
    - slot_conditions:
        stix_name:
          required: true
    annotations:
      stix_type: file
    close_mappings:
    - uco-observable:File
    class_uri: stix:StixFile
  StixIpv4Address:
    description: The IPv4 Address Object represents one or more IPv4 addresses expressed using CIDR notation.
    is_a: StixCyberObservableObject
    slots:
    - value
    - resolves_to_refs
    - belongs_to_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: ipv4-addr
      value:
        required: true
        pattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(3[0-2]|[1-2][0-9]|[0-9]))?$
      resolves_to_refs:
        range: StixMacAddress
        pattern: ^mac-addr--[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    annotations:
      stix_type: ipv4-addr
    close_mappings:
    - uco-observable:IPv4Address
    class_uri: stix:StixIpv4Address
  StixIpv6Address:
    description: The IPv6 Address Object represents one or more IPv6 addresses expressed using CIDR notation.
    is_a: StixCyberObservableObject
    slots:
    - value
    - resolves_to_refs
    - belongs_to_refs
    slot_usage:
      id: {}
      stix_type:
        equals_string: ipv6-addr
      value:
        required: true

  AttackRelationship:
    description: A relationship between two ATT&CK objects, of one of the seven types ATT&CK uses. Its
      rules say which types of object each type of relationship may join.
    is_a: StixRelationship
    slots:
    - x_mitre_attack_spec_version
    - x_mitre_deprecated
    - x_mitre_old_attack_id
    - x_mitre_modified_by_ref
    slot_usage:
      relationship_type:
        range: AttackRelationshipType
      x_mitre_attack_spec_version:
        required: true
      x_mitre_modified_by_ref:
        required: true
    rules:
    - description: A group, a campaign or software uses a technique or software.
      preconditions:
        slot_conditions:
          relationship_type:
            equals_string: uses
      postconditions:
        slot_conditions:
          source_ref:
            pattern: ^(intrusion-set|campaign|malware|tool)--
          target_ref:
            pattern: ^(attack-pattern|malware|tool)--
    - description: Software uses techniques, not other software.
      preconditions:
        slot_conditions:
          relationship_type:
            equals_string: uses
          source_ref:
            pattern: ^(malware|tool)--
      postconditions:
        slot_conditions:
          target_ref:
            pattern: ^attack-pattern--
    - description: A mitigation mitigates a technique.
      preconditions:
        slot_conditions:
          relationship_type:
            equals_string: mitigates
      postconditions:
        slot_conditions:
          source_ref:
            pattern: ^course-of-action--
          target_ref:
            pattern: ^attack-pattern--
    - description: A sub-technique belongs to a technique.
      preconditions:
        slot_conditions:
          relationship_type:
            equals_string: subtechnique-of
      postconditions:
        slot_conditions:
          source_ref:
            pattern: ^attack-pattern--
          target_ref:
            pattern: ^attack-pattern--
    - description: A detection strategy, or a data component as before detection strategies, detects a
        technique.
      preconditions:
        slot_conditions:
          relationship_type:
            equals_string: detects
      postconditions:
        slot_conditions:
          source_ref:
            pattern: ^(x-mitre-detection-strategy|x-mitre-data-component)--
          target_ref:
            pattern: ^attack-pattern--
    - description: A campaign is attributed to a group.
      preconditions:
        slot_conditions:
          relationship_type:
            equals_string: attributed-to
      postconditions:
        slot_conditions:
          source_ref:
            pattern: ^campaign--
          target_ref:
            pattern: ^intrusion-set--
    - description: A technique targets an asset.
      preconditions:
        slot_conditions:
          relationship_type:
            equals_string: targets
      postconditions:
        slot_conditions:
          source_ref:
            pattern: ^attack-pattern--
          target_ref:
            pattern: ^x-mitre-asset--
    - description: An object that can be revoked is replaced by another such object.
      comments:
      - The ADM asks for one of the same type; the v20.0 data has a malware revoked by a tool, so the
        rule does not.
      preconditions:
        slot_conditions:
          relationship_type:
            equals_string: revoked-by
      postconditions:
        slot_conditions:
          source_ref:
            pattern: ^(attack-pattern|campaign|course-of-action|intrusion-set|malware|tool|x-mitre-asset|x-mitre-data-component)--
          target_ref:
            pattern: ^(attack-pattern|campaign|course-of-action|intrusion-set|malware|tool|x-mitre-asset|x-mitre-data-component)--
    annotations:
      stix_type: relationship

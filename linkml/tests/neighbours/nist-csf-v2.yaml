# Generated by `lokf adapt` from nist_csf_v2.yaml (nist_csf_v2 2.0.0); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/nist-csf-v2-lokf
name: nist-csf-v2
title: The NIST Cybersecurity Framework (CSF) 2.0
description: 'A LinkML model of the Cybersecurity Framework (CSF) 2.0, which NIST publishes as Cybersecurity
  White Paper (CSWP) 29: its six functions, their categories and subcategories, the implementation examples
  NIST publishes with the subcategories, and the CSF 1.1 categories and subcategories that CSF 2.0 withdrew,
  each with its status and, where NIST recorded it, where it moved or what incorporated it.'
version: 2.0.0
source: https://doi.org/10.6028/NIST.CSWP.29
license: Apache-2.0
see_also:
- https://lmodel.github.io/nist-csf-v2
- https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final
- https://www.nist.gov/cyberframework
- https://github.com/usnistgov/oscal-content/tree/v1.6.0/nist.gov/CSF/v2.0
annotations:
  cprt_framework_version: CSF_2_0_0
  publication_date: 2024-02
  oscal_content_tag: v1.6.0
  oscal_content_commit: f0de6d8d8c059d374f15e0ae07508d82e370fc1d
comments:
- The version is the CSF edition that CSWP 29 defines, and source is the publication's digital object
  identifier. NIST's Cybersecurity and Privacy Reference Tool names the same edition CSF_2_0_0, and the
  catalog NIST publishes for it in usnistgov/oscal-content is copied to src/nist_csf_v2/schema/oscal-content/
  at the tag and commit in the annotations. That catalog carries a version number of its own, 1.2.1, which
  numbers the catalog and not the framework. The release tags are the schema's own versions, and scripts/check_upstream_release.py
  reads the same pins and reports when NIST publishes another edition or changes the catalog.
- CSWP 29 is a work of the United States Government and is not subject to copyright in the United States.
  The descriptions here are this project's own words; NIST's text of each function, category, subcategory
  and example stays in the catalog copy.
- NIST's catalog renders each function as an OSCAL group, each category and subcategory as an OSCAL control
  and each implementation example as a part. The broad_mappings name those lmodel/oscal classes. A withdrawn
  category or subcategory is a control with a status property and links to where it moved or what incorporated
  it; the schema carries those as the element's status and identifiers.
- The catalog also marks most CSF 2.0 subcategories as first-party risk, third-party risk or both, in
  a marking property of class risk-party. CSWP 29 carries no such marking, but the catalog and the reference
  tool publish it beside the Core as they publish the implementation examples, so the schema carries it
  too, as a subcategory's risk parties.
default_prefix: nist_csf_v2
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  nist_csf_v2: https://w3id.org/lmodel/nist-csf-v2/
  oscal: https://w3id.org/lmodel/oscal/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
- linkml:types
- lokf
types:
  csf_function_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The two letters that name one of the six functions, such as GV for GOVERN.
    pattern: ^(GV|ID|PR|DE|RS|RC)$
  csf_category_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A category''s identifier: its function''s letters, a dot and two letters for the category,
      such as GV.OC for Organizational Context.'
    pattern: ^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}$
  csf_subcategory_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A subcategory''s identifier: its category''s identifier, a hyphen and a two-digit number,
      such as GV.OC-01. CSWP 29 says the numbers are not sequential on purpose: a gap marks a CSF 1.1
      subcategory that CSF 2.0 moved elsewhere.'
    pattern: ^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}-[0-9]{2}$
  csf_implementation_example_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'The identifier NIST''s reference data gives an implementation example: its subcategory''s
      identifier, a dot and a three-digit number, such as GV.OC-01.001. The numbers run once through the
      whole Core, so no two examples share one.'
    pattern: ^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}-[0-9]{2}\.[0-9]{3}$
  csf_element_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The identifier of a function, a category or a subcategory, whichever of the three a withdrawn
      category names as what incorporated it.
    pattern: ^(GV|ID|PR|DE|RS|RC)(\.[A-Z]{2}(-[0-9]{2})?)?$
  csf_category_or_subcategory_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The identifier of a category or a subcategory, whichever of the two a withdrawn subcategory
      names as what incorporated it.
    pattern: ^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}(-[0-9]{2})?$
slots:
  csf_function_id:
    description: The function's two letters, such as GV for GOVERN.
    range: csf_function_identifier
    required: true
  csf_category_id:
    description: The category's identifier, such as GV.OC.
    range: csf_category_identifier
    required: true
  csf_subcategory_id:
    description: The subcategory's identifier, such as GV.OC-01.
    range: csf_subcategory_identifier
    required: true
  csf_implementation_example_id:
    description: The example's identifier in NIST's reference data, such as GV.OC-01.001 for the first
      example of subcategory GV.OC-01.
    range: csf_implementation_example_identifier
    required: true
classes:
  CsfFramework:
    class_uri: nist_csf_v2:Framework
    description: 'One edition of the CSF as a whole: its functions, each holding its categories and their
      subcategories.'
    see_also:
    - https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final
    broad_mappings:
    - oscal:Catalog
    attributes:
      csf_version:
        description: The CSF edition, as NIST numbers it in the publication's title, such as 2.0.
        required: true
        pattern: ^[0-9]+\.[0-9]+$
      csf_functions:
        description: The six functions, in the order CSWP 29 gives them.
        range: CsfFunction
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
  CsfFunction:
    class_uri: nist_csf_v2:Function
    description: 'One of the six functions that sort the CSF''s outcomes at the highest level: GOVERN,
      IDENTIFY, PROTECT, DETECT, RESPOND and RECOVER. Each is named by two letters and described in a
      sentence.'
    see_also:
    - https://www.nist.gov/cyberframework
    broad_mappings:
    - oscal:Group
    slots:
    - csf_function_id
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        range: string
    attributes:
      function_categories:
        description: The categories of the function. A knowledge bundle relates a category to its function
          with isPartOf instead.
        range: CsfCategory
        multivalued: true
        inlined: true
        inlined_as_list: true
    is_a: Concept
  CsfCategory:
    class_uri: nist_csf_v2:Category
    description: A group of related cybersecurity outcomes within a function, such as Organizational Context
      (GV.OC), or a CSF 1.1 category that CSF 2.0 withdrew, which the catalog keeps with its status and,
      where NIST recorded it, where it moved or what incorporated it.
    see_also:
    - https://www.nist.gov/cyberframework
    broad_mappings:
    - oscal:Control
    comments:
    - A withdrawn category keeps its CSF 1.1 subcategories, each withdrawn too, and the catalog gives
      it no statement, so it has no description.
    slots:
    - csf_category_id
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        range: string
    attributes:
      category_subcategories:
        description: The subcategories of the category. A knowledge bundle relates a subcategory to its
          category with isPartOf instead.
        range: CsfSubcategory
        multivalued: true
        inlined: true
        inlined_as_list: true
      category_status:
        description: withdrawn for a CSF 1.1 category that CSF 2.0 withdrew. A category of CSF 2.0 has
          no status.
        range: CsfElementStatus
      category_moved_to:
        description: The CSF 2.0 category a withdrawn category moved to, as the catalog states it, such
          as PR.AA for PR.AC.
        range: csf_category_identifier
        multivalued: true
      category_incorporated_into:
        description: The function, category or subcategory of CSF 2.0 that took in a withdrawn category's
          outcomes, as the catalog states it, such as GV.OC for ID.BE. The catalog names none for some
          withdrawn categories.
        range: csf_element_identifier
        multivalued: true
    is_a: Concept
  CsfSubcategory:
    class_uri: nist_csf_v2:Subcategory
    description: 'A cybersecurity outcome: one statement of a result within a category, such as GV.OC-01,
      or a CSF 1.1 subcategory that CSF 2.0 withdrew, which the catalog keeps with its statement, its
      status and where it moved or what incorporated it.'
    see_also:
    - https://www.nist.gov/cyberframework
    broad_mappings:
    - oscal:Control
    comments:
    - 'A subcategory has no title of its own: its identifier names it and its statement is its description,
      which is why the description is required here.'
    slots:
    - csf_subcategory_id
    - description
    slot_usage:
      description:
        required: true
        pattern: ^\s*\S
        range: string
    attributes:
      subcategory_examples:
        description: The implementation examples NIST publishes for the subcategory. CSWP 29 says they
          are notional, that none is required, and that they are not a complete list of what could be
          done.
        range: CsfImplementationExample
        multivalued: true
        inlined: true
        inlined_as_list: true
      subcategory_status:
        description: withdrawn for a CSF 1.1 subcategory that CSF 2.0 withdrew. A subcategory of CSF 2.0
          has no status.
        range: CsfElementStatus
      subcategory_moved_to:
        description: The CSF 2.0 subcategory a withdrawn subcategory moved to, as the catalog states it,
          such as GV.OC-03 for ID.GV-03. The catalog names two for a few.
        range: csf_subcategory_identifier
        multivalued: true
      subcategory_incorporated_into:
        description: The CSF 2.0 category or subcategory that took in a withdrawn subcategory's outcome,
          as the catalog states it, such as GV.OC-01 for ID.BE-02.
        range: csf_category_or_subcategory_identifier
        multivalued: true
      subcategory_risk_parties:
        description: 'Whose risk the subcategory''s outcome addresses: the organization''s own, its suppliers''
          and other third parties'', or both.'
        comments:
        - NIST publishes this in its catalog and its reference tool, not in CSWP 29. The catalog marks
          most CSF 2.0 subcategories and leaves a few unmarked, so an absent value says nothing about
          the outcome. A withdrawn subcategory carries none.
        range: CsfRiskParty
        multivalued: true
    is_a: Concept
  CsfImplementationExample:
    class_uri: nist_csf_v2:ImplementationExample
    description: 'An implementation example: one concise, action-oriented step that could help achieve
      a subcategory''s outcome. NIST publishes the examples beside the Core, in its reference tool and
      its catalog, not in CSWP 29 itself.'
    see_also:
    - https://www.nist.gov/cyberframework
    broad_mappings:
    - oscal:Part
    slots:
    - csf_implementation_example_id
    - description
    slot_usage:
      description:
        required: true
        pattern: ^\s*\S
        range: string
enums:
  CsfElementStatus:
    description: The state the catalog gives a category or subcategory that CSF 2.0 no longer carries.
      A category or subcategory of CSF 2.0 has no status.
    see_also:
    - https://doi.org/10.6028/NIST.CSWP.29
    permissible_values:
      withdrawn:
        description: The element was in CSF 1.1 and CSF 2.0 withdrew it. The catalog keeps it, and names
          where it moved or what incorporated it where NIST recorded that.
  CsfRiskParty:
    description: Whose risk a subcategory's outcome addresses, as NIST's catalog marks it in a marking
      property of class risk-party.
    see_also:
    - https://www.nist.gov/cyberframework
    permissible_values:
      first_party:
        title: First-party risk
        description: Risk to the organization from its own systems, people and processes. The catalog's
          value is 1st.
      third_party:
        title: Third-party risk
        description: Risk that reaches the organization through its suppliers, partners and other third
          parties. The catalog's value is 3rd.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: CsfFunction, CsfCategory, CsfSubcategory;
  folded into LOKF''s: title -> title, description -> description.'

id: https://w3id.org/lmodel/nist-sp-800-53-lokf
name: nist-sp-800-53
title: NIST SP 800-53 Security and Privacy Controls, Release 5.2.0
description: 'A LinkML model of the security and privacy controls that NIST Special Publication 800-53,
  Revision 5, defines at Release 5.2.0: its twenty control families, their controls and control enhancements,
  each with its statement, discussion, organization-defined parameters, related controls and references;
  the assessment objectives and methods that SP 800-53A gives each control; and the four control baselines
  of SP 800-53B.'
version: 5.2.0
source: https://doi.org/10.6028/NIST.SP.800-53r5
license: Apache-2.0
see_also:
- https://lmodel.github.io/nist-sp-800-53
- https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
- https://csrc.nist.gov/News/2025/nist-releases-revision-to-sp-800-53-controls
- https://doi.org/10.6028/NIST.SP.800-53Ar5
- https://doi.org/10.6028/NIST.SP.800-53B
- https://github.com/usnistgov/oscal-content/tree/v1.6.0/nist.gov/SP800-53/rev5
annotations:
  cprt_framework_version: SP_800_53_5_2_0
  publication_date: 2025-08
  oscal_content_tag: v1.6.0
  oscal_content_commit: f0de6d8d8c059d374f15e0ae07508d82e370fc1d
comments:
- The version is the release of Revision 5 that the catalog carries, 5.2.0 of August 2025, and publication_date
  is that release's date; Revision 5 itself was published in September 2020 and updated in December 2020.
  source is the publication's digital object identifier. NIST's Cybersecurity and Privacy Reference Tool
  names the same release SP_800_53_5_2_0, and the catalog and the four baseline profiles NIST publishes
  for it in usnistgov/oscal-content are copied to src/nist_sp_800_53/schema/oscal-content/ at the tag
  and commit in the annotations. scripts/check_upstream_release.py reads the same pins and reports when
  NIST publishes a newer edition or changes a copied file. The release tags are the schema's own versions.
- SP 800-53, SP 800-53A and SP 800-53B are works of the United States Government and are not subject to
  copyright in the United States. The descriptions here are this project's own words; NIST's text of each
  control, parameter, objective and method stays in the catalog copy.
- NIST's catalog renders each family as an OSCAL group, each control and control enhancement as an OSCAL
  control, each statement, discussion, assessment objective and assessment method as a part, each organization-defined
  parameter as a parameter, each reference as a back-matter resource, and each baseline as a profile.
  The broad_mappings name those lmodel/oscal classes.
default_prefix: nist_sp_800_53
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  nist_sp_800_53: https://w3id.org/lmodel/nist-sp-800-53/
  oscal: https://w3id.org/lmodel/oscal/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
- linkml:types
- lokf
types:
  sp80053_family_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The two letters that name one of the twenty control families, such as AC for Access Control.
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)$
  sp80053_control_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A control''s identifier: its family''s letters, a hyphen and the control''s number within
      the family, such as AC-2.'
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)-[1-9][0-9]*$
  sp80053_enhancement_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'A control enhancement''s identifier: its control''s identifier and the enhancement''s
      number in parentheses, such as AC-2(1).'
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)-[1-9][0-9]*\([1-9][0-9]*\)$
  sp80053_control_or_enhancement_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The identifier of a control or of a control enhancement, such as AC-2 or AC-2(1), where
      the publication cites either.
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)-[1-9][0-9]*(\([1-9][0-9]*\))?$
  sp80053_withdrawal_target:
    typeof: string
    base: str
    uri: xsd:string
    description: 'Where a withdrawn control or enhancement was incorporated, as the publication names
      it: a control or enhancement, such as AC-2 or AC-2(1), one item of a control''s statement, such
      as AC-2k, or a whole family, such as SR.'
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)(-[1-9][0-9]*(\([1-9][0-9]*\))?([a-z](\.[1-9][0-9]*)*|\([a-z]\)(\([1-9][0-9]*\))*)?)?$
  sp80053_parameter_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'The identifier NIST''s catalog gives an organization-defined parameter, in lower case:
      the zero-padded control identifier, _odp and the parameter''s number, such as ac-02_odp.01, or,
      for a parameter that aggregates several, the control identifier, _prm_ and a number, such as ac-1_prm_1.'
    pattern: ^[a-z]{2}-[0-9]{2}(\.[0-9]{2})?_odp(\.[0-9]{2})?$|^[a-z]{2}-[1-9][0-9]*(\.[1-9][0-9]*)?_prm_[1-9][0-9]*$
slots:
  family_id:
    description: The family's two letters, such as AC for Access Control.
    range: sp80053_family_identifier
    required: true
  control_identifier:
    description: The control's identifier, such as AC-2.
    range: sp80053_control_identifier
    required: true
  enhancement_id:
    description: The enhancement's identifier, such as AC-2(1).
    range: sp80053_enhancement_identifier
    required: true
  baseline_level:
    description: Which of the four baselines this is.
    range: Sp80053BaselineLevel
    required: true
  control_statement:
    description: 'The control statement: what the control or enhancement requires, as one text, a lettered
      or numbered list of items, or both.'
    range: Sp80053Statement
    inlined: true
  control_discussion:
    description: 'The discussion that follows the statement: context and guidance that help apply the
      control, which the publication does not require.'
    comments:
    - Where the catalog links a control or a statement item inside the text, a derivation keeps the link's
      text, which is the identifier as the publication prints it, and where it links a reference, the
      reference's label in brackets.
  control_parameters:
    description: The organization-defined parameters the statement leaves to the organization, in the
      order the catalog gives them.
    range: Sp80053Parameter
    multivalued: true
    inlined: true
    inlined_as_list: true
  related_control_ids:
    description: The controls and enhancements the publication lists as related, by identifier.
    range: sp80053_control_or_enhancement_identifier
    multivalued: true
  control_references:
    description: The publications the control or enhancement cites, by the labels the catalog's references
      carry, such as SP 800-12 or OMB A-130.
    multivalued: true
    pattern: ^\s*\S
  assessment_objective:
    description: 'The assessment objective SP 800-53A gives the control or enhancement: the determination
      statements an assessor checks, nested as the statement''s items are.'
    range: Sp80053AssessmentObjective
    inlined: true
  assessment_methods:
    description: The assessment methods SP 800-53A gives the control or enhancement, each with the objects
      it is applied to.
    range: Sp80053AssessmentMethod
    multivalued: true
    inlined: true
    inlined_as_list: true
  control_status:
    description: The status the catalog gives a control or enhancement that Revision 5 withdrew. An active
      one carries none.
    range: Sp80053ControlStatus
  incorporated_into:
    description: For a withdrawn control or enhancement, what it was incorporated into, as the publication
      states it.
    range: sp80053_withdrawal_target
    multivalued: true
  moved_to:
    description: For a withdrawn control or enhancement, the control or enhancement it moved to, as the
      publication states it.
    range: sp80053_control_or_enhancement_identifier
    multivalued: true
  withdrawal_reason:
    description: For a withdrawn control or enhancement that the publication neither moved nor incorporated,
      what it says instead, such as that the enhancement is addressed through tailoring.
  implementation_level:
    description: 'Who implements the control or enhancement, as NIST''s reference data marks it: the organization,
      the system, or both.'
    range: Sp80053ImplementationLevel
    multivalued: true
  contributes_to_assurance:
    description: True where NIST's reference data marks the control or enhancement as one that contributes
      to assurance; absent otherwise.
    range: boolean
  statement_items:
    description: The lettered or numbered items of the statement, in order, each of which may hold items
      of its own.
    range: Sp80053StatementItem
    multivalued: true
    inlined: true
    inlined_as_list: true
classes:
  Sp80053Catalog:
    class_uri: nist_sp_800_53:Catalog
    description: 'One release of the control catalog as a whole: its families, each holding its controls
      and their enhancements, the baselines that select from them, and the publications the catalog lists.'
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    broad_mappings:
    - oscal:Catalog
    attributes:
      catalog_release:
        description: The release of Revision 5 the catalog carries, as NIST numbers it, such as 5.2.0.
        required: true
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      control_families:
        description: The twenty control families, in the order SP 800-53 gives them.
        range: Sp80053Family
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      control_baselines:
        description: The control baselines of SP 800-53B that select from the catalog.
        range: Sp80053Baseline
        multivalued: true
        inlined: true
        inlined_as_list: true
      catalog_references:
        description: The publications the catalog's references list, most of which a control cites.
        range: Sp80053Reference
        multivalued: true
        inlined: true
        inlined_as_list: true
  Sp80053Family:
    class_uri: nist_sp_800_53:Family
    description: One of the twenty families SP 800-53 sorts its controls into, such as Access Control
      or Supply Chain Risk Management.
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    broad_mappings:
    - oscal:Group
    slots:
    - family_id
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        range: string
    attributes:
      family_controls:
        description: The controls of the family. A knowledge bundle relates a control to its family with
          isPartOf instead.
        range: Sp80053Control
        multivalued: true
        inlined: true
        inlined_as_list: true
    is_a: Concept
  Sp80053Control:
    class_uri: nist_sp_800_53:Control
    description: 'A security or privacy control: a safeguard with an identifier, a statement of what it
      requires, a discussion, parameters the organization defines, related controls, references, the assessment
      objective and methods SP 800-53A gives it, and its enhancements. A control Revision 5 withdrew keeps
      its identifier and says where it went.'
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    broad_mappings:
    - oscal:Control
    slots:
    - control_identifier
    - title
    - control_statement
    - control_discussion
    - control_parameters
    - related_control_ids
    - control_references
    - assessment_objective
    - assessment_methods
    - control_status
    - incorporated_into
    - moved_to
    - withdrawal_reason
    - implementation_level
    - contributes_to_assurance
    slot_usage:
      title:
        required: true
        range: string
    attributes:
      control_enhancements:
        description: The control's enhancements. A knowledge bundle relates an enhancement to its control
          with isPartOf instead.
        range: Sp80053ControlEnhancement
        multivalued: true
        inlined: true
        inlined_as_list: true
    is_a: Concept
  Sp80053ControlEnhancement:
    class_uri: nist_sp_800_53:ControlEnhancement
    description: 'A control enhancement: added functionality or strength for a control, with an identifier
      of its own, which the publication and other documents cite apart from the control. It carries what
      a control carries, and names the control or enhancement it requires.'
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    broad_mappings:
    - oscal:Control
    slots:
    - enhancement_id
    - title
    - control_statement
    - control_discussion
    - control_parameters
    - related_control_ids
    - control_references
    - assessment_objective
    - assessment_methods
    - control_status
    - incorporated_into
    - moved_to
    - withdrawal_reason
    - implementation_level
    - contributes_to_assurance
    slot_usage:
      title:
        required: true
        range: string
    attributes:
      required_controls:
        description: 'The controls and enhancements that must be implemented for the enhancement to apply,
          as NIST''s catalog links them: its own control, and for SC-42(2) also SC-42(1).'
        range: sp80053_control_or_enhancement_identifier
        multivalued: true
    is_a: Concept
  Sp80053Statement:
    class_uri: nist_sp_800_53:Statement
    description: 'A control statement: the text of what a control or enhancement requires, and the items
      it is divided into.'
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    broad_mappings:
    - oscal:Part
    slots:
    - statement_items
    attributes:
      statement_text:
        description: 'The statement''s own text, before any items. A placeholder of the form {{ insert:
          param, <identifier> }} marks where an organization-defined parameter is inserted.'
  Sp80053StatementItem:
    class_uri: nist_sp_800_53:StatementItem
    description: One lettered or numbered item of a control statement, which may hold items of its own.
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    broad_mappings:
    - oscal:Part
    slots:
    - statement_items
    attributes:
      item_label:
        description: The item's label as the publication prints it, such as a., 1. or (a).
        required: true
        pattern: ^(([a-z]|[1-9][0-9]*)\.|\(([a-z]|[1-9][0-9]*)\))$
      item_text:
        description: The item's text, with the same placeholders for parameters as the statement's text.
        required: true
  Sp80053Parameter:
    class_uri: nist_sp_800_53:Parameter
    description: 'An organization-defined parameter: a value the control statement leaves to the organization,
      either an assignment the organization fills in or a selection from the choices the publication lists.
      SP 800-53A labels each parameter but the ones that aggregate others, and gives most a guideline.'
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-53Ar5
    broad_mappings:
    - oscal:Parameter
    attributes:
      parameter_id:
        description: The parameter's identifier in NIST's catalog, such as ac-02_odp.01.
        range: sp80053_parameter_identifier
        required: true
      assessment_label:
        description: The label SP 800-53A gives the parameter, such as AC-02_ODP[01]. A parameter that
          aggregates several has none.
        pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)-[0-9]{2}(\([0-9]{2}\)|\.[0-9]{2})?_ODP(\[[0-9]{2}\])?$
      parameter_label:
        description: For an assignment, what the organization defines, such as personnel or roles.
      parameter_guidelines:
        description: The guidelines that say what a value must settle, such as that the frequency of a
          review is defined.
        multivalued: true
      selection_choices:
        description: For a selection, the choices the publication lists, in order.
        multivalued: true
      selection_cardinality:
        description: For a selection, how many choices the organization picks. The catalog marks one or
          more, and leaves the slot out when one choice is allowed, which is how OSCAL reads an absent
          how-many.
        range: Sp80053SelectionCardinality
      aggregated_parameters:
        description: For a parameter that stands for several, the parameters it aggregates, by identifier.
        range: sp80053_parameter_identifier
        multivalued: true
      alternative_identifiers:
        description: The identifiers an earlier release of the catalog gave the parameter, such as ac-1_prm_2
          for ac-01_odp.03.
        range: sp80053_parameter_identifier
        multivalued: true
      alternative_label:
        description: The label SP 800-53 prints where it differs from the one SP 800-53A gives.
  Sp80053AssessmentObjective:
    class_uri: nist_sp_800_53:AssessmentObjective
    description: 'An assessment objective of SP 800-53A: a determination statement an assessor checks,
      or a heading that groups the determination statements of one item of the control statement.'
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-53Ar5
    broad_mappings:
    - oscal:Part
    attributes:
      objective_label:
        description: The label SP 800-53A gives the objective, such as AC-02a.[01].
        required: true
        pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)-[0-9]{2}(\([0-9]{2}\))?([a-z]\.([0-9]{2})?)?(\([a-z]\)(\([0-9]{2}\))?)?(\[[0-9]{2}\])*$
      objective_text:
        description: The determination statement, with the same placeholders for parameters as the control
          statement. A heading has none.
      sub_objectives:
        description: The objectives grouped under this one, in order.
        range: Sp80053AssessmentObjective
        multivalued: true
        inlined: true
        inlined_as_list: true
  Sp80053AssessmentMethod:
    class_uri: nist_sp_800_53:AssessmentMethod
    description: 'One assessment method SP 800-53A gives a control or enhancement, with the objects an
      assessor selects from: documents and records to examine, people to interview, or mechanisms and
      activities to test.'
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-53Ar5
    broad_mappings:
    - oscal:Part
    attributes:
      assessment_method:
        description: Which of the three methods this is.
        range: Sp80053AssessmentMethodKind
        required: true
      assessment_objects:
        description: The objects the method is applied to, in the order the publication lists them.
        required: true
        multivalued: true
        pattern: ^\s*\S
  Sp80053Reference:
    class_uri: nist_sp_800_53:Reference
    description: 'A publication the catalog''s references list, as they list it: its label, its citation
      and its address.'
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    broad_mappings:
    - oscal:Resource
    attributes:
      reference_label:
        description: The label the controls cite the publication by, such as SP 800-12.
        required: true
        pattern: ^\s*\S
      reference_citation:
        description: The citation, as the catalog prints it.
      reference_url:
        description: The address the catalog gives for the publication.
        range: uri
  Sp80053Baseline:
    class_uri: nist_sp_800_53:Baseline
    description: 'One of the four control baselines SP 800-53B defines: the controls and enhancements
      selected for systems at the low, moderate or high impact level, or for privacy.'
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-53B
    broad_mappings:
    - oscal:Profile
    slots:
    - baseline_level
    - title
    slot_usage:
      title:
        required: true
        range: string
    attributes:
      baseline_controls:
        description: The controls and enhancements the baseline selects, by identifier, in the order the
          catalog gives them.
        range: sp80053_control_or_enhancement_identifier
        required: true
        multivalued: true
    is_a: Concept
enums:
  Sp80053ControlStatus:
    description: 'The one status the catalog marks: withdrawn. A control or enhancement that Revision
      5 keeps carries no status.'
    permissible_values:
      WITHDRAWN:
        description: Revision 5 withdrew the control or enhancement; incorporated_into, moved_to or withdrawal_reason
          says where it went.
  Sp80053ImplementationLevel:
    description: Who implements a control or enhancement, as NIST's reference data marks it.
    permissible_values:
      ORGANIZATION:
        description: The organization implements it, through its processes and people.
      SYSTEM:
        description: The system implements it, through its mechanisms.
  Sp80053SelectionCardinality:
    description: How many of a selection's choices the organization picks.
    permissible_values:
      ONE:
        description: Exactly one choice, which the catalog leaves unwritten.
      ONE_OR_MORE:
        description: One or more choices, which the publication writes as Selection (one or more).
  Sp80053AssessmentMethodKind:
    description: The three assessment methods of SP 800-53A, as its catalog writes them.
    permissible_values:
      EXAMINE:
        description: Review, inspect, observe, study or analyze specifications, mechanisms or activities.
      INTERVIEW:
        description: Hold discussions with individuals or groups.
      TEST:
        description: Exercise mechanisms or activities under specified conditions.
  Sp80053BaselineLevel:
    description: The four control baselines SP 800-53B defines.
    permissible_values:
      LOW:
        description: The baseline for a low-impact system.
      MODERATE:
        description: The baseline for a moderate-impact system.
      HIGH:
        description: The baseline for a high-impact system.
      PRIVACY:
        description: The privacy baseline, which applies regardless of impact level.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: Sp80053Family, Sp80053Control, Sp80053ControlEnhancement,
  Sp80053Baseline; folded into LOKF''s: title -> title, description -> description.'

repos:
  - repo: local
    hooks:
      - id: validate-references
        name: Validate reference YAML files
        description: >
          Checks that every file in docs/_data/references/ conforms to the
          standard schema (title, description, entries). See
          docs/_data/references/README.md for the full schema definition.
        entry: python scripts/validate-references.py
        language: system
        files: ^docs/_data/references/.*\.yml$
        pass_filenames: false
      - id: validate-items
        name: Validate risk and mitigation fields
        description: >
          Checks that the type and domain of every risk and mitigation are
          keys in the labels maps in docs/_config.yml.
        entry: python scripts/validate-items.py
        language: system
        files: ^docs/(_risks/.*\.md|_mitigations/.*\.md|_config\.yml)$
        pass_filenames: false
